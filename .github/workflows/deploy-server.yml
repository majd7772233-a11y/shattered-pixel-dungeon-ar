name: Deploy Cloudflare Multiplayer Backend

on:
  push:
    branches:
      - master
      - main
      - multiplayer-framework-core-14118577486727081892
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Provision Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAGD_JWT_SECRET: ${{ secrets.MAGD_JWT_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ MAGD_JWT_SECRET: process.env.MAGD_JWT_SECRET }))' |
            npx --yes wrangler@4.165.0 secret bulk --name spd-multiplayer-backend --config wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 deploy --config wrangler.jsonc