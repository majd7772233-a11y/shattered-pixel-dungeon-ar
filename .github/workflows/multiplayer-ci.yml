name: Multiplayer Branch Validation

on:
  push:
    branches:
      - multiplayer-framework-core-14118577486727081892
    paths:
      - 'core/**'
      - 'android/**'
      - 'server/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - '.github/workflows/multiplayer-ci.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'android/**'
      - 'server/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - '.github/workflows/multiplayer-ci.yml'

permissions:
  contents: read

jobs:
  server:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Backend tests
        run: npm test

  android:
    name: Android debug APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Compile debug APK
        run: ./gradlew assembleDebug --no-daemon
