levels.sewerlevel.region_deco_desc=برميل متين يكاد يكون بحجمك. لا بد أنه ممتلئ بشيء ما، فهو ثقيل جدًا بحيث لا يمكن تحريكه.

levels.vaultlevel$vaultflametrap.name=فتحة لهب القبو
levels.vaultlevel$vaultflametrap.desc=يبدو أن هذه الفتحة تطلق ألسنة لهب خضراء على فترات محددة. _وبما أن هذه مجرد منطقة اختبار، فإن اللهب الخارج من الفتحات لن يؤذيك فعليًا._