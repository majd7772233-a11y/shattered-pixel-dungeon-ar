levels.prisonlevel.region_deco_desc=قفص معدني كبير بما يكفي لاحتجاز شخص. يبدو أنه مثبت في الأرض بطريقة ما، ولا يمكنك تحريكه.
levels.prisonlevel.region_deco_alt_name=قفص معلق
levels.prisonlevel.region_deco_alt_desc=قفص معدني كبير بما يكفي لاحتجاز شخص. إنه معلق فوق هاوية عميقة بواسطة سلسلة.

