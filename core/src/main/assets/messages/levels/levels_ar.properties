###features
levels.features.chasm.chasm=هاوية
levels.features.chasm.yes=نعم، أعرف ما أفعله
levels.features.chasm.no=لا، لقد غيرت رأيي
levels.features.chasm.jump=هل تريد حقًا القفز إلى الهاوية؟ السقوط من هذا الارتفاع سيكون مؤلمًا.
levels.features.chasm.ondeath=لقد سقطت حتى الموت...
levels.features.chasm.rankings_desc=مات عند الاصطدام


###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=يوجد هنا جدار من نار خضراء زاهية وكثيفة، يبدو أنه ناتج عن السحر. إنها كثيفة جدًا لدرجة أنك لا تستطيع المرور عبرها، كما أنها تشعل أي شيء يقترب منها كثيرًا. ولا تظهر عليها أي علامات تدل على أنها ستنطفئ طبيعيًا، لذا ستحتاج إلى استخدام شيء لإخمادها.

levels.rooms.special.sentryroom$sentry.name=حارس أحمر
levels.rooms.special.sentryroom$sentry.desc=يبدو أن هذا الحارس الأحمر الدموي موضوع هنا لحراسة الكنز الموجود في الطرف الآخر من هذه الغرفة. سيطلق عليك أشعة من سحر التفكيك إذا دخلت إلى المنطقة التي يحرسها.\n\nإنه محصّن ضد جميع التأثيرات الضارة ويمكنه الرؤية عبر الاختفاء، لكنه يبدو بحاجة إلى بعض الوقت لشحن طاقته قبل أن يبدأ بإطلاق النار.\n\nلسبب ما، لا يريد هذا الحارس إطلاق النار إلا عليك، وكأنه يعرف أن سكان الزنزانة لا يشكلون تهديدًا للكنز.
levels.rooms.special.sentryroom$sentry.discover_hint=يمكنك العثور على هذا العدو في أي مكان في الزنزانة.

levels.rooms.special.toxicgasroom$toxicvent.name=فتحة غاز سام
levels.rooms.special.toxicgasroom$toxicvent.desc=لا بد أن مغامرًا مهملاً فعّل هذا الفخ منذ زمن بعيد. وعلى الرغم من كونه غير نشط، فإنه لا يزال يطلق الغاز السام في الغرفة ولا تظهر عليه أي علامات تدل على أنه سيتوقف. ستحتاج إلى وسيلة تمنع ضرر الغاز إذا أردت استكشاف هذه الغرفة.

levels.rooms.special.weakfloorroom$hiddenwell.name=بئر بعيد
levels.rooms.special.weakfloorroom$hiddenwell.desc=يمكنك بالكاد تمييز بئر في الأعماق بالأسفل، لعل هناك شيئًا ما في الأسفل؟

levels.rooms.quest.ambitiousimproom$questentrance.name=مدخل القبو
levels.rooms.quest.ambitiousimproom$questentrance.desc=تبدو هذه الحفرة المشؤومة كأنها مدخل إلى قبو قديم للأقزام. يوجد حاجز سحري يمنع الدخول، لكن يمكنك المشي فوقه كما لو كانت هناك أرضية هنا.

levels.rooms.quest.blacksmithroom$questentrance.name=مدخل المنجم
levels.rooms.quest.blacksmithroom$questentrance.desc=يؤدي هذا السلم إلى منجم قديم يقع أسفل ورشة الحداد مباشرةً.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=علامة طقوس
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=علامة مرسومة لطقس مظلم ما. عادةً ما توضع الشموع عند الزوايا الأربع.

levels.rooms.quest.massgraveroom$bones.name=مقبرة جماعية
levels.rooms.quest.massgraveroom$bones.desc=العظام متناثرة على الأرض، ماذا حدث هنا؟

levels.rooms.quest.mineentrance$questexit.name=مخرج المنجم
levels.rooms.quest.mineentrance$questexit.desc=يؤدي هذا السلم إلى خارج المنجم، عائدًا إلى ورشة الحداد.


###traps
levels.traps.alarmtrap.name=فخ الإنذار
levels.traps.alarmtrap.alarm=يطلق الفخ صوتًا حادًا يتردد صداه في جميع أنحاء الزنزانة!
levels.traps.alarmtrap.desc=يبدو أن هذا الفخ متصل بآلية إنذار عالية الصوت. ومن المرجح أن يؤدي تفعيله إلى تنبيه جميع الكائنات الموجودة في هذا المستوى.

levels.traps.blazingtrap.name=فخ اللهب
levels.traps.blazingtrap.desc=سيؤدي الدوس على هذا الفخ إلى إشعال خليط كيميائي قوي، مما يشعل منطقة واسعة بالنيران.

levels.traps.burningtrap.name=فخ الاحتراق
levels.traps.burningtrap.desc=سيؤدي الدوس على هذا الفخ إلى إشعال خليط كيميائي، مما يشعل المنطقة المحيطة بالنيران.

levels.traps.chillingtrap.name=فخ التبريد
levels.traps.chillingtrap.desc=عند تفعيله، ستعمل المواد الكيميائية الموجودة في هذا الفخ على تجميد الهواء بسرعة حول موقعه.

levels.traps.confusiontrap.name=فخ غاز التشويش
levels.traps.confusiontrap.desc=سيؤدي تفعيل هذا الفخ إلى إطلاق سحابة من غاز التشويش في المنطقة القريبة.

levels.traps.cursingtrap.name=فخ اللعنة
levels.traps.cursingtrap.curse=أصبحت معداتك التي ترتديها ملعونة!
levels.traps.cursingtrap.desc=يحتوي هذا الفخ على السحر الخبيث نفسه الموجود في المعدات الملعونة. سيؤدي تفعيله إلى لعن بعض العناصر الموجودة في المنطقة القريبة.

levels.traps.disarmingtrap.name=فخ نزع السلاح
levels.traps.disarmingtrap.disarm=تم نقل سلاحك آنيًا بعيدًا!
levels.traps.disarmingtrap.desc=يحتوي هذا الفخ على سحر انتقال آني محدد للغاية، ينقل سلاح ضحيته إلى موقع آخر.

levels.traps.disintegrationtrap.name=فخ التفكيك
levels.traps.disintegrationtrap.one=قام الفخ بتفكيك %s الخاص بك!
levels.traps.disintegrationtrap.some=قام الفخ بتفكيك بعض %s الخاصة بك!
levels.traps.disintegrationtrap.ondeath=لقد قتلك فخ التفكيك...
levels.traps.disintegrationtrap.desc=عند تفعيله، سيطلق هذا الفخ أشعة تفكيك على أقرب هدف، مسببًا ضررًا كبيرًا ومدمرًا للعناصر.\n\nلحسن الحظ، فإن آلية التفعيل ليست مخفية.

levels.traps.distortiontrap.name=فخ التشويه
levels.traps.distortiontrap.desc=صُنع هذا الفخ من سحر غريب مجهول المصدر، وسيستدعي جميع أنواع المخلوقات إلى هذا الموقع.

levels.traps.explosivetrap.name=فخ متفجر
levels.traps.explosivetrap.desc=يحتوي هذا الفخ على بعض المتفجرات المسحوقة وآلية تفعيل. سيؤدي تفعيله إلى حدوث انفجار في المنطقة القريبة.

levels.traps.flashingtrap.name=فخ الوميض
levels.traps.flashingtrap.desc=عند تفعيله، سيشعل هذا الفخ مسحوق وميض قويًا مخزنًا بداخله، مما يؤدي مؤقتًا إلى إصابة ضحيته بالعمى وإعاقتها وإيذائها.\n\nلا بد أن الفخ يحتوي على كمية كبيرة من المسحوق، لأنه يمكنه التفعيل مرات عديدة دون أن ينكسر.

levels.traps.flocktrap.name=فخ القطيع
levels.traps.flocktrap.desc=ربما تكون هذه مزحة من ساحر مبتدئ؛ فعند تفعيل هذا الفخ سيُنشئ قطيعًا من الخراف السحرية.

levels.traps.frosttrap.name=فخ الصقيع
levels.traps.frosttrap.desc=عند تفعيله، ستعمل المواد الكيميائية الموجودة في هذا الفخ على تجميد الهواء بسرعة في نطاق واسع حول موقعه.

levels.traps.gatewaytrap.name=فخ البوابة
levels.traps.gatewaytrap.desc=يمكن لفخ الانتقال الآني الخاص هذا أن يتفعّل عددًا لا نهائيًا من المرات، ودائمًا ما ينقل إلى الموقع نفسه.

levels.traps.geysertrap.name=فخ النافورة
levels.traps.geysertrap.desc=عند تفعيله، سيتسبب هذا الفخ في اندفاع نافورة من الماء، مما يلحق الضرر بالأعداء المشتعلين، ويدفع جميع الشخصيات القريبة بعيدًا، ويطفئ النيران، ويحوّل التضاريس المحيطة إلى ماء.

levels.traps.gnollrockfalltrap.name=فخ تساقط الصخور الخاص بالنوول
levels.traps.gnollrockfalltrap.desc=صُنع فخ تساقط الصخور هذا بمساعدة نوع من السحر. عند تفعيله، سيتسبب في تفكك الصخور وسقوطها فورًا من الأعلى في مساحة 5x5 حوله. وبسبب ليونة الصخور في هذه المنطقة، لن يسبب ضررًا كبيرًا مثل فخ تساقط الصخور العادي، لكن درعك لن يكون فعالًا ضده أيضًا. كما لن تسقط الصخور في المواقع المجاورة لحاجز، لأن الحاجز يساعد على دعم السقف.\n\n_هذا الفخ لا يستطيع التمييز بين الصديق والعدو، ولذلك فهو مؤذٍ للنوول بقدر ما هو مؤذٍ لك._

levels.traps.grimtrap.name=فخ قاتم
levels.traps.grimtrap.ondeath=لقد قتلك انفجار فخ قاتم...
levels.traps.grimtrap.desc=يحتوي هذا الفخ على سحر تدميري قوي للغاية، يكفي لقتل جميع الأبطال الأصحاء فورًا. سيؤدي تفعيله إلى إطلاق انفجار بعيد المدى من السحر القاتل نحو أقرب شخصية.\n\nلحسن الحظ، فإن آلية التفعيل ليست مخفية.

levels.traps.grippingtrap.name=فخ الإمساك
levels.traps.grippingtrap.desc=يتشبث هذا الفخ بقدمي أي شخص يفعّله، مما يلحق به الضرر ويبطئ حركته.\n\nوبسبب طبيعته البسيطة، يمكن لهذا الفخ أن يتفعّل مرات عديدة دون أن ينكسر.

levels.traps.guardiantrap.name=فخ الحارس
levels.traps.guardiantrap.alarm=يطلق الفخ صوتًا حادًا يتردد صداه في جميع أنحاء الزنزانة!
levels.traps.guardiantrap.desc=هذا الفخ مرتبط بآلية سحرية غريبة تستدعي الحراس وتنبه جميع الأعداء الموجودين في الطابق.
levels.traps.guardiantrap$guardian.name=حارس مستدعى
levels.traps.guardiantrap$guardian.desc=يبدو هذا الطيف الأزرق كأنه صدى مستدعى لأحد حراس الزنزانة الحجريين.
levels.traps.guardiantrap$guardian.desc_weapon=مع أن التمثال نفسه شبه غير مادي، فإن _%s_ الذي يحمله يبدو حقيقيًا.
levels.traps.guardiantrap$guardian.discover_hint=يمكنك العثور على هذا العدو من خلال فخ محدد.

levels.traps.oozetrap.name=فخ الوحل
levels.traps.oozetrap.desc=يقذف هذا الفخ وحلًا كاوياً عند تفعيله، وسيستمر في حرقك حتى يتم غسله.

levels.traps.pitfalltrap.name=فخ الحفرة
levels.traps.pitfalltrap.triggered_hero=تبدأ الأرض بالانهيار من حولك!
levels.traps.pitfalltrap.triggered=تبدأ الأرض بالانهيار حول الفخ الذي تم تفعيله!
levels.traps.pitfalltrap.no_pit=الأرض صلبة جدًا لدرجة أن فخ الحفرة لا يمكنه العمل هنا.
levels.traps.pitfalltrap.desc=هذا الفخ متصل بآلية باب أرضي كبيرة، وبعد فترة قصيرة من تفعيله، سينزلق أي شيء قريب منه عبر الأرض ويسقط! لكنه لن يعمل في المناطق ذات الأرضيات شديدة الصلابة.

levels.traps.poisondarttrap.name=فخ السهام السامة
levels.traps.poisondarttrap.ondeath=لقد قتلك فخ السهام السامة...
levels.traps.poisondarttrap.desc=لا بد أن منفاخ سهام صغيرًا مخفيًا في مكان قريب؛ فعند تفعيل هذا الفخ، سيطلق سهمًا مسمومًا على أقرب هدف.\n\nلحسن الحظ، فإن آلية التفعيل ليست مخفية.

levels.traps.rockfalltrap.name=فخ تساقط الصخور
levels.traps.rockfalltrap.ondeath=لقد سحقتك الصخور المتساقطة من الفخ...
levels.traps.rockfalltrap.desc=هذا الفخ متصل بسلسلة من الصخور غير المستقرة فوقه، وسيؤدي تفعيله إلى انهيارها على الغرفة بأكملها! وإذا لم يكن الفخ موجودًا في غرفة محددة، فسوف تسقط الصخور في المنطقة المحيطة بالفخ بدلًا من ذلك.\n\nلحسن الحظ، فإن آلية التفعيل ليست مخفية.

levels.traps.shockingtrap.name=فخ الصدمة
levels.traps.shockingtrap.desc=آلية تخزن كمية كبيرة من الطاقة. سيؤدي تفعيل هذا الفخ إلى إطلاق تلك الطاقة في مجال يحيط به.

levels.traps.stormtrap.name=فخ العاصفة
levels.traps.stormtrap.desc=آلية تخزن كمية هائلة من الطاقة. سيؤدي تفعيل هذا الفخ إلى إطلاق تلك الطاقة في عاصفة كهربائية كبيرة.

levels.traps.summoningtrap.name=فخ الاستدعاء
levels.traps.summoningtrap.desc=سيؤدي تفعيل هذا الفخ إلى استدعاء عدد من وحوش هذه المنطقة إلى هذا الموقع.

levels.traps.teleportationtrap.name=فخ الانتقال الآني
levels.traps.teleportationtrap.desc=عند تفعيل هذا الفخ، سيتم نقل كل شيء من حوله آنيًا إلى مواقع عشوائية في هذا الطابق.

levels.traps.tengudarttrap.desc=من الواضح أن تينغو كان يستعد للقتال. سيؤدي هذا الفخ إلى تفعيل منفاخ سهام مخفي يطلق سهمًا مسمومًا على أقرب شيء ليس تينغو.\n\nالفخ مصنوع بإتقان شديد لدرجة أن آلية تفعيله يستحيل اكتشافها دون مساعدة سحرية. ومع ذلك، يظهر الفخ للحظة أثناء تجهيزه.

levels.traps.toxictrap.name=فخ الغاز السام
levels.traps.toxictrap.desc=سيؤدي تفعيل هذا الفخ إلى إطلاق سحابة من الغاز السام في المنطقة المحيطة.

levels.traps.trap.discover_hint=يمكنك العثور على هذا الفخ عشوائيًا في الزنزانة. لكل منطقة أفخاخ مختلفة يمكن أن تظهر فيها.
levels.traps.trap.rankings_desc=قُتل بواسطة: %s

levels.traps.corrosiontrap.name=فخ الغاز الأكّال
levels.traps.corrosiontrap.desc=سيؤدي تفعيل هذا الفخ إلى إطلاق سحابة من الغاز الحمضي القاتل في المنطقة القريبة.

levels.traps.warpingtrap.name=فخ التشويه الآني
levels.traps.warpingtrap.desc=يشبه هذا الفخ فخ الانتقال الآني، لكنه سيتسبب أيضًا في فقدان البطل معرفته بتخطيط الطابق!

levels.traps.weakeningtrap.name=فخ الإضعاف
levels.traps.weakeningtrap.desc=يمتص السحر المظلم الموجود في هذا الفخ الطاقة من أي شيء يلامسه. ومع ذلك، قد تقاوم الأعداء الأقوياء هذا التأثير.

levels.traps.worndarttrap.name=فخ السهام المتهالك
levels.traps.worndarttrap.ondeath=لقد قتلك فخ السهام المتهالك...
levels.traps.worndarttrap.desc=لا بد أن منفاخ سهام صغيرًا مخفيًا في مكان قريب؛ فعند تفعيل هذا الفخ، سيطلق سهمًا على أقرب هدف.\n\nوبسبب قدمه، فهو ليس ضارًا جدًا، بل إنه غير مخفي حتى...



###levels
levels.cavesbosslevel.wires_name=أسلاك مكشوفة
levels.cavesbosslevel.wires_desc=الأرض محفورة جزئيًا هنا، مما يُظهر بعض الأسلاك الكبيرة المكشوفة. لا بد أنها تصل بين الآلات الكهربائية المختلفة.\n\nلا بد أن تيارًا كهربائيًا يمر عبر هذه الأسلاك. إذا وقف DM-300 هنا، فقد يتمكن من سحب الطاقة منها.

levels.cavesbosslevel.energy_desc=تتطاير شرارات الكهرباء من الأرض هنا، ومن المؤذي الوقوف عليها. _يبدو أن الشرارات تتحرك في اتجاه معين..._ ربما تقود إلى مصدر الطاقة؟

levels.cavesbosslevel.gate_name=بوابة معدنية
levels.cavesbosslevel.gate_desc=بوابة معدنية كبيرة تسد الطريق إلى مدينة الأقزام. الصندوق المعدني في المنتصف يصدر طنينًا عاليًا، ولا بد أنه متصل بالدوائر والآلات القريبة. ربما سيؤدي تدمير DM-300 إلى فتح البوابة؟

levels.cavesbosslevel.gate_desc_broken=لا بد أن البوابة كانت متصلة بـ DM-300 بطريقة ما، لأنها انفجرت عندما هُزم DM-300. لم يتبق الآن سوى قطع مكسورة.

levels.cavesbosslevel.water_desc=مع وجود كل هذه الكهرباء حولك، قد لا يكون الماء آمنًا دائمًا...

levels.citybosslevel.throne_name=عرش
levels.citybosslevel.throne_desc=هذا العرش الضخم والمثير للإعجاب هو مقر إمبراطورية الأقزام، وقد استولى عليه الآن مستحضر أرواح مهووس بالقوة.\n\nيبدو أن العرش يحتوي على أجزاء سحرية أو ميكانيكية، وقد يحصل ملك الأقزام على قوة إضافية أثناء جلوسه عليه.

levels.citybosslevel.summoning_name=منصة الاستدعاء
levels.citybosslevel.summoning_desc=تحتوي هذه المنصة على فتحة كبيرة في الوسط، تشع منها الطاقة المظلمة بشكل شبه واضح.\n\nيستخدم ملك الأقزام هذه المنصات كنقاط تركيز لسحره الخاص باستحضار الأرواح، ويمكنه استدعاء أتباعه إليها. تحتاج المنصة إلى عدة أدوار لشحن طاقتها قبل ظهور التابع، ويحدد شكل الطاقة السحرية المتجمعة نوع التابع الذي سيتم استدعاؤه.

levels.caveslevel.grass_name=طحلب فلوري
levels.caveslevel.high_grass_name=فطر فلوري
levels.caveslevel.water_name=ماء شديد البرودة
levels.caveslevel.entrance_desc=يؤدي السلم إلى العمق الأعلى.
levels.caveslevel.exit_desc=يؤدي السلم إلى العمق الأدنى.
levels.caveslevel.high_grass_desc=تحجب الفطريات الضخمة الرؤية.
levels.caveslevel.wall_deco_desc=يمكن رؤية عِرق من خام ما على الجدار. ذهب؟
levels.caveslevel.bookshelf_desc=من قد يحتاج إلى رف كتب في كهف؟
levels.caveslevel.region_deco_name=هيكل معدني
levels.caveslevel.region_deco_desc=هيكل كبير مصنوع بالكامل من المعدن، من المحتمل أن الأقزام بنوه عندما كانوا يستخرجون المعادن من هذا المكان. تظن أنك تستطيع رؤية آثار لعربات مناجم قديمة مهجورة منذ زمن طويل تمتد على طول الجزء العلوي.

levels.citylevel.water_name=ماء ذو لون مريب
levels.citylevel.high_grass_name=زهور متفتحة طويلة
