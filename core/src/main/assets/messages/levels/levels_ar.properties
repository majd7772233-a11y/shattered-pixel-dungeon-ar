levels.citylevel.upcoming_quest_intro_title=رسالة المطور
levels.citylevel.upcoming_quest_intro_body=سيشهد التحديث الرئيسي القادم لـ Shattered Pixel Dungeon إعادة تصميم لمهمة الـImp الطموح! ستكلفك هذه المهمة بمداهمة قبو قديم للأقزام، وأنت تقف حاليًا فوق مدخله.\n\nحاليًا، منطقة المهمة الجديدة فارغة إلى حد كبير، لكن يمكنك النزول وإلقاء نظرة حولك، سواء لاختبار المنطقة الجديدة أو لتقديم ملاحظات مبكرة!\n\nإحدى آليات المهمة هي أن أياً من أغراضك لن يأتي معك، لذا عند النزول ستفقد أغراضك مؤقتًا، _وستُعطى بلورة هروب تسمح لك بالعودة._ كما سيتم إيقاف تأثيرات الجوع وتجدد الصحة مؤقتًا.\n\n- Evan

