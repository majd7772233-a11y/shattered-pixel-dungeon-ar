levels.mininglevel.wall_desc=جدار صخري أملس لكنه أكثر ليونة قليلًا من المعتاد. يمكنك الحفر خلاله باستخدام فأسك، لكن ذلك سيتطلب بعض الجهد وسيزيد من شعورك بالجوع قليلًا.
levels.mininglevel.gold_extra_desc=يمكنك على الأرجح استخراجه باستخدام فأسك.
levels.mininglevel.crystal_name=شوكة بلورية
levels.mininglevel.boulder_name=صخرة ضخمة
levels.mininglevel.crystal_desc=يوجد هنا نتوء بلوري كبير وملون. هذه البلورات هشة ويمكن كسرها بسهولة بفأس، أو ستنكسر إذا تم التنقيب بجانبها.
levels.mininglevel.boulder_desc=هناك صخرة ضخمة تسد الطريق. ينبغي أن يكون من السهل نسبيًا كسرها باستخدام فأس.
levels.mininglevel.barricade_desc=الحاجز الخشبي مثبت بإحكام ويعمل كدعامة للسقف.\n\nمن المحتمل أن النوول هم من بنوه لتوفير بعض الحماية من الصخور المتساقطة. _ستكون الخلايا المجاورة محمية من أفخاخ وهجمات تساقط الصخور._\n\nويبدو أنه سيحترق جيدًا مثل أي حاجز آخر.

