items.wands.cursedwand.mass_invuln=ينفجر من عصاك ضوء ساطع!
items.wands.cursedwand.petrify=تتجمد فجأة في مكانك!
items.wands.cursedwand.grass=ينفجر العشب من حولك!
items.wands.cursedwand.fire=تشتم رائحة شيء يحترق...
items.wands.cursedwand.transmogrify_wand=تتحول عصاك إلى عنصر مختلف!
items.wands.cursedwand.transmogrify_other=يتحول عنصرك إلى شيء مختلف!
items.wands.cursedwand.disguise=يتغير مظهرك أمام عينيك!
items.wands.cursedwand.supernova=تبدأ كرة من الطاقة المشتعلة في النمو. ربما من الأفضل أن تهرب!
items.wands.cursedwand.supernova_positive=تبدأ كرة من الطاقة المشتعلة في النمو، لكنها تبدو آمنة بطريقة ما.
items.wands.cursedwand.sinkhole=تبدأ الأرض بالانهيار من حولك!
items.wands.cursedwand.sinkhole_positive=تبدأ الأرض بالانهيار، لكنها تبدو صلبة بما يكفي تحت قدميك.
items.wands.cursedwand.gravity=تبدأ الجاذبية فجأة بالسحب في اتجاهات عشوائية!
items.wands.cursedwand.gravity_positive=تبدأ الجاذبية فجأة بالسحب في اتجاهات عشوائية، لكن يبدو أن ذلك لا يؤثر فيك.
items.wands.cursedwand.gravity_end=تنتهي فوضى الجاذبية.

items.wands.damagewand.upgrade_stat_name_1=الضرر السحري

items.wands.wand.ac_zap=إطلاق
items.wands.wand.fizzles=تُصدر عصاك أزيزًا وتخفق؛ يبدو أنها لا تملك شحنة كافية.
items.wands.wand.no_magic=تُصدر عصاك أزيزًا وتخفق؛ لا يمكنك استخدام العصي أثناء امتلاكك مناعة ضد السحر.
items.wands.wand.self_target=لا يمكنك استهداف نفسك!
items.wands.wand.identify=أصبحت الآن معتادًا بما يكفي على عصاك لتتمكن من تحديد ماهيتها.
items.wands.wand.resin_one=اكتسبت هذه العصا _مستوى واحدًا_ من الراتنج الغامض.
items.wands.wand.resin_many=اكتسبت هذه العصا _%d مستويات_ من الراتنج الغامض.
items.wands.wand.cursed=هذه العصا ملعونة، مما يجعل سحرها فوضويًا وعشوائيًا.
items.wands.wand.not_cursed=هذه العصا خالية من السحر الخبيث.
items.wands.wand.curse_discover=هذه الـ%s ملعونة!
items.wands.wand.prompt=اختر موقعًا للإطلاق عليه
items.wands.wand$placeholder.name=عصا سحرية

items.wands.wandofblastwave.name=عصا الموجة الانفجارية
items.wands.wandofblastwave.staff_name=عصا الموجة الانفجارية
items.wands.wandofblastwave.ondeath=قتلت نفسك بعصا الموجة الانفجارية الخاصة بك...
items.wands.wandofblastwave.knockback_ondeath=قتلك الاصطدام...
items.wands.wandofblastwave.desc=هذه العصا مصنوعة من نوع من الحجر الرخامي، مع حواف ذهبية وحجر كريم أسود مستدير في طرفها. تشعر بثقلها الشديد في يدك.
items.wands.wandofblastwave.typical_stats_desc=تطلق هذه العصا مقذوفًا ينفجر بعنف عند موقع مستهدف. وعادةً ما تلحق قوة هذا الانفجار _%1$d-%2$d من الضرر_، وهي قوية بما يكفي لقذف معظم الأعداء بعيدًا.
items.wands.wandofblastwave.stats_desc=تطلق هذه العصا مقذوفًا ينفجر بعنف عند موقع مستهدف. وتلحق قوة هذا الانفجار _%1$d-%2$d من الضرر_، وهي قوية بما يكفي لقذف معظم الأعداء بعيدًا.
items.wands.wandofblastwave.upgrade_stat_name_2=الدفع للخلف
items.wands.wandofblastwave.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا مشلولًا بعصا الموجة الانفجارية، فإنها تستهلك الشلل لإلحاق دفعة من الضرر السحري الإضافي. ولهذا التأثير فترة تهدئة قصيرة لكل عدو.
items.wands.wandofblastwave.eleblast_desc=انفجار عنصري باستخدام عصا الموجة الانفجارية يلحق 67%% من الضرر ويدفع جميع الأعداء خارج منطقة الانفجار.

items.wands.wandofcorrosion.name=عصا التآكل
items.wands.wandofcorrosion.staff_name=عصا التآكل
items.wands.wandofcorrosion.desc=لهذه العصا جسم بلون الرماد ينفتح على حجر كريم برتقالي ساطع.
items.wands.wandofcorrosion.stats_desc=تطلق هذه العصا مقذوفًا ينفجر في سحابة من الغاز شديد التآكل في موقع مستهدف. وسيتلقى كل من يقع داخل هذه السحابة ضررًا متزايدًا بمرور الوقت، يبدأ من _%d من الضرر._
items.wands.wandofcorrosion.upgrade_stat_name_1=ضرر التآكل
items.wands.wandofcorrosion.upgrade_stat_name_2=حجم الغاز
items.wands.wandofcorrosion.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا التآكل، فهناك احتمال أن يصاب العدو بتأثير الوحل.
items.wands.wandofcorrosion.eleblast_desc=انفجار عنصري باستخدام عصا التآكل يصيب الأعداء بتآكل لمدة 4 أدوار، يبدأ من 6 نقاط من الضرر.

items.wands.wandofcorruption.name=عصا الإفساد
items.wands.wandofcorruption.staff_name=عصا الإفساد
items.wands.wandofcorruption.already_corrupted=لا يمكن التأثير في هذه الشخصية أكثر من ذلك.
items.wands.wandofcorruption.desc=تشع هذه العصا بطاقة سوداء فوضوية، وهذا واضح بالفعل من الجمجمة الزخرفية الصغيرة التي تشكلت في طرفها.
items.wands.wandofcorruption.stats_desc=تطلق هذه العصا انفجارًا من طاقة الإفساد يصيب الأعداء بتأثيرات سلبية، وفي النهاية يجعلهم خاضعين لإرادتك. ويمكن للأعداء مقاومة الإفساد، لكن إفساد الأعداء الضعفاء أسهل بكثير من إفساد الأعداء الأصحاء.
items.wands.wandofcorruption.upgrade_stat_name_1=قوة الإفساد
items.wands.wandofcorruption.upgrade_stat_name_2=مدة التأثير السلبي
items.wands.wandofcorruption.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا الإفساد، فهناك احتمال أن يصاب العدو بالهياج.
items.wands.wandofcorruption.eleblast_desc=انفجار عنصري باستخدام عصا الإفساد يصيب الأعداء بالهياج لمدة 5 أدوار.

items.wands.wandofdisintegration.name=عصا التفكك
items.wands.wandofdisintegration.staff_name=عصا التفكك
items.wands.wandofdisintegration.desc=هذه العصا مصنوعة من قطعة صلبة وملساء من حجر السج، يتوهج على جانبها ضوء أرجواني داكن يمتد حتى طرفها. وهي تتوهج بالطاقة التدميرية، بانتظار إطلاقها إلى الأمام.
items.wands.wandofdisintegration.stats_desc=تطلق هذه العصا شعاعًا يخترق أي عائق، ويزداد مداه كلما تمت ترقيتها. ويلحق الشعاع _%1$d-%2$d من الضرر،_ كما يلحق ضررًا إضافيًا مقابل كل عدو وكل جدار يخترقه.
items.wands.wandofdisintegration.upgrade_stat_name_2=المدى الأقصى
items.wands.wandofdisintegration.bmage_desc=عند استخدام _ساحر المعركة_ لها، تمتلك عصا التفكك مدى هجوم متزايد، كما لو كانت تحمل تعويذة الإسقاط.
items.wands.wandofdisintegration.eleblast_desc=انفجار عنصري باستخدام عصا التفكك يلحق 100%% من الضرر ويخترق الجدران.

items.wands.wandoffireblast.name=عصا الانفجار الناري
items.wands.wandoffireblast.staff_name=عصا الانفجار الناري
items.wands.wandoffireblast.desc=صُنعت هذه العصا من خشب مطلي باللون الأحمر، وزُينت بسخاء بأوراق ذهبية لتبدو فخمة وملكية. تتصاعد منها فرقعة وهسيس عند طرفها، وكأنها متلهفة لإطلاق سحرها القوي.
items.wands.wandoffireblast.stats_desc=تطلق هذه العصا مخروطًا من النار عند استخدامها. سيستهلك هجومها التالي _%1$d من الشحنات_ ويلحق _%2$d-%3$d من الضرر._ وكلما زاد عدد الشحنات التي تستهلكها العصا، ازداد حجم التأثير وقوته.
items.wands.wandoffireblast.upgrade_stat_name_1=ضرر شحنة واحدة
items.wands.wandoffireblast.upgrade_stat_name_2=ضرر شحنتين
items.wands.wandoffireblast.upgrade_stat_name_3=ضرر 3 شحنات
items.wands.wandoffireblast.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا الانفجار الناري، فهناك احتمال أن تُحدث انفجارًا يلحق الضرر بالأعداء ويستهلك كل النار القريبة! وتزداد هذه الاحتمالية كلما زادت كمية النار الملاصقة للعدو.
items.wands.wandoffireblast.eleblast_desc=انفجار عنصري باستخدام عصا الانفجار الناري يلحق 100%% من الضرر، ويفتح الأبواب بالقوة، ويشعل الأعداء والتضاريس بالنار.

items.wands.wandoffrost.name=عصا الصقيع
items.wands.wandoffrost.staff_name=عصا الصقيع
items.wands.wandoffrost.desc=يبدو أن هذه العصا مصنوعة من نوع من الجليد السحري. ويزداد لمعانها كلما اقتربت من طرفها المستدير. تشعر ببرودتها الشديدة عند إمساكها، لكن يدك تظل دافئة بطريقة ما.
items.wands.wandoffrost.stats_desc=تطلق هذه العصا دفعات من الطاقة الجليدية نحو أعدائك، ملحقة _%1$d-%2$d من الضرر_ ومسببة البرد. ويبدو أن تأثيرها أقوى في الماء. ويتلقى الأعداء الذين أصيبوا بالبرد أو التجمد بالفعل ضررًا أقل من هذه العصا.
items.wands.wandoffrost.upgrade_stat_name_2=مدة البرد
items.wands.wandoffrost.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا مصابًا بالبرد بعصا الصقيع، فهناك احتمال أن يتجمد العدو فورًا. وتزداد هذه الاحتمالية كلما اشتد البرد الذي أصابه.
items.wands.wandoffrost.eleblast_desc=انفجار عنصري باستخدام عصا الصقيع يلحق 100%% من الضرر، ويجمد الأعداء، ويطفئ النيران.

items.wands.wandoflightning.name=عصا البرق
items.wands.wandoflightning.staff_name=عصا البرق
items.wands.wandoflightning.ondeath=قتلت نفسك بعصا البرق الخاصة بك...
items.wands.wandoflightning.desc=صُنعت هذه العصا من معدن صلب، مما يجعلها ثقيلة بشكل مدهش. ينحني عند طرفها شوكان يلتقيان معًا، وتتقوس الكهرباء بينهما.
items.wands.wandoflightning.stats_desc=ترسل هذه العصا برقًا قويًا يتقوس عبر كل ما تُطلق عليه، ملحقًا _%1$d-%2$d من الضرر._ ويمكن لهذا البرق أن ينتقل إلى الشخصيات القريبة، كما ينتشر بسهولة أكبر في الماء. ويمكن للأقواس الكهربائية المنطلقة من هذه العصا أن تلحق بك الضرر، لكنها لن تؤذي حلفاءك.
items.wands.wandoflightning.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا البرق، فهناك احتمال أن يشحن نفسه كهربائيًا لمدة 10 أدوار. وأثناء شحنه، يكون ساحر المعركة محصنًا ضد ضرر البرق، كما يمتد برق عصاه إلى مسافة أبعد.
items.wands.wandoflightning.eleblast_desc=انفجار عنصري باستخدام عصا البرق يلحق 100%% من الضرر، ويصيب الأعداء بالذهول لمدة 5 أدوار، ويكهرب الماء.
items.wands.wandoflightning$lightningcharge.name=مشحون كهربائيًا
items.wands.wandoflightning$lightningcharge.desc=ساحر المعركة مشحون حاليًا بالطاقة، مما يمنحه مناعة ضد عصا البرق الخاصة به ويزيد مدى انتقال البرق منها.\n\nالأدوار المتبقية: %s.

items.wands.wandoflivingearth.name=عصا الأرض الحية
items.wands.wandoflivingearth.staff_name=عصا الأرض الحية
items.wands.wandoflivingearth.desc=صُنعت هذه العصا من صخرة غريبة، تتخللها أشرطة من الطاقة الصفراء المتوهجة. ويبدو أن الصخور تتحرك قليلًا عندما تقبض على العصا، كما لو كانت تشعر بيدك.
items.wands.wandoflivingearth.stats_desc=تطلق هذه العصا صخورًا سحرية على الأعداء، ملحقة _%1$d-%2$d من الضرر._ ثم تعيد الصخور تشكلها حول المستخدم، وتمنحه درعًا يتناسب مع مقدار الضرر الذي تم إلحاقه. وإذا تم جمع قدر كافٍ من الدرع، فسوف يتشكل حارس صخري عندما تُطلق العصا في المرة التالية.
items.wands.wandoflivingearth.upgrade_stat_name_2=الحد الأقصى لصحة الحارس
items.wands.wandoflivingearth.upgrade_stat_name_3=حجب الحارس
items.wands.wandoflivingearth.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا الأرض الحية، يعود بعض الضرر الذي أُلحق على شكل درع صخري.
items.wands.wandoflivingearth.eleblast_desc=انفجار عنصري باستخدام عصا الأرض الحية يلحق 50%% من الضرر، ويعالج الحارس الترابي النشط لكل عدو يُصاب.
items.wands.wandoflivingearth$rockarmor.name=درع صخري
items.wands.wandoflivingearth$rockarmor.desc=تحيط الصخور السحرية بجسدك، وعند تعرضك للهجوم ستحاول حمايتك، وتقلل الضرر الذي تتلقاه بنسبة 50%%. لكن كل ضرر يتم حجبه يزيل بعضًا من الصخور.\n\nالدرع المتبقي: %1$d.\n\nإذا تراكم حولك قدر كافٍ من الصخور، فسيؤدي الإطلاق التالي من عصا الأرض الحية إلى تشكل الصخور على هيئة حارس يقاتل إلى جانبك.\n\nالدرع المطلوب للحارس: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=يستفيد هذا الحارس الترابي أيضًا من قوة الكثرة. الأدوار المتبقية: %d.
items.wands.wandoflivingearth$earthguardian.name=حارس ترابي
items.wands.wandoflivingearth$earthguardian.desc=تشكلت الصخور من عصا الأرض الحية الخاصة بك لتصبح حارسًا ترابيًا واقيًا! سيهاجم هذا الحامي الصخري الأعداء القريبين، مما يجبرهم على مهاجمته بدلًا منك. وعندما تختفي جميع التهديدات القريبة، سيعيد الحارس التشكل حولك، وسيعود عندما تستخدم عصاك مرة أخرى.
items.wands.wandoflivingearth$earthguardian.wand_info=ترتبط القوة الدفاعية للحارس بمستوى عصاك. وهو يصد حاليًا _%1$d-%2$d من الضرر._
items.wands.wandoflivingearth$earthguardian.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عصا معينة.

items.wands.wandofmagicmissile.name=عصا القذيفة السحرية
items.wands.wandofmagicmissile.staff_name=عصا القذيفة السحرية
items.wands.wandofmagicmissile.desc=تطلق هذه العصا البسيطة نسبيًا قذائف من طاقة سحرية خالصة. ورغم أن العصا نفسها لا تمتلك أي تأثيرات خاصة، فإن لديها عددًا أكبر من الشحنات المتاحة ويمكنها تعزيز العصي الأخرى مؤقتًا عند ترقيتها.
items.wands.wandofmagicmissile.stats_desc=تلحق كل قذيفة من هذه العصا _%1$d-%2$d من الضرر،_ وستعزز العصي الأخرى مؤقتًا إذا تمت ترقيتها.
items.wands.wandofmagicmissile.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا القذيفة السحرية، ستحصل جميع عصاه السحرية على شحنة بالإضافة إلى عصاه.
items.wands.wandofmagicmissile.eleblast_desc=انفجار عنصري باستخدام عصا القذيفة السحرية يلحق 50%% من الضرر، ويمنح الساحر 15 دورًا من إعادة الشحن.
items.wands.wandofmagicmissile.discover_hint=يبدأ أحد الأبطال بهذا العنصر.
items.wands.wandofmagicmissile$magiccharge.name=شحنة سحرية
items.wands.wandofmagicmissile$magiccharge.desc=ضخت عصا القذيفة السحرية الخاصة بك طاقة مجددًا إلى عصاك، مما يزيد المستوى الفعلي للإطلاق التالي الذي تقوم به.\n\nتم تعزيز عصاك إلى: +%d.\n\nالأدوار المتبقية للشحنة السحرية: %s.

items.wands.wandofprismaticlight.name=عصا الضوء الطيفي
items.wands.wandofprismaticlight.staff_name=عصا الضوء الطيفي
items.wands.wandofprismaticlight.desc=صُنعت هذه العصا من قطعة صلبة من البلور الشفاف، تشبه قطعة طويلة من الزجاج الأملس. وترقص أجزاء صغيرة من الضوء الملوّن حول طرف العصا، متلهفة للانطلاق.
items.wands.wandofprismaticlight.stats_desc=تطلق هذه العصا أشعة من الضوء تشق ظلام الزنزانة، وتكشف المناطق والأفخاخ المخفية. ويمكن للشعاع أن يصيب الأعداء بالعمى، ويلحق _%1$d-%2$d من الضرر._ أما الأعداء الشياطين والموتى الأحياء، فسيحترقون في الضوء الساطع للعصا ويتلقون ضررًا إضافيًا.
items.wands.wandofprismaticlight.upgrade_stat_name_2=احتمال الإعماء
items.wands.wandofprismaticlight.upgrade_stat_name_3=مدة الضوء
items.wands.wandofprismaticlight.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا الضوء الطيفي، سيصاب بالإعاقة لمدة تتناسب مع مستوى العصا.
items.wands.wandofprismaticlight.eleblast_desc=انفجار عنصري باستخدام عصا الضوء الطيفي يلحق 67%% من الضرر، ويكشف جميع التضاريس في منطقة الانفجار، ويصيب الأعداء بالعمى لمدة 5 أدوار.

items.wands.wandofregrowth.name=عصا النمو
items.wands.wandofregrowth.staff_name=عصا النمو
items.wands.wandofregrowth.desc=صُنعت هذه العصا من ساق رفيعة من الخشب المنحوت ببراعة. وما زالت حية ونابضة بالحياة بطريقة ما، ولونها أخضر ساطع كلبّ شجرة صغيرة. "عندما تنتهي الحياة، تبدأ حياة جديدة دائمًا بالنمو... تبقى الدورة الأبدية دائمًا!"
items.wands.wandofregrowth.stats_desc=عند استخدامها، تطلق هذه العصا طاقة نمو سحرية إلى الخارج في شكل مخروط، مما يجعل العشب والجذور والنباتات النادرة تنبثق إلى الحياة. سيستهلك إطلاقها التالي _%1$d من الشحنات_. وكلما زاد عدد الشحنات التي تستهلكها العصا، ازداد حجم التأثير وقوته.
items.wands.wandofregrowth.degradation=بعد _%d من الشحنات الإضافية_، ستبدأ هذه العصا في الفشل في إنتاج النباتات والعشب النضر. يزداد هذا الحد عند رفع مستوى العصا أو ترقيتها.
items.wands.wandofregrowth.upgrade_stat_name_1=العشب لكل شحنة
items.wands.wandofregrowth.upgrade_stat_name_2=الحد الإجمالي للعشب
items.wands.wandofregrowth.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا النمو، وكان أيٌّ منهما يقف على العشب، فسيحصل على شفاء عشبي يتناسب مع الضرر الذي تم إلحاقه.
items.wands.wandofregrowth.eleblast_desc=انفجار عنصري باستخدام عصا النمو يجذّر الأعداء وينبت العشب عشوائيًا في منطقة الانفجار.
items.wands.wandofregrowth$dewcatcher.name=جامع الندى
items.wands.wandofregrowth$dewcatcher.desc=جامعات الندى نباتات عجيبة تملأ نفسها بالندى السحري. وتحاول التمويه على هيئة عشب لتجنب الانتباه، لكن نتوءات الندى التي تجمعها تفضحها.
items.wands.wandofregrowth$dewcatcher.discover_hint=يمكنك العثور على هذا النبات باستخدام عصا معينة.
items.wands.wandofregrowth$seedpod.name=قرن البذور
items.wands.wandofregrowth$seedpod.desc=قرون البذور نباتات سحرية تنتج بذورًا لأنواع نباتات أخرى بدلًا من إنتاج بذورها الخاصة. وهي تنجح بطريقة ما في الانتشار رغم عدم امتلاكها بذورًا خاصة بها.
items.wands.wandofregrowth$seedpod.discover_hint=يمكنك العثور على هذا النبات باستخدام عصا معينة.
items.wands.wandofregrowth$lotus.name=اللوتس الذهبي
items.wands.wandofregrowth$lotus.desc=اللوتس الذهبي نبات غامض لا يمكن استحضاره إلا بواسطة عصا نمو قوية. تعزز هالته جميع النباتات وتأثيراتها، لكنه يستهلك طاقته ويموت بعد وقت قصير.
items.wands.wandofregrowth$lotus.wand_info=أُنتج هذا اللوتس بواسطة عصا نمو _+%1$d_. ستقوم جميع النباتات الواقعة ضمن تأثيره _بالتفعيل فورًا_ إذا زُرعت على شخصية. كما ستملك النباتات _احتمالًا بنسبة %2$d%%_ لإسقاط بذورها، وستستهلك السهام المغموسة _%3$d%% متانة أقل_.
items.wands.wandofregrowth$lotus.discover_hint=يمكنك العثور على هذا النبات باستخدام عصا معينة بعد ترقيتها عدة مرات.

items.wands.wandoftransfusion.name=عصا نقل الدم
items.wands.wandoftransfusion.staff_name=عصا نقل الدم
items.wands.wandoftransfusion.ondeath=قتلت نفسك بعصا نقل الدم الخاصة بك...
items.wands.wandoftransfusion.charged=امتلأت عصاك بطاقة حياة عدوك!
items.wands.wandoftransfusion.desc=عصا ذات شكل بسيط إلى حد ما، لكنها تتميز بلونها الأرجواني الفاقع وحجرها الكريم الأسود الحالك في طرفها.
items.wands.wandoftransfusion.stats_desc=عند استخدامها على الحلفاء أو الأعداء المسحورين، ستستنزف هذه العصا _%1$d من صحة المستخدم_ لعلاج الحليف أو منحه _%2$d من الصحة._ وعند استخدامها على الأعداء، ستسحرهم العصا مؤقتًا بينما تمنح المستخدم _%3$d من الحماية_. أما الموتى الأحياء العدائيون فسيتلقون _%4$d-%5$d من الضرر_ بدلًا من سحرهم.
items.wands.wandoftransfusion.upgrade_stat_name_1=شفاء الحليف
items.wands.wandoftransfusion.upgrade_stat_name_2=حماية المستخدم
items.wands.wandoftransfusion.upgrade_stat_name_3=ضرر الموتى الأحياء
items.wands.wandoftransfusion.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا مسحورًا بعصا نقل الدم، سيحصل على حماية، ولن يستهلك إطلاقه التالي بالعصا أي صحة.
items.wands.wandoftransfusion.eleblast_desc=انفجار عنصري باستخدام عصا نقل الدم يسحر الأعداء، ويعالج الحلفاء، ويلحق 100%% من الضرر بالأعداء الموتى الأحياء.

items.wands.wandofwarding.name=عصا الحراسة
items.wands.wandofwarding.staff_name=عصا الحراسة
items.wands.wandofwarding.no_more_wards=لا تستطيع عصاك الحفاظ على المزيد من الحراس.
items.wands.wandofwarding.bad_location=لا يمكنك وضع حارس هناك.
items.wands.wandofwarding.desc=تحتوي هذه العصا المعدنية القصيرة على حجر كريم أرجواني ساطع يحوم فوق طرفها.
items.wands.wandofwarding.stats_desc=بدلًا من إلحاق الضرر بالعدو مباشرة، تستدعي هذه العصا حراسًا وثوابت دفاعية ثابتة في أماكنها. ويمكن استدعاء الحراس في أي مكان، حتى عبر الجدران إذا كانت لديك رؤية. تستطيع هذه العصا الحفاظ في الوقت نفسه على حراس بقيمة _%d من الطاقة_.
items.wands.wandofwarding.upgrade_stat_name_1=ضرر الحارس
items.wands.wandofwarding.upgrade_stat_name_2=طاقة الحارس
items.wands.wandofwarding.bmage_desc=عندما يضرب _ساحر المعركة_ عدوًا بعصا الحراسة، فلدى جميع الحراس والثوابت النشطين احتمال للتعافي.
items.wands.wandofwarding.eleblast_desc=انفجار عنصري باستخدام عصا الحراسة يعالج جميع الحراس والثوابت في منطقة الانفجار.
items.wands.wandofwarding$ward.desc_generic_ward=سيطلق هذا الحارس تلقائيًا على أي عدو يدخل ضمن مجال رؤيته.\n\nسيؤدي إطلاق عصا الحراسة على هذا الحارس إلى ترقيته.\n\nيمتلك الحراس عددًا محدودًا من الإطلاقات قبل أن يتلاشى وجودهم.
items.wands.wandofwarding$ward.desc_generic_sentry=يمتلك هذا الثابت القوة النارية نفسها التي يمتلكها الحارس، لكنه يمتلك صحة بدلًا من عدد محدد من الشحنات. ويشبه الحجر الكريم الموجود في طرف عصا الحراسة الخاصة بك.\n\nسيؤدي إطلاق عصا الحراسة على هذا الثابت إلى ترقيته وعلاجه.\n\nيستهلك هذا الثابت بعضًا من صحته في كل مرة يطلق فيها على عدو، لكن يمكن علاجه باستخدام عصا الحراسة عليه.
items.wands.wandofwarding$ward.name_1=حارس أدنى
items.wands.wandofwarding$ward.desc_1=سيطلق هذا الحارس الأساسي تلقائيًا على أي عدو يدخل ضمن مجال رؤيته، ملحقًا _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الحارس إلى ترقيته.\n\nلن يطلق هذا الحارس إلا مرة واحدة قبل أن يتلاشى.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.name_2=حارس
items.wands.wandofwarding$ward.desc_2=يمتلك هذا الحارس المطوّر نمطًا أكثر تعقيدًا، ويمكنه الهجوم عدة مرات. كل إطلاق من هذا الحارس يلحق _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الحارس إلى ترقيته.\n\nسيطلق هذا الحارس ثلاث مرات قبل أن يتلاشى.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.name_3=حارس أكبر
items.wands.wandofwarding$ward.desc_3=يستطيع هذا الحارس المطوّر بالكامل الهجوم مرات أكثر من أسلافه. ويلحق كل إطلاق منه _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الحارس إلى ترقيته.\n\nسيطلق هذا الحارس خمس مرات قبل أن يتلاشى.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الحارس.
items.wands.wandofwarding$ward.name_4=ثابت أدنى
items.wands.wandofwarding$ward.desc_4=يمتلك هذا الثابت الأصغر القوة النارية نفسها التي يمتلكها الحارس الأكبر، لكنه يمتلك صحة بدلًا من عدد محدد من الشحنات. ويشبه الحجر الكريم الموجود في طرف عصا الحراسة الخاصة بك. ويلحق كل إطلاق منه _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الثابت إلى ترقيته وعلاجه.\n\nيستهلك هذا الثابت بعضًا من صحته في كل مرة يطلق فيها على عدو، لكن يمكن علاجه باستخدام عصا الحراسة عليه.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الثابت.
items.wands.wandofwarding$ward.name_5=ثابت
items.wands.wandofwarding$ward.desc_5=هذا الثابت المطوّر أكبر وأكثر متانة من الثابت الأدنى. ويلحق كل إطلاق منه _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الثابت إلى ترقيته وعلاجه.\n\nيستهلك هذا الثابت بعضًا من صحته في كل مرة يطلق فيها على عدو، لكن يمكن علاجه باستخدام عصا الحراسة عليه.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الثابت.
items.wands.wandofwarding$ward.name_6=ثابت أكبر
items.wands.wandofwarding$ward.desc_6=هذا الثابت المطوّر بالكامل أكثر متانة بكثير من أسلافه. ويلحق كل إطلاق منه _%1$d-%2$d من الضرر._\n\nسيؤدي إطلاق عصا الحراسة على هذا الثابت إلى علاجه.\n\nيستهلك هذا الثابت بعضًا من صحته في كل مرة يطلق فيها على عدو، لكن يمكن علاجه باستخدام عصا الحراسة عليه.\n\nتستخدم عصا الحراسة الخاصة بك _%3$d من الطاقة_ للحفاظ على هذا الثابت.
items.wands.wandofwarding$ward.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عصا معينة.
items.wands.wandofwarding$ward.dismiss_title=هل تريد التخلص من هذا الحارس؟
items.wands.wandofwarding$ward.dismiss_body=يمكنك تبديد هذا الحارس إذا لم تعد تريد من عصاك الحفاظ عليه. سيؤدي القيام بذلك إلى تدمير الحارس فورًا.\n\nهل تريد التخلص من هذا الحارس؟
items.wands.wandofwarding$ward.dismiss_confirm=نعم
items.wands.wandofwarding$ward.dismiss_cancel=لا

### لعنات الأسلحة
items.weapon.curses.annoying.name=%s المزعج
items.weapon.curses.annoying.msg_1=أوه، هل نقاتل شيئًا!؟
items.weapon.curses.annoying.msg_2=أجل، اقضِ عليهم!
items.weapon.curses.annoying.msg_3=مهلًا، اسمع!
items.weapon.curses.annoying.msg_4=هل وصلنا إلى الزعيم بعد!؟
items.weapon.curses.annoying.msg_5=آخ، لا تأرجحني بهذه القوة!
items.weapon.curses.annoying.msg_6=مُتْ أيها الحشرة!
items.weapon.curses.annoying.msg_7=وييييييييييييييييي!
items.weapon.curses.annoying.msg_8=هل يمكننا أخذ استراحة!؟
items.weapon.curses.annoying.msg_9=بام، هاها!
items.weapon.curses.annoying.msg_10=ضربة موفقة!
items.weapon.curses.annoying.msg_11=لم أرد أن أكون سلاحًا، كنت أريد أن أكون فأس حطاب.
items.weapon.curses.annoying.msg_12=تذكر، الثقة المفرطة قاتل بطيء وخبيث.
items.weapon.curses.annoying.msg_13=قواعدكم كلها أصبحت ملكًا لنا!
items.weapon.curses.annoying.desc=تستطيع الأسلحة المزعجة التحدث، لكنها مفعمة بالطاقة أكثر من اللازم. وغالبًا ما تلفت الانتباه إليك دون قصد.
items.weapon.curses.annoying.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة مزعجة احتمال 20%% لجعل كل عدو ضمن المدى هائجًا لمدة 6 أدوار.

items.weapon.curses.dazzling.name=%s المبهر
items.weapon.curses.dazzling.desc=تومض الأسلحة المبهرة أحيانًا بضوء ساطع مبهر، مما يصيب كل من يستطيع رؤيتها بالعمى.
items.weapon.curses.dazzling.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة مبهرة احتمال 50%% لإصابة كل عدو ضمن المدى بالعمى لمدة 6 أدوار.

items.weapon.curses.displacing.name=%s المُزيح
items.weapon.curses.displacing.desc=تُشبع الأسلحة المُزيحة بسحر انتقال آني فوضوي، مما يمنحها القدرة على نقل الأعداء عشوائيًا عبر الطابق.
items.weapon.curses.displacing.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة الإزاحة احتمال 50%% لنقل كل عدو ضمن المدى آنيًا.

items.weapon.curses.explosive.name=%s المتفجر
items.weapon.curses.explosive.warm=دافئ...
items.weapon.curses.explosive.hot=ساخن!
items.weapon.curses.explosive.desc=تراكم الأسلحة المتفجرة قوتها تدريجيًا ثم تنفجر، مسببة الضرر لكل ما هو قريب.
items.weapon.curses.explosive.desc_cool=سلاحك بارد حاليًا عند لمسه.
items.weapon.curses.explosive.desc_warm=سلاحك يبني الطاقة ويزداد دفئًا...
items.weapon.curses.explosive.desc_hot=سلاحك ساخن! إنه على وشك الانفجار!
items.weapon.curses.explosive.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة متفجرة احتمال 50%% لإحداث انفجار على عدو عشوائي ضمن المدى.

items.weapon.curses.friendly.name=%s الودود
items.weapon.curses.friendly.desc=الأسلحة الودية مناسبة أكثر للمسالمين، إذ تطلق أحيانًا سحرًا يجعل القتال مستحيلًا.
items.weapon.curses.friendly.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة ودية احتمال 50%% لسحر كل عدو ضمن المدى لمدة 6 أدوار.

items.weapon.curses.polarized.name=%s المستقطب
items.weapon.curses.polarized.desc=يتأثر السلاح المستقطب بسحر يجعل هجومه إما يلحق ضررًا أكبر بنسبة 50%%، أو لا يلحق أي ضرر على الإطلاق.
items.weapon.curses.polarized.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة مستقطبة احتمال 50%% لإلحاق 24-36 من الضرر بكل عدو ضمن المدى.

items.weapon.curses.sacrificial.name=%s التضحيـوي
items.weapon.curses.sacrificial.desc=تطالب الأسلحة التضحيـوية مرتديها بالدم مقابل مهاجمة الأعداء. وكلما كان مرتديها أكثر صحة، زادت كمية الدم التي تأخذها اللعنة.
items.weapon.curses.sacrificial.elestrike_desc=تجعل ضربة عنصرية باستخدام لعنة تضحيـوية البطل وكل عدو ضمن المدى ينزفون بمقدار 12 من نقاط الصحة.

items.weapon.curses.wayward.name=%s الشارد
items.weapon.curses.wayward.desc=تصبح الأسلحة الشاردة شديدة عدم الدقة أحيانًا. ويستمر هذا السحر لفترة قصيرة عند تفعيله، لكن يمكن تبديده بتوجيه ضربة ناجحة باستخدام السلاح الشارد.
items.weapon.curses.wayward.elestrike_desc=لدى ضربة عنصرية باستخدام لعنة شاردة احتمال 50%% لإصابة كل عدو ضمن المدى بلعنة لمدة 6 أدوار.
items.weapon.curses.wayward$waywardbuff.name=الشُرود
items.weapon.curses.wayward$waywardbuff.desc=تم تفعيل سحر سلاحك الشارد، مما يجعله شديد عدم الدقة لفترة قصيرة. لاحظ أن هذا لا يؤثر في الهجمات المضمونة الإصابة، مثل هجمات المفاجأة. وسيؤدي الهجوم بنجاح باستخدام السلاح الشارد إلى إزالة هذا التأثير فورًا.\n\nالأدوار المتبقية: %s.

### التعويذات
items.weapon.enchantments.blazing.name=%s الملتهب
items.weapon.enchantments.blazing.desc=تجعل هذه التعويذة السلاح يطلق ألسنة من اللهب، فتشعل الأعداء وتلحق ضررًا إضافيًا بالأعداء المشتعلين بالفعل.
items.weapon.enchantments.blazing.elestrike_desc=تنشر ضربة عنصرية باستخدام تعويذة ملتهبة النار إلى كل بلاطة ضمن المدى، ويستمر تأثير النار لمدة 8 أدوار.

items.weapon.enchantments.blocking.name=%s الحاجب
items.weapon.enchantments.blocking.desc=تملك الأسلحة الحاجبة احتمالًا لمنحك حماية مؤقتة قصيرة بعد مهاجمة الأعداء بها.
items.weapon.enchantments.blocking.elestrike_desc=تمنح ضربة عنصرية باستخدام تعويذة حاجبة المبارزة 6 نقاط حماية إضافية لكل عدو ضمن المدى.
items.weapon.enchantments.blocking$blockbuff.name=الحجب
items.weapon.enchantments.blocking$blockbuff.desc=منحتك تعويذة الحجب الموجودة على سلاحك دفعة قصيرة من القوة الدفاعية!\n\nالحماية المتبقية: %d\n\nالأدوار المتبقية: %s.

items.weapon.enchantments.blooming.name=%s المزهر
items.weapon.enchantments.blooming.desc=تحتوي الأسلحة المزهرة على سحر يجعل النباتات تنبت على أو حول من تصيبهم.
items.weapon.enchantments.blooming.elestrike_desc=تنشر ضربة عنصرية باستخدام تعويذة مزهرة العشب إلى ما يصل إلى 8 بلاطات ضمن المدى، وتجذّر جميع الأعداء ضمن المدى لمدة 6 أدوار.

items.weapon.enchantments.chilling.name=%s المبرِّد
items.weapon.enchantments.chilling.desc=يصاب الأعداء الذين تضربهم هذه التعويذة بالبرد، مما يبطئ حركتهم وهجماتهم.
items.weapon.enchantments.chilling.elestrike_desc=تنشر ضربة عنصرية باستخدام تعويذة مبردة هواءً باردًا إلى كل بلاطة ضمن المدى، ويستمر لمدة 8 أدوار.

items.weapon.enchantments.kinetic.name=%s الحركي
items.weapon.enchantments.kinetic.desc=عندما يُقتل عدو باستخدام سلاح حركي، تُخزن أي قوة زائدة في السلاح، وسيتم تطبيقها على الهجوم الناجح التالي.
items.weapon.enchantments.kinetic.elestrike_desc=تطبق ضربة عنصرية باستخدام تعويذة حركية 40%% من الضرر المخزن على كل عدو ضمن المدى، باستثناء الهدف الأساسي.
items.weapon.enchantments.kinetic$conserveddamage.name=ضرر مخزن
items.weapon.enchantments.kinetic$conserveddamage.desc=خزن سلاحك القوة الزائدة من ضربة قتل سابقة، وسيطبقها كضرر إضافي على هجومك التالي. لكن الطاقة ستتلاشى ببطء مع مرور الوقت.\n\nالضرر المخزن: %d.

items.weapon.enchantments.corrupting.name=%s المُفسد
items.weapon.enchantments.corrupting.desc=تمتلك هذه التعويذة القوية القدرة على إخضاع الأعداء لإرادتك. وعند قتل عدو بهذا السلاح، فهناك احتمال أن يصبح مفسدًا بدلًا من أن يموت.
items.weapon.enchantments.corrupting.elestrike_desc=تملك ضربة عنصرية باستخدام تعويذة مفسدة احتمالًا يتراوح بين 5%% و25%% (بحسب الصحة المفقودة) لإفساد كل عدو ضمن المدى، باستثناء الهدف الأساسي.

items.weapon.enchantments.elastic.name=%s المرن
items.weapon.enchantments.elastic.desc=تمتلك الأسلحة المرنة احتمالًا لقذف الأعداء إلى الخلف لمسافات قصيرة.
items.weapon.enchantments.elastic.elestrike_desc=تدفع ضربة عنصرية باستخدام تعويذة مرنة جميع الأعداء ضمن المدى إلى الخلف 5 بلاطات.

items.weapon.enchantments.grim.name=%s الكئيب
items.weapon.enchantments.grim.desc=تمتلك هذه التعويذة القوية القدرة على القضاء على العدو فورًا. ويزداد احتمال حدوث التأثير كلما كان العدو أضعف.
items.weapon.enchantments.grim.elestrike_desc=تملك ضربة عنصرية باستخدام تعويذة كئيبة احتمالًا يتراوح بين 6%% و30%% (بحسب الصحة المفقودة) لقتل كل عدو ضمن المدى، باستثناء الهدف الأساسي.

items.weapon.enchantments.lucky.name=%s المحظوظ
items.weapon.enchantments.lucky.desc=تملك الأعداء الذين يُقتلون باستخدام سلاح محظوظ فرصة لإسقاط غنائم إضافية.
items.weapon.enchantments.lucky.elestrike_desc=تملك ضربة عنصرية باستخدام تعويذة محظوظة احتمال 12.5%% لإنشاء غنائم تحت كل عدو ضمن المدى. ولا يمكن تفعيل هذا التأثير أكثر من مرة لكل عدو.

items.weapon.enchantments.projecting.name=%s ذو المدى
items.weapon.enchantments.projecting.desc=تمنح هذه التعويذة الأسلحة القريبة مدى وصول إضافيًا. أما الأسلحة بعيدة المدى فستتمكن من اختراق الجدران عند استهداف أعداء قريبين.
items.weapon.enchantments.projecting.elestrike_desc=تلحق ضربة عنصرية باستخدام تعويذة ذات مدى 30%% من الضرر بكل عدو ضمن المدى، باستثناء الهدف الأساسي.

items.weapon.enchantments.shocking.name=%s الصاعق
items.weapon.enchantments.shocking.desc=تتدفق الكهرباء من السلاح الصاعق، ملحقة ضررًا إضافيًا بجميع الأعداء القريبين.
items.weapon.enchantments.shocking.elestrike_desc=تنشر ضربة عنصرية باستخدام تعويذة صاعقة الكهرباء إلى كل بلاطة ضمن المدى، ويستمر تأثيرها لمدة 8 أدوار.

items.weapon.enchantments.unstable.name=%s غير المستقر
items.weapon.enchantments.unstable.desc=تشع هذه التعويذة بطاقة فوضوية، وتعمل كتعويذة مختلفة مع كل ضربة.
items.weapon.enchantments.unstable.elestrike_desc=تطبق ضربة عنصرية باستخدام تعويذة غير مستقرة تأثير تعويذة عشوائية على كل عدو ضمن المدى، باستثناء الهدف الأساسي.

items.weapon.enchantments.vampiric.name=%s مصّاص الدماء
items.weapon.enchantments.vampiric.desc=تمتص هذه التعويذة القوية قوة حياة الأعداء مع كل ضربة، وتعيدها إلى مرتدي السلاح. ويصبح التأثير أقوى كلما انخفضت صحة مرتديه.
items.weapon.enchantments.vampiric.elestrike_desc=تشفي ضربة عنصرية باستخدام تعويذة مصاصة للدماء المبارزة بمقدار 2.5 من نقاط الصحة لكل عدو ضمن المدى.


### الأسلحة القريبة
items.weapon.melee.assassinsblade.name=نصل القاتل
items.weapon.melee.assassinsblade.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.assassinsblade.ability_name=تسلل
items.weapon.melee.assassinsblade.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام نصل القاتل. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 3 بلاطات، وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام نصل القاتل. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 3 بلاطات، وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.assassinsblade.desc=نصل صغير متموج مصنوع من حجر السج، يصعب استخدامه رغم خفة وزنه، لكنه مميت إذا أصاب الهدف المناسب.

items.weapon.melee.battleaxe.name=فأس المعركة
items.weapon.melee.battleaxe.stats_desc=هذا سلاح دقيق نسبيًا.
items.weapon.melee.battleaxe.ability_name=ضربة ثقيلة
items.weapon.melee.battleaxe.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام فأس المعركة. تلحق هذه الضربة المركزة عادةً _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام فأس المعركة. تلحق هذه الضربة المركزة _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.battleaxe.desc=يمنح الرأس الفولاذي الضخم لفأس المعركة هذا قوة كبيرة مع كل ضربة واسعة.

items.weapon.melee.crossbow.name=قوس النشاب
items.weapon.melee.crossbow.typical_stats_desc=عادةً ما يعزز هذا السلاح الأسهم المرمية لتلحق _%1$d-%2$d من الضرر_ عند تجهيزه، كما يمنحها تعويذته أيضًا.
items.weapon.melee.crossbow.stats_desc=يعزز هذا السلاح الأسهم المرمية لتلحق _%1$d-%2$d من الضرر_ عند تجهيزه، كما يمنحها تعويذته أيضًا.
items.weapon.melee.crossbow.ability_name=طلقة مشحونة
items.weapon.melee.crossbow.typical_ability_desc=يمكن للمبارزة _شحن_ قوسها النشاب، مما يجعل هجومها العادي التالي به يصيب دائمًا ويطبق واحدًا من ثلاثة تأثيرات: ستدفع هجمات القتال القريب الأعداء بعيدًا، وستلحق الأسهم غير المغموسة عادةً _+%1$d من الضرر_، وستطبق الأسهم المغموسة تأثيرها في مساحة 7x7، وستدوم عادةً _%2$d استخدامات إضافية_.
items.weapon.melee.crossbow.ability_desc=يمكن للمبارزة _شحن_ قوسها النشاب، مما يجعل هجومها العادي التالي به يصيب دائمًا ويطبق واحدًا من ثلاثة تأثيرات: ستدفع هجمات القتال القريب الأعداء بعيدًا، وستلحق الأسهم غير المغموسة _+%1$d من الضرر_، وستطبق الأسهم المغموسة تأثيرها في مساحة 7x7، وستدوم _%2$d استخدامات إضافية_.
items.weapon.melee.crossbow.desc=سلاح معقد إلى حد ما يطلق سهامًا بسرعات استثنائية. ورغم أنه غير مصمم لذلك، فإن وزن قوس النشاب هذا وبنيته المتينة تجعله أيضًا سلاحًا قريبًا لا بأس به.
items.weapon.melee.crossbow.upgrade_ability_stat_name=تعزيز القدرة
items.weapon.melee.crossbow$chargedshot.name=مشحون
items.weapon.melee.crossbow$chargedshot.desc=تركز المبارزة القوة في قوسها النشاب. سيصيب الهجوم التالي الذي تنفذه به دائمًا ويطبق واحدًا من ثلاثة تأثيرات:\n- ستدفع هجمات القتال القريب الأعداء بضع بلاطات إلى الخلف.\n- ستلحق الأسهم غير المغموسة ضررًا إضافيًا.\n- ستحصل الأسهم المغموسة على استخدامات إضافية وستطبق تأثيرها في مساحة 7x7. وستؤثر تأثيرات الأسهم النافعة في الحلفاء فقط، بينما ستطبق التأثيرات الضارة على الأعداء فقط. ولا يمكن للمبارزة استخدام هذه القدرة لتطبيق تأثيرات الأسهم النافعة على نفسها.

items.weapon.melee.cudgel.name=هراوة
items.weapon.melee.cudgel.stats_desc=هذا سلاح دقيق نسبيًا.
items.weapon.melee.cudgel.ability_name=ضربة ثقيلة
items.weapon.melee.cudgel.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام الهراوة. تلحق هذه الضربة المركزة عادةً _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام الهراوة. تلحق هذه الضربة المركزة _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.cudgel.desc=صولجان نحاسي صغير، صُنع كأداة للدفاع عن النفس لدى النبلاء أكثر من كونه سلاحًا للمغامرة.
items.weapon.melee.cudgel.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.dagger.name=خنجر
items.weapon.melee.dagger.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.dagger.ability_name=تسلل
items.weapon.melee.dagger.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام خنجر. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 5 بلاطات، وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.dagger.ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام خنجر. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 5 بلاطات، وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dagger.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dagger.desc=خنجر حديدي بسيط بمقبض خشبي مهترئ.
items.weapon.melee.dagger.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.dirk.name=خنجر طويل
items.weapon.melee.dirk.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.melee.dirk.ability_name=تسلل
items.weapon.melee.dirk.typical_ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام الخنجر الطويل. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 4 بلاطات، وتمنحها عادةً _%d أدوار من الاختفاء._
items.weapon.melee.dirk.ability_desc=يمكن للمبارزة _التسلل_ أثناء استخدام الخنجر الطويل. تسمح هذه القدرة للمبارزة بالانتقال الفوري لمسافة تصل إلى 4 بلاطات، وتمنحها _%d أدوار من الاختفاء._
items.weapon.melee.dirk.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.dirk.desc=خنجر طعن أطول، يمنحك مزيدًا قليلًا من الفولاذ لغرسه في الأعداء.

items.weapon.melee.flail.name=سوط حديدي
items.weapon.melee.flail.stats_desc=هذا سلاح غير دقيق نسبيًا.\nلا يمكن لهذا السلاح تنفيذ هجوم مفاجئ.
items.weapon.melee.flail.ability_name=دوران
items.weapon.melee.flail.spin_warn=لا يمكنك تدوير السوط أكثر من ذلك.
items.weapon.melee.flail.typical_ability_desc=يمكن للمبارزة _تدوير_ السوط لبناء القوة لفترة قصيرة. في كل دور يتم فيه تدوير السوط، سيُلحق عادةً _+%d من الضرر_ في هجومه العادي التالي، بحد أقصى 3 مرات. كما أن السوط الدوّار مضمون الإصابة. ولا يستهلك شحنة سوى بدء تدوير السوط.
items.weapon.melee.flail.ability_desc=يمكن للمبارزة _تدوير_ السوط لبناء القوة لفترة قصيرة. في كل دور يتم فيه تدوير السوط، سيُلحق _+%d من الضرر_ في هجومه العادي التالي، بحد أقصى 3 مرات. كما أن السوط الدوّار مضمون الإصابة. ولا يستهلك شحنة سوى بدء تدوير السوط.
items.weapon.melee.flail.desc=كرة مسننة متصلة بمقبض بواسطة سلسلة طويلة. يصعب التحكم بها جدًا، لكنها مدمرة إذا أصابت ضربة قوية.
items.weapon.melee.flail$spinabilitytracker.name=يدور
items.weapon.melee.flail$spinabilitytracker.desc=تقوم المبارزة بتدوير السوط، وتبني الضرر لهجومها العادي التالي به. يستغرق كل دوران دورًا واحدًا لكنه يزيد الضرر، بحد أقصى ثلاثة دورات. كما أن السوط مضمون الإصابة أثناء الدوران.\n\nالدورات الحالية: %1$d%%.\nالأدوار المتبقية: %2$s.

items.weapon.melee.gauntlet.name=قفاز حجري
items.weapon.melee.gauntlet.stats_desc=هذا سلاح سريع جدًا.
items.weapon.melee.gauntlet.ability_name=ضربة متتابعة
items.weapon.melee.gauntlet.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة متتابعة_ باستخدام القفاز الحجري. هذه الضربة مضمونة الإصابة، وتلحق عادةً _+%d من الضرر_ عن كل مرة أصابت فيها المبارزة عدوًا بهجوم عادي قريب أو بهجوم بسلاح مرمي. عدم إصابة أي هدف لمدة 5 أدوار يعيد ضبط هذه السلسلة.
items.weapon.melee.gauntlet.ability_desc=يمكن للمبارزة تنفيذ _ضربة متتابعة_ باستخدام القفاز الحجري. هذه الضربة مضمونة الإصابة، وتلحق _+%d من الضرر_ عن كل مرة أصابت فيها المبارزة عدوًا بهجوم عادي قريب أو بهجوم بسلاح مرمي. عدم إصابة أي هدف لمدة 5 أدوار يعيد ضبط هذه السلسلة.
items.weapon.melee.gauntlet.desc=هذا القفاز الضخم مصنوع من قماش قرمزي تعلوه طبقات من الحجر السحري الثقيل. وينكمش القماش حولك، مما يجعل الصفائح الحجرية السميكة أشبه بطبقة جلد ثانية. يتطلب تأرجح مثل هذا السلاح الثقيل قوة كبيرة، لكنه يضيف قوة هائلة إلى ضرباتك.

items.weapon.melee.glaive.name=مطرد
items.weapon.melee.glaive.stats_desc=هذا سلاح بطيء نسبيًا.\nلهذا السلاح مدى وصول إضافي.
items.weapon.melee.glaive.ability_name=طعن
items.weapon.melee.glaive.typical_ability_desc=يمكن للمبارزة استخدام طرف المطرد لـ_طعن_ عدو يقع ضمن المدى لكنه غير ملاصق. تلحق هذه الضربة عادةً _%1$d-%2$d من الضرر_، وتدفع العدو إلى الخلف، وهي مضمونة الإصابة.
items.weapon.melee.glaive.ability_desc=يمكن للمبارزة استخدام طرف المطرد لـ_طعن_ عدو يقع ضمن المدى لكنه غير ملاصق. تلحق هذه الضربة _%1$d-%2$d من الضرر_، وتدفع العدو إلى الخلف، وهي مضمونة الإصابة.
items.weapon.melee.glaive.desc=سلاح ذو مقبض طويل وضخم، يتكون من نصل سيف مثبت في نهاية عمود.

items.weapon.melee.gloves.name=قفازات مسننة
items.weapon.melee.gloves.stats_desc=هذا سلاح سريع جدًا.
items.weapon.melee.gloves.ability_name=ضربة متتابعة
items.weapon.melee.gloves.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة متتابعة_ باستخدام القفازات المسننة. هذه الضربة مضمونة الإصابة، وتلحق عادةً _+%d من الضرر_ عن كل مرة أصابت فيها المبارزة عدوًا بهجوم عادي قريب أو بهجوم بسلاح مرمي. عدم إصابة أي هدف لمدة 5 أدوار يعيد ضبط هذه السلسلة.
items.weapon.melee.gloves.ability_desc=يمكن للمبارزة تنفيذ _ضربة متتابعة_ باستخدام القفازات المسننة. هذه الضربة مضمونة الإصابة، وتلحق _+%d من الضرر_ عن كل مرة أصابت فيها المبارزة عدوًا بهجوم عادي قريب أو بهجوم بسلاح مرمي. عدم إصابة أي هدف لمدة 5 أدوار يعيد ضبط هذه السلسلة.
items.weapon.melee.gloves.desc=لا توفر هذه القفازات المسننة حماية حقيقية، لكنها تعمل كسلاح مناسب مع إبقاء اليدين حرتين.
items.weapon.melee.gloves.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.melee.greataxe.name=الفأس العظيم
items.weapon.melee.greataxe.stats_desc=هذا السلاح ثقيل للغاية.
items.weapon.melee.greataxe.ability_name=القصاص
items.weapon.melee.greataxe.typical_ability_desc=يمكن للمبارزة تنفيذ هجوم _القصاص_ باستخدام الفأس العظيم إذا كانت صحتها أقل من 50%%. تلحق هذه الضربة المدمرة عادةً _%1$d-%2$d من الضرر،_ وهي مضمونة الإصابة، وتنفذ فورًا إذا قتلت عدوًا.
items.weapon.melee.greataxe.ability_desc=يمكن للمبارزة تنفيذ هجوم _القصاص_ باستخدام الفأس العظيم إذا كانت صحتها أقل من 50%%. تلحق هذه الضربة المدمرة _%1$d-%2$d من الضرر،_ وهي مضمونة الإصابة، وتنفذ فورًا إذا قتلت عدوًا.
items.weapon.melee.greataxe.desc=صُمم هذا الفأس العملاق ليُستخدم فوق الكتف، وهو قوي بقدر ما هو ثقيل.

items.weapon.melee.greatshield.name=الدرع العظيم
items.weapon.melee.greatshield.typical_stats_desc=يصد هذا السلاح عادةً 0-%d من الضرر. ويتناسب هذا الحجب مع الترقيات.
items.weapon.melee.greatshield.stats_desc=يصد هذا السلاح 0-%d من الضرر. ويتناسب هذا الحجب مع الترقيات.
items.weapon.melee.greatshield.ability_name=حراسة
items.weapon.melee.greatshield.typical_ability_desc=يمكن للمبارزة _حراسة_ نفسها باستخدام الدرع العظيم، مما يلغي تمامًا جميع الهجمات الجسدية أو السحرية الموجهة إليها، عادةً لمدة _%d أدوار_. وبمجرد أن تصد المبارزة هجومًا، فإن الهجوم المضاد أو استخدام السحر سينهي الحراسة.
items.weapon.melee.greatshield.ability_desc=يمكن للمبارزة _حراسة_ نفسها باستخدام الدرع العظيم، مما يلغي تمامًا جميع الهجمات الجسدية أو السحرية الموجهة إليها لمدة _%d أدوار_. وبمجرد أن تصد المبارزة هجومًا، فإن الهجوم المضاد أو استخدام السحر سينهي الحراسة.
items.weapon.melee.greatshield.upgrade_ability_stat_name=مدة القدرة
items.weapon.melee.greatshield.desc=أقرب إلى جدار متحرك منه إلى درع، تساعد هذه الكتلة المعدنية الضخمة في الدفاع، لكنها لا تترك مساحة كبيرة للهجوم.

items.weapon.melee.greatsword.name=السيف العظيم
items.weapon.melee.greatsword.ability_name=شق
items.weapon.melee.greatsword.typical_ability_desc=يمكن للمبارزة _شق_ عدو باستخدام السيف العظيم. تلحق هذه الضربة عادةً _%1$d-%2$d من الضرر_ وهي مضمونة الإصابة. وإذا قتلت ضربة الشق عدوًا، فإنها تصبح فورية، ويمكن للمبارزة استخدام الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.greatsword.ability_desc=يمكن للمبارزة _شق_ عدو باستخدام السيف العظيم. تلحق هذه الضربة _%1$d-%2$d من الضرر_ وهي مضمونة الإصابة. وإذا قتلت ضربة الشق عدوًا، فإنها تصبح فورية، ويمكن للمبارزة استخدام الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.greatsword.desc=يلحق هذا النصل العملاق ضررًا هائلًا من خلال توظيف ثقله في كل ضربة.

items.weapon.melee.handaxe.name=فأس يدوي
items.weapon.melee.handaxe.stats_desc=هذا سلاح دقيق نسبيًا.
items.weapon.melee.handaxe.ability_name=ضربة ثقيلة
items.weapon.melee.handaxe.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام فأس يدوي. تلحق هذه الضربة المركزة عادةً _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
