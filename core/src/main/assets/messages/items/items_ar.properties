items.artifacts.timekeepershourglass.prompt=كيف تريد استخدام سحر الساعة الرملية؟\n\nأثناء السكون الزمني، سيمر الزمن بشكل طبيعي بينما تكون متجمدًا وغير قابل للإصابة تمامًا، ويستهلك ذلك ما يصل إلى شحنتين في المرة الواحدة.\n\nعند تجميد الزمن، يمكنك التحرك كما لو أن أفعالك لا تستغرق أي وقت. ويمكن تعطيل هذا التأثير في أي وقت باستخدام الساعة الرملية أو بمهاجمة أحدهم.
items.artifacts.timekeepershourglass.desc=تبدو هذه الساعة الرملية الكبيرة المزخرفة غير ملفتة للنظر إلى حد ما، لكنك تشعر بقوة هائلة في إطارها المنحوت بدقة. وعندما تدير الساعة الرملية وتشاهد الرمال وهي تتدفق، يمكنك أن تشعر بسحرها يشدك إليها. من المؤكد أن استخدام هذا السحر سيمنحك بعض السيطرة على الزمن.
items.artifacts.timekeepershourglass.desc_hint=يبدو أن الساعة الرملية فقدت بعض الرمل، ليتك تتمكن من العثور على بعضه...
items.artifacts.timekeepershourglass.desc_cursed=الساعة الرملية الملعونة مرتبطة بك، ويمكنك الشعور بأنها تحاول التلاعب بتدفق الزمن الخاص بك.
items.artifacts.timekeepershourglass$timefreeze.name=تجميد الزمن
items.artifacts.timekeepershourglass$timefreeze.desc=الزمن متجمد من حولك، مما يسمح لك بتنفيذ الأفعال فورًا. سيستمر التأثير حتى يتم إلغاؤه أو تنفد شحنة ساعتك الرملية. كما سيؤدي الهجوم أو استخدام السحر إلى كسر هذا التأثير.\n\nالأدوار المتبقية حتى استهلاك الشحنة: %s.
items.artifacts.timekeepershourglass$sandbag.name=كيس من الرمل السحري
items.artifacts.timekeepershourglass$sandbag.levelup=أضفت الرمل إلى ساعتك الرملية.
items.artifacts.timekeepershourglass$sandbag.maxlevel=امتلأت ساعتك الرملية بالرمل السحري!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=ليس لديك ساعة رملية تضع هذا الرمل فيها.
items.artifacts.timekeepershourglass$sandbag.desc=يجب أن يعمل هذا الكيس الصغير من الرمل الناعم بشكل مثالي مع ساعتك الرملية.\n\nمن الغريب أن يكون لدى صاحب المتجر هذا العنصر تحديدًا في اللحظة التي تحتاج إليه فيها...

