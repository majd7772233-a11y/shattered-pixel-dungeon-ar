items.artifacts.talismanofforesight.full_charge=تميمة الاستبصار مشحونة بالكامل!
items.artifacts.talismanofforesight.desc=حجر أملس يحمل نقوشًا غريبة. تشعر وكأنه يراقب كل شيء من حولك، ويبقي عينه مفتوحة بحثًا عن أي شيء مخفي.
items.artifacts.talismanofforesight.desc_worn=عندما تحمل التميمة، تشعر بأن حواسك أصبحت أكثر حدة. تتراكم شحنة التميمة ببطء مع مرور الوقت وعندما تكتشف أبوابًا مخفية أو أفخاخًا.\n\nيمكن للتميمة استهلاك شحنتها لاستخدام "الاستبصار" في شكل مخروط، مما يكشف جميع البلاطات والأسرار في المنطقة الممسوحة، كما يمنحك رؤية للأعداء والعناصر لفترة قصيرة.
items.artifacts.talismanofforesight.desc_cursed=التميمة الملعونة تحدق في داخلك باهتمام شديد، مما يضعف حواسك.
