items.waterskin.desc_water=تحتوي قربة الماء الآن على بعض ماء الشرب العادي. لا بد أن هناك شيئًا في الزنزانة يمكن للقربة تخزينه بدلًا منه.
items.waterskin.desc_heal=تُستخدم قربة الماء حاليًا لتخزين ماء علاجي. وكلما امتلأت القربة، زاد مقدار الشفاء الفوري الذي ستحصل عليه عند الشرب منها. وستشرب فقط الكمية التي تحتاج إليها.
items.waterskin.desc_full=تبدو قربة الماء الممتلئة وكأنها تشع بالطاقة، وربما يمكن استخدامها لتبريك عنصر بقاء آخر؟
items.waterskin.discover_hint=يبدأ أحد الأبطال بهذا العنصر.