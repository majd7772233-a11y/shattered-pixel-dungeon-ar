items.equipableitem.ac_unequip=إزالة التجهيز

items.energycrystal.name=بلورة طاقة
items.energycrystal.desc=مجموعة من البلورات السحرية الصغيرة المملوءة بالطاقة الكيميائية.\n\nهذه البلورات هي المكوّن الأكثر شيوعًا في وصفات الكيمياء، ويمكن إنتاجها في قدر الكيمياء عبر تفكيك العناصر القابلة للاستهلاك.

items.gold.name=ذهب
items.gold.desc=كومة من العملات الذهبية. اجمع العملات الذهبية لإنفاقها لاحقًا في متجر.

