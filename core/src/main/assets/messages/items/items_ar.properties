items.heap.tomb_desc=قد يحتوي هذا القبر القديم على شيء مفيد، لكن صاحبه سيعترض بالتأكيد على تفتيشه.
items.heap.skeleton=رفات هيكل عظمي
items.heap.skeleton_desc=هذا كل ما تبقى من مغامر سيئ الحظ. ربما يجدر بك التحقق من وجود أشياء ثمينة.
items.heap.remains=بقايا بطل
items.heap.remains_desc=هذا كل ما تبقى من أحد أسلافك. ربما يجدر بك التحقق من وجود أشياء ثمينة.

items.honeypot.name=وعاء عسل
items.honeypot.ac_shatter=تحطيم
items.honeypot.desc=هذا الوعاء الكبير للعسل ليس مبطنًا بالعسل فقط، بل يؤوي نحلة عملاقة! عادةً ما تبقى هذه النحل الضخمة داخل خلاياها، فربما يكون الوعاء نوعًا من قفص الصيادين المتخصص؟ تبدو النحلة مرتاحة داخل الوعاء مع عسلها، وتطن لك بحذر عندما تنظر إليها.
items.honeypot$shatteredpot.name=وعاء عسل محطّم
items.honeypot$shatteredpot.desc=تحطم الوعاء، ولم يعد يمسكه معًا سوى العسل اللزج الذي يغطي جدرانه، وهو يتفكك ببطء.\n\nرغم حالته المكسورة، لا تزال النحلة تبدو راغبة في حماية الوعاء.

items.item.prompt=اختر اتجاه الرمي
items.item.ac_drop=إسقاط
items.item.ac_throw=رمي
items.item.rankings_desc=قُتل بواسطة: %s
items.item.curse=لعنة
items.item.custom_note_type=لهذا النوع من العناصر ملاحظة مخصصة: "_%s_"
items.item.custom_note=لهذا العنصر ملاحظة مخصصة: "_%s_"
items.item.discover_hint=يمكنك العثور على هذا العنصر عشوائيًا في الزنزانة.

items.kindofmisc.unequip_title=أزل تجهيز عنصر واحد
items.kindofmisc.unequip_message=يجب أن تزيل تجهيز أحد هذه العناصر أولًا. اختر عنصرًا لتبديله.

items.kindofweapon.swift_equip=تجهز سلاحك بسرعة.
items.kindofweapon.equip_cursed=تنقبض قبضتك على السلاح دون إرادة منك.
items.kindofweapon.which_equip_msg=إلى أي خانة سلاح تريد تجهيز هذا العنصر؟\n\nتهاجم البطلة مباشرةً باستخدام سلاحها الأساسي، لكنها تستطيع استخدام قدرة أي من السلاحين. ويتشارك السلاحان عدد الشحنات نفسه.\n\nيمكن للبطلة أيضًا تبديل سلاحها الأساسي والثانوي فورًا.
items.kindofweapon.which_equip_primary=أساسي (%s)
items.kindofweapon.which_equip_secondary=ثانوي (%s)
items.kindofweapon.empty=فارغ

items.kingscrown.name=تاج ملك الأقزام
items.kingscrown.ac_wear=ارتداء
items.kingscrown.naked=للأسف، لا يستطيع التاج تغيير ملابسك الداخلية.
items.kingscrown.upgraded=يتوهج التاج بشدة ثم يتلاشى بينما يتحول درعك!
items.kingscrown.ratgraded=تتوهج مخالب ملك الجرذان بشدة بينما يتحول درعك!
items.kingscrown.desc=تاج آخر ملوك الأقزام، يشع بطاقة سحرية هائلة.\n\nعند ارتدائه، سيتدفق سحر التاج إلى الدرع الذي ترتديه حاليًا، محولًا إياه إلى _درع ملحمي فريد بقدرات خاصة._ وسيحتفظ الدرع الجديد بجميع خصائص الدرع الأصلي.
items.kingscrown.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من بعض الأعداء.

items.liquidmetal.name=معدن سائل
items.liquidmetal.ac_apply=تطبيق
items.liquidmetal.prompt=اختر سلاحًا مرميًا
items.liquidmetal.already_fixed=ذلك السلاح المرمي في حالة مثالية بالفعل!
items.liquidmetal.apply=تستخدم %d من المعدن السائل لإصلاح سلاحك المرمي.
items.liquidmetal.desc=يمكن لهذا السائل السحري ملء الشقوق والتمزقات في السلاح المرمي، وإعادته إلى حالة مثالية! وإذا كانت مجموعة من الأسلحة تفتقد سلاحًا واحدًا لكنها مُصلحة بالكامل بخلاف ذلك، فيمكن استخدام المعدن السائل حتى لاستبدال السلاح المفقود من المجموعة!\n\nيتطلب سلاح من المرتبة 1 مقدار 10 من المعدن السائل لإصلاحه بالكامل، بينما يتطلب سلاح من المرتبة 5 مقدار 30. وتزيد كل ترقية أيضًا كمية المعدن المطلوبة بنسبة 35%%.\n\nلا يمكن استخدام المعدن السائل لإصلاح رؤوس الأسهم المغموسة.
items.liquidmetal.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.lostbackpack.name=حقيبة ظهر مفقودة
items.lostbackpack.desc=هذه هي أغراضك المفقودة. التقطها لاستعادة جميع العناصر التي فقدتها!

items.merchantsbeacon.name=منارة التاجر
items.merchantsbeacon.ac_use=استخدام
items.merchantsbeacon.desc=تتيح لك هذه القطعة الغريبة من تكنولوجيا الأقزام التواصل من مسافات بعيدة.\n\nبعد تفعيلها، ستسمح لك هذه المنارة ببيع العناصر إلى متجر بيكسل من أي مكان في الزنزانة.\n\nلكن السحر الموجود داخل المنارة سيدوم لجلسة واحدة فقط، لذا استخدمها بحكمة.

items.stylus.name=قلم كتابة سحري
items.stylus.ac_inscribe=نقش
items.stylus.prompt=اختر درعًا
items.stylus.identify=يجب أن تحدد أولًا ما إذا كان ذلك الدرع ملعونًا.
items.stylus.cursed=لن يعمل سحر القلم على درع ملعون.
items.stylus.inscribed=نقشت درعك باستخدام القلم السحري.
items.stylus.desc=صُنع قلم الكتابة السحري هذا من حجر داكن شديد الصلابة. يمكنك استخدامه لنقش رمز سحري على درعك، لكن لا يمكنك التحكم في نوع النقش الذي سيُختار؛ فالقلم هو من سيقرره نيابةً عنك.

items.tengusmask.name=قناع تينغو
items.tengusmask.ac_wear=ارتداء
items.tengusmask.used=يتلاشى القناع بينما تتدفق قوته إليك!
items.tengusmask.desc=سقط هذا القناع عن وجه تينغو عندما مات، ويمكنك الشعور بقوة سحرية هائلة تنبعث منه. هل كان القناع مصدر قوة تينغو؟\n\nعند ارتدائه، ستنتقل قوته الهائلة إليك، مما يمكّنك من _اختيار فئة فرعية لبطلِك._\n\nأي فئة فرعية ستختار؟
