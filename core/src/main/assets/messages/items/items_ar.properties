items.scrolls.scroll$placeholder.name=لفافة

items.scrolls.inventoryscroll.warning=هل تريد حقًا إلغاء استخدام هذه اللفافة؟ لم يتم تحديدها مسبقًا، لذا سيتم استهلاكها على أي حال.
items.scrolls.inventoryscroll.yes=نعم، أنا متأكد تمامًا
items.scrolls.inventoryscroll.no=لا، لقد غيّرت رأيي

items.scrolls.scrollofidentify.name=لفافة التعرف
items.scrolls.scrollofidentify.inv_title=تعرّف على عنصر
items.scrolls.scrollofidentify.it_is=تم التعرف على عنصرك: %s.
items.scrolls.scrollofidentify.desc=تكشف هذه اللفافة بشكل دائم جميع أسرار عنصر واحد.

items.scrolls.scrolloflullaby.name=لفافة التهويدة
items.scrolls.scrolloflullaby.sooth=تطلق اللفافة لحنًا مهدئًا. تشعر بالنعاس الشديد.
items.scrolls.scrolloflullaby.desc=تطلق قراءة هذه اللفافة لحنًا مهدئًا يجعل كل من يسمعه يدخل في نوم سحري عميق. وبالنسبة للقارئ وحلفائه، يكون النوم مستعيدًا للطاقة.

items.scrolls.scrollofmagicmapping.name=لفافة رسم الخريطة السحرية
items.scrolls.scrollofmagicmapping.layout=أصبحت الآن على دراية بتخطيط الطابق.
items.scrolls.scrollofmagicmapping.desc=عند قراءة هذه اللفافة، ستُنقش في ذاكرتك صورة شديدة الوضوح، تكشف لك التخطيط الدقيق للطابق وجميع الأسرار المخفية. وستظل مواقع العناصر والمخلوقات مجهولة.

items.scrolls.scrollofmirrorimage.name=لفافة الصورة المرآوية
items.scrolls.scrollofmirrorimage.copies=تشكل اللفافة صورًا مرآوية منك.
items.scrolls.scrollofmirrorimage.no_copies=تحاول اللفافة إنشاء صور مرآوية منك، لكن لا يوجد مكان لها.
items.scrolls.scrollofmirrorimage.desc=ستنشئ التعويذة الموجودة في هذه اللفافة شبيهين وهميين للقارئ. تعمل هذه الصور المرآوية كنسخ أضعف من القارئ، وستطارد أعداءها. لكنها لا تمتلك متانة، وستتلاشى عند تلقي الضرر.

items.scrolls.scrollofretribution.name=لفافة القصاص
items.scrolls.scrollofretribution.blast=تنفجر من اللفافة طاقة سحرية مدمرة!
items.scrolls.scrollofretribution.desc=تحتوي هذه اللفافة على طاقة مدمرة توجه معاناة القارئ إلى الخارج على شكل انفجار من القوة. وكلما كان القارئ أضعف، زاد الضرر الذي سيلحقه. وعند امتلاك صحة منخفضة جدًا، يمكن لهذه اللفافة قتل معظم الأعداء فورًا.\n\nلكن استخدام اللفافة له ثمن على المستخدم، إذ يصيبه بالعمى ويضعفه.

items.scrolls.scrollofrage.name=لفافة الغضب
items.scrolls.scrollofrage.roar=تطلق اللفافة زئيرًا مثيرًا للغضب يتردد في أرجاء الزنزانة!
items.scrolls.scrollofrage.desc=عند تلاوتها بصوت عالٍ، ستطلق هذه اللفافة زئيرًا هائلًا يجذب جميع الأعداء إلى القارئ، ويثير غضب الأعداء القريبين.

items.scrolls.scrollofrecharging.name=لفافة إعادة الشحن
items.scrolls.scrollofrecharging.surge=تتدفق موجة من الطاقة عبر جسدك، فتنعش عصاك السحرية!
items.scrolls.scrollofrecharging.desc=ستشحن القوة السحرية الخام المرتبطة بهذا الرق جميع عصي المستخدم السحرية بمرور الوقت عند إطلاقها.

items.scrolls.scrollofremovecurse.name=لفافة إزالة اللعنة
items.scrolls.scrollofremovecurse.inv_title=طهِّر عنصرًا
items.scrolls.scrollofremovecurse.cleansed=يتوهج عنصرك بنور مطهّر، وتتبدد طاقة خبيثة!
items.scrolls.scrollofremovecurse.not_cleansed=يتوهج عنصرك بنور مطهّر، لكن لا يحدث شيء.
items.scrolls.scrollofremovecurse.spirit=تحرر لفافتك الروح المعذبة!
items.scrolls.scrollofremovecurse.desc=ستنزع التعويذة الموجودة في هذه اللفافة فورًا أي لعنات من سلاح واحد أو خاتم أو عصا سحرية أو درع أو قطعة أثرية.

items.scrolls.scrollofteleportation.name=لفافة الانتقال الآني
items.scrolls.scrollofteleportation.tele=في غمضة عين، انتقلت آنيًا إلى موقع آخر من الطابق.
items.scrolls.scrollofteleportation.no_tele=يفشل سحر الانتقال الآني.
items.scrolls.scrollofteleportation.cant_reach=لا يمكنك الانتقال آنيًا إلى هناك.
items.scrolls.scrollofteleportation.prompt=اختر موقعًا للانتقال إليه
items.scrolls.scrollofteleportation.desc=تنقل التعويذة الموجودة على هذا الرق القارئ فورًا إلى موقع مختلف في مستوى الزنزانة. تعطي اللفافة الأولوية للمناطق التي لم يزرها القارئ من قبل، لكنها لا تستطيع نقله عبر الأبواب المقفلة أو المتاريس. ومع ذلك، يمكنها كشف الأبواب المخفية التي تؤدي إلى مناطق جديدة.

items.scrolls.scrollofterror.name=لفافة الرعب
items.scrolls.scrollofterror.none=تطلق اللفافة وميضًا ساطعًا من الضوء الأحمر.
items.scrolls.scrollofterror.one=تطلق اللفافة وميضًا ساطعًا من الضوء الأحمر، فيهرب %s!
items.scrolls.scrollofterror.many=تطلق اللفافة وميضًا ساطعًا من الضوء الأحمر، وتهرب الوحوش!
items.scrolls.scrollofterror.desc=عند قراءتها، ستطلق هذه اللفافة وميضًا من الضوء الأحمر يغمر جميع الأعداء في مجال رؤيتك بالرعب، فيستديرون ويهربون. ستؤدي مهاجمة عدو هارب إلى تقصير مدة التأثير.

items.scrolls.scrolloftransmutation.name=لفافة التحويل
items.scrolls.scrolloftransmutation.inv_title=حوّل عنصرًا
items.scrolls.scrolloftransmutation.nothing=لا يحدث شيء مثير للاهتمام.
items.scrolls.scrolloftransmutation.morph=يتحول عنصرك إلى شيء مختلف!
items.scrolls.scrolloftransmutation.desc=تحتوي هذه اللفافة على سحر تحويل قوي. عند استخدامها على عنصر مؤهل، ستحوله إلى عنصر آخر من النوع نفسه. وسيحافظ السحر حتى على الترقيات والتعويذات والنقوش. وستتحول اللفائف والجرعات إلى نظيراتها الغريبة، والعكس صحيح.

items.scrolls.scrollofupgrade.name=لفافة الترقية
items.scrolls.scrollofupgrade.inv_title=رقِّ عنصرًا
items.scrolls.scrollofupgrade.weaken_curse=تُضعف لفافة الترقية اللعنة على عنصرك.
items.scrolls.scrollofupgrade.remove_curse=تطهّر لفافة الترقية اللعنة عن عنصرك!
items.scrolls.scrollofupgrade.desc=سترقّي هذه اللفافة عنصرًا واحدًا أو مجموعة من الأسلحة المرمية. وستزداد قوة العصا السحرية وعدد شحناتها، وستلحق الأسلحة والدروع ضررًا أكبر وتصد ضررًا أكبر، وستُصلح مجموعات الأسلحة المرمية بالكامل وتصبح أكثر متانة، وستزداد قوة تأثيرات الخواتم.\n\nكما يمكنها إضعاف اللعنات أو تبديدها تمامًا في بعض الأحيان، رغم أنها ليست بقوة لفافة إزالة اللعنة. وللأسف، يمكن لسحر الترقية أيضًا محو التعويذات أو النقوش من المعدات ذات المستوى المرتفع.

