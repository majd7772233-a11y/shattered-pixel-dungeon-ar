items.artifacts.sandalsofnature.desc_1=ما يبدو في البداية كصنادل مصنوعة من خيوط نباتية هما في الواقع نبتتان! تبدوان ضعيفتين وشاحبتين جدًا، وربما تحتاجان إلى بعض العناصر الغذائية؟
items.artifacts.sandalsofnature.desc_2=لقد نمت الأحذية وأصبحت الآن أقرب في شكلها إلى حذاءين مصممين بعناية. وقد عاد إليهما بعض اللون، فربما لا يزال بإمكانهما النمو أكثر؟
items.artifacts.sandalsofnature.desc_3=نمت النبتتان مرة أخرى، وأصبحتا الآن تشبهان زوجًا من الأحذية المتينة المصنوعة من اللحاء. ويبدو أن النباتات استعادت قوتها، لكن ربما لا يزال بإمكانها النمو أكثر؟
items.artifacts.sandalsofnature.desc_4=يبدو أن النباتات قد وصلت إلى أقصى حجم لها، وأصبحت تشبه زوجًا من واقيات الساق المدرعة. لون الواقيات بني داكن وتشبهان شجرة شديدة المتانة.
items.artifacts.sandalsofnature.desc_hint=تشعر بأنك أكثر انسجامًا مع الطبيعة أثناء ارتداء هذه القطعة الأثرية.
items.artifacts.sandalsofnature.desc_cursed=الصنادل الملعونة تمنع أي انسجام مع الطبيعة.
items.artifacts.sandalsofnature.desc_ability=تتموج الأحذية بلون آخر بذرة أطعمتها لهما. ويمكنهما أن تتجذرا في الأرض لفترة وجيزة وتنتجا تأثير تلك النبتة في أي مكان ضمن نصف قطر قدره 3 بلاطات.\nالبذرة: _%s_\nالشحنة المطلوبة: _%d%%_
