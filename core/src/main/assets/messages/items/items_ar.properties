items.artifacts.skeletonkey.discard=تتخلص من مفاتيحك الزائدة.
items.artifacts.skeletonkey.levelup=أصبح مفتاح الهيكل العظمي أقوى!
items.artifacts.skeletonkey.desc=مفتاح ذو مظهر مهم، رأسه على شكل جمجمة. ويبدو أن أسنانه تختلف في كل مرة تنظر إليها.
items.artifacts.skeletonkey.desc_worn=يبدو أن هذا المفتاح السحري يكتسب القوة كلما استخدمته بدلًا من مفاتيح الزنزانة العادية. ويمكن إدخاله في معظم أقفال الزنزانة لفتحها أو إغلاقها، حتى الأبواب التي لم تكن مقفلة من قبل.\n\nيمكن استخدام المفتاح حتى على مساحة فارغة في اتجاه مستقيم أو قطري لـ"قفل" الهواء أمامك، وإنشاء جدار صلب بعرض 3 بلاطات يستمر لمدة 10 أدوار. سيؤدي القفل إلى دفع الأعداء بعيدًا إذا كانت هناك مساحة تسمح بذلك.
items.artifacts.skeletonkey.desc_cursed=يبدو أن المفتاح الملعون يتعمد تجنب الدخول في أي قفل، بل ويجعل استخدام مفاتيحك الأخرى أكثر صعوبة (لكن ليس مستحيلًا).
items.artifacts.skeletonkey$keywall.desc=تم إنشاء جدار سحري مؤقت هنا بواسطة مفتاح الهيكل العظمي.

