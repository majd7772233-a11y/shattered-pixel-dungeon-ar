items.artifacts.driedrose$ghosthero.hello=مرحبًا مجددًا %s.
items.artifacts.driedrose$ghosthero.introduce=روحي مرتبطة بهذه الوردة، وكانت عزيزة جدًا عليّ، هدية من حبيبي الذي تركته على السطح.\n\nلا أستطيع العودة إليه، لكن بفضلك أتيحت لي فرصة ثانية لإكمال رحلتي. وعندما أستطيع، سأجيب على ندائك وأقاتل إلى جانبك.\n\nما دمت تملك الوردة، يمكنني سماع صوتك، لذا يمكنك استخدامها لتوجيهي من بعيد.\n\nآمل أن تنجح حيث فشلت أنا...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=كانت هذه المجاري آمنة في السابق، وكان الناس حتى يعيشون هنا في الشتاء.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=أتساءل عما حدث لدوريات الحرس، هل استسلموا؟
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=كان لدي عائلة على السطح، آمل أن يكونوا بخير.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=لم يستطع الحرس هزيمة هذه الوحوش، لكن ربما نستطيع نحن ذلك.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=إذا كانت المجاري خطيرة إلى هذا الحد، أتساءل عما يوجد في الأسفل...
