items.artifacts.driedrose$wndghosthero.title=معدات الشبح
items.artifacts.driedrose$wndghosthero.desc=الشبح ضعيف بمفرده، لكن هيئته متماسكة بما يكفي ليتجهز بسلاح ودرع. وسيتمكن من استخدام هذه العناصر تمامًا كما تفعل أنت.\n\nيمكن للشبح حاليًا تجهيز عناصر تتطلب ما يصل إلى _%d من القوة._
