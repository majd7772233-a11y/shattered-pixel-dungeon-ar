items.artifacts.masterthievesarmband.desc=يحمل هذا السوار المخملي الأرجواني علامة سيد اللصوص. هذا السوار ليس ملكًا لك، لكنه على الأرجح لم يكن ملكًا لمستخدمه السابق أيضًا.
items.artifacts.masterthievesarmband.desc_cursed=السوار الملعون مرتبط بمعصمك، وبطريقة ما يبدو أن كيسك الذهبي يزداد خفةً ببطء...
items.artifacts.masterthievesarmband.desc_worn=تشعر بقوة تتجمع في السوار حول معصمك كلما اكتسبت الخبرة. يمكنك استخدام هذه القوة للسرقة من المتاجر، أو لنهب الأعداء!\n\nتحدث عملية نهب الأعداء فورًا، وتربكهم لفترة وجيزة، وتمنحك فرصة للحصول على أي غنائم بحوزتهم! تكون هذه القوة أكثر فعالية ضد الأعداء غير المنتبهين. ولا يمنح نهب العدو نفسه عدة مرات فرصًا إضافية للحصول على الغنائم.

