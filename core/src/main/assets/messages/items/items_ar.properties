items.artifacts.cloakofshadows$cloakstealth.name=متخفٍ
items.artifacts.cloakofshadows$cloakstealth.desc=تمنحك عباءة الظلال الاختفاء أثناء تغطيتك بها. ستظل متخفيًا حتى يتم إلغاء التأثير أو تنفد شحنة عباءتك.\n\nأثناء اختفائك، لا تستطيع الأعداء مهاجمتك أو تتبعك. وستؤدي الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) إلى إلغاء الاختفاء فورًا.\n\nالأدوار المتبقية حتى استهلاك الشحنة: %d.

