### لعنات الدروع
items.armor.curses.antientropy.name=%s ضد الإنتروبيا
items.armor.curses.antientropy.desc=تعمل لعنة مضادة للإنتروبيا ضد قوى الكون، فتسحب الطاقة إلى مرتديها بعيدًا عن محيطه. يؤدي ذلك إلى اشتعال مرتدي الدرع بالنار لفترة وجيزة، لكنه يجمّد كل شيء من حوله!

items.armor.curses.bulk.name=%s الضخم
items.armor.curses.bulk.desc=يبدو الدرع الضخم أكبر وأكثر إثارة للرهبة، لكنه لا يوفر حماية إضافية فعلية. والأسوأ من ذلك أن حجمه الإضافي يجعل المرور عبر المداخل أمرًا صعبًا للغاية.

items.armor.curses.corrosion.name=%s المتآكل
items.armor.curses.corrosion.desc=يمكن لدرع التآكل أن ينفجر بسائل أكّال، يغطي كل شيء في المنطقة بطبقة لزجة من الوحل الحمضي.

items.armor.curses.displacement.name=%s ذو الإزاحة
items.armor.curses.displacement.desc=تحاول لعنة الإزاحة نقل مرتدي الدرع إلى مكان آمن عند تعرضه للهجوم. لكنها فعّالة أكثر مما ينبغي، إذ تقوم بنقل المستخدم عشوائيًا عبر أرجاء الطابق.

items.armor.curses.metabolism.name=%s ذو الأيض
items.armor.curses.metabolism.desc=تحوّل لعنة الأيض الشبع مباشرةً إلى صحة عندما يُصاب مرتديها، مما يوفر دفعة من التعافي، لكنه يتسبب سريعًا في الجوع.

items.armor.curses.multiplicity.name=%s ذو التعدد
items.armor.curses.multiplicity.desc=يحتوي الدرع الملعون بالتعدد على سحر نسخ خطير. فهو ينشئ أحيانًا نسخة شبيهة بمرتدي الدرع، لكنه من المحتمل بالقدر نفسه أن ينسخ المهاجم!

items.armor.curses.overgrowth.name=%s ذو النمو المفرط
items.armor.curses.overgrowth.desc=يكون درع النمو المفرط مغطىً بمختلف النباتات المتفتحة. ورغم أن هذا التأثير يبدو مثيرًا للاهتمام بالتأكيد، فإنه لا يقدم أي فائدة دفاعية، كما أن هذه النباتات ستنشط عشوائيًا أثناء القتال!

items.armor.curses.stench.name=%s ذو الرائحة الكريهة
items.armor.curses.stench.desc=يطلق الدرع الملعون بالرائحة الكريهة سحبًا من الغاز الضار، وهو خطر على كل من يقع داخل السحابة.


### النقوش
items.armor.glyphs.affection.name=%s ذو المودة
items.armor.glyphs.affection.desc=يتلاعب هذا النقش القوي بعقول المهاجمين، فيجعلهم مسحورين لفترة مؤقتة.

items.armor.glyphs.antimagic.name=%s المضاد للسحر
items.armor.glyphs.antimagic.desc=يسمح هذا النقش القوي للدرع بحماية مرتديه من الهجمات السحرية، بالإضافة إلى الهجمات الجسدية. ولا يتأثر هذا الدفاع السحري بمرتبة الدرع.

items.armor.glyphs.brimstone.name=%s ذو الكبريت
items.armor.glyphs.brimstone.desc=يحمي هذا النقش مرتدي الدرع وممتلكاته من النار، ويلغي ضررها وتأثيراتها السلبية بالكامل.

items.armor.glyphs.camouflage.name=%s المموّه
items.armor.glyphs.camouflage.desc=يسمح هذا النقش لمرتدي الدرع بالاندماج مع العشب الطويل، مما يمنحه اختفاءً مؤقتًا.

items.armor.glyphs.entanglement.name=%s ذو التشابك
items.armor.glyphs.entanglement.desc=ينمّي هذا النقش درعًا ترابيًا حول مرتديه لامتصاص الضرر، لكن هذا الدرع سيتحطم إذا تحرك مرتديه.

items.armor.glyphs.flow.name=%s ذو التدفق
items.armor.glyphs.flow.desc=يتحكم هذا النقش في تدفق المياه حول مرتديه، مما يجعله أسرع بكثير عند التحرك داخلها.

items.armor.glyphs.obfuscation.name=%s ذو التمويه
items.armor.glyphs.obfuscation.desc=يطمس هذا النقش ملامح مرتدي الدرع، مما يجعل اكتشافه أكثر صعوبة.

items.armor.glyphs.potential.name=%s ذو الكامن
items.armor.glyphs.potential.desc=يولّد هذا النقش طاقة عند تلقي الضربات، ويمنح عصا مرتدي الدرع شحنة عند تنشيطه.

items.armor.glyphs.repulsion.name=%s ذو التنافر
items.armor.glyphs.repulsion.desc=يرد هذا النقش القوة على المهاجمين، دافعًا إياهم إلى الخلف.

items.armor.glyphs.stone.name=%s الحجري
items.armor.glyphs.stone.desc=يحيط هذا النقش الدرع بحجر سحري ثقيل يجعل المراوغة مستحيلة، لكنه يمنع الضرر بما يتناسب مع قيمة التهرب.

items.armor.glyphs.swiftness.name=%s ذو الرشاقة
items.armor.glyphs.swiftness.desc=يعزز هذا النقش سرعة مرتدي الدرع كلما لم يكن بالقرب من عدو.

items.armor.glyphs.thorns.name=%s ذو الأشواك
items.armor.glyphs.thorns.desc=يؤذي هذا النقش القوي المهاجمين، مما يجعلهم ينزفون ببطء عند مهاجمة مرتدي الدرع.

items.armor.glyphs.viscosity.name=%s ذو اللزوجة
items.armor.glyphs.viscosity.deferred=مؤجل %d
items.armor.glyphs.viscosity$defereddamage.name=ضرر مؤجل
items.armor.glyphs.viscosity$defereddamage.ondeath=لقد قتلك الضرر المؤجل...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=قُتل بسبب الضرر المؤجل
items.armor.glyphs.viscosity$defereddamage.desc=يتم إلحاق الضرر تدريجيًا بمرور الوقت بدلًا من إلحاقه فورًا.\n\nالضرر المؤجل المتبقي: %d.
items.armor.glyphs.viscosity.desc=يمكن لهذا النقش تخزين الضرر الذي يتلقاه مرتدي الدرع، ثم إلحاقه به تدريجيًا بدلًا من إلحاقه دفعة واحدة.



### الدروع
items.armor.armor.ac_detach=فصل
items.armor.armor.detach_seal=لقد فصلت الختم عن درعك.
items.armor.armor.equip_cursed=ينقبض الدرع حولك بشكل مؤلم.
items.armor.armor.identify=أصبحت الآن معتادًا بما يكفي على درعك لتتمكن من تحديد ماهيته.
items.armor.armor.hardening_gone=لقد زال تدعيم هذا الدرع!
items.armor.armor.incompatible=لقد أدى تفاعل أنواع السحر المختلفة إلى محو النقش الموجود على هذا الدرع!
items.armor.armor.curr_absorb=هذا الدرع من _المرتبة %1$d_ يصد _%2$d-%3$d من الضرر_ ويتطلب _%4$d من القوة_ لاستخدامه بشكل صحيح.
items.armor.armor.avg_absorb=عادةً ما يصد هذا الدرع من _المرتبة %1$d_ _%2$d-%3$d من الضرر_ ويتطلب _%4$d من القوة_ لاستخدامه بشكل صحيح.
items.armor.armor.too_heavy=بسبب عدم كفاية قوتك، سيؤدي ارتداء هذا الدرع إلى تقليل قدرتك على الحركة والمراوغة والدفاع.
items.armor.armor.probably_too_heavy=ربما يكون هذا الدرع ثقيلًا جدًا عليك.
items.armor.armor.excess_str=بفضل قوتك الزائدة، أصبحت _أكثر قدرة على المراوغة_ أثناء ارتداء هذا الدرع.
items.armor.armor.evasion=لقد تم تعزيزه لتحسين _التهرب._
items.armor.armor.defense=لقد تم تعزيزه لتحسين _الدفاع._
items.armor.armor.inscribed=منقوش عليه _%s._
items.armor.armor.glyph_hardened=لقد تم _تدعيمه._
items.armor.armor.hardened_no_glyph=لقد تم _تدعيم_ هذا الدرع، لكنه لا يحمل حاليًا أي نقش.
items.armor.armor.cursed_worn=لأن هذا الدرع ملعون، فأنت عاجز عن خلعه.
items.armor.armor.cursed=يمكنك الشعور بسحر خبيث يتربص داخل هذا الدرع.
items.armor.armor.weak_cursed=رغم اللعنة، يمكنك خلع هذا الدرع.
items.armor.armor.not_cursed=هذا الدرع خالٍ من السحر الخبيث.
items.armor.armor.seal_attached=الختم المكسور للمحارب مثبت بهذا الدرع. عندما يكون على وشك التعرض للضرر بينما تكون صحته أقل من النصف، سيمنحه _%d من الحماية_.
items.armor.armor.seal_transfer=يجب تثبيت الختم المكسور للمحارب على الدرع الذي يرتديه حاليًا لكي يستفيد منه. هل تريد فصل الختم تلقائيًا عن الدرع الذي تخلعه وتثبيته على الدرع الذي ترتديه؟
items.armor.armor.seal_transfer_yes=نعم
items.armor.armor.seal_transfer_no=لا
items.armor.armor$glyph.glyph=نقش
items.armor.armor$glyph.killed=%s قتلك...
items.armor.armor$glyph.rankings_desc=قُتل بسبب نقش
items.armor.armor$glyph.discover_hint=يمكنك العثور على عنصر يحمل هذا التأثير عشوائيًا في الزنزانة، أو حاول تطبيقه على عنصر بنفسك.

items.armor.classarmor.ac_ability=اختر قدرة
items.armor.classarmor.ac_transfer=نقل
items.armor.classarmor.no_ability=لا يمتلك درعك حاليًا أي قدرة، يجب أن تختار واحدة!
items.armor.classarmor.not_equipped=يجب أن تكون مرتديًا هذا الدرع لاستخدام قوته الخاصة!
items.armor.classarmor.low_charge=لا يمتلك الدرع شحنة كافية لاستخدام قوته الخاصة!
items.armor.classarmor.charge_use=سيؤدي استخدام القدرة الآن إلى استهلاك _%s_ من الشحنة.
items.armor.classarmor.transfer_title=نقل الدرع
items.armor.classarmor.transfer_desc=يمكن نقل سحر تاج ملك الأقزام إلى مجموعة أخرى من الدروع. لاحظ أن الدرع الأصلي سيتم تدميره أثناء العملية.
items.armor.classarmor.transfer_prompt=اختر درعًا
items.armor.classarmor.transfer_cancel=إلغاء
items.armor.classarmor.transfer_complete=تم نقل خصائص درعك البطولي!
items.armor.classarmor.discover_hint=يمكنك العثور على هذا العنصر بعد هزيمة زعيم الطابق 20 ببطل معين.

items.armor.clericarmor.name=ثياب البطل
items.armor.clericarmor.desc=عند ارتداء هذا المزيج من القماش والدروع المعدنية، يستطيع الكاهن استخدام قدرة خاصة.

items.armor.clotharmor.name=درع قماشي
items.armor.clotharmor.desc=يوفر هذا الدرع الخفيف حماية أساسية.
items.armor.clotharmor.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.armor.duelistarmor.name=درع صدر البطل
items.armor.duelistarmor.desc=عند ارتداء هذا الدرع المعدني والعباءة، يستطيع المبارز استخدام قدرة خاصة.

items.armor.huntressarmor.name=عباءة البطل
items.armor.huntressarmor.no_enemies=لا يوجد أعداء في مرمى النظر
items.armor.huntressarmor.desc=عند ارتداء هذه العباءة، تستطيع الصيادة استخدام قدرة خاصة.

items.armor.leatherarmor.name=درع جلدي
items.armor.leatherarmor.desc=درع مصنوع من جلد وحوش مدبوغ. ليس خفيفًا مثل الدرع القماشي، لكنه يوفر حماية أفضل.

items.armor.magearmor.name=رداء البطل
items.armor.magearmor.desc=عند ارتداء هذا الرداء الرائع، يستطيع الساحر استخدام قدرة خاصة.

items.armor.mailarmor.name=درع حلقات معدنية
items.armor.mailarmor.desc=توفر الحلقات المعدنية المتشابكة درعًا متينًا ومرنًا في الوقت نفسه.

items.armor.platearmor.name=درع صفائحي
items.armor.platearmor.desc=تُجمع صفائح معدنية ضخمة معًا لتشكّل درعًا يوفر حماية لا مثيل لها لأي مغامر يتمتع بالقوة الكافية لتحمل وزنه الهائل.

items.armor.roguearmor.name=زي البطل
items.armor.roguearmor.desc=عند ارتداء هذا الزي الداكن، يستطيع اللص استخدام قدرة خاصة.

items.armor.scalearmor.name=درع صفائحي متداخل
items.armor.scalearmor.desc=تُشكّل الصفائح المعدنية المخيطة على سترة جلدية درعًا مرنًا وواقيًا في آن واحد.

items.armor.warriorarmor.name=درع البطل الصفائحي
items.armor.warriorarmor.desc=عند ارتداء هذا الدرع الثقيل المكوّن من الصفائح، يستطيع المحارب استخدام قدرة خاصة.



### القطع الأثرية
items.artifacts.alchemiststoolkit.name=عدة الكيميائي
items.artifacts.alchemiststoolkit.ac_brew=تحضير
items.artifacts.alchemiststoolkit.ac_energize=شحن
items.artifacts.alchemiststoolkit.not_ready=لم تنتهِ عدتك من التسخين بعد.
items.artifacts.alchemiststoolkit.cursed=تمنعك عدتك الملعونة من استخدام الكيمياء!
items.artifacts.alchemiststoolkit.need_energy=تحتاج إلى 6 وحدات من الطاقة على الأقل للقيام بذلك.
items.artifacts.alchemiststoolkit.energize_desc=كل 6 بلورات طاقة تمنح العدة طاقة كافية لاكتساب مستوى، مما يزيد من معدل توليدها للطاقة بمرور الوقت، ويسرّع تسخينها.\n\nما مقدار الطاقة التي تريد استخدامها؟
items.artifacts.alchemiststoolkit.energize_1=6 طاقة: +1 مستوى
items.artifacts.alchemiststoolkit.energize_all=%1$d طاقة: +%2$d مستويات
items.artifacts.alchemiststoolkit.desc=تحتوي هذه العدة على عدد من الكواشف والأعشاب إلى جانب قارورة خلط صغيرة، مما يسمح بإجراء الكيمياء أثناء التنقل. تحتوي القارورة على ما يبدو أنه بلورات طاقة كيميائية في صورة سائلة.
items.artifacts.alchemiststoolkit.desc_cursed=لقد ربطت العدة الملعونة نفسها بجانبك، وترفض السماح لك باستخدام الكيمياء.
items.artifacts.alchemiststoolkit.desc_warming=العدة قيد التسخين حاليًا، وستصبح جاهزة للاستخدام بعد قليل.
items.artifacts.alchemiststoolkit.desc_hint=تولّد العدة المجهزة طاقة كيميائية ببطء كلما اكتسبت الخبرة. ويبدو أن الخليط الموجود في القارورة يمكن تحسينه بإضافة بلورات الطاقة إليه.

items.artifacts.artifact.cannot_wear_two=لا يمكنك ارتداء اثنتين من القطعة الأثرية نفسها.
items.artifacts.artifact.equip_cursed=ترتبط القطعة الأثرية الملعونة بك بشكل مؤلم.
items.artifacts.artifact.curse_known=يمكنك الشعور بسحر خبيث يتربص داخل القطعة الأثرية.
items.artifacts.artifact.not_cursed=هذه القطعة الأثرية خالية من السحر الخبيث.
items.artifacts.artifact.need_to_equip=يجب أن تجهز قطعتك الأثرية للقيام بذلك.

items.artifacts.capeofthorns.name=عباءة الأشواك
items.artifacts.capeofthorns.desc=تشكلت هذه الصفائح المعدنية المنهارة من DM-300 معًا لتصبح عباءة صلبة. يبدو أنها تخزن طاقة عميقة، وربما تحتوي على بعض من قوة DM-300؟
items.artifacts.capeofthorns.desc_inactive=تشعر بثقل العباءة المطمئن على كتفيك، ويبدو أنها تكتسب الطاقة من الضرر الذي تتلقاه.
items.artifacts.capeofthorns.desc_active=يبدو أن العباءة تطلق الطاقة المخزنة، وتشع بقوة واقية.
items.artifacts.capeofthorns$thorns.inert=أصبحت عباءتك خاملة مجددًا.
items.artifacts.capeofthorns$thorns.radiating=بدأت عباءتك بإشعاع الطاقة، وتشعر أنك محمي!
items.artifacts.capeofthorns$thorns.levelup=أصبحت عباءتك أقوى!
items.artifacts.capeofthorns$thorns.name=الأشواك
items.artifacts.capeofthorns$thorns.desc=تشع عباءتك بالطاقة، وتحيط بك بحقل من القوة المنحرفة!\n\nيتم تقليل كل الضرر الذي تتلقاه أثناء تفعيل تأثير الأشواك. بالإضافة إلى ذلك، إذا كان المهاجم بجانبك، فسيُعاد توجيه مقدار الضرر المخفَّض إليه.\n\nالأدوار المتبقية من تأثير الأشواك: %s.

items.artifacts.chaliceofblood.name=كأس الدم
items.artifacts.chaliceofblood.ac_prick=وخز
items.artifacts.chaliceofblood.yes=نعم، أعرف ما أفعله
items.artifacts.chaliceofblood.no=لا، لقد غيّرت رأيي
items.artifacts.chaliceofblood.prick_warn=في كل مرة تستخدم فيها الكأس، ستستنزف المزيد من طاقة حياتك، لكن ذلك سيعزز تجدد صحتك الطبيعي بشكل أكبر في المقابل.\n\nحاليًا، سيؤدي وخز نفسك إلى إلحاق _%1$d-%2$d من الضرر_ بك، رغم أنه يمكن تقليل هذا الضرر بواسطة _كل من الحجب الجسدي والسحري أو تقليل الضرر._ ومن دون احتساب تأثيرات تقليل الضرر، فإن وخز نفسك حاليًا لديه _احتمال %3$s%%_ لاستنزاف قوة حياتك بالكامل.\n\nهل أنت متأكد من أنك تريد تقديم المزيد من طاقة حياتك للكأس؟
items.artifacts.chaliceofblood.onprick=تطعن نفسك، وتتدفق روح حياتك إلى داخل الكأس.
items.artifacts.chaliceofblood.ondeath=يمتص الكأس جوهر حياتك حتى آخر قطرة...
items.artifacts.chaliceofblood.desc=هذا الكأس الفضي اللامع مزين بشكل غريب بأحجار كريمة حادة عند الحافة.
items.artifacts.chaliceofblood.desc_cursed=ارتبط الكأس الملعون بيدك، ويعيق قدرتك على تجديد صحتك.
items.artifacts.chaliceofblood.desc_1=عندما تحمل الكأس، تشعر بدافع غريب لوخز نفسك بالأحجار الحادة.
items.artifacts.chaliceofblood.desc_2=تجمّع بعض دمك داخل الكأس، ويمكنك أن تشعر بشكل خافت بأن الكأس يغذيك بطاقة الحياة، مما يزيد من معدل تجدد صحتك الطبيعي. وما زلت تريد جرح نفسك بالكأس، رغم أنك تعرف أنه سيؤلمك.
items.artifacts.chaliceofblood.desc_3=امتلأ الكأس حتى حافته بجوهر حياتك. يمكنك الشعور بالكأس وهو يضخ طاقة الحياة مجددًا إلى جسدك.

