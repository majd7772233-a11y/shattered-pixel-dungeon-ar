items.weapon.melee.handaxe.desc=فأس خفيف، يُستخدم غالبًا لقطع الأشجار. كما أن نصلها العريض مناسب لمواجهة الأعداء.

items.weapon.melee.katana.name=كاتانا
items.weapon.melee.katana.stats_desc=يصد هذا السلاح 0-3 من الضرر.
items.weapon.melee.katana.ability_name=اندفاع
items.weapon.melee.katana.typical_ability_desc=يمكن للمبارزة تنفيذ _اندفاع_ باستخدام الكاتانا نحو عدو يبعد بلاطة واحدة. تتحرك هذه الضربة نحو العدو، وتلحق عادةً _%1$d-%2$d من الضرر_، وهي مضمونة الإصابة.
items.weapon.melee.katana.ability_desc=يمكن للمبارزة تنفيذ _اندفاع_ باستخدام الكاتانا نحو عدو يبعد بلاطة واحدة. تتحرك هذه الضربة نحو العدو، وتلحق _%1$d-%2$d من الضرر_، وهي مضمونة الإصابة.
items.weapon.melee.katana.desc=سيف نحيل مزود بحاجز معدني كبير فوق المقبض.

items.weapon.melee.longsword.name=سيف طويل
items.weapon.melee.longsword.ability_name=شق
