items.scrolls.exotic.exoticscroll.unknown_desc=رُسم على هذا الرق الأسود رمز سحري متوهج يستحيل فكّه. يبدو أنه غريب عن هذه الأرض، فمن يدري ماذا سيفعل عند تلاوته بصوت عالٍ؟
items.scrolls.exotic.exoticscroll.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.scrolls.exotic.scrollofsirenssong.name=لفافة أغنية الحورية
items.scrolls.exotic.scrollofsirenssong.prompt=اختر هدفًا
items.scrolls.exotic.scrollofsirenssong.no_target=تُفعّل اللفافة دون وجود هدف.
items.scrolls.exotic.scrollofsirenssong.cancel=يجب أن تختار هدفًا.
items.scrolls.exotic.scrollofsirenssong.desc=تُطلق قراءة هذه اللفافة لحنًا ساحرًا يأسر العدو المستهدف، ويحوّله بشكل دائم إلى حليف! كما سيُسحر الأعداء الآخرون الذين يسمعون اللحن مؤقتًا.\n\nيمكن للأعداء الأقوياء بشكل خاص مقاومة تأثير الأسر، وسيُصابون بالسحر بدلًا من ذلك.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=مأسور
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=تم سحر هذا المخلوق بواسطة سحر لفافة أغنية الحورية.\n\nالشخصية المأسورة تصبح حليفًا لك بشكل دائم، وستقاتل أي أعداء تصادفهم.

items.scrolls.exotic.scrollofantimagic.name=لفافة مضادة للسحر
items.scrolls.exotic.scrollofantimagic.desc=ستحيطك التعويذة الموجودة في هذه اللفافة بهالة سحرية تمنع مؤقتًا جميع التأثيرات السحرية، سواء كانت ضارة أم نافعة. ويشمل ذلك معظم تأثيرات العناصر السحرية مثل العصي واللفائف والخواتم والقطع الأثرية والتعويذات واللعنات. لكن قدرات الدروع البطولية قوية بما يكفي لتعمل رغم ذلك.

items.scrolls.exotic.scrollofchallenge.name=لفافة التحدي
items.scrolls.exotic.scrollofchallenge.desc=عند تلاوتها بصوت عالٍ، ستطلق هذه اللفافة زئيرًا هائلًا يجذب الأعداء إلى المستخدم، وفي الوقت نفسه تنشئ ساحة صغيرة حوله.\n\nما دام القارئ داخل هذه الساحة، فسيتلقى ضررًا أقل بنسبة 33%% من جميع المصادر (ويُطبق هذا قبل أشكال تقليل الضرر الأخرى)، كما أنه لن يفقد الشبع.\n\nيتناسب حجم الساحة مع حجم المنطقة التي يوجد فيها القارئ. وستكون صغيرة بشكل خاص في بعض مناطق الزعماء.
items.scrolls.exotic.scrollofchallenge$challengearena.name=ساحة التحدي
items.scrolls.exotic.scrollofchallenge$challengearena.desc=ظهرت حولك ساحة سحرية، يحدد حدودها ضباب أحمر متصاعد.\n\nأثناء وقوفك داخل الضباب، لن يزداد جوعك وستتلقى ضررًا أقل بنسبة 33%% من جميع المصادر. وإذا كان لديك أي مصادر أخرى لتقليل الضرر (مثل الدرع)، فسيتم تطبيقها بعد تخفيض الـ33%%.\n\nالأدوار المتبقية: %d.

items.scrolls.exotic.scrollofdivination.name=لفافة العرافة
items.scrolls.exotic.scrollofdivination.nothing_left=لم يتبقَّ شيء للتعرّف عليه!
items.scrolls.exotic.scrollofdivination.desc=ستتعرف هذه اللفافة عشوائيًا على أربعة أنواع من العناصر التي لا تعرفها حاليًا. وقد تكون الأنواع التي يتم التعرف عليها لون جرعة، أو رمز لفافة، أو حجر كريم في خاتم. وليس من الضروري أن تكون العناصر التي تم التعرف عليها بحوزتك.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=تعرفت لفافة العرافة على العناصر التالية:

items.scrolls.exotic.scrollofdread.name=لفافة الهلع
items.scrolls.exotic.scrollofdread.desc=عند قراءتها، ستطلق هذه اللفافة وميضًا من الضوء الأحمر يبث رعبًا هائلًا في جميع الأعداء داخل مجال رؤيتك. ويكون تأثيرها قويًا لدرجة أنهم سيحاولون الهرب بسرعة من الزنزانة بأكملها، ولن تراهم مرة أخرى أبدًا!\n\nوكما هو الحال مع الرعب، يمكن أن ينتهي هذا التأثير بمرور الوقت أو عند مهاجمة العدو.\n\nأما الأعداء أصحاب الإرادة القوية، مثل الزعماء، فسيصابون بالرعب العادي بدلًا من ذلك.

items.scrolls.exotic.scrollofenchantment.name=لفافة التعويذة
items.scrolls.exotic.scrollofenchantment.inv_title=إضفاء تعويذة على عنصر
items.scrolls.exotic.scrollofenchantment.weapon=اختر تعويذة لتطبيقها على سلاحك.
items.scrolls.exotic.scrollofenchantment.armor=اختر نقشًا لتطبيقه على درعك.
items.scrolls.exotic.scrollofenchantment.cancel=إلغاء
items.scrolls.exotic.scrollofenchantment.cancel_warn=سيؤدي الإلغاء إلى استهلاك لفافة التعويذة على أي حال، هل أنت متأكد؟
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=نعم، أنا متأكد
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=لا، لقد غيّرت رأيي
items.scrolls.exotic.scrollofenchantment.desc=ستشبع هذه اللفافة سلاحًا أو درعًا بطاقة سحرية قوية. ويمكن للقارئ حتى التحكم إلى حد ما في نوع السحر الذي سيتم إضفاؤه.

items.scrolls.exotic.scrollofforesight.name=لفافة الاستبصار
items.scrolls.exotic.scrollofforesight.desc=بعد قراءة هذه اللفافة، ستُغذّى تفاصيل التضاريس القريبة باستمرار إلى ذهن القارئ بوضوح بلوري. ويستمر هذا التأثير لفترة طويلة، كما سيكشف جميع الأبواب أو الأفخاخ المخفية، مما يجعل البحث عنها غير ضروري.

items.scrolls.exotic.scrollofmetamorphosis.name=لفافة التحول
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=اختر موهبة لتحويلها.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=اختر موهبة جديدة لتحل محل موهبتك المحوّلة.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=سيؤدي الإلغاء إلى استهلاك لفافة التحول على أي حال، هل أنت متأكد؟
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=تحويل الموهبة
items.scrolls.exotic.scrollofmetamorphosis.desc=تحتوي هذه اللفافة على سحر تحويل قوي، لكنه يُطبق على الساحر بدلًا من عنصر. يتيح لك سحر هذه اللفافة اختيار موهبة واحدة واستبدالها بواحدة من خمس مواهب من المستوى نفسه، مأخوذة من فئات أبطال مختلفة!\n\nلا يمكن لهذا التأثير أن يطبق إلا على مواهب الفئة، وليس المواهب المكتسبة من الفئات الفرعية أو قدرات الدروع. ولن تُعرض المواهب التي لا يمكنك استخدامها ضمن الخيارات.

items.scrolls.exotic.scrollofmysticalenergy.name=لفافة الطاقة الغامضة
items.scrolls.exotic.scrollofmysticalenergy.desc=ستعمل القوة السحرية الخام المرتبطة بهذا الرق، عند إطلاقها، على شحن القطع الأثرية المجهزة لدى المستخدم بمرور الوقت.

items.scrolls.exotic.scrollofpassage.name=لفافة العبور
items.scrolls.exotic.scrollofpassage.desc=ستنقل التعويذة الموجودة على هذا الرق القارئ فورًا إلى أقرب طابق في المنطقة الموجودة فوقه. وهي مفيدة جدًا للوصول بسرعة إلى متجر.

items.scrolls.exotic.scrollofprismaticimage.name=لفافة الصورة الطيفية
items.scrolls.exotic.scrollofprismaticimage.desc=ستنـشئ التعويذة الموجودة في هذه اللفافة شبيهًا وهميًا ملوّنًا للقارئ. تعمل هذه الصورة الطيفية كنسخة أضعف من القارئ، بدفاع مشابه ولكن بصحة وضرر أقل.\n\nستظهر الصورة الطيفية عند وجود أعداء، وستحاول الدفاع عن القارئ.\n\nإذا كانت هناك صورة طيفية موجودة بالفعل، فسيؤدي استخدام هذه اللفافة إلى شفائها بالكامل.

items.scrolls.exotic.scrollofpsionicblast.name=لفافة الانفجار النفسي
items.scrolls.exotic.scrollofpsionicblast.ondeath=يمزق الانفجار النفسي عقلك إربًا...
items.scrolls.exotic.scrollofpsionicblast.desc=تحتوي هذه اللفافة على طاقة تدميرية هائلة يمكن توجيهها لتدمير عقول جميع المخلوقات المرئية.\n\nلكنها تسبب ارتدادًا كبيرًا؛ إذ سيتعرض القارئ أيضًا للضرر والعمى والضعف. وكلما زاد عدد الأهداف التي تصيبها اللفافة، قل الضرر الذي يتلقاه المستخدم.



### التعاويذ
items.spells.alchemize.name=الكيمياء
items.spells.alchemize.prompt=أجرِ الكيمياء على عنصر
items.spells.alchemize.desc=تحتوي هذه التعويذة على قوى تحويل مشابهة لتلك الموجودة في قدر الكيمياء. يتيح كل إلقاء للمستخدم تحويل عنصر (أو مجموعة من العناصر) إلى ذهب أو طاقة كيميائية. كما أن تحويل الجرعات أو اللفائف إلى طاقة سيؤدي حتى إلى التعرف عليها!\n\nتُباع بعض استخدامات تعويذة الكيمياء في المتاجر، لكن يمكنك صنع المزيد منها باستخدام الكيمياء عبر دمج بذرة وحجر رون وقليل من الطاقة الكيميائية.
items.spells.alchemize$wndalchemizeitem.sell=حوّل إلى %dg
items.spells.alchemize$wndalchemizeitem.sell_1=حوّل 1 إلى %dg
items.spells.alchemize$wndalchemizeitem.sell_all=حوّل الكل إلى %dg
items.spells.alchemize$wndalchemizeitem.energize=حوّل إلى %d من الطاقة
items.spells.alchemize$wndalchemizeitem.energize_1=حوّل 1 إلى %d من الطاقة
items.spells.alchemize$wndalchemizeitem.energize_all=حوّل الكل إلى %d من الطاقة

items.spells.beaconofreturning.name=منارة العودة
items.spells.beaconofreturning.preventing=تمنع الهالة السحرية القوية لهذا المكان استخدامك للتعويذة!
items.spells.beaconofreturning.creatures=لا تسمح الهالة النفسية للمخلوقات المجاورة لك بالانتقال الآني في هذه اللحظة.
items.spells.beaconofreturning.set=تم تعيين المنارة في موقعك الحالي.
items.spells.beaconofreturning.wnd_body=سيؤدي التعيين إلى استبدال الموقع الذي عُينت فيه المنارة سابقًا.\n\nستعيدك العودة إلى آخر موقع تم تعيينه وستستهلك استخدامًا واحدًا من التعويذة.
items.spells.beaconofreturning.wnd_set=تعيين
items.spells.beaconofreturning.wnd_return=عودة
items.spells.beaconofreturning.desc_set=تم تعيين هذه المنارة في مكان ما في الطابق %d.
items.spells.beaconofreturning.desc=تمنح هذه التعويذة المعقدة المستخدم القدرة على العودة إلى موقع محدد، بغض النظر عن المسافة. ولا تُستهلك التعويذة إلا عند العودة؛ ويمكنك تعيين الموقع أي عدد من المرات، لكنها ستتذكر أحدث موقع فقط.

items.spells.curseinfusion.name=إضفاء اللعنة
items.spells.curseinfusion.inv_title=ضع لعنة على عنصر
items.spells.curseinfusion.desc=تُشبع هذه التعويذة قطعة من المعدات بالسحر الخبيث القوي نفسه الموجود داخل DM-300. وسيُلعن العنصر المستخدم عليه فورًا، كما سيتم استبدال أي تعويذة أو نقش كان يحمله.\n\nوفي حالة الأسلحة والدروع والعصي، سيحصل العنصر على ترقيات بالإضافة إلى اللعنة. ولا تتراكم ترقيات إضفاء اللعنة، وتضيع الترقيات إذا أزيلت اللعنة عن العنصر.\n\nيمكن أيضًا استخدام عدة عمليات من إضفاء اللعنة لتغيير اللعنة الموجودة على سلاح أو درع.

items.spells.spell.ac_cast=إطلاق
items.spells.spell.no_magic=لا يمكنك إلقاء التعاويذ أثناء امتلاكك مناعة ضد السحر.
items.spells.spell.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.spells.magicalinfusion.name=الإضفاء السحري
items.spells.magicalinfusion.inv_title=أشبع عنصرًا بالسحر
items.spells.magicalinfusion.infuse=تم تشبيع عنصرك بالطاقة الغامضة!
items.spells.magicalinfusion.desc=تمتلك هذه التعويذة القوة السحرية نفسها الموجودة في لفافة الترقية، ولكن في صورة أكثر استقرارًا.\n\nبالإضافة إلى ترقية العنصر بشكل طبيعي، فإنها لن تمحو أبدًا أي تعويذة أو نقش أو لعنة.

items.spells.magicalporter.name=الناقل السحري
items.spells.magicalporter.inv_title=انقل عنصرًا
items.spells.magicalporter.nowhere=لا يوجد مكان يمكنك نقل عنصر إليه.
items.spells.magicalporter.desc=ستنقل هذه التعويذة أي عنصر تُلقى عليه سحريًا. ولكن، بخلاف منارة التاجر، ستُنقل العناصر إلى مدخل الطابق التالي الخاص بالزعيم.

items.spells.phaseshift.name=التحول الطوري
items.spells.phaseshift.no_target=لا يوجد شيء يمكن نقله آنيًا إلى هناك.
items.spells.phaseshift.desc=ستنقل هذه التعويذة الفوضوية أي شخصية تستهدفها إلى موقع عشوائي في الطابق الحالي، وستصيبها بالذهول لفترة طويلة. سيتمكن الأعداء الأقوياء من مقاومة تأثير الذهول. ويمكن توجيه هذه التعويذة إلى هدف أو إلى المستخدم نفسه.

items.spells.reclaimtrap.name=استعادة الفخ
items.spells.reclaimtrap.no_trap=لا يوجد فخ هناك.
items.spells.reclaimtrap.desc_trap=التعويذة جاهزة حاليًا لتفعيل _%s._
items.spells.reclaimtrap.desc=تحتوي هذه التعويذة على بقايا من الطاقة الميكانيكية لـDM-300. عند إلقائها على فخ نشط، ستلتصق قوة الفخ بك، مما يسمح لك باستخدام التعويذة مرة أخرى لإطلاق هذه القوة وتفعيل تأثير الفخ في أي موقع تختاره.\n\nلكن بعض الأفخاخ قد لا تعمل في جميع الأماكن، ولا يمكن تخزين أكثر من فخ واحد في الوقت نفسه.

items.spells.recycle.name=إعادة التدوير
items.spells.recycle.inv_title=أعد تدوير عنصر
items.spells.recycle.recycled=تمت إعادة تدوير عنصرك إلى: %s.
items.spells.recycle.desc=تحتوي هذه التعويذة على شكل أضعف من سحر التحويل. ورغم أنها لا تعمل على المعدات، فإنها تحول لفافة أو جرعة أو بذرة أو حجر رون أو سهمًا مغموسًا إلى عنصر عشوائي من النوع نفسه.

items.spells.summonelemental.name=استدعاء عنصر
items.spells.summonelemental.ac_imbue=إشباع
items.spells.summonelemental.imbue_prompt=أشبع عنصرًا بالسحر
items.spells.summonelemental.desc=توجه هذه التعويذة طاقة الجمرات العنصرية المستخدمة لصنعها، وتسمح لك باستدعاء عنصر ودود ليقاتل إلى جانبك! لا يمكن استدعاء أكثر من عنصر واحد في الوقت نفسه، لكن يمكن إعادة إلقاء التعويذة لإعادة العنصر إليك دون أي تكلفة.
items.spells.summonelemental.desc_newborn=التعويذة غير مشبعة حاليًا، وستستدعي _عنصرًا حديث الولادة_ دون هجوم بعيد المدى. يمكنك إشباعها بجرعة محددة من اللهب السائل أو جرعة الصقيع أو لفافة إعادة الشحن أو لفافة التحويل لتقوية التعويذة، مما يجعل الاستدعاءات المستقبلية عناصر كاملة القوة!
items.spells.summonelemental.desc_fire=التعويذة ساخنة حاليًا عند لمسها، وستستدعي _عنصرًا ناريًا_. يمكنك إشباعها بعنصر مختلف، لكن التعويذة ستفقد الإشباع الحالي.
items.spells.summonelemental.desc_frost=التعويذة باردة حاليًا عند لمسها، وستستدعي _عنصرًا جليديًا_. يمكنك إشباعها بعنصر مختلف، لكن التعويذة ستفقد الإشباع الحالي.
items.spells.summonelemental.desc_shock=تشع التعويذة حاليًا بطاقة كهربائية ساكنة، وستستدعي _عنصرًا صاعقًا_. يمكنك إشباعها بعنصر مختلف، لكن التعويذة ستفقد الإشباع الحالي.
items.spells.summonelemental.desc_chaos=تشع التعويذة حاليًا بطاقة فوضوية، وستستدعي _عنصرًا فوضويًا_. يمكنك إشباعها بعنصر مختلف، لكن التعويذة ستفقد الإشباع الحالي.

items.spells.targetedspell.prompt=اختر هدفًا
items.spells.targetedspell.inv_title=أشبع عنصرًا بالسحر

items.spells.telekineticgrab.name=القبض التحريكي عن بُعد
items.spells.telekineticgrab.cant_grab=لا يمكنك التقاط ذلك.
items.spells.telekineticgrab.no_target=لا يوجد شيء لالتقاطه هناك.
items.spells.telekineticgrab.desc=تسمح هذه التعويذة للساحر بالتقاط جميع العناصر الموجودة في موقع ما عن بُعد، أو جميع الأسلحة المرمية العالقة بجسم عدو!\n\nلا يمكن استخدامها لالتقاط عناصر يملكها شخص آخر، أو لالتقاط حاويات مثل الصناديق.

items.spells.unstablespell.name=تعويذة غير مستقرة
items.spells.unstablespell.desc=تحتوي هذه البلورة السوداء المربعة الصغيرة على رموز رونية متغيرة على كل سطح من أسطحها.\n\nعند تفعيلها، ستُطلق تأثير لفافة عشوائية. وسيكون تأثير اللفافة دائمًا موجهًا للقتال إذا وُجد أعداء في مجال رؤيتك، ودائمًا غير موجه للقتال في غير ذلك.

items.spells.wildenergy.name=طاقة جامحة
items.spells.wildenergy.desc=تحتوي هذه التعويذة على بعض الطاقة الملعونة التي كانت تشغّل DM-300. عند إلقائها، ستعيد شحن عصاك السحرية وقطعك الأثرية المجهزة، كما ستطلق تأثيرًا عشوائيًا لعصا ملعونة. ويمكنك اختيار اتجاه إطلاق هذا السحر الملعون، مع ذلك.



### أحجار الرون
items.stones.inventorystone.ac_use=استخدام

items.stones.runestone$placeholder.name=حجر رون
items.stones.runestone.discover_hint=يمكنك العثور على هذا العنصر عشوائيًا في الزنزانة، أو صناعته عبر الكيمياء.

items.stones.stoneofaggression.name=حجر العدوان
items.stones.stoneofaggression.desc=عند رمي هذا الحجر على حليف أو عدو، ستفضل جميع الأعداء القريبين مهاجمة تلك الشخصية لفترة قصيرة.\n\nلكن الأعداء من الزعماء يمكنهم مقاومة التأثير، مما يقلل مدته بشكل كبير ويجعلهم يتلقون ضررًا أقل من هجمات أتباعهم.
items.stones.stoneofaggression$aggression.name=مستهدف
items.stones.stoneofaggression$aggression.desc=يجعل السحر المتلاعب جميع الأعداء القريبين يفضلون مهاجمة هذه الشخصية.\n\nالأدوار المتبقية: %s.

items.stones.stoneofaugmentation.name=حجر التعزيز
items.stones.stoneofaugmentation.inv_title=عزّز عنصرًا
items.stones.stoneofaugmentation.desc=يمتلك حجر الرون هذا سحرًا قويًا يمكنه تعزيز المعدات لتحسين خاصية واحدة على حساب أخرى.\n\nعند استخدامه على سلاح، سيمكنك تعزيز السرعة أو الضرر. كما ستكتسب الأسلحة المرمية أو تفقد المتانة بما يتناسب مع سرعتها.\n\nوعند استخدامه على درع، سيمكنك تعزيز الدفاع أو التهرب.
items.stones.stoneofaugmentation.discover_hint=يمكنك شراء هذا العنصر من متجر، أو صناعته عبر الكيمياء.
items.stones.stoneofaugmentation$wndaugment.choice=ماذا تريد أن تعزز؟
items.stones.stoneofaugmentation$wndaugment.speed=السرعة
items.stones.stoneofaugmentation$wndaugment.damage=الضرر
items.stones.stoneofaugmentation$wndaugment.evasion=التهرب
items.stones.stoneofaugmentation$wndaugment.defense=الدفاع
items.stones.stoneofaugmentation$wndaugment.none=إزالة التعزيز
items.stones.stoneofaugmentation$wndaugment.cancel=لا، تراجع

items.stones.stoneofblast.name=حجر الانفجار
items.stones.stoneofblast.desc=سينفجر حجر الرون هذا فورًا في الموقع الذي يُرمى إليه. وكما هو الحال مع القنبلة، سيلحق الانفجار الضرر بكل ما هو قريب.

items.stones.stoneofblink.name=حجر الانتقال
items.stones.stoneofblink.desc=سينقل حجر الرون هذا المستخدم آنيًا إلى الموقع الذي يُرمى إليه.

items.stones.stoneofclairvoyance.name=حجر الاستبصار
items.stones.stoneofclairvoyance.desc=سيكشف هذا الحجر فورًا جميع البلاطات في مساحة واسعة جدًا حول موقع رميه. بل إن تأثيره يصل عبر الجدران.

items.stones.stoneofdeepsleep.name=حجر النوم العميق
items.stones.stoneofdeepsleep.desc=عند رمي هذا الحجر على عدو، سيدخله في نوم سحري عميق. وسيظل الأعداء النائمون سحريًا نائمين إلى الأبد حتى يتم إزعاجهم.

items.stones.stoneofdetectmagic.name=حجر كشف السحر
items.stones.stoneofdetectmagic.inv_title=اكشف عن عنصر
items.stones.stoneofdetectmagic.detected_none=لم تكتشف أي سحر يؤثر في هذا العنصر.
items.stones.stoneofdetectmagic.detected_both=اكتشفت سحرًا نافعًا وخبيثًا يؤثران في هذا العنصر!
items.stones.stoneofdetectmagic.detected_good=اكتشفت سحرًا نافعًا يؤثر في هذا العنصر!
items.stones.stoneofdetectmagic.detected_bad=اكتشفت سحرًا خبيثًا يؤثر في هذا العنصر!
items.stones.stoneofdetectmagic.desc=يستطيع حجر الرون هذا اكتشاف السحر الذي يؤثر في عنصر ما. وسيخبرك استخدام هذا الحجر على عنصر غير محدد ما إذا كان متأثرًا بلعنة خبيثة، وما إذا كان متأثرًا بسحر نافع مثل التعويذة أو الترقيات.

items.stones.stoneofdisarming.name=حجر نزع الفخاخ
items.stones.stoneofdisarming.desc=يحمل حجر الرون هذا سحرًا يمكنه تعطيل الأفخاخ الخبيثة المخفية في أنحاء الزنزانة. وسيزيل ما يصل إلى 9 أفخاخ في المنطقة التي يُرمى إليها.

items.stones.stoneofenchantment.name=حجر التعويذة
items.stones.stoneofenchantment.inv_title=أضف تعويذة إلى عنصر
items.stones.stoneofenchantment.weapon=سلاحك يتوهج في الظلام!
items.stones.stoneofenchantment.armor=درعك يتوهج في الظلام!
items.stones.stoneofenchantment.desc=يمتلك حجر الرون هذا سحرًا مسحورًا. وبخلاف لفافة الترقية، فإنه لا يزيد القوة المباشرة للعنصر، بل يشبع سلاحًا أو درعًا بتعويذة تمنحه قوة جديدة.

items.stones.stoneoffear.name=حجر الخوف
items.stones.stoneoffear.desc=عند رمي هذا الحجر على شخصية، سيغمرها الرعب، وستستدير وتهرب. وستؤدي مهاجمة شخصية هاربة إلى تقصير مدة التأثير.

items.stones.stoneofflock.name=حجر القطيع
items.stones.stoneofflock.desc=يستدعي حجر الرون هذا خرافًا سحرية لفترة قصيرة حول الموقع الذي يُرمى إليه.

items.stones.stoneofintuition.name=حجر الحدس
items.stones.stoneofintuition.inv_title=اختر عنصرًا
items.stones.stoneofintuition.desc=يحمل حجر الرون هذا نسخة أضعف من السحر الموجود في لفائف التعرف. وبدلًا من التعرف على العنصر مباشرة، فإنه يعمل على حدسك، مما يسمح لك بمحاولة معرفة نوع جرعة أو لفافة أو خاتم عن طريق التخمين.
items.stones.stoneofintuition.break_info=يمكنك استخدام أحجار الحدس مرتين قبل أن ينكسر أحدها، _ولن يستهلك استخدامك التالي حجرًا_.
items.stones.stoneofintuition.break_warn=لقد استخدمت حجر الحدس من قبل، لذا _سيستهلك استخدامك التالي حجرًا_.
items.stones.stoneofintuition$wndguess.text=خمّن نوع العنصر غير المحدد. إذا خمّنت بشكل صحيح، فسيتم التعرف على نوعه!
items.stones.stoneofintuition$wndguess.correct=صحيح. تم التعرف على نوع العنصر!
items.stones.stoneofintuition$wndguess.incorrect=كان تخمينك خاطئًا.
items.stones.stoneofintuition$wndguess.break=يتفتت حجر الحدس الخاص بك ويتحول إلى غبار...

items.stones.stoneofshock.name=حجر الصدمة
items.stones.stoneofshock.desc=يطلق حجر الرون هذا انفجارًا من الطاقة الكهربائية يصيب جميع الأهداف القريبة بالذهول لفترة وجيزة، ويمنح من يرميه شحنة عصا سحرية عن كل هدف يصيبه.


### الحلي
items.trinkets.chaoticcenser.name=مبخرة فوضوية
items.trinkets.chaoticcenser.spew=مبخرتك على وشك إطلاق: %s.
items.trinkets.chaoticcenser.desc=بعد بقائها لبعض الوقت في قدر الكيمياء، تبدو هذه المبخرة التي تحرق البخور وكأنها تنتج الدخان من تلقاء نفسها! تتراكم هذه الغازات، ثم تندفع من المبخرة نحو الأعداء على فترات شبه عشوائية. ويبدو أنها قادرة على إنتاج جميع أنواع الغازات، لكنك ستحصل على تحذير قصير قبل تفعيل المبخرة مباشرة.
items.trinkets.chaoticcenser.typical_stats_desc=عادةً ما ستنتج هذه الحلية غازًا ضارًا بالقرب من عدو كل _%d_ دور تقريبًا. ولا تظهر الغازات إلا عند وجود أعداء. وفي المستويات الأعلى، تزداد احتمالية أن تكون هذه الغازات غريبة وقوية.
items.trinkets.chaoticcenser.stats_desc=في مستواها الحالي، ستنتج هذه الحلية غازًا ضارًا بالقرب من عدو كل _%d_ دور تقريبًا. ولا تظهر الغازات إلا عند وجود أعداء. وفي المستويات الأعلى، تزداد احتمالية أن تكون هذه الغازات غريبة وقوية.

items.trinkets.crackedspyglass.name=منظار متشقق
items.trinkets.crackedspyglass.desc=كان هذا التلسكوب اليدوي سيُعد مثالًا على الصناعة الدقيقة والرائعة لولا الشق الممتد على طول عدسته الأمامية. ويبدو أن المنظار يساعدك على اكتشاف عناصر جديدة في الزنزانة، لكن بسبب عيبه يصعب جدًا رؤية العناصر التي يكشفها!
items.trinkets.crackedspyglass.typical_stats_desc=عادةً ما تمتلك هذه الحلية _احتمالًا بنسبة %1$s%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم.
items.trinkets.crackedspyglass.stats_desc=في مستواها الحالي، تمتلك هذه الحلية _احتمالًا بنسبة %1$s%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم.
items.trinkets.crackedspyglass.stats_desc_upgraded=في مستواها الحالي، تمتلك هذه الحلية _احتمالًا بنسبة 100%%_ لإنشاء عنصر مخفي إضافي في كل طابق لا يحتوي على زعيم، و_احتمالًا بنسبة %1$s%%_ لإنشاء عنصر مخفي إضافي ثانٍ.

items.trinkets.dimensionalsundial.name=مزولة أبعادية
items.trinkets.dimensionalsundial.warning=مزولتك لا تلقي ظلًا، وتشعر بعدم الارتياح.
items.trinkets.dimensionalsundial.desc=تستطيع هذه المزولة اليدوية الصغيرة بطريقة ما إلقاء ظل في أعماق الزنزانة، حتى لو لم تكن تمسكها بشكل مستقيم. والأغرب من ذلك أن موضع الظل يبدو غير مرتبط بالشمس في هذا العالم. وعندما لا تلقي المزولة أي ظل، يبدو أنها تجذب الخطر.
items.trinkets.dimensionalsundial.typical_stats_desc=عادةً ما تقلل هذه الحلية معدل ظهور الأعداء بنسبة _%1$d%%_ أثناء النهار في العالم الحقيقي (من 8 صباحًا إلى 8 مساءً)، وتزيد معدل ظهور الأعداء بنسبة _%2$d%%_ أثناء الليل (من 8 مساءً إلى 8 صباحًا).
items.trinkets.dimensionalsundial.stats_desc=في مستواها الحالي، تقلل هذه الحلية معدل ظهور الأعداء بنسبة _%1$d%%_ أثناء النهار في العالم الحقيقي (من 8 صباحًا إلى 8 مساءً)، وتزيد معدل ظهور الأعداء بنسبة _%2$d%%_ أثناء الليل (من 8 مساءً إلى 8 صباحًا).

items.trinkets.exoticcrystals.name=بلورات غريبة
items.trinkets.exoticcrystals.desc=هذه البلورات الوردية الصغيرة لها الشكل نفسه لبلورات الطاقة الكيميائية. ورغم أنه لا يمكن استخدامها مباشرةً للحصول على الطاقة، فإنها تبدو وكأنها تؤثر بطريقة ما في الجرعات واللفائف التي تعثر عليها.
items.trinkets.exoticcrystals.typical_stats_desc=عادةً ما تستبدل هذه الحلية _%s%%_ من غنائم الجرعات أو اللفائف بنظيراتها الغريبة. ولا يؤثر ذلك في جرعات القوة أو لفائف الترقية أو العناصر التي يتم توليدها للمساعدة في حل غرف المخاطر.
items.trinkets.exoticcrystals.stats_desc=في مستواها الحالي، ستستبدل هذه الحلية _%s%%_ من غنائم الجرعات أو اللفائف بنظيراتها الغريبة. ولا يؤثر ذلك في جرعات القوة أو لفائف الترقية أو العناصر التي يتم توليدها للمساعدة في حل غرف المخاطر.

items.trinkets.eyeofnewt.name=عين سمندر
items.trinkets.eyeofnewt.desc=عين سمندر ذهبية وسوداء، وهي مكوّن شائع تم تعزيزها الآن لتصبح حلية. ويبدو أن العين تقلل من مدى رؤيتك مقابل السماح لك برؤية الأشياء بطرق أخرى.
items.trinkets.eyeofnewt.typical_stats_desc=عادةً ما تقلل هذه الحلية مدى رؤيتك بنسبة _%1$s%%_، لكنها تمنحك أيضًا رؤية ذهنية للأعداء ضمن _%2$d_ بلاطات.
items.trinkets.eyeofnewt.stats_desc=في مستواها الحالي، تقلل هذه الحلية مدى رؤيتك بنسبة _%1$s%%_، لكنها تمنحك أيضًا رؤية ذهنية للأعداء ضمن _%2$d_ بلاطات.

items.trinkets.ferrettuft.name=خصلة فرو قاقم
items.trinkets.ferrettuft.desc=خصلة من فرو القاقم الأبيض الحريري، مثبتة بشريط أخضر ليموني معقود على شكل ربطة. تشتهر حيوانات القاقم بخفتها ومشاغبتها وانعدام النزاهة لديها. ويبدو أن بعضًا من تلك القوة يشع من الحلية، مما يعزز التهرب لدى كل من يوجد بالقرب منها.
items.trinkets.ferrettuft.typical_stats_desc=عادةً ما تزيد هذه الحلية تهرب جميع الشخصيات بنسبة _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=في مستواها الحالي، تزيد هذه الحلية تهرب جميع الشخصيات بنسبة _%1$s%%_.

items.trinkets.mimictooth.name=سنّ المقلد
items.trinkets.mimictooth.desc=لا بد أن هذه السن الكبيرة الحادة اقتُلعت من مقلد شديد السوء الحظ. ويبدو أنها تؤثر في المقلدين في الزنزانة، مما يجعل ظهورهم أكثر تكرارًا وخطورتهم أكبر.
items.trinkets.mimictooth.typical_stats_desc=عادةً ما تجعل هذه الحلية جميع أنواع المقلدين أكثر شيوعًا _%1$sx_ وأصعب بكثير في الاكتشاف، لكنها تزيد أيضًا كمية الغنائم التي يسقطونها. كما سيحظى كل طابق من الزنزانة _باحتمال %2$s%%_ لاحتواء مقلد إبنوسي متخفٍ إضافي.
items.trinkets.mimictooth.stats_desc=في مستواها الحالي، تجعل هذه الحلية جميع أنواع المقلدين أكثر شيوعًا _%1$sx_ وأصعب بكثير في الاكتشاف، لكنها تزيد أيضًا كمية الغنائم التي يسقطونها. كما سيحظى كل طابق من الزنزانة _باحتمال %2$s%%_ لاحتواء مقلد إبنوسي متخفٍ إضافي.

items.trinkets.mossyclump.name=كتلة طحلبية
items.trinkets.mossyclump.desc=تبدو هذه الكتلة من الطحالب الرطبة محتفظة برطوبتها مهما ضغطت عليها بقوة. ويبدو أنها مرتبطة سحريًا بالزنزانة نفسها، مما يجعل ظهور العشب والماء أكثر احتمالًا.
items.trinkets.mossyclump.typical_stats_desc=عادةً ما تجعل هذه الحلية _%d%%_ من الطوابق غير المصنفة تمتلئ بدلًا من ذلك إما بالماء أو بالعشب.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.
items.trinkets.mossyclump.stats_desc=في مستواها الحالي، تجعل هذه الحلية _%d%%_ من الطوابق غير المصنفة تمتلئ بدلًا من ذلك إما بالماء أو بالعشب.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.

items.trinkets.parchmentscrap.name=قصاصة رق
items.trinkets.parchmentscrap.desc=تبدو هذه القصاصة الصغيرة من الرق وكأنها جاءت من لفافة. وقد احتفظت ببعض سحرها، ويبدو أنها تؤثر في الأسلحة والدروع التي تجدها في الزنزانة.
items.trinkets.parchmentscrap.typical_stats_desc=عادةً ما تجعل هذه الحلية التعويذات والنقوش أكثر شيوعًا _%dx_، وتجعل اللعنات على الأسلحة والدروع أكثر شيوعًا _%sx_. ولا تتأثر اللعنات على العصي أو الخواتم أو القطع الأثرية.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.
items.trinkets.parchmentscrap.stats_desc=في مستواها الحالي، تجعل هذه الحلية التعويذات والنقوش أكثر شيوعًا _%dx_، وتجعل اللعنات على الأسلحة والدروع أكثر شيوعًا _%sx_. ولا تتأثر اللعنات على العصي أو الخواتم أو القطع الأثرية.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.

items.trinkets.petrifiedseed.name=بذرة متحجرة
items.trinkets.petrifiedseed.desc=تحجرت هذه البذرة، إما بفعل عمليات جيولوجية بطيئة أو بفعل السحر. ويبدو أن البذرة تؤثر سحريًا في نباتات الزنزانة، فتستبدل أحيانًا بذور النباتات بأحجار الرون.
items.trinkets.petrifiedseed.typical_stats_desc=عادةً ما تجعل هذه الحلية العشب المدوس يسقط أحجار رون بدلًا من البذور _%1$s%%_ من الوقت، كما تجعل العشب الطويل يسقط عناصر _%2$s%%_ أكثر تكرارًا.
items.trinkets.petrifiedseed.stats_desc=في مستواها الحالي، تجعل هذه الحلية العشب المدوس يسقط أحجار رون بدلًا من البذور _%1$s%%_ من الوقت، كما تجعل العشب الطويل يسقط عناصر _%2$s%%_ أكثر تكرارًا.

items.trinkets.ratskull.name=جمجمة جرذ
items.trinkets.ratskull.desc=هذه الحلية المروعة ليست أكبر بكثير من جمجمة جرذ عادي، وهو أمر نادر بطريقة ما في هذه الزنزانة. ويبدو أن التأثير السحري للجمجمة يجذب سكان الزنزانة الأكثر ندرة، مما يجعل ظهورهم أكثر تكرارًا بكثير.
items.trinkets.ratskull.typical_stats_desc=عادةً ما تجعل هذه الحلية الأعداء الغريبين النادرين _%dx_ أكثر احتمالًا للظهور. لكن الجمجمة لا تكون فعالة إلا بنصف هذه الكفاءة عند جذب المقلدين البلوريين والتماثيل المدرعة.
items.trinkets.ratskull.stats_desc=في مستواها الحالي، تجعل هذه الحلية الأعداء الغريبين النادرين _%dx_ أكثر احتمالًا للظهور. لكن الجمجمة لا تكون فعالة إلا بنصف هذه الكفاءة عند جذب المقلدين البلوريين والتماثيل المدرعة.

items.trinkets.saltcube.name=مكعب ملح
items.trinkets.saltcube.desc=قُطعت بلورة الملح الكبيرة هذه إلى شكل مكعب شبه مثالي، وتمكنت بطريقة ما من سحب نصف الماء من قدر الكيمياء بدلًا من الذوبان. ويبدو أنها تجفف الطعام الذي تأكله وتحفظه سحريًا، مما يطيل فترة الشبع التي تحصل عليها، لكنها تقلل أيضًا من استعادة صحتك عندما لا تكون جائعًا.
items.trinkets.saltcube.typical_stats_desc=عادةً ما تزيد هذه الحلية الوقت الذي يسبق شعورك بالجوع بنسبة _%1$s%%_، لكنها تقلل أيضًا معدل تجدد صحتك بنسبة _%2$s%%_ ما لم يكن الطابق مقفلاً.
items.trinkets.saltcube.stats_desc=في مستواها الحالي، تزيد هذه الحلية الوقت الذي يسبق شعورك بالجوع بنسبة _%1$s%%_، لكنها تقلل أيضًا معدل تجدد صحتك بنسبة _%2$s%%_ ما لم يكن الطابق مقفلاً.

items.trinkets.shardofoblivion.name=شظية النسيان
items.trinkets.shardofoblivion.desc=بعد طهيها في قدر الكيمياء، تغيرت هذه الشظية المعدنية الملعونة وأصبحت مصنوعة من... لا شيء؟ يبدو أن الضوء ينحني حولها، وهي تحوم في مكانها عندما لا تمسك بها. ويبدو أن الشظية تستمد قوتها سحريًا من جهلك، لذا ربما من الأفضل ألا تفكر فيها كثيرًا.
items.trinkets.shardofoblivion.typical_stats_desc=عادةً ما تزيد هذه الحلية معدل إسقاط الأعداء للغنائم بنسبة 20%% لكل قطعة من المعدات غير المحددة التي تجهزها أو استخدمتها مؤخرًا، بحد أقصى _%d عنصرًا_. كما تمنعك الشظية من التعرف على المعدات، لكنها يمكن استخدامها للتعرف يدويًا على العناصر الجاهزة لذلك.
items.trinkets.shardofoblivion.stats_desc=في مستواها الحالي، تزيد هذه الحلية معدل إسقاط الأعداء للغنائم بنسبة 20%% لكل قطعة من المعدات غير المحددة التي تجهزها أو استخدمتها مؤخرًا، بحد أقصى _%d عنصرًا_. كما تمنعك الشظية من التعرف على المعدات، لكنها يمكن استخدامها للتعرف يدويًا على العناصر الجاهزة لذلك.
items.trinkets.shardofoblivion.ac_identify=تعرّف
items.trinkets.shardofoblivion.identify_prompt=تعرّف على عنصر
items.trinkets.shardofoblivion.identify_ready=هناك عنصر جاهز للتعرف عليه: %s. استخدم شظية النسيان الخاصة بك عليه للتعرف عليه.
items.trinkets.shardofoblivion.identify_ready_worn=أصبحت جميع العناصر التي ترتديها جاهزة للتعرف عليها الآن. استخدم شظية النسيان على العناصر للتعرف عليها.
items.trinkets.shardofoblivion.identify_not_yet=هذا العنصر غير جاهز للتعرف عليه بعد.
items.trinkets.shardofoblivion.identify=لقد تعرفت على العنصر!
items.trinkets.shardofoblivion$wandusetracker.name=تم استخدام عصا غير محددة
items.trinkets.shardofoblivion$wandusetracker.desc=لقد استخدمت مؤخرًا عصا غير محددة، وتُحتسب مؤقتًا كقطعة واحدة من المعدات غير المحددة المستخدمة لصالح شظية النسيان.\n\nالأدوار المتبقية: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=تم استخدام سلاح مرمي غير محدد
items.trinkets.shardofoblivion$thrownusetracker.desc=لقد استخدمت مؤخرًا سلاحًا مرميًا غير محدد، ويُحتسب مؤقتًا كقطعة واحدة من المعدات غير المحددة المستخدمة لصالح شظية النسيان.\n\nالأدوار المتبقية: %s.

items.trinkets.thirteenleafclover.name=برسيم بثلاث عشرة ورقة
items.trinkets.thirteenleafclover.desc=تسبب الطهي في قدر الكيمياء بطريقة ما في نمو مجموعة من الأوراق الإضافية لهذا البرسيم! وليس من الواضح حقًا ما إذا كانت هذه الحلية محظوظة أم سيئة الحظ، وربما ستجعل حظك أكثر فوضوية؟
items.trinkets.thirteenleafclover.typical_stats_desc=عادةً ما تجعل هذه الحلية ضرباتك تلحق أقصى ضرر _%1$d%%_ من الوقت، وأدنى ضرر _%2$d%%_ من الوقت.
items.trinkets.thirteenleafclover.stats_desc=في مستواها الحالي، تجعل هذه الحلية ضرباتك تلحق أقصى ضرر _%1$d%%_ من الوقت، وأدنى ضرر _%2$d%%_ من الوقت.

items.trinkets.trapmechanism.name=آلية فخ
items.trinkets.trapmechanism.desc=الآلية الأساسية لأحد أفخاخ الحفر في الزنزانة، نُحتت بعناية من الأرض بحيث يمكن حملها. ويبدو أنها مرتبطة سحريًا بالزنزانة نفسها، مما يجعل التضاريس الخطرة أكثر شيوعًا، لكنه يزيد أيضًا من انسجامك معها.
items.trinkets.trapmechanism.typical_stats_desc=عادةً ما تجعل هذه الحلية _%1$d%%_ من الطوابق غير المصنفة تمتلئ بدلًا من ذلك إما بالأفخاخ أو بالهاويات. بالإضافة إلى ذلك، ستصبح _%2$d%%_ من الأفخاخ المخفية في الزنزانة مرئية بدلًا من ذلك.
items.trinkets.trapmechanism.stats_desc=في مستواها الحالي، تجعل هذه الحلية _%1$d%%_ من الطوابق غير المصنفة تمتلئ بدلًا من ذلك إما بالأفخاخ أو بالهاويات. بالإضافة إلى ذلك، ستصبح _%2$d%%_ من الأفخاخ المخفية في الزنزانة مرئية بدلًا من ذلك.

items.trinkets.vialofblood.name=قارورة دم
items.trinkets.vialofblood.desc=تحتوي هذه القارورة الرقيقة على دم أحد سكان الزنزانة، ويتحرك ببطء عندما تدير القارورة. ويبدو أنه يعزز سحريًا تأثيرات الشفاء الأقوى، لكنه يؤخرها أيضًا.
items.trinkets.vialofblood.typical_stats_desc=عادةً ما تزيد هذه الحلية إجمالي الصحة التي تحصل عليها من شرب جرعات العلاج أو استخدام قرب الماء أو آبار الصحة بنسبة _%1$s%%_. لكن تأثيرات الشفاء هذه تحدث أيضًا ببطء أكبر، إذ تستعيد حدًا أقصى قدره _%2$s_ من نقاط الصحة في كل دور (ويتناسب ذلك مع مستوى البطل).
items.trinkets.vialofblood.stats_desc=في مستواها الحالي، تزيد هذه الحلية إجمالي الصحة التي تحصل عليها من شرب جرعات العلاج أو استخدام قرب الماء أو آبار الصحة بنسبة _%1$s%%_. لكن تأثيرات الشفاء هذه تحدث أيضًا ببطء أكبر، إذ تستعيد حدًا أقصى قدره _%2$s_ من نقاط الصحة في كل دور (ويتناسب ذلك مع مستوى البطل).

items.trinkets.wondrousresin.name=راتنج عجيب
items.trinkets.wondrousresin.desc=يبدو أن هذا الراتنج الأزرق المتلألئ يحتوي على خلاصة مقطرة من سحر عصا ملعونة. ويبدو أن سحر قدر الكيمياء قد جعله أكثر استقرارًا إلى حد ما، وهو يؤثر الآن في عصاك السحرية.
items.trinkets.wondrousresin.typical_stats_desc=عادةً ما تجبر هذه الحلية تأثيرات العصي الملعونة على أن تصبح محايدة أو إيجابية _%1$s%%_ من الوقت، كما تجعل العصي غير الملعونة تطلق صاعقة ملعونة محايدة أو إيجابية إضافية _%2$s%%_ من الوقت.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.
items.trinkets.wondrousresin.stats_desc=في مستواها الحالي، تجبر هذه الحلية تأثيرات العصي الملعونة على أن تصبح محايدة أو إيجابية _%1$s%%_ من الوقت، كما تجعل العصي غير الملعونة تطلق صاعقة ملعونة محايدة أو إيجابية إضافية _%2$s%%_ من الوقت.\n\nتتطلب هذه الحلية كمية أكبر من الطاقة لترقيتها.

items.trinkets.trinketcatalyst.name=محفز سحري
items.trinkets.trinketcatalyst.window_title=إنشاء حلية
items.trinkets.trinketcatalyst.window_text=يبدأ الماء بالتوهج عندما تضيف المحفز. توجد بعض العناصر القريبة التي يمكنك إشباعها بالطاقة لتحويلها إلى حلية سحرية.
items.trinkets.trinketcatalyst.desc=تتلألأ هذه الكرة من الغبار الذهبي السحري في ظلام الزنزانة. ويمكن استخدام هذا المحفز في قدر الكيمياء مع قليل من الطاقة الكيميائية لإنتاج حلية فريدة.\n\nتوفر الحلي تأثيرات مختلفة تغير الزنزانة أو سكانها بشكل طفيف. ويمكن ترقية الحلي بالمزيد من الطاقة لجعل تأثيراتها أقوى، أو إسقاطها للتخلي عن تأثيرها بالكامل.
items.trinkets.trinketcatalyst$randomtrinket.name=حلية عشوائية
items.trinkets.trinketcatalyst$randomtrinket.desc=هناك عنصر قريب عالق داخل كيس لا يمكنك فتحه.\n\nستعمل عملية الكيمياء على إذابة الكيس، لكنك لن تعرف أي حلية ستحصل عليها حتى تفعل ذلك!

items.trinkets.trinket.discover_hint=لدى هذا العنصر فرصة ليظهر كخيار عند صناعة حلية عبر الكيمياء.
items.trinkets.trinket$placeholder.name=حلية

### العصي السحرية
items.wands.cursedwand.ondeath=لقد قتلتك عصاك %s.
