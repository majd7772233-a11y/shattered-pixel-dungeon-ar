items.weapon.weapon$enchantment.discover_hint=يمكنك العثور على عنصر يحمل هذا التأثير عشوائيًا في الزنزانة، أو حاول تطبيقه على عنصر بنفسك.


### عناصر متنوعة
items.amulet.name=تميمة يندور
items.amulet.ac_end=إنهاء اللعبة
items.amulet.desc=تميمة يندور هي أقوى قطعة أثرية معروفة لدى البشر والأقزام. تحتوي بلوراتها المتلألئة على قوة هائلة وعجيبة.
items.amulet.desc_origins=أصول التميمة مجهولة. تقول السجلات إن ملك الأقزام تفاخر بأنه اكتشف هذه القطعة الأثرية قبل وقت قصير من قطع حضارة الأقزام جميع الاتصالات. كيف وجدها؟ وكيف انتزع يوغ-دزيفا إياها منه؟ أسئلة لوقت آخر ربما، فكل ما يهم الآن هو أن التميمة أصبحت ملكك!
items.amulet.desc_ascent=أصول التميمة مجهولة، لكن من الواضح أنها تأثرت بشدة بقوة يوغ-دزيفا. يبدو أن الزنزانة تنحني لإرادة يوغ بينما تتقدم خلالها، مما يجعل الأعداء أكثر عددًا وقوة بكثير! كما أنك لم تعد قادرًا على تفعيل التميمة أو إسقاطها، وكأنها ملعونة.
items.amulet.ascent_title=الصعود
items.amulet.ascent_desc=تبدأ في الشعور بقوة يوغ-دزيفا العظيمة والمرعبة وهي تشع من التميمة. قد يكون الصعود مجددًا عبر الزنزانة وأنت مجرد بشر أصعب مما توقعت!\n\nإذا واصلت الصعود حاملًا التميمة، فستصبح الزنزانة أكثر خطورة، وسيتم تعطيل الانتقال الآني بين الطوابق، ولن تتمكن من الفوز باللعبة إلا بهزيمة الأعداء أثناء صعودك عبر الزنزانة!\n\nيمكنك ترك التميمة هنا في الوقت الحالي إذا كنت تريد الصعود دون بدء هذا التحدي، أو تفعيل التميمة قبل الصعود لإنهاء اللعبة بالطريقة المعتادة.
items.amulet.ascent_yes=تابع!
items.amulet.ascent_no=توقف الآن
items.amulet.discover_hint=يمكنك العثور على هذا العنصر في قاع الزنزانة...

items.ankh.name=عنخ
items.ankh.ac_bless=تبرك
items.ankh.bless=تبارك العنخ بالماء السحري.
items.ankh.desc=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. ستُسقط معظم العناصر في المكان الذي مت فيه، لكن يمكن استعادتها إذا عدت إليها. وباستخدام قربة ماء ممتلئة، يمكن تبركة العنخ ليصبح أكثر قوة.
items.ankh.desc_blessed=يمنح هذا الرمز القديم للخلود القدرة على العودة إلى الحياة بعد الموت. لقد تبارك العنخ وأصبح الآن أقوى بكثير. وسيضحي العنخ بنفسه لإنقاذك في لحظة الخطر المميت.
items.ankh.discover_hint=يمكنك شراء هذا العنصر من متجر.

items.arcaneresin.name=الراتنج الغامض
items.arcaneresin.prompt=اختر عصا سحرية
items.arcaneresin.ac_apply=تطبيق
items.arcaneresin.level_too_high=تلك العصا قوية جدًا بحيث لا يستطيع الراتنج تحسينها.
items.arcaneresin.not_enough=لا تملك ما يكفي من الراتنج لذلك!
items.arcaneresin.apply=تغطي عصاك بالراتنج، فتزداد قوتها!
items.arcaneresin.desc=يتلألأ هذا المسحوق الناعم بين درجات الأرجواني والأبيض. ويمكنه العمل كمضخم للطاقة السحرية، مما يزيد مستوى العصي عند تطبيقه عليها!\n\nتكلفة ترقية العصا هي 1 أو 2 أو 3 من الراتنج بحسب مستوى العصا الأولي. ويمكن للراتنج ترقية العصي حتى +3 كحد أقصى.\n\nلكن ترقيات الراتنج _يتم استبدالها بمصادر الترقية الأخرى_ (مثل لفائف الترقية)، ولا تُطبق عند إشباع عصا في عصا الساحر.
items.arcaneresin.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.brokenseal.name=الختم المكسور
items.brokenseal.ac_affix=تثبيت
items.brokenseal.prompt=اختر درعًا
items.brokenseal.unknown_armor=يجب أن تحدد أولًا ما إذا كان ذلك الدرع ملعونًا أم لا.
items.brokenseal.cursed_armor=لن يثبت الختم على درع ملعون.
items.brokenseal.affix=لقد ثبتَّ الختم على درعك!
items.brokenseal.desc=ختم من الشمع، مثبت على درع كرمز للشجاعة. نُقش في مركزه رمز باهت للحماية، وهو مشقوق إلى نصفين من المنتصف.\n\nتذكار من موطنه، يساعد الختم المحارب على الصمود. وأثناء ارتداء الختم، سيحصل المحارب فورًا على حماية عندما توشك صحته على الانخفاض إلى النصف أو أقل.\n\nيمكن _تثبيت الختم على درع_ ونقله بين الدروع. ويمكنه حمل ترقية واحدة معه، طالما تم تطبيق تلك الترقية على الدرع أثناء تثبيت الختم عليه.
items.brokenseal.inscribed=نُقش على الختم _%s._
items.brokenseal.choose_title=اختر نقشًا
items.brokenseal.choose_desc=يحمل كل من هذا الدرع والختم المكسور نقشًا. اختر النقش الذي يجب الاحتفاظ به.\n\nنقش الدرع: %1$s\nنقش الختم المكسور: %2$s\n\nلاحظ أنه إذا اخترت النقش الموجود حاليًا على الدرع، فلن يتمكن الختم من نقله لاحقًا.
items.brokenseal.discover_hint=يبدأ أحد الأبطال بهذا العنصر.
items.brokenseal$warriorshield.name=درع المحارب
items.brokenseal$warriorshield.desc_active=يساعد الختم المكسور للمحارب حاليًا على صموده، مانحًا إياه حماية إضافية فوق صحته. توجد فترة تهدئة بعد تفعيل الحماية لأول مرة قبل إمكانية استخدامها مجددًا.\n\nلا تتلاشى هذه الحماية بمرور الوقت، لكنها تنتهي إذا لم يكن هناك أعداء بالقرب منك لعدة أدوار. وعند انتهائها، ستقلل أي حماية غير مستخدمة من فترة التهدئة، بحد أقصى 50%%.\n\nالحماية المتبقية: %1$d.\n\nفترة التهدئة الحالية: %2$d.
items.brokenseal$warriorshield.desc_cooldown=حصل المحارب مؤخرًا على حماية من ختمه المكسور، وعليه الانتظار حتى يتمكن من الاستفادة من تأثير الحماية مجددًا.\n\nالأدوار المتبقية: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=فترة تهدئة درع المحارب سالبة حاليًا، مما يعني أنه عند تفعيل الدرع ستكون فترة التهدئة أقل من الـ150 دورًا المعتادة. ويمكن خفض فترة تهدئة الدرع حتى -150 دورًا، مما يعني أنه سيصبح متاحًا مجددًا فور تفعيله.\n\nفترة التهدئة الحالية: %d.

items.dewdrop.name=قطرة ندى
items.dewdrop.already_full=صحتك ممتلئة بالفعل.
items.dewdrop.desc=قطرة ندى صافية كالبلور.\n\nبفضل سحر هذا المكان، يمتلك الماء النقي خصائص علاجية بسيطة.

items.equipableitem.curse_detected=تشعر بأن العنصر ملعون قبل أن تجهزه مباشرة!
items.equipableitem.unequip_cursed=لا يمكنك إزالة عنصر ملعون!
