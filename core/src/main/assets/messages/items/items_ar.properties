items.weapon.weapon.hardening_gone=لقد زال تدعيم هذا السلاح!
items.weapon.weapon.incompatible=لقد أدى تفاعل أنواع السحر المختلفة إلى إبطال التعويذة الموجودة على هذا السلاح!
items.weapon.weapon.cursed_worn=لأن هذا السلاح ملعون، فأنت عاجز عن خلعه.
items.weapon.weapon.cursed=يمكنك الشعور بسحر خبيث يتربص داخل هذا السلاح.
