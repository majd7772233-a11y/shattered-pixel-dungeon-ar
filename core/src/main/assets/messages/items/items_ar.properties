items.artifacts.lloydsbeacon.desc=منارة لويد جهاز سحري معقد يمنح مستخدمه السيطرة على سحر الانتقال الآني. يمكن استخدام المنارة للعودة إلى موقع محدد، كما يمكنها إطلاق دفعات من سحر الانتقال الآني العشوائي بعد أن تُشحن من خلال تجهيزها. ويمكن توجيه هذا السحر إلى هدف أو إلى المستخدم نفسه.
