items.potions.potion.unknown_desc=تحتوي هذه القارورة على سائل ملوّن دوّار. من يدري ماذا سيحدث عند شربه أو رميه؟
items.potions.potion.harmful=جرعة ضارة!
items.potions.potion.beneficial=جرعة نافعة
items.potions.potion.yes=نعم، أعرف ما أفعله
items.potions.potion.no=لا، لقد غيّرت رأيي
items.potions.potion.sure_drink=هل أنت متأكد من أنك تريد شربها؟ في معظم الحالات، ينبغي أن ترمي مثل هذه الجرعات على أعدائك.
items.potions.potion.sure_throw=هل أنت متأكد من أنك تريد رميها؟ في معظم الحالات، من المنطقي أن تشربها.
items.potions.potion.shatter=تتحطم القارورة ويتناثر السائل دون أن يسبب ضررًا.
items.potions.potion.discover_hint=يمكنك العثور على هذا العنصر عشوائيًا في الزنزانة، أو صناعته عبر الكيمياء.
items.potions.potion$placeholder.name=جرعة
items.potions.potion$seedtopotion.name=جرعة عشوائية

items.potions.potionofexperience.name=جرعة الخبرة
items.potions.potionofexperience.desc=تجارب معارك لا حصر لها اختُزلت إلى صورة سائلة، سترفع هذه الجرعة مستوى خبرتك فورًا.

items.potions.potionoffrost.name=جرعة الصقيع
items.potions.potionoffrost.desc=ستتبخر المادة الكيميائية الموجودة في هذه الجرعة إلى سحابة متجمدة عند تعرضها للهواء الطلق.

items.potions.potionofhaste.name=جرعة السرعة
items.potions.potionofhaste.energetic=تشعر بالنشاط!
items.potions.potionofhaste.desc=سيمنحك شرب هذا السائل الغريب الحلاوة طاقة هائلة لفترة قصيرة، مما يسمح لك بالركض بسرعات عالية.

items.potions.potionofhealing.name=جرعة العلاج
items.potions.potionofhealing.heal=تبدأ جروحك بالانغلاق.
items.potions.potionofhealing.desc=سيعيد هذا الإكسير صحتك بسرعة ويعالج العديد من العلل فورًا.

items.potions.potionofinvisibility.name=جرعة الاختفاء
items.potions.potionofinvisibility.invisible=ترى يديك تتحولان إلى غير مرئيتين!
items.potions.potionofinvisibility.desc=سيؤدي شرب هذه الجرعة إلى جعلك غير مرئي مؤقتًا. وأثناء اختفائك، لن يتمكن الأعداء من رؤيتك. وستلغي الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) الاختفاء فورًا.

items.potions.potionoflevitation.name=جرعة التحليق
items.potions.potionoflevitation.float=تحلّق في الهواء!
items.potions.potionoflevitation.desc=سيجعلك شرب هذا السائل الغريب تحوم في الهواء، قادرًا على الانجراف فوق الأفخاخ والحفر دون عناء. وسيؤدي رمي هذه الجرعة إلى إنشاء سحابة من الغاز غير المكرر تربك كل من يقع داخلها.

items.potions.potionofliquidflame.name=جرعة اللهب السائل
items.potions.potionofliquidflame.desc=تحتوي هذه القارورة على مركب غير مستقر سيتحول بعنف إلى لهب عند تعرضه للهواء الطلق.

items.potions.potionofmindvision.name=جرعة رؤية العقل
items.potions.potionofmindvision.see_mobs=يمكنك بطريقة ما الشعور بوجود عقول مخلوقات أخرى!
items.potions.potionofmindvision.see_none=يمكنك بطريقة ما معرفة أنك وحيد في هذا الطابق في الوقت الحالي.
items.potions.potionofmindvision.desc=بعد شرب هذا، سيصبح عقلك متناغمًا مع البصمة النفسية للمخلوقات البعيدة، مما يمكّنك من استشعار الكائنات الحية عبر الجدران. كما ستسمح لك هذه الجرعة برؤية ما وراء الجدران والأبواب القريبة.

items.potions.potionofparalyticgas.name=جرعة الغاز المشلول
items.potions.potionofparalyticgas.desc=عند تعرضها للهواء الطلق، سيتحول السائل الموجود في هذه القارورة إلى ضباب أصفر مخدّر. وأي شخص يستنشق السحابة سيُصاب بالشلل فورًا، ويعجز عن الحركة لبعض الوقت بعد تبدد السحابة. ويمكن رمي هذا العنصر على الأعداء البعيدين لإحاطتهم بتأثير الغاز.

items.potions.potionofpurity.name=جرعة النقاء
items.potions.potionofpurity.freshness=تشعر بنقاء غير مألوف في الهواء.
items.potions.potionofpurity.protected=غشاء واقٍ يحيط بك!
items.potions.potionofpurity.desc=سيعمل هذا الكاشف السحري على تحييد جميع التأثيرات الضارة المرتبطة بالمنطقة بسرعة وفي نطاق واسع. وسيمنحك شربه مناعة مؤقتة ضد هذه التأثيرات.

items.potions.potionofstrength.name=جرعة القوة
items.potions.potionofstrength.msg=تندفع قوة جديدة عبر جسدك، ولديك الآن %d من القوة!
items.potions.potionofstrength.desc=سيسري هذا السائل القوي عبر عضلاتك، مما يزيد قوتك بشكل دائم بمقدار نقطة واحدة.

items.potions.potionoftoxicgas.name=جرعة الغاز السام
items.potions.potionoftoxicgas.desc=سيؤدي فتح هذه القارورة الزجاجية المضغوطة أو تحطيمها إلى انفجار محتوياتها في سحابة مميتة من الغاز الأخضر السام. وقد تختار قذف هذه الجرعة نحو الأعداء البعيدين بدلًا من فتحها بيدك.

### الجرعات المركزة
items.potions.brews.brew.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.potions.brews.aquabrew.name=جرعة مائية
items.potions.brews.aquabrew.desc=عند تحطيم هذه الجرعة، ستطلق دفعة من الماء المضغوط في موقعها. ولا تكفي قوتها إلا لإلحاق الضرر بالأعداء الناريين، لكنها تنشر الماء أيضًا على التضاريس القريبة، وتعطل الأفخاخ، وتطفئ الحرائق، وتدفع الشخصيات القريبة من موقع الانفجار إلى الخلف.

items.potions.brews.blizzardbrew.name=جرعة عاصفة ثلجية
items.potions.brews.blizzardbrew.desc=عند تحطيم هذه الجرعة، ستطلق عاصفة ثلجية دوارة تنتشر بسرعة مثل الغاز.

items.potions.brews.causticbrew.name=جرعة كاوية
items.potions.brews.causticbrew.desc=ستنشر هذه الجرعة وحلًا آكلًا في مساحة واسعة حول الموقع الذي تحطمت فيه. وسيبدأ أي شيء تصيبه هذه المادة بالذوبان ببطء إذا لم يتمكن من غسلها بالماء.

items.potions.brews.infernalbrew.name=جرعة جهنمية
items.potions.brews.infernalbrew.desc=عند تحطيم هذه الجرعة، ستطلق جحيمًا مستعرًا ينتشر بسرعة مثل الغاز.

items.potions.brews.shockingbrew.name=جرعة صاعقة
items.potions.brews.shockingbrew.desc=عند تحطيم هذه الجرعة، ستطلق عاصفة كهربائية في مساحة واسعة حول موقع تحطمها.

items.potions.brews.unstablebrew.name=جرعة غير مستقرة
items.potions.brews.unstablebrew.desc=تتوهج هذه الجرعة السحرية بألوان قوس قزح متغيرة.\n\nعند شربها أو رميها، ستُفعّل تأثير جرعة عشوائية. وسيكون تأثير الجرعة دائمًا نافعًا إذا تم شربها، ودائمًا ضارًا إذا تم رميها.

### الإكسير
items.potions.elixirs.elixir.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.potions.elixirs.elixirofarcanearmor.name=إكسير الدرع الغامض
items.potions.elixirs.elixirofarcanearmor.desc=سيمنح هذا الإكسير شاربه مقاومة طويلة الأمد للضرر السحري.

items.potions.elixirs.elixirofaquaticrejuvenation.name=إكسير التجدد المائي
items.potions.elixirs.elixirofaquaticrejuvenation.desc=يحتوي هذا الإكسير على بقايا من الهلام معززة بجرعة علاج. ورغم أنه لا يوفر شفاءً فوريًا، فإنه سيستعيد قدرًا أكبر من الصحة تدريجيًا أثناء وقوفك في الماء.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=الشفاء المائي
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=اكتسبت مؤقتًا خصائص علاجية مشابهة لخصائص الهلام.\n\nأثناء وقوفك في الماء، ستستعيد قدرًا صغيرًا من الصحة في كل دور. ويتوقف التأثير مؤقتًا عندما تكون صحتك ممتلئة أو عندما تخرج من الماء.\n\nالشفاء المتبقي: %d.

items.potions.elixirs.elixirofdragonsblood.name=إكسير دم التنين
items.potions.elixirs.elixirofdragonsblood.desc=عند شرب هذا الإكسير، ستتدفق قوة نارية عبر عروق شاربه. سيجعل هذا التأثير شاربه محصنًا ضد النار، ويسمح له بإشعال الأعداء بواسطة الهجمات الجسدية.

items.potions.elixirs.elixiroffeatherfall.name=إكسير السقوط الريشي
items.potions.elixirs.elixiroffeatherfall.light=تشعر بأنك خفيف كالريشة!
items.potions.elixirs.elixiroffeatherfall.desc=يوفر هذا الإكسير تأثير تحليق أضعف لكنه أكثر تحكمًا، مما يسمح لشاربه بالسقوط من مسافات شاهقة دون أن يتعرض للأذى لفترة قصيرة.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=السقوط الريشي
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=أنت تحت تأثير إكسير السقوط الريشي، مما يسمح لك بالسقوط في الهاويات دون التعرض للضرر!\n\nالأدوار المتبقية: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=إكسير الشفاء بالعسل
items.potions.elixirs.elixirofhoneyedhealing.desc=يجمع هذا الإكسير بين الشفاء وحلاوة العسل. وعند شربه، سيمنحك التأثير نفسه لجرعة علاج ويشبع قدرًا قليلًا من الجوع، لكنه يمكن أيضًا رميه لعلاج حليف.\n\nقد تهدأ المخلوقات المحبة للعسل إذا استُخدم هذا العنصر عليها.

items.potions.elixirs.elixiroficytouch.name=إكسير اللمسة الجليدية
items.potions.elixirs.elixiroficytouch.desc=عند شرب هذا الإكسير، سيتمكن شاربه من امتصاص الحرارة من الأعداء الذين يهاجمهم. سيجعل هذا التأثير شاربه محصنًا ضد البرد، ويسمح له بتبريد الأعداء بواسطة الهجمات الجسدية.

items.potions.elixirs.elixirofmight.name=إكسير البأس
items.potions.elixirs.elixirofmight.msg=تندفع قوة جديدة عبر جسدك، ولديك الآن %d من القوة!
items.potions.elixirs.elixirofmight.desc=سيسري هذا السائل القوي عبر عضلاتك، مما يزيد قوتك بشكل دائم بمقدار نقطة واحدة، ويزيد صحتك القصوى مؤقتًا بمقدار %d نقطة. يتناسب تعزيز الصحة مع صحتك القصوى، لكنه سيتلاشى ببطء كلما ارتقيت في المستويات.
items.potions.elixirs.elixirofmight$htboost.name=تعزيز الصحة القصوى
items.potions.elixirs.elixirofmight$htboost.desc=يشعر جسدك بقوة وصحة غير طبيعية.\n\nتم تعزيز صحتك القصوى لفترة طويلة. وكلما ارتقيت في المستويات، سيتلاشى هذا التعزيز تدريجيًا.\n\nمقدار التعزيز الحالي: %d.\nالمستويات المتبقية: %d.

items.potions.elixirs.elixiroftoxicessence.name=إكسير الجوهر السام
items.potions.elixirs.elixiroftoxicessence.desc=عند شرب هذا الإكسير، سيغمر شاربه بطاقة سامة. وسيطلق شاربه غازًا سامًا باستمرار أثناء تحركه، كما سيكون محصنًا ضد الغاز السام والسم لفترة أطول بقليل من مدة التأثير.



### الجرعات الغريبة
items.potions.exotic.exoticpotion.turquoise=جرعة فيروزية غريبة
items.potions.exotic.exoticpotion.crimson=جرعة قرمزية غريبة
items.potions.exotic.exoticpotion.azure=جرعة زرقاء سماوية غريبة
items.potions.exotic.exoticpotion.jade=جرعة يشمية غريبة
items.potions.exotic.exoticpotion.golden=جرعة ذهبية غريبة
items.potions.exotic.exoticpotion.magenta=جرعة أرجوانية غريبة
items.potions.exotic.exoticpotion.charcoal=جرعة فحمية غريبة
items.potions.exotic.exoticpotion.ivory=جرعة عاجية غريبة
items.potions.exotic.exoticpotion.amber=جرعة كهرمانية غريبة
items.potions.exotic.exoticpotion.bistre=جرعة بنية داكنة غريبة
items.potions.exotic.exoticpotion.indigo=جرعة نيلية غريبة
items.potions.exotic.exoticpotion.silver=جرعة فضية غريبة
items.potions.exotic.exoticpotion.unknown_desc=تحتوي هذه القارورة المستديرة على سائل ملوّن حُبيبي. يبدو أنه غريب عن هذه الأرض، فمن يدري ماذا قد يفعل عند شربه أو رميه؟
items.potions.exotic.exoticpotion.warning=هل تريد حقًا إلغاء استخدام هذه الجرعة؟ سيتم استهلاكها على أي حال.
items.potions.exotic.exoticpotion.yes=نعم، أنا متأكد تمامًا
items.potions.exotic.exoticpotion.no=لا، لقد غيّرت رأيي
items.potions.exotic.exoticpotion.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.potions.exotic.potionofcleansing.name=جرعة التطهير
items.potions.exotic.potionofcleansing.desc=سيجعل هذا الكاشف القوي شاربه محصنًا ضد جميع التأثيرات السلبية للحالات لبضع أدوار عند شربه. ويمكن أيضًا رميه على هدف لتطهيره.
items.potions.exotic.potionofcleansing$cleanse.name=مطهَّر
items.potions.exotic.potionofcleansing$cleanse.desc=هذه الشخصية محصنة مؤقتًا ضد جميع التأثيرات السلبية للحالات!\n\nالأدوار المتبقية: %s.

items.potions.exotic.potionofcorrosivegas.name=جرعة الغاز الأكّال
items.potions.exotic.potionofcorrosivegas.desc=سيؤدي فتح هذه القارورة الزجاجية المضغوطة أو تحطيمها إلى انفجار محتوياتها في سحابة مميتة من الغاز الأكّال بلون الصدأ. ينتشر الغاز بسرعة أكبر من الغاز السام وهو أكثر فتكًا، لكنه لا يدوم بالقدر نفسه.

items.potions.exotic.potionofdragonsbreath.name=جرعة نفس التنين
items.potions.exotic.potionofdragonsbreath.prompt=اختر موقعًا لإحراقه
items.potions.exotic.potionofdragonsbreath.desc=تحتوي هذه القارورة على مركب غير مألوف يشتعل بعد وقت قصير من امتزاجه باللعاب. يتيح بصق السائل بسرعة للمستخدم نفث اللهب من فمه!

items.potions.exotic.potionofearthenarmor.name=جرعة الدرع الترابي
items.potions.exotic.potionofearthenarmor.desc=بدلًا من التسبب في الشلل، يمتلك هذا السائل تأثيرًا مُقسيًا على الجلد، يحوله إلى درع طبيعي مؤقت.

items.potions.exotic.potionofdivineinspiration.name=جرعة الإلهام الإلهي
items.potions.exotic.potionofdivineinspiration.no_more_points=لا يمكنك الحصول على المزيد من نقاط المواهب الإضافية.
items.potions.exotic.potionofdivineinspiration.select_tier=اختر مستوى المواهب الذي تريد الحصول فيه على نقطتين إضافيتين. يجب أن تكون قد فتحت المستوى حتى تتمكن من إنفاق النقطتين.
items.potions.exotic.potionofdivineinspiration.bonus=+2 من نقاط المواهب!
items.potions.exotic.potionofdivineinspiration.desc=قوة الطاقة المقدسة مختزلة في صورة سائلة، ستمنح هذه الجرعة شاربه قوة إلهية، وتمنحه نقطتي مواهب إضافيتين في مستوى يختاره.\n\nلا يمكن استخدام هذه الجرعة إلا مرة واحدة لكل مستوى من مستويات المواهب.

items.potions.exotic.potionofmagicalsight.name=جرعة البصر السحري
items.potions.exotic.potionofmagicalsight.desc=بعد شرب هذه الجرعة، ستزداد حواسك مؤقتًا إلى مستويات مذهلة، مما يسمح لك برؤية ما وراء الجدران في نصف قطر قدره 12 بلاطة!

items.potions.exotic.potionofmastery.name=جرعة الإتقان
items.potions.exotic.potionofmastery.prompt=أتقن عنصرًا
items.potions.exotic.potionofmastery.weapon_easier=أصبح سلاحك أسهل في الاستخدام!
items.potions.exotic.potionofmastery.armor_easier=أصبح درعك أسهل في الارتداء!
items.potions.exotic.potionofmastery.desc=بدلًا من منح قوة خام، تعمل هذه الجرعة على مواءمة عضلات المستخدم مع عنصر معين. سيجعل ذلك العنصر أسهل في الاستخدام، كما لو أن الشارب تدرب عليه وبنى ذاكرة عضلية لاستخدامه.\n\nسيتطلب السلاح أو الدرع المختار نقطتين أقل من القوة لاستخدامه. ولا يمكن استخدام هذه الجرعة إلا مرة واحدة على كل عنصر.

items.potions.exotic.potionofshielding.name=جرعة الحماية
items.potions.exotic.potionofshielding.desc=بدلًا من الشفاء، ستُنشئ هذه الجرعة درعًا متينًا حول جسد المستخدم، يحجب قدرًا كبيرًا من الضرر.

items.potions.exotic.potionofshroudingfog.name=جرعة الضباب الساتر
items.potions.exotic.potionofshroudingfog.desc=عند تعرض السائل للهواء، سينتج عنه ضباب دخاني كثيف ينتشر بسرعة ويحجب رؤية أعدائك.

items.potions.exotic.potionofsnapfreeze.name=جرعة التجمد الفوري
items.potions.exotic.potionofsnapfreeze.desc=ستتفاعل المادة الكيميائية الموجودة في هذه الجرعة بسرعة مع الهواء، فتجمد وتُجذّر فورًا كل من يقع داخل تأثيرها.

items.potions.exotic.potionofstamina.name=جرعة التحمل
items.potions.exotic.potionofstamina.desc=سيمنحك شرب هذا السائل الغريب الحلاوة دفعة طويلة الأمد من الطاقة، مما يسمح لك بالركض بوتيرة سريعة لفترة طويلة.

items.potions.exotic.potionofstormclouds.name=جرعة سحب العاصفة
items.potions.exotic.potionofstormclouds.desc=سيؤدي رمي هذه الجرعة إلى إنشاء سحابة سريعة الانتشار من بخار مركز، سيتكثف وينهمر على البيئة. ستتحول معظم التضاريس إلى ماء، وسيتلقى الأعداء الناريون ضررًا، وستُطفأ النيران، وستُغمر الأفخاخ وتتحطم.



### عناصر المهام
items.quest.ceremonialcandle.name=شمعة طقسية
items.quest.ceremonialcandle.desc=مجموعة من الشموع، ذابت والتحمت معًا نتيجة استخدامها.\n\nلا قيمة لها بمفردها، لكن عند استخدامها مع شموع أخرى بنمط معين، يمكنها تركيز الطاقة اللازمة لطقس استدعاء.
items.quest.ceremonialcandle.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.corpsedust.name=غبار الجثث
items.quest.corpsedust.chill=قشعريرة تسري في عمودك الفقري.
items.quest.corpsedust.desc=لا تختلف كتلة غبار الجثث في مظهرها الخارجي عن كرة الغبار العادية. لكن يمكنك الشعور بطاقة خبيثة تتربص بداخلها.\n\nسيكون من الأفضل التخلص منها في أسرع وقت ممكن.
items.quest.corpsedust.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.darkgold.name=خام الذهب الداكن
items.quest.darkgold.you_now_have=لديك الآن %d من خام الذهب الداكن.
items.quest.darkgold.desc=يُسمى هذا المعدن داكنًا ليس بسبب لونه (فهو لا يختلف عن الذهب العادي)، بل لأنه يذوب تحت ضوء النهار، مما يجعله عديم الفائدة على السطح.
items.quest.darkgold.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.dwarftoken.name=رمز قزم
items.quest.dwarftoken.desc=يحمل العديد من الأقزام وبعض إبداعاتهم الأكبر حجمًا هذه القطع المعدنية الصغيرة ذات الغرض المجهول. ربما تكون مجوهرات أو نوعًا من بطاقات التعريف. الأقزام قوم غريبون.
items.quest.dwarftoken.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.embers.name=جمرات العناصر
items.quest.embers.desc=جمرات خاصة لا يمكن الحصول عليها إلا من العناصر النارية الصغيرة. إنها تشع بالطاقة الحرارية.
items.quest.embers.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.escapecrystal.name=بلورة الهروب
items.quest.escapecrystal.ac_use=استخدام
items.quest.escapecrystal.desc=بلورة سحرية رقيقة من بلورات التعاويذ، تبدو وكأنها تحتوي على سحر الانتقال الآني. يمكنك استخدام البلورة في أي وقت لمغادرة خزائن الأقزام، لكنك لن تتمكن من إخراج أي شيء معك!
items.quest.escapecrystal.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.gooblob.name=كتلة من الهلام
items.quest.gooblob.desc=كتلة هلامية هلامية متذبذبة، انفصلت عن الهلام عند موته. تبدو تقريبًا ككرة كبيرة من الجيلي، لكنك لن تجرؤ على أكلها.\n\nلا تفعل شيئًا بمفردها، لكنها قد تكون مفيدة عند دمجها مع جرعات معينة أو قنبلة. وعلى أقل تقدير، ينبغي أن تتحول إلى كمية جيدة من الطاقة.
items.quest.gooblob.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من بعض الأعداء.

items.quest.metalshard.name=شظية معدن ملعونة
items.quest.metalshard.desc=شظية من معدن ملعون صدئ، انفصلت عن DM-300 عندما تم تدميره. يمكنك الشعور بسحر خبيث غير نشط داخلها.\n\nلا تفعل شيئًا بمفردها، لكنها قد تكون مفيدة عند دمجها مع لفائف معينة أو قنبلة. وعلى أقل تقدير، ينبغي أن تتحول إلى كمية جيدة من الطاقة.
items.quest.metalshard.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من بعض الأعداء.

items.quest.pickaxe.name=معول
items.quest.pickaxe.ability_name=اختراق
items.quest.pickaxe.ability_desc=يمكن للمبارز _اختراق_ عدو باستخدام المعول. هذه الضربة مضمونة الإصابة، وتطبق تأثير الضعف لمدة 3 أدوار، وتلحق _%1$d-%2$d من الضرر_ بالأعداء ذوي الجلد الصلب.
items.quest.pickaxe.upgrade_ability_stat_name=ضرر القدرة
items.quest.pickaxe.desc=أداة متينة وثقيلة لتكسير الصخور. لا تحتاج إلى تجهيز المعول للتنقيب به، لكنه على الأرجح يمكن تجهيزه كسلاح عند الضرورة.
items.quest.pickaxe.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة معينة.

items.quest.ratskull.name=جمجمة جرذ عملاق
items.quest.ratskull.desc=جمجمة جرذ كبيرة بشكل مدهش. ستكون غنيمة صيد رائعة، لو كان لديك جدار لتعلقها عليه.



### البقايا
items.remains.remainsitem.ac_use=استخدام
items.remains.remainsitem.discover_hint=يمكنك العثور على هذا العنصر في بقايا بطل معين من جولة سابقة انتهت بخسارة.

items.remains.bowfragment.name=قطعة من القوس
items.remains.bowfragment.desc=كانت هذه القطعة الخشبية المكسورة جزءًا من قوس الصيادة الروحي المفقود. لا يزال بإمكانك الشعور بقليل من طاقة الطبيعة داخل القطعة، ويمكنك استخدامها لإنبات بعض العشب الطويل من حولك. لكن القيام بذلك سيدمر القطعة.

items.remains.brokenhilt.name=مقبض مكسور
items.remains.brokenhilt.desc=يبدو أن هذا المقبض المكسور كان جزءًا من سلاح مبارز هُزم. لا يزال بإمكانك الشعور بقليل من القوة القتالية المتبقية فيه، ويمكنك استخدامه للحصول على قدر قليل من الضرر الإضافي في ضربتيك القادمتين بالأسلحة القريبة. لكن القيام بذلك سيدمر المقبض.

items.remains.brokenstaff.name=عصا مكسورة
items.remains.brokenstaff.desc=انكسرت عصا هذا الساحر إلى نصفين بعد أن لقي صاحبها حتفه. لا يزال بإمكانك الشعور ببعض الطاقة السحرية المتبقية في العصا، ويمكنك استخدامها لمنح عصاك السحرية دفعة صغيرة من الشحن. لكن القيام بذلك سيدمر العصا.

items.remains.cloakscrap.name=قطعة قماش
items.remains.cloakscrap.desc=تبدو هذه القطعة من القماش الشفاف وكأنها جاءت من عباءة الظلال الخاصة بلص لقي حتفه. لا تزال تحمل القليل من الطاقة الغامضة، ويمكنك استخدامها لمنح قطعك الأثرية دفعة صغيرة من الشحن. لكن القيام بذلك سيدمر القماش.

items.remains.sealshard.name=شظايا الختم
items.remains.sealshard.desc=تبدو شظايا الشمع الأحمر الصغيرة هذه وكأنها جاءت من ختم محارب سقط. لا تزال تشعر بقليل من قوة الإرادة متشبثة بالختم، ويمكنك استخدامها لمنح نفسك قدرًا قليلًا من الحماية. لكن القيام بذلك سيدمر شظايا الختم.

items.remains.tornpage.name=صفحة ممزقة
items.remains.tornpage.desc=تبدو هذه الصفحة وكأنها اقتُلعت من المخطوطة المقدسة لكاهن لقي حتفه. لا تزال تحمل القليل من الطاقة الإلهية، ويمكنك استخدامها لاستعادة قدر بسيط من الصحة. لكن القيام بذلك سيدمر الصفحة الممزقة.



### الخواتم
items.rings.ring.diamond=خاتم ألماسي
items.rings.ring.opal=خاتم أوبال
items.rings.ring.garnet=خاتم عقيق أحمر
items.rings.ring.ruby=خاتم ياقوت
items.rings.ring.amethyst=خاتم جمشت
items.rings.ring.topaz=خاتم توباز
items.rings.ring.onyx=خاتم عقيق أسود
items.rings.ring.tourmaline=خاتم تورمالين
items.rings.ring.emerald=خاتم زمرد
items.rings.ring.sapphire=خاتم ياقوت أزرق
items.rings.ring.quartz=خاتم كوارتز
items.rings.ring.agate=خاتم عقيق
items.rings.ring.equip_cursed=ينقبض الخاتم حول إصبعك بشكل مؤلم!
items.rings.ring.unknown_desc=هذا الطوق المعدني مزين بحجر كريم كبير يتلألأ في الظلام. من يدري ما تأثيره عند ارتدائه؟
items.rings.ring.known=هذا خاتم من نوع %s
items.rings.ring.identify=أصبحت الآن معتادًا بما يكفي على خاتمك لتتمكن من تحديد ماهيته.
items.rings.ring.cursed_worn=لأن هذا الخاتم ملعون، فأنت عاجز عن خلعه.
items.rings.ring.curse_known=يمكنك الشعور بسحر خبيث يتربص داخل هذا الخاتم.
items.rings.ring.not_cursed=هذا الخاتم خالٍ من السحر الخبيث.

items.rings.ringofaccuracy.name=خاتم الدقة
items.rings.ringofaccuracy.stats=عند ارتداء هذا الخاتم، ستزداد دقتك بنسبة _%s%%._
items.rings.ringofaccuracy.typical_stats=عند ارتداء هذا الخاتم، ستزداد دقتك عادةً بنسبة _%s%%._
items.rings.ringofaccuracy.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد دقتك بنسبة _%s%%_ إجمالًا.
items.rings.ringofaccuracy.upgrade_stat_name_1=تعزيز الدقة
items.rings.ringofaccuracy.desc=يزيد هذا الخاتم من تركيزك، مما يجعل هجماتك أكثر قدرة على إصابة أهدافها. أما الخاتم الملعون فسيجعل هجماتك أكثر صعوبة في إصابة أهدافها.

items.rings.ringofarcana.name=خاتم السحر
items.rings.ringofarcana.stats=عند ارتداء هذا الخاتم، ستزداد قوة التعويذات السحرية والنقوش بنسبة _%s%%._
items.rings.ringofarcana.typical_stats=عند ارتداء هذا الخاتم، ستزداد قوة التعويذات السحرية والنقوش عادةً بنسبة _%s%%._
items.rings.ringofarcana.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد قوة التعويذات السحرية والنقوش بنسبة _%s%%_ إجمالًا.
items.rings.ringofarcana.upgrade_stat_name_1=تعزيز السحر
items.rings.ringofarcana.desc=يعزز هذا الخاتم التعويذات السحرية على الأسلحة والنقوش على الدروع، بما في ذلك اللعنات! يزيد أولًا من فرصة التفعيل، ثم يزيد قوة التأثير عندما تصل فرصة التفعيل إلى 100٪. أما الخاتم الملعون فسيضعف التعويذات والنقوش واللعنات بدلًا من ذلك.

items.rings.ringofelements.name=خاتم العناصر
items.rings.ringofelements.stats=عند ارتداء هذا الخاتم، سيمنحك مقاومة للعناصر بنسبة _%s%%._
items.rings.ringofelements.typical_stats=عند ارتداء هذا الخاتم، سيمنحك عادةً مقاومة للعناصر بنسبة _%s%%._
items.rings.ringofelements.combined_stats=تجمع خواتمك المجهزة قوتها، مما يمنحك مقاومة للعناصر بنسبة _%s%%_ إجمالًا.
items.rings.ringofelements.upgrade_stat_name_1=المقاومة
items.rings.ringofelements.desc=يوفر هذا الخاتم مقاومة لمعظم التأثيرات العنصرية والسحرية، مما يقلل الضرر ومدة التأثيرات السلبية. وبطبيعة الحال، سيؤدي الخاتم الملعون إلى تفاقم هذه التأثيرات بدلًا من ذلك.

items.rings.ringofenergy.name=خاتم الطاقة
items.rings.ringofenergy.stats=عند ارتداء هذا الخاتم، سيزيد سرعة شحن العصي والقطع الأثرية والدروع البطولية بنسبة _%s%%._
items.rings.ringofenergy.typical_stats=عند ارتداء هذا الخاتم، سيزيد عادةً سرعة شحن العصي والقطع الأثرية والدروع البطولية بنسبة _%s%%._
items.rings.ringofenergy.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد سرعة الشحن بنسبة _%s%%_ إجمالًا.
items.rings.ringofenergy.upgrade_stat_name_1=تعزيز الشحن
items.rings.ringofenergy.desc=ستُعاد شحنة معداتك السحرية بسرعة أكبر في المجال السحري المنبعث من هذا الخاتم. أما الخاتم الملعون فسيبطئ إعادة الشحن بدلًا من ذلك.

items.rings.ringofevasion.name=خاتم التهرب
items.rings.ringofevasion.stats=عند ارتداء هذا الخاتم، سيزيد تهربك بنسبة _%s%%._
items.rings.ringofevasion.typical_stats=عند ارتداء هذا الخاتم، سيزيد تهربك عادةً بنسبة _%s%%._
items.rings.ringofevasion.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد تهربك بنسبة _%s%%_ إجمالًا.
items.rings.ringofevasion.upgrade_stat_name_1=تعزيز التهرب
items.rings.ringofevasion.desc=يسرّع هذا الخاتم ردود أفعال مرتديه، مما يجعل إصابته بالضربات أكثر صعوبة. أما الخاتم الملعون فسيجعل المستخدم أسهل في الإصابة بدلًا من ذلك.

items.rings.ringofforce.name=خاتم القوة
items.rings.ringofforce.stats=عند عدم حمل سلاح، وبحسب قوتك الحالية، سيلحق هذا الخاتم _%1$d-%2$d من الضرر._ وعند تجهيز سلاح، سيزيد هذا الخاتم الضرر بمقدار _%3$d._
items.rings.ringofforce.typical_stats=عند عدم حمل سلاح، وبحسب قوتك الحالية، سيلحق هذا الخاتم عادةً _%1$d-%2$d من الضرر._ وعند تجهيز سلاح، سيزيد هذا الخاتم عادةً الضرر بمقدار _%3$d._
items.rings.ringofforce.combined_stats=تجمع خواتمك المجهزة قوتها، لتلحق إجمالًا _%1$d-%2$d من الضرر_ دون سلاح، أو تزيد الضرر بمقدار _%3$d_ عند استخدام سلاح.
items.rings.ringofforce.upgrade_stat_name_1=ضرر دون سلاح
items.rings.ringofforce.upgrade_stat_name_2=تعزيز ضرر السلاح
items.rings.ringofforce.upgrade_stat_name_3=ضرر القدرة
items.rings.ringofforce.ability_name=وضعية الشجاع
items.rings.ringofforce.typical_ability_desc=يمكن للمبارزة اتخاذ _وضعية الشجاع_ باستخدام هذا الخاتم، مما يجعل هجماتها العادية تستخدم هذا الخاتم دائمًا حتى عند تجهيز سلاح. وستلحق هذه الهجمات عادةً _%1$d-%2$d من الضرر_، كما سترث نقش السلاح وتعزيزه. وتُبطئ هذه الوضعية سرعة إعادة شحن السلاح بنسبة 50%%.
items.rings.ringofforce.ability_desc=يمكن للمبارزة اتخاذ _وضعية الشجاع_ باستخدام هذا الخاتم، مما يجعل هجماتها العادية تستخدم هذا الخاتم دائمًا حتى عند تجهيز سلاح. وستلحق هذه الهجمات _%1$d-%2$d من الضرر_، كما سترث نقش السلاح وتعزيزه. وتُبطئ هذه الوضعية سرعة إعادة شحن السلاح بنسبة 50%%.
items.rings.ringofforce.desc=يعزز هذا الخاتم قوة ضربات مرتديه القريبة. وتكون هذه القوة الإضافية ضعيفة نسبيًا عند استخدام الأسلحة، لكن الهجوم دون سلاح يصبح أقوى بكثير. أما الخاتم الملعون فسيضعف ضربات مرتديه بدلًا من ذلك.
items.rings.ringofforce$brawlersstance.name=وضعية الشجاع
items.rings.ringofforce$brawlersstance.desc=أثناء هذه الوضعية، ستستخدم هجمات المبارزة العادية خاتم القوة المجهز حتى عند حملها لسلاح. تحصل هذه الهجمات على ضرر إضافي، وستظل تستخدم تعزيز السلاح ونقشه.\n\nلكن الحفاظ على هذه الوضعية يتطلب تركيزًا، مما يقلل سرعة إعادة شحن قدرة السلاح بنسبة 50٪.\n\nيمكن تشغيل هذه الوضعية أو إيقافها باستخدام خاتم القوة، لكن تقليل سرعة الشحن سيستمر لفترة قصيرة إذا تم تفعيل الوضعية وإلغاء تفعيلها بسرعة.

items.rings.ringoffuror.name=خاتم الهيجان
items.rings.ringoffuror.stats=عند ارتداء هذا الخاتم، ستزداد سرعة هجماتك بنسبة _%s%%._
items.rings.ringoffuror.typical_stats=عند ارتداء هذا الخاتم، ستزداد سرعة هجماتك عادةً بنسبة _%s%%._
items.rings.ringoffuror.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد سرعة هجماتك بنسبة _%s%%_ إجمالًا.
items.rings.ringoffuror.upgrade_stat_name_1=تعزيز سرعة الهجوم
items.rings.ringoffuror.desc=يمنح هذا الخاتم مرتديه غضبًا داخليًا، مما يسمح له بالهجوم بسرعة أكبر. أما الخاتم الملعون فسيبطئ سرعة هجوم مرتديه بدلًا من ذلك.

items.rings.ringofhaste.name=خاتم السرعة
items.rings.ringofhaste.stats=عند ارتداء هذا الخاتم، ستزداد سرعة حركتك بنسبة _%s%%._
items.rings.ringofhaste.typical_stats=عند ارتداء هذا الخاتم، ستزداد سرعة حركتك عادةً بنسبة _%s%%._
items.rings.ringofhaste.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد سرعة حركتك بنسبة _%s%%_ إجمالًا.
items.rings.ringofhaste.upgrade_stat_name_1=تعزيز سرعة الحركة
items.rings.ringofhaste.desc=يقلل هذا الخاتم من إجهاد الحركة على مرتديه، مما يسمح له بالركض بسرعات تفوق قدرات البشر. أما الخاتم الملعون فسيثقل كاهل مرتديه بدلًا من ذلك.

items.rings.ringofmight.name=خاتم البأس
items.rings.ringofmight.stats=عند ارتداء هذا الخاتم، ستزداد قوتك بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%._
items.rings.ringofmight.typical_stats=عند ارتداء هذا الخاتم، ستزداد قوتك عادةً بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%._
items.rings.ringofmight.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد قوتك بمقدار _%1$d_ وصحتك القصوى بنسبة _%2$s%%_ إجمالًا.
items.rings.ringofmight.upgrade_stat_name_1=تعزيز القوة
items.rings.ringofmight.upgrade_stat_name_2=تعزيز الصحة القصوى
items.rings.ringofmight.desc=يعزز هذا الخاتم الصفات الجسدية لمرتديه، ويمنحه قوة جسدية وبنية أقوى. أما الخاتم الملعون فسيضعف مرتديه.

items.rings.ringofsharpshooting.name=خاتم القنص
items.rings.ringofsharpshooting.stats=عند ارتداء هذا الخاتم، سيعزز ضرر أسلحتك المرمية كما لو أن مستواها قد زاد بمقدار _%1$d_، وسيزيد متانتها بنسبة _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=عند ارتداء هذا الخاتم، سيعزز عادةً ضرر أسلحتك المرمية كما لو أن مستواها قد زاد بمقدار _%1$d_، وسيزيد متانتها بنسبة _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد مستوى أسلحتك المرمية الفعلي بمقدار _%1$d_ ويزيد متانتها بنسبة _%2$s%%_ إجمالًا.
items.rings.ringofsharpshooting.upgrade_stat_name_1=تعزيز الضرر حسب المستوى
items.rings.ringofsharpshooting.upgrade_stat_name_2=تعزيز المتانة
items.rings.ringofsharpshooting.desc=يعزز هذا الخاتم دقة مرتديه وتصويبه، مما يجعل جميع الأسلحة القاذفة أكثر ضررًا ومتانة. أما الخاتم الملعون فسيكون له التأثير المعاكس.

items.rings.ringoftenacity.name=خاتم الصمود
items.rings.ringoftenacity.stats=عند ارتداء هذا الخاتم، سيقلل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%._
items.rings.ringoftenacity.typical_stats=عند ارتداء هذا الخاتم، سيقلل عادةً الضرر الذي تتلقاه بنسبة تصل إلى _%s%%._
items.rings.ringoftenacity.combined_stats=تجمع خواتمك المجهزة قوتها، مما يقلل الضرر الذي تتلقاه بنسبة تصل إلى _%s%%_ إجمالًا.
items.rings.ringoftenacity.upgrade_stat_name_1=الحد الأقصى لمقاومة الضرر
items.rings.ringoftenacity.desc=عند ارتداء هذا الخاتم، سيتمكن مرتديه من مقاومة الضربات التي تكون قاتلة في المعتاد. وكلما زادت إصابة المستخدم، زادت مقاومته للضرر. أما الخاتم الملعون فسيجعل من الأسهل على الأعداء القضاء على مرتديه.

items.rings.ringofwealth.name=خاتم الثروة
items.rings.ringofwealth.stats=عند ارتداء هذا الخاتم، سيزيد حظك بنسبة _%s%%._
items.rings.ringofwealth.typical_stats=عند ارتداء هذا الخاتم، سيزيد عادةً حظك بنسبة _%s%%._
items.rings.ringofwealth.combined_stats=تجمع خواتمك المجهزة قوتها، مما يزيد حظك بنسبة _%s%%_ إجمالًا.
items.rings.ringofwealth.upgrade_stat_name_1=تعزيز الحظ
items.rings.ringofwealth.desc=يعمل هذا الخاتم كمغناطيس للكنوز، مما يزيد احتمال أن يحمل الأعداء والحاويات عناصر ثمينة. أما الخاتم الملعون فسيقلل فرصتك في الحصول على الغنائم بدلًا من ذلك.



