items.weapon.melee.warhammer.name=مطرقة حرب
items.weapon.melee.warhammer.stats_desc=هذا سلاح دقيق نسبيًا.
items.weapon.melee.warhammer.ability_name=ضربة ثقيلة
items.weapon.melee.warhammer.typical_ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام مطرقة حرب. تلحق هذه الضربة المركزة عادةً _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.warhammer.ability_desc=يمكن للمبارزة تنفيذ _ضربة ثقيلة_ باستخدام مطرقة حرب. تلحق هذه الضربة المركزة _%1$d-%2$d من الضرر_ إذا فاجأت العدو، وتصيب العدو بالذهول لمدة 5 أدوار، مما يقلل الدقة والتهرب بنسبة 50%%. تصيب الضربة الثقيلة دائمًا، لكنها تلحق الضرر المعتاد إذا لم تفاجئ العدو.
items.weapon.melee.warhammer.desc=قليل من المخلوقات يستطيع تحمل الضربة الساحقة لهذه الكتلة الشاهقة من الرصاص والفولاذ، لكن استخدامها بفعالية يتطلب قوة هائلة.

items.weapon.melee.warscythe.name=منجل حرب
items.weapon.melee.warscythe.stats_desc=هذا سلاح غير دقيق نسبيًا.
items.weapon.melee.warscythe.ability_name=الحصاد
items.weapon.melee.warscythe.typical_ability_desc=يمكن للمبارزة _حصاد_ عدو باستخدام منجل الحرب. هذه الضربة المدمرة مضمونة الإصابة، وتلحق عادةً _%d من الضرر_. ويتحول هذا الضرر إلى نزيف إذا لم يكن الهدف محصنًا ضده.
items.weapon.melee.warscythe.ability_desc=يمكن للمبارزة _حصاد_ عدو باستخدام منجل الحرب. هذه الضربة المدمرة مضمونة الإصابة، وتلحق _%d من الضرر_. ويتحول هذا الضرر إلى نزيف إذا لم يكن الهدف محصنًا ضده.
items.weapon.melee.warscythe.desc=عززت هذه الأداة الكبيرة وصعبة الاستخدام لتصبح أفضل في قطع الأعداء من المحاصيل.

items.weapon.melee.whip.name=سوط
items.weapon.melee.whip.stats_desc=لهذا السلاح مدى وصول هائل.
items.weapon.melee.whip.ability_name=جلد
items.weapon.melee.whip.typical_ability_desc=يمكن للمبارزة _جلد_ جميع الأعداء من حولها باستخدام السوط. تلحق هذه القدرة عادةً _%1$d-%2$d من الضرر_، وتهاجم جميع الأعداء ضمن مدى الهجوم، وهي مضمونة الإصابة.
items.weapon.melee.whip.ability_desc=يمكن للمبارزة _جلد_ جميع الأعداء من حولها باستخدام السوط. تلحق هذه القدرة _%1$d-%2$d من الضرر_، وتهاجم جميع الأعداء ضمن مدى الهجوم، وهي مضمونة الإصابة.
items.weapon.melee.whip.desc=رغم أن الحبل الشائك في نهاية هذا السلاح يلحق ضررًا ضعيفًا، فإن مداه لا يُضاهى.

items.weapon.melee.wornshortsword.name=سيف قصير مهترئ
items.weapon.melee.wornshortsword.ability_name=شق
items.weapon.melee.wornshortsword.typical_ability_desc=يمكن للمبارزة _شق_ عدو باستخدام سيف قصير مهترئ. تلحق هذه الضربة عادةً _%1$d-%2$d من الضرر_ وهي مضمونة الإصابة. وإذا قتلت ضربة الشق عدوًا، فإنها تصبح فورية، ويمكن للمبارزة استخدام الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.wornshortsword.ability_desc=يمكن للمبارزة _شق_ عدو باستخدام سيف قصير مهترئ. تلحق هذه الضربة _%1$d-%2$d من الضرر_ وهي مضمونة الإصابة. وإذا قتلت ضربة الشق عدوًا، فإنها تصبح فورية، ويمكن للمبارزة استخدام الشق مرة أخرى مجانًا خلال 5 أدوار.
items.weapon.melee.wornshortsword.desc=سيف قصير جدًا، تآكل بسبب الاستخدام المكثف. وهو أضعف وأخف قليلًا من السيف القصير ذي الحالة الأفضل.
items.weapon.melee.wornshortsword.discover_hint=يبدأ أحد الأبطال بهذا العنصر.


### الأسلحة القاذفة
items.weapon.missiles.darts.adrenalinedart.name=سهم الأدرينالين
items.weapon.missiles.darts.adrenalinedart.desc=هذه الأسهم مغموسة بمركب أساسه شوك الشفاء السريع، يعزز سرعة حركة الحلفاء وهجومهم، أو يخفض سرعة حركة الأعداء لفترة وجيزة. والسهم نفسه لا يزال ضارًا بالأعداء، لكنه لا يؤذي الحلفاء.

items.weapon.missiles.darts.blindingdart.name=سهم الإعماء
items.weapon.missiles.darts.blindingdart.desc=هذه الأسهم مغموسة بمركب أساسه عشب العمى، يصيب هدفها بالعمى لفترة قصيرة. لكنه لا يربكه، لذا سيظل العدو يعرف المكان الذي رآك فيه آخر مرة.

items.weapon.missiles.darts.chillingdart.name=سهم مبرد
items.weapon.missiles.darts.chillingdart.desc=هذه الأسهم مغموسة بمركب أساسه قبعة الجليد، وسيصيب هدفها ببرودة شديدة.

items.weapon.missiles.darts.cleansingdart.name=سهم التطهير
items.weapon.missiles.darts.cleansingdart.desc=هذه الأسهم مغموسة بمركب أساسه الماغيرويال، سيجعل الحلفاء محصنين مؤقتًا ضد جميع التأثيرات السلبية، أو يزيل التأثيرات الإيجابية من الأعداء. وقد ينسى الأعداء لفترة وجيزة حتى أنهم يهاجمونك أو يهربون منك. والسهم نفسه لا يزال ضارًا بالأعداء، لكنه لا يؤذي الحلفاء.

items.weapon.missiles.darts.dart.name=سهم
items.weapon.missiles.darts.dart.ac_tip=تغميس
items.weapon.missiles.darts.dart.prompt=اختر بذرة
items.weapon.missiles.darts.dart.tip_title=تغميس الأسهم
items.weapon.missiles.darts.dart.tip_desc=يمكن دمج بذرة مع سهم واحد أو سهمين لتغميسهما. وينتج كل نوع من البذور نوعه الخاص من الأسهم المغموسة، مع تأثير فريد يُستخدم مرة واحدة.\n\nسيؤدي تغميس سهم بهذه البذور إلى إنتاج _%s._
items.weapon.missiles.darts.dart.tip_all=غمّس %1$d من الأسهم باستخدام %2$d من البذور
items.weapon.missiles.darts.dart.tip_two=غمّس سهمين باستخدام بذرة واحدة
items.weapon.missiles.darts.dart.tip_one=غمّس سهمًا واحدًا باستخدام بذرة واحدة
items.weapon.missiles.darts.dart.tip_cancel=إلغاء
items.weapon.missiles.darts.dart.desc=هذه الأعواد الخشبية البسيطة ذات الرؤوس المدببة موزونة بطريقة تجعلها تطير بدقة وتلسع فريستها بحركة سريعة من المعصم. ويمكن تغميسها بالبذور للحصول على تأثيرات إضافية عند رميها.
items.weapon.missiles.darts.dart.unlimited_uses=بفضل تصميمها البسيط، ستدوم الأسهم عمليًا إلى الأبد.

items.weapon.missiles.darts.displacingdart.name=سهم الإزاحة
items.weapon.missiles.darts.displacingdart.desc=هذه الأسهم مغموسة بمركب أساسه ورق التلاشي، ينقل هدفها آنيًا لمسافة قصيرة بعيدًا.

items.weapon.missiles.darts.healingdart.name=سهم العلاج
items.weapon.missiles.darts.healingdart.desc=هذه الأسهم مغموسة بمركب أساسه عشب الشمس، يمنح هدفها دفعة من الشفاء. والسهم نفسه لا يزال ضارًا بالأعداء، لكنه لا يؤذي الحلفاء.

items.weapon.missiles.darts.holydart.name=سهم مقدس
items.weapon.missiles.darts.holydart.desc=هذه الأسهم مغموسة بمركب أساسه زهرة النجمة، ويشبع هدفها بالطاقة المقدسة. وسيصبح الحلفاء والأعداء العاديون مباركين، بينما يتلقى الأعداء الموتى الأحياء أو الشياطين ضررًا هائلًا. والسهم نفسه لا يزال ضارًا بالأعداء، لكنه لا يؤذي الحلفاء.

items.weapon.missiles.darts.incendiarydart.name=سهم حارق
items.weapon.missiles.darts.incendiarydart.desc=هذه الأسهم مغموسة بمركب أساسه زهرة اللهب، ينفجر في ألسنة لهب ساطعة عند الاصطدام.

items.weapon.missiles.darts.paralyticdart.name=سهم مشلّ
items.weapon.missiles.darts.paralyticdart.desc=هذه الأسهم مغموسة بمركب أساسه جذر الأرض، يصيب هدفها بالشلل لفترة قصيرة.

items.weapon.missiles.darts.poisondart.name=سهم سام
items.weapon.missiles.darts.poisondart.desc=هذه الأسهم مغموسة بمركب أساسه طحلب الحزن، ويسمم هدفها.

items.weapon.missiles.darts.rotdart.name=سهم العفن
items.weapon.missiles.darts.rotdart.desc=هذه الأسهم الشريرة مغموسة بمركب حمضي أساسه ثمرة العفن، والذي يأكل بعنف في كل ما يلامسه السهم. وسيقاوم الأعداء الأقوياء معظم التأثير، لكن التآكل قوي بما يكفي لقتل معظم الأعداء العاديين بسهولة. وتدوم هذه الأسهم لفترة أطول من الأسهم المغموسة الأخرى، لكن لا يمكن تعزيز متانتها.
items.weapon.missiles.darts.rotdart.discover_hint=يمكنك إنشاء هذا العنصر باستخدام بذرة من مهمة معينة.

items.weapon.missiles.darts.shockingdart.name=سهم صاعق
items.weapon.missiles.darts.shockingdart.desc=هذه الأسهم مغموسة بمركب أساسه كرمة العاصفة، ويوصل صدمة قوية إلى هدفها.

items.weapon.missiles.darts.tippeddart.ac_clean=تنظيف
items.weapon.missiles.darts.tippeddart.clean_title=تنظيف الأسهم
items.weapon.missiles.darts.tippeddart.clean_desc=سيزيل هذا الإجراء تغميس البذرة من أسهمك، ويعيدها إلى حالتها كأسهم عادية.
items.weapon.missiles.darts.tippeddart.clean_all=تنظيف الكل
items.weapon.missiles.darts.tippeddart.clean_one=تنظيف واحد
items.weapon.missiles.darts.tippeddart.cancel=إلغاء
items.weapon.missiles.darts.tippeddart.uses_left=تتبقى لهذه المجموعة من الأسهم _%d/%d_ من الاستخدامات قبل زوال تأثير أحد التغميسات.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_لكن جودتها عالية جدًا لدرجة أنها ستدوم عمليًا إلى الأبد._
items.weapon.missiles.darts.tippeddart.about_to_break=أوشك رأس سهمك على الانتهاء.
items.weapon.missiles.darts.tippeddart.has_broken=انتهى تأثير تغميس سهمك.
items.weapon.missiles.darts.tippeddart.discover_hint=يمكنك شراء هذا العنصر من متجر، أو صنعه باستخدام بذرة.


items.weapon.missiles.bolas.name=بولاس
items.weapon.missiles.bolas.stats_desc=يُصيب هذا السلاح هدفه بالإعاقة.
items.weapon.missiles.bolas.desc=هذه الأسلحة بعيدة المدى غير المعتادة لا تلحق ضررًا كبيرًا، لكنها ممتازة في إبطاء هدفها.

items.weapon.missiles.boomerang.name=بوميرانغ
items.weapon.missiles.boomerang.desc=عند رمي هذا السلاح الخشبي المسطح والمنحني على عدو، سيعود إلى يد من رماه.
items.weapon.missiles.boomerang.durability=بفضل بنيته الصلبة، لن ينكسر هذا البوميرانغ من الاستخدام.

items.weapon.missiles.fishingspear.name=رمح صيد
items.weapon.missiles.fishingspear.desc=رماح رمي صغيرة تعمل كسلاح مرتجل جيد رغم تصميمها الأصلي للصيد.

items.weapon.missiles.forcecube.name=مكعب القوة
items.weapon.missiles.forcecube.ondeath=قتلت نفسك بمكعب القوة الخاص بك...
items.weapon.missiles.forcecube.stats_desc=ينشر هذا السلاح قوة اصطدامه على مساحة صغيرة، فيصيب كل شيء قريب.
items.weapon.missiles.forcecube.desc=هذه المكعبات السحرية غريبة الشكل، صغيرة بما يكفي لحملها في يدك، لكنها ثقيلة بشكل لا يصدق.

items.weapon.missiles.heavyboomerang.name=بوميرانغ ثقيل
items.weapon.missiles.heavyboomerang.stats_desc=يعود هذا السلاح إلى الموقع الذي رُمي منه بعد خمسة أدوار.
items.weapon.missiles.heavyboomerang.desc=يصعب استخدام هذا البوميرانغ الكبير بفعالية، لكنه سيلحق ضررًا كبيرًا.

items.weapon.missiles.javelin.name=رمح قاذف
items.weapon.missiles.javelin.desc=رماح رمي أكبر حجمًا، موزونة بحيث يبقى الطرف المدبب متجهًا إلى الأمام أثناء انطلاقها في الهواء.

items.weapon.missiles.kunai.name=كوناي
items.weapon.missiles.kunai.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.missiles.kunai.desc=هذه السكاكين الصغيرة قوية جدًا في أيدي المستخدم الماهر.

items.weapon.missiles.missileweapon.stats_known=تسبب هذه المجموعة من الأسلحة المرمية من _المرتبة %1$d_ _%2$d-%3$d من الضرر_ وتتطلب _%4$d من القوة_ لاستخدامها.
items.weapon.missiles.missileweapon.stats_unknown=عادةً ما تسبب هذه المجموعة من الأسلحة المرمية من _المرتبة %1$d_ _%2$d-%3$d من الضرر_ وتتطلب _%4$d من القوة_ لاستخدامها.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=ربما يكون هذا السلاح ثقيلًا جدًا عليك.
items.weapon.missiles.missileweapon.distance=تكون الأسلحة المرمية أكثر دقة من مسافة بعيدة، لكنها أقل دقة من مسافة قريبة.
items.weapon.missiles.missileweapon.durability=تتآكل الأسلحة المرمية وتنکسر مع استخدامها.
items.weapon.missiles.missileweapon.uses_left=تتبقى لهذه المجموعة من الأسلحة المرمية _%d/%d_ من الاستخدامات قبل أن ينكسر أحدها.
items.weapon.missiles.missileweapon.unlimited_uses=هذه المجموعة عالية الجودة لدرجة أنها ستدوم عمليًا إلى الأبد.
items.weapon.missiles.missileweapon.unknown_uses=عادةً ما تمتلك هذه المجموعة من الأسلحة المرمية _%d_ استخدامات قبل أن ينكسر أحدها.
items.weapon.missiles.missileweapon.curse_discover=هذا السلاح المرمي ملعون!
items.weapon.missiles.missileweapon.about_to_break=أوشك سلاحك المرمي على الانكسار.
items.weapon.missiles.missileweapon.has_broken=انكسر أحد أسلحتك المرمية.
items.weapon.missiles.missileweapon.dust=يتفتت السلاح المرمي ويتحول إلى غبار عندما تلمسه.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=إذا انكسر آخر سلاح مرمي في مجموعتك المعززة، فستُفقد المجموعة نهائيًا. هل أنت متأكد من أنك تريد رميه؟
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=نعم
items.weapon.missiles.missileweapon.break_upgraded_warn_no=لا
items.weapon.missiles.missileweapon$placeholder.name=سلاح مرمي

items.weapon.missiles.shuriken.name=شوريكن
items.weapon.missiles.shuriken.stats_desc=يمكن رمي الشوريكن فورًا مع فترة تهدئة مدتها 20 دورًا.
items.weapon.missiles.shuriken.desc=قطع معدنية على شكل نجوم ذات شفرات حادة جدًا، يمكن رميها بسرعة أثناء الحركة.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=فترة تهدئة الشوريكن
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=لقد رميت شوريكن فورًا مؤخرًا، وعليك الانتظار قبل أن تتمكن من فعل ذلك مجددًا. لا يزال بإمكانك رمي الشوريكن، لكن بسرعة السلاح العادية.\n\nالأدوار المتبقية: %s.

items.weapon.missiles.throwingclub.name=هراوة رمي
items.weapon.missiles.throwingclub.stats_desc=لا يلتصق هذا السلاح بالأعداء ويمكن التقاطه فورًا.
items.weapon.missiles.throwingclub.desc=سلاح مرمي بسيط لكنه متين، وهو في الأساس صخرة كبيرة مثبتة على عصا.

items.weapon.missiles.throwinghammer.name=مطرقة رمي
items.weapon.missiles.throwinghammer.stats_desc=لا يلتصق هذا السلاح بالأعداء ويمكن التقاطه فورًا.
items.weapon.missiles.throwinghammer.desc=هذه المطارق الثقيلة مصممة لرميها على الأعداء. وبفضل بنيتها الملساء المصنوعة بالكامل من المعدن، فهي متينة للغاية.

items.weapon.missiles.throwingknife.name=سكين رمي
items.weapon.missiles.throwingknife.stats_desc=هذا السلاح أقوى ضد الأعداء غير المنتبهين.
items.weapon.missiles.throwingknife.desc=هذه السكاكين الخفيفة موزونة لتدور في الهواء مباشرة نحو هدفها.
items.weapon.missiles.throwingknife.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.throwingspear.name=رمح رمي
items.weapon.missiles.throwingspear.desc=هذه الرماح الخفيفة ذات هياكل رفيعة، صممت للرمي وليس للطعن.

items.weapon.missiles.throwingspike.name=شوكة رمي
items.weapon.missiles.throwingspike.desc=هذه الأعمدة المعدنية المدببة والمتينة مصممة لرميها على الأعداء البعيدين.
items.weapon.missiles.throwingspike.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.throwingstone.name=حجر رمي
items.weapon.missiles.throwingstone.desc=صُقلت هذه الأحجار بحيث يمكن رميها بقوة أكبر من الحجر العادي.
items.weapon.missiles.throwingstone.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.missiles.tomahawk.name=توماهوك
items.weapon.missiles.tomahawk.stats_desc=يسبب هذا السلاح _%1$d-%2$d من النزيف_ لهدفه.
items.weapon.missiles.tomahawk.typical_stats_desc=يسبب هذا السلاح عادةً _%1$d-%2$d من النزيف_ لهدفه.
items.weapon.missiles.tomahawk.desc=تملك فؤوس الرمي هذه حافة مسننة تمزق العدو عندما تستقر فيه.

items.weapon.missiles.trident.name=رمح ثلاثي
items.weapon.missiles.trident.desc=رماح رمي ضخمة بثلاثة أطراف مميتة في نهايتها. وهي قوية، لكنها ثقيلة جدًا.


items.weapon.spiritbow.name=القوس الروحي
items.weapon.spiritbow.ac_shoot=إطلاق
items.weapon.spiritbow.prompt=اختر هدفًا
items.weapon.spiritbow.stats=لا يمكن ترقية القوس مباشرة، بل تزداد قوته تدريجيًا مع ارتفاع مستواك. في مستواك الحالي، تلحق الأسهم التي يطلقها القوس _%1$d-%2$d من الضرر_ وتتطلب _%3$d من القوة_ لاستخدامها بشكل صحيح.
items.weapon.spiritbow.desc=قوس مصنوع من خشب سحري قديم. يتوهج وتر القوس والنقوش عليه بضوء أزرق شاحب. وعند شد الوتر، يستحضر هذا القوس سهمًا سحريًا يمكن إطلاقه على عدو.
items.weapon.spiritbow.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.weapon.weapon.identify=أصبحت الآن معتادًا بما يكفي على سلاحك لتتمكن من تحديد ماهيته.
items.weapon.weapon.too_heavy=بسبب عدم كفاية قوتك، سيعيق هذا السلاح سرعة هجومك ودقتك وقدرتك على تنفيذ هجوم مفاجئ.
