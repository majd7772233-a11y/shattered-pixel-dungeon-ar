items.artifacts.unstablespellbook.cursed=لا يمكنك القراءة من مخطوطة ملعونة.
items.artifacts.unstablespellbook.prompt=اختر لفافة
items.artifacts.unstablespellbook.infuse_scroll=لقد نقلت طاقة اللفافة إلى الكتاب.
items.artifacts.unstablespellbook.unable_scroll=لا يمكنك إضافة هذه اللفافة إلى الكتاب.
items.artifacts.unstablespellbook.unknown_scroll=لست متأكدًا بعد من نوع هذه اللفافة.
items.artifacts.unstablespellbook.desc=توجد هذه المخطوطة في حالة جيدة بشكل مدهش بالنظر إلى عمرها. وتصدر أزيزًا وفرقعة كلما حركت صفحاتها، وتنبض بطاقة غير مستقرة. إذا قرأت من هذا الكتاب، فلا أحد يعرف أي تعويذة قد تلقيها.
items.artifacts.unstablespellbook.desc_cursed=الكتاب الملعون ارتبط بك، وهو يعيق قدرتك على استخدام معظم اللفائف.
items.artifacts.unstablespellbook.desc_index=المخطوطة غير مكتملة. يشير فهرسها حاليًا إلى الصفحات الفارغة التالية:
items.artifacts.unstablespellbook.desc_empowered=اللفائف التي أضفتها إلى الكتاب تتوهج بالقوة. ستتمكن من اختيار النسخة الغريبة من تأثيرات هذه اللفائف، لكن مقابل شحنة إضافية.
items.artifacts.unstablespellbook.read_empowered=تتدفق الطاقة في اللفافة التي أضفتها إلى مخطوطة التعاويذ. يمكنك توجيه النسخة العادية أو النسخة الغريبة من تأثير هذه اللفافة.\n\nسيكلف اختيار النسخة الغريبة شحنتين بدلًا من شحنة واحدة.



### الحقائب
items.bags.bag.name=حقيبة ظهر
items.bags.bag.discover_hint=يمكنك شراء هذا العنصر من متجر.

items.bags.potionbandolier.name=حزام جرعات
items.bags.potionbandolier.desc=يلتف هذا الحزام السميك حول صدرك مثل الوشاح، ويحتوي على العديد من الأشرطة المعزولة لحمل قوارير الجرعات، وقربة الماء، أو قوارير المعدن السائل.\n\nأثناء وجودها داخل الحزام، ينبغي أن تكون جرعاتك محمية من البرد.

items.bags.scrollholder.name=حافظة اللفائف
items.bags.scrollholder.desc=تبدو هذه الحاوية الأنبوبية وكأنها مصممة لحمل أدوات عالم فلك وخرائطه، لكن لفائفك ستناسبها جيدًا أيضًا. كما تحتوي على بعض المقصورات الجانبية التي تناسب بلورات التعاويذ وأقلام الكتابة السحرية والراتنج السحري بشكل ممتاز.\n\nلا تبدو الحافظة قابلة للاشتعال بدرجة كبيرة، لذا ينبغي أن تكون لفائفك آمنة من النار بداخلها.

items.bags.velvetpouch.name=كيس مخملي
items.bags.velvetpouch.desc=يمكن لهذا الكيس المخملي الصغير تخزين العديد من العناصر الصغيرة، مثل البذور وأحجار الرون وبعض مكونات الكيمياء.
items.bags.velvetpouch.discover_hint=يبدأ أحد الأبطال بهذا العنصر.

items.bags.magicalholster.name=حافظة سحرية
items.bags.magicalholster.desc=صُنعت هذه الحافظة النحيلة من جلد حيوان غريب، وتمتلك سحرًا قويًا يسمح لها بتخزين كمية هائلة من الأسلحة بعيدة المدى.\n\nيمكنك ببساطة مد يدك إلى الحقيبة وستلتقط دائمًا العنصر الذي كنت تبحث عنه.\n\nوبفضل سحر الحافظة، ستُشحن العصي السحرية بسرعة أكبر قليلًا، وستدوم الأسلحة المرمية لفترة أطول قليلًا داخلها.



### القنابل
items.bombs.arcanebomb.name=قنبلة غامضة
items.bombs.arcanebomb.desc=أُشبعت هذه القنبلة بخصائص غامضة. وستنفجر بانفجار قوي مشابه لهجوم الهلام المعزز، ملحقة _%1$d-%2$d من الضرر السحري_ بكل ما يقع ضمن بلاطتين.
items.bombs.arcanebomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.bomb.name=قنبلة
items.bombs.bomb.ac_lightthrow=إشعال ورمي
items.bombs.bomb.snuff_fuse=تطفئ فتيل القنبلة بسرعة.
items.bombs.bomb.ondeath=قتلك الانفجار...
items.bombs.bomb.rankings_desc=قُتل بسبب انفجار
items.bombs.bomb.desc=قنبلة من مسحوق أسود ثقيلة نوعًا ما. سيلحق انفجار هذه القنبلة _%1$d-%2$d من الضرر_ بكل ما يجاورها، كما سيدمر بعض التضاريس أو العناصر المجاورة.
items.bombs.bomb.desc_fuse=يبدو أن الفتيل سيستغرق بضعة أدوار ليحترق بالكامل بعد إشعاله.
items.bombs.bomb.desc_burning=فتيل القنبلة يحترق، ابتعد عنها أو أطفئها!
items.bombs.bomb$doublebomb.name=قنبلتان
items.bombs.bomb$doublebomb.desc=كومة من قنبلتين ثقيلتين من المسحوق الأسود، يبدو أنك حصلت على واحدة مجانًا!

items.bombs.firebomb.name=قنبلة نارية
items.bombs.firebomb.desc=تم تعديل هذه القنبلة لتنـفجر في مساحة أكبر، وتلحق _%1$d-%2$d من الضرر_ وتنشر لهبًا مستمرًا ضمن بلاطتين.
items.bombs.firebomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.flashbangbomb.name=قنبلة صوتية ضوئية
items.bombs.flashbangbomb.desc=ستنـفجر هذه القنبلة المعدلة بانفجار من الضوء والصوت والكهرباء عند انفجارها. سيتلقى كل ما يقع ضمن بلاطتين _%1$d-%2$d من الضرر_ الناتج عن الانفجار، وضررًا إضافيًا بنسبة 25%% من الكهرباء، وسيُصاب بالذهول لمدة 10 أدوار.
items.bombs.flashbangbomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.frostbomb.name=قنبلة صقيع
items.bombs.frostbomb.desc=تم تعديل هذه القنبلة لتنـفجر في مساحة أكبر، وتلحق _%1$d-%2$d من الضرر_ وتنشر تيارًا مستمرًا من الهواء المتجمد ضمن بلاطتين.
items.bombs.frostbomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.holybomb.name=قنبلة مقدسة
items.bombs.holybomb.desc=تم تعديل هذه القنبلة لتطلق ضوءًا مقدسًا ساطعًا في مساحة أكبر عند انفجارها. سيتلقى كل ما يقع ضمن بلاطتين _%1$d-%2$d من الضرر_ الناتج عن الانفجار، وسيتلقى الأعداء الموتى الأحياء أو الشياطين ضررًا إضافيًا بنسبة 50%% من الضوء المقدس.
items.bombs.holybomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.noisemaker.name=مُحدث ضوضاء
items.bombs.noisemaker.desc=ستصدر هذه القنبلة المعدلة ضوضاء بشكل متكرر عند انتهاء فتيلها. وعندما يلمسها شيء ما، ستنفجر وتلحق _%1$d-%2$d من الضرر_ بكل ما يقع ضمن بلاطتين!
items.bombs.noisemaker.desc_burning=مُحدث الضوضاء يعد تنازليًا، وسينفجر عندما يقترب منه شيء!
items.bombs.noisemaker.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.smokebomb.name=قنبلة دخان
items.bombs.smokebomb.desc=تم تعديل هذه القنبلة لتطلق سحابة كثيفة من الغاز بالتزامن مع انفجارها. وستلحق _%1$d-%2$d من الضرر_ وتنشر ضبابًا ساترًا ضمن بلاطتين.
items.bombs.smokebomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.regrowthbomb.name=قنبلة النمو
items.bombs.regrowthbomb.desc=ستطلق هذه القنبلة المعدلة سائلًا باعثًا على الحياة في كل مكان ضمن 3 بلاطات بدلًا من الانفجار. وستنبت الأعشاب والنباتات بسرعة في المنطقة التي أصابها الانفجار. وسيُشفى كل من أنت وحلفائك الذين أصابهم الانفجار كما لو أنكم شربتم جرعة علاج.
items.bombs.regrowthbomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.shrapnelbomb.name=قنبلة شظايا
items.bombs.shrapnelbomb.desc=تم تعديل هذه القنبلة باستخدام قطع من معدن DM-300، والتي ستتفتت وتطير في كل الاتجاهات عند انفجارها، مسببة _%1$d-%2$d من الضرر_ في نطاق هائل حول القنبلة. من الأفضل أن تختبئ خلف شيء عند استخدامها...
items.bombs.shrapnelbomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.bombs.woollybomb.name=قنبلة صوفية
items.bombs.woollybomb.desc=ستنشئ هذه القنبلة المعدلة حقلًا واسعًا من الخراف السحرية بعد انفجارها. سيلحق الانفجار _%1$d-%2$d من الضرر_ بكل ما يقع ضمن بلاطتين. وستمنع الخراف الحركة وتبقى لفترة طويلة جدًا! لكنها لن تدوم طويلًا في وجود الأعداء الأقوياء، ويمكن تبديدها يدويًا في وقت أبكر بالتفاعل معها.
items.bombs.woollybomb.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

### الطعام
items.food.berry.name=ثمرة الزنزانة
items.food.berry.eat_msg=كانت تلك الثمرة لذيذة!
items.food.berry.desc=عثرت الصيادة على هذه الثمرة الصغيرة بين نباتات الزنزانة. يمكن أكلها بسرعة، وتستعيد قدرًا صغيرًا من الشبع، وقد تحتوي على بذرة قابلة للاستخدام!
items.food.berry.discover_hint=يمكنك العثور على هذا العنصر باستخدام موهبة معينة لأحد الأبطال.

items.food.blandfruit.name=الثمرة الباهتة
items.food.blandfruit.cooked=الثمرة الباهتة المطبوخة
items.food.blandfruit.sunfruit=ثمرة الشمس
items.food.blandfruit.rotfruit=الثمرة المتعفنة
items.food.blandfruit.earthfruit=ثمرة الأرض
items.food.blandfruit.blindfruit=ثمرة العمى
items.food.blandfruit.firefruit=ثمرة النار
items.food.blandfruit.icefruit=ثمرة الجليد
items.food.blandfruit.fadefruit=ثمرة التلاشي
items.food.blandfruit.sorrowfruit=ثمرة الحزن
items.food.blandfruit.stormfruit=ثمرة العاصفة
items.food.blandfruit.dreamfruit=ثمرة الساحر
items.food.blandfruit.starfruit=ثمرة النجمة
items.food.blandfruit.swiftfruit=الثمرة السريعة
items.food.blandfruit.raw=لا تستطيع تحمل أكلها نيئة.
items.food.blandfruit.desc=جافة وهشة إلى هذا الحد، ربما سيؤدي طهيها مع مكوّن آخر إلى تحسينها.
items.food.blandfruit.desc_cooked=انتفخت الثمرة بسبب نقعها في القدر، بل وامتصت خصائص البذرة التي طُبخت معها. سيكون لها تأثير الجرعة التي تقابلها تلك البذرة.
items.food.blandfruit.desc_eat=يبدو أنها جاهزة للأكل!
items.food.blandfruit.desc_throw=تبدو شديدة التقلب، وربما من الأفضل رميها.
items.food.blandfruit$chunks.name=قطع من الثمرة الباهتة
items.food.blandfruit$chunks.desc=انفجرت الثمرة الباهتة عند اصطدامها، وتركت وراءها قطعًا خاملة.\n\nرغم وجود بعض الأوساخ عليها، تبدو هذه القطع الكبيرة من الثمرة الباهتة المطبوخة صالحة للأكل تمامًا.

items.food.chargrilledmeat.name=لحم مشوي على الفحم
items.food.chargrilledmeat.desc=يبدو كأنه شريحة لحم جيدة.
items.food.chargrilledmeat.discover_hint=يمكنك صنع هذا باستخدام عنصر طعام آخر.

items.food.food.name=حصة طعام
items.food.food.ac_eat=أكل
items.food.food.eat_msg=كان مذاق ذلك الطعام لذيذًا!
items.food.food.desc=لا شيء فاخر هنا: لحم مجفف، بعض البسكويت، وأشياء من هذا القبيل.

items.food.frozencarpaccio.name=كارباتشيو مجمد
items.food.frozencarpaccio.invis=ترى يديك تتحولان إلى غير مرئيتين!
items.food.frozencarpaccio.hard=تشعر بأن جلدك أصبح أكثر صلابة!
items.food.frozencarpaccio.refresh=منعش!
items.food.frozencarpaccio.better=تشعر بتحسن!
items.food.frozencarpaccio.desc=إنها قطعة من اللحم النيئ المجمد. والطريقة الوحيدة لأكلها هي تقطيعها إلى شرائح رقيقة. وبهذه الطريقة يكون مذاقها جيدًا بشكل مفاجئ.
items.food.frozencarpaccio.discover_hint=يمكنك صنع هذا باستخدام عنصر طعام آخر.

items.food.meatpie.name=فطيرة اللحم
items.food.meatpie.eat_msg=كان ذلك الطعام رائعًا!
items.food.meatpie.desc=فطيرة لذيذة محشوة باللحم المتبّل. ستشبعك أكثر بكثير من أي وجبة أخرى.
items.food.meatpie.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.food.mysterymeat.name=لحم غامض
items.food.mysterymeat.eat_msg=كان مذاق ذلك الطعام... غريبًا.
items.food.mysterymeat.hot=أوه، إنه ساخن!
items.food.mysterymeat.legs=لا يمكنك الشعور بساقيك!
items.food.mysterymeat.not_well=أنت لا تشعر أنك بخير.
items.food.mysterymeat.stuffed=لقد شبعت تمامًا.
items.food.mysterymeat.desc=كُل على مسؤوليتك!
items.food.mysterymeat.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من بعض الأعداء.
items.food.mysterymeat$placeholder.name=لحم

items.food.phantommeat.name=لحم الشبح
items.food.phantommeat.desc=شريحة لحم كبيرة لامعة وشفافة، مقطوعة من سمكة بيرانا شبحية. لا يحتاج هذا اللحم السحري إلى الطهي، ويمنح عددًا من الفوائد الدفاعية بالإضافة إلى إشباعك بالكامل. عند أكله، سيمنحك الاختفاء، وجلدة الشجر، وبعض الشفاء، ويعالج العديد من التأثيرات الضارة.
items.food.phantommeat.discover_hint=يمكنك الحصول على هذا العنصر كغنيمة من بعض الأعداء.

items.food.pasty.name=فطيرة كورنيش
items.food.pasty.fish_name=سمك مطهو على البخار
items.food.pasty.amulet_name=تميمة يندور؟
items.food.pasty.egg_name=بيضة عيد الفصح
items.food.pasty.rainbow_name=جرعة قوس قزح
items.food.pasty.shattered_name=كعكة خضراء
items.food.pasty.pie_name=فطيرة اليقطين
items.food.pasty.vanilla_name=كعكة زرقاء
items.food.pasty.cane_name=قصبة حلوى
items.food.pasty.sparkling_name=جرعة فوارة
items.food.pasty.desc=فطيرة كورنيش أصلية بحشوة تقليدية من اللحم البقري والبطاطا. لذيذة!
items.food.pasty.fish_desc=سمكة كاملة مطهوة على البخار، محفوظة سحريًا فوق طبقة من الخضروات. من المعتاد في هذا الوقت من السنة الاحتفاظ ببعض السمك لوقت لاحق، لذا ستحتفظ ببعض البقايا بدلًا من أكلها دفعة واحدة.\n\nعام قمري جديد سعيد!
items.food.pasty.amulet_desc=لقد عثرت عليها أخيرًا، التميمة السحرية الخاصة بـ... انتظر لحظة، هذه مجرد قطعة شوكولاتة ملفوفة بورق قصدير ومصنوعة لتبدو كالتميمة! لن تمنحك قوة لا محدودة، لكنها على الأقل ستشبعك وتمنحك قليلًا من شحنة القطع الأثرية.\n\nكذبة أبريل!
items.food.pasty.egg_desc=بيضة شوكولاتة كبيرة جدًا، ملفوفة بورق أصفر ملوّن. هناك من الشوكولاتة هنا ما يكفي بسهولة لإشباعك، وقد يمنح السكر قطعك الأثرية قدرًا ضئيلًا من الشحنة الإضافية.\n\nعيد فصح سعيد!
items.food.pasty.rainbow_desc=هذه الجرعة الملونة نوع من الطعام السائل. وإضافة إلى إشباع جوعك، تحتوي على القليل من السحر الذي سيهدئ عدوًا غير زعيم مجاور، مما يجعله مترددًا مؤقتًا في قتالك.\n\nعيد فخر سعيد!
items.food.pasty.shattered_desc=هذه الشريحة الكبيرة من كعكة الفانيليا مزينة برشات ملوّنة وكريمة خضراء. صُنعت الكعكة للاحتفال بسنوات الخبرة، وستمنحك قدرًا صغيرًا من الخبرة عند أكلها.\n\nتم إصدار Shattered Pixel Dungeon لأول مرة في 5 أغسطس 2014. عيد ميلاد سعيد لـ Shattered Pixel Dungeon!
items.food.pasty.pie_desc=شريحة كبيرة جدًا من فطيرة اليقطين. نكهتها الحلوة والحارة ستشبعك وتمنحك قدرًا ضئيلًا من الشفاء.\n\nعيد هالوين سعيد!
items.food.pasty.vanilla_desc=هذه الشريحة الكبيرة من كعكة الفانيليا مزينة برشات ملوّنة وكريمة زرقاء. صُنعت الكعكة للاحتفال بسنوات الخبرة، وستمنحك قدرًا صغيرًا من الخبرة عند أكلها.\n\nتم إصدار Pixel Dungeon الأصلي لأول مرة في 4 ديسمبر 2012. عيد ميلاد سعيد لـ Pixel Dungeon!
items.food.pasty.cane_desc=قصبة حلوى ضخمة وغنية بالسكر. إنها كبيرة بما يكفي لإشباعك، وقد يمنح السكر عصاك السحرية قليلًا من الشحنة الإضافية أيضًا.\n\nأعياد سعيدة!
items.food.pasty.sparkling_desc=هذه الجرعة الفوارة نوع من الطعام السائل. إنها تشبع الجوع وتحاكي النبيذ الفوار، لكنها ليست كحولية فعلًا. وسيمنحك الدفء الذي تشعر به في بطنك قليلًا من الحماية.\n\nعام جديد سعيد!
items.food.pasty$fishleftover.name=بقايا السمك
items.food.pasty$fishleftover.eat_msg=كان مذاق ذلك الطعام مقبولًا.
items.food.pasty$fishleftover.desc=بعض السمك المتبقي من وجبتك السابقة. يمكنك أكله في أي وقت لاستعادة القليل من الشبع.

items.food.smallration.name=حصة طعام صغيرة
items.food.smallration.eat_msg=كان مذاق ذلك الطعام مقبولًا.
items.food.smallration.desc=تبدو تمامًا كحصة الطعام العادية، ولكنها أصغر.
items.food.smallration.discover_hint=يمكنك شراء هذا العنصر من متجر.

items.food.stewedmeat.name=لحم مطهو
items.food.stewedmeat.eat_msg=كان مذاق ذلك الطعام مقبولًا.
items.food.stewedmeat.desc=أدى طهي اللحم على نار هادئة إلى تطهيره من أي أمراض أو طفيليات. ينبغي أن يكون آمنًا للأكل.
items.food.stewedmeat.discover_hint=يمكنك صناعة هذا العنصر عبر الكيمياء.

items.food.supplyration.name=حصة مؤن
items.food.supplyration.desc=تُركت هذه الحصة في الزنزانة بواسطة أعضاء نقابة اللصوص ولأجلهم. وهي مصممة خصيصًا لتؤكل أثناء التنقل، وتساعد في مختلف أعمال اللصوصية.\n\nورغم أنها لا تشبعك بقدر الحصة العادية، يمكن أكلها بسرعة، وتوفر قدرًا قليلًا من الشفاء المباشر، كما تستعيد شحنة لعباءة الظلال الخاصة باللص.
items.food.supplyration.discover_hint=يمكنك العثور على هذا العنصر باستخدام موهبة معينة لأحد الأبطال.



## عناصر اليوميات
items.journal.documentpage.name=صفحة ممزقة
items.journal.documentpage.desc=صفحة منفردة، ربما انتُزعت من كتاب ما. ستحتاج إلى التقاطها لكي تتمكن من قراءتها.

items.journal.alchemypage.name=صفحة ممزقة من كتاب الكيمياء
items.journal.alchemypage.desc=صفحة ممزقة من دليل عن الكيمياء.\n\nمعظم النص صغير جدًا بحيث لا يمكن قراءته من مسافة، لكن يمكنك تمييز عنوان الصفحة:\n\n_"%s"_

items.journal.guidebook.name=مخطوطة إتقان الزنزانة
items.journal.guidebook.hint_mobile=يحتوي دليل إرشادك على نصائح لك! اضغط على زر اليوميات الوامض في أعلى اليمين لقراءتها.
items.journal.guidebook.hint_desktop=يحتوي دليل إرشادك على نصائح لك! اختر زر اليوميات الوامض (%s) في أعلى اليمين لقراءتها.
items.journal.guidebook.hint_status=دليل الإرشاد
items.journal.guidebook.desc=دليل إرشادي للمغامرين، تركه هنا شخص قرر أن المغامرة ليست مناسبة له! هذا الكتاب بالذات سحري، ويمكنه حث المغامرين على قراءة صفحة في اللحظة المناسبة.\n\nورغم هذه الخاصية، فإن الكتاب يحظى بأكبر قدر من الشهرة بسبب العبارة الكبيرة "لا تُصب بالذعر!" المكتوبة بأحرف كبيرة وودودة على الغلاف.

items.journal.guidepage.name=صفحة ممزقة من دليل الإرشاد
items.journal.guidepage.desc=صفحة ممزقة من دليل للمغامرة.\n\nمعظم النص صغير جدًا بحيث لا يمكن قراءته من مسافة، لكن يمكنك تمييز عنوان الصفحة:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=رسالة مهترئة
items.journal.regionlorepage$sewers.desc=ما يبدو أنه رسالة، مكتوبة على قطعة ورق ملطخة بالتراب. ستحتاج إلى التقاطها لتتمكن من قراءة ما كُتب عليها.

items.journal.regionlorepage$prison.name=مذكرات مهترئة
items.journal.regionlorepage$prison.desc=مقطع من مذكرات، أو نوع آخر من السجلات، كُتب على قطعة ورق قديمة. يبدو أنها صمدت بشكل أفضل من الرسائل التي وجدتها في المجاري، لكنك ستظل بحاجة إلى التقاطها لقراءتها.

items.journal.regionlorepage$caves.name=سجل قديم
items.journal.regionlorepage$caves.desc=ما يبدو أنه سجل في دفتر يوميات مستكشف، محفوظ بشكل مدهش رغم مدى قدمه. التقطه لقراءته.

items.journal.regionlorepage$city.name=لوح معدني صدئ
items.journal.regionlorepage$city.desc=لوح معدني صغير صدئ نُقشت عليه رسالة بطريقة سحرية. لا تزال الحروف واضحة رغم عمر اللوح، لكن عليك التقاطه لقراءتها.

items.journal.regionlorepage$halls.name=لوح متوهج
items.journal.regionlorepage$halls.desc=لوح أسود صغير نُقشت عليه أحرف خضراء متوهجة. تتداخل الحروف المتوهجة من بعيد لتشكل ضبابًا، لذا سيتعين عليك التقاطه لقراءتها.


### المفاتيح
items.keys.goldenkey.name=مفتاح ذهبي
items.keys.goldenkey.desc=الشقوق الموجودة في هذا المفتاح الذهبي دقيقة ومعقدة. ربما سيفتح صندوقًا مقفلًا؟

items.keys.crystalkey.name=مفتاح بلوري
items.keys.crystalkey.desc=تتلألأ الأسطح المشذبة لهذا المفتاح البلوري في الظلام. ربما سيفتح شيئًا مصنوعًا من البلور؟

items.keys.ironkey.name=مفتاح حديدي
items.keys.ironkey.desc=تآكلت الشقوق الموجودة في هذا المفتاح الحديدي القديم جيدًا؛ كما أن رباطه الجلدي أتلفه الزمن. يا ترى أي باب يمكن أن يفتحه؟

items.keys.wornkey.name=مفتاح مهترئ
items.keys.wornkey.desc=هذا المفتاح مهترئ ومتغير اللون، لكنه يبدو جادًا. من المحتمل أنه يفتح بابًا جادًا في مكان قريب.



