items.artifacts.cloakofshadows.desc=عباءة سحرية لا تقدر بثمن، سرقها اللص من مستودع الأسلحة الملكي قبل سنوات عديدة. عند ارتدائها، يمكن استخدامها للتحول إلى حالة من الاختفاء التام لفترة قصيرة.\n\nكلما زاد استخدام العباءة، ازدادت قوتها، مما يسمح للص بأن يصبح غير مرئي بشكل أكثر تكرارًا ولفترات أطول.
