plants.blandfruitbush.name=فاكهة لطيفة
plants.blandfruitbush.desc=قريب بعيد من التوت المتعفن، وثمرة شجيرة الفاكهة اللطيفة ذات الشكل الكمثري طعمها يشبه الغبار المتكتل. الثمرة مقززة وغير مشبعة، لكنها ليست سامة. ربما يمكن طهيها.
plants.blandfruitbush.discover_hint=يمكنك العثور على هذا النبات عشوائيًا في الزنزانة.
plants.blandfruitbush$seed.name=بذرة الفاكهة اللطيفة

plants.blindweed.name=العشبة العمياء
plants.blindweed.desc=عند لمسها، تذبل العشبة العمياء في وميض ساطع من الضوء. الوميض قوي بما يكفي لإرباكك لعدة ثوانٍ.
plants.blindweed.warden_desc=بدلًا من إرباكها، ستقوم _الحارسة_ بتوجيه طاقة العشبة العمياء إلى غلالة مؤقتة من الاختفاء.
plants.blindweed$seed.name=بذرة العشبة العمياء

plants.mageroyal.name=ماغيرويال
plants.mageroyal.refreshed=تشعر بالانتعاش.
plants.mageroyal.desc=تحتوي أزهار الماغيرويال الشائكة على مادة كيميائية معروفة بخصائصها كعامل معادل قوي. أي شيء يخطو على هذا النبات ستُزال عنه العديد من التأثيرات السلبية.
plants.mageroyal.warden_desc=بالإضافة إلى تأثير المعادلة، ستصبح _الحارسة_ محصنة مؤقتًا ضد جميع التأثيرات المرتبطة بالمنطقة عند الدوس على الماغيرويال.
plants.mageroyal$seed.name=بذرة الماغيرويال

plants.earthroot.name=جذر الأرض
plants.earthroot.desc=عندما يلمس مخلوق جذر الأرض، تنشئ جذوره حوله نوعًا من الدروع الطبيعية غير القابلة للحركة.
plants.earthroot.warden_desc=ستتحرك جذور نبات جذر الأرض مع _الحارسة_، مما يمنحها درعًا متحركًا من لحاء النبات.
plants.earthroot$seed.name=بذرة جذر الأرض
plants.earthroot$armor.name=درع عشبي
plants.earthroot$armor.desc=نوع من الدروع الطبيعية غير المتحركة، مصنوع من اللحاء والخيوط.\n\nسيحجب هذا الدرع العشبي %d من الضرر الناتج عن أي ضربة جسدية، إلى أن تنفد متانته في النهاية وينهار.\n\nوبما أن الدرع غير متحرك، فإن الحركة ستتسبب في تفككه وفقدانه.\n\nمتانة الدرع المتبقية: %d.

plants.fadeleaf.name=ورقة التلاشي
plants.fadeleaf.desc=سيؤدي لمس ورقة التلاشي إلى نقل أي مخلوق آنيًا إلى مكان عشوائي في المستوى الحالي.
plants.fadeleaf.warden_desc=تأثير الانتقال الآني لورقة التلاشي أقوى بالنسبة إلى _الحارسة_، إذ ينقلها آنيًا إلى نهاية مستوى الزنزانة السابق.
plants.fadeleaf$seed.name=بذرة ورقة التلاشي

plants.firebloom.name=زهرة النار
plants.firebloom.desc=عندما يلمس شيء زهرة النار، تشتعل فيه النيران.
plants.firebloom.warden_desc=عندما تدوس _الحارسة_ على زهرة النار، ستتشبع باللهب لفترة وجيزة بدلًا من أن تتضرر.
plants.firebloom$seed.name=بذرة زهرة النار

plants.icecap.name=قبعة الجليد
plants.icecap.desc=عند لمسها، تطلق قبعة الجليد نفحة من حبوب اللقاح المتجمدة. ويكون تأثير التجميد أقوى بكثير إذا كانت البيئة رطبة.
plants.icecap.warden_desc=عندما تدوس _الحارسة_ على قبعة الجليد، ستتشبع بالصقيع لفترة وجيزة بدلًا من أن تتضرر.
plants.icecap$seed.name=بذرة قبعة الجليد

plants.plant.warden_desc=لا تأثير خاص لهذا النبات عند استخدامه من قبل الحارسة.
plants.plant.discover_hint=يمكنك العثور على هذا النبات عشوائيًا في الزنزانة، أو زراعته من بذرته المرتبطة به.
plants.plant$seed.seed_of=بذرة %s
plants.plant$seed.ac_plant=ازرع
plants.plant$seed.info=ارمِ هذه البذرة في المكان الذي تريد أن ينمو فيه النبات.\n\n%s
plants.plant$seed$placeholder.name=بذرة

plants.rotberry.name=التوت المتعفن
plants.rotberry.desc=طعم توت شجيرة التوت المتعفن الصغيرة يشبه الموت الحلو، الحلو. وعلى مدى بضع سنوات، ستنمو هذه الشجيرة لتصبح قلب تعفن آخر. وعند الدوس عليها، تنتج شجيرة التوت المتعفن الصغيرة نفحة صغيرة من الغاز السام.
plants.rotberry.warden_desc=عادةً ما تنتج شجيرة التوت المتعفن القليل من الغاز عند الدوس عليها، لكن _الحارسة_ قادرة على تسخير طاقتها لتعزيز قوتها مؤقتًا!
plants.rotberry.discover_hint=يمكنك زراعة هذا النبات من بذرته المرتبطة به أثناء مهمة محددة.
plants.rotberry$seed.name=بذرة التوت المتعفن
plants.rotberry$seed.discover_hint=يمكنك العثور على هذا العنصر أثناء مهمة محددة.

plants.sorrowmoss.name=طحلب الحزن
plants.sorrowmoss.desc=طحلب الحزن زهرة (وليس طحلبًا) ذات بتلات حادة كالموسى، مغطاة بسم قاتل.
plants.sorrowmoss.warden_desc=عندما تدوس _الحارسة_ على طحلب الحزن، ستتشبع بالسم لفترة وجيزة بدلًا من أن تتضرر.
plants.sorrowmoss$seed.name=بذرة طحلب الحزن

plants.starflower.name=زهرة النجمة
plants.starflower.desc=نبات نادر، ويُقال إن زهرة النجمة تمنح قوة مقدسة لأي شخص يلمسها.
plants.starflower.warden_desc=بالإضافة إلى حصولها على البركة، ستحصل _الحارسة_ على قدر كبير من إعادة شحن العصي السحرية عند الدوس على زهرة النجمة.
plants.starflower$seed.name=بذرة زهرة النجمة

plants.stormvine.name=كرمة العاصفة
plants.stormvine.desc=تؤثر الجاذبية في نبات كرمة العاصفة بطريقة غريبة، مما يسمح لمحاليقه الزرقاء الرقيقة بأن «تتدلى» في الهواء. أي شيء يعلق في الكرمة يتأثر بذلك أيضًا ويصبح مرتبكًا.
plants.stormvine.warden_desc=تستطيع _الحارسة_ التحكم في تأثير الجاذبية لكرمة العاصفة، وستحلق في الهواء لفترة وجيزة عند الدوس عليها.
plants.stormvine$seed.name=بذرة كرمة العاصفة

plants.sungrass.name=عشب الشمس
plants.sungrass.desc=يشتهر عشب الشمس بخصائص عصارتِه العلاجية البطيئة ولكن الفعالة.
plants.sungrass.warden_desc=يمكن لـ_الحارسة_ تلقي العلاج من عشب الشمس الذي داسَت عليه حتى بعد ابتعادها عنه.
plants.sungrass$seed.name=بذرة عشب الشمس
plants.sungrass$health.name=علاج عشبي
plants.sungrass$health.desc=يمتلك عشب الشمس خصائص علاجية ممتازة، لكنه أبطأ بكثير من جرعة الشفاء.\n\nسيؤدي الابتعاد عن النبات إلى كسر تأثير العلاج.\n\nالعلاج المتبقي: %d.

plants.swiftthistle.name=الشوك السريع
plants.swiftthistle.desc=عند الدوس عليه، يسرّع الشوك السريع تدفق الزمن من حوله لفترة وجيزة، مما يسمح لمن داس عليه بتنفيذ عدة أفعال فورًا.
plants.swiftthistle.warden_desc=بالإضافة إلى حصولها على أفعال فورية، ستحصل _الحارسة_ أيضًا على تعزيز قصير للسرعة عند الدوس على الشوك السريع.
plants.swiftthistle$seed.name=بذرة الشوك السريع
plants.swiftthistle$timebubble.name=فقاعة زمنية
plants.swiftthistle$timebubble.desc=فقاعة صغيرة من الزمن المتسارع، تسمح بتنفيذ الأفعال فورًا. لكن مهاجمة الأعداء أو استخدام السحر سيكسر هذا التأثير.\n\nالأدوار المتبقية: %s.