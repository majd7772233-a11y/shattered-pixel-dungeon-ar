journal.document.adventurers_guide.title=كتاب إتقان الزنزانات
journal.document.adventurers_guide.intro.title=مقدمة
journal.document.adventurers_guide.intro.body=مرحبًا أيها المغامر، أنت تقرأ كتاب إتقان الزنزانات! من الأفضل استخدام هذا الدليل كمرجع، وسيخبرك سحريًا بالوقت الأنسب لقراءة كل صفحة.\n\n(عندما يومض زر دفتر اليوميات، حدده لقراءة ما يخبرك به الدليل! لكن بعض الصفحات مفقودة، ربما يمكنك العثور عليها في الزنزانة؟)
journal.document.adventurers_guide.examining.title=الفحص
journal.document.adventurers_guide.examining.body=من المهم دراسة أعدائك وما يحيط بك بدلًا من الاندفاع بشكل أعمى! اعتد على فحص كل شيء جديد.\n\n(يمكنك الفحص باستخدام زر العدسة المكبرة ثم اختيار ما تريد فحصه. ويمكنك أيضًا فحص التأثيرات الإيجابية أو السلبية من خلال تحديد رموزها.)
journal.document.adventurers_guide.surprise_attacks.title=الهجمات المباغتة
journal.document.adventurers_guide.surprise_attacks.body=الهجمات المباغتة مضمونة الإصابة، مما يجعلها مفيدة بشكل خاص ضد الأعداء المراوغين مثل الأفاعي والأشباح.\n\nيمكنك مباغتة الأعداء مباشرة بعد دخولهم إلى باب أثناء مطاردتهم لك، أو عندما يفقدون رؤيتك بطريقة أخرى.
journal.document.adventurers_guide.identifying.title=التعرّف على العناصر
journal.document.adventurers_guide.identifying.body=تختلف ألوان الجرعات والرموز الموجودة على اللفائف في كل زنزانة. يمكن ترقية المعدات غير المعروفة أو سحرها إذا كنت محظوظًا، أو قد تكون ملعونة!\n\nتُعد لفائف التعرف والترقية وإزالة اللعنة مفيدة جدًا إذا كنت تريد تقليل خطر استخدام المعدات غير المعروفة.\n\n(يمكنك العثور على قائمة بجميع العناصر التي تعرّفت عليها في تبويب الفهرس في دفتر يومياتك)
journal.document.adventurers_guide.food.title=التعامل مع الجوع
journal.document.adventurers_guide.food.body=يُعد تقنين الطعام بفعالية أحد أفضل الطرق لتحسين فرص بقائك على قيد الحياة، فأنت لست بحاجة دائمًا إلى الأكل فور شعورك بالجوع!\n\nعندما لا تكون جائعًا بدرجة الموت، ستتجدد صحتك ببطء، لذا إذا أكلت وأنت في كامل صحتك فسيضيع ذلك التجدد!\n\nإذا وزعت أوقات الأكل بناءً على مستوى صحتك، فسيدوم طعامك لفترة أطول بكثير.
journal.document.adventurers_guide.alchemy.title=الخيمياء والتمائم
journal.document.adventurers_guide.alchemy.body=إذا لم تجد عنصرًا استهلاكيًا مفيدًا، يمكنك استخدامه كمكوّن خيميائي أو تحويله إلى طاقة خيميائية متعددة الاستخدامات. كما أن شحن الجرعات واللفائف بالطاقة يكشف هويتها أيضًا!\n\nالتمائم نوع فريد من المعدات تُصنع وتُرقّى باستخدام الخيمياء. تُصنع باستخدام محفّز تميمة سحري وقليل من الطاقة الخيميائية.\n\n(يوجد أول وعاء خيمياء في الطابق الثالث أو الرابع من الزنزانة. وستجد صفحات من كتب وصفات الخيمياء بالقرب من هذه الأوعية أيضًا.)
journal.document.adventurers_guide.dieing.title=التعامل مع الهزيمة
journal.document.adventurers_guide.dieing.body=استكشاف الزنزانات أمر خطير، ومعظم المغامرين يلاقون حتفهم في النهاية.\n\nالحظ يساعد، لكن أفضل المغامرين يستخدمون كل حيلة صغيرة لتحسين فرصهم.\n\n(لا تنزعج إذا كنت تموت كثيرًا، فاللعبة صعبة! ركز على تعلم اللعبة والتحسن تدريجيًا، لا على الفوز فورًا.)
journal.document.adventurers_guide.searching.title=البحث
journal.document.adventurers_guide.searching.body=الزنزانات مليئة بالأبواب السرية والأفخاخ التي تبدو غير مرئية للوهلة الأولى. يمكنك قضاء بعض الوقت والبحث بعناية إذا كنت تشك في وجود باب أو فخ مخفي قريب منك.\n\n(يمكنك البحث في جميع الخلايا المحيطة بك باستخدام زر العدسة المكبرة مرتين. ربما توجد بعض الأبواب المخفية بالقرب من المكان الذي وجدت فيه هذه الصفحة!)
journal.document.adventurers_guide.strength.title=القوة
journal.document.adventurers_guide.strength.body=لا يوجد وقت للتدرب على استخدام الأسلحة والدروع التي تجدها في الزنزانة، لذا ستحتاج إلى قوة بدنية هائلة لاستخدامها بفعالية.\n\nجرعات القوة ولفائف الترقية هي الطريقة الأكثر فعالية لتلبية متطلبات القوة للمعدات ذات المستوى الأعلى.\n\nمن المهم أن تبدأ في النهاية باستخدام العناصر ذات المستوى المرتفع، لكن لا تتجاهل المعدات التي يمكنك استخدامها الآن.
journal.document.adventurers_guide.upgrades.title=الترقيات
journal.document.adventurers_guide.upgrades.body=كلما تعمقت في الزنزانة، زادت أهمية استخدام معدات سحرية عالية المستوى تمت ترقيتها، لكنك ستحتاج أيضًا إلى القوة اللازمة لاستخدامها بشكل صحيح.\n\nالعصي السحرية والخواتم والآثار لا تحتاج إلى قوة، لكنها ذات استخدامات محدودة أو لا تساعد بشكل مباشر في القتال.\n\nاتخاذ قرارات جيدة بشأن ما تقوم بترقيته مهم جدًا للبقاء على قيد الحياة في بداية الزنزانة، ولتهيئة نفسك للنجاح في المراحل اللاحقة.
journal.document.adventurers_guide.looting.title=النهب الفعّال
journal.document.adventurers_guide.looting.body=الغرف الموجودة خلف أبواب مقفلة أو التي تحتوي على عوائق عادةً ما تحتوي على غنائم أفضل. عندما يعترض عائق طريقك، يمكنك عادةً العثور على عنصر يساعدك في الطابق نفسه.\n\nستتمكن دائمًا من العثور على جرعتين من القوة و3 لفائف ترقية في كل منطقة مكونة من خمسة طوابق في الزنزانة، لذا فهي مؤشر ممتاز على مدى جودة استكشافك.\n\n(يمكنك رؤية قائمة بالمعالم والمفاتيح غير المستخدمة في تبويب الملاحظات في نافذة دفتر اليوميات.)
journal.document.adventurers_guide.levelling.title=اكتساب الخبرة
journal.document.adventurers_guide.levelling.body=رفع المستوى يزيد إحصائياتك ويمنحك نقاط مواهب، مما قد يحدث فرقًا كبيرًا في القتال. من الأفضل أن يكون لديك مستوى واحد على الأقل لكل طابق من الزنزانة.\n\nقد يكون من المغري الاندفاع وتجنب الاستكشاف أو القتال، لكن ذلك سيحرمك من المؤن والخبرة.\n\n(يمكنك رؤية معلومات عن بطلك، بما في ذلك الخبرة، في لوحة الحالة الموجودة في زاوية واجهة اللعبة. حدد صورة بطلك للحصول على مزيد من المعلومات.)
journal.document.adventurers_guide.positioning.title=التمركز
journal.document.adventurers_guide.positioning.body=الاستراتيجية لا تقل أهمية عن المعدات. يمكن عادةً تجنب المواقف السيئة مثل محاصرتك من جميع الجهات بالتمركز الجيد.\n\nعلى سبيل المثال، تحتوي معظم الزنزانات على ممرات ضيقة تجبر الأعداء على قتال واحد تلو الآخر. وغالبًا ما تحتوي هذه الممرات على أبواب مناسبة للهجمات المباغتة أيضًا!\n\nهناك الكثير من الطرق الصغيرة لاستخدام عناصر البيئة مثل العشب والماء والحفر والأفخاخ لصالحك أيضًا.
journal.document.adventurers_guide.magic.title=الهجمات السحرية
journal.document.adventurers_guide.magic.body=تخترق الهجمات السحرية الدروع مباشرة ويصعب تفاديها. هذا يعني أن الضرر الناتج عن العصي السحرية موثوق جدًا، لكنه يجعل الأعداء السحريين خطيرين للغاية!\n\nلكن الهجمات السحرية لها دائمًا جانب سلبي. فالعصي السحرية تملك شحنات محدودة، والأعداء السحريون عادةً لا يستطيعون استخدام سحرهم من مسافة قريبة.\n\nعند مواجهة أعداء يستخدمون السحر، من المهم أن تتعلم كيفية منعهم من استخدامه ضدك.


journal.document.alchemy_guide.title=دليل الخيمياء
journal.document.alchemy_guide.potions.title=مقدمة والجرعات
journal.document.alchemy_guide.potions.body=مرحبًا بك في التطبيقات العملية للخيمياء! هذا الكتاب مرجع لوصفات صناعة العناصر باستخدام وعاء الخيمياء.\n\nسنبدأ بالوصفة الأكثر شهرة: الجرعات!\n\nاستخدم ثلاث بذور لصنع جرعة عشوائية! لكل بذرة جرعة مقابلة لها، واستخدام عدة بذور من النوع نفسه يزيد فرصة أن تكون الجرعة مرتبطة بالبذور المستخدمة.
journal.document.alchemy_guide.stones.title=صناعة أحجار الرون
journal.document.alchemy_guide.stones.body=خلط لفافة داخل وعاء الخيمياء سيُشبِع حجرين داخل الوعاء بسحرها. ينتج عن ذلك أحجار رون ويكشف هوية اللفافة!
journal.document.alchemy_guide.energy_food.title=الطاقة والطعام
journal.document.alchemy_guide.energy_food.body=تتطلب العديد من الوصفات طاقة خيميائية بلورية، يتم صنعها من خلال تفكيك العناصر الاستهلاكية في وعاء الخيمياء. كما أن شحن الجرعات أو اللفائف بالطاقة يكشف هويتها.\n\nبعض الوصفات التي تتطلب الطاقة سحرية، لكن هذه الوصفات تشبه الطبخ التقليدي.
journal.document.alchemy_guide.exotic_potions.title=الجرعات الغريبة
journal.document.alchemy_guide.exotic_potions.body=يمكن خلط الجرعات مع الطاقة لصنع جرعات غريبة. تمتلك هذه الجرعات تأثيرات أقوى، لكنها غالبًا ما تكون مفيدة بطرق مختلفة.
journal.document.alchemy_guide.exotic_scrolls.title=اللفائف الغريبة
journal.document.alchemy_guide.exotic_scrolls.body=يمكن صنع اللفائف الغريبة باستخدام بعض الطاقة ولفافة. إنها أقوى قليلًا وأكثر تكلفة من الجرعات الغريبة.
journal.document.alchemy_guide.bombs.title=القنابل المطوّرة
journal.document.alchemy_guide.bombs.body=يمكن خلط قنبلة مسحوق أسود عادية مع عنصر محدد لصنع قنبلة مطوّرة.
journal.document.alchemy_guide.weapons.title=تطوير الأسلحة
journal.document.alchemy_guide.weapons.body=يمكن استخدام بعض الأسلحة الخفيفة أو السحرية في الخيمياء!\n\nكل مجموعة من الأسلحة المقذوفة تنتج كمية كافية من المعدن السائل لإصلاح مجموعة أخرى من المستوى والرتبة نفسيهما بالكامل. لاحظ أن تحويل مجموعة بالخيمياء سيدمر المجموعة بأكملها، حتى لو لم تكن مكتملة!\n\nسينتج عصا سحرية واحدة كمية كافية من الراتنج الغامض لترقية عصوين سحريتين من المستوى نفسه، ولكن بما لا يتجاوز +3.
journal.document.alchemy_guide.brews_elixirs.title=المشروبات والإكسير
journal.document.alchemy_guide.brews_elixirs.body=المشروبات والإكسير هي جرعات متقدمة ذات مجموعة متنوعة من التأثيرات، وعادةً ما تكون للاستخدام مرة واحدة.
journal.document.alchemy_guide.spells.title=التعاويذ
journal.document.alchemy_guide.spells.body=توجد التعاويذ داخل البلورات وتوفر مجموعة متنوعة من التأثيرات، وعادةً ما يكون لها استخدامات متعددة.

journal.document.intros.title=مقدمات المناطق
journal.document.intros.discover_hint=يمكنك العثور على هذا النص عند دخول منطقة محددة لأول مرة.
journal.document.intros.dungeon.title=الزنزانة
journal.document.intros.dungeon.body=دخل العديد من الأبطال إلى الزنزانة قبلك قادمين من المدينة في الأعلى، لكن معظمهم لم يسمع عنهم أحد مرة أخرى.\n\nيُقال إن شرًا قديمًا يتربص في الأعماق، ويحرس تميمة يندور العظيمة. وحتى الآن تشع طاقة مظلمة من الأسفل، وتشق طريقها صعودًا إلى المدينة.\n\nهل ستتمكن من إخضاع الزنزانة والاستيلاء على التميمة؟ حان الوقت لبدء مغامرتك الخاصة!
journal.document.intros.sewers.title=المجاري
journal.document.intros.sewers.body=تشكل الطوابق العليا من الزنزانة في الواقع نظام المجاري في المدينة.\n\nومع تسلل الطاقة المظلمة من الأسفل، أصبحت مخلوقات المجاري التي كانت عادةً غير مؤذية أكثر شراسة شيئًا فشيئًا. واضطرت المدينة إلى إرسال دوريات من الحراس إلى هنا لمحاولة الحفاظ على سلامة من في الأعلى.\n\nهذا المكان خطير، لكن على الأقل السحر الشرير الموجود هنا ضعيف.
journal.document.intros.prison.title=السجن
journal.document.intros.prison.body=منذ سنوات عديدة بُني هنا سجن لإيواء المجرمين الخطرين. وكان السجناء يخضعون لتنظيم وحراسة مشددة، ويُجلبون من جميع أنحاء البلاد لقضاء فترات عقوبتهم.\n\nلكن سرعان ما بدأ ضباب مظلم بالتسلل من الأسفل، مشوهًا عقول الحراس والسجناء على حد سواء.\n\nواستجابةً للفوضى المتزايدة، أغلقت المدينة السجن بأكمله. لا أحد يعرف ما حل بمن تُركوا للموت خلف هذه الجدران...
journal.document.intros.caves.title=الكهوف
journal.document.intros.caves.body=تمتد هذه الكهوف قليلة السكان إلى أسفل تحت السجن المهجور. وكانت غنية بالمعادن، وكانت ذات يوم مركزًا مزدهرًا للتجارة والصناعة لدى مجتمع الأقزام في الأسفل، لكنهم هجروها بعدما أصبح الأقزام مهووسين بالسحر المظلم.\n\nتسكن الكهوف الآن في الغالب الحياة البرية الجوفية والنوول والآلات المهجورة؛ ومن المرجح أنها فسدت بفعل القوة نفسها التي أثرت في المناطق العليا.
journal.document.intros.city.title=مدينة الأقزام
journal.document.intros.city.body=كانت مدينة الأقزام ذات يوم أعظم جميع دول المدن التابعة للأقزام. وفي أوج مجدها بنى الأقزام آلات مذهلة من المعدن والسحر سمحت لمدينتهم بالتوسع بسرعة.\n\nثم في يوم من الأيام أُغلقت بوابات المدينة، ولم يسمع أحد عن الأقزام مرة أخرى. أما القلة الذين تمكنوا من الهرب أثناء إغلاق المدينة، فقد تحدثوا عن ساحر مجنون سرق العرش، وعن السحر الرهيب الذي تعلم كيفية تسخيره.
journal.document.intros.halls.title=قاعات الشياطين
journal.document.intros.halls.body=لقد شوه السحر المظلم هذه القاعات العميقة لمدينة الأقزام. في الماضي كانت هذه المناطق مقر بلاط ملك الأقزام من كبار السحرة، لكنها تبدو الآن وكأن شيئًا أكثر شرًا قد استولى عليها...\n\nتسكن هذه القاعات جميع أنواع المخلوقات الشيطانية المرعبة، وتقودها قوة مظلمة رهيبة. وإذا لم يكن ملك الأقزام هو مصدر الفساد المنتشر، فلا بد أن ما يوجد هنا هو مصدره.\n\nتحرك بحذر، فقليل جدًا من المغامرين تمكنوا من النزول إلى هذا العمق...
journal.document.intros.halls.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.

journal.document.sewers_guard.title=رسائل الحارس
journal.document.sewers_guard.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.
journal.document.sewers_guard.new_position.title=منصبي الجديد!
journal.document.sewers_guard.new_position.body=85 من الخريف، 375\nعزيزي أمي وأبي،\n\nقلت لكما إن كل العمل الشاق في حرس المدينة سيؤتي ثماره. لقد حصلت للتو على ترقية!\n\nلقد دُعيت للانضمام إلى فريق متخصص يعمل في المجاري. يبدو أن هناك مشاكل مع الحشرات والمجرمين هناك، ومهمتنا هي القضاء عليهم. العمل مقزز، لكن المجاري دافئة في الشتاء والأجر يساوي ثلاثة أضعاف أجر الحراسة العادية!\n\nلكن الأمر سري بعض الشيء، لذا لا يمكنني إرسال هذه الرسالة فعلًا. من الغريب ألا أكتب إليكما، لذلك سأستمر في كتابتها على أي حال. ربما أستطيع أن أريكما إياها يومًا ما.\n\nمع حبي،\n- سونيا
journal.document.sewers_guard.dangerous.title=منصب خطير...
journal.document.sewers_guard.dangerous.body=88 من الخريف، 375\nعزيزي أمي وأبي،\n\nأفهم الآن لماذا الأجر مرتفع جدًا، فالمجاري تعج بالوحوش! إن «الحشرات» و«المجرمين» هم في الحقيقة جرذان ضخمة متعطشة للدماء وقطعان من النوول الغاضبين.\n\nلحسن الحظ، بقية فريقي يعرفون تمامًا ما يفعلونه. قائد فريقنا، توماس، خبير في هذا الأمر. أحاول التعلم بسرعة حتى لا أكون عبئًا كبيرًا عليهم.\n\nهذا العمل أخطر بكثير مما توقعت. أنا سعيدة لأنني لا أستطيع إرسال هذه الرسائل الآن، لا أريد أن تقلقا.\n\nسأبقى بأمان،\n- سونيا
journal.document.sewers_guard.crabs.title=سرطانات عملاقة!
journal.document.sewers_guard.crabs.body=11 من الشتاء، 376\nعزيزي أمي وأبي،\n\nوكأن الجرذان لم تكن سيئة بما يكفي، توجد في الأعماق سرطانات عملاقة! اندفع أحدها بجواري مباشرة وأصاب لي إصابة بالغة قبل أن نقتله. يقول توماس إن الأمر ليس خطئي، لكنني أعرف أنه يحاول فقط أن يكون لطيفًا معي.\n\nلحسن الحظ، في طريق خروجنا صادفنا مغامرًا كان لديه بعض مرهم عشب الشمس الإضافي. ربما لم يكن لي نجا لولا ذلك الشيء.\n\nرأيت المغامر يحدق في وردة قبل أن يغادر، وقال إنها هدية. لماذا يخاطر بحياته هنا إذا كان هناك شخص يهتم به إلى هذا الحد؟\n\nهذا بالضبط ما أفعله أنا، أليس كذلك؟ أشعر أنني تورطت في شيء يفوق قدرتي.
journal.document.sewers_guard.guild.title=نقابة اللصوص
journal.document.sewers_guard.guild.body=23 من الشتاء، 376\nعزيزي أمي وأبي،\n\nلا توجد وحوش جديدة هذه المرة، بل صادفنا بدلًا من ذلك مجموعة صغيرة من نقابة اللصوص أثناء الدورية.\n\nكل ما سمعته عن النقابة سيئ، لكن بقية فريقي بدوا ودودين معهم بشكل شبه غريب. تبادل توماس المعلومات والمؤن مع أحدهم قبل أن نفترق.\n\nلا أفهم، ألم يكن من المفترض أن نتخلص من المجرمين؟ بل إن توماس قال لي ألا أذكر هذا لأي شخص في القيادة. كانت معلوماتهم ومؤنهم مفيدة جدًا على أي حال، ولم نكن قادرين على تحمل المزيد من القتال.\n\nأظن أننا جميعًا عالقون في هذا معًا هنا بالأسفل.
journal.document.sewers_guard.lost.title=لقد تهنا
journal.document.sewers_guard.lost.body=40 من الشتاء، 376\n\nأنا وتوماس تائهان. لقد أُبعدنا عن بقية الفريق أثناء قتال بعض النوول. لا أحد منا مصاب، لكن المجاري السفلية تشبه المتاهة.\n\nيقول توماس إنه يعرف طريقًا للخروج، لكنه يبدأ عند مدخل السجن القديم في أسفل المجاري. لا أحب التعمق أكثر، لكن ليس لدينا أي مؤن والذهاب إلى الأسفل أسرع بكثير من التجول بحثًا عن طريق دوريتنا.\n\nسيكون كل شيء بخير. توماس يعرف ما يفعله.
journal.document.sewers_guard.not_worth.title=الأمر لا يستحق
journal.document.sewers_guard.not_worth.body=صادف أنا وتوماس نوعًا من وحش الوحل الضخم عند مدخل السجن. وقبل أن نتمكن من الرد، قذف علينا سحره. تحمل توماس معظم الضربة. لقد مات.\n\nلا يوجد مبلغ من المال يستحق هذا. سأغادر عبر الطريق الذي أخبرني توماس عنه. ثم سأخذ ما كسبته كحارس، وأستخدمه لنقل والديّ وأنا بعيدًا عن هذه المدينة الملعونة. جزء مني يريد أن يأمل بأن لدى الملك خطة لكل هذا، لكنني أشك في ذلك.\n\nسأترك هذه الرسائل خلفي كتحذير للآخرين. الأمر ليس مجرد جرذان وسرطانات عملاقة، هناك خطب ما شديد الخطورة في الأسفل.

journal.document.prison_warden.title=يوميات مدير السجن
journal.document.prison_warden.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.
journal.document.prison_warden.journal.title=كتابة يوميات
journal.document.prison_warden.journal.body=1 من الربيع، 362\n\nهذه أول تدوينة في دفتر عمل مديرة السجن كيانا سميث. مع كل ما يحدث مؤخرًا، قررت أن أبدأ يوميات لأرتب أفكاري.\n\nلم يكن من السهل أبدًا إدارة سجن يقع على عمق نصف ميل تحت الأرض، لكن يبدو مؤخرًا أن نوعًا من الاضطرابات المنظمة يحدث هنا. بدأ السجناء يتصرفون بطريقة سيئة دون سبب ثم يرفضون شرح السبب.\n\nبدأ بعض الحراس يقولون إن المكان مسكون. لا يمكنني السماح لرجالي بنشر الشائعات، لكن لا أستطيع لومهم تمامًا على شعورهم بالقلق.\n- سميث
journal.document.prison_warden.recruits.title=مجندون جدد
journal.document.prison_warden.recruits.body=80 من الربيع، 362\n\nكما وعدوا، وصل عدد من المجندين الجدد اليوم. يبدو أن الأمر كالمعتاد، بعضهم واعد والكثير منهم مجرد جنود يريدون المال. ومع ذلك، فإن وجود كل هذه القوة الجديدة سيساعد كثيرًا في التعامل مع السجناء المشاغبين مؤخرًا.\n\nفي عمل كهذا، من المهم أن تعرف من يمكنك الوثوق به. أحد المجندين الجدد، توماس، يبدو واعدًا بشكل خاص. أحتاج إلى كل المساعدة التي يمكنني الحصول عليها الآن، لذا إذا أدى عمله جيدًا فسأرى إمكانية ترقيته بسرعة.\n- سميث
journal.document.prison_warden.mines.title=إغلاق المناجم
journal.document.prison_warden.mines.body=54 من الشتاء، 363\n\nجاءت مجموعة من المهندسين من المدينة اليوم، وقالوا إنهم هنا لإغلاق المدخل القديم للمناجم الموجودة في الأسفل. أظن أن المدينة لم تعد ترغب في تحمل عناء صيانة الممر. وكالعادة، لم يخبروني مسبقًا.\n\nكما أخبرني كبير المهندسين ببعض الهراء عن تسرب سحر الأقزام من المناجم. لا أصدق كلمة واحدة من ذلك.\n\nالوضع تحت السيطرة بشكل أفضل بكثير مع طاقمنا الجديد، لكن جذور المشكلة لم تُعالج بعد. هناك شيء ما يؤثر بالتأكيد في السجناء هنا، وهدم بعض الجدران لن يغير ذلك.\n- سميث
journal.document.prison_warden.rotberry.title=نبات التوت المتعفن
journal.document.prison_warden.rotberry.body=23 من الخريف، 363\n\nتلقيت اليوم هدية جميلة من فيليكس. إنها شجيرة حمراء زاهية من نوع ما تسمى «التوت المتعفن».\n\nلقد أخبرته من قبل كم هو هذا المكان كئيب، ويبدو أنه كان يستمع. وفقًا له، هذا النبات لا يحب الضوء والماء في الواقع، لذا يكفي أن أقص الأوراق مرة كل شهر تقريبًا. لكن يبدو أن التقليم مهم جدًا، فقد ذكره عشر مرات في رسالته.\n\nوبالطبع، فيليكس لا يفعل شيئًا مجانًا. يقول إن البذور التي ينتجها هذا النبات ممتازة لصنع العصي السحرية، لذا من الطبيعي أن أدين له ببعضها كلما أنتج النبات المزيد منها.\n- سميث
journal.document.prison_warden.no_support.title=لا دعم
journal.document.prison_warden.no_support.body=11 من الربيع، 364\n\nما الذي تفكر فيه المدينة بحق الجحيم؟ بعد أن طلبت المساعدة بشكل عاجل لم أسمع شيئًا، ولا حتى اعتذارًا فارغًا مثل الذي يرسلون عادةً عندما يرفضون طلباتي.\n\nفي هذه الأثناء يزداد السجناء سوءًا، بل إن بعض الحراس بدأوا أيضًا بإثارة المشاكل. هل ينوون ببساطة ترك الأمر يزداد سوءًا حتى نواجه أعمال شغب!؟\n\nظل توماس موثوقًا كعادته على الأقل. كانت مساعدته التنظيمية لا تقدر بثمن، وكانت فكرته بشأن تفعيل وحدات DM-100 القديمة مؤسفة لكنها ضرورية. أنا واثقة من أنني أستطيع استعادة السيطرة على هذا الوضع، كل ما أحتاجه هو بعض الدعم اللعين!\n-سميث
journal.document.prison_warden.letter.title=رسالة إلى توماس
journal.document.prison_warden.letter.body=توماس،\n\nلقد كنت صديقًا رائعًا، لذا سأقدم لك معروفًا.\n\nعندما تبدأ مناوبتك الليلة، أغلق زنزانة تينغو وعززها، وارمِ المفتاح في إحدى الزوايا، ثم اخرج. لا يهم إن تُرك السجناء الآخرون دون مراقبة، فعلى الأرجح لن يتمكن أحد قريبًا من مغادرة هذا المكان. لكن يجب أن يبقى ذلك المهووس مقفلًا، فإذا هرب فلا أحد يعلم ما الذي سيفعله.\n\nلا تخبر أحدًا بهذا، ولا تكلف نفسك عناء البحث عني. يجب على القبطان أن يغرق مع سفينته.\n- كيانا

journal.document.caves_explorer.title=سجل المستكشف
journal.document.caves_explorer.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.
journal.document.caves_explorer.expedition.title=بداية الرحلة الاستكشافية!
journal.document.caves_explorer.expedition.body=1 من الصيف، 308\n\nاليوم تبدأ رحلتنا الاستكشافية التي تستمر أربعة أسابيع إلى مناجم الأقزام المهجورة! لقد كلفني الملك بنفسه باستكشاف المنطقة. أهدافي الرئيسية هي العثور على أي موارد طبيعية غير مستغلة ومسح الكهوف لدراسة إمكانية بناء سجن.\n\nمع أنني قادر على الدفاع عن نفسي، فقد قبلت مرافقة من حرس المدينة بناءً على إصرار الملك. إنهم مجموعة من الحمقى، لكن طالما أنهم لا يبطئونني فوجودهم مقبول.\n\nمن المتوقع أن نطهر المجاري ونصل إلى المناجم بحلول المساء.\n- أرشيبالد دراموند، كبير السحرة، معهد السحر الجنوبي.
journal.document.caves_explorer.gold.title=كل هذا الذهب!
journal.document.caves_explorer.gold.body=4 من الصيف، 308\n\nكانت أيامنا الأولى مثمرة جدًا بالفعل! بعد إنشاء معسكر أساسي، انطلقنا لاستكشاف بعض المناطق العليا من المنجم المهجور. وعلى الرغم من وجود الكثير من الفوضى عديمة الفائدة التي تركها الأقزام، فإن العديد من جدران الكهوف تعج أيضًا بالذهب!\n\nلسوء الحظ، لسنا أول من وصل إلى هنا. الكهوف مليئة بالحياة البرية العدوانية، ويبدو أن مجموعات من النوول مهتمة بالذهب أيضًا. أعترف أنني كنت غير منصف تجاه مرافقي من الحرس، فقد كانوا مستكشفين وحماة أفضل بكثير مما توقعت.\n\nومع كل هذا النجاح، لا يزال أمامنا الكثير من المناجم لاستكشافه.\n- أرشيبالد
journal.document.caves_explorer.troll.title=قابلت ترولًا
journal.document.caves_explorer.troll.body=11 من الصيف، 308\n\nبعد أن بدأنا استكشاف الجزء الأوسط من المناجم، صادفنا وجهًا ودودًا! حسنًا... ودودًا نسبيًا. أقام ترول كهفي ورشة حدادة صغيرة هناك. إنه فظ وقليل الكلام، لكنه أصلح معداتنا مقابل بعض الذهب.\n\nلسوء الحظ، أخبرنا حداد الترول أيضًا أن كل هذا الذهب الجميل ليس جيدًا تمامًا كما يبدو. يسميه «الذهب المظلم»، ويبدو أنه يتحلل بسرعة عند تعرضه لضوء الشمس. وهذا يفسر بالتأكيد سبب عدم وجود نزاعات على هذه الموارد هنا.\n\nأظن أننا بحاجة إلى التعمق أكثر قليلًا لنرى ما إذا كان هناك شيء أكثر قيمة.
- أرشيبالد
journal.document.caves_explorer.city.title=مدخل المدينة
journal.document.caves_explorer.city.body=21 من الصيف، 308\n\nوصلنا الآن إلى الأسبوع الثالث، وبعد أن أمضينا معظم الأيام العشرة الماضية في رسم خرائط لمناطق أعمق فأعمق، وصلنا أخيرًا إلى قاع المناجم. وجدنا العديد من الآلات المعدنية وبوابة ضخمة تسد الدخول إلى مدينة الأقزام القديمة.\n\nحذرنا الحداد من بعض هذه الآلات. يبدو أنها صُممت للدفاع عن المنطقة وتميل إلى التفعيل عند العبث بها. ليست لدينا أي مصلحة في المدينة، والمعدن لن تكون قيمته كخردة كبيرة، لذلك رأينا أنه من الأفضل الاستماع إلى تحذيره والعودة.\n\nأعترف أنني كنت فضوليًا، لكن التحقيق هناك لم يكن يستحق المخاطرة بالتأكيد.\n- أرشيبالد
journal.document.caves_explorer.alive.title=إنها حية!
journal.document.caves_explorer.alive.body=23 من الصيف، 308\n\nإحدى آلات الأقزام دبت فيها الحياة بطريقة ما! كنا نمر بالقرب منها فحسب عندما اندفعت نحونا وكادت تسحق اثنين من مجموعتنا بقبضتيها المعدنيتين الضخمتين. لحسن الحظ، كنت أحمل معي عصاي السحرية الخاصة بالتفكيك. بضع ضربات جيدة التصويب منها وحُوّل ذلك الوحش إلى خردة معدنية.\n\nما يقلقني هو أننا لم نفعل شيئًا على الإطلاق لاستفزاز الآلة. لا يمكن للأقزام أن يكونوا قد صمموا الآلات لتكون عدوانية إلى هذا الحد، وكأنها كانت تحاول نصب كمين لنا!\n\nعلى الأقل تمكنت من تقديم بعض المساعدة لرفاقي هذه المرة.\n- أرشيبالد
journal.document.caves_explorer.report.title=التقرير النهائي
journal.document.caves_explorer.report.body=28 من الصيف، 308\n\nسننتهي اليوم من حزم ممتلكاتنا والاستعداد للمغادرة. وفي الوقت المناسب أيضًا، فقد بدأ العديد من أفراد مجموعتنا يعانون من كوابيس رهيبة بعد حادثة الآلة العدوانية. ربما يكون الأمر مجرد إرهاق، لكن كوابيسهم متشابهة بشكل مقلق.\n\nباختصار، المناطق العليا من المنجم آمنة إلى حد كبير. وإذا أمكن العثور على استخدام للذهب المظلم، فقد يكون استخراجه مربحًا جدًا. كما أن المساحات المفتوحة الكبيرة ستكون مناسبة جدًا لخطط بناء المدينة. أما المناجم السفلية فهي أخطر، وينبغي تجنبها.\n\nسأكتب كل هذا في تقريري النهائي خلال الأيام القليلة القادمة.\n- أرشيبالد

journal.document.city_warlock.title=يوميات الساحر
journal.document.city_warlock.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.
journal.document.city_warlock.old_king.title=مات الملك
journal.document.city_warlock.old_king.body=إنه اليوم الخامس من الشهر الثاني من السنة الثالثة والثلاثين من عصر السحر. إذا كان شخص من العالم الخارجي يقرأ هذا، فمن المحتمل أن يكون الآن في شتاء عام 264. اسمي ثيمور ظهير، وبحسب علمي أنا آخر عضو على قيد الحياة من بلاط الأقزام.\n\nملكنا ميت، وقد حل محله أحد زملائي السابقين الذي أصابه الجنون من شدة القوة. خضع له بقية البلاط مثل الحمقى الذين هم عليه، وفقدوا إرادتهم الحرة في هذه العملية. وحدي رأيت هذا قادمًا وهربت قبل اكتمال طقسه.\n\nلقد سقطت الدائرة الداخلية، لكن قوة الملك الجديد لم تصل بعد إلى الجميع. يجب أن أنشئ مقاومة في أسرع وقت ممكن. أرفض أن أسمح لحضارتنا المجيدة بالسقوط في يد هذا المهووس!
journal.document.city_warlock.resistance.title=مقاومة
journal.document.city_warlock.resistance.body=يبدو أن الخبر انتشر بسرعة. لم تمر سوى بضعة أيام، وقد جمعت بالفعل جيشًا صغيرًا من الموالين للملك القديم. قليلون منهم بارعون في السحر، لكن تقريبًا جميع رهبان المحاربين موجودون معنا. ينبغي أن نكون أكثر من ندٍّ لقزم مجنون واحد وبلاط عبيده.\n\nفي هذه الأثناء، اختبأ الملك الجديد في الحجرات الداخلية لمدينتنا. لا شك أنه أنفق معظم قوته ويأمل في استعادتها قبل أن يواجه مقاومة جديدة.\n\nسنشن هجومنا بعد ساعتين تقريبًا. وبحسن الحظ سنتمكن من تشكيل مجلس مؤقت وإعادة مدينتنا الرائعة إلى الاستقرار قبل نهاية الليل.
journal.document.city_warlock.failure.title=الفشل
journal.document.city_warlock.failure.body=يبدو أنني أحمق أيضًا. افترضت أن الملك الجديد يحتاج إلى خضوع البلاط له طوعًا، لكنني أدرك الآن أنه يملك القدرة على التحكم حتى بمن يقاومه.\n\nأحضرت دون تفكير أقوى عناصر المعارضة مباشرة إلى عتبة بابه، حتى يتمكن شخصيًا من تحويلهم إلى عبيد له. والآن تغمر طاقته النخرية المدينة، وتحول معظم الناس فورًا إلى أتباع له.\n\nالقلة التي لا تزال تملك إرادتها الحرة تهرب. اخترت البقاء خلفهم لأراقب قدر الإمكان وأبحث عن فرصة. وبفضل القوة السحرية التي أملكها، ينبغي أن أتمكن من البقاء مختبئًا وآمنًا لبعض الوقت.
journal.document.city_warlock.more_powerful.title=أكثر قوة
journal.document.city_warlock.more_powerful.body=أصبح تتبع الوقت صعبًا، لكن مر حوالي أسبوع منذ آخر تدوينة لي. لقد انهارت حضارتنا بالفعل. أُغلقت البوابات، وتوقفت جميع وظائف مجتمعنا، وتتجول قشور الأقزام الفارغة في القاعات.\n\nوخلال كل هذا، بطريقة ما، يزداد الملك الجديد قوة أيضًا. في كل يوم تصبح قوة إرادته أقوى، لكنها تتغير أيضًا. لا أستطيع وصف ذلك، لكنه يبدو وكأنه لم يعد قزمًا على الإطلاق.\n\nبدأت أتقبل أن أفضل ما يمكنني فعله على الأرجح هو توثيق هذه الأحداث. سأبقى هنا ما دمت أستطيع، ثم أتراجع عندما تبدأ إرادتي بالضعف.
journal.document.city_warlock.new_power.title=قوة جديدة
journal.document.city_warlock.new_power.body=ما الذي يحدث هنا؟ القوة المنبعثة من الملك الجديد مختلفة فعلًا عما كانت عليه في البداية، لكن هناك شيئًا آخر أيضًا. يبدو أن هذه القوة الجديدة تشع من أعمق قاعات مدينتنا.\n\nوالأكثر إثارة للحيرة هو أن النشاط في المدينة العليا انخفض أيضًا. لا أعرف ما الذي يحدث في الأسفل، لكنه يجذب تقريبًا كل انتباه الملك الجديد.\n\nالعودة إلى القاعات العميقة ستكون خطيرة، لكن يجب أن أكتشف ما الذي يسبب هذا التغيير. ربما يكون لدى الملك الجديد نقطة ضعف بعد كل شيء؟
journal.document.city_warlock.seen_it.title=لقد رأيته
journal.document.city_warlock.seen_it.body=لقد رأيت ما يوجد في الأسفل، لكنني لا أستطيع وصفه. ترتجف يداي بلا سيطرة بينما أحاول وضع أفكاري على الورق.\n\nلماذا يحدث هذا؟ هل فعل الملك الجديد هذا؟ لا معنى للأمر. ربما جذب استخدامه المفرط للقوة ذلك الشيء؟ كنت آمل أن أنقذ حضارتنا، لكنني أرى الآن أن العالم بأسره أصبح في خطر.\n\nبطريقة ما، الملك هو الشر الأقل. ليس لدي خيار آخر، فمن أجل الخير الأكبر سأستسلم. أرشدني يا ملكي، واستخدمني كأداة لإبقاء يوغ-دزيفا بعيدًا!

journal.document.halls_king.title=يوميات ???
journal.document.halls_king.discover_hint=يمكنك العثور على هذا النص في منطقة محددة، ولكن فقط بعد العثور على جميع النصوص السابقة في هذه المجموعة.
journal.document.halls_king.rejection.title=الرفض
journal.document.halls_king.rejection.body=أغبياء!\n\nعلى مدى السنوات الثلاث والثلاثين الماضية ازدهرت مملكتنا بفضل تقنيتنا السحرية الجديدة. لقد تعلمنا كيفية استدعاء الأرواح العنصرية وإخضاعها لإرادتنا، لكن بطريقة ما أصبحت التجارب الإضافية الآن «خطيرة جدًا».\n\nأعرف ما يحدث حقًا. رفض نظرياتي لا علاقة له بجدارتها، وكل ما له علاقة بالشخص الذي يقترحها. من المحتمل أنهم جميعًا يضحكون عليّ من وراء ظهري.\n\nحسنًا، كفى! لا يهمني ما يقولونه، سأستكشف أبعد حدود كوننا وحدي، وسأحتفظ بكل ما أكتشفه لنفسي!\n- ر.
journal.document.halls_king.amulet.title=التميمة
journal.document.halls_king.amulet.body=لقد فعلتها!\n\nلم أكن أعرف بالضبط ما الذي قد أجده، لكن ما اكتشفته هناك تجاوز كل توقعاتي الجامحة. كل هذه القوة، جالسة هناك في انتظار من يأخذها، وكلها لي!\n\nبهذا لن يجرؤ أي من الحمقى في البلاط على معارضتي. أشعر بحماس شديد وأنا أفكر في جميع الطرق المختلفة التي يمكنني بها إذلالهم. بل لماذا أتوقف عند ذلك؟ لدي ما يكفي من القوة لتدمير آخر واحد منهم إذا أردت! قد يكون ذلك مبالغة، لكن يجب ألا أطيل التفكير وإلا سيشكّون.\n\nأظن أنني سأسمي هذه القوة العظيمة «تميمة يندور»!\n- ر.
journal.document.halls_king.ritual.title=الطقس
journal.document.halls_king.ritual.body=واجهني ثيمور علنًا في وقت سابق اليوم وأصر على أن أشرح مصدر قوتي الجديد. تجاهلته بأفضل ما أستطيع، لكنني أشعر مرة أخرى بعيون بقية البلاط التي تحكم عليّ.\n\nكنت آمل أن أقضي وقتًا أطول قليلًا مستمتعًا بالهدوء قبل العاصفة، لكن ذلك لم يعد مهمًا. لقد قررت ما أريد فعله. سأدعي أنني اكتسبت قوتي من خلال طقس جديد، وسأعرض إجراءه على السحرة الآخرين وعلى الملك. وبمجرد انتهاء الطقس، سأصبح الملك!\n\nسيعترض ثيمور بالطبع، لكن مع كل هذه القوة المعروضة عليهم أشك في أنهم سيستمعون إليه!\n\nسيركع الجميع أمامي!\n- ملك الأقزام المستقبلي
journal.document.halls_king.new_king.title=ملك جديد
journal.document.halls_king.new_king.body=أنا الملك، ههههههههه!\n\nلقد سمحوا لي بفعلها ببساطة! وبأقل قدر من الإقناع وافقوا على السماح لي بـ«مشاركة» هذه القوة معهم في طقس عظيم. وفي لحظة واحدة تحولوا من جوقة من الأصوات الساخرة إلى بلاط جديد من الرعايا الصامتين!\n\nوكما هو متوقع، هرب ثيمور كالجبان عند أول علامة على المتاعب. وأستطيع بالفعل أن أشعر بقوة المقاومة التي يبنيها. أظن أنني سأسمح له بالاستمرار، حتى يتمكن من إحضار جميع المتآمرين معه مباشرة إلى بابي!\n\nومن الواضح أن المملكة لا تحترمني أيضًا، وأظن أنني سأصلح ذلك كذلك.\n- ملك الأقزام
journal.document.halls_king.thing.title=الشيء
journal.document.halls_king.thing.body=هناك مشكلة. تم التخلص من ثيمور دون جهد، لكن يبدو أن بحثي في العوالم الخارجية لم يمر دون أن يلاحظه أحد.\n\nلقد انجذب «شيء» ما إلى عالمي ويبدأ في شق طريقه عبر قاع القاعات السفلية. ولزيادة تعقيد الأمور، فهذا هو بالضبط المكان الذي خزنت فيه التميمة! يا له من مخلوق حاقد، لماذا يحاول حرماني من قوتي مع أن هناك الكثير منها لا يزال في الخارج لأستولي عليه؟\n\nومع ذلك، رغم قوتي، لا أظن أنني أستطيع ببساطة الاندفاع لمواجهته. قوته الحقيقية لا يمكن فهمها، لكن لا بد أن هناك طريقة للحد منها. سأدافع عن جائزتي!
journal.document.halls_king.attrition.title=حرب الاستنزاف
journal.document.halls_king.attrition.body=لدي خطة للتعامل مع ذلك الشيء. قوته لا نهائية، لكن قدرته على التوغل في هذا العالم ليست كذلك. إنه يعتمد على الأتباع والأجساد المجسدة لتنفيذ أوامره بينما يحاول بناء ما يكفي من القوة للاستيلاء على التميمة.\n\nرغم أنني لا أمتلك التميمة ماديًا، فما زلت أملك السيطرة الكاملة على قوتها. ومع وجود مدينة الأقزام بأكملها تحت تصرفي، لدي أيضًا ميزة التفوق العددي. يمكنني ببساطة الاستمرار في إرسال الجنود لمنعه من الاستيلاء على التميمة، والفوز بهذه الحرب تدريجيًا من خلال الاستنزاف!\n\nأنا، رودني، ملك الأقزام، سأصمد أمامك يا يوغ-دزيفا!

