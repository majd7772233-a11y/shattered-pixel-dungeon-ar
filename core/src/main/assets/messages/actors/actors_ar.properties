actors.hero.hero.name=أنت
actors.hero.hero.leave=لا يمكنك المغادرة بعد، فبقية الزنزانة بانتظارك في الأسفل!
actors.hero.hero.level_up=ارتفع المستوى!
actors.hero.hero.new_level=ارتفع المستوى! +الدقة، +التهرب، +5 صحة!
actors.hero.hero.new_talent=+1 نقطة موهبة!
actors.hero.hero.unspent=لديك نقاط مواهب غير مستخدمة!
actors.hero.hero.level_cap=لا يمكنك أن تصبح أقوى، لكن تجاربك تمنحك بالفعل دفعة من القوة!
actors.hero.hero.you_now_have=التقطت: %s.
actors.hero.hero.you_cant_have=لا يمكنك حمل: %s.
actors.hero.hero.locked_chest=هذا الصندوق مقفل ولا تملك مفتاحًا مطابقًا.
actors.hero.hero.locked_door=لا تملك مفتاحًا مطابقًا.
