actors.mobs.npcs.blacksmith.cant_enter_old=هذه المنطقة غير متاحة في هذه الجولة. ابدأ لعبة جديدة لتجربة المهمة الجديدة!
actors.mobs.npcs.blacksmith.def_verb=محجوب
actors.mobs.npcs.blacksmith.desc=يبدو حداد الترول هذا مثل جميع الترولات: طويل ونحيل، وجلده يشبه الحجر في اللون والملمس. يعمل حداد الترول بأدوات صغيرة بشكل غير متناسب.

actors.mobs.npcs.ghost.name=شبح حزين
actors.mobs.npcs.ghost.rat_1=مرحبًا %s... كنت يومًا مثلك - قويًا وواثقًا... لكن وحشًا خبيثًا قتلني... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... اقتل _الجرذ النتِن_ الذي أخذ حياتي...\n\nإنه يتجول في هذا الطابق... وينشر القذارة في كل مكان... _احذر سحابة الرائحة الكريهة وعضته الأكّالة، فالحمض يذوب في الماء..._
actors.mobs.npcs.ghost.rat_2=أرجوك... ساعدني... اقتل ذلك المسخ...\n\n_قاتله بالقرب من الماء... وتجنب الرائحة النتنة..._
actors.mobs.npcs.ghost.gnoll_1=مرحبًا %s... كنت يومًا مثلك - قويًا وواثقًا... لكن عدوًا ماكرًا قتلني... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... اقتل _مخادع الجنول_ الذي أخذ حياتي...\n\nإنه ليس مثل بقية الجنول... يختبئ ويستخدم الأسلحة المرمية... _احذر سهامه السامة والحارقة، ولا تهاجمه من مسافة بعيدة..._
actors.mobs.npcs.ghost.gnoll_2=أرجوك... ساعدني... اقتل المخادع...\n\n_لا تدعه يصيبك... اقترب منه..._
actors.mobs.npcs.ghost.crab_1=مرحبًا %s... كنت يومًا مثلك - قويًا وواثقًا... لكن مخلوقًا قديمًا قتلني... لا أستطيع مغادرة هذا المكان... ليس قبل أن أنتقم... اقتل _السلطعون العظيم_ الذي أخذ حياتي...\n\nإنه كبير في السن بشكل غير طبيعي... بمخلب واحد ضخم وصدفة سميكة... _احذر مخالبه، يجب أن تفاجئ السلطعون وإلا فسيصد بها..._
actors.mobs.npcs.ghost.crab_2=أرجوك... ساعدني... اقتل القشري...\n\n_سيصد دائمًا... عندما يراك قادمًا..._
actors.mobs.npcs.ghost.find_me=شكرًا لك... تعال وابحث عني...
actors.mobs.npcs.ghost.desc=يكاد الشبح يكون غير مرئي. يبدو كبقعة عديمة الشكل من ضوء خافت بوجه حزين.

actors.mobs.npcs.imp.name=شيطان طموح
actors.mobs.npcs.imp.intro=أأنت مغامر؟ أحب المغامرين! يمكنك الاعتماد عليهم دائمًا إذا كان هناك شيء يحتاج إلى القتل، أليس كذلك؟ مقابل مكافأة بالطبع ;)
actors.mobs.npcs.imp.golems_1=في حالتي، _الغولمات_ هي التي تحتاج إلى القتل. كما ترى، سأبدأ مشروعًا صغيرًا هنا، لكن تلك الغولمات الغبية سيئة للأعمال! من الصعب جدًا التفاوض مع كتل الغرانيت المتجولة، اللعنة عليها! لذا اقتل... لنقل _4 منها_ وستحصل على مكافأة.
actors.mobs.npcs.imp.monks_1=في حالتي، _الرهبان_ هم الذين يحتاجون إلى القتل. كما ترى، سأبدأ مشروعًا صغيرًا هنا، لكن أولئك المجانين لا يشترون شيئًا لأنفسهم وسيخيفون الزبائن الآخرين. لذا اقتل... لنقل _5 منهم_ وستحصل على مكافأة.
actors.mobs.npcs.imp.golems_2=كيف تسير رحلة صيد الغولمات؟ فقط لا تنسَ أخذ تلك الرموز.
actors.mobs.npcs.imp.monks_2=أوه، ما زلت حيًا! كنت أعلم أن الكونغ فو لديك سيكون أقوى ;) فقط لا تنسَ أخذ تلك الرموز.
actors.mobs.npcs.imp.cya=أراك لاحقًا، %s!
actors.mobs.npcs.imp.hey=بسسس، %s!
actors.mobs.npcs.imp.desc=الشياطين الصغار هم شياطين أدنى. لا يتميزون بقوتهم أو موهبتهم السحرية، لكنهم أذكياء واجتماعيون إلى حد كبير. يفضل كثير من الشياطين الصغار العيش بين غير الشياطين.

actors.mobs.npcs.impshopkeeper.name=شيطان طموح
actors.mobs.npcs.impshopkeeper.greetings=مرحبًا، %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=ماذا فعلت يا %s؟ تسوق بسرعة، يجب أن أخرج من هنا!
actors.mobs.npcs.impshopkeeper.thief=ظننت أنني أستطيع الوثوق بك!
actors.mobs.npcs.impshopkeeper.buyback=يعيد الشيطان العنصر إليك بسعادة.
actors.mobs.npcs.impshopkeeper.desc=أقام الشيطان متجرًا صغيرًا على حدود القاعات الداخلية. من الجميل رؤية وجه ودود، لكن أسعاره بالتأكيد ليست ودية.

actors.mobs.npcs.mirrorimage.name=صورة مرآوية
actors.mobs.npcs.mirrorimage.desc=يشبه هذا الوهم شكلك بشكل كبير، بل ويبدو كأنه يستخدم سلاحك ودرعك الحاليين.\n\nستبحث الصور المرآوية عن الأعداء وتهاجمهم باستخدام سلاحها المقلد، الذي يتصرف مثل سلاحك، لكنه يلحق ضررًا أقل. تبدأ شبه غير مرئية، لكنها يجب أن تتخذ شكلًا يسهل رؤيته حتى تتمكن من الهجوم.\n\nرغم أن قوتها الهجومية قد تكون كبيرة، لا تمتلك الصور المرآوية أي متانة، وستتلاشى فور تلقيها الضرر.
actors.mobs.npcs.mirrorimage.discover_hint=يمكنك العثور على هذه الشخصية باستخدام لفافة محددة.

actors.mobs.npcs.npc.discover_hint=يمكنك العثور على هذه الشخصية في منطقة محددة من الزنزانة.

actors.mobs.npcs.prismaticimage.name=صورة طيفية
actors.mobs.npcs.prismaticimage.desc=يشبه هذا الوهم المتلألئ شكلك بشكل كبير، بل ويبدو كأنه يستخدم سلاحك ودرعك الحاليين.\n\nستحاول الصور الطيفية البحث عن الأعداء وجذب انتباههم، مستخدمةً دفاعها وصحتها المعززين لحمايتك. ورغم أنها لا تمتلك القوة الهجومية نفسها التي تمتلكها الصور المرآوية، فإن متانتها أعلى، بما في ذلك استفادتها من درعك.\n\nعندما تنخفض صحتها إلى 0، ستتلاشى الصور الطيفية خلال عدة أدوار، ويمكن علاجها خلال هذه المدة. وعندما لا يكون هناك أعداء، ستتلاشى الصور الطيفية وتعود إلى سيدها.
actors.mobs.npcs.prismaticimage.discover_hint=يمكنك العثور على هذه الشخصية باستخدام لفافة محددة.

actors.mobs.npcs.ratking.name=ملك الجرذان
actors.mobs.npcs.ratking.not_sleeping=أنا لا أنام!
actors.mobs.npcs.ratking.what_is_it=ما الأمر؟ ليس لدي وقت لهذا الهراء. مملكتي لن تحكم نفسها بنفسها!
actors.mobs.npcs.ratking.confused=ماذا... أين أنا؟ مملكتي تحتاج إلي!
actors.mobs.npcs.ratking.crown_clothes=ارتدِ بعض الملابس! أنت لست في حالة تسمح لك بالتحدث مع الملوك!
actors.mobs.npcs.ratking.crown_desc=أوووه، هل هذا التاج لي؟! إنه يبدو أكثر لمعانًا من تاجي، لذا أقبله بامتنان!\n\nفي الواقع، أعتقد أنني أستطيع أن أقدم لك شيئًا كمكافأة على هذا التاج. قوة هائلة تليق ببطل مثلك! هل تريدها؟
actors.mobs.npcs.ratking.crown_yes=بالطبع!
actors.mobs.npcs.ratking.crown_info=أخبرني بالمزيد أولًا.
actors.mobs.npcs.ratking.crown_no=أفضل ألا أفعل...
actors.mobs.npcs.ratking.crown_thankyou=هيهيهي، شكرًا لك! والآن اذهب واجعل ملكك فخورًا!
actors.mobs.npcs.ratking.crown_fine=حسنًا! ليس وكأنني كنت أريده أصلًا...
actors.mobs.npcs.ratking.crown_after=هل تستمتع بدرعك الجديد؟ لا استرجاع!
actors.mobs.npcs.ratking.desc_crown=هذا الجرذ أكبر قليلًا من الجرذ الجرابي العادي. يرتدي تاج ملك الأقزام على رأسه.
actors.mobs.npcs.ratking.desc_birthday=هذا الجرذ أكبر قليلًا من الجرذ الجرابي العادي. يرتدي قبعة حفلة خضراء صغيرة بدلًا من تاجه المعتاد. عيد ميلاد سعيد يا ملك الجرذان!
actors.mobs.npcs.ratking.desc_winter=هذا الجرذ أكبر قليلًا من الجرذ الجرابي العادي. يرتدي قبعة احتفالية صغيرة بدلًا من تاجه المعتاد. أعياد سعيدة!
actors.mobs.npcs.ratking.desc=هذا الجرذ أكبر قليلًا من الجرذ الجرابي العادي. يرتدي تاجًا صغيرًا على رأسه.
actors.mobs.npcs.ratking.discover_hint=يمكنك العثور على هذه الشخصية في نهاية منطقة محددة من الزنزانة.

actors.mobs.npcs.sheep.name=خروف
actors.mobs.npcs.sheep.baa!=مأا!
actors.mobs.npcs.sheep.baa?=مأا؟
actors.mobs.npcs.sheep.baa.=مأا.
actors.mobs.npcs.sheep.baa...=مأا...
actors.mobs.npcs.sheep.def_verb=محجوب
actors.mobs.npcs.sheep.desc=هذا خروف سحري. ما الشيء السحري فيه؟ لا يمكنك قتله. سيبقى واقفًا هناك حتى يتلاشى سحريًا، وهو يمضغ الطعام طوال الوقت بنظرة فارغة.
actors.mobs.npcs.sheep.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عنصر أو فخ محدد.

actors.mobs.npcs.shopkeeper.name=صاحب المتجر
actors.mobs.npcs.shopkeeper.thief=لص! لص!
actors.mobs.npcs.shopkeeper.warn=انتبه! لن أحذرك مرة أخرى.
actors.mobs.npcs.shopkeeper.flee=يهرب صاحب المتجر!
actors.mobs.npcs.shopkeeper.sell=بع عنصرًا
actors.mobs.npcs.shopkeeper.talk=تحدث
actors.mobs.npcs.shopkeeper.buyback=يعيد صاحب المتجر العنصر إليك على مضض.
actors.mobs.npcs.shopkeeper.talk_prison_intro=لدي كل ما تحتاجه لمغامرة ناجحة!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=ذلك الختم الذي تحمله مثير للاهتمام، عادةً ما تكون هذه الأختام كاملة. أأنت بطل سقط في العار أو شيء من هذا القبيل؟ حسنًا، مهما فعلت فهذا ليس من شأني، وعملاتك ما زالت صالحة.
actors.mobs.npcs.shopkeeper.talk_prison_mage=هيهي، أعتقد أنني رأيت ملصق مطلوبين يحمل اسمك في مكان ما من المدينة. هل أنت هارب؟ أوه، أنت بريء، أليس كذلك؟ بالطبع، بالطبع... لا تقلق، لدي أشياء أهم من الإبلاغ عنك، لكن ربما عليك شراء شيء لتتأكد؟
actors.mobs.npcs.shopkeeper.talk_prison_rogue=هل أتيت من نقابة اللصوص لتطهير المنطقة؟ لا، مجرد تسوق؟ حسنًا، اقتل بعض الوحوش أثناء وجودك هنا على أي حال. ولا تتوقع خصمًا أيضًا، فأنا أدفع أموال حماية جيدة لهؤلاء القوم، وأنتم بالكاد تحمونني هنا في الأسفل.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=يبدو أنك خارج بيئتك أيتها السيدة. ممرات الزنزانة الضيقة ليست فسيحة مثل القاعات الكبرى أو الغابات المحيطة بالمدينة، أليس كذلك؟ هيهي، لا تهتمي بهذياني، لمَ لا تشترين شيئًا؟
actors.mobs.npcs.shopkeeper.talk_prison_duelist=حسنًا، إذا لم تكن تلك البطلة المسافرة! إذا كنت تحاول إنقاذ بلدة أخرى فحظًا سعيدًا، فالمخاطر هنا أسوأ بكثير من عصابات قطاع الطرق التافهة. أنا متأكد أنك ستبلين أفضل من أي شخص آخر، فقط حاولي ألا تموتي مباشرة خارج متجري.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=مرحبًا يا صاحبة السمو، أم أصبحتِ صاحبة القداسة الآن؟ هيهي، في كلتا الحالتين هذا ليس مكانًا مناسبًا لك، فكثير من الناس سيصابون بحزن شديد لو انتهى بك الأمر ميتة. لا بد أن لديك بعض العملات، فلمَ لا تشترين شيئًا يساعد على منع ذلك؟
actors.mobs.npcs.shopkeeper.talk_caves=أنفق المال، تعش مدة أطول.\n\nوأوه، ألقِ التحية على حداد الترول ذاك نيابةً عني إذا رأيته. ذكّره بأنه لا يزال مدينًا لي بالمال مقابل تلك المطرقة التي بعتها له الأسبوع الماضي!
actors.mobs.npcs.shopkeeper.talk_city=بضائعي يمكن أن تحميك هنا في الأسفل.\n\n...وأرجوك لا تتسكع. استغرق الأمر وقتًا طويلًا حتى أجعل السكان المحليين يتركونني وشأني، ولا أريدك أن تجذب أي متاعب!
actors.mobs.npcs.shopkeeper.talk_halls=مرحبًا، لدي أسعار خاصة لصائدي الشياطين!\n\nوأوه، كن حذرًا في الأسفل! الشياطين الموجودة تحتنا لن تهتم بمدى شجاعتك. لا يمكنك العودة وإنفاق المزيد من المال إذا كنت ميتًا! ;)\n\nهل الشياطين مثلي؟ هيهي، بالطبع لا. أنا مجرد شخص صغير، ولست مقاتلًا بارعًا، وتمكنت من الحفاظ على سلامة عقلي. الشياطين في الأسفل مخلوقات أقوى بكثير، وقد استُعبدوا جميعًا بواسطة... حسنًا... فقط كن حذرًا في الأسفل.
actors.mobs.npcs.shopkeeper.talk_ascent=لا أعرف ما الذي تخطط لفعله بذلك الطوق، لكنني لا أريد أي علاقة به. اشترِ شيئًا وغادر، كلانا بحاجة إلى مغادرة هذا المكان!
actors.mobs.npcs.shopkeeper.desc=هذا الرجل الممتلئ يبدو أنسب لمنطقة تجارية في مدينة كبيرة منه إلى زنزانة. أسعاره تفسر سبب تفضيله ممارسة تجارته هنا.

actors.mobs.npcs.wandmaker.name=صانع عصي عجوز
actors.mobs.npcs.wandmaker.intro_warrior=أوه، مرحبًا! يا لها من مفاجأة سارة أن ألتقي بمحارب من الشمال في مكان كئيب كهذا! لا بد أنك سافرت مسافة طويلة للوصول إلى هنا. إذا كنت تبحث عن المغامرة، فقد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_rogue=يا إلهي، لقد أفزعتني! لم ألتقِ بلص من هذا المكان لا يزال محتفظًا بعقله، لذا لا بد أنك من السطح! إذا كنت مستعدًا لمساعدة غريب، فقد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_mage=أوه، مرحبًا %s! سمعت أن بعض الفوضى حدثت بخصوصك ومعهد السحرة؟ أوه، لا تهتم، لم أحب أولئك المتجمدين أصلًا. إذا كنت مستعدًا، فقد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_huntress=أوه، مرحبًا أيتها السيدة! من الجميل رؤية وجه ودود هنا في الأسفل، أليس كذلك؟ في الواقع، أقسم أنني رأيت وجهك من قبل، لكن لا أستطيع تذكر أين... أوه، لا يهم، إذا كنت هنا من أجل المغامرة، فقد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_duelist=أوه، مرحبًا أيتها السيدة! يا لها من مفاجأة سارة أن ألتقي ببطلة في مكان كئيب كهذا! إذا كنت مستعدة لمساعدة رجل عجوز، فقد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_cleric=أوه، مرحبًا يا صاحبة السمو! يا لها من مفاجأة سارة أن ألتقي بك في مكان كئيب كهذا! أكره أن أفرض عليك، لكن قد تكون لدي مهمة لك.
actors.mobs.npcs.wandmaker.intro_1=\n\nأتيت إلى هنا للبحث عن مكوّن نادر لصنع عصا، لكنني ضللت طريقي، ودرعي السحري يضعف. سأحتاج إلى المغادرة قريبًا، لكن لا أستطيع تحمل الرحيل دون الحصول على ما جئت من أجله.
actors.mobs.npcs.wandmaker.intro_dust=أبحث عن بعض _غبار الجثث._ إنه نوع خاص من مسحوق العظام الملعون الذي يظهر عادةً في أماكن كهذه. يجب أن تكون هناك غرفة مسدودة بالحواجز في مكان قريب، وأنا متأكد أن بعض الغبار سيظهر هناك. لكن احذر، فاللعنة التي يحملها الغبار قوية جدًا، _وعُد إليّ بأسرع ما تستطيع_ وسأطهره لك.
actors.mobs.npcs.wandmaker.intro_ember=أبحث عن بعض _الجمر الطازج_ من عنصر نار حديث الولادة. تظهر العناصر عادةً عندما لا يتم التحكم في طقس استدعاء، لذا ما عليك سوى العثور على بعض الشموع وموقع للطقس، وأنا متأكد أنك ستتمكن من استدعاء واحد. ستريد أن _تتجنب محاصرة نفسك_ أثناء قتاله، أو _احتفظ بشيء يجمد في متناول يدك._ العناصر حديثة الولادة قوية وفوضوية جدًا، لكنها لا تحتمل البرد.
actors.mobs.npcs.wandmaker.intro_berry=كان حارس هذا السجن القديم يحتفظ بـ_نبات توت العفن_، وأنا أريد إحدى بذوره. لكن ربما يكون النبات قد نما بشكل بري الآن، لذا قد يكون إجباره على التخلي عن بذرة أمرًا صعبًا. يجب أن تكون حديقته في مكان قريب. حاول أن _تبتعد عن كرومه المهاجمة_ إذا كنت تريد البقاء سليمًا. قد يكون استخدام النار مغريًا، لكن أرجوك لا تفعل، ستقتل النبات وتدمر بذوره.
actors.mobs.npcs.wandmaker.intro_2=\n\nإذا تمكنت من الحصول على ذلك لي، فسأسعد بدفع ثمنه لك بإحدى عصاي المصنوعة بعناية! أحضرت معي اثنتين، لذا يمكنك أخذ أي واحدة تفضلها.
actors.mobs.npcs.wandmaker.reminder_dust=هل حالفك الحظ مع غبار الجثث، %s؟ ابحث عن بعض الحواجز.
actors.mobs.npcs.wandmaker.reminder_ember=هل حالفك الحظ مع ذلك الجمر، %s؟ ستحتاج إلى العثور على أربع شموع وموقع الطقس.
actors.mobs.npcs.wandmaker.reminder_berry=هل حالفك الحظ مع بذرة توت العفن، %s؟ ابحث عن غرفة مليئة بالنباتات.
actors.mobs.npcs.wandmaker.def_verb=محجوب
actors.mobs.npcs.wandmaker.desc=يرتدي هذا السيد العجوز، رغم عافيته، تعبيرًا مرتبكًا قليلًا. تحميه درع سحري.

### الوحوش

actors.mobs.acidic.name=عقرب حمضي
actors.mobs.acidic.desc=هذه المخلوقات الشيطانية الضخمة الشبيهة بالعنكبيات تتجنب القتال القريب، وتفضل إطلاق أشواك مسننة معيقة من مسافات بعيدة. ويبدو أن هذا المخلوق يقطر بمادة أكّالة.

actors.mobs.albino.name=جرذ أمهق
actors.mobs.albino.desc=هذه سلالة نادرة من الجرذان الجرابية، بفرو أبيض ناصع وأسنان مسننة.
actors.mobs.albino.discover_hint=يمكنك العثور على هذا العدو نادرًا في منطقة محددة من الزنزانة.

actors.mobs.armoredstatue.name=تمثال مدرع
actors.mobs.armoredstatue.desc=قد تظن أنه مجرد تمثال آخر غير حي من تماثيل هذه الزنزانة، لكن عيناه المتوهجتان باللون الأحمر تكشفان حقيقته.\n\nيبدو أنه في حالة ممتازة بفضل الدرع الذي يرتديه، وقد يكون قتله صعبًا جدًا.
actors.mobs.armoredstatue.desc_arm_wep=رغم أن التمثال نفسه مصنوع من الحجر، فإن _%1$s_ و_%2$s_ اللذين يحملهما يبدوان حقيقيين.

actors.mobs.bandit.name=لص مجنون
actors.mobs.bandit.desc=هذا لص من النخبة، يتميز بردائه الأرجواني الفاخر. وعلى الرغم من مهارته الأكبر، فقد أصبح بلا عقل مثل اللصوص العاديين.\n\nبالإضافة إلى السرقة منك، سيصيبك اللصوص المجانين بالعمى والإعاقة والتسمم لفترة قصيرة! كما أن احتمال حملهم غنائم إضافية أكبر بكثير من اللصوص العاديين.

actors.mobs.bat.name=خفاش مصاص للدماء
actors.mobs.bat.desc=هؤلاء السكان السريعون والمثابرون للكهوف أخطر بكثير مما يبدون. يستعيدون صحتهم مع كل هجوم ناجح، مما يسمح لهم بالقضاء على خصوم أكبر منهم بكثير.

actors.mobs.bee.name=نحلة ذهبية
actors.mobs.bee.desc_honey=رغم صغر حجمها، تميل النحل الذهبية إلى حماية موطنها بشراسة. هذه النحلة تم تهدئتها، ويبدو أنها تريد أن تتبعك.
actors.mobs.bee.desc=رغم صغر حجمها، تميل النحل الذهبية إلى حماية موطنها بشراسة. هذه النحلة غاضبة جدًا، من الأفضل أن تحافظ على مسافتك.
actors.mobs.bee.discover_hint=يمكنك العثور على هذه الشخصية باستخدام عنصر محدد.

actors.mobs.brute.name=جنول ضخم
actors.mobs.brute.enraged=هائج
actors.mobs.brute.def_verb=محجوب
actors.mobs.brute.desc=الضخام هم أكبر وأقوى وأشد الجنول قسوة. عندما يتعرضون لإصابة قاتلة، يدخلون في حالة هياج، ويحصلون على حماية مؤقتة وزيادة كبيرة في الضرر.
actors.mobs.brute$bruterage.name=غضب الضخم
actors.mobs.brute$bruterage.desc=هذا الجنول الضخم يحتضر، لكنه يريد أخذك معه!\n\nسيموت الضخم عندما تنفد حمايته، سواء بسبب مرور الوقت أو تعرضه للضرر. وفي هذه الأثناء سيلحق ضررًا متزايدًا بشكل هائل، لذا احذر!\n\nالحماية المتبقية: %d.

actors.mobs.causticslime.name=وحل أكّال
actors.mobs.causticslime.desc=يبدو أن هذا الوحل قد تلوث بالسحر المظلم المتصاعد من الأسفل. لقد فقد لونه الأخضر المعتاد، وأصبح يقطر بالمادة الأكّالة.
actors.mobs.causticslime.discover_hint=يمكنك العثور على هذا العدو نادرًا في منطقة محددة من الزنزانة.

actors.mobs.crab.name=سلطعون المجاري
actors.mobs.crab.desc=هذه السرطانات الضخمة تتربع على قمة السلسلة الغذائية في المجاري. إنها سريعة جدًا، ودرعها الصدفي السميك يستطيع تحمل الضربات القوية.

actors.mobs.crystalguardian.name=حارس بلوري
actors.mobs.crystalguardian.def_verb=محجوب
actors.mobs.crystalguardian.desc=تكاد هذه الحراس البلورية الكبيرة تبدو كتماثيل، لولا عيونها المتوهجة بشدة. البلور المتصلب الذي صُنعت منه يجعلها بطيئة الحركة لكنها شديدة المتانة، لذا _من الأفضل تركها نائمة في عشها البلوري لأطول فترة ممكنة._\n\nوبسبب حجمها، تتحرك الحراس البلورية ببطء أكبر بكثير في الأماكن الضيقة. كما أنها متينة جدًا لدرجة أنه يستحيل قتلها مباشرة. يمكن ضربها وإعاقتها مؤقتًا، لكنها ستنهض مجددًا بعد فترة قصيرة.
actors.mobs.crystalguardian.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.crystalmimic.name=مقلد بلوري
actors.mobs.crystalmimic.ate=لقد أكل المقلد عنصرك %s!
actors.mobs.crystalmimic.escaped=لقد هرب المقلد البلوري!
actors.mobs.crystalmimic.desc=المقلدات مخلوقات سحرية يمكنها اتخاذ أي شكل تريده. وفي الزنزانات تختار دائمًا تقريبًا شكل صندوق كنز لإغراء المغامرين الغافلين.\n\nالمقلدات البلورية أكثر مكرًا من أقاربها العاديين، وتفضل تجنب القتال أثناء سرقة الغنائم. ستحاول الهرب بسرعة بمجرد اكتشافها، وتمتلك القدرة على تغيير مواقع الأعداء عند الهجوم.

actors.mobs.crystalspire.name=برج بلوري
actors.mobs.crystalspire.warning=تهتز البلورة بينما تضربها. الاستمرار في ذلك سيجذب الانتباه إليك حتمًا...
actors.mobs.crystalspire.alert=يزداد الاهتزاز ويصدر دويًا عبر الكهف بأكمله!
actors.mobs.crystalspire.desc=هذا البرج العملاق المصنوع من بلور فائق الصلابة هو على الأرجح مصدر جميع المخلوقات البلورية الغريبة في هذا الكهف. أسلحتك العادية غير فعالة ضده، لذا ستحتاج إلى استخدام المعول إذا أردت تدميره.\n\n_تأكد من استعدادك قبل أن تبدأ بكسره._ من المرجح أن تستغرق مثل هذه البلورة الضخمة وقتًا طويلًا للتنقيب فيها، وربما لن تتمكن من فعل ذلك دون إزعاج. وقد يمتلك البرج نفسه وسائل للدفاع عن نفسه أيضًا. _ربما يمكن استخدام هجماته الخاصة ضد أتباعه._
actors.mobs.crystalspire.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.crystalwisp.name=شبح بلوري
actors.mobs.crystalwisp.beam_kill=قتلَك شعاع الضوء...
actors.mobs.crystalwisp.desc=قطعة صغيرة غاضبة وعائمة من البلور المتصلب تنتج توهجًا ساطعًا. وعلى الرغم من أنها ليست قوية بشكل خاص، ستطلق الأشباح البلورية شعاعًا ضوئيًا مؤذيًا عليك إذا كان لديها خط رؤية واضح.\n\nهذه الأشباح صغيرة بما يكفي للتحرك بسهولة بين التكوينات البلورية المختلفة، لكنها لا تستطيع إطلاق النار عبرها.
actors.mobs.crystalwisp.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.demonspawner.name=مولّد شياطين
actors.mobs.demonspawner.on_death=يبدو أن الطاقة الشيطانية هنا تضعف مع موت مولّد الشياطين.
actors.mobs.demonspawner.desc=هذا الخليط الملتوي من لحم الأقزام مسؤول عن إنشاء شياطين الممزقين من الأقزام الذين ماتوا في هذه المنطقة. من الواضح أن الشياطين لا يرون مشكلة في استخدام كل مورد يمكنهم الحصول عليه ضد أعدائهم.\n\nرغم مظهرها المرعب، لا تمتلك مولدات الشياطين أي وسيلة للحركة أو الدفاع عن نفسها مباشرة. لكن كتلتها الكبيرة تجعل قتلها سريعًا أمرًا صعبًا، كما أنها تستدعي شياطين الممزقين بسرعة أكبر عندما تتعرض للتهديد.\n\n_يبدو أن مولدات الشياطين مرتبطة بمصدر مركزي للطاقة الشيطانية. قد يؤدي قتلها إلى إضعافه._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=قتلتك صاعقة البرق...
actors.mobs.dm100.desc=إن DM-100 هو نموذج مبكر من «آلة دفاع» أقزامية صُممت لحماية عمال المناجم الأقزام في الكهوف الموجودة أسفل هذا السجن. لكن صدماتها الكهربائية أثبتت أنها ضعيفة جدًا، لذلك تم إهداؤها إلى المدينة البشرية في الأعلى. بقيت دون استخدام لسنوات، وانتهى بها المطاف في السجن، حيث اعتبرها الحارس في البداية قاسية جدًا للاستخدام. ولكن مع ازدياد تمرد السجناء أصبحت ضرورة.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=يطلق DM-200 نفثة من العادم السام!
actors.mobs.dm200.desc=إن DM-200 هو الجيل الثاني من «آلة الدفاع» الأقزامية، وقد صُمم لحماية عمال المناجم الأقزام في الكهوف والمدينة الموجودة في الأسفل. وهي أكبر بكثير وأثقل من سابقاتها، وتهاجم بقبضات هيدروليكية مدمرة.\n\nحجمها الأكبر هو أيضًا نقطة ضعفها الرئيسية، إذ لا تستطيع الدخول في الأنفاق والمداخل الضيقة للزنزانة. وتمكن الأقزام من تعويض نقص حركة DM-200 بالسماح لها بطرد غازات عادم سامة على الأعداء البعيدين، أو على الأعداء الذين لا تستطيع الوصول إليهم.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=يقذف DM-201 قنبلة أكّالة!
actors.mobs.dm201.desc=جرّب الأقزام لفترة قصيرة التركيز أكثر على مشكلة عدم قدرة DM-200 على الحركة، فصنعوا بعض نماذج DM الثابتة تمامًا. إن DM-201 هو DM-200 أعيد تجهيزه ليعمل كبرج حراسة لا يمتلك القدرة على الحركة. ومقابل فقدان القدرة على الحركة، تتمتع نماذج DM-201 بمتانة وقوة هجومية أكبر بكثير.\n\nوبما أن DM-201 لا يمتلك محركًا لطرد العادم، فقد جهزه الأقزام بدلًا من ذلك بقنابل غاز أكّال! لكن DM-201 حريص مع هذه القنابل، ولن يقذفها إلا عند مهاجمته من مسافة بعيدة.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=تم اكتشاف أفراد غير مصرح لهم!
actors.mobs.dm300.shield=يسحب DM-300 الطاقة من الأسلاك المكشوفة ويحمي نفسه!
actors.mobs.dm300.charging=ضرر مستمر! تفعيل صرح الطاقة!
actors.mobs.dm300.charging_hint=لا يمكن إلحاق الضرر بـDM-300 أثناء تزويده بالطاقة من الصرح!
actors.mobs.dm300.supercharged=دَمِّر! دَمِّر! دَمِّر!
actors.mobs.dm300.charge_lost=تم تدمير الصرح! العودة إلى الطاقة المحلية!
actors.mobs.dm300.pylons_destroyed=إنذار! تم اكتشاف عدم استقرار في شبكة الطاقة!
actors.mobs.dm300.rankings_desc=سحقه DM-300
actors.mobs.dm300.def_verb=محجوب
actors.mobs.dm300.defeated=ضرر حرج! محاولة إيقاف التشغـ
actors.mobs.dm300.desc=إن DM-300 هو أكبر وأقوى «آلة دفاع» بناها الأقزام على الإطلاق. تصنيع آلة بهذه الضخامة صعب، لذلك لم يصنع الأقزام سوى عدد قليل منها لحراسة مداخل عاصمتهم الواقعة تحت الأرض.\n\nوهي مجهزة بفتحات لطرد غازات العادم السامة ومثقاب قوي يمكنها استخدامه للهجوم وكذلك لزعزعة الأرض. ويمكن لـDM-300 الاتصال بشبكة طاقة لزيادة قوته أكثر.
actors.mobs.dm300.desc_supercharged=DM-300 مشحون حاليًا بالكامل بالطاقة الكهربائية. في هذه الحالة لا يمكن إلحاق الضرر بـDM-300 ويتحرك بسرعة مضاعفة! بالإضافة إلى ذلك، أصبح مثقابه يدور بسرعة كافية ليتمكن من _الحفر عبر الصخور الصلبة,_ رغم أنه يتحرك ببطء أكبر بكثير عند القيام بذلك.\n\nالهجوم على DM-300 مباشرةً أثناء الشحن الفائق عديم الفائدة، لكن _شيئًا ما في المنطقة يجب أن يكون مصدر هذه الطاقة،_ وتدميره قد يضعفه.

actors.mobs.dwarfking.name=ملك الأقزام
actors.mobs.dwarfking.notice=كيف تجرؤ! ليس لديك أي فكرة عما تتدخل فيه!
actors.mobs.dwarfking.lifelink_1=أحتاج إلى جوهرك، أيها العبد!
actors.mobs.dwarfking.lifelink_2=انزف من أجلي، أيها العبد!
actors.mobs.dwarfking.teleport_1=تعامل معهم، أيها العبد!
actors.mobs.dwarfking.teleport_2=أبقهم مشغولين، أيها العبد!
actors.mobs.dwarfking.wave_1=كفى! انهضوا يا عبيدي!
actors.mobs.dwarfking.wave_2=المزيد! انزفوا من أجل ملككم!
actors.mobs.dwarfking.wave_3=عديمو الفائدة! اقتلوهم الآن!
actors.mobs.dwarfking.enraged=لا يمكنك قتلي يا %s. أنا. خالد!
actors.mobs.dwarfking.losing=لا! لا يمكنك فعل هذا... ليس لديك أي فكرة عما يوجد في الأسفل...
actors.mobs.dwarfking.defeated=لقد... حكمت علينا جميعًا بالهلاك...
actors.mobs.dwarfking.rankings_desc=سقط أمام ملك الأقزام
actors.mobs.dwarfking.desc=منذ سنوات عديدة، اكتشف أحد أعظم السحرة في بلاط الأقزام أسرارًا منحته سلطة هائلة على الحياة والموت. وسرعان ما استخدم هذه القوة لإخضاع وإفساد أقرانه وملكه، وفي النهاية كل مواطن من الأقزام. والآن هو الملك، حاكم فيلق من التابعين غير الأحياء.\n\nملك الأقزام عدو عدواني، وسيحاول تطويق أعدائه وسحقهم بحشد من أتباعه غير الأحياء.
actors.mobs.dwarfking$dkghoul.rankings_desc=سقط أمام ملك الأقزام
actors.mobs.dwarfking$dkmonk.rankings_desc=سقط أمام ملك الأقزام
actors.mobs.dwarfking$dkwarlock.rankings_desc=سقط أمام ملك الأقزام
actors.mobs.dwarfking$dkgolem.rankings_desc=سقط أمام ملك الأقزام

actors.mobs.ebonymimic.name=مقلد أبنوسي
actors.mobs.ebonymimic.reveal=كان هناك مقلد هنا!
actors.mobs.ebonymimic.hidden_name=هيئة مريبة
actors.mobs.ebonymimic.hidden_desc=يبدو أن هناك شيئًا هنا، لكنه شفاف بالكامل تقريبًا.
actors.mobs.ebonymimic.desc=المقلدات مخلوقات سحرية يمكنها اتخاذ أي شكل تريده. وفي الزنزانات تختار دائمًا تقريبًا شكل صندوق كنز لإغراء المغامرين الغافلين.\n\nالمقلدات الأبَنوسية مقلدات متخفية قادرة على جعل نفسها شبه غير مرئية. تكمن على الأشياء التي من المرجح أن يتفاعل معها المغامرون، لكنها تحتوي أيضًا على غنائم خاصة بها. وليست أصلب من المقلد العادي بعد اكتشافها، لكن عضتها المفاجئة مدمرة.
actors.mobs.ebonymimic.discover_hint=يمكنك العثور على هذا العدو باستخدام قطعة زينة محددة.

actors.mobs.elemental$fireelemental.name=عنصر نار
actors.mobs.elemental$fireelemental.desc=العناصر مخلوقات فوضوية غالبًا ما تتشكل عندما لا يتم التحكم بشكل صحيح في السحر الغيبي القوي. تمتلك العناصر قدرًا ضئيلًا من الذكاء، وترتبط عادةً بنوع معين من السحر.\n\nعناصر النار نوع شائع من العناصر تلحق الضرر بالسحر الناري. تشعل أهدافها بهجمات قريبة، ويمكنها أحيانًا إطلاق كرات من النار أيضًا.
actors.mobs.elemental$newbornfireelemental.name=عنصر نار حديث الولادة
actors.mobs.elemental$newbornfireelemental.charging=العنصر يشحن طاقته!
actors.mobs.elemental$newbornfireelemental.desc=العناصر مخلوقات فوضوية غالبًا ما تتشكل عندما لا يتم التحكم بشكل صحيح في السحر الغيبي القوي. تمتلك العناصر قدرًا ضئيلًا من الذكاء، وترتبط عادةً بنوع معين من السحر.\n\nلقد استُدعي عنصر النار هذا للتو، لكنه لا يزال خطيرًا جدًا!
actors.mobs.elemental$newbornfireelemental.desc_boss=بسبب الطبيعة الفوضوية لاستدعائه، لا يستطيع هذا العنصر نشر النار إلا في انفجارات غير دقيقة بعد شحنه لدور واحد.
actors.mobs.elemental$newbornfireelemental.desc_ally=لأن هذا العنصر استُدعي بواسطة تعويذة، فلديه قدر أكبر قليلًا من التحكم في لهبه. وهو غير قادر على تنفيذ هجمات بعيدة المدى، لكنه يشعل الأعداء الذين يهاجمهم في القتال القريب.
actors.mobs.elemental$newbornfireelemental.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.
actors.mobs.elemental$frostelemental.name=عنصر جليد
actors.mobs.elemental$frostelemental.desc=العناصر مخلوقات فوضوية غالبًا ما تتشكل عندما لا يتم التحكم بشكل صحيح في السحر الغيبي القوي. تمتلك العناصر قدرًا ضئيلًا من الذكاء، وترتبط عادةً بنوع معين من السحر.\n\nعناصر الجليد نوع شائع من العناصر تضعف الأعداء بالسحر البارد. وتُصيب أهدافها بالبرد بهجمات قريبة وأحيانًا بعيدة المدى. ويكون سحرها أكثر فعالية بكثير في الماء.
actors.mobs.elemental$shockelemental.name=عنصر صدمة
actors.mobs.elemental$shockelemental.desc=العناصر مخلوقات فوضوية غالبًا ما تتشكل عندما لا يتم التحكم بشكل صحيح في السحر الغيبي القوي. تمتلك العناصر قدرًا ضئيلًا من الذكاء، وترتبط عادةً بنوع معين من السحر.\n\nعناصر الصدمة نوع أقل شيوعًا من العناصر تعطل أعداءها بالكهرباء وومضات الضوء. وفي القتال القريب، تطلق الكهرباء إلى الأعداء القريبين، وتلحق ضررًا إضافيًا بالهدف الأساسي إذا كان في الماء. كما تركّز أحيانًا انفجارًا ضوئيًا بعيد المدى على هدفها يصيبه بالعمى مؤقتًا.
actors.mobs.elemental$chaoselemental.name=عنصر الفوضى
actors.mobs.elemental$chaoselemental.desc=العناصر مخلوقات فوضوية غالبًا ما تتشكل عندما لا يتم التحكم بشكل صحيح في السحر الغيبي القوي. تمتلك العناصر قدرًا ضئيلًا من الذكاء، وترتبط عادةً بنوع معين من السحر.\n\nعناصر الفوضى نادرة وخطيرة ولم تستقر على عنصر محدد. وستطلق سحرًا جامحًا لا يمكن التنبؤ به عند الهجوم.

actors.mobs.eye.name=عين شريرة
actors.mobs.eye.deathgaze_kill=قتلتك نظرة الموت...
actors.mobs.eye.desc=العيون الشريرة كرات عائمة من الطاقة الشيطانية المتراكمة. ورغم قدرتها على القتال القريب، تكمن قوتها الحقيقية في سحرها.\n\nبعد بناء الطاقة لفترة قصيرة، تطلق العين الشريرة شعاعًا مدمرًا من الطاقة يسمى _نظرة الموت._ كل شيء يقع ضمن مجال رؤية العين الشريرة سيتلقى ضررًا هائلًا، لذا فإن المغامرين الحكماء يبحثون عن ساتر.

actors.mobs.fetidrat.name=جرذ نتن
actors.mobs.fetidrat.desc=هناك خطب ما بالتأكيد في هذا الجرذ. فروه الأسود الدهني وجلده المتعفن مختلفان جدًا عن الجرذان السليمة التي رأيتها سابقًا. وعيناه الخضراوان الشاحبتان تجعلانه يبدو مخيفًا بشكل خاص.\n\nيحمل الجرذ سحابة من الرائحة الكريهة معه، وهي قوية بشكل خانق من مسافة قريبة.\n\nيتدفق الوحل الداكن من فمه، وهو يأكل الأرضية لكنه يبدو أنه يذوب في الماء.
actors.mobs.fetidrat.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.fungalcore.name=لب الفطر
actors.mobs.fungalcore.desc=لا بد أن هذا الفطر العملاق هو مصدر كل النشاط الفطري في هذا الكهف.

actors.mobs.fungalsentry.name=حارس فطري
actors.mobs.fungalsentry.desc=تعمل هذه الفطريات الطويلة بشكل خاص كنقطة دفاع للشبكة الفطرية الأكبر التي تعيش في هذا الكهف.\n\nإنها غير متحركة، لكنها تطلق انفجارات دقيقة من السم على أي شيء يدخل في مجال رؤيتها. وعلى الرغم من أن تأثير هذه الانفجارات ضعيف نسبيًا، _فيمكنها أن تراكم كميات قاتلة من السم بسرعة كبيرة._ ويمكن قتلها، لكن من الأفضل على الأرجح تجنبها.

actors.mobs.fungalspinner.name=ناسج فطري
actors.mobs.fungalspinner.desc=يبدو أن هذا العنكبوت الكهفي يتم التحكم فيه بواسطة فطر طفيلي. وقد غيّر الفطر قدراته أيضًا، فاستبدل شبكة العنكبوت وأكياس السم بنمو فطري.\n\nسيبصق الناسج الفطري نباتات عليك بدلًا من الشبكات، وينشر نباتات فطرية وقد يجذرك. وعلى الرغم من عدم قدرته على تسميمك، سيحصل الناسج الفطري على مقاومة ضرر كبيرة إذا كان بجوار أي فطر.

actors.mobs.ghoul.name=غول أقزامي
actors.mobs.ghoul.desc=عندما بدأ مجتمع الأقزام بالانهيار ببطء، واستولى ملك الأقزام الحالي على السلطة المطلقة، لم يُعامل الضعفاء أو من قاوموه جيدًا. ومع ازدياد إتقان الملك للسحر المظلم، أخضع هؤلاء الأقزام لإرادته، وهم الآن يشكلون جنود جيشه المشاة.\n\nالغيلان ليست قوية بشكل خاص بمفردها، لكنها تسافر دائمًا في مجموعات ويصبح قتلها أصعب بكثير بأعداد كبيرة. _عندما يُهزم غول، سيعود إلى الحياة بعد بضعة أدوار ما دام غول آخر قريبًا منه._

actors.mobs.gnoll.name=كشاف جنول
actors.mobs.gnoll.desc=الجنول أشباه بشر شبيهون بالضباع. يعيشون في المجاري والزنزانات، ويصعدون أحيانًا لشن غارات على السطح. كشافو الجنول أعضاء عاديون في مجموعتهم؛ وهم ليسوا أقوياء مثل الضخام ولا أذكى من الشامانات.

actors.mobs.gnollexile.name=منفيّ الجنول
actors.mobs.gnollexile.desc=هذا الجنول ذو الفرو الرمادي يحمل علامة كبيرة على كتفه تدل على أنه منفي. عادةً ما يُنفى الجنول من مجتمعه بسبب تجاهل الأوامر أو خرق القوانين. ويجب على المنفيين أن يكونوا أقوياء وماكرين للبقاء على قيد الحياة، ويبدو أن هذا الواحد يعرف كيفية استخدام الرمح الذي يحمله.
actors.mobs.gnollexile.desc_passive=_منفيّ الجنول لا يتحرك للهجوم._ لا يبدو عدوانيًا مثل بقية الجنول هنا، وربما لا يعتقد أن قتالَك يستحق العناء. يمكنك ببساطة أن تدعه يمر، لكنه يحمل حقيبة ظهر قد تكون مليئة بعناصر مفيدة...
actors.mobs.gnollexile.desc_aggro=_منفيّ الجنول ينظر حوله بغضب._ يبدو أن شيئًا ما جعله يقرر القتال في النهاية. احذر ذلك الرمح!
actors.mobs.gnollexile.seen_passive=ينظر الجنول حامل الرمح إليك بحذر، لكنه لا يتحرك للهجوم.
actors.mobs.gnollexile.seen_aggro=يتحرك الجنول حامل الرمح للهجوم!

actors.mobs.gnollgeomancer.name=ساحر أرض الجنول
actors.mobs.gnollgeomancer.warning=بدأ ساحر الأرض يتحرك. تأكد من استعدادك قبل أن تتابع!
actors.mobs.gnollgeomancer.alert=استيقظ ساحر الأرض! يبدو أن الكهف بأكمله يتحرك بينما يقفز بعيدًا وهو يضحك بجنون!
actors.mobs.gnollgeomancer.rock_kill=لقد قتلتك الصخرة المتطايرة...
actors.mobs.gnollgeomancer.rockfall_kill=قتلتك الصخور المتساقطة...
actors.mobs.gnollgeomancer.desc=لا بد أن هذا الجنول الضخم المهيب، ذو الرتبة العالية، هو مصدر مختلف أنواع سحر تحريك الأرض هنا، ومنظّم كل نشاطات الجنول. وعلى عكس حفّاري الجنول في المنطقة، فإن ساحر الأرض بارع جدًا في استخدام سحره، ولا يمكن أن يتضرر من الصخور المقذوفة أو المتساقطة. لكنه لا يملك أي وسيلة للقتال في الاشتباك القريب.
actors.mobs.gnollgeomancer.desc_armor=ساحر الأرض محاط حاليًا بطبقة من درع صخري. _ستحتاج إلى الاقتراب وكسر هذا الدرع بمعولك قبل أن تتمكن من إلحاق الضرر بساحر الأرض._
actors.mobs.gnollgeomancer.desc_armor_sapper=_حفّار جنول قريب يحمل جهازًا يعزز الدرع الصخري لساحر الأرض. لن تتمكن من إلحاق أي ضرر به الآن!_
actors.mobs.gnollgeomancer.desc_sleeping=هذا الشامان الجنولي الطويل بشكل مثير للإعجاب محاط بطبقة من الصخور ويبدو كأنه تمثال تقريبًا. وعند النظر عن قرب يمكنك رؤية الصخور تتحرك سحريًا بالتزامن مع تنفس الجنول الكبير. لا يمكن إيذاؤه وهو محاط بالصخور هكذا، ويبدو أنه يستمتع بقيلولة حرفية تحت التراب.\n\nربما يمكنك اختراق طبقات الصخور بمعولك، لكن _تأكد من أنك مستعد للقتال عندما تفعل ذلك._ لا بد أن ساحر الأرض هو مصدر مختلف أنواع سحر تحريك الأرض هنا، ومنظّم كل نشاطات الجنول. _قد يكون من الأفضل هزيمة الجنول المنتشرين هنا قبل قتاله._
actors.mobs.gnollgeomancer.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.gnollguard.name=حارس جنول
actors.mobs.gnollguard.def_verb=صدّ
actors.mobs.gnollguard.spear_warn=يلحق الجنول ضربة وحشية بطرف رمحه!
actors.mobs.gnollguard.desc=جنول كبير وقوي المظهر يحمل رمحًا ودرعًا، لكنه لا يرتدي خوذة. من المحتمل أن هؤلاء الحراس هم ضخام قيد التدريب، وقد أُجبروا على المساعدة في حماية المنجم من الحياة البرية المتوغلة.\n\nحارس الجنول قوي بما يكفي لحمل الرمح بيد واحدة، لكنه لا يجيد استخدامه كثيرًا. _سيحتاج إلى مساحة مفتوحة نسبيًا للهجوم من مسافة بعيدة، وسيلحق ضررًا أقل بكثير بك إذا اقتربت منه._

actors.mobs.gnollguard.desc_armor=_حفّار جنول قريب يحمل جهازًا يمنح هذا الحارس درعًا أرضيًا، ما يقلل الضرر الذي يتلقاه بدرجة كبيرة._
actors.mobs.gnollguard.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.gnollsapper.name=حفّار جنول
actors.mobs.gnollsapper.desc=جنول صغير وضعيف لكنه ذكي، ذو فرو شاحب وحقيبة مليئة بأدوات مختلفة. من المحتمل أن يكون هنا للمساعدة في التنقيب عن الذهب الداكن واستخراجه، ولديه حارس قريب لحمايته. إنه قادر على القتال، لكن هجماته ضعيفة بشكل مثير للشفقة، ولا تتجاوز قوة كشاف الجنول.\n\nبدلًا من القتال مباشرة، يفضل الحفّارون استخدام أدواتهم المختلفة لجعل البيئة الصخرية تهاجم نيابةً عنهم. لكنهم لا يعرفون سحر تحريك الأرض بأنفسهم، ولذلك من المرجح جدًا أن يستخدموا أدواتهم بتهور. _يجب أن تكون هناك طرق كثيرة لاستخدام هجماتهم ضدهم أو ضد حارسهم._
actors.mobs.gnollsapper.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.gnolltrickster.name=مخادع الجنول
actors.mobs.gnolltrickster.desc=مخلوق غريب المظهر، حتى بمعايير الجنول. ينحني إلى الأمام بابتسامة شريرة، ويكاد يحتضن الحقيبة المعلقة على كتفه. عيناه واسعتان، وتبدوان مزيجًا غريبًا من الخوف والحماس.\n\nتوجد في حقيبته مجموعة كبيرة من السهام سيئة الصنع، ويبدو أنها جميعًا مزودة برؤوس مغطاة بمواد ضارة مختلفة.
actors.mobs.gnolltrickster.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.goldenmimic.name=مقلد ذهبي
actors.mobs.goldenmimic.desc=المقلدات مخلوقات سحرية يمكنها اتخاذ أي شكل تريده. وفي الزنزانات تختار دائمًا تقريبًا شكل صندوق كنز لإغراء المغامرين الغافلين.\n\nالمقلدات الذهبية أكثر متانة، وتحاول جذب أقوى المغامرين. ولديها غنائم أفضل، لكنها أيضًا أقوى بكثير من المقلدات العادية.

actors.mobs.golem.name=غولم
actors.mobs.golem.def_verb=صدّ
actors.mobs.golem.desc=الغولمات محاولة لتصحيح العيوب السابقة في آلات الأقزام، بالاستفادة من استخدام الأقزام المكتشف حديثًا للسحر. وهي أكثر إحكامًا وكفاءة بكثير مقارنةً بـDM-300، مع بقائها شديدة الفتك.\n\nورغم أن الغولمات لا تزال كبيرة جدًا على المرور عبر الممرات، منحها الأقزام قدرات سحرية جديدة لتعويض ذلك. يستطيع الغولمات الانتقال آنيًا بين الغرف، كما يمكنهم نقل الأعداء إليهم عندما يكونون خارج المدى.

actors.mobs.goo.name=غو
actors.mobs.goo.notice=غلرب-غلرب!
actors.mobs.goo.defeated=غلرب... غلرب...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=غو يضخم نفسه!
actors.mobs.goo.enraged=هائج
actors.mobs.goo.gluuurp=غللللرب!
actors.mobs.goo.rankings_desc=امتصّه غو
actors.mobs.goo.desc=لا يُعرف الكثير عن غو. من المحتمل جدًا أنه ليس حتى مخلوقًا، بل تجمعًا من مواد قذرة من المجاري اكتسب وعيًا بدائيًا بطريقة ما. وبغض النظر عن ذلك، فمن المؤكد أن السحر المظلم هو ما سمح لغو بالوجود.\n\nسمحت طبيعته الهلامية بامتصاص كميات كبيرة من الطاقة المظلمة، وتشعر بقشعريرة بمجرد الاقتراب منه. وإذا تمكن غو من مهاجمتك بهذه الطاقة، فلن تعيش طويلًا.

actors.mobs.greatcrab.name=السلطعون العظيم
actors.mobs.greatcrab.noticed=يصدّ السلطعون بمخلابه الضخم.
actors.mobs.greatcrab.def_verb=صدّ
actors.mobs.greatcrab.desc=هذا السلطعون هائل الحجم، حتى مقارنةً بسلطعونات المجاري الأخرى. تغطي الشقوق والبرنقيل صدفته الزرقاء، مما يدل على تقدمه الكبير في العمر. يتحرك ببطء، بالكاد يحافظ على توازنه باستخدام مخلابه الضخم.\n\nرغم أن للسلطعون مخلبًا واحدًا فقط، فإن حجمه يعوض ذلك بسهولة. يمسك السلطعون بمخلابه أمام أي تهديد، ويحمي نفسه خلف جدار من الصدفة لا يمكن اختراقه. لكنه لا يستطيع صد الهجمات التي لا يراها قادمة، أو الهجمات القادمة من عدة أعداء في الوقت نفسه.
actors.mobs.greatcrab.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.guard.name=حارس السجن
actors.mobs.guard.scorpion=تعال إلى هنا!
actors.mobs.guard.def_verb=صدّ
actors.mobs.guard.desc=كان هؤلاء الحراس في السابق مسؤولين عن السجن، لكنهم منذ زمن طويل لم يعودوا مختلفين عن السجناء. يتمايلون مثل الزومبي ويتجولون بلا عقل في الممرات بحثًا عن أي شيء خارج عن المألوف، مثلك!\n\nيحملون سلاسل حول الخصر، وربما تُستخدم لسحب الأعداء إلى مسافة قريبة.

actors.mobs.hermitcrab.name=سلطعون الناسك
actors.mobs.hermitcrab.def_verb=صدّ
actors.mobs.hermitcrab.desc=لسبب أو لآخر، قرر سلطعون المجاري هذا ارتداء الجزء العلوي المكسور من برميل على رأسه! أبطأه الوزن الإضافي إلى السرعة العادية، لكنه منحه أيضًا دفاعًا أكبر بكثير. لكنك تعتقد أنك تستطيع سماع شيء يرتد داخل البرميل...

actors.mobs.mimic.name=مقلد
actors.mobs.mimic.reveal=ذلك الصندوق مقلد!
actors.mobs.mimic.hidden_hint=هناك شيء غريب في هذا الصندوق... قد لا يكون الاقتراب منه ومحاولة فتحه فكرة جيدة.
actors.mobs.mimic.desc=المقلدات مخلوقات سحرية يمكنها اتخاذ أي شكل تريده. وفي الزنزانات تختار دائمًا تقريبًا شكل صندوق كنز لإغراء المغامرين الغافلين.\n\nلدى المقلدات عضة شرسة، لكنها غالبًا ما تحتوي على كنز أكثر من الصناديق العادية.
actors.mobs.mimic.discover_hint=يمكنك العثور على هذا العدو في أي مكان من الزنزانة.

actors.mobs.necromancer.name=مستحضر أرواح
actors.mobs.necromancer.desc=توافد سحرة الظلام المتدربون هؤلاء إلى السجن، لأنه المكان المثالي لممارسة فنونهم الشريرة.\n\nيستدعي مستحضرو الأرواح الهياكل العظمية ويعززونها لتقاتل نيابةً عنهم. كما أن قتل مستحضر الأرواح سيقتل الهيكل العظمي الذي استدعاه.
actors.mobs.necromancer$necroskeleton.name=هيكل مستحضر الأرواح العظمي
actors.mobs.necromancer$necroskeleton.desc=استُدعي هذا الهيكل العظمي بواسطة مستحضر أرواح. يتصرف تمامًا مثل الهيكل العظمي العادي، وسيموت عندما يُقتل مستحضر الأرواح الذي استدعاه.

actors.mobs.mob.died=تسمع شيئًا يموت في مكان بعيد.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=قُتل على يد: %s
actors.mobs.mob.discover_hint=يمكنك العثور على هذا العدو في منطقة محددة من الزنزانة.

actors.mobs.monk.name=راهب أقزامي
actors.mobs.monk.def_verb=صدّ
actors.mobs.monk.parried=صُدّت الضربة
actors.mobs.monk.desc=هؤلاء الرهبان متعصبون، كرّسوا أنفسهم لحماية ملكهم بالقوة الجسدية. وقد بلغ تفانيهم حدًا جعلهم يتخلون عن عقولهم تمامًا لملكهم، وهم الآن يتجولون في مدينة الأقزام مثل الزومبي عديمي العقل.\n\nيعتمد الرهبان بالكامل على فنون القتال اليدوي، ويمكنهم استخدام قبضاتهم العارية للهجوم والدفاع. عندما يركزون، يصدّ الرهبان الهجوم الجسدي التالي الموجه ضدهم، حتى لو كان ذلك الهجوم مضمون الإصابة بغير ذلك. ويبنون تركيزهم بسرعة أكبر أثناء الحركة، وببطء أكبر أثناء القتال المباشر.
actors.mobs.monk$focus.name=مركّز
actors.mobs.monk$focus.desc=هذا الراهب مركز تمامًا على هدفه، ويبدو أنه يتوقع تحركاته قبل أن يقوم بها.\n\nأثناء التركيز، يكون الهجوم الجسدي التالي على هذه الشخصية مضمونًا أن يخطئ، مهما كانت الظروف. يؤدي صدّ هذا الهجوم إلى استهلاك تركيز الراهب، وسيتعين عليه بناء التركيز مجددًا لصد هجوم آخر. يبني الرهبان تركيزهم بسرعة أكبر أثناء الحركة.

actors.mobs.phantompiranha.name=سمكة بيرانا شبحية
actors.mobs.phantompiranha.teleport_away=تنتقل سمكة البيرانا الشبحية آنيًا بعيدًا...
actors.mobs.phantompiranha.desc=سمك البيرانا الشبحية سلالة نادرة من البيرانا تتمتع بقدرات سحرية وأجسام شفافة مخيفة. ويمكنها الانتقال آنيًا أثناء تعرضها للهجوم، إما للهروب أو للاقتراب بسرعة من عدوها!\n\nرغم أن قتالها مزعج، فإن لحمها ثمين بسبب خصائصه السحرية.

actors.mobs.piranha.name=سمكة بيرانا عملاقة
actors.mobs.piranha.desc=هذه الأسماك آكلة اللحوم تُربّى خصيصًا لحماية المناطق المغمورة بالمياه. عضتها قاتلة، لذا من الأفضل تجنب مواجهتها مباشرة.
actors.mobs.piranha.discover_hint=يمكنك العثور على هذا العدو في أي مكان من الزنزانة.

actors.mobs.pylon.name=صرح طاقة
actors.mobs.pylon.desc_inactive=صرح طاقة مخصص للمساعدة في تنظيم الكهرباء التي تشغّل الآلات في هذه المنطقة.\n\nالصرح غير نشط حاليًا ومحَصّن ضد الضرر.
actors.mobs.pylon.desc_active=صرح طاقة مخصص للمساعدة في تنظيم الكهرباء التي تشغّل الآلات في هذه المنطقة. الصرح يتدفق حاليًا بالطاقة الكهربائية، ولا بد أن هذا هو ما يمنح DM-300 شحنته الفائقة!\n\nفي هذه الحالة تكون الصروح عرضة للضرر، لكنها ستطلق الكهرباء إلى الخلايا القريبة بنمط مع اتجاه عقارب الساعة. وبسبب بنيتها المعدنية الثقيلة، تقاوم الصروح كميات كبيرة من الضرر.

actors.mobs.rat.name=جرذ جرابي
actors.mobs.rat.desc=الجرذان الجرابية مخلوقات عدوانية لكنها ضعيفة نسبيًا من سكان المجاري. لديها عضة مؤذية، لكنها لا تشكل خطرًا على الحياة إلا بأعداد كبيرة.

actors.mobs.ripperdemon.name=شيطان ممزق
actors.mobs.ripperdemon.leap=يستعد شيطان الممزق للقفز!
actors.mobs.ripperdemon.desc=هذه المخلوقات المروعة هي نتيجة استخدام القوات الشيطانية للعديد من جثث الأقزام الموجودة في هذه المنطقة. الممزقون مخلوقات هزيلة شبيهة بالغيلان تشبه الأقزام، لكن بأجساد مشوهة ومخالب عظمية طويلة وحادة.\n\nشياطين الممزق ليست متينة بشكل خاص، لكنها رشيقة وخطيرة. ويمكنها القفز لمسافات كبيرة للوصول بسرعة إلى أهدافها قبل تمزيقها بمخالبها.

actors.mobs.rotheart.name=قلب العفن
actors.mobs.rotheart.desc=ثمرة توتة العفن فريدة جدًا. فبدلًا من أن تتعفن وتوفر العناصر الغذائية، تنمو الثمرة وتتصلب وتحيط بالبذرة. وهي توفر حماية للأعضاء الداخلية التي تنمو داخل الثمرة. هذا الجرم الضخم يُسمى قلب نبات توت العفن البالغ.
actors.mobs.rotheart.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.rotlasher.name=سوط العفن
actors.mobs.rotlasher.desc=سوط العفن جزء من بنية جذور نبات توت العفن الناضج، وهو أيضًا وسيلته الأساسية للدفاع. هذه السياط عمياء ومثبتة في الأرض، لكنها تهاجم بعنف أي تهديد قريب بعد أن تأخذ لحظة لاكتشافه. وعندما لا يوجد أعداء قريبون، تبقى بلا حركة وتحاول الاندماج مع النباتات المحيطة.
actors.mobs.rotlasher.discover_hint=يمكنك العثور على هذا العدو أثناء مهمة محددة.

actors.mobs.scorpio.name=عقرب
actors.mobs.scorpio.desc=هذه المخلوقات الشيطانية الضخمة الشبيهة بالعنكبيات تتجنب القتال القريب، وتفضل إطلاق أشواك مسننة معيقة من مسافات بعيدة.

actors.mobs.senior.name=راهب أقدم
actors.mobs.senior.desc=هؤلاء الرهبان متعصبون، كرّسوا أنفسهم لحماية ملكهم بالقوة الجسدية. وقد بلغ تفانيهم حدًا جعلهم يتخلون عن عقولهم تمامًا لملكهم، وهم الآن يتجولون في مدينة الأقزام مثل الزومبي عديمي العقل.\n\nأتقن هذا الراهب فنون القتال اليدوي، وهو قادر على بناء التركيز أثناء الحركة بسرعة أكبر بكثير من الرهبان العاديين. عندما يركز، يصدّ الرهبان الهجوم الجسدي التالي الموجه ضدهم، حتى لو كان ذلك الهجوم مضمون الإصابة بغير ذلك. ويبني الرهبان تركيزهم بسرعة أكبر أثناء الحركة، وببطء أكبر أثناء القتال المباشر.

actors.mobs.shaman.name=شامان جنول
actors.mobs.shaman.bolt_kill=قتلتك الصاعقة السحرية...
actors.mobs.shaman.desc=شامانات الجنول جنول أذكياء يستخدمون تعاويذ قتالية لتعويض افتقارهم إلى القوة. ويتمتعون بمكانة تحظى باحترام كبير في مجتمع الجنول رغم ضعف قوتهم.
actors.mobs.shaman$redshaman.spell_desc=يرتدي هذا الشامان قناعًا أحمر، وسيستخدم سحرًا _يضعف قوتك الهجومية مؤقتًا._
actors.mobs.shaman$blueshaman.spell_desc=يرتدي هذا الشامان قناعًا أزرق، وسيستخدم سحرًا _يزيد الضرر الذي تتلقاه مؤقتًا._
actors.mobs.shaman$purpleshaman.spell_desc=يرتدي هذا الشامان قناعًا أرجوانيًا، وسيستخدم سحرًا _يخفض دقتك وتهربك مؤقتًا._

actors.mobs.armoredbrute.name=ضخم مدرع
actors.mobs.armoredbrute.desc=كبار ضخام الجنول غالبًا ما يرتدون دروعًا قوية لإظهار مكانتهم. تجعل الدروع هؤلاء الضخام أكثر مقاومة بكثير للضرر الجسدي، كما أن انضباطهم الأكبر يعني أنهم قادرون على الاستمرار في حالة الهياج لفترة أطول بكثير قبل الاستسلام لجراحهم.

actors.mobs.skeleton.name=هيكل عظمي
actors.mobs.skeleton.explo_kill=قتلتك انفجار عظام...
actors.mobs.skeleton.def_verb=صدّ
actors.mobs.skeleton.desc=تتكون الهياكل العظمية من عظام مغامرين وسكان سيئي الحظ في السجن، تحركها انبعاثات السحر الشرير من الأعماق السفلية. وبعد تعرضها لضرر كافٍ، تتفكك الهياكل العظمية في انفجار من العظام. شظايا هذا الانفجار مؤذية لأي شيء قريب، لكن الدرع فعال جدًا في تخفيفها.

actors.mobs.slime.name=وحل
actors.mobs.slime.def_verb=صدّ
actors.mobs.slime.desc=الوحول مخلوقات غريبة سحرية قليلًا، لها جسم خارجي مطاطي ونواة سائلة. توفر لها مجاري المدينة إمدادًا وفيرًا من الماء والمغذيات.\n\nوبسبب غشائها الخارجي المرن، يصعب إلحاق أكثر من _6 ضرر_ بالوحول في هجوم واحد.

actors.mobs.snake.name=ثعبان المجاري
actors.mobs.snake.hint=حاول استخدام زر الفحص على الثعبان لتتعلم كيفية التصدي له.
actors.mobs.snake.desc=هذه الثعابين الضخمة قادرة على الانزلاق بسرعة بعيدًا عن الضربات، مما يجعل إصابتها صعبًا جدًا. لكن الهجمات السحرية أو الهجمات المباغتة قادرة على مباغتتها.\n\nيمكنك تنفيذ هجوم مباغت بمهاجمة الثعبان أثناء وجودك خارج مجال رؤيته. إحدى الطرق هي أن تدعه يطاردك عبر مدخل، ثم _اضربه مباشرة بعد دخوله المدخل._

actors.mobs.spectralnecromancer.name=مستحضر أرواح طيفي
actors.mobs.spectralnecromancer.desc=رغم أن الهياكل العظمية هي أساس عمل مستحضر الأرواح، يفضل بعضهم البحث عن أتباع آخرين أقل تجسدًا. اختار مستحضرو الأرواح الطيفيون الأشباح كأتباعهم المفضلين!\n\nالأشباح الفردية ليست بقوة الهياكل العظمية، لكن هؤلاء المستحضرين لا يخافون من استدعاء عدد كبير منها!

actors.mobs.spinner.name=عنكبوت الكهف الناسج
actors.mobs.spinner.desc=تحاول عناكب الكهوف هذه، ذات الفرو الأخضر، تجنب القتال المباشر. وبدلًا من ذلك تفضل الانتظار من بعيد بينما يكافح ضحيتها داخل خيوط العنكبوت التي أفرزتها، ويموت ببطء من عضتها السامة. وهي قادرة على إطلاق شبكاتها لمسافات بعيدة، وستحاول إغلاق أي طريق يسلكه فريستها.

actors.mobs.statue.name=تمثال متحرك
actors.mobs.statue.def_verb=صدّ
actors.mobs.statue.desc=قد تظن أنه مجرد تمثال آخر غير حي من تماثيل هذه الزنزانة، لكن عيناه المتوهجتان بالأحمر تكشفان حقيقته.
actors.mobs.statue.desc_weapon=رغم أن التمثال نفسه مصنوع من الحجر، فإن الـ_%s_ الذي يحمله يبدو حقيقيًا.
actors.mobs.statue.discover_hint=يمكنك العثور على هذا العدو في أي مكان من الزنزانة.

actors.mobs.succubus.name=شيطانة إغواء
actors.mobs.succubus.desc=الشياطين الإناث مخلوقات شيطانية قادرة على تغيير شكلها وتتلاعب بعقول فرائسها. وقد اتخذت هذه هيئة مخلوق شاحب بشري الطابع ذي مظهر قوطي، ربما لجذب مستحضري الأرواح الأقزام؟\n\nقد تسحر شيطانات الإغواء عدوها مؤقتًا عند الهجوم، مما يجعل العدو غير قادر على مهاجمتها مباشرة. وعندما تهاجم شيطانة الإغواء عدوًا مسحورًا، فإنها تسرق بعضًا من طاقته الحيوية.

actors.mobs.swarm.name=سرب من الذباب
actors.mobs.swarm.desc=يطِن سرب الذباب القاتل بغضب. كل هجوم غير سحري سيقسمه إلى سربين أصغر، لكنهما بنفس الخطورة.

actors.mobs.tengu.name=تينغو
actors.mobs.tengu.notice_gotcha=أمسكت بك، %s!
actors.mobs.tengu.interesting=لنجعل الأمر ممتعًا...
actors.mobs.tengu.notice_have=أمسكت بك الآن، %s!
actors.mobs.tengu.defeated=أخيرًا أنا حر...
actors.mobs.tengu.rankings_desc=اغتاله تينغو
actors.mobs.tengu.desc=قاتل مشهور وغامض، سُمّي بهذا الاسم نسبةً إلى القناع المُلصق على وجهه.\n\nيُثبت تينغو بمشابك كبيرة عند معصميه وركبتيه، رغم أنه يبدو أنه تخلص من قيوده منذ زمن طويل.\n\nسيحاول استخدام الفخاخ والسحر الخادع والهجمات الدقيقة للقضاء على الشيء الوحيد الذي يمنع هروبه: أنت.

actors.mobs.tengu$bombability$bombblob.desc=سحابة من الدخان شديد السخونة تتصاعد هنا. احذر، ستنفجر!
actors.mobs.tengu$bombability$bombitem.name=قنبلة دخان
actors.mobs.tengu$bombability$bombitem.cant_pickup=إنها عالقة في الأرض، لا يمكنك تحريكها!
actors.mobs.tengu$bombability$bombitem.desc=ألقى تينغو قنبلة دخان غريبة الشكل هنا، وهي تطلق دخانًا ساخنًا كثيفًا. وتصدر صوت تكتكة مرتفعًا، كما لو كانت تعد تنازليًا حتى الانفجار!\n\nثبتت القنبلة نفسها بالأرض، لذا لا يمكنك التقاطها.

actors.mobs.tengu$fireability$fireblob.desc=ألقى تينغو مسحوقًا ناعمًا يبدو أنه يتحول إلى بخار هنا، وسرعان ما سيشتعل!

actors.mobs.tengu$shockerability$shockerblob.desc=تتجمع الطاقة الكهربائية هنا، وأي شيء يقف على هذه البلاطة سيتعرض للصعق في الدور التالي!
actors.mobs.tengu$shockerability$shockeritem.name=الصعّاق
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=إنه يطلق قدرًا هائلًا من الكهرباء، لا يمكنك الإمساك به!
actors.mobs.tengu$shockerability$shockeritem.desc=ألقى تينغو آلة غريبة هنا، ويبدو أنها مصنوعة من أجزاء DM-100. تطلق الآلة الكهرباء باستمرار حولها، لكن يبدو أنها تتحرك في نمط يمكن التنبؤ به.\n\nمع كل هذه الكهرباء المتدفقة حولها، لا توجد طريقة يمكنك بها التقاطها.

actors.mobs.thief.name=لص مجنون
actors.mobs.thief.stole=سرق اللص %s منك!
actors.mobs.thief.carries=\n\nيحمل اللص _%s._ مسروق بالطبع.
actors.mobs.thief.escapes=يفلت اللص ومعه %s الخاص بك!
actors.mobs.thief.desc=رغم أن هؤلاء السجناء يتجولون بحرية خارج زنازينهم، فلا يزال هذا المكان سجنهم. وبمرور الوقت، سلب هذا المكان عقولهم كما سلب حريتهم. منذ زمن طويل، نسي هؤلاء اللصوص وقطاع الطرق المجانين من هم ولماذا يسرقون.\n\nمن المرجح أن تسرق هذه الأعداء وتهرب بدلًا من القتال. احرص على إبقائهم تحت أنظارك، وإلا فقد لا ترى غرضك المسروق مرة أخرى.

actors.mobs.tormentedspirit.name=روح معذبة
actors.mobs.tormentedspirit.desc=الأرواح المعذبة أرواح حسنة الطبع في الأصل، لكنها أُصيبت بلعنة. وطالما هي ملعونة ستهاجم تمامًا مثل الشبح، كما أنها أقوى أيضًا!\n\nقد يكون من الممكن تطهير اللعنة باستخدام العنصر المناسب أثناء الوقوف بجوار الروح. وإذا رُفعت اللعنة، فستكون الروح ممتنة لك بالتأكيد...
actors.mobs.tormentedspirit.thank_you=شكرًا لك...

actors.mobs.vaultrat.desc=هذا الجرذ يمتلك بعض التغييرات السلوكية لاختبار ذكاء اصطناعي جديد لأعداء الخزينة:\n_-_ يمكن «سماع» حركته عبر الجدران\n_-_ سيتجول وفق دورية محددة مسبقًا\n_-_ أثناء التجول، ينخفض مدى اكتشافه بشكل كبير خلف الاتجاه الذي يتحرك نحوه.\n_-_ أثناء النوم، ينخفض مدى اكتشافه أيضًا\n_-_ عندما يكتشفك سيقوم «بالتحقيق» أولًا قبل التحول إلى المطاردة. الأعداء الذين يحققون يتحركون نحوك لكنهم لا يهاجمون، ويصبح من الأسهل فقدانهم خلف الأبواب والزوايا.

actors.mobs.npcs.vaultsentry.name=حارس فحص الخزينة
actors.mobs.npcs.vaultsentry.desc=يقوم هذا الحارس بفحص المنطقة وفق نمط محدد. _وبما أن هذه مجرد منطقة اختبار، فلن يفعل الحارس شيئًا إذا اكتشفك._

actors.mobs.npcs.vaultlaser.name=حارس ليزر الخزينة
actors.mobs.npcs.vaultlaser.desc=يطلق هذا الحارس أشعة ليزر على فترات منتظمة. _وبما أن هذه مجرد منطقة اختبار، فلن تؤذيك أشعة الليزر فعليًا._

actors.mobs.warlock.name=ساحر أقزامي
actors.mobs.warlock.bolt_kill=قتلتك صاعقة الظل...
actors.mobs.warlock.desc=عندما تحولت اهتمامات الأقزام من الهندسة إلى الفنون الغامضة، وصل السحرة إلى السلطة في المدينة. بدأوا بالسحر العنصري، لكنهم تحولوا سريعًا إلى علم الشياطين واستحضار الأرواح. أقوى هؤلاء السحرة استولى على عرش مدينة الأقزام، وسُمح لأتباعه بمواصلة ممارسة سحرهم المظلم، ما داموا يتخلون عن إرادتهم الحرة له.\n\nيمتلك هؤلاء السحرة سحرًا قويًا يعيق الخصوم، وهم قادرون على إضعاف تأثير سحر الترقية المطبق على معداتك مؤقتًا. وكلما كان العنصر أكثر ترقية، كان تأثره أقوى.

actors.mobs.wraith.name=شبح
actors.mobs.wraith.desc=الشبح روح انتقامية لخاطئ، وقد تم العبث بقبره أو ضريحه. وباعتباره كيانًا أثيريًا، فمن الصعب جدًا إصابته بسلاح عادي.
actors.mobs.wraith.discover_hint=يمكنك العثور على هذا العدو في أي مكان من الزنزانة.

actors.mobs.yogdzewa.name=يوغ-ديزوا
actors.mobs.yogdzewa.notice=أنا. أراك.
actors.mobs.yogdzewa.darkness=الظلام يقترب أكثر...
actors.mobs.yogdzewa.hope=أملك. مجرد. وهم!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=افترسه يوغ-ديزوا
actors.mobs.yogdzewa.desc=يوغ-ديزوا إله قديم؛ وحش هائل يمتد إلى عوالم الفانين ويلتهمها لتغذية نموه اللامتناهي. لا بد أن الأقزام جذبوا انتباه هذا الرعب الكوني أثناء عبثهم بالسحر المظلم، ومنذ ذلك الحين وهم يحاولون إبقاءه محتوى.\n\nينحدر يوغ-ديزوا من بُعد من الفوضى السحرية الخالصة، ولا يستطيع إدخال شكله الحقيقي إلى هذا العالم. وبدلًا من ذلك صنع صورًا رمزية واستدعى أتباعًا شياطين لينفذوا إرادته هنا.\n\nهذه العين العملاقة هي مركز قوة يوغ-ديزوا في هذا العالم. ورغم أن العين نفسها غير متحركة، فإنها قادرة على إطلاق أشعة قوية من السحر الشيطاني واستدعاء مجموعة متنوعة من الأتباع لمساعدتها.
actors.mobs.yogdzewa.desc_spawners=يمكنك الشعور بموجات من الطاقة الشيطانية تشع نحو العين من الطوابق العليا. لا بد أن شيئًا تركته حيًا في الأعلى يمرر الطاقة مجددًا إلى يوغ-ديزوا. _سيستخدم يوغ هذه الطاقة لاستدعاء أتباع أكثر قوة!_
actors.mobs.yogdzewa$larva.name=يرقة الإله
actors.mobs.yogdzewa$larva.rankings_desc=افترسها يوغ-ديزوا
actors.mobs.yogdzewa$larva.desc=هذه الكائنات الصغيرة المتولدة من يوغ-ديزوا أتباع بسيطون يسهل إنتاجهم. ورغم ضعفهم فرادى، يُستدعون بسرعة ويمكن أن يصبحوا طاغين عند أعداد كبيرة.
actors.mobs.yogdzewa$yogripper.rankings_desc=افترسه يوغ-ديزوا
actors.mobs.yogdzewa$yogeye.rankings_desc=افترسه يوغ-ديزوا
actors.mobs.yogdzewa$yogscorpio.rankings_desc=افترسه يوغ-ديزوا

actors.mobs.yogfist.invuln_warn=قبضة يوغ منيعة عندما تكون قريبة من العين!
actors.mobs.yogfist.rankings_desc=افترسها يوغ-ديزوا
actors.mobs.yogfist.desc=هذه القبضة مظهر من مظاهر قوة يوغ-ديزوا. ترتبط القلوب بقوة يوغ-ديزوا، وستكون محمية من جميع الأضرار عندما تكون قريبة من العين.
actors.mobs.yogfist$burningfist.name=قبضة مشتعلة
actors.mobs.yogfist$burningfist.desc=تتشكل هذه القبضة من سحر ناري فوضوي. وأثناء تحركها، تشعل باستمرار التضاريس من حولها. كما أنها قادرة على إطلاق انفجارات من القوة النارية، تنشر اللهب حيث تصطدم.\n\nيُقمع تأثير القبضة في نشر اللهب عندما تكون قرب الماء، لكن حرارتها شديدة لدرجة أن أي ماء حولها سيتبخر بعد فترة قصيرة!
actors.mobs.yogfist$soiledfist.name=قبضة ترابية
actors.mobs.yogfist$soiledfist.desc=تتشكل هذه القبضة من سحر ترابي فوضوي. وأثناء تحركها، تتسبب باستمرار في نمو النباتات حولها. ويمكنها أيضًا إطلاق انفجارات ترابية مركزة تُحاصر هدفها بكروم وجذور سريعة النمو!\n\nتستمد القبضة قوتها من هذه النباتات، وستقاوم الضرر بناءً على كمية النباتات الطويلة أو المحروثة القريبة منها!
actors.mobs.yogfist$rottingfist.name=قبضة متعفنة
actors.mobs.yogfist$rottingfist.desc=تتشكل هذه القبضة من فساد حي. إنها كتلة شاهقة من اللحم المتحلل، ويمكنها نشر الوحل الأكّال في القتال القريب والغاز السام من مسافة بعيدة. والأسوأ من ذلك أن كتلتها الهائلة تجعلها تنزف بدلًا من تلقي الضرر مباشرة.\n\nيمكن استخدام الماء لغسل الوحل عنها، لكن القبضة قادرة أيضًا على امتصاص الماء لشفاء نفسها! بالإضافة إلى ذلك، فإن إلحاق الضرر بالقبضة أثناء نزفها سيؤدي إلى تجديد النزيف، لكنه لن يتراكم!
actors.mobs.yogfist$rustedfist.name=قبضة صدئة
actors.mobs.yogfist$rustedfist.desc=تتشكل هذه القبضة من معدن حي. إنها كتلة شاهقة من المعدن المتغير، تمتلك هجمات قريبة قوية، ويمكنها إعاقة أهدافها من مسافة بعيدة. وبسبب كتلتها الهائلة، ستتلقى القبضة أي ضرر يلحق بها على مدار الوقت بدلًا من تلقيه فورًا.\n\nلكن القبضة غير مرنة، ولا تستطيع التحرك عبر الممرات الضيقة. وبالإضافة إلى أنها تتلقى الضرر ببطء، فإن الضرر المؤجل سيستمر في الازدياد إذا تلقت القبضة عدة ضربات.
actors.mobs.yogfist$brightfist.name=قبضة مضيئة
actors.mobs.yogfist$brightfist.teleport=تنتقل القبضة آنيًا بعيدًا في ومضة ضوئية تعميك بشدة!
actors.mobs.yogfist$brightfist.desc=تتشكل هذه القبضة من طاقة ضوئية خالصة. وهي قادرة على إطلاق أشعة قوية من الضوء الحارق في كل دور! ستصيبك هذه الأشعة بالعمى مؤقتًا بالإضافة إلى إلحاق ضرر كبير. كما أن القبضة قادرة على إغراق الساحة بالضوء المسبب للعمى لفترة قصيرة من أجل الهرب!\n\nلكن لا تمتلك القبضة أي قدرات خاصة يمكنها استخدامها في القتال القريب.
actors.mobs.yogfist$darkfist.name=قبضة مظلمة
actors.mobs.yogfist$darkfist.teleport=تنتقل القبضة آنيًا بعيدًا في انفجار من الظلام يطفئ مصدر ضوئك!
actors.mobs.yogfist$darkfist.desc=تتشكل هذه القبضة من طاقة مظلمة خالصة. وهي قادرة على إطلاق انفجارات قوية من السحر المظلم في كل دور! ستضعف هذه الانفجارات مصدر ضوئك بالإضافة إلى إلحاق ضرر كبير. كما أن القبضة قادرة على إغراق الساحة بالظلام لفترة قصيرة من أجل الهرب!\n\nلكن لا تمتلك القبضة أي قدرات خاصة يمكنها استخدامها في القتال القريب.

