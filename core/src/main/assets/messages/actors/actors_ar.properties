actors.hero.talent$swiftequipcooldown.desc=استخدمت هذه الموهبة مؤخرًا، وعليك الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
actors.hero.talent$preciseassaulttracker.name=هجوم دقيق
actors.hero.talent$preciseassaulttracker.desc=ستحصل ضربة المبارزة القريبة التالية على دقة إضافية.\n\nالأدوار المتبقية: %s.
actors.hero.talent$deadlyfollowuptracker.name=متابعة مميتة
actors.hero.talent$deadlyfollowuptracker.desc=هاجمت المبارزة عدوًا مؤخرًا بسلاح مرمي، وستلحق هجماتها القريبة ضد الهدف نفسه ضررًا إضافيًا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=تم الإعدام
