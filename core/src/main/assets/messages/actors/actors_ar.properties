actors.blobs.confusiongas.desc=A سحابة of غاز التشويش is swirling هنا.

actors.blobs.electricity.name=الكهرباء
actors.blobs.electricity.desc=A field of الكهرباء is sparking brightly هنا.
actors.blobs.electricity.rankings_desc=صعق بالكهرباء
actors.blobs.electricity.ondeath=أنت were shocked to موت...

actors.blobs.fire.name=نار
actors.blobs.fire.desc=A نار is raging هنا.

actors.blobs.foliage.name=نباتات
actors.blobs.foliage.desc=Shafts of ضوء pierce the gloom of the underground garden.

actors.blobs.freezing.name=هواء متجمد
actors.blobs.freezing.desc=The air is unnaturally frigid هنا.

actors.blobs.goowarn.name=طاقة مظلمة
actors.blobs.goowarn.desc=Specks of طاقة مظلمة are swarming هنا!

actors.blobs.inferno.name=جحيم
actors.blobs.inferno.desc=An جحيم is raging هنا.

actors.blobs.paralyticgas.name=غاز مشل
actors.blobs.paralyticgas.desc=A سحابة of غاز مشل is swirling هنا.

actors.blobs.regrowth.name=نمو متجدد

actors.blobs.sacrificialfire.name=نار القرابين
actors.blobs.sacrificialfire.desc=يوجد an مذبح هنا مع a نار القرابين احتراق atop it. Any مخلوق ذلك's قُتل هنا سيكون consumed as an offering إلى spirits of الزنزانة.\n\nربما a مكافأة سيكون given if enough sacrifices are مصنوع?
actors.blobs.sacrificialfire.worthy=The نار consumes خاصتك offering and grows stronger.
actors.blobs.sacrificialfire.unworthy=The نار consumes خاصتك offering, but لا change.
actors.blobs.sacrificialfire.reward=The نار flares and then dissipates, leaving a مكافأة behind!

actors.blobs.smokescreen.name=ستار دخاني
actors.blobs.smokescreen.desc=A سحابة of سميك أسود smoke is swirling هنا.

actors.blobs.stenchgas.name=غاز كريه
actors.blobs.stenchgas.desc=A سحابة of fetid stench is swirling هنا.

actors.blobs.stormcloud.name=سحب عاصفة
actors.blobs.stormcloud.desc=A سحابة of billowing ماء vapor is swirling هنا.

actors.blobs.toxicgas.name=الغاز السام
actors.blobs.toxicgas.desc=A greenish سحابة of الغاز السام is swirling هنا.
actors.blobs.toxicgas.rankings_desc=Suffocated
actors.blobs.toxicgas.ondeath=أنت مات من the الغاز السام...

actors.blobs.corrosivegas.name=آكل gas
actors.blobs.corrosivegas.desc=A سحابة of قاتل كاوٍ gas is swirling هنا.

actors.blobs.waterofawareness.name=ماء of awareness
actors.blobs.waterofawareness.procced=As أنت take a sip, أنت feel knowledge pour إلى خاصتك mind.
actors.blobs.waterofawareness.desc=قوة of knowledge radiates من the ماء of هذا بئر. Drinking من the بئر سوف fully تعرّف all مجهّز عناصر, تعرّف اللعنات on جميع العناصر in خاصتك الحقيبة, and reveal جميع العناصر on the current طابق.

actors.blobs.waterofhealth.name=ماء of صحة
actors.blobs.waterofhealth.procced=As أنت take a sip, أنت feel خاصتك wounds شفاء completely.
actors.blobs.waterofhealth.desc=قوة of صحة radiates من the ماء of هذا بئر. Drinking من هذا بئر سوف شفاء خاصتك wounds, satisfy جوع, and cleanse اللعنات on any worn عناصر.

actors.blobs.web.name=عنكبوت web
actors.blobs.web.desc=A سميك web is covering everything هنا. Anything ذلك touches or is مقذوف عبر the web سوف يكسر it, but سوف also be stuck in place.



###buffs
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenaline.desc=A surge of جسدي قوة, adrenaline enhanced both هجوم and movement speed.\n\nAdrenaline يسمح its هدف to لعبة at 2x speed, and هجوم at 1.5x speed.\n\nأدوار remaining: %s.

actors.buffs.adrenalinesurge.name=قوة boost
actors.buffs.adrenalinesurge.desc=A surge of عظيم might, but sadly not permanent.\n\nقوة boost: +%d.\nأدوار until boost weakens: %s.

actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok يسبب a state of عظيم rage and تشويش in its هدف.\n\nعندما a مخلوق is amoked, هم سوف هجوم whatever is بالقرب من them, whether هم be friend or foe.\n\nأدوار of amok remaining: %s.

actors.buffs.arcanearmor.name=arcane درع
actors.buffs.arcanearmor.desc=A رقيق درع is المحيط أنت, حجب some of the ضرر من سحري هجمات.\n\nخاصتك سحري درع is currently boosted by: 0-%d.\n\nأدوار until arcane درع weakens: %s.

actors.buffs.artifactrecharge.name=أثر إعادة الشحن
actors.buffs.artifactrecharge.desc=طاقة is coursing عبر أنت, increasing the rate خاصتك مجهّز الآثار اشحن.\n\nEach أثر is affected قليلًا differently, but هم سوف all يكتسب اشحن much faster than عادي.\n\nأدوار remaining: %s.

actors.buffs.ascensionchallenge.name=تميمة's لعنة
actors.buffs.ascensionchallenge.desc=Somehow يوغ-دزيفا is maintaining influence on هذا العالم عبر the تميمة, and is trying to stop خاصتك ascent!\n\nYog's قوة is making الزنزانة much more خطير, increasing the number of أعداء and making them stronger! هذا قوة سوف keep building if يسار unchecked, it يمكن أن يكون weakened by defeating أعداء ذلك لديك been enhanced by Yog's قوة.
actors.buffs.ascensionchallenge.desc_clear=The طاقة مظلمة radiating من the تميمة تم weakened as much as possible for now.
actors.buffs.ascensionchallenge.desc_beckon=The تميمة is currently _calling out to distant enemies,_ alerting them to خاصتك position.
actors.buffs.ascensionchallenge.desc_haste=The تميمة is currently _hastening distant enemies,_ letting them reach أنت faster!
actors.buffs.ascensionchallenge.desc_slow=The تميمة is currently _slowing you down,_ and negating speed boosting تأثيرات!
actors.buffs.ascensionchallenge.desc_damage=The طاقة من the تميمة لديه gotten so قوي ذلك إنه _directly harming you!_
actors.buffs.ascensionchallenge.beckon=The تميمة begins calling out to distant أعداء.
actors.buffs.ascensionchallenge.haste=The تميمة begins hastening distant أعداء!
actors.buffs.ascensionchallenge.slow=The تميمة starts to feel like a lead weight in خاصتك الحقيبة!
actors.buffs.ascensionchallenge.damage=The تميمة begins radiating طاقة مظلمة. It burns!
actors.buffs.ascensionchallenge.weaken_info=The تميمة's لعنة يمكن أن يكون weakened by defeating more أعداء.
actors.buffs.ascensionchallenge.weaken_info_no_kills=If أنت اهزم أعداء the تميمة's لعنة سوف weaken!
actors.buffs.ascensionchallenge.weaken=أنت يمكن feel the تميمة's لعنة weaken slightly.
actors.buffs.ascensionchallenge.break=أنت take a moment to catch خاصتك breath and feel خاصتك wounds begin to close!
actors.buffs.ascensionchallenge.almost=أنت feel Yog's grip on the تميمة begin to weaken, أنت're almost هناك!
actors.buffs.ascensionchallenge.on_kill=The طاقة مظلمة consumes أنت...

actors.buffs.barkskin.name=barkskin
actors.buffs.barkskin.desc=خاصتك skin is hardened, it يشعر rough and صلب like bark.\n\nThe hardened skin يزيد خاصتك effective درع, allowing أنت to better defend aيحصل علىt جسدي هجوم.\n\nخاصتك درع is currently increased by: 0-%d.\nأدوار until barkskin weakens: %s.\n\nIf أنت receive barkskin من multiple sources, only the strongest واحد سوف طبّق.

actors.buffs.barrier.name=barrier
actors.buffs.barrier.desc=A durable bubble of force which blocks all ضرر.\n\nThe barrier سوف take ضرر for whatever it is protecting so long as يوجد تحصين يسار. The تحصين سوف also ببطء decay فوق time.\n\nتحصين remaining: %d.

actors.buffs.berserk.angered=angered
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.exhausted=exhausted
actors.buffs.berserk.recovering=recovering
actors.buffs.berserk.angered_desc=The severity of the Berserker's injuries strengthen his blows. As the berserker takes ضرر جسدي, his rage سوف build, granting him مكافأة إضافية ضرر. ضرر which is blocked by درع still counts towards building rage.\n\nRage سوف fade فوق time. The سفلي the berserker's صحة, the longer it سوف last.\n\nAt 100%% rage, the Berserker يمكن go berserk, granting him تحصين based on المستوى of his درع and his missing صحة. بينما berserking, his تحصين decays فوق time and once it runs out he سوف لديك to rest قبل building rage again.\n\nCurrent Rage: _%1$.0f%%_\n_+%2$.0f%%_ ضرر\n\nBerserk درع at current درع and HP: _%3$d_
actors.buffs.berserk.berserk_desc=Fear and uncertainty bleed بعيدًا, leaving only anger. In هذا state the Berserker is extremely قوي, _dealing +50%% damage and gaining bonus shielding,_ but also losing تحصين every دور.\n\nعندما all of his تحصين is reduced to 0, berserking سوف end.\n\nبعد raging, the Berserker سوف تحتاج to recover قبل being able to build rage again.\n\nدرع Remaining: %d
actors.buffs.berserk.recovering_desc=Inner قوة لديه its limits. The Berserker يجب rest قبل باستخدام his rage again.\n\nبينما recovering the Berserker does not build any rage من taking ضرر.
actors.buffs.berserk.recovering_desc_turns=أدوار until reمغطى: _%d_
actors.buffs.berserk.recovering_desc_levels=مستويات until reمغطى: _%.2f_
actors.buffs.berserk.rankings_desc=Berserked to موت
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.no_seal=أنت تحتاج خاصتك مكسور seal to berserk!

actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=أنت bled to موت...
actors.buffs.bleeding.heromsg=أنت are نزيف!
actors.buffs.bleeding.rankings_desc=Bled to موت
actors.buffs.bleeding.desc=ذلك wound is leaking a worrisome amount of دم.\n\nنزيف يسبب ضرر every دور. Each دور the ضرر decreases by a عشوائي amount, until the نزيف في النهاية stops.\n\nCurrent bleed ضرر: %d.

actors.buffs.bless.name=blessed
actors.buffs.bless.desc=A عظيم burst of focus, some say it is inspired by the gods.\n\nBlessing يزيد دقة and مراوغة by 25%%, making the blessed much more effective في القتال.\n\nأدوار of bless remaining: %s.

actors.buffs.blindness.name=blinded
actors.buffs.blindness.heromsg=أنت are blinded!
actors.buffs.blindness.desc=Blinding أدوار the المحيط العالم إلى a مظلم haze.\n\nبينما blinded, a شخصية's vision range is reduced to واحد tile, rendering بعيد المدى هجمات useless and making it very سهل to يفقد track of distant أعداء. Additionally, a blinded بطل is unable to read لفائف or books.\n\nأدوار of عمى remaining: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=احتراق
actors.buffs.burning.heromsg=أنت catch نار!
actors.buffs.burning.burnsup=%s burns up!
actors.buffs.burning.ondeath=أنت burned to موت...
actors.buffs.burning.rankings_desc=Burned to Ash
actors.buffs.burning.desc=Few things are more distressing than being engulfed in لهيب.\n\nنار سوف صفقة ضرر every دور until it is put out by ماء or it expires. نار يمكن أن يكون extinguished by stepping إلى ماء, or من the splash of a shattering جرعة.\n\nAdditionally, the نار may ignite flammable terrain or عناصر ذلك it comes إلى contact مع.\n\nأدوار of احتراق remaining: %s.

actors.buffs.championenemy.warn=أنت sense a قاتل presence.
actors.buffs.championenemy$blazing.name=blazing champion
actors.buffs.championenemy$blazing.desc=Blazing champions صفقة 25% more ضرر اشتباك, ignite أعداء هم هجوم, are محصن to نار, and spread نار حول them as هم يموت. هم لا يستطيع spread نار onto ماء لكن.
actors.buffs.championenemy$projecting.name=projecting champion
actors.buffs.championenemy$projecting.desc=Projecting champions صفقة 25% more ضرر اشتباك and لديك +3 هجوم range.
actors.buffs.championenemy$antimagic.name=antimagic champion
actors.buffs.championenemy$antimagic.desc=Antimagic champions take 50% less ضرر and are completely محصن to سحري تأثيرات.
actors.buffs.championenemy$giant.name=عملاق champion
actors.buffs.championenemy$giant.desc=عملاق champions take 80% less ضرر and لديك +1 هجوم range, but لا يمكن تحرك عبر enclosed spaces.
actors.buffs.championenemy$blessed.name=blessed champion
actors.buffs.championenemy$blessed.desc=Blessed champions لديك 4x دقة and مراوغة.
actors.buffs.championenemy$growing.name=growing champion
actors.buffs.championenemy$growing.desc=Growing champions يكتسب a steadily increasing مكافأة إضافية to دقة, مراوغة, ضرر جسدي, and a reduction to ضرر taken.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent ضرر reduction: %2$d%%

actors.buffs.charm.name=charmed
actors.buffs.charm.heromsg=أنت are charmed!
actors.buffs.charm.cant_attack=أنت are charmed by ذلك عدو and لا يستطيع هجوم them.
actors.buffs.charm.desc=A charm is manipulative سحر ذلك يمكن make أعداء مؤقتًا adore each other.\n\nشخصيات affected by charm are unable to directly هجوم the عدو هم are charmed by. Attacking other targets is still possible لكن. The shock of pain سوف lessen the مدة of charm.\n\nأدوار of charm remaining: %s.

actors.buffs.chill.name=chilled
actors.buffs.chill.freezes=%s freezes!
actors.buffs.chill.desc=Not quite frozen, but still much too cold.\n\nChilled targets perform all actions more ببطء, depending on how many أدوار are يسار in the تأثير. At its worst, هذا is equivalent to being slowed.\n\nأدوار of chill remaining: %1$s.\nSpeed is reduced by: %2$s%%

actors.buffs.combo.name=combo
actors.buffs.combo.action_name=combo هجوم
actors.buffs.combo.combo=%d يضرب combo!
actors.buffs.combo.bad_target=أنت يجب هدف an عدو in هجوم range.
actors.buffs.combo.prompt=اختر a هدف to هجوم.
actors.buffs.combo.desc=The gladiator builds momentum as he lands successful blows. Each هجوم يزيد the combo counter by واحد, but taking too long between hits سوف reset the combo counter to 0. بينما the gladiator لديه combo any تحصين he لديه من his مكسور seal سوف not start to fade.\n\nBuilding combo unlocks خاص combo هجمات ذلك لا يمكن miss! A different هجوم is unlocked at 2, 4, 6, 8, and 10 combo count. Some يتحرك reset combo and some do not, but each تحرك يمكن only be يُستخدم once per combo session.\n\nCurrent combo: %1$d.\n\nأدوار until Combo is فقد: %2$s.
actors.buffs.combo$combomove.clobber.name=clobber
actors.buffs.combo$combomove.clobber.desc=Knocks an عدو للخلف 2 tiles, but يسبب لا ضرر and لا يمكن knock إلى pits. Increments combo by 1.
actors.buffs.combo$combomove.clobber.empower_desc=Knocks an عدو للخلف _3 tiles, inflicts vertigo, and can knock into pits,_ but يسبب لا ضرر. Increments combo by 1.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo$combomove.slam.desc=يسبب %d%% (combo*20%%) of خاصتك ضرر حجب قوة as مكافأة إضافية ضرر. Resets combo عندما يُستخدم.
actors.buffs.combo$combomove.slam.empower_desc=_Leaps up to %1$d tile(s)_ and يسبب %2$d%% (combo*20%%) of خاصتك ضرر حجب قوة as مكافأة إضافية ضرر. Resets combo عندما يُستخدم.
actors.buffs.combo$combomove.parry.name=parry
actors.buffs.combo$combomove.parry.desc=Blocks the next هجوم داخل 1 دور عند تفعيله, and فورًا retaliates to it. Resets combo if لا شيء is parried.
actors.buffs.combo$combomove.parry.empower_desc=Blocks _all attacks_ داخل 1 دور عند تفعيله, and فورًا retaliates إلىm. Resets combo if لا شيء is parried.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.crush.desc=يسبب %d%% (combo*25%%) ضرر إلى primary هدف, and half ذلك ضرر to all other أعداء in a 7x7 AOE. Resets combo عندما يُستخدم.
actors.buffs.combo$combomove.crush.empower_desc=_Leaps up to %1$d tile(s)_ and يسبب %2$d%% (combo*25%%) ضرر إلى primary هدف, and half ذلك ضرر to all other أعداء in a 7x7 AOE. Resets combo عندما يُستخدم.
actors.buffs.combo$combomove.fury.name=fury
actors.buffs.combo$combomove.fury.desc=Hits an عدو once for each combo أنت لديك, each يضرب يسبب 60% ضرر and يمكن trigger enchantments. Resets combo عندما يُستخدم.
actors.buffs.combo$combomove.fury.empower_desc=_Leaps up to %d tile(s)_ and hits an عدو once for each combo أنت لديك, each يضرب يسبب 60%% ضرر and يمكن trigger enchantments. Resets combo عندما يُستخدم.

actors.buffs.corruption.name=corrupted
actors.buffs.corruption.desc=Corruption seeps إلى essence of a being, twisting them aيحصل علىt الخاص بهم former الطبيعة.\n\nCorrupted مخلوقات سوف هجوم الخاص بهم حلفاء, and ignore الخاص بهم former أعداء. Corruption is damaging أيضًا, and سوف ببطء cause its هدف to succumb.\n\nCorruption is permanent, its تأثيرات only end in موت.

actors.buffs.cripple.name=crippled
actors.buffs.cripple.heromsg=أنت are crippled!
actors.buffs.cripple.desc=أنت're pretty sure legs aren't meant to bend ذلك way.\n\nCrippled halves movement speed, making يتحرك a tile عادةً take اثنان أدوار بدلًا من واحد.\n\nأدوار of cripple remaining: %s.

actors.buffs.daze.name=dazed
actors.buffs.daze.heromsg=أنت are dazed!
actors.buffs.daze.desc=Ringing ears and blurred vision make it difficult to fight.\n\nبينما dazed, دقة and مراوغة are reduced by 50%%, making both landing and evading blows much harder.\n\nأدوار of daze remaining: %s.

actors.buffs.degrade.name=degraded
actors.buffs.degrade.heromsg=خاصتك معدات يشعر weaker!
actors.buffs.degrade.desc=قوي مظلم سحر is sapping the قوة ذلك لفائف of ترقية لديك مطبّق to خاصتك معدات!\n\nبينما degraded, مُرقّى gear سيكون treated as if it is a مستوى أدنى than it actually is. _Every upgrade after +3 becomes exponentially weaker than the last one._ The descriptions of خاصتك عناصر سوف change to reflect الخاص بهم reduced قوة مستوى.\n\nDegradation does not affect قوة requirements, عصا سحرية شحنات, durability of مقذوف أسلحة, or الآثار.\n\nأدوار of degradation remaining: %s. باستخدام a لفافة of ترقية or يزيل لعنة سوف end degradation immediately.

actors.buffs.doom.name=doomed
actors.buffs.doom.desc=إنه صعب to keep going عندما it يبدو like the الكون wants أنت dead.\n\nDoomed شخصيات سوف receive +67% ضرر من all sources.\n\nDoom is permanent, its تأثيرات only end in موت.

actors.buffs.dread.name=dread
actors.buffs.dread.desc=A terror so عظيم ذلك it سوف cause its هدف to flee الزنزانة entirely!\n\nمخلوقات affected by dread سوف لعبة من الخاص بهم opponent at high speed, and سوف disappear من الزنزانة entirely once هم are out of sight. أعداء ذلك are مهزوم هذا way award half خبرة and drop لا عناصر. The shock of pain سوف lessen the مدة of dread.\n\nأدوار of dread remaining: %d.

actors.buffs.drowsy.name=drowsy
actors.buffs.drowsy.desc=A سحري force is making it difficult to stay awake, بعد a few أدوار, the هدف سوف سقوط إلى a عميق سحري sleep.\n\nالبطل يمكن resist drowsiness by taking ضرر or by being at full صحة.\n\nأدوار until sleep: %s.

actors.buffs.earthimbue.name=imbued مع earth
actors.buffs.earthimbue.desc=أنت are imbued مع قوة of earth!\n\nAll جسدي هجمات سوف shift the earth تحت the عدو, crippling them لفترة قصيرة.\n\nأدوار of earth imbue remaining: %s.

actors.buffs.enhancedrings.name=enhanced خواتم
actors.buffs.enhancedrings.desc=The لص's recently يُستخدم أثر is empowering his خواتم, granting them +1 مستوى.\n\nأدوار remaining: %s.

actors.buffs.fireimbue.name=imbued مع نار
actors.buffs.fireimbue.desc=أنت are imbued مع قوة of نار!\n\nAll جسدي هجمات سوف لديك a احتمال to ضوء أعداء ablaze. Additionally, أنت are completely محصن إلى تأثيرات of نار.\n\nأدوار of نار imbue remaining: %s.

actors.buffs.foresight.name=foresight
actors.buffs.foresight.desc=أنت are somehow able to see the layout of المحيط terrain مع خاصتك mind.\n\nبينما تحت the تأثير of foresight all tiles in a wide radius are revealed to أنت, including any سري أفخاخ or doors.\n\nأدوار of foresight remaining: %s.

actors.buffs.frost.name=frozen
actors.buffs.frost.freezes=%s freezes!
actors.buffs.frost.desc=Not to be confيُستخدم مع تجميد صلب, هذا more benign تجميد simply encases the هدف in جليد.\n\nتجميد acts similarly to شلل, making it impossible for the هدف to act. Unlike شلل, تجميد is immediately cancelled if the هدف takes ضرر, as the جليد سوف shatter.\n\nأدوار of freeze remaining: %s.

actors.buffs.frostimbue.name=imbued مع صقيع
actors.buffs.frostimbue.desc=أنت are imbued مع icy قوة!\n\nAll جسدي هجمات سوف steadily stack chill on أعداء. Additionally, أنت are completely محصن إلى cold.\n\nأدوار of صقيع imbue remaining: %s.

actors.buffs.fury.name=furious
actors.buffs.fury.heromsg=أنت become furious!
actors.buffs.fury.desc=أنت are angry, أعداء لن like أنت عندما أنت're angry.\n\nA عظيم rage burns داخل أنت, increasing the ضرر أنت صفقة مع جسدي هجمات by 50%%.\n\nهذا rage سوف last as long as أنت are injured أسفل 50%% صحة.

actors.buffs.blobimmunity.name=purification barrier
actors.buffs.blobimmunity.desc=Some غريب force is encasing أنت in a رقيق protective barrier, حجب out all harmful airborne تأثيرات.\n\nأنت are محصن to all area-bound تأثيرات بينما هذا barrier lasts.\n\nأدوار of مناعة remaining: %s.

actors.buffs.gravitychaostracker.name=gravity chaos
actors.buffs.gravitychaostracker.desc_intro=Every few أدوار all شخصيات on the current الزنزانة طابق سيكون مقذوف in a عشوائي direction.
actors.buffs.gravitychaostracker.desc_positive=أنت and خاصتك حلفاء seem to be محصن though.
actors.buffs.gravitychaostracker.desc_duration=إنه not clear how long the تأثير سوف last for, but it لا يستطيع last forever.

actors.buffs.greaterhaste.name=greater سرعة
actors.buffs.greaterhaste.desc=An incredible boost of speed, for a moment it يشعر as if everything else is واقف still.\n\nبينما تحت the تأثيرات of greater سرعة يتحرك actions take لا time at all, but other actions are still performed at عادي speed. Each خطوة of movement consumes a دور of greater سرعة.\n\nأدوار of greater سرعة remaining: %d.

actors.buffs.haste.name=سرعة
actors.buffs.haste.desc=طاقة courses عبر خاصتك muscles, allowing أنت to لعبة at incredible speeds!\n\nبينما تحت the تأثيرات of سرعة أنت سوف لعبة at 3x speed, but سوف perform all other actions at عادي speed.\n\nأدوار of سرعة remaining: %s.

actors.buffs.healing.name=علاج
actors.buffs.healing.desc=A سحري remedy is مسببًا wounds to close and flesh to knit.\n\nEvery دور صحة سوف steadily regenerate until the تأثير العلاج expires. The amount of علاج may fade فوق time.\n\nNext شفاء: %d.\n\nعلاج remaining: %d.

actors.buffs.herodisguise.name=disguise
actors.buffs.herodisguise.desc=Illusory سحر لديه altered خاصتك جسدي appearance! The تأثير is purely cosmetic, but يشعر very غريب regardless.\n\nأدوار of disguise remaining: %s.

actors.buffs.hex.name=hexed
actors.buffs.hex.heromsg=أنت لديك been hexed!
actors.buffs.hex.desc=مظلم سحر which saps focus, making the هدف slightly disoriented.\n\nHexing يقلل دقة and مراوغة by 20%%, making the هدف less effective في القتال.\n\nأدوار of hex remaining: %s.

actors.buffs.holdfast.name=hold fast
actors.buffs.holdfast.desc=The محارب is holding his position, increasing his درع by %1$d-%2$d and إبطاء the decay rate of some التعزيزات by %3$d%%. هذا سوف last until he يتحرك.

actors.buffs.hunger.hungry=hungry
actors.buffs.hunger.starving=starving
actors.buffs.hunger.onhungry=أنت are hungry.
actors.buffs.hunger.onstarving=أنت are starving!
actors.buffs.hunger.ondeath=أنت starved to موت...
actors.buffs.hunger.cursedhorn=The ملعون horn steals some of the طعام طاقة as أنت كل.
actors.buffs.hunger.rankings_desc=Starved to موت
actors.buffs.hunger.desc_intro_hungry=أنت يمكن feel خاصتك stomach calling out for طعام, but إنه not too urgent yet.
actors.buffs.hunger.desc_intro_starving=أنت're so hungry it hurts.
actors.buffs.hunger.desc=\n\nجوع ببطء يزيد as أنت spend time في الزنزانة, في النهاية أنت سوف begin to starve. بينما starving أنت سوف ببطء يفقد صحة بدلًا من regenerating it.\n\nRationing is important! If أنت لديك صحة to spare starving ليس a bad idea if it means هناك سيكون more طعام later. Effective rationing يمكن make طعام last كثيرًا longer!

actors.buffs.invisibility.name=inمرئي
actors.buffs.invisibility.desc=أنت are completely blended إلى المحيط terrain, making أنت impossible to see.\n\nبينما أنت are inمرئي أعداء are unable to هجوم or follow أنت. جسدي هجمات and سحري تأثيرات (such as لفائف and عصي سحرية) سوف immediately cancel اختفاء.\n\nأدوار of اختفاء remaining: %s.

actors.buffs.invulnerability.name=invulnerable
actors.buffs.invulnerability.desc=هذا شخصية is suffيُستخدم مع عظيم protective قوة, granting them a brief period of invulnerability!\n\nأدوار remaining: %s.

actors.buffs.levitation.name=levitating
actors.buffs.levitation.desc=A سحري force is levitating أنت فوق the ground, making أنت feel weightless.\n\nLevitating شخصيات تحرك silently and ignore all ground-based تأثيرات. أفخاخ لن trigger, ماء لن put out نار, نباتات لن be trampled, roots سوف miss, and pits سيكون hovered فوق. Be careful, as all هذه things يمكن come إلى تأثير the الثاني the levitation ends!\n\nأدوار of levitation remaining: %s.

actors.buffs.lifelink.name=life link
actors.buffs.lifelink.ondeath=The life linked ضرر قُتل أنت...
actors.buffs.lifelink.desc=هذا شخصية's life force is linked to another شخصية بالقرب. Any ضرر taken is shared between them.\n\nWheأبدًا هذا شخصية takes ضرر, half of it سيكون dealt إلى life link هدف instead.\n\nأدوار of life link remaining: %s.

actors.buffs.light.name=illuminated
actors.buffs.light.desc=Even in the Darkest الزنزانة, a steady ضوء at خاصتك side is دائمًا comforting.\n\nضوء helps keep ظلام at bay, allowing أنت to see a reasonable distance despite the environment.\n\nأدوار of illumination remaining: %s.

actors.buffs.lockedfloor.name=طابق is مقفل
actors.buffs.lockedfloor.desc=The current طابق is مقفل, and أنت are unable to leave it!\n\nبينما a طابق is مقفل, أنت سوف not يكتسب جوع or take ضرر من starving. In addition, if أنت do not work towards defeating هذا طابق's زعيم, passive تجدد تأثيرات سوف also stop.\n\nAdditionally, if أنت are revived by an unblessed ankh بينما الطابق is مقفل, then it سوف reset.\n\nيقتل هذا طابق's زعيم to يكسر the قفل.

actors.buffs.lostinventory.name=فقد الحقيبة
actors.buffs.lostinventory.desc=خاصتك الحقيبة تم فقد somewhere في الزنزانة! أنت لن be able to التقط up or استخدم most عناصر until أنت retrieve it.

actors.buffs.magicalsight.name=سحري sight
actors.buffs.magicalsight.desc=Somehow أنت are able to see مع خاصتك mind, بدلًا من خاصتك eyes.\n\nبينما سحري sight is active أنت سوف be able to see عبر all terrain in a 12 tile radius.\n\nأدوار of سحري sight remaining: %s.

actors.buffs.magicalsleep.name=سحري sleep
actors.buffs.magicalsleep.toohealthy=أنت are too healthy, and resist the urge to sleep.
actors.buffs.magicalsleep.fallasleep=أنت سقوط إلى a عميق سحري sleep.
actors.buffs.magicalsleep.wakeup=أنت wake up feeling refreshed and healthy.
actors.buffs.magicalsleep.desc=هذا شخصية لديه fallen إلى a عميق سحري sleep which هم سوف not wake من naturally.\n\nسحري sleep is similar to عادي sleep, except ذلك only ضرر سوف cause the هدف to wake up.\n\nFor البطل and الخاص بهم حلفاء, سحري sleep لديه some restorative properties, allowing them to بسرعة شفاء بينما resting.

actors.buffs.magicimmune.name=محصن to سحر
actors.buffs.magicimmune.desc=All سحري تأثيرات لديك فقد الخاص بهم hold on أنت, أنت are completely impervious إلىm.\n\nبينما سحر محصن all harmful and helpful سحري تأثيرات سوف not طبّق to أنت, including اللعنات, enchants, عصي سحرية, لفائف, خواتم, الآثار, etc. Heroic درع قدرات are قوي enough to work regardless of هذا التأثير.\n\nأدوار of سحر مناعة remaining: %s.

actors.buffs.mindvision.name=mind vision
actors.buffs.mindvision.desc=Somehow أنت are able to see all مخلوقات on هذا طابق عبر خاصتك mind. إنه a غريب feeling.\n\nAll شخصيات on هذا طابق are مرئي to أنت as long as أنت لديك mind vision. Seeing a مخلوق عبر mind vision counts as it being seen or بالقرب for the purposes of many سحري تأثيرات.\n\nأدوار of mind vision remaining: %s.

actors.buffs.momentum.momentum=building momentum
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.resting=recovering
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum_desc=As he يتحرك, the Freerunner builds momentum, which he يمكن spend to start freerunning.\n\nEach اشحن of momentum grants اثنان أدوار of freerunning, and the Freerunner يمكن build up to 10 شحنات. Momentum is بسرعة فقد عندما the Freerunner stops يتحرك.\n\nCurrent momentum اشحن: %d.
actors.buffs.momentum.running_desc=As he يتحرك, the Freerunner builds momentum, which he يمكن spend to start freerunning.\n\nبينما freerunning, the Freerunner يتحرك at double speed and يحصل على مكافأة إضافية مراوغة based on his مستوى.\n\nأدوار remaining: %d.
actors.buffs.momentum.resting_desc=As he يتحرك, the Freerunner builds momentum, which he يمكن spend to start freerunning.\n\nThe Freerunner يحتاج time to regain his stamina قبل building momentum again.\n\nأدوار remaining: %d.

actors.buffs.monkenergy.name=طاقة
actors.buffs.monkenergy.action=راهب قدرات
actors.buffs.monkenergy.desc=As she defeats أعداء, the راهب يحصل على طاقة ذلك she يمكن استخدم on a variety of قدرات. Most أعداء grant 1 طاقة عندما مهزوم, and the راهب does not يفقد طاقة فوق time.\n\nCurrent طاقة: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=The راهب لديه recently يُستخدم an قدرة, and يجب wait قبل باستخدام another.\n\nCurrent cooldown: %d أدوار.
actors.buffs.monkenergy$monkability$flurry.name=flurry of blows
actors.buffs.monkenergy$monkability$flurry.desc=اثنان instant strikes ذلك صفقة %1$d-%2$d ضرر and ignore درع. هذا قدرة لا يمكن أن يكون يُستخدم repeatedly.
actors.buffs.monkenergy$monkability$flurry.empower_desc=اثنان instant strikes ذلك صفقة %1$d-%2$d ضرر, ignore درع, _and use your weapon's enchantment._ هذا قدرة لا يمكن أن يكون يُستخدم repeatedly.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$focus.desc=The راهب takes a دور to focus, letting her parry the next هجوم مصنوع aيحصل علىt her.
actors.buffs.monkenergy$monkability$focus.empower_desc=The راهب _instantly focuses,_ letting her parry the next هجوم مصنوع aيحصل علىt her.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focيُستخدم
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=The راهب is focيُستخدم on her surroundings, anticipating the next هجوم مصنوع aيحصل علىt her. بينما focيُستخدم, she is guaranteed to parry the next incoming هجوم.
actors.buffs.monkenergy$monkability$dash.name=dash
actors.buffs.monkenergy$monkability$dash.prompt=اختر a Location
actors.buffs.monkenergy$monkability$dash.desc=An instant dash up to 4 tiles بعيدًا. هذا قدرة يمكن go فوق hazards, but not عبر أعداء or صلب terrain.
actors.buffs.monkenergy$monkability$dash.empower_desc=An instant dash up to _8 tiles_ بعيدًا. هذا قدرة يمكن go فوق hazards, but not عبر أعداء or صلب terrain.
actors.buffs.monkenergy$monkability$dragonkick.name=dragon kick
actors.buffs.monkenergy$monkability$dragonkick.desc=A devastating kick ذلك يسبب %1$d-%2$d ضرر and ignores درع. The kick knocks the هدف بعيدًا and paralyzes them for each tile هم travel.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=A devastating kick ذلك يسبب _%1$d-%2$d damage_ and ignores درع. The kick knocks _all adjacent targets_ بعيدًا and paralyzes them for each tile هم travel.
actors.buffs.monkenergy$monkability$meditate.name=meditate
actors.buffs.monkenergy$monkability$meditate.desc=The راهب focيستخدم طاقة إلى her body for 5 أدوار. هذا clears most negative تأثيرات and grants her 8 أدوار of عصا سحرية and أثر إعادة الشحن.
actors.buffs.monkenergy$monkability$meditate.empower_desc=The راهب focيستخدم طاقة إلى her body for 5 أدوار. هذا clears most negative تأثيرات and grants her 8 أدوار of عصا سحرية and أثر إعادة الشحن. _She also gains 80% damage resistance while meditating, and slowly heals for 20% of her missing HP._

actors.buffs.ooze.name=كاوٍ ooze
actors.buffs.ooze.heromsg=كاوٍ ooze يأكل خاصتك flesh. Wash it بعيدًا!
actors.buffs.ooze.ondeath=أنت melt بعيدًا...
actors.buffs.ooze.rankings_desc=Dissolved
actors.buffs.ooze.desc=هذا لزج acid clings to flesh, ببطء melting it بعيدًا.\n\nOoze سوف صفقة consistent ضرر فوق time, but يمكن أن يكون immediately washed off in ماء.\n\nأدوار of ooze remaining: %s.

actors.buffs.paralysis.name=paralysed
actors.buffs.paralysis.heromsg=أنت are paralysed!
actors.buffs.paralysis.out=resisted شلل
actors.buffs.paralysis.desc=غالبًاtimes the worst thing to do ليسhing at all.\n\nشلل completely halts all actions, forcing the هدف to wait until the تأثير wears off. The pain من taking ضرر يمكن cause شخصيات to resist شلل, breaking them out of the تأثير.\n\nأدوار of شلل remaining: %s.

actors.buffs.physicalempower.name=physically empowered
actors.buffs.physicalempower.desc=خاصتك blows لديك been empowered, increasing the amount of ضرر أنت يمكن صفقة عندما أنت يضرب أعداء مع جسدي هجمات.\n\nمكافأة إضافية ضرر: %1$d.\nHits remaining: %2$d.

actors.buffs.pincushion.name=pincushion
actors.buffs.pincushion.desc=The مقذوف أسلحة أنت لديك يُستخدم aيحصل علىt هذا شخصية are currently stuck إلىm and سوف سقوط إلى طابق بعد هم are مهزوم.\n\nThe following عناصر are currently attached:

actors.buffs.poison.name=poisoned
actors.buffs.poison.heromsg=أنت are poisoned!
actors.buffs.poison.ondeath=أنت مات من سم...
actors.buffs.poison.rankings_desc=Succumbed to سم
actors.buffs.poison.desc=سم works its way عبر the body, ببطء impairing its internal functioning.\n\nسم يسبب ضرر each دور proportional to how long until it expires.\n\nأدوار of سم remaining: %s.

actors.buffs.preparation.name=preparation
actors.buffs.preparation.action_name=prepared strike
actors.buffs.preparation.desc=The Assassin is waiting patiently, preparing to strike من the shadows.
actors.buffs.preparation.desc_dmg=His next هجوم سوف صفقة _%1$d%% bonus damage_, and سوف execute عادي أعداء أسفل _%2$d%% health_, or الزعماء أسفل _%3$d%% health_.
actors.buffs.preparation.desc_dmg_likely=The هجوم سوف also be أكثر احتمالًا to صفقة a larger amount of ضرر.
actors.buffs.preparation.desc_blink=He is able to blink towards an عدو قبل striking them, مع a max distance of _%d._
actors.buffs.preparation.desc_invis_time=أدوار spent inمرئي: _%d._
actors.buffs.preparation.desc_invis_next=أدوار for stronger هجوم: _%d._
actors.buffs.preparation.prompt=اختر a هدف to هجوم!\nMax blink distance: %d
actors.buffs.preparation.no_target=هناك's لا شيء to هجوم هناك.
actors.buffs.preparation.out_of_reach=ذلك هدف is out of reach.
actors.buffs.preparation.assassinated=assassinated

actors.buffs.prismaticguard.name=prismatic Guard
actors.buffs.prismaticguard.desc=أنت are being guarded by a prismatic image which is currently inactive. عندما أعداء are present the prismatic image سوف spring to action and protect أنت!\n\nبينما inactive, the prismatic image سوف steadily recover من any ضرر it لديه taken.\n\nCurrent HP: %d/%d.
actors.buffs.prismaticguard.desc_many=هذا prismatic image is also benefitting من قوة of Many. أدوار Remaining: %d.

actors.buffs.recharging.name=إعادة الشحن
actors.buffs.recharging.desc=طاقة is coursing عبر أنت, improving the rate ذلك خاصتك عصي سحرية and staffs اشحن.\n\nEach دور هذا تعزيز سوف increase current اشحن by واحد quarter, in addition to عادي إعادة شحن.\n\nأدوار of إعادة الشحن remaining: %s.

actors.buffs.revealedarea.name=revealed area
actors.buffs.revealedarea.desc=An area of الزنزانة تم مؤقتًا revealed إلى بطل, هم سوف see it لا matter حيث هم are.\n\nأدوار remaining: %s.

actors.buffs.revealedchar.name=revealed
actors.buffs.revealedchar.desc=هذا شخصية is revealed إلى بطل, هم سيكون مرئي لا matter حيث هم are.\n\nأدوار remaining: %s.

actors.buffs.roots.name=rooted
actors.buffs.roots.heromsg=أنت يمكن't تحرك!
actors.buffs.roots.desc=Roots (سحري or طبيعي) grab at the feet, forcing them down إلى ground.\n\nRoots قفل a هدف in place, making movement and most movement قدرات impossible. Other actions are not affected, including انتقال آني تأثيرات.\n\nأدوار of root remaining: %s.

actors.buffs.scrollempower.name=لفافة empower
actors.buffs.scrollempower.desc=The طاقة من the ساحر's recently read لفافة is empowering his عصي سحرية!\n\nمستوى Boost: +%1$d.\nZaps remaining: %2$d.

actors.buffs.shadows.name=shadowmelded
actors.buffs.shadows.desc=أنت are blended إلى shadows من حولك, granting أنت اختفاء and إبطاء خاصتك metabolism.\n\nبينما أنت are inمرئي أعداء are unable to هجوم or follow أنت. Most جسدي هجمات and سحري تأثيرات (such as لفائف and عصي سحرية) سوف immediately cancel اختفاء. Additionally, بينما shadowmelded, خاصتك rate of جوع is slowed.\n\nأنت سوف remain shadowmelded until أنت leave the shadows or an عدو comes إلى contact مع أنت.

actors.buffs.slow.name=slowed
actors.buffs.slow.desc=إبطاء سحر affects the هدف's rate of time, إلىm everything is يتحرك super-fast.\n\nA slowed شخصية performs all actions in مرتين the amount of time هم قد normally take.\n\nأدوار of بطء remaining: %s.

actors.buffs.snipersmark.name=sniper's mark
actors.buffs.snipersmark.action_name_snapshot=snapshot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.action_name_sniper=sniper shot
actors.buffs.snipersmark.desc=The Sniper is honed in on the هدف she most recently attacked. She is able to perform a خاص هجوم مع her قوس which سوف vary based on how the قوس is augmented.\n\nAn unaugmented قوس سوف نار a _snapshot,_ which يسبب reduced ضرر but does not take any time to نار.\n\nA قوس augmented for speed سوف نار a _volley_ of ثلاثة arrows. Each arrow سوف صفقة reduced ضرر, but يمكن still activate تعويذة. هذا volley takes 1 دور to shoot.\n\nA قوس augmented for ضرر سوف نار a _sniper shot._ هذا shot is guaranteed to يضرب, يسبب مكافأة إضافية ضرر based on distance من the هدف, and takes 2 أدوار to نار.\n\nأدوار remaining: %s.

actors.buffs.soulmark.name=soul marked
actors.buffs.soulmark.desc=The ساحر ظلام لديه tapped إلى soul of هذا مخلوق, allowing him to شفاء as it takes ضرر جسدي.\n\nأدوار of soul mark remaining: %s.

actors.buffs.stamina.name=stamina
actors.buffs.stamina.desc=أنت لديك unending stamina, allowing for faster movement!\n\nبينما تحت the تأثيرات of stamina أنت سوف لعبة at +50%% speed, but سوف perform all other actions at عادي speed.\n\nأدوار of stamina remaining: %s.

actors.buffs.vulnerable.name=vulnerable
actors.buffs.vulnerable.heromsg=أنت feel هش!
actors.buffs.vulnerable.desc=Vulnerability سحر يزيد all ضرر جسدي ذلك a شخصية takes by 33%%, بعد ذلك ضرر تم reduced by درع.\n\nأدوار of vulnerable remaining: %s.

actors.buffs.terror.name=terrified
actors.buffs.terror.desc=Terror is manipulative سحر which forces its هدف إلى an uncontrollable panic.\n\nTerrified شخصيات are forced to لعبة بعيدًا من الخاص بهم opponent, trying to put as many doors and walls between them as possible. The shock of pain سوف lessen the مدة of terror, لكن.\n\nأدوار of terror remaining: %s.

actors.buffs.toxicimbue.name=imbued مع toxicity
actors.buffs.toxicimbue.desc=أنت are imbued مع سام طاقة!\n\nAs أنت تحرك حول الغاز السام سوف constantly billow forth من أنت, damaging خاصتك أعداء. أنت are محصن to الغاز السام and سم for the مدة of the تأثير, أيضًا as for a few أدوار afterward.\n\nأدوار of سام imbue remaining: %s.

actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.heromsg=أنت are melting!
actors.buffs.corrosion.ondeath=أنت melt بعيدًا...
actors.buffs.corrosion.rankings_desc=Dissolved
actors.buffs.corrosion.desc=قوي acid melts بعيدًا flesh, معدن, and bone at an alarming rate.\n\nCorrosion ضرر يزيد فوق time, as the هدف continues to melt بعيدًا.\n\nأدوار of corrosion remaining: %1$s.\nCurrent corrosion ضرر: %2$d.

actors.buffs.vertigo.name=vertigo
actors.buffs.vertigo.desc=Walking in a straight line يمكن أن يكون difficult عندما the whole العالم is spinning.\n\nبينما تحت the تأثيرات of vertigo, شخصيات who attempt to تحرك سوف go in a عشوائي direction, بدلًا من the واحد هم intended to go in.\n\nأدوار of vertigo remaining: %s.

actors.buffs.wandempower.name=عصي سحرية empowered
actors.buffs.wandempower.desc=خاصتك ضرر-مسببًا عصي سحرية لديك been empowered, increasing the amount of ضرر هم صفقة for a few hits.\n\nمكافأة إضافية ضرر: %1$d.\nHits remaining: %2$d.

actors.buffs.weakness.name=weakened
actors.buffs.weakness.heromsg=أنت feel weakened!
actors.buffs.weakness.desc=Everything suddenly يبدو much heavier.\n\nWeakening سحر يقلل a شخصية's جسدي قوة, مسببًا them to صفقة 33%% reduced ضرر.\n\nأدوار of weakness remaining: %s.

actors.buffs.wellfed.name=بئر fed
actors.buffs.wellfed.desc=أنت feel quite satisfied and full.\n\nبينما بئر fed, خاصتك جوع سوف not increase, and أنت سوف شفاء an additional amount of صحة فوق time.\n\nأدوار remaining: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=أنت يمكن't هدف خاصتكself!
actors.hero.abilities.armorability.no_target=هناك's لا شيء to هدف هناك!
actors.hero.abilities.armorability.prompt=اختر a location to هدف
actors.hero.abilities.armorability.cost=اشحن تكلفة: _%d_

actors.hero.abilities.warrior.heroicleap.name=heroic leap
actors.hero.abilities.warrior.heroicleap.prompt=اختر direction to leap
actors.hero.abilities.warrior.heroicleap.short_desc=The محارب performs a _Heroic Leap_ towards a targeted location, sailing أعلى أعداء and hazards.
actors.hero.abilities.warrior.heroicleap.desc=The محارب leaps toward a targeted location, going فوق any أعداء or hazards in the way. He لا يمكن leap فوق walls or other صلب terrain لكن.
actors.hero.abilities.warrior.shockwave.name=shockwave
actors.hero.abilities.warrior.shockwave.short_desc=The محارب releases a _Shockwave_ in a conical AOE by slamming the ground. أعداء caught in the shockwave are damaged and crippled.
actors.hero.abilities.warrior.shockwave.desc=The محارب slams the ground, producing a shockwave ذلك travels up to 5 tiles in a 60 degree cone.\n\nأعداء caught in هذا shockwave are crippled for 5 أدوار. هم also take 5-10 ضرر, plus an additional 1-2 ضرر for every point of قوة the محارب لديه أعلى 10.
actors.hero.abilities.warrior.endure.name=endure
actors.hero.abilities.warrior.endure$enduretracker.name=endurance
actors.hero.abilities.warrior.endure$enduretracker.desc=The محارب is now مسببًا مكافأة إضافية ضرر based on the ضرر he endured.\n\nمكافأة إضافية ضرر: %1$d\nHits يسار: %2$d
actors.hero.abilities.warrior.endure.short_desc=The محارب _Endures_, skipping several أدوار but gaining high ضرر مقاومة. He then يسبب مكافأة إضافية ضرر based on what he endured.
actors.hero.abilities.warrior.endure.desc=The محارب endures for 3 أدوار, taking half ضرر من all sources. هذا reduction is مطبّق قبل ضرر resisting تأثيرات like درع.\n\nبعد enduring, the محارب's next يضرب داخل 10 أدوار يحصل على مكافأة إضافية ضرر. هذا مكافأة إضافية ضرر is equal to half of all the ضرر inflicted on him بينما enduring, قبل any ضرر reduction تأثيرات!\n\nIf the محارب لديه any combo, باستخدام هذا قدرة يزيد its remaining time by 3 أدوار.

actors.hero.abilities.mage.elementalblast.name=elemental blast
actors.hero.abilities.mage.elementalblast.no_staff=أنت يمكن't استخدم هذا قدرة بدون خاصتك staff.
actors.hero.abilities.mage.elementalblast.short_desc=The ساحر emits an _Elemental Blast_ من his staff, covering a كبير area حول him in an تأثير ذلك varies based on the عصا سحرية in his staff.
actors.hero.abilities.mage.elementalblast.desc=The ساحر emits a blast of سحر, which covers a circular region up to 4 tiles بعيدًا and يسبب up to 15-25 ضرر. The specific تأثير of elemental blast سوف vary by the عصا سحرية imbued in the ساحر's staff.
actors.hero.abilities.mage.elementalblast.generic_desc=The تأثير of elemental blast سيكون similar إلى تأثير of the عصا سحرية عندما zapped at an عدو or حليف.
actors.hero.abilities.mage.wildmagic.name=wild سحر
actors.hero.abilities.mage.wildmagic.no_wands=أنت لديك لا عصي سحرية to zap مع!
actors.hero.abilities.mage.wildmagic.short_desc=The ساحر unleashes the _Wild Magic_ contained in his عصي سحرية, عشوائيًا firing them multiple times at a chosen هدف فوق a single دور.
actors.hero.abilities.mage.wildmagic.desc=The ساحر unleashes the قوة in his عصي سحرية, عشوائيًا firing them up to 4 times in a single دور. The ساحر's staff ليس included in هذا التأثير.\n\nEach عصا سحرية also لديه its مستوى boosted by 2, up to +3. هذا قدرة يستخدم half a عصا سحرية اشحن for each zap, and لا واحد عصا سحرية يمكن أن يكون fired more than 2 times.
actors.hero.abilities.mage.warpbeacon.name=warp beacon
actors.hero.abilities.mage.warpbeacon.depths=أنت يمكن't warp between depths!
actors.hero.abilities.mage.warpbeacon.locked_floor=أنت لا يمكن leave a مقفل طابق!
actors.hero.abilities.mage.warpbeacon.too_far=ذلك location is too far!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=أنت يمكن't place a beacon هناك!
actors.hero.abilities.mage.warpbeacon.window_desc=خاصتك beacon is currently placed on طابق %d.
actors.hero.abilities.mage.warpbeacon.window_tele=انتقال آني to beacon
actors.hero.abilities.mage.warpbeacon.window_clear=clear beacon
actors.hero.abilities.mage.warpbeacon.window_cancel=cancel
actors.hero.abilities.mage.warpbeacon.short_desc=The ساحر places a _Warping Beacon_ at his current location, which he يمكن فورًا انتقال آني للخلف to.
actors.hero.abilities.mage.warpbeacon.desc=The ساحر places a beacon, which يمكن then be warped to at سوف. Placing the beacon takes 1 دور, but warping to it is instantaneous.\n\nThe ساحر لا يمكن warp between طوابق by default, or استخدم the beacon to reach inaccessible places such as مقفل غرف. The ساحر يمكن انتقال آني إلى أعداء, which سوف push them aside.

actors.hero.abilities.rogue.smokebomb.name=smoke قنبلة
actors.hero.abilities.rogue.smokebomb.fov=أنت يمكن only jump to an empty location in خاصتك field of view.
actors.hero.abilities.rogue.smokebomb.prompt=اختر a location to jump to
actors.hero.abilities.rogue.smokebomb$ninjalog.name=خشبي decoy
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Somehow, أعداء are easily convinced ذلك هذا خشبي decoy is the real لص!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific بطل درع قدرة.
actors.hero.abilities.rogue.smokebomb.short_desc=The لص throws down a _Smoke Bomb_ بينما blinking بعيدًا. He blinds أعداء بالقرب من his قديم location.
actors.hero.abilities.rogue.smokebomb.desc=The لص throws down a smoke قنبلة and blinks up to 6 tiles بعيدًا. He يمكن blink عبر hazards and أعداء, but not عبر صلب terrain like walls.\n\nأعداء ذلك are adjacent إلى لص's قديم position سيكون blinded for 5 أدوار.
actors.hero.abilities.rogue.deathmark.name=موت mark
actors.hero.abilities.rogue.deathmark.ally_target=أنت يمكن only mark أعداء
actors.hero.abilities.rogue.deathmark.short_desc=The لص places a _Death Mark_ on a chosen عدو. Marked أعداء take مكافأة إضافية ضرر, but لا يمكن يموت until the mark ends.
actors.hero.abilities.rogue.deathmark.desc=The لص places a mark on a chosen عدو, مسببًا them to take 25% extra ضرر. The mark is مطبّق فورًا and lasts for 5 أدوار.\n\nMarked أعداء take مكافأة إضافية ضرر but are unable to يموت until the mark expires. If an عدو لديه 0 HP عندما the mark ends, هم سوف immediately يموت.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marked for موت
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=هذا عدو تم marked, مسببًا them to take 25%% مكافأة إضافية ضرر, but also rendering them unable to يموت until the mark ends.\n\nأدوار remaining: %s.
actors.hero.abilities.rogue.shadowclone.name=ظل clone
actors.hero.abilities.rogue.shadowclone.short_desc=The لص summons a _Shadow Clone_, which يمكن أن يكون directed to aid him في القتال.
actors.hero.abilities.rogue.shadowclone.desc=The لص summons a shadowy mimic of himself, which يمكن أن يكون directed to aid him في القتال. Directing the ظل clone does not تكلفة any اشحن.\n\nThe clone لديه 80 HP, لا درع, and يسبب 10-20 ضرر. All of هذه traits يمكن أن يكون improved مع مواهب, such ذلك the clone benefits من أسلحة and درع البطل لديه.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ظل لص
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=خاصتك clone يتحرك to ذلك position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=خاصتك clone يتحرك to follow أنت.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=خاصتك clone يتحرك to هجوم!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A copy of the لص, مصنوع من shadowy ظلام. It stands stock still, مع empty eyes and ضئيل wisps of ظلام rising من it like steam.\n\nThe clone ليس a perfect copy of the لص, but is still a decent مقاتل, and يمكن أن يكونnefit من the لص's معدات مع يمين مواهب.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific بطل درع قدرة.

actors.hero.abilities.huntress.spectralblades.name=spectral blades
actors.hero.abilities.huntress.spectralblades.short_desc=The صيادة throws _Spectral Blades_ at a هدف, inflicting ضرر depending on her currently مجهّز اشتباك سلاح.
actors.hero.abilities.huntress.spectralblades.desc=The صيادة throws out a spectral blade at an عدو, which acts like a بعيد المدى strike من her اشتباك سلاح. All of the عادي تأثيرات of a اشتباك سلاح سوف activate, including enchantments.
actors.hero.abilities.huntress.naturespower.name=الطبيعة's قوة
actors.hero.abilities.huntress.naturespower.short_desc=The صيادة calls upon _Nature's Power_, increasing her movement speed and her قوس's rate of نار لفترة قصيرة.
actors.hero.abilities.huntress.naturespower.desc=The صيادة مؤقتًا empowers herself and her قوس مع قوة of الطبيعة! هذا lasts for 8 أدوار.\n\nأثناء هذا time, the صيادة يتحرك at 2x speed, and هجمات 33% faster مع her قوس. The مكافأة إضافية قوس تأثيرات do not trigger if the Sniper is باستخدام her خاص هجمات.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=الطبيعة's قوة
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=The صيادة is لفترة وجيزة empowered, increasing her movement speed and هجوم speed مع her قوس.\n\nأدوار remaining: %s.
actors.hero.abilities.huntress.spirithawk.name=روح hawk
actors.hero.abilities.huntress.spirithawk.no_space=يوجد لا مجاني space بالقرب من أنت.
actors.hero.abilities.huntress.spirithawk.short_desc=The صيادة summons a _Spirit Hawk_ familiar, which يمكن help her scout locations and distract أعداء.
actors.hero.abilities.huntress.spirithawk.desc=The صيادة summons a روح hawk familiar, which يمكن أن يكون directed by باستخدام the قدرة again بينما it تم استدعاؤه. The hawk lasts for 100 أدوار, directing the hawk does not تكلفة any اشحن.\n\nThe hawk لديه minimal صحة and attacking قوة, but is fast, evasive, and accurate. It shares its entire field of vision مع صيادة at all times. It is محصن to all area-bound تأثيرات, such as نار and سم gas. It سوف not هجوم unless specifically directed to.
actors.hero.abilities.huntress.spirithawk$hawkally.name=روح hawk
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=خاصتك hawk يتحرك to ذلك position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=خاصتك hawk يتحرك to follow أنت.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=خاصتك hawk يتحرك to هجوم!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=A سحري hawk, مستدعى by the صيادة. It glows a ساطع ethereal أزرق, its head constantly shifts حول as it surveys the area.\n\nبينما it ليس much of a مقاتل its speed and vision make it excellent for scouting and distracting أعداء.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=أدوار remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Guaranteed dodges remaining: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific بطل درع قدرة.

actors.hero.abilities.duelist.challenge.name=تحدي
actors.hero.abilities.duelist.challenge.prompt=اختر an عدو to تحدي
actors.hero.abilities.duelist.challenge.already_dueling=أنت يمكن only be in واحد duel at a time.
actors.hero.abilities.duelist.challenge.ally_target=أنت يمكن only تحدي أعداء.
actors.hero.abilities.duelist.challenge.unreachable_target=أنت يجب be able to reach خاصتك هدف.
actors.hero.abilities.duelist.challenge.distant_target=ذلك عدو is too far بعيدًا to تحدي.
actors.hero.abilities.duelist.challenge.short_desc=The مبارز _Challenges_ a بالقرب عدو to a duel, مؤقتًا تجميد all other أعداء.
actors.hero.abilities.duelist.challenge.desc=The مبارز تحديات a بالقرب عدو to a duel. ذلك عدو is compelled to fight her بينما all other أعداء are مؤقتًا frozen in time.\n\nThe هدف يجب be reachable and داخل 5 tiles of the مبارز. The duel lasts until 10 أدوار pass, the عدو dies, or the مبارز is more than 5 tiles بعيدًا من the عدو.\n\nFrozen أعداء are invulnerable. The مبارز's حلفاء are not frozen by هذا قدرة, but if a زعيم is targeted its minions سوف not be frozen either.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duel participant
actors.hero.abilities.duelist.challenge$duelparticipant.desc=هذا شخصية is participating in a duel. هم, and any of الخاص بهم حلفاء or minions, are allowed to act normally بينما others are frozen.\n\nThe duel سوف last for a set amount of time, until واحد participant dies, or until the participants تحرك more than 5 tiles بعيدًا من eachother.\n\nأدوار remaining: %d.
actors.hero.abilities.duelist.elementalstrike.name=elemental strike
actors.hero.abilities.duelist.elementalstrike.short_desc=The مبارز performs an _Elemental Strike_, spreading an تأثير in a conical AOE based on her سلاح تعويذة.
actors.hero.abilities.duelist.elementalstrike.desc=The مبارز strikes an عدو or location, performing a عادي هجوم ذلك's guaranteed to يضرب and spreading a سحري تأثير ذلك travels up to 4 tiles in a 65 degree cone. هذا سحري تأثير varies based on the تعويذة on the مبارز's primary سلاح.
actors.hero.abilities.duelist.elementalstrike.generic_desc=An elemental strike مع لا تعويذة سوف release a صغير burst of سحر, مسببًا 6-12 ضرر to جميع الأعداء in range.
actors.hero.abilities.duelist.feint.name=feint
actors.hero.abilities.duelist.feint.prompt=اختر a location to dash to
actors.hero.abilities.duelist.feint.too_far=ذلك location ليس adjacent to أنت.
actors.hero.abilities.duelist.feint.bad_location=أنت يمكن't تحرك to ذلك location.
actors.hero.abilities.duelist.feint.short_desc=The مبارز _Feints_, faking an هجوم بينما dashing to an adjacent tile. أعداء سوف هجوم her afterimage, leaving them مفتوح to a counterattack.
actors.hero.abilities.duelist.feint.desc=The مبارز fakes an هجوم بينما dashing to an adjacent tile, leaving behind a momentary afterimage of herself. أعداء ذلك were attacking the مبارز سوف هجوم her afterimage instead.\n\nأعداء ذلك هجوم the afterimage become confيُستخدم, which cancels الخاص بهم next action and leaves them مفتوح to a surprise هجوم.

actors.hero.abilities.cleric.ascendedform.name=ascended form
actors.hero.abilities.cleric.ascendedform.short_desc=The رجل دين assumes an _Ascended Form_, gaining new تعاويذ, هجوم range, and تحصين.
actors.hero.abilities.cleric.ascendedform.desc=The رجل دين projects مقدس طاقة من themselves, assuming an extended radiant form for 10 أدوار. بينما in هذا form the رجل دين يمكن cast new تعاويذ, يحصل على 2 هجوم range, 30 تحصين, and any additional تعاويذ هم cast سوف grant 10 تحصين per مقدس tome اشحن يُستخدم.\n\nThe تحصين من ascended form and its تعاويذ does not decay normally, but سوف immediately fade once ascended form ends. The قدرة يمكن أن يكون re-يُستخدم to refresh ascended form's مدة.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=ascended form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Radiant طاقة is emanating من the رجل دين's body. بينما in هذا form the رجل دين يحصل على 2 هجوم range (من the مقدس طاقة projecting من them), and 10 تحصين wheأبدًا هم spend a مقدس tome اشحن. هم are also able to cast the تعاويذ which are unlocked via ascended form's مواهب.\n\nThe درع granted by ascended form and its تعاويذ سوف not decay normally, but سوف فورًا fade عندما ascended form ends.\n\nCurrent تحصين: %1$d.\nأدوار remaining: %2$d.
actors.hero.abilities.cleric.trinity.name=trinity
actors.hero.abilities.cleric.trinity.no_imbue=Trinity لديه لا تأثير set for any of its forms currently, استخدم واحد of its تعاويذ!
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity لا يمكن duplicate an تأثير ذلك أنت already لديك مجهّز!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity سوف طبّق هذا التأثير for _%1$d turns_ at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity سوف طبّق هذا _powerful_ تأثير for _%1$d turns_ at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.wand_use=Trinity سوف zap هذا عصا سحرية at _+%1$d_ at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity سوف zap هذا _multi-charge_ عصا سحرية at _+%1$d_ at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity سوف ارمِ هذا السلاح at _+%1$d_ at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.ring_use=Trinity سوف طبّق هذا خاتم's تأثير at _+%1$d_ for 20 أدوار, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity سوف طبّق هذا أثر's remote خيمياء تأثير, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity سوف طبّق هذا أثر's passive صحة regen تأثير at _+%1$d_ for 20 أدوار, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity سوف استخدم هذا أثر's تأثير to استدعاء a corrupted friendly wraith مع HP of a _+%1$d_ شبح, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity سوف طبّق هذا أثر's chain-casting تأثير مع reach at _+%1$d_, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity سوف طبّق هذا أثر's snacking تأثير, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity سوف طبّق هذا أثر's عدو robbing تأثير at _+%1$d_, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity سوف طبّق هذا أثر's root تأثير مع a عشوائي harmful بذرة, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity سوف طبّق هذا أثر's insert تأثير, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity سوف طبّق هذا أثر's scry تأثير at _+%1$d_, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity سوف طبّق هذا أثر's time freeze تأثير مع a _%1$d_ دور مدة, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity سوف طبّق هذا أثر's عشوائي لفافة تأثير مع a _%1$d/10_ احتمال to offer the exotic version at لا additional تكلفة, at the تكلفة of _%2$s charge._
actors.hero.abilities.cleric.trinity.cost=The اشحن تكلفة of هذا قدرة varies, but is most غالبًا _%d._
actors.hero.abilities.cleric.trinity.short_desc=The رجل دين يحصل على a _Trinity_ of قدرات, which emulate معدات هم لديك seen and يمكن أن يكون assigned by باستخدام new تعاويذ.
actors.hero.abilities.cleric.trinity.desc=The رجل دين يحصل على a _Trinity_ of درع قدرات, which يمكن أن يكون assigned to various عنصر تأثيرات by باستخدام ثلاثة new تعاويذ. Each of هذه تعاويذ focيستخدم on emulating the تأثيرات of different kinds of معدات ذلك the رجل دين لديه معروف أثناء هذا لعبة: body form (أسلحة and درع), mind form (عصي سحرية and مقذوف أسلحة), and روح form (خواتم and الآثار).\n\nEach Trinity form يمكن أن يكون imbued مع واحد تأثير at a time, and the رجل دين chooses which واحد to activate عندما باستخدام Trinity. Trinity سوف not duplicate the تأثير of something أنت already لديك مجهّز.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=اختر which form of Trinity to استخدم. The تأثيرات of different forms يمكن أن يكون active simultaneously.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Body Form: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Mind Form: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Spirit Form: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=اختر an تأثير to be imbued إلى Trinity. Additional معلومات سيكون shown قبل confirmation.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Assign to body form
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Assign to mind form
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Assign to روح form
actors.hero.abilities.cleric.powerofmany.name=قوة of many
actors.hero.abilities.cleric.powerofmany.prompt_default=اختر an حليف or location
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direct خاصتك ضوء حليف
actors.hero.abilities.cleric.powerofmany.ally_exists=أنت already لديك an empowered حليف.
actors.hero.abilities.cleric.powerofmany.no_vision=أنت يمكن't هدف a location أنت يمكن't see.
actors.hero.abilities.cleric.powerofmany.only_allies=أنت يمكن only empower حلفاء.
actors.hero.abilities.cleric.powerofmany.short_desc=The رجل دين channels the _Power of Many_, empowering an existing حليف or creating a new واحد.
actors.hero.abilities.cleric.powerofmany.desc=The رجل دين channels the _Power of Many_, which either empowers an existing حليف or creates a new empowered واحد for 100 أدوار. Targeting an empty space creates a new حليف.\n\nبينما empowered by قوة of Many, any حليف يسبب +25% ضرر, takes -25% ضرر, and shares الخاص بهم vision مع رجل دين. هم also يكتسب 25 تحصين عندما the قدرة is يُستخدم.\n\nThe رجل دين also يحصل على ثلاثة new تعاويذ ذلك يمكن only be cast مع an empowered حليف. قوة of Many لن end بينما واحد of هذه تعاويذ is active.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=قوة of many
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=هذا حليف تم empowered by قوة of Many, granting them +25%% ضرر dealt and -25%% ضرر taken. هم سوف also share الخاص بهم vision range مع رجل دين, and يمكن أن يكونnefit من قوة of many تعاويذ.\n\nقوة of Many سوف persist عندما حلفاء such as prismatic images hide بعيدًا, but its مدة سوف still count down.\n\nأدوار Remaining: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=ضوء حليف
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=خاصتك حليف يتحرك to ذلك position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=خاصتك حليف يتحرك to follow أنت.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=خاصتك حليف يتحرك to هجوم!
actors.hero.abilities.cleric.powerofmany$lightally.desc=A copy of واحد of the رجل دين's adventuring companions, مصنوع out of صلب ضوء. بينما it لديه the shape of another بطل, it does not لديك any of الخاص بهم فريد قدرات. هذا حليف سوف persist for as long as قوة of Many is مطبّق إلىm.\n\nهذا حليف يمكن أن يكون directed at لا تكلفة by re-باستخدام the قوة of Many درع قدرة.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific بطل درع قدرة.


actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.cant_transform=أنت يمكن't ratmogrify ذلك!
actors.hero.abilities.ratmogrify.too_strong=ذلك عدو is too قوي to ratmogrify!
actors.hero.abilities.ratmogrify.short_desc=البطل _Ratmogrifies_ an عدو! هذا مؤقتًا أدوار them إلى a جرذ مع لا قدرات.
actors.hero.abilities.ratmogrify.desc=البطل transforms an عدو إلى a جرذ for 6 أدوار! الزعماء, حلفاء, and rats لا يمكن أن يكون ratmogrified.\n\nRatmogrified أعداء retain الخاص بهم original stats, but do not لديك any قدرات.
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.desc=هذا عدو تم transformed إلى a جرذ. A big improvement, if أنت ask me! - جرذ ملك
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Slain by: ratmogrified عدو

##Cleric Spells
actors.hero.spells.auraofprotection.name=aura of protection
actors.hero.spells.auraofprotection.short_desc=Boosts defence for فارس مقدس and بالقرب حلفاء.
actors.hero.spells.auraofprotection.desc=The فارس مقدس begins radiating protective طاقة in a sparkling aura حول themselves for 20 أدوار. Any حليف داخل 2 tiles of the فارس مقدس (including themselves) takes %1$d%% less ضرر, and يحصل على the تأثير of the فارس مقدس's درع نقش at +%2$d%% قوة.\n\nهذا ضرر reduction takes place قبل other ضرر-reducing تأثيرات (e.g. درع). The نقش قوة boost سوف دائمًا طبّق, but هذا تعويذة لا يمكن cause the فارس مقدس's نقش to طبّق more than once if a شخصية is already benefitting من it (e.g. the فارس مقدس themselves, or a prismatic image).
actors.hero.spells.auraofprotection$aurabuff.name=aura of protection
actors.hero.spells.auraofprotection$aurabuff.desc=The فارس مقدس is radiating protective طاقة حول themselves.\n\nAny بالقرب حليف (including the فارس مقدس themselves) takes reduced ضرر and يحصل على the تأثير of the فارس مقدس's درع نقش مع boosted قوة.\n\nأدوار Remaining: %s.

actors.hero.spells.beamingray.name=beaming ray
actors.hero.spells.beamingray.no_space=هناك's لا space for خاصتك حليف to appear هناك.
actors.hero.spells.beamingray.out_of_range=ذلك location is out of range.
actors.hero.spells.beamingray.short_desc=Teleports خاصتك حليف and grants مكافأة إضافية ضرر.
actors.hero.spells.beamingray.desc=The رجل دين channels the قوة on الخاص بهم حليف إلى a ray of ضوء ذلك beams them to a location. If the ray collides مع an عدو it سوف place the حليف بالقرب and direct them towards the عدو.\n\nThe ray لديه a الأقصى range of %1$d tiles, and سوف increase قوة of Many's مكافأة إضافية ضرر to +%2$d%% for 10 أدوار aيحصل علىt the cيفقدt عدو داخل 4 tiles. Beaming ray يمكن even انتقال آني normally immobile حلفاء, but its بعيد المدى is halved in هذه cases.
actors.hero.spells.beamingray$beamingrayboost.name=beaming ray
actors.hero.spells.beamingray$beamingrayboost.desc=هذا حليف was recently teleported by Beaming Ray, giving them مكافأة إضافية ضرر aيحصل علىt the الأقرب عدو بعد the انتقال آني. قوة of Many also لن expire عندما هذا تعزيز is active.\n\nأدوار Remaining: %s.

actors.hero.spells.blessspell.name=bless
actors.hero.spells.blessspell.short_desc=Blesses & shields رجل دين, blesses & heals others.
actors.hero.spells.blessspell.desc=The رجل دين places a مقدس blessing on themselves or another شخصية هم يمكن see.\n\nعندما cast on themselves the تأثير is weaker, granting %1$d أدوار of bless and %2$d barrier.\n\nعندما cast on other شخصيات the تعويذة is more قوي, granting %3$d أدوار of bless and %4$d علاج. Excess علاج is converted إلى barrier.

actors.hero.spells.bodyform.name=body form
actors.hero.spells.bodyform.short_desc=Assigns Trinity to an enchant or نقش.
actors.hero.spells.bodyform.desc=The رجل دين chooses an تعويذة or نقش ذلك هم لديك معروف هذا لعبة and imbues Trinity مع its تأثير.\n\nعندما Trinity is يُستخدم, The رجل دين يحصل على the تأثير of the chosen تعويذة or نقش for %d أدوار. هذا temporary enchant or نقش سوف work مع any تأثير ذلك a عادي تعويذة or نقش قد.\n\nهذا تعويذة replaces any other body تأثير ذلك Trinity is currently imbued مع.
actors.hero.spells.bodyform$bodyformbuff.name=body form
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity's body form is currently granting أنت the قوة of an تعويذة or نقش, as if أنت had it مجهّز on خاصتك current سلاح or درع.\n\nNote ذلك body form لا يمكن provide another copy of an تأثير ذلك أنت're already benefitting من.\n\nCurrent تأثير: %1$s.\n\nأدوار Remaining: %2$s.

actors.hero.spells.cleanse.name=cleanse
actors.hero.spells.cleanse.short_desc=Clears debuffs and grants تحصين.
actors.hero.spells.cleanse.desc=The رجل دين clears all harmful status تأثيرات on themselves and مرئي حلفاء. بعد the تعويذة ends all شخصيات affected also يكتسب %1$d أدوار of debuff مناعة, and %2$d barrier.

actors.hero.spells.clericspell.prompt=اختر a هدف
actors.hero.spells.clericspell.no_target=يوجد لا هدف هناك.
actors.hero.spells.clericspell.invalid_target=أنت يمكن't هدف ذلك location.
actors.hero.spells.clericspell.invalid_enemy=أنت يمكن't هدف ذلك عدو.
actors.hero.spells.clericspell.charge_cost=اشحن تكلفة: %d

actors.hero.spells.divinesense.name=divine sense
actors.hero.spells.divinesense.short_desc=يكتسب temporary mind vision in a wide range.
actors.hero.spells.divinesense.desc=The رجل دين focيستخدم الخاص بهم senses on الخاص بهم surroundings, gaining mind vision مع a %d tile range for 50 أدوار. هذا تعويذة takes لا time to cast.
actors.hero.spells.divinesense$divinesensetracker.name=divine sense
actors.hero.spells.divinesense$divinesensetracker.desc=هذا شخصية is مؤقتًا able to see other بالقرب مخلوقات معir mind!\n\nأدوار remaining: %s.

actors.hero.spells.divineintervention.name=divine intervention
actors.hero.spells.divineintervention.short_desc=هائل درع boost to رجل دين and حلفاء.
actors.hero.spells.divineintervention.desc=The رجل دين pours a tremendous amount of قوة من الخاص بهم tome إلىmselves and حلفاء, boosting everyone to %1$d تحصين and extending Ascended Form by %2$d أدوار. هذا تعويذة's incredible defensive قوة is weighed aيحصل علىt its very high اشحن تكلفة.\n\nJust like other تحصين granted by ascended form, هذا تحصين does not decay normally, but سوف immediately expire عندما ascended form ends.

actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=اختر a location
actors.hero.spells.flash.short_desc=انتقال آني to a بالقرب location.
actors.hero.spells.flash.desc=The رجل دين channels الخاص بهم ascended form at a بالقرب location and teleports هناك. Flash يمكن انتقال آني the رجل دين to any disمغطى location ذلك is in range and unoccupied. هذا تعويذة يكلّف more tome شحنات every time it is يُستخدم in the same ascended form.

actors.hero.spells.guidinglight.name=guiding ضوء
actors.hero.spells.guidinglight.short_desc=يسبب بعيد المدى سحر ضرر and guarantees a يضرب.
actors.hero.spells.guidinglight.desc=The رجل دين fires a bolt of طاقة سحرية which strikes a هدف, مسببًا 2-8 ضرر and illuminating them. The next non-encumbered جسدي هجوم مصنوع aيحصل علىt an illuminated عدو is guaranteed to يضرب them.
actors.hero.spells.guidinglight.desc_priest=_This spell is more powerful when cast by the Priest._ The الأول cast of the تعويذة every 50 أدوار يكلّف لا tome شحنات, and illumination سيكون consumed by radiance, عصي سحرية, other شخصيات, and الآثار ذلك directly affect أعداء. عندما illuminated is يُستخدم in هذا way, it يسبب مكافأة إضافية سحر ضرر equal إلى Priest's مستوى + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Guiding ضوء
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=The Priest سيكون able to cast Guiding ضوء for مجاني again بعد 50 أدوار elapse.\n\nأدوار remaining: %s.
actors.hero.spells.guidinglight$illuminated.name=Illuminated
actors.hero.spells.guidinglight$illuminated.desc=هذا شخصية is glowing as a result of being struck by guiding ضوء. بينما the glow ليس قوي enough to brighten the المحيط area, the سحري تأثير سوف make landing blows on them much easier for the رجل دين.
actors.hero.spells.guidinglight$illuminated.desc_priest=The Priest يمكن additionally consume illuminated مع radiance, a عصا سحرية zap, strike من an حليف, or تأثيرات من some الآثار. باستخدام illuminated in هذا way سوف صفقة مكافأة إضافية سحر ضرر equal إلى Priest's مستوى + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Other heroes يمكن still استخدم illuminated to benefit من the searing ضوء موهبة, but سوف not يكتسب any دقة.

actors.hero.spells.hallowedground.name=hallowed ground
actors.hero.spells.hallowedground.prompt=اختر a location
actors.hero.spells.hallowedground.short_desc=Heals حلفاء, slows أعداء, and spreads عشب in an AOE.
actors.hero.spells.hallowedground.desc=The Priest focيستخدم الخاص بهم divine سحر إلى ground بالقرب, creating a %1$dx%1$d area of hallowed terrain for 20 أدوار.\n\nعندما it is cast, هذا تعويذة heals all حلفاء for 15 HP (healthy حلفاء and the Priest احصل على تحصين), لفترة وجيزة roots أعداء, and spreads short عشب.\n\nThe hallowed terrain heals حلفاء for 1 HP per دور (healthy حلفاء and the Priest احصل على تحصين), cripples أعداء, and عشوائيًا يسبب tall عشب to grow.\n\nHallowed terrain تم تدميره by نار, and سوف produce furrowed عشب if passive regen تأثيرات are disabled or the Priest لديه not gained exp in a بينما.
actors.hero.spells.hallowedground$hallowedterrain.desc=The ground تم hallowed هنا. Hallowed ground slows أعداء, heals حلفاء, and يسبب عشب to spread.

actors.hero.spells.holyintuition.name=مقدس intuition
actors.hero.spells.holyintuition.prompt=اختر an عنصر
actors.hero.spells.holyintuition.cursed=أنت sense خبيث سحر lurking داخل هذا العنصر.
actors.hero.spells.holyintuition.uncursed=هذا العنصر is مجاني of خبيث سحر.
actors.hero.spells.holyintuition.short_desc=identifies whether an عنصر is ملعون or not.
actors.hero.spells.holyintuition.desc=The رجل دين focيستخدم الخاص بهم senses on an عنصر and determines whether it is ملعون or not بدون having to جهّز it.

actors.hero.spells.holylance.name=مقدس lance
actors.hero.spells.holylance.short_desc=يسبب heavy بعيد المدى سحر ضرر.
actors.hero.spells.holylance.desc=The Priest concentrates a كبير amount of طاقة إلى a devastating مقذوف lance مصنوع of ضوء. هذا lance يسبب %1$d-%2$d ضرر and دائمًا يسبب الأقصى ضرر to undead and demonic targets.\n\nهذا تعويذة is very expensive, and لديه a cooldown of 30 أدوار.
actors.hero.spells.holylance$lancecooldown.name=مقدس lance cooldown
actors.hero.spells.holylance$lancecooldown.desc=The Priest لديه recently cast مقدس Lance, and يجب wait قبل casting it again.\n\nأدوار remaining: %s.

actors.hero.spells.holyward.name=مقدس ward
actors.hero.spells.holyward.glyph_name=%s of ضوء
actors.hero.spells.holyward.glyph_desc=هذا نقش slightly يزيد the amount of ضرر درع يمكن block.
actors.hero.spells.holyward.short_desc=مؤقتًا overrides glyphs to boost درع حجب.
actors.hero.spells.holyward.desc=The رجل دين imbues الخاص بهم worn درع مع glyphs of مقدس ضوء, increasing the درع's ضرر حجب by 1. هذا تعويذة takes لا time to cast.\n\nهذا نقش lasts for 50 أدوار, and سوف override any beneficial نقش the درع لديه for the مدة. The رجل دين سيكونnefit من هذا التأثير even if هم لديك لا درع.
actors.hero.spells.holyward.desc_paladin=_This spell is more powerful when cast by the Paladin._ The additional ضرر حجب is increased to 3, the تعويذة لا longer overrides existing glyphs, and casting other تعاويذ بينما مقدس ward is active سوف extend its مدة by 10 أدوار per اشحن يُستخدم.
actors.hero.spells.holyward$holyarmbuff.name=مقدس ward
actors.hero.spells.holyward$holyarmbuff.desc=The رجل دين لديه imbued الخاص بهم worn درع مع مقدس طاقة, مؤقتًا overriding any existing نقش and مسببًا the درع to block an extra 1 point of ضرر.\n\nأدوار Remaining: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=The فارس مقدس لديه imbued الخاص بهم worn درع مع مقدس طاقة, مسببًا the درع to block an extra 3 نقاط of ضرر.\n\nCasting other تعاويذ بينما مقدس ward is active سوف extend its مدة by 10 أدوار per اشحن spent.\n\nأدوار Remaining: %s.

actors.hero.spells.holyweapon.name=مقدس سلاح
actors.hero.spells.holyweapon.ench_name=مقدس %s
actors.hero.spells.holyweapon.ench_desc=أعداء struck by a مقدس سلاح سوف take extra سحري ضرر.
actors.hero.spells.holyweapon.short_desc=مؤقتًا overrides enchantments to boost ضرر.
actors.hero.spells.holyweapon.desc=The رجل دين enchants الخاص بهم worn سلاح مع مقدس طاقة, مسببًا the سلاح to صفقة an additional 2 سحري ضرر any time هم strike an عدو مع it. هذا تعويذة takes لا time to cast.\n\nهذا تعويذة lasts for 50 أدوار, and سوف override any beneficial تعويذة the سلاح لديه for the مدة. Unarmed strikes يمكن also benefit من هذا التأثير.
actors.hero.spells.holyweapon.desc_paladin=_This spell is more powerful when cast by the Paladin._ The additional سحري ضرر is increased to 6, the تعويذة لا longer overrides existing enchantments, and casting other تعاويذ بينما مقدس سلاح is active سوف extend its مدة by 10 أدوار per اشحن يُستخدم.
actors.hero.spells.holyweapon$holywepbuff.name=مقدس سلاح
actors.hero.spells.holyweapon$holywepbuff.desc=The رجل دين لديه imbued الخاص بهم worn سلاح مع مقدس طاقة, مؤقتًا overriding any existing تعويذة and مسببًا the سلاح to صفقة an extra 2 سحري ضرر on each هجوم.\n\nأدوار Remaining: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=The فارس مقدس لديه imbued الخاص بهم worn سلاح مع مقدس طاقة, مسببًا الخاص بهم هجمات to صفقة an extra 6 سحري ضرر.\n\nCasting other تعاويذ بينما مقدس سلاح is active سوف extend its مدة by 10 أدوار per اشحن spent.\n\nأدوار Remaining: %s.

actors.hero.spells.judgement.name=judgement
actors.hero.spells.judgement.short_desc=Damages all مرئي أعداء.
actors.hero.spells.judgement.desc=The رجل دين slams الخاص بهم fist onإلى ground, مسببًا an eruption of ضوء ذلك يسبب ضرر to جميع الأعداء هم يمكن see. هذا يسبب %1$d-%2$d ضرر at base, but also يسبب an additional 33%% ضرر for each تعويذة the رجل دين لديه cast since entering ascended form (or since هم last cast Judgement).\n\nCurrently Judgement سوف صفقة %3$d-%4$d ضرر.

actors.hero.spells.layonhands.name=lay on hands
actors.hero.spells.layonhands.short_desc=فورًا heals an adjacent شخصية or shields the فارس مقدس.
actors.hero.spells.layonhands.desc=The فارس مقدس channels مقدس طاقة عبر الخاص بهم hands, علاج or protecting whatever هم يلمس.\n\nThe فارس مقدس يمكن cast هذا تعويذة on any adjacent شخصية to give them %1$d علاج, or on themselves to يكتسب %1$d تحصين. Excess علاج من هذا تعويذة is converted إلى تحصين.\n\nهذا تعويذة is cast instantaneously and يمكن أن يكون cast repeatedly, but لا يمكن grant more than ثلاثة casts worth of تحصين at a time.

actors.hero.spells.lifelinkspell.name=life link
actors.hero.spells.lifelinkspell.short_desc=Shares ضرر مع an حليف, and يقلل الخاص بهم ضرر taken.
actors.hero.spells.lifelinkspell.desc=The رجل دين strengthens the link between themselves and الخاص بهم empowered حليف. مع هذا empowered link, any ضرر taken سيكون shared between both البطل and الخاص بهم حليف for %1$d أدوار, and قوة of Many's defensive boost سيكون increased to -%2$d%% ضرر taken. Note ذلك the ضرر is shared بعد درع, but قبل قوة of Many's ضرر reduction.\n\nبينما هذا التأثير is active, beneficial رجل دين تعاويذ of T3 or أسفل سوف طبّق to both the رجل دين and الخاص بهم حليف if هم قد لديك just مطبّق to واحد of them.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=life link protection
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=The رجل دين recently cast Life Link on هذا حليف.\n\nIn addition to Life Link's عادي benefits, هذا شخصية also takes reduced ضرر, any positive رجل دين تعاويذ are مطبّق to both the رجل دين and هذا حليف بدلًا من just واحد, and قوة of Many لن expire بينما هذا تعزيز is active.\n\nأدوار Remaining: %s.

actors.hero.spells.mindform.name=mind form
actors.hero.spells.mindform.short_desc=Assigns Trinity to a عصا سحرية or مقذوف سلاح.
actors.hero.spells.mindform.desc=The رجل دين chooses a عصا سحرية or مقذوف أسلحة ذلك هم لديك معروف هذا لعبة and imbues Trinity مع its تأثير.\n\nعندما Trinity is يُستخدم, The رجل دين يمكن make a single هجوم as if هم were باستخدام the chosen عنصر at +%d. هذا سوف trigger all تأثيرات ذلك باستخدام ذلك type of عنصر قد normally trigger.\n\nهذا تعويذة replaces any other mind تأثير ذلك Trinity is currently imbued مع.

actors.hero.spells.mnemonicprayer.name=mnemonic prayer
actors.hero.spells.mnemonicprayer.short_desc=Extends التعزيزات/debuffs on an حليف/عدو, & re-applies illuminated.
actors.hero.spells.mnemonicprayer.desc=The Priest utters a prayer ذلك extends the مدة of all التعزيزات or debuffs on a specific هدف by %1$d أدوار. هذا تعويذة takes لا time to cast. Positive تأثيرات سوف last longer on حلفاء (including the Priest themselves), and harmful تأثيرات سوف last longer on أعداء.\n\nMnemonic Prayer يمكن only extend a specific instance of a تعزيز or debuff once, and لا يمكن extend التعزيزات granted من درع قدرات.

actors.hero.spells.radiance.name=radiance
actors.hero.spells.radiance.short_desc=Illuminates and لفترة وجيزة stuns مرئي أعداء.
actors.hero.spells.radiance.desc=The Priest erupts in مقدس ضوء, stunning all مرئي أعداء for 3 أدوار. If an عدو is already illuminated, Radiance سوف trigger illuminate's مكافأة إضافية ضرر and then طبّق the illuminated debuff. Radiance سوف also cause the Priest to glow for 100 أدوار if the current طابق is مظلم.

actors.hero.spells.recallinscription.name=recall inscription
actors.hero.spells.recallinscription.short_desc=Repeats a recently يُستخدم حجر رون or لفافة.
actors.hero.spells.recallinscription.desc=The رجل دين يستخدم مقدس سحر to re-cast the تأثير of a سحري rune تم العثور على on a حجر رون or لفافة هم يُستخدم in the last %s أدوار.\n\nRecall Inscription لا يمكن أن يكون يُستخدم to replicate لفائف of ترقية. هذا تعويذة's اشحن تكلفة varies based on which عنصر was يُستخدم recently: 2 for a حجر رون, 3 for a لفافة, 4 for an exotic لفافة. هذا اشحن تكلفة is also doubled عندما replicating a لفافة of transmutation, or خيمياء عناصر ذلك يجب be مصنوع باستخدام transmutation or ترقية.
actors.hero.spells.recallinscription$useditemtracker.name=recently يُستخدم rune
actors.hero.spells.recallinscription$useditemtracker.desc=The رجل دين لديه recently يُستخدم an عنصر ذلك works مع inscribed recall تعويذة. The رجل دين يمكن cast the تعويذة to repeat the عنصر's تأثير.\n\nعنصر يُستخدم: %1$s.\n\nأدوار Remaining: %2$s.

actors.hero.spells.shieldoflight.name=درع of ضوء
actors.hero.spells.shieldoflight.short_desc=Grants temporary درع aيحصل علىt a هدف.
actors.hero.spells.shieldoflight.desc=The رجل دين creates a رقيق barrier of ضوء between themselves and an عدو, increasing الخاص بهم درع's block قوة aيحصل علىt ذلك عدو by %1$d-%2$d for 5 أدوار.\n\nهذا تعويذة takes لا time to cast, but لا يمكن أن يكون يُستخدم aيحصل علىt multiple targets simultaneously.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=درع of ضوء
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=A رقيق درع of ضوء is واقف between هذا شخصية and an عدو. إنه not قوي enough to outright block هجمات, but سوف sغالبًا them.\n\nأدوار Remaining: %s

actors.hero.spells.spiritform.name=روح form
actors.hero.spells.spiritform.short_desc=Assigns Trinity to a خاتم or أثر.
actors.hero.spells.spiritform.desc=The رجل دين chooses a خاتم or أثر ذلك هم لديك معروف هذا لعبة (except the مقدس tome) and imbues Trinity مع its تأثير.\n\nIf a خاتم is chosen, then Trinity grants ذلك خاتم's تأثير at +%1$d for 20 أدوار.\n\nIf an أثر is chosen, then Trinity replicates ذلك أثر's تأثير at +%2$d. Each أثر لديه different specific behaviors and درع اشحن يكلّف عندما يُستخدم مع Trinity.\n\nهذا تعويذة replaces any other روح تأثير ذلك Trinity is currently imbued مع.
actors.hero.spells.spiritform$spiritformbuff.name=روح form
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity's روح form is currently granting أنت the قوة of an عنصر, as if أنت had it مجهّز.\n\nNote ذلك روح form لا يمكن provide another copy of an تأثير ذلك أنت're already benefitting من.\n\nCurrent تأثير: %1$s.\n\nأدوار Remaining: %2$s.

actors.hero.spells.smite.name=smite
actors.hero.spells.smite.short_desc=Guarantees a يضرب مع مكافأة إضافية ضرر and enchant قوة.
actors.hero.spells.smite.desc=The فارس مقدس infيستخدم a اشتباك strike مع righteous destructive قوة.\n\nIn addition to مسببًا عادي ضرر اشتباك, Smite يجعل non-encumbered هجمات guaranteed to يضرب, لديه +300%% تعويذة قوة, and يسبب %1$d - %2$d مكافأة إضافية سحر ضرر.\n\nSmite's مكافأة إضافية سحر ضرر scales مع فارس مقدس's مستوى, and it سوف دائمًا صفقة الأقصى مكافأة إضافية سحر ضرر aيحصل علىt undead or demonic foes.

actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Removes حليف من الزنزانة and preserves them.
actors.hero.spells.stasis.desc=The رجل دين focيستخدم الخاص بهم connection معir حليف toward themselves, مسببًا the حليف to be مؤقتًا held in a sort of طاقة stasis داخل the رجل دين. The حليف سيكون preserved for up to %d أدوار, مع all positive تأثيرات on them being unaffected by الخاص بهم time in stasis.\n\nThe حليف سوف appear next إلى رجل دين عندما stasis ends naturally or هم يمكن فورًا re-cast the تعويذة at لا تكلفة to end the تأثير early. Stasis يمكن even تحرك immobile حلفاء, but لا يمكن transfer them between طوابق.
actors.hero.spells.stasis$stasisbuff.name=حليف in stasis
actors.hero.spells.stasis$stasisbuff.left_behind=خاصتك immobile حليف is يسار behind.
actors.hero.spells.stasis$stasisbuff.desc=The رجل دين currently لديه an حليف stored in stasis. All positive تأثيرات on هذا حليف are preserved, including قوة of Many, and هم سوف reappear next إلى رجل دين عندما the تأثير ends. The تأثير يمكن also be ended early by re-casting Stasis.\n\nحليف in stasis: %1$s.\nأدوار Remaining: %2$s.

actors.hero.spells.sunray.name=sunray
actors.hero.spells.sunray.short_desc=يسبب بعيد المدى سحر ضرر and blinds a هدف once.
actors.hero.spells.sunray.desc=The رجل دين fires a ray of blinding ضوء at a هدف, مسببًا %1$d-%2$d ضرر and blinding them for %3$d أدوار. Sunray دائمًا يسبب الأقصى ضرر to undead and demonic targets.\n\nبعد أن يتم struck مع هذا تعويذة an عدو's vision سوف adjust, preventing them من being blinded by it again. لكن, if هم are struck again بينما blinded by هذا تعويذة, then the ضوء is overwhelming and paralyses them instead.

actors.hero.spells.walloflight.name=جدار of ضوء
actors.hero.spells.walloflight.short_desc=Creates a جدار ذلك blocks أعداء.
actors.hero.spells.walloflight.desc=The فارس مقدس creates a جدار مصنوع out of panels of صلب ضوء directly in front of themselves which is 1 tile سميك, %1$d tiles wide, and lasts for 20 أدوار.\n\nهذا جدار acts just like a عادي واحد, except it يمكن أن يكون seen عبر. أعداء ذلك are caught in the جدار عندما its تم إنشاؤه سيكون momentarily مذهول and pushed للخلف if possible. Anything stuck in the جدار سيكون able to تحرك out of it.\n\nThe جدار يمكن أن يكون cast in any of the أربعة cardinal or أربعة diagonal directions. If a جدار is already active, the تعويذة يمكن أن يكون re-يُستخدم for مجاني to فورًا clear the جدار.
actors.hero.spells.walloflight.early_end=أنت dispel the جدار of ضوء.
actors.hero.spells.walloflight$lightwall.desc=Shimmering panels of ضوء are حجب passage هنا.

##main hero
actors.hero.hero.name=أنت
actors.hero.hero.leave=أنت يمكن't leave yet, the rest of الزنزانة awaits أسفل!
actors.hero.hero.level_up=مستوى up!
actors.hero.hero.new_level=مستوى up! +دقة, +مراوغة, +5 HP!
actors.hero.hero.new_talent=+1 موهبة Point!
actors.hero.hero.unspent=أنت لديك unspent موهبة نقاط!
actors.hero.hero.level_cap=أنت لا يمكن grow stronger, but خاصتك experiences do give أنت a surge of قوة!
actors.hero.hero.you_now_have=أنت تم التقاطه up: %s.
actors.hero.hero.you_cant_have=أنت يمكن't carry: %s.
actors.hero.hero.locked_chest=هذا chest is مقفل and أنت لا لديك a matching مفتاح.
actors.hero.hero.locked_door=أنت لا لديك a matching مفتاح.
actors.hero.hero.noticed_smth=أنت noticed something.
actors.hero.hero.wait=...
actors.hero.hero.search=search
actors.hero.hero.search_distracted=إنه صعب to concentrate, searching is exhausting.
actors.hero.hero.key_distracted=أنت يمكن't quite احصل على the قفل مفتوح, أنت'll لديك to keep trying.
actors.hero.hero.pain_resist=The pain helps أنت resist the urge to sleep.
actors.hero.hero.revive=The ankh explodes مع life-giving طاقة!

##classes
actors.hero.heroclass.warrior=محارب
actors.hero.heroclass.warrior_desc_short=The محارب endures extra ضرر مع تحصين granted by his _broken seal._ The seal يمكن أن يكون moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The محارب starts مع a _unique broken seal_ ذلك grants him a burst of تحصين عندما he is أسفل half صحة. The seal يمكن أن يكون moved between armors, and يمكن _transfer a single upgrade_ مع it.\n\nThe محارب also starts مع a _worn shortsword_, _three throwing stones_, قماش درع, a waterskin, and a velvet pouch.\n\nThe محارب automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of علاج\n_-_ لفائف of Rage
actors.hero.heroclass.warrior_unlock=The محارب is automatically unlocked.

actors.hero.heroclass.mage=ساحر
actors.hero.heroclass.mage_desc_short=The ساحر is an arcane expert and carries a _magical staff_ ذلك's stronger than a عصا سحرية. The staff يمكن أن يكون _imbued with any wand_ the ساحر finds.
actors.hero.heroclass.mage_desc=The ساحر starts مع a _unique staff_, which recharges significantly faster than a عصا سحرية and لديه 1 more اشحن. The staff _can be imbued with any wand_ the ساحر finds في الزنزانة.\n\nThe ساحر also starts مع a _wand of magic missile_ imbued in his staff, قماش درع, a waterskin, and a velvet pouch.\n\nThe ساحر automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of سائل لهب\n_-_ لفائف of ترقية
actors.hero.heroclass.mage_unlock=To unlock the ساحر _use a scroll of upgrade to make an item stronger._

actors.hero.heroclass.rogue=لص
actors.hero.heroclass.rogue_desc_short=The لص يمكن evade أعداء and strike من اختفاء باستخدام his _cloak of shadows._ He also _detects secrets and traps_ من a greater distance.
actors.hero.heroclass.rogue_desc=The لص starts مع a _unique Cloak of Shadows_, which he يمكن استخدم to become inمرئي at سوف.\n\nThe لص يمكن _detect secrets and traps_ من a greater distance.\n\nThe لص also starts مع _a dagger_, _three throwing knives_, قماش درع, a waterskin, and a velvet pouch.\n\nThe لص automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of اختفاء\n_-_ لفائف of سحر Mapping
actors.hero.heroclass.rogue_unlock=To unlock the لص _perform 10 surprise attacks in one game._

actors.hero.heroclass.huntress=صيادة
actors.hero.heroclass.huntress_desc_short=The صيادة is a master of مقذوف أسلحة and لديه a _magical bow_ مع infinite arrows. She also travels عبر tall عشب _without trampling it._
actors.hero.heroclass.huntress_desc=The صيادة starts مع a _unique spirit bow_, which يمكن نار an infinite number of conjured arrows.\n\nThe صيادة يمكن travel عبر tall عشب _without trampling it_.\n\nThe صيادة also starts مع _studded gloves_, قماش درع, a waterskin, and a velvet pouch.\n\nThe صيادة automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of Mind Vision\n_-_ لفائف of Lullaby
actors.hero.heroclass.huntress_unlock=To unlock the صيادة _hit enemies with thrown weapons 10 times in one game._

actors.hero.heroclass.duelist=مبارز
actors.hero.heroclass.duelist_desc_short=The مبارز is a أسلحة master who يمكن استخدم her سلاح to trigger a _special weapon ability._ هذا قدرة خاصة is _different for every weapon._
actors.hero.heroclass.duelist_desc=The مبارز starts مع a _unique rapier_ مع a قدرة خاصة ذلك recharges فوق time.\n\nEvery سلاح in the لعبة لديه a _different special ability_ ذلك the مبارز يمكن استخدم.\n\nThe مبارز also starts مع _two throwing spikes_, قماش درع, a waterskin, and a velvet pouch.\n\nThe مبارز automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of قوة\n_-_ لفائف of Mirror Image
actors.hero.heroclass.duelist_unlock=To unlock the مبارز _equip a tier 2 or higher weapon with no strength penalty._

actors.hero.heroclass.cleric=رجل دين
actors.hero.heroclass.cleric_desc_short=The رجل دين is a divine spellcaster who يستخدم الخاص بهم فريد _holy tome_ to channel divine سحر. هم يمكن _learn and upgrade spells_ via مواهب.
actors.hero.heroclass.cleric_desc=The رجل دين starts مع a _unique holy tome_, which هم يمكن استخدم to cast various تعاويذ.\n\nMost of the رجل دين's مواهب are focيُستخدم حول learning or upgrading تعاويذ.\n\nThe رجل دين also starts مع _a cudgel_, قماش درع, a waterskin, and a velvet pouch.\n\nThe رجل دين automatically identifies:\n_-_ لفائف of تعرّف\n_-_ جرعات of Purity\n_-_ لفائف of يزيل لعنة
actors.hero.heroclass.cleric_unlock=To unlock the رجل دين _fully cleanse the curse on any piece of cursed equipment._

actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_short_desc=The _Berserker_ builds rage as he takes ضرر. Rage يزيد his ضرر and يمكن أن يكون activated at 100% for مكافأة إضافية تحصين.
actors.hero.herosubclass.berserker_desc=The Berserker يحصل على rage as he takes ضرر جسدي, including ضرر ذلك gets blocked by his درع! Rage steadily fades بعيدًا فوق time, but fades more ببطء if he is at low HP.\n\nRage يمكن cause the Berserker to صفقة up to +50% ضرر. At max rage he يمكن go berserk, gaining a burst of تحصين and keeping his rage as long as he لديه تحصين يسار. The تحصين scales مع مستوى of the berserker's درع, and يمكن أن يكون massively boosted if he is at low صحة. The Berserker يحتاج time to recover بعد he goes berserk.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_short_desc=The _Gladiator_ builds combo عندما he يجعل successful هجمات. He يمكن spend combo to استخدم فريد قدرات.
actors.hero.herosubclass.gladiator_desc=The Gladiator builds واحد point of combo every time he يجعل a successful هجوم مع a اشتباك or مقذوف سلاح. If the Gladiator does not make a successful هجوم داخل 5 أدوار (15 أدوار بعد a يقتل), his combo is reset.\n\nAs he builds combo the Gladiator يمكن استخدم a variety of قدرات ذلك are guaranteed to يضرب:\n2 Combo: knock عدو للخلف, preserves combo\n4 Combo: صفقة ضرر based on درع\n6 Combo: parry, preserves combo\n8 Combo: ضرر هدف and الأعداء القريبون\n10 Combo: هجوم once for each combo
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures مكافأة إضافية تأثيرات عندما fighting in اشتباك مع his staff. هذه تأثيرات depend on the عصا سحرية his staff is imbued مع.
actors.hero.herosubclass.battlemage_desc=The Battlemage يحصل على a مكافأة إضافية تأثير wheأبدًا he strikes in اشتباك مع his staff, as if his staff had an additional تعويذة. هذه تأثيرات depend on the عصا سحرية his staff is imbued مع, every عصا سحرية لديه its own تأثير. In addition إلى عصا سحرية تأثيرات, the Battlemage's staff سوف also يكتسب 0.5 شحنات عندما he strikes مع it.
actors.hero.herosubclass.warlock=ساحر ظلام
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ لديه a احتمال to soul mark أعداء مع his عصي سحرية. He سوف شفاء wheأبدًا he يسبب ضرر جسدي to marked أعداء.
actors.hero.herosubclass.warlock_desc=The ساحر ظلام لديه a احتمال to inflict a soul mark on شخصيات عندما he يستخدم عصي سحرية on them. The احتمال to طبّق a soul mark and its مدة increase مع عصا سحرية مستوى.\n\nعندما an عدو is soul marked, the ساحر ظلام سوف شفاء 2 hp for every 5 ضرر he يسبب إلىm, but only مع هجمات من اشتباك or مقذوف أسلحة, not من عصي سحرية!
actors.hero.herosubclass.assassin=assassin
actors.hero.herosubclass.assassin_short_desc=The _Assassin_ يمكن prepare a قاتل strike بينما he is inمرئي. The longer he waits, the more قوي the هجوم سيكون.
actors.hero.herosubclass.assassin_desc=The Assassin prepares his next strike عندما he يصبح inمرئي. The longer he prepares for, the more قوي his next هجوم سيكون. Preparation builds for up to 9 أدوار.\n\nبعد preparing, the Assassin يسبب مكافأة إضافية ضرر on his next هجوم, يمكن blink to his هدف, and يمكن even فورًا يقتل أعداء who are ضعيف enough.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_short_desc=The _Freerunner_ builds momentum as he runs, which يمكن أن يكون يُستخدم to start freerunning. هذا grants him مكافأة إضافية speed and مراوغة for a short بينما.
actors.hero.herosubclass.freerunner_desc=As the Freerunner يتحرك he builds stacks of momentum. He يمكن يكتسب up to 10 momentum بعد running for 10 أدوار, but بسرعة يفقد it if he stops يتحرك. The freerunner يمكن استخدم up his momentum to start freerunning, for 2 أدوار per point of momentum.\n\nعندما freerunning the Freerunner يتحرك at 2x speed, and يحصل على مكافأة إضافية مراوغة in proportion to his مستوى. Once freerunning ends يوجد a cooldown قبل momentum يمكن أن يكون مبني again.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ يمكن pierce درع مع her بعيد المدى هجمات. بعد striking مع a مقذوف سلاح she يمكن follow up مع a خاص هجوم من her قوس.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of بعيد المدى combat, whose بعيد المدى هجمات pierce عدو درع. عندما she هجمات an عدو مع a مقذوف سلاح, she places a sniper's mark on them, which يسمح her follow up مع a خاص هجوم من her قوس. هذا خاص هجوم varies based on how her قوس is augmented.\n\nAn unaugmented قوس سوف نار a snapshot which يسبب reduced ضرر but fires فورًا. A speed قوس سوف نار a volley of ثلاثة arrows which صفقة reduced ضرر, يمكن still activate enchantments, and take 1 دور to نار. A ضرر قوس سوف نار a sniper shot which is guaranteed to يضرب, يسبب مكافأة إضافية ضرر based on distance, and takes 2 أدوار to نار.
actors.hero.herosubclass.warden=الحارسة
actors.hero.herosubclass.warden_short_desc=The _Warden_ يمكن see عبر tall عشب and يحصل على مكافأة إضافية تأثيرات عندما she نباتات بذور and tramples نباتات.
actors.hero.herosubclass.warden_desc=The الحارسة لديه a قوي connection to الطبيعة which grants her a variety of مكافأة إضافية تأثيرات relating to عشب and نباتات. She is able to see عبر tall and furrowed عشب as if it were empty space.\n\nThe الحارسة يسبب عشب to sprout up حول any بذرة she throws or نباتات, and يحصل على تأثير خاصs عندما trampling نباتات. هذه تأثير خاصs replace the عادي نبات تأثيرات, meaning ذلك لا نبات is harmful for her to خطوة on.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ يمكن wield اثنان أسلحة and gets more سلاح شحنات. Her عادي هجمات استخدم her primary سلاح, but she يمكن swap أسلحة and استخدم either سلاح's قدرة.
actors.hero.herosubclass.champion_desc=The Champion is a master of اشتباك أسلحة who يمكن جهّز a secondary سلاح in addition to her primary واحد. Her عادي هجمات استخدم her primary سلاح, but she يمكن swap her primary سلاح فورًا and استخدم either سلاح's قدرة.\n\nShe also يحصل على 2 more max سلاح قدرة شحنات and +50% سلاح قدرة إعادة شحن speed.
actors.hero.herosubclass.monk=راهب
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds طاقة بينما fighting. هذا طاقة يمكن أن يكون spent on a variety of فريد قدرات.
actors.hero.herosubclass.monk_desc=The راهب is a master of جسدي technique. As she defeats أعداء, she يحصل على طاقة which يمكن أن يكون يُستخدم on a variety of defensive and utility-focيُستخدم قدرات. هذا طاقة does not fade فوق time, but لديه a cap based on the راهب's مستوى.\n\n1 طاقة: بسرعة strike مع fists\n2 طاقة: focus to dodge next هجوم\n3 طاقة: فورًا dash بالقرب\n4 طاقة: kick an عدو بعيدًا\n5 طاقة: meditate to clear statيستخدم and restore عصا سحرية & أثر اشحن
actors.hero.herosubclass.priest=priest
actors.hero.herosubclass.priest_short_desc=The _Priest_ يحصل على new long-range تعاويذ and an empowered version of guiding ضوء.
actors.hero.herosubclass.priest_desc=The Priest يحصل على a variety of new and مُرقّى تعاويذ ذلك emphasize بعيد المدى combat and synergy مع سحري عناصر.\n\nThe Priest يمكن cast _Guiding Light_ for مجاني once every 50 أدوار, illuminates أعداء directly targeted by any of الخاص بهم تعاويذ, and يمكن consume the illumination debuff مع حلفاء, عصي سحرية, and some الآثار for مكافأة إضافية ضرر equal إلىir مستوى + 5.\n\nThe Priest also يحصل على the _Radiance_ تعويذة, which dispels ظلام and affects all مرئي أعداء, triggering and applying illuminate and لفترة وجيزة stunning them at the تكلفة of 2 شحنات.
actors.hero.herosubclass.paladin=فارس مقدس
actors.hero.herosubclass.paladin_short_desc=The _Paladin_ يحصل على new short-range تعاويذ and empowered versions of مقدس سلاح and ward.
actors.hero.herosubclass.paladin_desc=The فارس مقدس يحصل على a variety of new and مُرقّى تعاويذ ذلك emphasize اشتباك combat and synergy مع أسلحة and درع.\n\nThe فارس مقدس's _Holy Weapon_ and _Holy Ward_ تعاويذ grant larger bonيستخدم, لا longer override existing enchantments and glyphs, and يمكن أن يكون extended by casting other تعاويذ.\n\nThe فارس مقدس also يحصل على the _Smite_ تعويذة, which يسمح them perform a guaranteed اشتباك يضرب مع مكافأة إضافية ضرر and تعويذة قوة.

##talents
actors.hero.talent$provokedangertracker.name=provoked anger
actors.hero.talent$provokedangertracker.desc=The محارب لديه recently فقد his تحصين, his next جسدي هجوم سوف صفقة مكافأة إضافية ضرر.\n\nأدوار remaining: %s.
actors.hero.talent$lingeringmagictracker.name=lingering سحر
actors.hero.talent$lingeringmagictracker.desc=The ساحر لديه recently يُستخدم a staff or عصا سحرية, his next جسدي هجوم سوف صفقة مكافأة إضافية ضرر.\n\nأدوار remaining: %s.
actors.hero.talent$followupstriketracker.name=followup strike
actors.hero.talent$followupstriketracker.desc=The صيادة لديه recently attacked an عدو مع a مقذوف سلاح, her next اشتباك هجوم aيحصل علىt the same هدف سوف لديك boosted ضرر.\n\nأدوار remaining: %s.
actors.hero.talent$patientstriketracker.name=patient strike
actors.hero.talent$patientstriketracker.desc=The مبارز لديه just spent a دور waiting, her next اشتباك هجوم سوف صفقة مكافأة إضافية ضرر.
