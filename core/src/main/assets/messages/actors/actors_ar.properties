#warrior
actors.hero.talent.hearty_meal.title=hearty meal
actors.hero.talent.hearty_meal.desc=_+1:_ Eating طعام heals the محارب for _4 HP_ عندما he is at or أسفل 33% صحة.\n\n_+2:_ Eating طعام heals the محارب for _6 HP_ عندما he is at or أسفل 33% صحة.
actors.hero.talent.veterans_intuition.title=veteran's intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ The محارب identifies أسلحة _1.75x faster_ and درع _2.5x faster_.\n\n_+2:_ The محارب identifies أسلحة _2.5x faster_ and درع _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ عندما any تحصين تعزيز مطبّق إلى محارب is مكسور by ضرر, his next جسدي هجوم سوف صفقة _3 bonus damage_.\n\n_+2:_ عندما any تحصين تعزيز مطبّق إلى محارب is مكسور by ضرر, his next جسدي هجوم سوف صفقة _5 bonus damage_.
actors.hero.talent.iron_will.title=حديد سوف
actors.hero.talent.iron_will.desc=_+1:_ The درع provided by the محارب's seal is _increased by 1_.\n\n_+2:_ The درع provided by the محارب's seal is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it سوف passively grant a 1 or 2 max درع version of the محارب's مكسور seal تأثير.

actors.hero.talent.iron_stomach.title=حديد stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating طعام takes the محارب 1 دور and grants him _75% damage resistance_ بينما eating.\n\n_+2:_ Eating طعام takes the محارب 1 دور and grants him _100% damage resistance_ بينما eating.
actors.hero.talent.liquid_willpower.title=سائل willpower
actors.hero.talent.liquid_willpower.desc=_+1:_ The محارب يحصل على _6.5% of his max HP in shielding_ عندما drinking or يرمي a جرعة, brew, or elixir.\n\n_+2:_ The محارب يحصل على _10% of his max HP in shielding_ عندما drinking or يرمي a جرعة, brew, or elixir.\n\nThe درع amount is doubled عندما باستخدام جرعات of قوة, خبرة, or خيمياء عناصر ذلك يجب be مصنوع باستخدام تلك جرعات.\n\nFor خيمياء عناصر مع higher output quantities (e.g. aqua brew), هذا موهبة لديه a احتمال to trigger based on how many of ذلك عنصر is produced.
actors.hero.talent.runic_transference.title=runic transference
actors.hero.talent.runic_transference.desc=_+1:_ The محارب's مكسور seal يمكن transfer _regular glyphs_ in the same way it transfers an ترقية.\n\n_+2:_ The محارب's مكسور seal يمكن transfer _regular, powerful, and curse glyphs_ in the same way it transfers an ترقية.\n\nThe seal يمكن only transfer glyphs if هم were مطبّق إلى درع عندما the seal was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it سوف instead help glyphs on خاصتك درع resist being تمت إزالته by لفائف of ترقية. Glyphs سيكونgin to be فقد عندما upgrading من مستوى 6(up من 4) at +1, or مستوى 7(up من 4) at +2. المستوى حيث glyphs are guaranteed to be فقد is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ عندما the محارب lands a killing blow on an عدو مع a جسدي سلاح, it لديه a _67% chance_ to take 0 أدوار.\n\n_+2:_ عندما the محارب lands a killing blow on an عدو مع a جسدي سلاح, it لديه a _100% chance_ to take 0 أدوار.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The محارب يمكن أعمى an عدو for _2 turns_ by يرمي any عنصر ذلك isn’t a مقذوف سلاح at them. هذا لديه a 50 دور cooldown.\n\n_+2:_ The محارب يمكن أعمى an عدو for _3 turns_ by يرمي any عنصر ذلك isn’t a مقذوف سلاح at them. هذا لديه a 50 دور cooldown.

actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ عندما the محارب waits he يحصل على _1-2 armor_ and slows the decay of combo and تحصين التعزيزات by _50%_ until he يتحرك.\n\n_+2:_ عندما the محارب waits he يحصل على _2-4 armor_ and slows the decay of combo and تحصين التعزيزات by _75%_ until he يتحرك.\n\n_+3:_ عندما the محارب waits he يحصل على _3-6 armor_ and slows the decay of combo and تحصين التعزيزات by _100%_ until he يتحرك.
actors.hero.talent.strongman.title=strongman
actors.hero.talent.strongman.desc=_+1:_ The محارب's قوة is _increased by 8%_, rounded down.\n\n_+2:_ The محارب's قوة is _increased by 13%_, rounded down.\n\n_+3:_ The محارب's قوة is _increased by 18%_, rounded down.

actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Berserker يمكن reach a max of _116% rage_.\n\n_+2:_ The Berserker يمكن reach a max of _133% rage_.\n\n_+3:_ The Berserker يمكن reach a max of _150% rage_.\n\nEach point of rage أعلى 100% يزيد berserk تحصين by 1% and يقلل cooldown by 1%, but does not increase the ضرر مكافأة إضافية beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Berserker is about to يموت and rage is at or أعلى 100%, but it لديه a cooldown of _3 hero levels_ عندما هذا happens.\n\n_+2:_ Berserk automatically triggers if the Berserker is about to يموت and rage is at or أعلى 100%, but it لديه a cooldown of _2 hero levels_ عندما هذا happens.\n\n_+3:_ Berserk automatically triggers if the Berserker is about to يموت and rage is at or أعلى 100%, but it لديه a cooldown of _1 hero level_ عندما هذا happens.\n\nNote ذلك the Berserker سوف still يموت if he لديه 0 HP عندما berserking ends.
actors.hero.talent.enraged_catalyst.title=enraged محفز
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and اللعنات on the Berserker's سلاح trigger more غالبًا the more rage he لديه, to a الأقصى of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and اللعنات on the Berserker's سلاح trigger more غالبًا the more rage he لديه, to a الأقصى of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and اللعنات on the Berserker's سلاح trigger more غالبًا the more rage he لديه, to a الأقصى of _45% more often_ at 100% rage.

actors.hero.talent.cleave.title=cleave
actors.hero.talent.cleave.desc=_+1:_ The extra time the Gladiator gets on a يقتل is increased to _30 turns_, من 15.\n\n_+2:_ The extra time the Gladiator gets on a يقتل is increased to _45 turns_, من 15.\n\n_+3:_ The extra time the Gladiator gets on a يقتل is increased to _60 turns_, من 15.
actors.hero.talent.lethal_defense.title=lethal دفاع
actors.hero.talent.lethal_defense.desc=_+1:_ عندما the Gladiator kills an عدو مع a combo تحرك, the cooldown on his مكسور seal تحصين is _reduced by 50 turns_.\n\n_+2:_ عندما the Gladiator kills an عدو مع a combo تحرك, the cooldown on his مكسور seal تحصين is _reduced by 100 turns_.\n\n_+3:_ عندما the Gladiator kills an عدو مع a combo تحرك, the cooldown on his مكسور seal تحصين is _reduced by 150 turns_.\n\nThe درع cooldown يمكن أن يكون reduced to as low as -150 أدوار by هذا موهبة, which means it سوف immediately be available again once it is activated.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ عندما the Gladiator's combo is 7 or higher, Clobber's knockback range يزيد to 3, it inflicts vertigo, and it يمكن knock أعداء إلى pits.\n\n_+2:_ In addition إلى benefits of +1, عندما the Gladiator's combo is 9 or higher Parry works on multiple هجمات.\n\n_+3:_ In addition إلى benefits of +1 and +2, the Gladiator يمكن leap up to combo/3 tiles عندما باستخدام Slam, Crush, or Fury.

actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ عندما the محارب lands بعد jumping, all adjacent أعداء take ضرر equal to _1-4 plus 25%_ of his ضرر حجب قوة.\n\n_+2:_ عندما the محارب lands بعد jumping, all adjacent أعداء take ضرر equal to _2-8 plus 50%_ of his ضرر حجب قوة.\n\n_+3:_ عندما the محارب lands بعد jumping, all adjacent أعداء take ضرر equal to _3-12 plus 75%_ of his ضرر حجب قوة.\n\n_+4:_ عندما the محارب lands بعد jumping, all adjacent أعداء take ضرر equal to _4-16 plus 100%_ of his ضرر حجب قوة.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ عندما the محارب lands بعد jumping, all adjacent أعداء are knocked _2 tiles_ للخلف and لديك a _25% chance_ of becoming vulnerable for 5 أدوار.\n\n_+2:_ عندما the محارب lands بعد jumping, all adjacent أعداء are knocked _3 tiles_ للخلف and لديك a _50% chance_ of becoming vulnerable for 5 أدوار.\n\n_+3:_ عندما the محارب lands بعد jumping, all adjacent أعداء are knocked _4 tiles_ للخلف and لديك a _75% chance_ of becoming vulnerable for 5 أدوار.\n\n_+4:_ عندما the محارب lands بعد jumping, all adjacent أعداء are knocked _5 tiles_ للخلف and لديك a _100% chance_ of becoming vulnerable for 5 أدوار.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the محارب performs a الثاني leap داخل 3 أدوار, ذلك leap لديه a _16% reduced_ اشحن تكلفة.\n\n_+2:_ If the محارب performs a الثاني leap داخل 3 أدوار, ذلك leap لديه a _30% reduced_ اشحن تكلفة.\n\n_+3:_ If the محارب performs a الثاني leap داخل 3 أدوار, ذلك leap لديه a _40% reduced_ اشحن تكلفة.\n\n_+4:_ If the محارب performs a الثاني leap داخل 3 أدوار, ذلك leap لديه a _50% reduced_ اشحن تكلفة.

actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ من 5, and its width is increased to _75 degrees_ من 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ من 5, and its width is increased to _90 degrees_ من 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ من 5, and its width is increased to _105 degrees_ من 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ من 5, and its width is increased to _120 degrees_ من 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave لديه a _30% chance_ to also استخدم on-يضرب تأثيرات like enchantments and combo.\n\n_+2:_ Shockwave لديه a _60% chance_ to also استخدم on-يضرب تأثيرات like enchantments and combo.\n\n_+3:_ Shockwave لديه a _90% chance_ to also استخدم on-يضرب تأثيرات like enchantments and combo.\n\n_+4:_ Shockwave لديه a _100% chance_ to also استخدم on-يضرب تأثيرات like enchantments and combo, and it يمنح enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave يسبب _20% more damage_ and لديه a _25% chance_ to إذهال بدلًا من cripple.\n\n_+2:_ Shockwave يسبب _40% more damage_ and لديه a _50% chance_ to إذهال بدلًا من cripple.\n\n_+3:_ Shockwave يسبب _60% more damage_ and لديه a _75% chance_ to إذهال بدلًا من cripple.\n\n_+4:_ Shockwave يسبب _80% more damage_ and لديه a _100% chance_ to إذهال بدلًا من cripple.

actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The محارب يسبب _115% bonus damage_ spread فوق _2 hits_, بدلًا من 100% مكافأة إضافية ضرر in 1 يضرب.\n\n_+2:_ The محارب يسبب _130% bonus damage_ spread فوق _3 hits_, بدلًا من 100% مكافأة إضافية ضرر in 1 يضرب.\n\n_+3:_ The محارب يسبب _145% bonus damage_ spread فوق _4 hits_, بدلًا من 100% مكافأة إضافية ضرر in 1 يضرب.\n\n_+4:_ The محارب يسبب _160% bonus damage_ spread فوق _5 hits_, بدلًا من 100% مكافأة إضافية ضرر in 1 يضرب.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The محارب's ضرر reduction بينما enduring is _increased to 60%_, من 50%.\n\n_+2:_ The محارب's ضرر reduction بينما enduring is _increased to 68%_, من 50%.\n\n_+3:_ The محارب's ضرر reduction بينما enduring is _increased to 74%_, من 50%.\n\n_+4:_ The محارب's ضرر reduction بينما enduring is _increased to 80%_, من 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The محارب يسبب an additional _5% bonus damage_ for every عدو داخل 2 tiles عندما enduring ends.\n\n_+2:_ The محارب يسبب an additional _10% bonus damage_ for every عدو داخل 2 tiles عندما enduring ends.\n\n_+3:_ The محارب يسبب an additional _15% bonus damage_ for every عدو داخل 2 tiles عندما enduring ends.\n\n_+4:_ The محارب يسبب an additional _20% bonus damage_ for every عدو داخل 2 tiles عندما enduring ends.

#mage
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating طعام grants the ساحر _2 bonus damage_ on the next 3 times he يسبب ضرر مع a عصا سحرية.\n\n_+2:_ Eating طعام grants the ساحر _3 bonus damage_ on the next 3 times he يسبب ضرر مع a عصا سحرية.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The ساحر identifies عصي سحرية _3x faster_.\n\n_+2:_ The ساحر identifies عصي سحرية _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering سحر
actors.hero.talent.lingering_magic.desc=_+1:_ عندما the ساحر zaps مع a عصا سحرية or staff, his next جسدي هجوم يسبب _1-2 bonus damage_.\n\n_+2:_ عندما the ساحر zaps مع a عصا سحرية or staff, his next جسدي هجوم يسبب _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The ساحر يحصل على _3 shielding_ wheأبدًا he spends the last اشحن in his staff.\n\n_+2:_ The ساحر يحصل على _5 shielding_ wheأبدًا he spends the last اشحن in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it سوف instead trigger من البطل's highest مستوى عصا سحرية.

actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating طعام takes the ساحر 1 دور and grants him _5 turns of wand recharging_.\n\n_+2:_ Eating طعام takes the ساحر 1 دور and grants him _8 turns of wand recharging_.
actors.hero.talent.inscribed_power.title=inscribed قوة
actors.hero.talent.inscribed_power.desc=_+1:_ عندما the ساحر reads a لفافة or يستخدم a تعويذة عنصر, his _next 2 wand zaps_ احصل على +2 مستويات.\n\n_+2:_ عندما the ساحر reads a لفافة or يستخدم a تعويذة عنصر, his _next 3 wand zaps_ احصل على +2 مستويات.\n\nThe number of enhanced عصا سحرية zaps is doubled عندما باستخدام a لفافة of ترقية, transmutation, or خيمياء عناصر ذلك يجب be مصنوع باستخدام تلك لفائف.\n\nFor خيمياء عناصر مع higher output quantities (e.g. most تعاويذ), هذا موهبة لديه a احتمال to trigger based on how many of ذلك عنصر is produced.
actors.hero.talent.wand_preservation.title=عصا سحرية preservation
actors.hero.talent.wand_preservation.desc=_+1:_ عندما the ساحر imbues a new عصا سحرية إلى his staff, the قديم عصا سحرية is returned at +0, _but this can only be done once._\n\n_+2:_ عندما the ساحر imbues a new عصا سحرية إلى his staff, the قديم عصا سحرية is returned at +0, _this can be repeated with a one hero level cooldown._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it سوف instead increase the amount of arcane راتنج gained عندما putting a عصا سحرية إلى an خيمياء pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ عندما the ساحر zaps an عدو, he يحصل على mind vision on them for _10 turns_.\n\n_+2:_ عندما the ساحر zaps an عدو, he يحصل على mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=درع battery
actors.hero.talent.shield_battery.desc=_+1:_ The ساحر يمكن self-هدف مع a عصا سحرية to convert all of its شحنات إلى تحصين at a rate of _4% max HP per charge_.\n\n_+2:_ The ساحر يمكن self-هدف مع a عصا سحرية to convert all of its شحنات إلى تحصين at a rate of _6% max HP per charge_.

actors.hero.talent.desperate_power.title=desperate قوة
actors.hero.talent.desperate_power.desc=_+1:_ The ساحر's عصي سحرية and staff يكتسب _+1 level_ on الخاص بهم النهائي zap عندما هم are down إلىir last اشحن.\n\n_+2:_ The ساحر's عصي سحرية and staff يكتسب _+2 levels_ on الخاص بهم النهائي zap عندما هم are down إلىir last اشحن.\n\n_+3:_ The ساحر's عصي سحرية and staff يكتسب _+3 levels_ on الخاص بهم النهائي zap عندما هم are down إلىir last اشحن.
actors.hero.talent.ally_warp.title=حليف warp
actors.hero.talent.ally_warp.desc=_+1:_ The ساحر يمكن اختر an حليف to فورًا swap places معm, مع a _2 tile range_.\n\n_+2:_ The ساحر يمكن اختر an حليف to فورًا swap places معm, مع a _4 tile range_.\n\n_+3:_ The ساحر يمكن اختر an حليف to فورًا swap places معm, مع a _6 tile range_.\n\nThe ساحر لا يمكن swap places مع immobile حلفاء.

actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's الأول اشتباك strike مع his staff بعد zapping مع it يسبب _+16% damage_ and the staff's مكافأة إضافية تأثير gets _+50% power_.\n\n_+2:_ The Battlemage's الأول اشتباك strike مع his staff بعد zapping مع it يسبب _+33% damage_ and the staff's مكافأة إضافية تأثير gets _+100% power_.\n\n_+3:_ The Battlemage's الأول اشتباك strike مع his staff بعد zapping مع it يسبب _+50% damage_ and the staff's مكافأة إضافية تأثير gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical اشحن
actors.hero.talent.mystical_charge.desc=_+1:_ Striking مع his staff grants the Battlemage _0.5 turns_ worth of أثر إعادة الشحن.\n\n_+2:_ Striking مع his staff grants the Battlemage _1 turn_ worth of أثر إعادة الشحن.\n\n_+3:_ Striking مع his staff grants the Battlemage _1.5 turns_ worth of أثر إعادة الشحن.
actors.hero.talent.excess_charge.title=excess اشحن
actors.hero.talent.excess_charge.desc=_+1:_ عندما the Battlemage's staff is fully charged, its next zap سوف grant him _0.67 shielding_ per مستوى of the staff.\n\n_+2:_ عندما the Battlemage's staff is fully charged, its next zap سوف grant him _1.33 shielding_ per مستوى of the staff.\n\n_+3:_ عندما the Battlemage's staff is fully charged, its next zap سوف grant him _2 shielding_ per مستوى of the staff.

actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ ضرر جسدي dealt by other شخصيات triggers the ساحر ظلام's soul mark at _13% effectiveness_.\n\n_+2:_ ضرر جسدي dealt by other شخصيات triggers the ساحر ظلام's soul mark at _27% effectiveness_.\n\n_+3:_ ضرر جسدي dealt by other شخصيات triggers the ساحر ظلام's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each ضرر جسدي dealt. Soul marked أعداء لديك a _10% chance_ to trigger on-كل تأثيرات عندما هم يموت.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each ضرر جسدي dealt. Soul marked أعداء لديك a _20% chance_ to trigger on-كل تأثيرات عندما هم يموت.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each ضرر جسدي dealt. Soul marked أعداء لديك a _30% chance_ to trigger on-كل تأثيرات عندما هم يموت.
actors.hero.talent.necromancers_minions.title=مستحضر أرواح's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ عندما a soul marked عدو dies, the ساحر ظلام لديه a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ عندما a soul marked عدو dies, the ساحر ظلام لديه a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ عندما a soul marked عدو dies, the ساحر ظلام لديه a _40% chance_ to raise them as a corrupted wraith.

actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, من 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, من 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, من 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, من 4.
actors.hero.talent.elemental_power.title=elemental قوة
actors.hero.talent.elemental_power.desc=_+1:_ The قوة of elemental blast is increased by _25%_.\n\n_+2:_ The قوة of elemental blast is increased by _50%_.\n\n_+3:_ The قوة of elemental blast is increased by _75%_.\n\n_+4:_ The قوة of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The ساحر يحصل على _2.5 shielding_ for every شخصية affected by elemental blast, to a max of 5 شخصيات.\n\n_+2:_ The ساحر يحصل على _5 shielding_ for every شخصية affected by elemental blast, to a max of 6 شخصيات.\n\n_+3:_ The ساحر يحصل على _7.5 shielding_ for every شخصية affected by elemental blast, to a max of 7 شخصيات.\n\n_+4:_ The ساحر يحصل على _10 shielding_ for every شخصية affected by elemental blast, to a max of 8 شخصيات.

actors.hero.talent.wild_power.title=wild قوة
actors.hero.talent.wild_power.desc=_+1:_ عندما باستخدام wild سحر, عصي سحرية سيكون boosted by either _2 or 3, up to +4_.\n\n_+2:_ عندما باستخدام wild سحر, عصي سحرية سيكون boosted by _3, up to +5_.\n\n_+3:_ عندما باستخدام wild سحر, عصي سحرية سيكون boosted by either _3 or 4, up to +6_.\n\n_+4:_ عندما باستخدام wild سحر, عصي سحرية سيكون boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=نار everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild سحر now fires _5 times_ up من 4, and each عصا سحرية لديه a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild سحر now fires _6 times_ up من 4, and each عصا سحرية لديه a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild سحر now fires _7 times_ up من 4, and each عصا سحرية لديه a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild سحر now fires _8 times_ up من 4, and each عصا سحرية لديه a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved سحر
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap من wild سحر now يستخدم _0.33 charges_ بدلًا من 0.5, and wild سحر لديه a _25% chance_ to not spend a دور.\n\n_+2:_ Each zap من wild سحر now يستخدم _0.225 charges_ بدلًا من 0.5, and wild سحر لديه a _50% chance_ to not spend a دور.\n\n_+3:_ Each zap من wild سحر now يستخدم _0.15 charges_ بدلًا من 0.5, and wild سحر لديه a _75% chance_ to not spend a دور.\n\n_+4:_ Each zap من wild سحر now يستخدم _0.1 charges_ بدلًا من 0.5, and wild سحر لديه a _100% chance_ to not spend a دور.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the ساحر warps إلى another شخصية he يسبب _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the ساحر warps إلى another شخصية he يسبب _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the ساحر warps إلى another شخصية he يسبب _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the ساحر warps إلى another شخصية he يسبب _40-60 damage_ to it, but also takes _20 damage_.\n\nالبطل لا يمكن أن يكون قُتل by هذا موهبة, the self ضرر يمكن أن يكون reduced by سحر resisting تأثيرات.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The ساحر يمكن place a beacon at any location داخل _4 tiles_.\n\n_+2:_ The ساحر يمكن place a beacon at any location داخل _8 tiles_.\n\n_+3:_ The ساحر يمكن place a beacon at any location داخل _12 tiles_.\n\n_+4:_ The ساحر يمكن place a beacon at any location داخل _16 tiles_.\n\nThe ساحر لا يمكن place beacons in locations ذلك are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The ساحر يمكن now warp between طوابق, at _150% charge cost_.\n\n_+2:_ The ساحر يمكن now warp between طوابق, at _117% charge cost_.\n\n_+3:_ The ساحر يمكن now warp between طوابق, at _83% charge cost_.\n\n_+4:_ The ساحر يمكن now warp between طوابق, at _50% charge cost_.\n\nThe ساحر لا يمكن استخدم longrange warp to leave a مقفل طابق.

#rogue
actors.hero.talent.cached_rations.title=cached rations
actors.hero.talent.cached_rations.desc=_+1:_ The لص يمكن اعثر على _2 supply rations_ placed in chests بينما he explores the next few طوابق of الزنزانة.\n\n_+2:_ The لص يمكن اعثر على _3 supply rations_ placed in chests بينما he explores the next few طوابق of الزنزانة.\n\nSupply rations are مأكول بسرعة, restore a moderate amount of satiety, شفاء 5 hp, and restore 1 اشحن إلى عباءة of shadows.
actors.hero.talent.thiefs_intuition.title=لص's intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The لص identifies خواتم _2x faster_, and identifies the type of a خاتم _when he equips it_.\n\n_+2:_ The لص identifies خواتم _when he equips them_, and identifies the type of a خاتم _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The لص يسبب _1-2 bonus damage_ the الأول time he surprise هجمات an عدو.\n\n_+2:_ The لص يسبب _2 bonus damage_ the الأول time he surprise هجمات an عدو.
actors.hero.talent.protective_shadows.title=protective shadows
actors.hero.talent.protective_shadows.desc=_+1:_ The لص يحصل على واحد تحصين _every other turn_ he is inمرئي, _to a max of 3_.\n\n_+2:_ The لص يحصل على واحد تحصين _every turn_ he is inمرئي, _to a max of 5_.

actors.hero.talent.mystical_meal.title=mystical meal
actors.hero.talent.mystical_meal.desc=_+1:_ Eating طعام takes the لص 1 دور (supply rations are مأكول فورًا) and grants him _3 turns of artifact recharging_.\n\n_+2:_ Eating طعام takes the لص 1 دور (supply rations are مأكول فورًا) and grants him _5 turns of artifact recharging_.\n\nهذا موهبة لا يمكن أن يكون يُستخدم to let the horn of plenty إعادة شحن itself.
actors.hero.talent.inscribed_stealth.title=inscribed stealth
actors.hero.talent.inscribed_stealth.desc=_+1:_ The لص يحصل على _3 turns_ of اختفاء بعد reading a لفافة or باستخدام a تعويذة عنصر.\n\n_+2:_ The لص يحصل على _5 turns_ of اختفاء بعد reading a لفافة or باستخدام a تعويذة عنصر.\n\nThe اختفاء مدة is doubled عندما باستخدام a لفافة of ترقية, لفافة of transmutation, or خيمياء عناصر ذلك يجب be مصنوع باستخدام تلك لفائف.\n\nFor خيمياء عناصر مع higher output quantities (e.g. most تعاويذ), هذا موهبة لديه a احتمال to trigger based on how many of ذلك عنصر is produced.
actors.hero.talent.wide_search.title=wide search
actors.hero.talent.wide_search.desc=_+1:_ The لص’s search radius is increased من a 5x5 square to a _7x7 circle_.\n\n_+2:_ The لص’s search radius is increased من a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it سوف instead increase الخاص بهم search radius من a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent خطوات
actors.hero.talent.silent_steps.desc=_+1:_ The لص سوف not wake sleeping أعداء بينما he is _3 or more tiles away from them_.\n\n_+2:_ The لص سوف not wake sleeping أعداء بينما he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=لص's foresight
actors.hero.talent.rogues_foresight.desc=_+1:_ عندما the لص is on a مستوى مع a سري غرفة, he لديه a _75% chance to notice_ ذلك المستوى يحتوي على a سري.\n\n_+2:_ عندما the لص is on a مستوى مع a سري غرفة, he لديه a _100% chance to notice_ ذلك المستوى يحتوي على a سري.

actors.hero.talent.light_cloak.title=ضوء عباءة
actors.hero.talent.light_cloak.desc=_+1:_ The لص يمكن استخدم his عباءة of shadows عندما it ليس مجهّز, but it recharges at _25% speed_ عندما unequipped.\n\n_+2:_ The لص يمكن استخدم his عباءة of shadows عندما it ليس مجهّز, but it recharges at _50% speed_ عندما unequipped.\n\n_+3:_ The لص يمكن استخدم his عباءة of shadows عندما it ليس مجهّز, but it recharges at _75% speed_ عندما unequipped.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it سوف instead increase the charging speed of all الآثار by 7/13/20% at +1/+2/+3.
actors.hero.talent.enhanced_rings.title=enhanced خواتم
actors.hero.talent.enhanced_rings.desc=_+1:_ عندما the لص يستخدم an أثر, his خواتم يكتسب +1 ترقية for _3 turns_.\n\n_+2:_ عندما the لص يستخدم an أثر, his خواتم يكتسب +1 ترقية for _6 turns_.\n\n_+3:_ عندما the لص يستخدم an أثر, his خواتم يكتسب +1 ترقية for _9 turns_.

actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Assassin يمكن assassinate أعداء يسار at أسفل _4/13/27/67% health_ per مستوى of preparation, up من 3/10/20/50%.\n\n_+2:_ The Assassin يمكن assassinate أعداء يسار at أسفل _5/17/33/83% health_ per مستوى of preparation, up من 3/10/20/50%.\n\n_+3:_ The Assassin يمكن assassinate أعداء يسار at أسفل _6/20/40/100% health_ per مستوى of preparation, up من 3/10/20/50%.
actors.hero.talent.assassins_reach.title=assassin's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Assassin's blink range per مستوى of preparation is increased to _1/3/4/6 tiles_, من 1/2/3/4.\n\n_+2:_ The Assassin's blink range per مستوى of preparation is increased to _2/4/6/8 tiles_, من 1/2/3/4.\n\n_+3:_ The Assassin's blink range per مستوى of preparation is increased to _2/5/7/10 tiles_, من 1/2/3/4.\n\nهذا blink يمكن go عبر hazards and أعداء, but not عبر صلب terrain like walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ عندما the Assassin kills an عدو مع a prepared strike الخاص بهم عنصر drop احتمال is increased by _2/4/8/16%_, per مستوى of preparation.\n\n_+2:_ عندما the Assassin kills an عدو مع a prepared strike الخاص بهم عنصر drop احتمال is increased by _4/8/16/32%_, per مستوى of preparation.\n\n_+3:_ عندما the Assassin kills an عدو مع a prepared strike الخاص بهم عنصر drop احتمال is increased by _6/12/24/48%_, per مستوى of preparation.

actors.hero.talent.evasive_armor.title=evasive درع
actors.hero.talent.evasive_armor.desc=_+1:_ بينما freerunning, the Freerunner يحصل على an additional _+1 evasion_ per excess point of قوة on his درع.\n\n_+2:_ بينما freerunning, the Freerunner يحصل على an additional _+2 evasion_ per excess point of قوة on his درع.\n\n_+3:_ بينما freerunning, the Freerunner يحصل على an additional _+3 evasion_ per excess point of قوة on his درع.
actors.hero.talent.projectile_momentum.title=projectile momentum
actors.hero.talent.projectile_momentum.desc=_+1:_ بينما freerunning, the Freerunner يحصل على _+50% accuracy and +15% damage_ مع مقذوف أسلحة.\n\n_+2:_ بينما freerunning, the Freerunner يحصل على _+100% accuracy and +30% damage_ مع مقذوف أسلحة.\n\n_+3:_ بينما freerunning, the Freerunner يحصل على _+150% accuracy and +45% damage_ مع مقذوف أسلحة.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Freerunner يحصل على 2 stacks of momentum per دور بينما he is inمرئي.\n\n_+2:_ In addition إلى benefits of +1, freerunning لا longer counts down بينما the Freerunner is inمرئي.\n\n_+3:_ In addition إلى benefits of +1 and +2, the Freerunner يتحرك at 2x speed بينما inمرئي, regardless of whether he is freerunning or not.

actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ بعد blinking the لص يحصل على _1 turn_ of سرعة and اختفاء.\n\n_+2:_ بعد blinking the لص يحصل على _2 turns_ of سرعة and اختفاء.\n\n_+3:_ بعد blinking the لص يحصل على _3 turns_ of سرعة and اختفاء.\n\n_+4:_ بعد blinking the لص يحصل على _4 turns_ of سرعة and اختفاء.
actors.hero.talent.body_replacement.title=body replacement
actors.hero.talent.body_replacement.desc=_+1:_ بعد blinking, the لص leaves a خشبي decoy behind ذلك لديه _20 health and 1-3 armor_.\n\n_+2:_ بعد blinking, the لص leaves a خشبي decoy behind ذلك لديه _40 health and 2-6 armor_.\n\n_+3:_ بعد blinking, the لص leaves a خشبي decoy behind ذلك لديه _60 health and 3-9 armor_.\n\n_+4:_ بعد blinking, the لص leaves a خشبي decoy behind ذلك لديه _80 health and 4-12 armor_.\n\nOnly واحد decoy يمكن أن يكون active at a time.
actors.hero.talent.shadow_step.title=ظل خطوة
actors.hero.talent.shadow_step.desc=_+1:_ If the لص يستخدم smoke قنبلة بينما inمرئي, it occurs فورًا and لديه a _16% reduced_ اشحن تكلفة, but it also لا أعمى أعداء or trigger other مواهب.\n\n_+2:_ If the لص يستخدم smoke قنبلة بينما inمرئي, it occurs فورًا and لديه a _30% reduced_ اشحن تكلفة, but it also لا أعمى أعداء or trigger other مواهب.\n\n_+3:_ If the لص يستخدم smoke قنبلة بينما inمرئي, it occurs فورًا and لديه a _41% reduced_ اشحن تكلفة, but it also لا أعمى أعداء or trigger other مواهب.\n\n_+4:_ If the لص يستخدم smoke قنبلة بينما inمرئي, it occurs فورًا and لديه a _50% reduced_ اشحن تكلفة, but it also لا أعمى أعداء or trigger other مواهب.

actors.hero.talent.fear_the_reaper.title=fear the reaper
actors.hero.talent.fear_the_reaper.desc=_+1:_ عندما a موت marked عدو reaches 0 hp, هم become _crippled_.\n\n_+2:_ عندما a موت marked عدو reaches 0 hp, هم become _feared and crippled_.\n\n_+3:_ عندما a موت marked عدو reaches 0 hp, هم become _feared and crippled_ and أعداء داخل 3 tiles become _crippled_.\n\n_+4:_ عندما a موت marked عدو reaches 0 hp, هم become _feared and crippled_ and أعداء داخل 3 tiles become _feared and crippled_.
actors.hero.talent.deathly_durability.title=deathly durability
actors.hero.talent.deathly_durability.desc=_+1:_ أعداء قُتل by موت mark give the لص تحصين equal to _13%_ of الخاص بهم hp عندما هم were marked.\n\n_+2:_ أعداء قُتل by موت mark give the لص تحصين equal to _25%_ of الخاص بهم hp عندما هم were marked.\n\n_+3:_ أعداء قُتل by موت mark give the لص تحصين equal to _38%_ of الخاص بهم hp عندما هم were marked.\n\n_+4:_ أعداء قُتل by موت mark give the لص تحصين equal to _50%_ of الخاص بهم hp عندما هم were marked.
actors.hero.talent.double_mark.title=double mark
actors.hero.talent.double_mark.desc=_+1:_ Marking a الثاني هدف في الوقت نفسه as the الأول واحد لديه a _30% reduced_ اشحن تكلفة.\n\n_+2:_ Marking a الثاني هدف في الوقت نفسه as the الأول واحد لديه a _50% reduced_ اشحن تكلفة.\n\n_+3:_ Marking a الثاني هدف في الوقت نفسه as the الأول واحد لديه a _65% reduced_ اشحن تكلفة.\n\n_+4:_ Marking a الثاني هدف في الوقت نفسه as the الأول واحد لديه a _75% reduced_ اشحن تكلفة.

actors.hero.talent.shadow_blade.title=ظل blade
actors.hero.talent.shadow_blade.desc=_+1:_ The ظل clone يحصل على _8%_ of البطل's ضرر per دور, and لديه a _25% chance_ to استخدم the تعويذة on البطل's سلاح.\n\n_+2:_ The ظل clone يحصل على _16%_ of البطل's ضرر per دور, and لديه a _50% chance_ to استخدم the تعويذة on البطل's سلاح.\n\n_+3:_ The ظل clone يحصل على _24%_ of البطل's ضرر per دور, and لديه a _75% chance_ to استخدم the تعويذة on البطل's سلاح.\n\n_+4:_ The ظل clone يحصل على _32%_ of البطل's ضرر per دور, and لديه a _100% chance_ to استخدم the تعويذة on البطل's سلاح.
actors.hero.talent.cloned_armor.title=cloned درع
actors.hero.talent.cloned_armor.desc=_+1:_ The ظل clone يحصل على _12%_ of البطل's درع value, and لديه a _25% chance_ to استخدم the نقش on البطل's درع.\n\n_+2:_ The ظل clone يحصل على _24%_ of البطل's درع value, and لديه a _50% chance_ to استخدم the نقش on البطل's درع.\n\n_+3:_ The ظل clone يحصل على _36%_ of البطل's درع value, and لديه a _75% chance_ to استخدم the نقش on البطل's درع.\n\n_+4:_ The ظل clone يحصل على _48%_ of البطل's درع value, and لديه a _100% chance_ to استخدم the نقش on البطل's درع.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The ظل clone يحصل على _10%_ of البطل's max HP, and يمكن فورًا swap places مع بطل up to _1 tile_ بعيدًا.\n\n_+2:_ The ظل clone يحصل على _20%_ of البطل's max HP, and يمكن فورًا swap places مع بطل up to _2 tiles_ بعيدًا.\n\n_+3:_ The ظل clone يحصل على _30%_ of البطل's max HP, and يمكن فورًا swap places مع بطل up to _3 tiles_ بعيدًا.\n\n_+4:_ The ظل clone يحصل على _40%_ of البطل's max HP, and يمكن فورًا swap places مع بطل up to _4 tiles_ بعيدًا.

#huntress
actors.hero.talent.natures_bounty.title=الطبيعة's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The صيادة يمكن اعثر على _4 berries_ مخفي in tall عشب as she explores the next few طوابق of الزنزانة.\n\n_+2:_ The صيادة يمكن اعثر على _6 berries_ مخفي in tall عشب as she explores the next few طوابق of الزنزانة.\n\nBerries are مأكول بسرعة, restore a صغير amount of satiety, and might contain a usable بذرة.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The صيادة identifies مقذوف أسلحة _3x faster_.\n\n_+2:_ The صيادة identifies مقذوف أسلحة _when she hits with them_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ عندما the صيادة hits an عدو مع her قوس or a مقذوف سلاح, her next اشتباك هجوم aيحصل علىt ذلك عدو يسبب _2 bonus damage_.\n\n_+2:_ عندما the صيادة hits an عدو مع her قوس or a مقذوف سلاح, her next اشتباك هجوم aيحصل علىt ذلك عدو يسبب _3 bonus damage_.
actors.hero.talent.natures_aid.title=الطبيعة's aid
actors.hero.talent.natures_aid.desc=_+1:_ The صيادة يحصل على 0-2 درع of barkskin, which fades every _3 turns_ عندما a نبات's تأثير is activated in her vision.\n\n_+2:_ The صيادة يحصل على 0-2 درع of barkskin, which fades every _5 turns_ عندما a نبات's تأثير is activated in her vision.

actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating طعام takes the صيادة 1 دور (berries are مأكول فورًا) and grants her _1 turn of haste_.\n\n_+2:_ Eating طعام takes the صيادة 1 دور (berries are مأكول فورًا) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=سائل الطبيعة
actors.hero.talent.liquid_nature.desc=_+1:_ عندما the صيادة drinks or throws a جرعة, brew, or elixir, _up to 4 grass tiles_ sprout in the المحيط area, and adjacent أعداء are rooted for _1 turn_.\n\n_+2:_ عندما the صيادة drinks or throws a جرعة, brew, or elixir, _up to 6 grass tiles_ sprout in the المحيط area, and adjacent أعداء are rooted for _2 turns_.\n\nThe amount of عشب and root مدة are doubled عندما باستخدام جرعات of قوة, خبرة, or خيمياء عناصر ذلك يجب be مصنوع باستخدام تلك جرعات.\n\nFor خيمياء عناصر مع higher output quantities (e.g. aqua brew), هذا موهبة لديه a احتمال to trigger based on how many of ذلك عنصر is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating خطوات
actors.hero.talent.rejuvenating_steps.desc=_+1:_ عندما the صيادة خطوات on short عشب or embers, هم spring up إلى tall عشب which the صيادة immediately furrows. هذا لديه a _10 turn cooldown_.\n\n_+2:_ عندما the صيادة خطوات on short عشب or embers, هم spring up إلى tall عشب which the صيادة immediately furrows. هذا لديه a _5 turn cooldown_.\n\nهذا موهبة سوف produce furrowed عشب if passive تجدد تأثيرات are disabled or البطل لديه not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The صيادة يحصل على mind vision on شخصيات داخل _2 tiles of her position_.\n\n_+2:_ The صيادة يحصل على mind vision on شخصيات داخل _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ مقذوف أسلحة لديك _+50% durability_ عندما يُستخدم by the صيادة.\n\n_+2:_ مقذوف أسلحة لديك _+75% durability_ عندما يُستخدم by the صيادة.

actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ عندما the صيادة يستخدم her قوس or a مقذوف سلاح at اشتباك range it لديه _-25% accuracy,_ بدلًا من -50%.\n\n_+2:_ عندما the صيادة يستخدم her قوس or a مقذوف سلاح at اشتباك range it لديه _normal accuracy,_ بدلًا من -50%.\n\n_+3:_ عندما the صيادة يستخدم her قوس or a مقذوف سلاح at اشتباك range it لديه _+25% accuracy,_ بدلًا من -50%.\n\nNote ذلك مقذوف أسلحة or the روح قوس دائمًا لديك +50% دقة عندما يُستخدم at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ عندما the صيادة fires an arrow at the ground, it grants vision in a 3x3 area من حوله for _5 turns_. هذا لديه a 20 دور cooldown.\n\n_+2:_ عندما the صيادة fires an arrow at the ground, it grants vision in a 3x3 area من حوله for _10 turns_. هذا لديه a 20 دور cooldown.\n\n_+3:_ عندما the صيادة fires an arrow at the ground, it grants vision in a 3x3 area من حوله for _15 turns_. هذا لديه a 20 دور cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it سوف trigger من any مقذوف سلاح.

actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared تعويذة
actors.hero.talent.shared_enchantment.desc=_+1:_ مقذوف أسلحة لديك a _33% chance_ to استخدم the تعويذة on the Sniper's قوس.\n\n_+2:_ مقذوف أسلحة لديك a _67% chance_ to استخدم the تعويذة on the Sniper's قوس.\n\n_+3:_ مقذوف أسلحة لديك a _100% chance_ to استخدم the تعويذة on the Sniper's قوس.\n\nThe قوس's تعويذة يمكن trigger in addition to whatever تعويذة the مقذوف سلاح already لديه.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ عندما the Sniper هجمات مع an مُرقّى مقذوف سلاح, each مستوى يزيد the مدة of sniper's mark by 1 دور and the ضرر of her خاص هجوم by 16%, to a max of _2 turns and +33% damage at +2_.\n\n_+2:_ عندما the Sniper هجمات مع an مُرقّى مقذوف سلاح, each مستوى يزيد the مدة of sniper's mark by 1 دور and the ضرر of her خاص هجوم by 16%, to a max of _4 turns and +67% damage at +4_.\n\n_+3:_ عندما the Sniper هجمات مع an مُرقّى مقذوف سلاح, each مستوى يزيد the مدة of sniper's mark by 1 دور and the ضرر of her خاص هجوم by 16%, to a max of _6 turns and +100% damage at +6_.

actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped سهام لديك _2x durability_ عندما the الحارسة يستخدم them.\n\n_+2:_ Tipped سهام لديك _3x durability_ عندما the الحارسة يستخدم them.\n\n_+3:_ Tipped سهام لديك _4x durability_ عندما the الحارسة يستخدم them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ عندما stepping in عشب, the الحارسة يحصل على _0-50% of her level_ in barkskin درع which fades every دور.\n\n_+2:_ عندما stepping in عشب, the الحارسة يحصل على _0-100% of her level_ in barkskin درع which fades every دور.\n\n_+3:_ عندما stepping in عشب, the الحارسة يحصل على _0-150% of her level_ in barkskin درع which fades every دور.
actors.hero.talent.shielding_dew.title=تحصين dew
actors.hero.talent.shielding_dew.desc=_+1:_ Dewdrops يمكن درع the الحارسة عندما her صحة is full, up to _20% of her max HP_.\n\n_+2:_ Dewdrops يمكن درع the الحارسة عندما her صحة is full, up to _40% of her max HP_.\n\n_+3:_ Dewdrops يمكن درع the الحارسة عندما her صحة is full, up to _60% of her max HP_.

actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades يمكن يضرب up to _1 additional target_ for 50% ضرر. The هدف يجب be مرئي and داخل a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades يمكن يضرب up to _2 additional targets_ for 50% ضرر. The targets يجب be مرئي and داخل a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades يمكن يضرب up to _3 additional targets_ for 50% ضرر. The targets يجب be مرئي and داخل a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades يمكن يضرب up to _4 additional targets_ for 50% ضرر. The targets يجب be مرئي and داخل a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades لديه _+25% accuracy_, and يمكن penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades لديه _+50% accuracy_, and يمكن penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades لديه _+75% accuracy_, and يمكن penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades لديه _+100% accuracy_, and يمكن penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=روح blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades لديه a _30% chance_ to also استخدم the تعويذة on the روح قوس.\n\n_+2:_ Spectral blades لديه a _60% chance_ to also استخدم the تعويذة on the روح قوس.\n\n_+3:_ Spectral blades لديه a _90% chance_ to also استخدم the تعويذة on the روح قوس.\n\n_+4:_ Spectral blades لديه a _100% chance_ to also استخدم the تعويذة on the روح قوس, and it يمنح each تعويذة _+10% power_.

actors.hero.talent.growing_power.title=growing قوة
actors.hero.talent.growing_power.desc=_+1:_ The هجوم and movespeed boosts من الطبيعة's قوة are increased to _38% and 125%_, من 33% and 100%.\n\n_+2:_ The هجوم and movespeed boosts من الطبيعة's قوة are increased to _42% and 150%_, من 33% and 100%.\n\n_+3:_ The هجوم and movespeed boosts من الطبيعة's قوة are increased to _46% and 175%_, من 33% and 100%.\n\n_+4:_ The هجوم and movespeed boosts من الطبيعة's قوة are increased to _50% and 200%_, من 33% and 100%.
actors.hero.talent.natures_wrath.title=الطبيعة's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ بينما الطبيعة's قوة is active, shots من the روح قوس لديك an _8% chance_ to trigger a عشوائي harmful نبات تأثير.\n\n_+2:_ بينما الطبيعة's قوة is active, shots من the روح قوس لديك a _17% chance_ to trigger a عشوائي harmful نبات تأثير.\n\n_+3:_ بينما الطبيعة's قوة is active, shots من the روح قوس لديك an _25% chance_ to trigger a عشوائي harmful نبات تأثير.\n\n_+4:_ بينما الطبيعة's قوة is active, shots من the روح قوس لديك a _33% chance_ to trigger a عشوائي harmful نبات تأثير.\n\nThe نباتات ذلك يمكن أن يكون triggered are: العشبة العمياء, زهرة النار, قبعة الجليد, طحلب الحزن, and كرمة العاصفة.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an عدو مع روح قوس prolongs the مدة of الطبيعة's قوة by _1 turn_. The مدة يمكن أن يكون extended by a max of _2 turns_.\n\n_+2:_ Killing an عدو مع روح قوس prolongs the مدة of الطبيعة's قوة by _2 turns_. The مدة يمكن أن يكون extended by a max of _4 turns_.\n\n_+3:_ Killing an عدو مع روح قوس prolongs the مدة of الطبيعة's قوة by _3 turns_. The مدة يمكن أن يكون extended by a max of _6 turns_.\n\n_+4:_ Killing an عدو مع روح قوس prolongs the مدة of الطبيعة's قوة by _4 turns_. The مدة يمكن أن يكون extended by a max of _8 turns_.

actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The روح hawk's vision range is increased to _7 tiles_ من 6.\n\n_+2:_ The روح hawk's vision range is increased to _8 tiles_ من 6.\n\n_+3:_ The روح hawk's vision range is increased to _9 tiles_ من 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The روح hawk's vision range is increased to _10 tiles_ من 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ هجمات من the روح hawk أعمى أعداء for _2 turns_.\n\n_+2:_ هجمات من the روح hawk أعمى أعداء for _5 turns_.\n\n_+3:_ هجمات من the روح hawk أعمى أعداء for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ هجمات من the روح hawk أعمى أعداء for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift روح
actors.hero.talent.swift_spirit.desc=_+1:_ The روح hawk's movement speed is increased to _2.5 tiles_ من 2, and it is guaranteed to dodge the الأول _2 attacks_ مصنوع aيحصل علىt it.\n\n_+2:_ The روح hawk's movement speed is increased to _3 tiles_ من 2, and it is guaranteed to dodge the الأول _4 attacks_ مصنوع aيحصل علىt it.\n\n_+3:_ The روح hawk's movement speed is increased to _3.5 tiles_ من 2, and it is guaranteed to dodge the الأول _6 attacks_ مصنوع aيحصل علىt it.\n\n_+4:_The روح hawk's movement speed is increased to _4 tiles_ من 2, and it is guaranteed to dodge the الأول _8 attacks_ مصنوع aيحصل علىt it.

#duelist
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating طعام grants the مبارز 3 مكافأة إضافية ضرر the next _2 times_ she hits an عدو مع a جسدي هجوم.\n\n_+2:_ Eating طعام grants the مبارز 3 مكافأة إضافية ضرر the next _3 times_ she hits an عدو مع a جسدي هجوم.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The مبارز identifies أسلحة _2.5x faster_ and درع _1.75x faster_.\n\n_+2:_ The مبارز identifies أسلحة _when she equips them_ and درع _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the مبارز waits قبل performing a اشتباك هجوم, she سوف صفقة _1-2 bonus damage_.\n\n_+2:_ If the مبارز waits قبل performing a اشتباك هجوم, she سوف صفقة _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The مبارز يحصل على _3 shielding_ عندما she يستخدم a سلاح قدرة and is at or أسفل 50% صحة.\n\n_+2:_ The مبارز يحصل على _5 shielding_ عندما she يستخدم a سلاح قدرة and is at or أسفل 50% صحة.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant تحصين عندما making a اشتباك هجوم at low صحة, مع a 50 دور cooldown.

actors.hero.talent.focused_meal.title=focيُستخدم meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating طعام takes the مبارز 1 دور and grants her _0.67 charges_ on her أسلحة.\n\n_+2:_ Eating طعام takes the مبارز 1 دور and grants her _1 charge_ on her أسلحة.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant مكافأة إضافية ضرر إلىir next يضرب equal إلىir مستوى/3 at +1, or مستوى/2 at +2.
actors.hero.talent.liquid_agility.title=سائل agility
actors.hero.talent.liquid_agility.desc=_+1:_ عندما drinking or يرمي a جرعة, brew, or elixir, the مبارز لديه _3x evasion_, and لديه _3x accuracy_ on her next اشتباك هجوم داخل 5 أدوار.\n\n_+2:_ عندما drinking or يرمي a جرعة, brew, or elixir, the مبارز لديه _infinite evasion_, and لديه _infinite accuracy_ on her next اشتباك هجوم داخل 5 أدوار.\n\nهذا مكافأة إضافية lasts for واحد additional دور and هجوم عندما باستخدام جرعات of قوة, خبرة, or خيمياء عناصر ذلك يجب be مصنوع باستخدام تلك جرعات.\n\nFor خيمياء عناصر مع higher output quantities (e.g. aqua brew), هذا موهبة لديه a احتمال to trigger based on how many of ذلك عنصر is produced.
actors.hero.talent.weapon_recharging.title=سلاح إعادة الشحن
actors.hero.talent.weapon_recharging.desc=_+1:_ The مبارز يحصل على واحد سلاح اشحن every _15 turns_ عندما تحت the تأثير of عصا سحرية or أثر إعادة الشحن التعزيزات.\n\n_+2:_ The مبارز يحصل على واحد سلاح اشحن every _10 turns_ عندما تحت the تأثير of عصا سحرية or أثر إعادة الشحن التعزيزات.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it سوف instead cause them to صفقة +5% ضرر اشتباك بينما إعادة الشحن at +1, or +7.5% ضرر اشتباك بينما إعادة الشحن at +2.
actors.hero.talent.lethal_haste.title=lethal سرعة
actors.hero.talent.lethal_haste.desc=_+1:_ عندما the مبارز lands a killing blow on an عدو مع a سلاح قدرة, she يحصل على _3 turns_ worth of instant movement.\n\n_+2:_ عندما the مبارز lands a killing blow on an عدو مع a سلاح قدرة, she يحصل على _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it سوف instead trigger مع عادي سلاح هجمات, مع a 100 دور cooldown.
actors.hero.talent.swift_equip.title=swift جهّز
actors.hero.talent.swift_equip.desc=_+1:_ The مبارز يمكن switch her مجهّز سلاح فورًا _one time_ every 20 أدوار.\n\n_+2:_ The مبارز يمكن switch her مجهّز سلاح فورًا _two times_ every 20 أدوار.\n\nIf the مبارز لديه هذا موهبة and it ليس on cooldown, quick-باستخدام an unequipped سلاح سوف جهّز it.

actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ عندما the مبارز يستخدم a سلاح قدرة, she يحصل على _2x accuracy_ on her next اشتباك هجوم داخل 5 أدوار.\n\n_+2:_ عندما the مبارز يستخدم a سلاح قدرة, she يحصل على _5x accuracy_ on her next اشتباك هجوم داخل 5 أدوار.\n\n_+3:_ عندما the مبارز يستخدم a سلاح قدرة, she يحصل على _infinite accuracy_ on her next اشتباك هجوم داخل 5 أدوار.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it سوف instead increase اشتباك دقة by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=قاتل followup
actors.hero.talent.deadly_followup.desc=_+1:_ عندما the مبارز hits an عدو مع a مقذوف سلاح, she سوف صفقة _10% more melee damage_ إلىm for 5 أدوار.\n\n_+2:_ عندما the مبارز hits an عدو مع a مقذوف سلاح, she سوف صفقة _20% more melee damage_ إلىm for 5 أدوار.\n\n_+3:_ عندما the مبارز hits an عدو مع a مقذوف سلاح, she سوف صفقة _30% more melee damage_ إلىm for 5 أدوار.

actors.hero.talent.varied_charge.title=varied اشحن
actors.hero.talent.varied_charge.desc=_+1:_ The Champion فورًا reيحصل على _0.17 weapon charges_ عندما she يستخدم اثنان different سلاح قدرات, مع لا time limit.\n\n_+2:_ The Champion فورًا reيحصل على _0.33 weapon charges_ عندما she يستخدم اثنان different سلاح قدرات, مع لا time limit.\n\n_+3:_ The Champion فورًا reيحصل على _0.5 weapon charges_ عندما she يستخدم اثنان different سلاح قدرات, مع لا time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If واحد of the Champion's اثنان مجهّز أسلحة لديه a مستوى أدنى and is _2 or more tiers lower_ than the other سلاح, it سيكون boosted إلى other سلاح's مستوى.\n\n_+2:_ If واحد of the Champion's اثنان مجهّز أسلحة لديه a مستوى أدنى and is _1 or more tiers lower_ than the other سلاح, it سيكون boosted إلى other سلاح's مستوى.\n\n_+3:_ If واحد of the Champion's اثنان مجهّز أسلحة لديه a مستوى أدنى and is _the same tier or lower_ than the other سلاح, it سيكون boosted إلى other سلاح's مستوى.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion هجمات مع a اشتباك سلاح immediately بعد باستخدام a different سلاح's قدرة, ذلك هجوم سوف execute any non-زعيم عدو يسار at _below 13% HP_.\n\n_+2:_ If the Champion هجمات مع a اشتباك سلاح immediately بعد باستخدام a different سلاح's قدرة, ذلك هجوم سوف execute any non-زعيم عدو يسار at _below 27% HP_.\n\n_+3:_ If the Champion هجمات مع a اشتباك سلاح immediately بعد باستخدام a different سلاح's قدرة, ذلك هجوم سوف execute any non-زعيم عدو يسار at _below 40% HP_.\n\nهذا هجوم يمكن أن يكون a عادي اشتباك سلاح هجوم, or part of a سلاح قدرة.

actors.hero.talent.unencumbered_spirit.title=unencumbered روح
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The راهب يحصل على _50% more energy_ for each piece of _tier 3 or lower_ معدات she is باستخدام.\n\n_+2:_ The راهب يحصل على _75% more energy_ for each piece of _tier 2 or lower_ معدات she is باستخدام. The رتبة 3 benefit is unchanged.\n\n_+3:_ The راهب يحصل على _100% more energy_ for each piece of _tier 1 or lower_ معدات she is باستخدام. The رتبة 2 and 3 benefits are unchanged. She also يحصل على a مجاني قماش درع and studded قفازات.\n\nNote ذلك هذا موهبة يمنح لا benefit من being unarmed or attacking مع a خاتم of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the راهب لديه _100% energy_, her قدرات are empowered.\n\n_+2:_ If the راهب لديه _80% or more energy_, her قدرات are empowered.\n\n_+3:_ If the راهب لديه _60% or more energy_, her قدرات are empowered.\n\nعندما empowered:\n- Flurry applies خاصتك سلاح's تعويذة\n- Focus is instantaneous\n- Dash يحصل على +4 range\n- Dragon Kick يسبب +50% ضرر and applies its knock للخلف and إذهال تأثير to all adjacent أعداء\n- Meditate ببطء heals 20% of missing HP and grants 80% ضرر مقاومة.
actors.hero.talent.combined_energy.title=combined طاقة
actors.hero.talent.combined_energy.desc=_+1:_ If the راهب يستخدم a سلاح قدرة and a _4+ energy_ قدرة داخل 5 أدوار of each other, she reيحصل على 1 spent طاقة.\n\n_+2:_ If the راهب يستخدم a سلاح قدرة and a _3+ energy_ قدرة داخل 5 أدوار of each other, she reيحصل على 1 spent طاقة.\n\n_+3:_ If the راهب يستخدم a سلاح قدرة and a _2+ energy_ قدرة داخل 5 أدوار of each other, she reيحصل على 1 spent طاقة.

actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The مبارز blinks _up to two tiles_ toward her هدف عندما starting a duel.\n\n_+2:_ The مبارز blinks _up to three tiles_ toward her هدف عندما starting a duel.\n\n_+3:_ The مبارز blinks _up to four tiles_ toward her هدف عندما starting a duel.\n\n_+4:_ The مبارز blinks _up to five tiles_ toward her هدف عندما starting a duel.\n\nهذا blink يمكن go عبر hazards and أعداء, but not صلب terrain like walls. The blink is taken إلى account عندما determining if an عدو is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the مبارز defeats her هدف قبل the duel ends, she heals for _5 HP plus 30% of the damage_ she took أثناء the duel.\n\n_+2:_ If the مبارز defeats her هدف قبل the duel ends, she heals for _10 HP plus 50% of the damage_ she took أثناء the duel.\n\n_+3:_ If the مبارز defeats her هدف قبل the duel ends, she heals for _15 HP plus 65% of the damage_ she took أثناء the duel.\n\n_+4:_ If the مبارز defeats her هدف قبل the duel ends, she heals for _20 HP plus 75% of the damage_ she took أثناء the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the مبارز تحديات again داخل 3 أدوار of a duel ending, ذلك تحدي لديه a _16% reduced_ اشحن تكلفة.\n\n_+2:_ If the مبارز تحديات again داخل 3 أدوار of a duel ending, ذلك تحدي لديه a _30% reduced_ اشحن تكلفة.\n\n_+3:_ If the مبارز تحديات again داخل 3 أدوار of a duel ending, ذلك تحدي لديه a _40% reduced_ اشحن تكلفة.\n\n_+4:_ If the مبارز تحديات again داخل 3 أدوار of a duel ending, ذلك تحدي لديه a _50% reduced_ اشحن تكلفة.

actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ من 4, and its width is increased to _75 degrees_ من 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ من 4, and its width is increased to _85 degrees_ من 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ من 4, and its width is increased to _95 degrees_ من 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ من 4, and its width is increased to _105 degrees_ من 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The قوة of elemental strike's تأثير is increased by _30%_.\n\n_+2:_ The قوة of elemental strike's تأثير is increased by _60%_.\n\n_+3:_ The قوة of elemental strike's تأثير is increased by _90%_.\n\n_+4:_ The قوة of elemental strike's تأثير is increased by _120%_.
actors.hero.talent.directed_power.title=directed قوة
actors.hero.talent.directed_power.desc=_+1:_ The direct هجوم من elemental strike يحصل على _+30% enchantment power_ for each عدو in range of elemental strike's تأثير, including the هجوم هدف.\n\n_+2:_ The direct هجوم من elemental strike يحصل على _+60% enchantment power_ for each عدو in range of elemental strike's تأثير, including the هجوم هدف.\n\n_+3:_ The direct هجوم من elemental strike يحصل على _+90% enchantment power_ for each عدو in range of elemental strike's تأثير, including the هجوم هدف.\n\n_+4:_ The direct هجوم من elemental strike يحصل على _+120% enchantment power_ for each عدو in range of elemental strike's تأثير, including the هجوم هدف.

actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an عدو هجمات the مبارز's afterimage, she يحصل على _2 turns_ of سرعة.\n\n_+2:_ If an عدو هجمات the مبارز's afterimage, she يحصل على _4 turns_ of سرعة.\n\n_+3:_ If an عدو هجمات the مبارز's afterimage, she يحصل على _6 turns_ of سرعة.\n\n_+4:_ If an عدو هجمات the مبارز's afterimage, she يحصل على _8 turns_ of سرعة.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ أعداء ذلك هجوم the مبارز's afterimage become ضعيف and vulnerable for _2 turns_.\n\n_+2:_ أعداء ذلك هجوم the مبارز's afterimage become ضعيف and vulnerable for _4 turns_.\n\n_+3:_ أعداء ذلك هجوم the مبارز's afterimage become ضعيف and vulnerable for _6 turns_.\n\n_+4:_ أعداء ذلك هجوم the مبارز's afterimage become ضعيف and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter قدرة
actors.hero.talent.counter_ability.desc=_+1:_ If the مبارز يستخدم a سلاح قدرة داخل 3 أدوار of her afterimage being attacked, she سوف فورًا regain _0.38 charges_.\n\n_+2:_ If the مبارز يستخدم a سلاح قدرة داخل 3 أدوار of her afterimage being attacked, she سوف فورًا regain _0.77 charges_.\n\n_+3:_ If the مبارز يستخدم a سلاح قدرة داخل 3 أدوار of her afterimage being attacked, she سوف فورًا regain _1.13 charges_.\n\n_+4:_ If the مبارز يستخدم a سلاح قدرة داخل 3 أدوار of her afterimage being attacked, she سوف فورًا regain _1.5 charges_.

#cleric
actors.hero.talent.satiated_spells.title=Satiated تعاويذ
actors.hero.talent.satiated_spells.desc=_+1:_ Eating طعام يسبب the رجل دين to يكتسب _3 shielding_ the next time هم cast a تعويذة.\n\n_+2:_ Eating طعام يسبب the رجل دين to يكتسب _5 shielding_ the next time هم cast a تعويذة.
actors.hero.talent.satiated_spells.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant تحصين immediately, which سوف start to decay normally بعد 10 أدوار.
actors.hero.talent.holy_intuition.title=مقدس intuition
actors.hero.talent.holy_intuition.desc=_+1:_ The رجل دين يمكن cast _Holy Intuition,_ a تعويذة ذلك reveals whether an عنصر is ملعون at the تكلفة of _3 charges._\n\n_+2:_ The رجل دين يمكن cast _Holy Intuition,_ a تعويذة ذلك reveals whether an عنصر is ملعون at the تكلفة of _2 charges._
actors.hero.talent.holy_intuition.meta_desc=_If this talent is gained by a different hero_ it سوف instead let البطل تعرّف the لعنة status on a ملعون عنصر just قبل equipping it, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.searing_light.title=searing ضوء
actors.hero.talent.searing_light.desc=_+1:_ The رجل دين's جسدي هجمات on أعداء illuminated by _Guiding Light_ صفقة _+3 damage._\n\n_+2:_ The رجل دين's جسدي هجمات on أعداء illuminated by _Guiding Light_ صفقة _+5 damage._
actors.hero.talent.searing_light.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant its مكافأة إضافية ضرر بعد a عصا سحرية or أثر is يُستخدم on an عدو, مع a 20 دور cooldown.
actors.hero.talent.shield_of_light.title=درع of ضوء
actors.hero.talent.shield_of_light.desc=_+1:_ The رجل دين يمكن cast _Shield of Light,_ a تعويذة ذلك is cast فورًا and grants them _2-4 armor_ aيحصل علىt a هدف for 5 أدوار at the تكلفة of 1 اشحن.\n\n_+2:_ The رجل دين يمكن cast _Shield of Light,_ a تعويذة ذلك is cast فورًا and grants them _3-6 armor_ aيحصل علىt a هدف for 5 أدوار at the تكلفة of 1 اشحن.
actors.hero.talent.shield_of_light.meta_desc=_If this talent is gained by a different hero_ it سوف instead reduce ضرر جسدي taken من خاصتك targeted عدو by 1, 33% of the time at +1 or 50% of the time at +2.

actors.hero.talent.enlightening_meal.title=Enlightening Meal
actors.hero.talent.enlightening_meal.desc=_+1:_ Eating طعام takes the رجل دين 1 دور and grants them _0.67 charges_ on الخاص بهم مقدس tome.\n\n_+2:_ Eating طعام takes the رجل دين 1 دور and grants them _1 charge_ on الخاص بهم مقدس tome.
actors.hero.talent.enlightening_meal.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant 2 أدوار of عصا سحرية and أثر إعادة الشحن at +1, or 3 أدوار at +2. هذا لا يمكن أن يكون يُستخدم to let the horn of plenty إعادة شحن itself.
actors.hero.talent.recall_inscription.title=Recall Inscription
actors.hero.talent.recall_inscription.refunded=خاصتك عنصر was refunded!
actors.hero.talent.recall_inscription.desc=_+1:_ The رجل دين يمكن cast _Recall Inscription,_ a تعويذة ذلك يسمح them repeat the تأثير of the last حجر رون or لفافة هم يُستخدم داخل _10 turns._\n\n_+2:_ The رجل دين يمكن cast _Recall Inscription,_ a تعويذة ذلك يسمح them repeat the تأثير of the last حجر رون or لفافة هم يُستخدم داخل _300 turns._\n\nRecall Inscription لا يمكن أن يكون يُستخدم مع لفائف of ترقية. هذا تعويذة's اشحن تكلفة varies based on which عنصر was يُستخدم recently: 2 for a حجر رون, 3 for a لفافة, 4 for an exotic لفافة. هذا اشحن تكلفة is also doubled عندما يُستخدم مع a لفافة of transmutation, or خيمياء عناصر ذلك يجب be مصنوع باستخدام transmutation or ترقية.
actors.hero.talent.recall_inscription.meta_desc=_If this talent is gained by a different hero_ it سوف instead refund any لفافة or حجر رون 10% of the time at +1 or 15% of the time at +2. لفائف of ترقية are exempt من هذا التأثير.
actors.hero.talent.sunray.title=Sunray
actors.hero.talent.sunray.desc=_+1:_ The رجل دين يمكن cast _Sunray,_ a تعويذة ذلك يسبب _4-8 damage_ and blinds the هدف for _4 turns,_ at the تكلفة of 1 اشحن.\n\n_+2:_ The رجل دين يمكن cast _Sunray,_ a تعويذة ذلك يسبب _6-12 damage_ and blinds the هدف for _6 turns,_ at the تكلفة of 1 اشحن.\n\nSunray يمكن only أعمى each هدف once, but if the هدف is already blinded by Sunray then it paralyses instead. Sunray دائمًا يسبب الأقصى ضرر to demonic and undead foes.
actors.hero.talent.sunray.meta_desc=_If this talent is gained by a different hero_ it سوف instead cause عصي سحرية and الآثار to أعمى أعداء for 4 أدوار, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.divine_sense.title=Divine Sense
actors.hero.talent.divine_sense.desc=_+1:_ The رجل دين يمكن cast _Divine Sense,_ a تعويذة ذلك grants them _8 tiles_ of Mind Vision for 50 أدوار and takes لا time to cast, at the تكلفة of 2 شحنات.\n\n_+2:_ The رجل دين يمكن cast _Divine Sense,_ a تعويذة ذلك grants them _12 tiles_ of Mind Vision for 50 أدوار and takes لا time to cast, at the تكلفة of 2 شحنات.
actors.hero.talent.divine_sense.meta_desc=_If this talent is gained by a different hero_ it سوف instead grant them mind vision for a brief moment بعد باستخدام a عصا سحرية or أثر مع a range of 3 tiles at +1 or 5 tiles at +2.
actors.hero.talent.bless.title=Bless
actors.hero.talent.bless.desc=_+1:_ The رجل دين يمكن cast _Bless,_ a تعويذة ذلك grants _6 turns of bless and 10 shielding_ عندما cast on themselves or _10 turns of bless and 10 healing_ عندما cast on another شخصية, at the تكلفة of 1 اشحن.\n\n_+2:_ The رجل دين يمكن cast _Bless,_ a تعويذة ذلك grants _10 turns of bless and 15 shielding_ عندما cast on themselves or _15 turns of bless and 15 healing_ عندما cast on another شخصية, at the تكلفة of 1 اشحن.\n\nExcess علاج من هذا تعويذة is converted إلى تحصين.
actors.hero.talent.bless.meta_desc=_If this talent is gained by a different hero_ it سوف instead boost دقة and مراوغة for البطل and all حلفاء by 3% at +1 or 5% at +2.

actors.hero.talent.cleanse.title=Cleanse
actors.hero.talent.cleanse.desc=_+1:_ The رجل دين يمكن cast _Cleanse,_ a تعويذة which _removes negative status effects_ من the رجل دين and any بالقرب حلفاء, and grants them _10 shielding,_ at the تكلفة of 2 شحنات.\n\n_+2:_ The رجل دين يمكن cast _Cleanse,_ a تعويذة which _grants 3 turns of negative status immunity_ إلى رجل دين and any بالقرب حلفاء, and grants them _20 shielding,_ at the تكلفة of 2 شحنات.\n\n_+3:_ The رجل دين يمكن cast _Cleanse,_ a تعويذة which _grants 5 turns of negative status immunity_ إلى رجل دين and any بالقرب حلفاء, and grants them _30 shielding,_ at the تكلفة of 2 شحنات.
actors.hero.talent.cleanse.meta_desc=_If this talent is gained by a different hero_ it سوف instead cleanse negative status تأثيرات on البطل بعد باستخدام a عصا سحرية or أثر, 10/20/30% of the time at +1/+2/+3.
actors.hero.talent.light_reading.title=ضوء Reading
actors.hero.talent.light_reading.desc=_+1:_ The رجل دين يمكن استخدم الخاص بهم مقدس tome عندما it ليس مجهّز, but it recharges at _25% speed_ عندما unequipped.\n\n_+2:_ The رجل دين يمكن استخدم الخاص بهم مقدس tome عندما it ليس مجهّز, but it recharges at _50% speed_ عندما unequipped.\n\n_+3:_ The رجل دين يمكن استخدم الخاص بهم مقدس tome عندما it ليس مجهّز, but it recharges at _75% speed_ عندما unequipped.
actors.hero.talent.light_reading.meta_desc=_If this talent is gained by a different hero_ it سوف instead increase the إعادة الشحن speed of all عصي سحرية by 7/13/20% at +1/+2/+3.

actors.hero.talent.holy_lance.title=مقدس Lance
actors.hero.talent.holy_lance.desc=_+1:_ The Priest يمكن cast _Holy Lance,_ a devastating تعويذة ذلك يسبب _30-55 damage_ at the تكلفة of 4 شحنات.\n\n_+2:_ The Priest يمكن cast _Holy Lance,_ a devastating تعويذة ذلك يسبب _45-83 damage_ at the تكلفة of 4 شحنات.\n\n_+3:_ The Priest يمكن cast _Holy Lance,_ a devastating تعويذة ذلك يسبب _60-110 damage_ at the تكلفة of 4 شحنات.\n\nمقدس Lance دائمًا يسبب الأقصى ضرر to demonic and undead foes. مقدس Lance لديه a 30 دور cooldown قبل it يمكن أن يكون cast again.
actors.hero.talent.hallowed_ground.title=Hallowed Ground
actors.hero.talent.hallowed_ground.desc=_+1:_ The Priest يمكن cast _Hallowed Ground,_ a تعويذة ذلك hيسمح terrain in a _3x3 area_ for 20 أدوار, at the تكلفة of 2 شحنات.\n\n_+2:_ The Priest يمكن cast _Hallowed Ground,_ a تعويذة ذلك hيسمح terrain in a _5x5 area_ for 20 أدوار, at the تكلفة of 2 شحنات.\n\n_+3:_ The Priest يمكن cast _Hallowed Ground,_ a تعويذة ذلك hيسمح terrain in a _7x7 area_ for 20 أدوار, at the تكلفة of 2 شحنات.\n\nعندما it is cast, Hallowed Ground heals حلفاء for 15 HP, لفترة وجيزة roots أعداء, and spreads short عشب. Afterward, it ببطء heals حلفاء, cripples أعداء, and يسبب tall عشب to عشوائيًا grow. Hallowed ground grants تحصين إلى Priest بدلًا من علاج and تم تدميره by نار.
actors.hero.talent.mnemonic_prayer.title=Mnemonic Prayer
actors.hero.talent.mnemonic_prayer.desc=_+1:_ The Priest يمكن cast _Mnemonic Prayer,_ a تعويذة ذلك extends التعزيزات/debuffs on an حليف/عدو for _3 turns_ at 1 اشحن تكلفة.\n\n_+2:_ The Priest يمكن cast _Mnemonic Prayer,_ a تعويذة ذلك extends التعزيزات/debuffs on an حليف/عدو for _4 turns_ at 1 اشحن تكلفة.\n\n_+3:_ The Priest يمكن cast _Mnemonic Prayer,_ a تعويذة ذلك extends التعزيزات/debuffs on an حليف/عدو for _5 turns_ at 1 اشحن تكلفة.\n\nMnemonic prayer takes لا time to cast. Mnemonic Prayer يمكن only extend a particular instance of a تعزيز/debuff once, and لا يمكن extend التعزيزات من درع قدرات.

actors.hero.talent.lay_on_hands.title=lay on hands
actors.hero.talent.lay_on_hands.desc=_+1:_ The فارس مقدس يمكن cast _Lay on Hands,_ a تعويذة ذلك فورًا heals a بالقرب شخصية for _15 HP,_ or grants the فارس مقدس _15 shielding,_ at the تكلفة of 1 اشحن.\n\n_+2:_ The فارس مقدس يمكن cast _Lay on Hands,_ a تعويذة ذلك فورًا heals a بالقرب شخصية for _20 HP,_ or grants the فارس مقدس _20 shielding,_ at the تكلفة of 1 اشحن.\n\n_+3:_ The فارس مقدس يمكن cast _Lay on Hands,_ a تعويذة ذلك فورًا heals a بالقرب شخصية for _25 HP,_ or grants the فارس مقدس _25 shielding,_ at the تكلفة of 1 اشحن.\n\nExcess علاج من هذا تعويذة is converted إلى تحصين. Lay on Hands يمكن أن يكون cast repeatedly, but لا يمكن طبّق more than ثلاثة casts worth of تحصين at once.
actors.hero.talent.aura_of_protection.title=aura of protection
actors.hero.talent.aura_of_protection.desc=_+1:_ The فارس مقدس يمكن cast _Aura of Protection,_ a تعويذة ذلك grants the فارس مقدس and all حلفاء داخل 2 tiles _20% damage resistance_ and the تأثير of the فارس مقدس's درع نقش at _+50% power_ for 20 أدوار, at the تكلفة of 2 شحنات.\n\n_+2:_ The فارس مقدس يمكن cast _Aura of Protection,_ a تعويذة ذلك grants the فارس مقدس and all حلفاء داخل 2 tiles _30% damage resistance_ and the تأثير of the فارس مقدس's درع نقش at _+75% power_ for 20 أدوار, at the تكلفة of 2 شحنات.\n\n_+3:_ The فارس مقدس يمكن cast _Aura of Protection,_ a تعويذة ذلك grants the فارس مقدس and all حلفاء داخل 2 tiles _40% damage resistance_ and the تأثير of the فارس مقدس's درع نقش at _+100% power_ for 20 أدوار, at the تكلفة of 2 شحنات.
actors.hero.talent.wall_of_light.title=جدار of ضوء
actors.hero.talent.wall_of_light.desc=_+1:_ The فارس مقدس يمكن cast _Wall of Light,_ a تعويذة ذلك creates a _3 tile wide_ صلب جدار in front of the فارس مقدس ذلك pushes بعيدًا أعداء and lasts for 20 أدوار, at the تكلفة of 3 شحنات.\n\n_+2:_ The فارس مقدس يمكن cast _Wall of Light,_ a تعويذة ذلك creates a _5 tile wide_ صلب جدار in front of the فارس مقدس ذلك pushes بعيدًا أعداء and lasts for 20 أدوار, at the تكلفة of 3 شحنات.\n\n_+3:_ The فارس مقدس يمكن cast _Wall of Light,_ a تعويذة ذلك creates a _7 tile wide_ صلب جدار in front of the فارس مقدس ذلك pushes بعيدًا أعداء and lasts for 20 أدوار, at the تكلفة of 3 شحنات.\n\nThe جدار يمكن أن يكون placed cardinally or diagonally, only واحد جدار يمكن exist at a time.

actors.hero.talent.divine_intervention.title=divine intervention
actors.hero.talent.divine_intervention.desc=_+1:_ بينما in Ascended Form, the رجل دين يمكن cast _Divine Intervention,_ which boosts the رجل دين and all حلفاء up to _150 shielding_ and extends Ascended Form by _3 turns._\n\n_+2:_ بينما in Ascended Form, the رجل دين يمكن cast _Divine Intervention,_ which boosts the رجل دين and all حلفاء up to _200 shielding_ and extends Ascended Form by _4 turns._\n\n_+3:_ بينما in Ascended Form, the رجل دين يمكن cast _Divine Intervention,_ which boosts the رجل دين and all حلفاء up to _250 shielding_ and extends Ascended Form by _5 turns._\n\n_+4:_ بينما in Ascended Form, the رجل دين يمكن cast _Divine Intervention,_ which boosts the رجل دين and all حلفاء up to _300 shielding_ and extends Ascended Form by _6 turns._\n\nDivine Intervention يكلّف a whopping 5 tome شحنات, and يمكن only be cast once in the same ascended form.
actors.hero.talent.judgement.title=judgement
actors.hero.talent.judgement.desc=_+1:_ بينما in Ascended Form, the رجل دين يمكن cast _Judgement,_ which يسبب _10-20 damage_ to all مرئي أعداء.\n\n_+2:_ بينما in Ascended Form, the رجل دين يمكن cast _Judgement,_ which يسبب _15-30 damage_ to all مرئي أعداء.\n\n_+3:_ بينما in Ascended Form, the رجل دين يمكن cast _Judgement,_ which يسبب _20-40 damage_ to all مرئي أعداء.\n\n_+4:_ بينما in Ascended Form, the رجل دين يمكن cast _Judgement,_ which يسبب _25-50 damage_ to all مرئي أعداء.\n\nJudgement يكلّف 3 tome شحنات. Judgement يسبب +33% ضرر for every تعويذة the رجل دين لديه cast since entering ascended form or since the last cast of Judgement.
actors.hero.talent.flash.title=flash
actors.hero.talent.flash.desc=_+1:_ بينما in Ascended Form, the رجل دين يمكن cast _Flash_ to انتقال آني up to _3 tiles_ بعيدًا.\n\n_+2:_ بينما in Ascended Form, the رجل دين يمكن cast _Flash_ to انتقال آني up to _4 tiles_ بعيدًا.\n\n_+3:_ بينما in Ascended Form, the رجل دين يمكن cast _Flash_ to انتقال آني up to _5 tiles_ بعيدًا.\n\n_+4:_ بينما in Ascended Form, the رجل دين يمكن cast _Flash_ to انتقال آني up to _6 tiles_ بعيدًا.\n\nFlash يكلّف 2 tome شحنات initially, and 1 more اشحن for each استخدم in the same ascended form.

actors.hero.talent.body_form.title=body form
actors.hero.talent.body_form.desc=The رجل دين يمكن cast _Body Form_, which imbues Trinity مع قوة of an تعويذة or نقش ذلك the رجل دين لديه معروف هذا لعبة, at the تكلفة of 2 شحنات.\n\n_+1:_ عندما Trinity is يُستخدم, the رجل دين يحصل على the chosen تأثير for _20 turns._\n\n_+2:_ عندما Trinity is يُستخدم, the رجل دين يحصل على the chosen تأثير for _27 turns._\n\n_+3:_ عندما Trinity is يُستخدم, the رجل دين يحصل على the chosen تأثير for _33 turns._\n\n_+4:_ عندما Trinity is يُستخدم, the رجل دين يحصل على the chosen تأثير for _40 turns._\n\nTrinity يمكن only be imbued مع واحد body تأثير at a time. Trinity's درع اشحن تكلفة is higher if the chosen نقش is نادر and قوي.
actors.hero.talent.mind_form.title=mind form
actors.hero.talent.mind_form.desc=The رجل دين يمكن cast _Mind Form_, which imbues Trinity مع قوة of a عصا سحرية or مقذوف سلاح ذلك the رجل دين لديه يُستخدم هذا لعبة, at the تكلفة of 3 شحنات.\n\n_+1:_ عندما Trinity is يُستخدم, the رجل دين يستخدم the zap or ارمِ تأثير of the chosen عنصر, as if it were _+3._\n\n_+2:_ عندما Trinity is يُستخدم, the رجل دين يستخدم the zap or ارمِ تأثير of the chosen عنصر, as if it were _+4._\n\n_+3:_ عندما Trinity is يُستخدم, the رجل دين يستخدم the zap or ارمِ تأثير of the chosen عنصر, as if it were _+5._\n\n_+4:_ عندما Trinity is يُستخدم, the رجل دين يستخدم the zap or ارمِ تأثير of the chosen عنصر, as if it were _+6._\n\nTrinity يمكن only be imbued مع واحد mind تأثير at a time.
actors.hero.talent.spirit_form.title=روح form
actors.hero.talent.spirit_form.desc=The رجل دين يمكن cast _Spirit Form_, which imbues Trinity مع قوة of a خاتم or أثر ذلك the رجل دين لديه معروف هذا لعبة (except the مقدس tome), at the تكلفة of 4 شحنات.\n\n_+1:_ عندما Trinity is يُستخدم, the رجل دين سوف يكتسب a خاتم's تأثير at _+1_ for 20 أدوار, or سوف trigger an أثر's تأثير at _+4._\n\n_+2:_ عندما Trinity is يُستخدم, the رجل دين سوف يكتسب a خاتم's تأثير at _+2_ for 20 أدوار, or سوف trigger an أثر's تأثير at _+6._\n\n_+3:_ عندما Trinity is يُستخدم, the رجل دين سوف يكتسب a خاتم's تأثير at _+3_ for 20 أدوار, or سوف trigger an أثر's تأثير at _+8._\n\n_+4:_ عندما Trinity is يُستخدم, the رجل دين سوف يكتسب a خاتم's تأثير at _+4_ for 20 أدوار, or سوف trigger an أثر's تأثير at _+10._\n\nTrinity يمكن only be imbued مع واحد روح تأثير at a time. الآثار لديك varied تأثيرات and درع اشحن يكلّف عند تفعيله by Trinity.

actors.hero.talent.beaming_ray.title=beaming ray
actors.hero.talent.beaming_ray.desc=The رجل دين يمكن cast _Beaming Ray_ من an empowered حليف at the تكلفة of 1 اشحن. هذا ray يمكن go عبر walls and teleports the حليف to a targeted location. If an عدو is at ذلك location, the حليف يظهر next إلى عدو and سوف هدف them. Beaming Ray يمكن even انتقال آني normally immobile حلفاء, but لديه half range عندما doing so.\n\n_+1:_ Beaming Ray لديه a max range of _4 tiles,_ and يزيد قوة of Many's مكافأة إضافية to _+35% damage_ aيحصل علىt the cيفقدt عدو for 10 أدوار.\n\n_+2:_ Beaming Ray لديه a max range of _8 tiles,_ and يزيد قوة of Many's مكافأة إضافية to _+40% damage_ aيحصل علىt the cيفقدt عدو for 10 أدوار.\n\n_+3:_ Beaming Ray لديه a max range of _12 tiles,_ and يزيد قوة of Many's مكافأة إضافية to _+45% damage_ aيحصل علىt the cيفقدt عدو for 10 أدوار.\n\n_+4:_ Beaming Ray لديه a max range of _16 tiles,_ and يزيد قوة of Many's مكافأة إضافية to _+50% damage_ aيحصل علىt the cيفقدt عدو for 10 أدوار.
actors.hero.talent.life_link.title=life link
actors.hero.talent.life_link.desc=The رجل دين يمكن cast _Life Link_ between themselves and an empowered حليف at the تكلفة of 2 شحنات. هذا تعويذة يسبب ضرر to be shared between the رجل دين and الخاص بهم حليف, and يسبب beneficial رجل دين تعاويذ of رتبة 3 or سفلي to طبّق to both if either is being affected.\n\n_+1:_ Life Link lasts for _10 turns_ and يزيد قوة of Many's مكافأة إضافية to _-35% damage taken._\n\n_+2:_ Life Link lasts for _13 turns_ and يزيد قوة of Many's مكافأة إضافية to _-40% damage taken._\n\n_+3:_ Life Link lasts for _17 turns_ and يزيد قوة of Many's مكافأة إضافية to _-45% damage taken._\n\n_+4:_ Life Link lasts for _20 turns_ and يزيد قوة of Many's مكافأة إضافية to _-50% damage taken._
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=The رجل دين يمكن cast _Stasis_ on an empowered حليف at the تكلفة of 2 شحنات. Stasis مؤقتًا removes the حليف من الزنزانة and preserves the remaining time on all التعزيزات, including قوة of Many. The حليف سوف reappear next to أنت عندما the تأثير ends. Stasis يمكن أن يكون re-cast فورًا and at لا تكلفة to end the تأثير early. Stasis works on immobile حلفاء, but لا يمكن تحرك them between الزنزانة طوابق.\n\n_+1:_ Stasis lasts for a max of _60 turns._\n\n_+2:_ Stasis lasts for a max of _90 turns._\n\n_+3:_ Stasis lasts for a max of _120 turns._\n\n_+4:_ Stasis lasts for a max of _150 turns._\n\nThe رجل دين يمكن also cast Beaming Ray عندما an حليف is in stasis to resummon them, or cast Life Link to pre-emptively طبّق its تأثير. حلفاء do not benefit من Life Link بينما in stasis لكن.


#universal
actors.hero.talent.heroic_energy.title=heroic طاقة
actors.hero.talent.heroic_energy.rat_title=ratroic طاقة
actors.hero.talent.heroic_energy.desc=_+1:_ البطل's درع قدرة لديه a _12% reduced_ اشحن تكلفة.\n\n_+2:_ البطل's درع قدرة لديه a _23% reduced_ اشحن تكلفة.\n\n_+3:_ البطل's درع قدرة لديه a _32% reduced_ اشحن تكلفة.\n\n_+4:_ البطل's درع قدرة لديه a _40% reduced_ اشحن تكلفة.

actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified أعداء صفقة _-10% damage_.\n\n_+2:_ Hostile ratmogrified أعداء صفقة _-19% damage_.\n\n_+3:_ Hostile ratmogrified أعداء صفقة _-27% damage_.\n\n_+4:_ Hostile ratmogrified أعداء صفقة _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ باستخدام ratmogrify on a ratmogrified عدو يجعل them friendly and يجعل the transformation permanent.\n\n_+2:_ باستخدام ratmogrify on a ratmogrified عدو يجعل them friendly, يجعل the transformation permanent, and يمنح them _2 turns_ of adrenaline.\n\n_+3:_ باستخدام ratmogrify on a ratmogrified عدو يجعل them friendly, يجعل the transformation permanent, and يمنح them _4 turns_ of adrenaline.\n\n_+4:_ باستخدام ratmogrify on a ratmogrified عدو يجعل them friendly, يجعل the transformation permanent, and يمنح them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ باستخدام ratmogrify on خاصتكself _spawns 1_ حليف marsupial جرذ next to أنت.\n\n_+2:_ باستخدام ratmogrify on خاصتكself _spawns 2_ حليف marsupial rats next to أنت.\n\n_+3:_ باستخدام ratmogrify on خاصتكself _spawns 3_ حليف marsupial rats next to أنت.\n\n_+4:_ باستخدام ratmogrify on خاصتكself _spawns 4_ حليف marsupial rats next to أنت.



###npcs
actors.mobs.npcs.blacksmith.name=ترول حداد
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Human! أنت look like a tough واحد.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Human! أنت look like a smart واحد.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Human! أنت look like a sneaky واحد.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Human! أنت look like a quick واحد.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Human! أنت look like a brave واحد.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Human! أنت look like an important واحد.
actors.mobs.npcs.blacksmith.intro_quest_start=Wanna be useful, eh? Yeah I got something أنت could do. I مبني dis workshop ontop of an قديم mine, إنه just down dat ladder. Take dis فأس and mine me some _dark gold ore. 40 pieces_ ينبغي be enough. The rock down der is nice and soft so _you'll be able to mine through the walls with some effort._\n\nWhat do أنت mean, how am I gonna pay? أنت greedy...\n\nOk, ok, I يمكن do some smithin' for أنت. Consider خاصتكself lucky, I'm the only حداد حول.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Careful though, the mine's خطير for قليلًا human like أنت. إنه been abandoned for a بينما, and bunch of بلورات لديك started growing. هم're shiny, but too هش to be worth anythin', and هم've got some سحر things protecting 'em. هم're pretty قوي, so _be careful where you mine_ or أنت'll احصل على الخاص بهم attention.\n\nهناك's a _giant crystal_ somewhere too. إنه كثيرًا tougher, so be prepared for a fight if أنت start breakin' it. I'll bet smashing it سوف بطء all the بلورة growth down though, so I'll pay extra if أنت يمكن do it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Careful though, the mine's خطير for قليلًا human like أنت. Some gnolls want the ذهب too and now هم're wreckin' the place. هم're stupid things, so الخاص بهم mining لديه caيُستخدم all sorts of collapses and cave-ins. أنت'll لديك to mine عبر it, so _look for recently disturbed rock._\n\nI think واحد of the gnolls is مسببًا most of the trouble, probably a _geomancer shaman_ or somethin'. I'll pay extra, if أنت يمكن اعثر على and يقتل it, but I'm sure it'll fight للخلف.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Careful though, the mine's خطير for قليلًا human like أنت. هناك's some sorta fungus وحش ذلك's been growing down هناك. إنه got فطر sentries ذلك're really قاتل if هم see أنت, but هم لا يستطيع احصل على up and chase أنت على الأقل. _Keep out of sight_ if أنت want to stay alive.\n\nI'll pay extra if أنت يمكن manage to take down the _biggest mushrom,_ but it'll take some real effort. إنه connected to a bunch of mycelium nodes ذلك're مخفي in the walls. أنت'll لديك to يكسر most of 'em قبل أنت يمكن really ضرر it.
actors.mobs.npcs.blacksmith.reminder=أنت done wastin' my time? The mine entrance is فوق هناك.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me as much ذهب as أنت يمكن, and try to يكسر the big بلورة too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me as much ذهب as أنت يمكن, and try to يقتل the نوول geomancer too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me as much ذهب as أنت يمكن, and try to يقتل the عملاق فطر too.
actors.mobs.npcs.blacksmith.lost_pick=Are أنت kiddin' me? حيث is my فأس?!
actors.mobs.npcs.blacksmith.quest_start_prompt=أنت ready to go down? Make sure أنت've got some مجاني space for the ذهب.\n\n_I'm only lettin' you down der once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=أنت done already? أنت've hardly got any ذهب at all! أنت ينبغي be able to احصل على _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_low=أنت done already? لا look like أنت've got كثيرًا of ذهب. أنت ينبغي be able to احصل على _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_med=أنت done? أنت've got some ذهب على الأقل, but هناك's definitely more in the mine. أنت ينبغي be able to احصل على _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_high=أنت done? يبدو مثل أنت've got a جيد amount of ذهب, but I could استخدم a bit more. أنت ينبغي be able to احصل على _40 pieces._\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_full=أنت done? أنت've got lots of ذهب, but make sure أنت haven't يسار any of خاصتك gear behind.\n\n_Remember, I'm not lettin' you back in once you come up._
actors.mobs.npcs.blacksmith.exit_warn_crystal=ذلك عملاق بلورة's still down هناك too. I'll pay extra if أنت يدمر it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=ذلك نوول geomancer's still down هناك too. I'll pay extra if أنت يقتل it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=ذلك عملاق فطر's still down هناك too. I'll pay extra if أنت يقتل it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.get_lost=I'm busy. احصل على فقد!
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=ذلك area ليس accessible on هذا لعبة. Play a new لعبة to try the new مهمة!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=هذا ترول حداد يبدو مثل all trolls look: he is tall and lean, and his skin resembles حجر in both color and texture. The ترول حداد is tinkering مع disproportionally صغير tools.

actors.mobs.npcs.ghost.name=sad شبح
actors.mobs.npcs.ghost.rat_1=Hello %s... Once I was like أنت - قوي and confident... But I was slain by a قذر وحش... I لا يستطيع leave هذا place... Not until I لديك my revenge... Slay the _fetid rat,_ ذلك لديه taken my life...\n\nIt stalks هذا طابق... Spreading filth everywhere... _Beware its cloud of stink and corrosive bite, the acid dissolves in water..._
actors.mobs.npcs.ghost.rat_2=Please... Help me... Slay the abomination...\n\n_Fight it near water... Avoid the stench..._
actors.mobs.npcs.ghost.gnoll_1=Hello %s... Once I was like أنت - قوي and confident... But I was slain by a devious foe... I لا يستطيع leave هذا place... Not until I لديك my revenge... Slay the _gnoll trickster,_ ذلك لديه taken my life...\n\nIt ليس like the other gnolls... It hides and يستخدم مقذوف أسلحة... _Beware its poisonous and incendiary darts, don't attack from a distance..._
actors.mobs.npcs.ghost.gnoll_2=Please... Help me... Slay the trickster...\n\n_Don't let it hit you... Get near to it..._
actors.mobs.npcs.ghost.crab_1=Hello %s... Once I was like أنت - قوي and confident... But I was slain by an قديم جدًا مخلوق... I لا يستطيع leave هذا place... Not until I لديك my revenge... Slay the _great crab,_ ذلك لديه taken my life...\n\nIt is unnaturally قديم... مع a هائل single claw and a سميك shell... _Beware its claw, you must surprise the crab or it will block with it..._
actors.mobs.npcs.ghost.crab_2=Please... Help me... Slay the Crustacean...\n\n_It will always block... When it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank أنت... come اعثر على me...
actors.mobs.npcs.ghost.desc=The شبح is barely مرئي. It يبدو مثل a shapeless spot of faint ضوء مع a sorrowful face.

actors.mobs.npcs.imp.name=ambitious imp
actors.mobs.npcs.imp.intro=Are أنت an adventurer? I love adventurers! أنت يمكن دائمًا rely on them if something يحتاج to be قُتل, am I يمين? For a bounty of course ;)
actors.mobs.npcs.imp.golems_1=In my case إنه _golems_ ذلك تحتاج to be قُتل. أنت see, I'm going to start قليلًا business هنا, but تلك stupid golems are bad for business! إنه very صعب to negotiate مع wandering lumps of granite, damn them! So please يقتل... let's say _4 of them_ and a مكافأة is خاصتكs.
actors.mobs.npcs.imp.monks_1=In my case إنه _monks_ who تحتاج to be قُتل. أنت see, I'm going to start قليلًا business هنا, but تلك lunatics لا شراء anything themselves and سوف scare بعيدًا other customers. So please يقتل... let's say _5 of them_ and a مكافأة is خاصتكs.
actors.mobs.npcs.imp.golems_2=How is خاصتك golem safari going? Just لا forget to grab تلك tokens.
actors.mobs.npcs.imp.monks_2=Oh, أنت're still alive! I knew ذلك خاصتك kung-fu قد be stronger ;) Just لا forget to grab تلك tokens.
actors.mobs.npcs.imp.cya=See أنت, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.desc=Imps are lesser الشياطين. هم are notable for neither الخاص بهم قوة nor الخاص بهم سحر موهبة, but هم are quite smart and sociable. Many imps prefer to live among non-الشياطين.

actors.mobs.npcs.impshopkeeper.name=ambitious imp
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did أنت do %s? متجر بسرعة, I've got to احصل على out of هنا!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust أنت!
actors.mobs.npcs.impshopkeeper.buyback=The imp cheerily returns خاصتك عنصر.
actors.mobs.npcs.impshopkeeper.desc=The imp لديه set up قليلًا متجر on the border of the inner قاعات. إنه nice to see a friendly face, but his prices بالتأكيد لا seem friendly.

actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=هذا illusion bears a close resemblance to أنت, even seeming to wield خاصتك current سلاح and درع.\n\nMirror images سوف seek and هجوم أعداء باستخدام الخاص بهم mimicked سلاح, which behaves the same as خاصتكs, but يسبب less ضرر. هم start out nearly inمرئي, but يجب take on a form ذلك's more easily seen in order to هجوم.\n\nبينما الخاص بهم offensive قوة يمكن أن يكون potent, mirror images لديك لا durability, and سوف fade the moment هم take ضرر.
actors.mobs.npcs.mirrorimage.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific لفافة.

actors.mobs.npcs.npc.discover_hint=أنت يمكن اعثر على هذا شخصية in a specific region of الزنزانة.

actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=هذا shimmering illusion bears a close resemblance to أنت, even seeming to wield خاصتك current سلاح and درع.\n\nPrismatic images سوف attempt to seek and draw focus من أعداء, باستخدام الخاص بهم enhanced دفاع and صحة to protect أنت. بينما هم do not لديك the same offensive قوة as mirror images, هم لديك enhanced durability, including receiving benefits من خاصتك درع.\n\nعندما reduced to 0 hp, prismatic images سوف fade فوق several أدوار, and يمكن still be healed أثناء هذا time. عندما لا أعداء are present, prismatic images سوف fade and rejoin الخاص بهم master.
actors.mobs.npcs.prismaticimage.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific لفافة.

actors.mobs.npcs.ratking.name=جرذ ملك
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What is it? I لديك لا time for هذا nonsense. My kingdom لن rule itself!
actors.mobs.npcs.ratking.confused=Wha... حيث am I? My kingdom يحتاج me!
actors.mobs.npcs.ratking.crown_clothes=Put some clothes on! أنت're in لا state to talk to royalty!
actors.mobs.npcs.ratking.crown_desc=Oooh, is ذلك crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I يمكن offer أنت something as a مكافأة for هذا crown. A tremendous قوة befitting a بطل such as خاصتكself! قد أنت like ذلك?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more الأول.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank أنت! Now go and make خاصتك ملك proud!
actors.mobs.npcs.ratking.crown_fine=Fine! إنه not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying خاصتك new درع? لا take-backsies!
actors.mobs.npcs.ratking.desc_crown=هذا جرذ is قليلًا bigger than a عادي marsupial جرذ. إنه مرتديًا ملك الأقزام's crown on its head.
actors.mobs.npcs.ratking.desc_birthday=هذا جرذ is قليلًا bigger than a عادي marsupial جرذ. إنه مرتديًا a ضئيل أخضر party hat بدلًا من its usual crown. Happy birthday جرذ ملك!
actors.mobs.npcs.ratking.desc_winter=هذا جرذ is قليلًا bigger than a عادي marsupial جرذ. إنه مرتديًا a ضئيل festive hat بدلًا من its usual crown. Happy Holidays!
actors.mobs.npcs.ratking.desc=هذا جرذ is قليلًا bigger than a عادي marsupial جرذ. إنه مرتديًا a ضئيل crown on its head.
actors.mobs.npcs.ratking.discover_hint=أنت يمكن اعثر على هذا شخصية at the end of a specific region of الزنزانة.

actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa!=Baa!
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=هذا is a سحر sheep. What's so سحري about it? أنت يمكن't يقتل it. It سوف يقف هناك until it magically fades بعيدًا, all the بينما chewing cud مع a blank stare.
actors.mobs.npcs.sheep.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific عنصر or فخ.

actors.mobs.npcs.shopkeeper.name=صاحب المتجر
actors.mobs.npcs.shopkeeper.thief=لص, لص!
actors.mobs.npcs.shopkeeper.warn=Watch it! I لن warn أنت again.
actors.mobs.npcs.shopkeeper.flee=The صاحب المتجر flees!
actors.mobs.npcs.shopkeeper.sell=بيع an عنصر
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The صاحب المتجر reluctantly returns خاصتك عنصر.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I لديك everything أنت تحتاج for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=ذلك's an interesting seal أنت've got هناك, هم're عادةً in واحد piece. أنت a disgraced بطل or something? بئر whatever أنت've done is لا شيء of my business, خاصتك coins are still جيد.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster مع خاصتك الاسم on it somewhere in the مدينة. On the لعبة are نحن? Oh أنت're innocent are أنت? Of course, of course... لا fret, I've got better things to do than report on أنت, but ربما أنت ينبغي شراء something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=لديك أنت come من the اللصوص نقابة to clear the area? لا, just shopping? بئر يقتل a few وحوش بينما أنت're هنا anyway. لا expect a discount either, I pay جيد protection money to أنت people and أنت're barely keeping me آمن down هنا.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=أنت seem to be out of خاصتك element miss. Tight الزنزانة corridors aren't as spacious as grand قاعات or the forests المحيط the مدينة are هم? Hehe, oh لا mind my rambling, why not شراء something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=بئر if it ليس the travelling بطل! If أنت're trying to save another town then جيد luck, the dangers هنا are much worse than petty bandit gangs. I'm sure أنت'll do better than anyone else could, just try to not يموت يمين الخارج my store.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=بئر hello هناك خاصتك Highness, or is it خاصتك Holiness now? Hehe, either way هذا is لا place for أنت, كثيرًا of people قد be quite distraught if أنت wound up dead. Surely أنت لديك some coins though, why not شراء something to help prevent ذلك?
actors.mobs.npcs.shopkeeper.talk_caves=Spend money, live longer.\n\nOh and say hello to ذلك ترول حداد for me if أنت see him. Remind the lug ذلك he still owes me money for ذلك hammer I sold him last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares يمكن keep أنت آمن down هنا.\n\n...And لا loiter if أنت please. It took forever to احصل على the locals down هنا to leave me alone, I لا want أنت attracting any trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hey هناك, I've got خاص prices for شيطان hunters!\n\nOh and be careful down هناك! The الشياطين أسفل لن care how courageous أنت are. أنت يمكن't come للخلف up and spend more money if أنت're dead! ;)\n\nAre the الشياطين like me? Hehe, not at all. I'm just a صغير fellow, not much of a مقاتل, and I've managed to keep my mind intact. The الشياطين أسفل are much stronger things, and هم've all been enslaved by... بئر... just be careful down هناك.
actors.mobs.npcs.shopkeeper.talk_ascent=I لا know what أنت're planning to do مع ذلك تميمة but I want لا part of it. شراء something and تحرك on, نحن both تحتاج to leave هذا place!
actors.mobs.npcs.shopkeeper.desc=هذا stout guy looks more appropriate for a trade district in some كبير مدينة than for a الزنزانة. His prices explain why he prefers to do business هنا.

actors.mobs.npcs.wandmaker.name=قديم صانع العصي السحرية
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hello هناك! What a pleasant surprise to meet a محارب من the north in such a depressing place! أنت يجب لديك travelled quite far to احصل على هنا. If أنت're looking for adventure, I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_rogue=Oh Goodness, أنت startled me! I haven't met a bandit من هذا place ذلك still لديه his sanity, so أنت يجب be من the surface! If أنت're up to helping a stranger out, I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hello %s! I heard هناك was some ruckus regarding أنت and the wizards institute? Oh أبدًا mind, I أبدًا liked تلك stick-in-the-muds anyway. If أنت're willing, I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hello miss! A friendly face is a pleasant surprise down هنا ليس it? In fact, I swear I've seen خاصتك face قبل, but I لا يستطيع put my finger on it... Oh أبدًا mind, if أنت're هنا for adventure, I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hello miss! What a pleasant surprise to meet a بطل in such a depressing place! If أنت're up to helping an قديم man out, I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hello خاصتك Highness! What a pleasant surprise to meet أنت in such a depressing place! I hate to impose, but I may لديك a task for أنت.
actors.mobs.npcs.wandmaker.intro_1=\n\nI came هنا to اعثر على a نادر ingredient for a عصا سحرية, but I've gotten myself فقد, and my سحري درع is weakening. I'll تحتاج to leave soon, but لا يستطيع bear to go بدون getting what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I'm looking for some _corpse dust._ إنه a خاص kind of ملعون bone meal ذلك عادةً shows up in places like هذا. هناك ينبغي be a barricaded غرفة حول هنا somewhere, I'm sure some غبار سوف دور up هناك. Do be careful though, the لعنة the غبار carries is quite potent, _get back to me as fast as you can_ and I'll cleanse it for أنت.
actors.mobs.npcs.wandmaker.intro_ember=I'm looking for some _fresh embers_ من a newborn نار elemental. Elementals عادةً pop up عندما a summoning ritual ليس controlled, so just اعثر على some candles and a ritual site and I'm sure أنت يمكن احصل على واحد to pop up. أنت'll want to _avoid boxing yourself in_ بينما fighting it though, or أنت could _keep some sort of freezing item handy._ Newborn Elementals are pretty قوي and chaotic, but هم لا يستطيع يقف the cold.
actors.mobs.npcs.wandmaker.intro_berry=The قديم الحارسة of هذا سجن kept a _rotberry plant,_ and I'm بعد واحد of its بذور. The نبات لديه probably gone wild by now though, so getting it to give up a بذرة might be tricky. Its garden ينبغي be somewhere حول هنا. Try to _keep away from its vine lashers_ if أنت want to stay in واحد piece. باستخدام نار might be tempting but please لا, أنت'll يقتل the نبات and يدمر its بذور.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf أنت يمكن احصل على ذلك for me, I'll be happy to pay أنت مع واحد of my finely مصنوع عصي سحرية! I brought اثنان مع me, so أنت يمكن take whichever واحد أنت prefer.
actors.mobs.npcs.wandmaker.reminder_dust=Any luck مع جثة غبار, %s? Look for some barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Any luck مع تلك embers, %s? أنت'll تحتاج to اعثر على أربعة candles and the ritual site.
actors.mobs.npcs.wandmaker.reminder_berry=Any luck مع a التوت المتعفن بذرة, %s? Look for a غرفة مملوء مع vegetation.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=هذا قديم yet hale gentleman wears a slightly confيُستخدم expression. He is protected by a سحر درع.



###mobs
actors.mobs.acidic.name=حمضي scorpio
actors.mobs.acidic.desc=هذه ضخم arachnid-like demonic مخلوقات avoid close combat, preferring to نار crippling serrated spikes من long distances. هذا واحد يظهر to be dripping مع آكل ooze.

actors.mobs.albino.name=albino جرذ
actors.mobs.albino.desc=هذا is a نادر breed of marsupial جرذ, مع pure أبيض fur and jagged teeth.
actors.mobs.albino.discover_hint=أنت يمكن rarely اعثر على هذا عدو in a specific region of الزنزانة.

actors.mobs.armoredstatue.name=armored تمثال
actors.mobs.armoredstatue.desc=أنت قد think ذلك إنه just another واحد of هذا الزنزانة's inanimate statues, but its أحمر glowing eyes give it بعيدًا.\n\nIt يبدو to be in عظيم condition because of the درع إنه مرتديًا, it might be very صعب to يقتل.
actors.mobs.armoredstatue.desc_arm_wep=بينما the تمثال itself is مصنوع of حجر, the _%1$s_ and _%2$s_ إنه wielding look real.

actors.mobs.bandit.name=crazy bandit
actors.mobs.bandit.desc=An elite لص, distinguished by الخاص بهم more opulent أرجواني robe. Despite الخاص بهم greater skill, هم've become just as mindless as عادي اللصوص.\n\nIn addition to stealing من أنت, crazed bandits سوف لفترة وجيزة أعمى, cripple, and سم أنت! هم're much أكثر احتمالًا to be carrying extra loot than a عادي لص though.

actors.mobs.bat.name=vampire خفاش
actors.mobs.bat.desc=هذه brisk and tenacious inhabitants of the كهوف are much more خطير than هم seem. هم replenish الخاص بهم صحة مع each successful هجوم, which يسمح them to اهزم much larger opponents.

actors.mobs.bee.name=ذهبي bee
actors.mobs.bee.desc_honey=Despite الخاص بهم صغير size, ذهبي bees tend to protect الخاص بهم home fiercely. هذا واحد تم placated, and يبدو to want to follow أنت.
actors.mobs.bee.desc=Despite الخاص بهم صغير size, ذهبي bees tend to protect الخاص بهم home fiercely. هذا واحد is very mad, better keep خاصتك distance.
actors.mobs.bee.discover_hint=أنت يمكن اعثر على هذا شخصية مع a specific عنصر.

actors.mobs.brute.name=نوول brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=Brutes are the largest, strongest, and toughest of all gnolls. عندما mortally wounded, هم go berserk, gaining temporary تحصين and a كبير boost to ضرر.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=هذا نوول brute is dying, but wants to take أنت مع it!\n\nThe brute سوف يموت عندما its تحصين wears off, either due to time or if it is damaged. In the meantime, it سوف صفقة hugely increased ضرر, so watch out!\n\nدرع remaining: %d.

actors.mobs.causticslime.name=كاوٍ slime
actors.mobs.causticslime.desc=هذا slime يبدو to لديك been tainted by the مظلم سحر emanating من الأسفل. It لديه فقد its usual أخضر color, and drips مع كاوٍ ooze.
actors.mobs.causticslime.discover_hint=أنت يمكن rarely اعثر على هذا عدو in a specific region of الزنزانة.

actors.mobs.crab.name=sewer سرطان
actors.mobs.crab.desc=هذه ضخم crabs are at the top of the طعام chain in the مجاري. هم are extremely fast and الخاص بهم سميك carapace يمكن withstand heavy blows.

actors.mobs.crystalguardian.name=بلورة حارس
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=هذه كبير crystalline guardians almost look like statues, if it weren't for الخاص بهم ساطع glowing eyes. The hardened بلورة هم're مصنوع out of يسبب them to be sluggish but very tough, so _it's best to leave them to sleep in their crystal nest for as long as possible._\n\nDue إلىir size, بلورة guardians سوف تحرك much more ببطء in enclosed spaces. هم're also so durable ذلك هم're impossible to يقتل outright. هم يمكن أن يكون beaten down and مؤقتًا disabled, but هم'll just احصل على للخلف up again بعد قليلًا بينما.
actors.mobs.crystalguardian.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.crystalmimic.name=بلورة mimic
actors.mobs.crystalmimic.ate=The mimic ate خاصتك %s!
actors.mobs.crystalmimic.escaped=The بلورة mimic لديه escaped!
actors.mobs.crystalmimic.desc=Mimics are سحري مخلوقات which يمكن take any shape هم wish. In dungeons هم almost دائمًا اختر a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nبلورة mimics are trickier than الخاص بهم عادي cousins, and prefer to avoid conflict بينما stealing loot. هم سوف attempt to sprint بعيدًا once disمغطى, and لديك the قدرة to reposition أعداء عندما هم هجوم.

actors.mobs.crystalspire.name=بلورة spire
actors.mobs.crystalspire.warning=The بلورة vibrates as أنت strike it. Keeping هذا up is bound to draw attention to أنت...
actors.mobs.crystalspire.alert=The vibration grows and rumbles عبر the whole cave!
actors.mobs.crystalspire.desc=هذا gigantic spire of ultra صعب بلورة is probably the مصدر of all the غريب crystalline مخلوقات in هذا cave. خاصتك عادي أسلحة are ineffective aيحصل علىt it, so أنت'll تحتاج to استخدم خاصتك فأس if أنت want to يدمر it.\n\n_Make sure you're prepared before you start breaking it._ Such a big بلورة is على الأرجح to take a بينما to mine عبر, and أنت probably لن be able to do it undisturbed. The spire itself may even لديك some means of defending itself أيضًا. _Perhaps the spire's own attacks could be used against its minions._
actors.mobs.crystalspire.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.crystalwisp.name=بلورة wisp
actors.mobs.crystalwisp.beam_kill=The beam of ضوء قُتل أنت...
actors.mobs.crystalwisp.desc=A صغير angry floating chunk of hardened بلورة ذلك's producing a ساطع glow. بينما not especially قوي, بلورة wisps سوف shoot a damaging beam of ضوء at أنت if هم لديك a clear shot.\n\nWisps are صغير enough to easily تحرك عبر the various بلورة outcroppings, but هم aren't able to shoot عبر them.
actors.mobs.crystalwisp.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.demonspawner.name=شيطان spawner
actors.mobs.demonspawner.on_death=The demonic طاقة هنا يبدو to lessen as the spawner dies.
actors.mobs.demonspawner.desc=هذا twisting amalgam of dwarven flesh is responsible for creating ripper الشياطين من the الأقزام ذلك لديك مات in هذا region. Clearly the الشياطين see لا issue مع باستخدام every resource هم يمكن aيحصل علىt الخاص بهم أعداء.\n\nبينما visually terrifying, شيطان spawners لديك لا means of يتحرك or directly defending themselves. الخاص بهم considerable mass يجعل them صعب to يقتل بسرعة لكن, and هم سوف spawn ripper الشياطين more بسرعة عندما هم are تحت threat.\n\n_Demon spawners seem to be connected to some central source of demonic power. Killing them may weaken it._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=The lightning bolt قُتل أنت...
actors.mobs.dm100.desc=The DM-100 is an early model of dwarven 'دفاع machine' which was designed to protect dwarven miners in the كهوف أسفل هذا سجن. الخاص بهم electrical shocks proved too ضعيف لكن, and so هم were gifted إلى human مدينة أعلى. هم went unيُستخدم for years and في النهاية تم العثور على الخاص بهم way إلى سجن, حيث the الحارسة initially deemed them too cruel to استخدم. لكن, as the prisoners became more unruly هم became a necessity.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=The DM-200 fires a jet of سام exhaust!
actors.mobs.dm200.desc=The DM-200 is the الثاني generation of dwarven 'دفاع machine', which was designed to protect dwarven miners in the كهوف and مدينة أسفل. هم are much larger and bulkier than الخاص بهم predecessors, and هجوم مع devastating hydraulic fists.\n\nالخاص بهم increased size is also الخاص بهم primary weakness, as هم are unable to fit إلى narrow tunnels and doorways of الزنزانة. The الأقزام were able to compensate for the DM-200's lack of mobility by allowing them to vent الخاص بهم سام exhaust fumes at distant أعداء, or أعداء هم لا يمكن reach.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=The DM-201 lobs a آكل grenade!
actors.mobs.dm201.desc=The الأقزام لفترة وجيزة experimented مع more heavily emphasizing the DM-200's lack of mobility and تم إنشاؤه some DM models ذلك are entirely stationary. The DM-201 is a retrofitted DM-200 which acts as a حارس turret ذلك لديه لا movement قدرة. In exchange for the lack of mobility, DM-201s لديك significantly more durability and attacking قوة.\n\nAs DM-201s لديك لا engine to vent exhaust من, the الأقزام instead outfitted them مع آكل gas grenades! DM-201s are careful معse grenades لكن, and سوف only lob them عندما attacked من a distance.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNAUTHORIZED PERSONNEL DETECTED!
actors.mobs.dm300.shield=DM-300 pulls قوة من the exposed wires and shields itself!
actors.mobs.dm300.charging=SUSTAINING ضرر! ACTIVATING قوة PYLON!
actors.mobs.dm300.charging_hint=DM-300 is invulnerable بينما it is being energized by a pylon!
actors.mobs.dm300.supercharged=يدمر! يدمر! يدمر!
actors.mobs.dm300.charge_lost=PYLON مدمر! REVERTING TO LOCAL قوة!
actors.mobs.dm300.pylons_destroyed=ALERT! INSTABILITY DETECTED IN قوة GRID!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL ضرر! ATTEMPTING SHUTDO-
actors.mobs.dm300.desc=The DM-300 is the largest and most قوي 'دفاع machine' ذلك the الأقزام ever مبني. Such an awesome machine is difficult to manufacture, so the الأقزام only ever مصنوع a few to guard the entrances إلىir underground metropolis.\n\nIt is مجهّز مع vents to jet its سام exhaust fumes and a high قوة drill ذلك it يمكن استخدم both to هجوم and disrupt the earth. DM-300 يمكن also connect to an طاقة grid, further enhancing its قوة.
actors.mobs.dm300.desc_supercharged=DM-300 is currently charged full of electrical طاقة. In هذا form DM-300 لا يمكن أن يكون damaged and يتحرك at double speed! Additionally, its drill now spins fast enough for it to _tunnel through solid rock,_ though it يتحرك much more ببطء عندما doing هذا.\n\nAttacking DM-300 directly is pointless بينما it is supercharged, but _something in the area must be providing it with this energy,_ destroying ذلك may weaken it.

actors.mobs.dwarfking.name=ملك of الأقزام
actors.mobs.dwarfking.notice=How dare أنت! أنت لديك لا idea what أنت're interfering مع!
actors.mobs.dwarfking.lifelink_1=I لديك تحتاج of خاصتك essence, slave!
actors.mobs.dwarfking.lifelink_2=Bleed for me, slave!
actors.mobs.dwarfking.teleport_1=صفقة معm, slave!
actors.mobs.dwarfking.teleport_2=Keep them busy, slave!
actors.mobs.dwarfking.wave_1=Enough! Arise my slaves!
actors.mobs.dwarfking.wave_2=More! Bleed for خاصتك ملك!
actors.mobs.dwarfking.wave_3=Useless! يقتل THEM NOW!
actors.mobs.dwarfking.enraged=أنت لا يمكن يقتل me %s. I. AM. IMMORTAL!
actors.mobs.dwarfking.losing=لا! أنت يمكن't do هذا... أنت لديك لا idea what lies أسفل...
actors.mobs.dwarfking.defeated=أنت've... Doomed us all...
actors.mobs.dwarfking.rankings_desc=سقط قبل the ملك of الأقزام
actors.mobs.dwarfking.desc=Many years ago واحد of the highest wizards in the dwarven court unمغطى secrets which gave him tremendous قوة فوق life and موت. He soon put هذا قوة to استخدم, subjugating and corrupting his peers, his ملك, and في النهاية every dwarven citizen. Now he is ملك, ruler فوق a legion of undead subjects.\n\nThe ملك of الأقزام is an aggressive foe, who سوف attempt to surround and overwhelm his أعداء مع his horde of undead minions.
actors.mobs.dwarfking$dkghoul.rankings_desc=سقط قبل the ملك of الأقزام
actors.mobs.dwarfking$dkmonk.rankings_desc=سقط قبل the ملك of الأقزام
actors.mobs.dwarfking$dkwarlock.rankings_desc=سقط قبل the ملك of الأقزام
actors.mobs.dwarfking$dkgolem.rankings_desc=سقط قبل the ملك of الأقزام

actors.mobs.ebonymimic.name=ebony mimic
actors.mobs.ebonymimic.reveal=هناك was a mimic هناك!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=هناك يبدو to be something هنا, but إنه almost totally transparent.
actors.mobs.ebonymimic.desc=Mimics are سحري مخلوقات which يمكن take any shape هم wish. In dungeons هم almost دائمًا اختر a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nEbony mimics are stealthy mimics مع قدرة to make themselves almost inمرئي. هم lurk on things ذلك adventurers are على الأرجح to interact مع, but do contain loot of الخاص بهم own أيضًا. هم aren't any tougher than a عادي mimic once disمغطى, but الخاص بهم surprise bite is devastating.
actors.mobs.ebonymimic.discover_hint=أنت يمكن اعثر على هذا عدو مع a specific تميمة.

actors.mobs.elemental$fireelemental.name=نار elemental
actors.mobs.elemental$fireelemental.desc=Elementals are chaotic مخلوقات ذلك are غالبًا تم إنشاؤه عندما قوي occult سحر ليس properly controlled. Elementals لديك minimal intelligence, and are عادةً associated مع a particular type of سحر.\n\nنار elementals are a شائع type of elemental which يسبب ضرر مع fiery سحر. هم سوف set الخاص بهم هدف ablaze مع اشتباك هجمات, and يمكن occasionally shoot bolts of نار أيضًا.
actors.mobs.elemental$newbornfireelemental.name=newborn نار elemental
actors.mobs.elemental$newbornfireelemental.charging=The elemental is charging up!
actors.mobs.elemental$newbornfireelemental.desc=Elementals are chaotic مخلوقات ذلك are غالبًا تم إنشاؤه عندما قوي occult سحر ليس properly controlled. Elementals لديك minimal intelligence, and are عادةً associated مع a particular type of سحر.\n\nهذا نار elemental is freshly مستدعى, but still quite خطير!
actors.mobs.elemental$newbornfireelemental.desc_boss=Because of the chaotic الطبيعة of its summoning, هذا elemental يمكن only spread نار in inaccurate blasts بعد charging for a دور.
actors.mobs.elemental$newbornfireelemental.desc_ally=Because هذا elemental was مستدعى by a تعويذة, it لديه قليلًا more control فوق its لهب. إنه incapable of making بعيد المدى هجمات, but سوف ignite أعداء it هجمات in اشتباك.
actors.mobs.elemental$newbornfireelemental.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.
actors.mobs.elemental$frostelemental.name=صقيع elemental
actors.mobs.elemental$frostelemental.desc=Elementals are chaotic مخلوقات ذلك are غالبًا تم إنشاؤه عندما قوي occult سحر ليس properly controlled. Elementals لديك minimal intelligence, and are عادةً associated مع a particular type of سحر.\n\nصقيع elementals are a شائع type of elemental which weakens أعداء مع chilling سحر. هم سوف chill الخاص بهم هدف مع اشتباك and occasional بعيد المدى هجمات. الخاص بهم سحر is much more effective in ماء.
actors.mobs.elemental$shockelemental.name=shock elemental
actors.mobs.elemental$shockelemental.desc=Elementals are chaotic مخلوقات ذلك are غالبًا تم إنشاؤه عندما قوي occult سحر ليس properly controlled. Elementals لديك minimal intelligence, and are عادةً associated مع a particular type of سحر.\n\nShock elementals are a less شائع type of elemental which disrupts its أعداء مع الكهرباء and flashes of ضوء. In اشتباك هم سوف arc الكهرباء to الأعداء القريبون, and صفقة مكافأة إضافية ضرر إلىir primary هدف if هم are in ماء. هم سوف also occasionally focus a بعيد المدى blast of ضوء at الخاص بهم هدف, مؤقتًا blinding them.
actors.mobs.elemental$chaoselemental.name=chaos elemental
actors.mobs.elemental$chaoselemental.desc=Elementals are chaotic مخلوقات ذلك are غالبًا تم إنشاؤه عندما قوي occult سحر ليس properly controlled. Elementals لديك minimal intelligence, and are عادةً associated مع a particular type of سحر.\n\nChaos elementals are نادر and خطير elementals which haven't stabilized to a particular element. هم سوف unleash wild unpredictable سحر عندما هم هجوم.

actors.mobs.eye.name=شرير eye
actors.mobs.eye.deathgaze_kill=The deathgaze قُتل أنت...
actors.mobs.eye.desc=شرير Eyes are floating balls of pent up demonic طاقة. بينما هم are capable of اشتباك combat, الخاص بهم true قوة comes من الخاص بهم سحر.\n\nبعد building طاقة لفترة قصيرة an شرير Eye سوف unleash a devastating beam of طاقة called the _deathgaze._ Anything داخل the شرير Eye's sights سوف take tremendous ضرر, wise adventurers سوف لعبة for cover.

actors.mobs.fetidrat.name=fetid جرذ
actors.mobs.fetidrat.desc=Something is clearly wrong مع هذا جرذ. Its greasy أسود fur and rotting skin are very different من the healthy rats أنت've seen previously. Its pale أخضر eyes make it seem especially menacing.\n\nThe جرذ carries a سحابة of horrible stench مع it, إنه overpoweringly قوي up close.\n\nمظلم ooze dribbles من the جرذ's mouth, it يأكل عبر الطابق but يبدو to dissolve in ماء.
actors.mobs.fetidrat.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.fungalcore.name=fungal core
actors.mobs.fungalcore.desc=هذا gigantic فطر يجب be the مصدر of all the fungal activity in هذا cave.

actors.mobs.fungalsentry.name=fungal حارس
actors.mobs.fungalsentry.desc=هذا especially tall فطر acts as a point of دفاع for the larger fungal network living in هذا cave.\n\nIt is immobile, but سوف shoot precise blasts of سم at anything ذلك gets داخل its line of sight. بينما the impact of هذه blasts is fairly ضعيف, _they can stack up deadly amounts of poison very quickly._ بينما it يمكن أن يكون قُتل, إنه probably best to avoid it.

actors.mobs.fungalspinner.name=fungal spinner
actors.mobs.fungalspinner.desc=هذا cave spinner يظهر to be being controlled by a parasitic fungus. The fungus لديه also changed its قدرات, replacing its web and venom sacks مع fungal growth.\n\nThe fungal spinner سوف spit نبات life at أنت بدلًا من webs, spreading fungal vegetation and potentially rooting أنت. بينما it لا يستطيع سم, the fungal spinner سوف يكتسب substantial ضرر مقاومة if it is adjacent to any mushrooms.

actors.mobs.ghoul.name=dwarven ghoul
actors.mobs.ghoul.desc=As dwarven society ببطء began to collapse, and the current ملك of the الأقزام seized absolute قوة, تلك who were ضعيف or who resisted him were not treated بئر. As the ملك grew more adept at wielding مظلم سحر, he bent هذه الأقزام to his سوف, and now هم make up the footsoldiers of his army.\n\nGhouls are not especially قوي on الخاص بهم own, but دائمًا travel in groups and are much harder to يقتل in كبير numbers. _When a ghoul is defeated, it will rise again after a few turns as long as another ghoul is nearby._

actors.mobs.gnoll.name=نوول scout
actors.mobs.gnoll.desc=Gnolls are hyena-like humanoids. هم dwell in مجاري and dungeons, venturing up to raid the surface من time to time. نوول scouts are عادي members of الخاص بهم pack, هم are not as قوي as brutes and not as intelligent as shamans.

actors.mobs.gnollexile.name=نوول exile
actors.mobs.gnollexile.desc=هذا grey-furred نوول لديه a كبير mark on its shoulder, denoting it as an exile. Gnolls are عادةً exiled من الخاص بهم society for ignoring orders or breaking laws. Exiles لديك to be قوي and shrewd to survive, هذا واحد يبدو مثل it knows how to استخدم the رمح إنه holding.
actors.mobs.gnollexile.desc_passive=_The gnoll exile isn't moving to attack._ It لا seem as aggressive as the other gnolls هنا, and probably لا think ذلك fighting أنت is worth it. أنت could just let it pass, but it لديه a حقيبة ذلك might be full of useful عناصر...
actors.mobs.gnollexile.desc_aggro=_The gnoll exile looks around angrily._ It يبدو something لديه مصنوع it decide to fight بعد all. Watch out for ذلك رمح!
actors.mobs.gnollexile.seen_passive=The رمح-wielding نوول looks at أنت warily, but لا تحرك to هجوم.
actors.mobs.gnollexile.seen_aggro=The رمح-wielding نوول يتحرك to هجوم!

actors.mobs.gnollgeomancer.name=نوول geomancer
actors.mobs.gnollgeomancer.warning=The geomancer begins to stir. Make sure أنت're ready قبل أنت continue!
actors.mobs.gnollgeomancer.alert=The geomancer awakens! The entire cave يبدو to shift as it leaps بعيدًا بينما laughing madly!
actors.mobs.gnollgeomancer.rock_kill=The flying boulder قُتل أنت...
actors.mobs.gnollgeomancer.rockfall_kill=The falling rocks قُتل أنت...
actors.mobs.gnollgeomancer.desc=هذا impressively tall senior نوول يجب be the مصدر of the various earth-يتحرك سحر حول هنا, and the organizer of all the نوول activity. Unlike the نوول sappers in the area, the geomancer is quite adept مع its سحر, and لا يمكن أن يكون damaged by مقذوف or falling rocks. It لا لديك any way to fight in اشتباك combat though.
actors.mobs.gnollgeomancer.desc_armor=The geomancer is currently encased in a layer of rock درع. _You'll need to get up close and break it away with your pickaxe before you can damage the geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby gnoll sapper is holding a device that is empowering the geomancer's rock armor. You won't be able to damage it at all right now!_
actors.mobs.gnollgeomancer.desc_sleeping=هذا impressively tall نوول shaman is surrounded by a layer of rock, and looks almost like a تمثال. Looking closely أنت يمكن see the rock magically تحرك in time مع senior نوول's breathing. It لا يستطيع be harmed بينما encased in rock like هذا, and it يظهر to be enjoying a literal dirt nap.\n\nأنت يمكن probably يكسر عبر the layers of rock مع خاصتك فأس, but _be sure you're ready for a fight when you do so._ The geomancer يجب be the مصدر of the various earth-يتحرك سحر حول هنا, and the organizer of all the نوول activity. _Defeating the gnolls scattered around here before fighting it might be a good idea._
actors.mobs.gnollgeomancer.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.gnollguard.name=نوول guard
actors.mobs.gnollguard.def_verb=blocked
actors.mobs.gnollguard.spear_warn=The نوول lands a vicious blow مع tip of its رمح!
actors.mobs.gnollguard.desc=A كبير and tough looking نوول wielding a رمح and a درع, but لا خوذة. هذه guards are على الأرجح brutes in training, roped إلى helping protect the mine من encroaching wildlife.\n\nThe نوول guard is قوي enough to wield the رمح in واحد hand, but لا يستطيع استخدم it very بئر. _It will need fairly open space to attack at a distance, and will do notably less damage to you if you get up close._
actors.mobs.gnollguard.desc_armor=_A nearby gnoll sapper is holding a device that is granting this guard earthen armor, heavily reducing the damage it takes._
actors.mobs.gnollguard.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.gnollsapper.name=نوول sapper
actors.mobs.gnollsapper.desc=A صغير and ضعيف but intelligent نوول مع pale fur and a satchel full of various gadgets. هم are على الأرجح هنا to assist مع prospecting and mining ذهب مظلم, and لديك a بالقرب guard for protection. هم are capable of fighting, but الخاص بهم هجمات are pitifully ضعيف, لا stronger than a نوول scout.\n\nبدلًا من fighting directly, sappers prefer to استخدم the various gadgets هم لديك to make the rocky environment هجوم for them. هم لا know earth-يتحرك سحر themselves though, and so are pretty على الأرجح to استخدم الخاص بهم gadgets recklessly. _There should be lots of ways to use their attacks against them, or their guard._
actors.mobs.gnollsapper.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.gnolltrickster.name=نوول trickster
actors.mobs.gnolltrickster.desc=A غريب looking مخلوق, even by نوول standards. It hunches للأمام مع a wicked grin, almost cradling the satchel hanging فوق its shoulder. Its eyes are wide مع a غريب mix of fear and excitement.\n\nيوجد a كبير collection of poorly مصنوع سهام in its satchel, هم all seem to be tipped مع various harmful substances.
actors.mobs.gnolltrickster.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.goldenmimic.name=ذهبي mimic
actors.mobs.goldenmimic.desc=Mimics are سحري مخلوقات which يمكن take any shape هم wish. In dungeons هم almost دائمًا اختر a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nذهبي mimics are tougher mimics which try to attract the strongest adventurers. هم لديك better loot, but are also much stronger than عادي mimics.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=Golems are an attempt to correct the previous flaws in dwarven machinery via the الأقزام newfound استخدم of سحر. هم are much more compact and efficient compared إلى DM-300 بينما still being very قاتل.\n\nبينما golems are still too كبير to fit إلى passageways, the الأقزام لديك given them new سحري قدرات to compensate. Golems يمكن انتقال آني themselves between غرف, and انتقال آني أعداء إلىm عندما هم are out of reach.

actors.mobs.goo.name=الوحل
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=الوحل is pumping itself up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.rankings_desc=Absorbed by the الوحل
actors.mobs.goo.desc=Little is known about The الوحل. إنه quite possible ذلك it ليس even a مخلوق, but rather a conglomerate of vile substances من the مجاري ذلك somehow gained basic intelligence. Regardless, مظلم سحر is بالتأكيد what لديه allowed الوحل to exist.\n\nIts gelatinous الطبيعة لديه let it absorb lots of طاقة مظلمة, أنت feel a chill just من being بالقرب من. If الوحل is able to هجوم مع هذا طاقة أنت لن live for long.

actors.mobs.greatcrab.name=عظيم سرطان
actors.mobs.greatcrab.noticed=The سرطان blocks مع its هائل claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.desc=هذا سرطان is gigantic, even compared to other sewer crabs. Its أزرق shell is مغطى in cracks and barnacles, showing عظيم age. It lumbers حول ببطء, barely keeping balance مع its هائل claw.\n\nبينما the سرطان only لديه واحد claw, its size easily compensates. The سرطان holds the claw in front of any threat, تحصين itself behind an impenetrable جدار of carapace. لكن, the سرطان لا يمكن block هجمات it لا see coming, or هجمات من multiple أعداء at once.
actors.mobs.greatcrab.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.guard.name=سجن guard
actors.mobs.guard.scorpion=احصل على فوق هنا!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=Once keepers of the سجن, هذه guards لديك long since become لا different than the inmates. هم shamble like zombies, brainlessly roaming عبر the قاعات in search of anything out of place, like أنت!\n\nهم carry chains حول الخاص بهم hip, possibly يُستخدم to pull in أعداء to close range.

actors.mobs.hermitcrab.name=hermit سرطان
actors.mobs.hermitcrab.def_verb=blocked
actors.mobs.hermitcrab.desc=For واحد reason or another, هذا sewer سرطان لديه decided to يرتدي the مكسور علوي part of a barrel on its head! The extra weight لديه slown it down to عادي speed, but لديه also granted it considerably more defence. أنت think أنت يمكن hear something bouncing حول الداخل the barrel though...

actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=ذلك chest is a mimic!
actors.mobs.mimic.hidden_hint=Something about هذا chest يشعر off... Walking up and trying to مفتوح it might be a bad idea.
actors.mobs.mimic.desc=Mimics are سحري مخلوقات which يمكن take any shape هم wish. In dungeons هم almost دائمًا اختر a shape of a treasure chest, in order to lure in unsuspecting adventurers.\n\nMimics لديك a nasty bite, but غالبًا hold more treasure than a عادي chest.
actors.mobs.mimic.discover_hint=أنت يمكن اعثر على هذا عدو anywhere في الزنزانة.

actors.mobs.necromancer.name=مستحضر أرواح
actors.mobs.necromancer.desc=هذه apprentice مظلم mages لديك flocked إلى سجن, as it is the perfect place to practise الخاص بهم شرير اصنع.\n\nNecromancers سوف استدعاء and empower skeletons to fight for them. Killing the مستحضر أرواح سوف also يقتل the هيكل عظمي it summons.
actors.mobs.necromancer$necroskeleton.name=مستحضر أرواح's هيكل عظمي
actors.mobs.necromancer$necroskeleton.desc=هذا هيكل عظمي تم مستدعى by a مستحضر أرواح. It behaves just like a عادي هيكل عظمي, and سوف يموت عندما the مستحضر أرواح which مستدعى it is slain.

actors.mobs.mob.died=أنت hear something يموت in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.mob.discover_hint=أنت يمكن اعثر على هذا عدو in a specific region of الزنزانة.

actors.mobs.monk.name=قزم راهب
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=هذه monks are fanatics, who لديك devoted themselves to protecting الخاص بهم ملك عبر جسدي might. So عظيم is الخاص بهم devotion ذلك هم لديك totally surrendered الخاص بهم minds إلىir ملك, and now roam the dwarven مدينة like mindless zombies.\n\nMonks rely solely on the art of hand-to-hand combat, and are able to استخدم الخاص بهم unarmed fists both for offense and دفاع. عندما هم become focيُستخدم, monks سوف parry the next جسدي هجوم يُستخدم aيحصل علىt them, even if it was otherwise guaranteed to يضرب. Monks build focus more بسرعة بينما on the تحرك, and more ببطء عندما in direct combat.
actors.mobs.monk$focus.name=focيُستخدم
actors.mobs.monk$focus.desc=هذا راهب is perfectly honed in on الخاص بهم هدف, and seem to be anticipating الخاص بهم يتحرك قبل هم make them.\n\nبينما focيُستخدم, the next جسدي هجوم مصنوع aيحصل علىt هذا شخصية is guaranteed to miss, لا matter what circumstances توجد. Parrying هذا هجوم سوف spend the راهب's focus, and هم سوف تحتاج to build it up again to parry another هجوم. Monks build focus more بسرعة بينما هم are يتحرك.

actors.mobs.phantompiranha.name=phantom سمكة بيرانا
actors.mobs.phantompiranha.teleport_away=The phantom سمكة بيرانا teleports بعيدًا...
actors.mobs.phantompiranha.desc=Phantom piranhas are a نادر breed of سمكة بيرانا مع سحري قدرات and eerie translucent bodies. هم are capable of teleporting as هم are being attacked, either to escape or to بسرعة احصل على close إلىir عدو!\n\nبينما هم are annoying to fight, الخاص بهم meat is prized for its سحري properties.

actors.mobs.piranha.name=عملاق سمكة بيرانا
actors.mobs.piranha.desc=هذه carnivorous fish are bred specifically to protect flooded areas. الخاص بهم bite is قاتل, so إنه best to avoid confronting them directly.
actors.mobs.piranha.discover_hint=أنت يمكن اعثر على هذا عدو anywhere في الزنزانة.

actors.mobs.pylon.name=قوة pylon
actors.mobs.pylon.desc_inactive=A قوة pylon, meant to help regulate the الكهرباء which powers the machinery in هذا area.\n\nThe pylon is currently inactive and محصن to ضرر.
actors.mobs.pylon.desc_active=A قوة pylon, meant to help regulate the الكهرباء which powers the machinery in هذا area. The pylon is currently surging مع electrical طاقة, هذا يجب be what's supercharging DM-300!\n\nIn هذا state pylons are vulnerable, but سوف arc الكهرباء to بالقرب cells in a clockwise pattern. Due إلىir heavy معدن construction, pylons are resistant to كبير amounts of ضرر.

actors.mobs.rat.name=marsupial جرذ
actors.mobs.rat.desc=Marsupial rats are aggressive but rather ضعيف denizens of the مجاري. هم لديك a nasty bite, but are only life threatening in كبير numbers.

actors.mobs.ripperdemon.name=ripper شيطان
actors.mobs.ripperdemon.leap=The ripper شيطان prepares to leap!
actors.mobs.ripperdemon.desc=هذه مرعب مخلوقات are the result of the many dwarven corpses in هذا region being put to استخدم by demonic forces. Rippers are emaciated ghoulish مخلوقات ذلك resemble الأقزام, but مع مكسور bodies and long حاد claws مصنوع of bone.\n\nRipper الشياطين are not particularly durable, but هم are agile and خطير. هم are capable of leaping عظيم distances to بسرعة reach targets قبل goring them معir claws.

actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A التوت المتعفن's fruit is very فريد. بدلًا من rotting بعيدًا and providing nutrients, the fruit grows, hardens, and encompasses the بذرة. It provides protection for the internal organs which grow الداخل the fruit. هذا عملاق orb is referred to as the heart of an adult التوت المتعفن نبات.
actors.mobs.rotheart.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature التوت المتعفن نبات's root structure, and also الخاص بهم primary means of دفاع. Lashers are أعمى and stuck إلى ground, but سوف violently assault any بالقرب threat بعد taking a moment to detect them. عندما يوجد لا الأعداء القريبون, هم يقف motionless, attempting to blend in مع المحيط vegetation.
actors.mobs.rotlasher.discover_hint=أنت يمكن اعثر على هذا عدو أثناء a specific مهمة.

actors.mobs.scorpio.name=scorpio
actors.mobs.scorpio.desc=هذه ضخم arachnid-like demonic مخلوقات avoid close combat, preferring to نار crippling serrated spikes من long distances.

actors.mobs.senior.name=senior راهب
actors.mobs.senior.desc=هذه monks are fanatics, who لديك devoted themselves to protecting الخاص بهم ملك عبر جسدي might. So عظيم is الخاص بهم devotion ذلك هم لديك totally surrendered الخاص بهم minds إلىir ملك, and now roam the dwarven مدينة like mindless zombies.\n\nهذا راهب لديه mastered the art of hand-to-hand combat, and is able to يكتسب focus بينما يتحرك much more بسرعة than عادي monks. عندما هم become focيُستخدم, monks سوف parry the next جسدي هجوم يُستخدم aيحصل علىt them, even if it was otherwise guaranteed to يضرب. Monks build focus more بسرعة بينما on the تحرك, and more ببطء عندما in direct combat.

actors.mobs.shaman.name=نوول shaman
actors.mobs.shaman.bolt_kill=The سحر bolt قُتل أنت...
actors.mobs.shaman.desc=نوول shamans are intelligent gnolls who استخدم battle تعاويذ to compensate for الخاص بهم lack of might. هم لديك a very respected position in نوول society, despite الخاص بهم weaker قوة.
actors.mobs.shaman$redshaman.spell_desc=هذا shaman is مرتديًا a أحمر mask, and سوف استخدم سحر ذلك مؤقتًا _weakens your attacking power._
actors.mobs.shaman$blueshaman.spell_desc=هذا shaman is مرتديًا a أزرق mask, and سوف استخدم سحر ذلك مؤقتًا _increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=هذا shaman is مرتديًا a أرجواني mask, and سوف استخدم سحر ذلك مؤقتًا _reduces your accuracy and evasion._

actors.mobs.armoredbrute.name=armored brute
actors.mobs.armoredbrute.desc=The most senior نوول brutes غالبًا يرتدي قوي درع to show الخاص بهم status. The درع يجعل هذه brutes much more resilient to ضرر جسدي, and الخاص بهم greater discipline means هم يمكن rage for much longer قبل succumbing إلىir wounds.

actors.mobs.skeleton.name=هيكل عظمي
actors.mobs.skeleton.explo_kill=أنت were قُتل by the انفجار of عظام...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=Skeletons are composed of the عظام of unlucky adventurers and inhabitants of the سجن, animated by emanations of شرير سحر من the depths أسفل. بعد هم لديك been damaged enough, skeletons سوف disintegrate in an انفجار of عظام. The shrapnel من هذا انفجار is harmful to anything بالقرب, but درع is very effective at mitigating it.

actors.mobs.slime.name=slime
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=Slimes are غريب, slightly سحري مخلوقات مع a rubbery outer body and a سائل core. The مدينة مجاري provide them مع an ample supply of ماء and nutrients.\n\nBecause of الخاص بهم elastic outer membrane, it is difficult to صفقة more than _6 damage_ to slimes من any واحد هجوم.

actors.mobs.snake.name=sewer أفعى
actors.mobs.snake.hint=Try باستخدام the examine button on a أفعى to learn how to counter them.
actors.mobs.snake.desc=هذه oversized serpents are capable of بسرعة slithering حول blows, making them quite صعب to يضرب. سحري هجمات or surprise هجمات are capable of catching them off-guard لكن.\n\nأنت يمكن perform a surprise هجوم by attacking بينما out of the أفعى's vision. واحد way is to let a أفعى chase أنت عبر a doorway and then _strike just after it moves into the door._

actors.mobs.spectralnecromancer.name=spectral مستحضر أرواح
actors.mobs.spectralnecromancer.desc=بينما Skeletons are a مستحضر أرواح’s bread and butter, some prefer to look إلى other less corporeal minions. Spectral necromancers لديك chosen wraiths as الخاص بهم minion of choice!\n\nIndividual wraiths aren't as قوي as skeletons, but هذه necromancers aren't afraid to استدعاء a bunch of them!

actors.mobs.spinner.name=cave spinner
actors.mobs.spinner.desc=هذه greenish furry cave spiders try to avoid direct combat. Instead هم prefer to wait in the distance بينما الخاص بهم victim struggles in الخاص بهم excreted cobweb, ببطء dying من الخاص بهم venomous bite. هم are capable of shooting الخاص بهم webs عظيم distances, and سوف try to block whatever path الخاص بهم prey is taking.

actors.mobs.statue.name=animated تمثال
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=أنت قد think ذلك إنه just another واحد of هذا الزنزانة's inanimate statues, but its أحمر glowing eyes give it بعيدًا.
actors.mobs.statue.desc_weapon=بينما the تمثال itself is مصنوع of حجر, the _%s_ إنه wielding looks real.
actors.mobs.statue.discover_hint=أنت يمكن اعثر على هذا عدو anywhere في الزنزانة.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi are shapeshifting الشياطين ذلك manipulate the minds of الخاص بهم prey. هذا واحد لديه taken the form of a pale gothic humanoid, ربما to attract dwarven warlocks?\n\nSuccubi may مؤقتًا charm الخاص بهم عدو عندما هم هجوم, making الخاص بهم عدو unable to directly هجوم them. عندما succubi هجوم a charmed عدو, هم سوف سرقة some of الخاص بهم life essence.

actors.mobs.swarm.name=swarm of flies
actors.mobs.swarm.desc=The قاتل swarm of flies buzzes angrily. Every non-سحري هجوم سوف split it إلى اثنان smaller but equally خطير swarms.

actors.mobs.tengu.name=تينغو
actors.mobs.tengu.notice_gotcha=Gotcha, %s!
actors.mobs.tengu.interesting=Let's make هذا interesting...
actors.mobs.tengu.notice_have=I لديك أنت now, %s!
actors.mobs.tengu.defeated=مجاني at last...
actors.mobs.tengu.rankings_desc=Assassinated by the تينغو
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nتينغو is held down مع كبير clasps on his wrists and knees, though he يبدو to لديك gotten rid of his chains long ago.\n\nHe سوف try to استخدم أفخاخ, deceptive سحر, and precise هجمات to eliminate the only thing stopping his escape: أنت.

actors.mobs.tengu$bombability$bombblob.desc=A سحابة of superheated smoke is billowing هنا. Watch out, إنه going to explode!
actors.mobs.tengu$bombability$bombitem.name=Smoke قنبلة
actors.mobs.tengu$bombability$bombitem.cant_pickup=إنه stuck إلى ground, أنت يمكن't تحرك it!
actors.mobs.tengu$bombability$bombitem.desc=تينغو لديه مقذوف a غريب looking smoke قنبلة هنا, which is billowing a سميك hot smoke. إنه making a loud ticking noise, as if its counting down to an انفجار!\n\nThe قنبلة لديه anchored itself إلى ground, so أنت يمكن't التقط it up.

actors.mobs.tengu$fireability$fireblob.desc=تينغو لديه مقذوف a fine مسحوق ذلك يبدو to be catching إلى steam هنا, إنه about to ignite!

actors.mobs.tengu$shockerability$shockerblob.desc=Electrical طاقة is building هنا, anything واقف on هذا tile سيكون shocked next دور!
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=إنه putting out too much الكهرباء, أنت يمكن't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=تينغو لديه مقذوف a curious machine هنا, which يبدو to be مصنوع of DM-100 parts. The machine is constantly arcing الكهرباء من حوله, but it يبدو to be going in a predictable pattern.\n\nمع all the الكهرباء arcing من حوله, هناك's لا way أنت يمكن التقط هذا up.

actors.mobs.thief.name=crazy لص
actors.mobs.thief.stole=The لص stole %s من أنت!
actors.mobs.thief.carries=\n\nThe لص is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The لص gets بعيدًا مع خاصتك %s!
actors.mobs.thief.desc=Though هذه inmates roam مجاني of الخاص بهم cells, هذا place is still الخاص بهم سجن. فوق time, هذا place لديه taken الخاص بهم minds أيضًا as الخاص بهم freedom. Long ago, هذه crazy اللصوص and bandits لديك forgotten who هم are and why هم سرقة.\n\nهذه أعداء are أكثر احتمالًا to سرقة and لعبة than هم are to fight. Make sure to keep them in sight, or أنت might أبدًا see خاصتك stolen عنصر again.

actors.mobs.tormentedspirit.name=tormented روح
actors.mobs.tormentedspirit.desc=Tormented spirits are otherwise جيد-natured spirits ذلك لديك been afflicted by a لعنة. So long as هم are ملعون هم سوف هجوم just like a wraith, and are more قوي أيضًا!\n\nIt may be possible to cleanse the لعنة by باستخدام the يمين عنصر بينما next إلى روح. If the لعنة is lifted the روح سوف surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank أنت...

actors.mobs.vaultrat.desc=هذا جرذ لديه some behaviour changes to test out new vault عدو AI:\n_-_ Its movement يمكن أن يكون 'heard' عبر walls\n_-_ It سوف wander along a pre-set patrol\n_-_ بينما wandering it لديه sharply reduced detection range behind the direction it يتحرك in.\n_-_ بينما sleeping its detection range is also reduced\n_-_ عندما it detects أنت it سوف 'investigate' قبل swapping to hunting. Investigating أعداء تحرك toward أنت but لا هجوم and are easier to يفقد behind doors and corners.

actors.mobs.npcs.vaultsentry.name=vault scanning حارس
actors.mobs.npcs.vaultsentry.desc=هذا حارس is scanning the area in a pattern. _As this is just a tester area, the sentry won't do anything if it detects you._

actors.mobs.npcs.vaultlaser.name=vault laser حارس
actors.mobs.npcs.vaultlaser.desc=هذا حارس is firing lasers at عادي intervals. _As this is just a tester area, the lasers won't actually harm you._

actors.mobs.warlock.name=قزم ساحر ظلام
actors.mobs.warlock.bolt_kill=The ظل bolt قُتل أنت...
actors.mobs.warlock.desc=As the الأقزام' interests shifted من engineering to arcane arts, warlocks came to قوة in the مدينة. هم started مع elemental سحر, but soon switched to demonology and necromancy. The strongest of هذه warlocks seized the throne of the dwarven مدينة, and his cohorts were allowed to continue practising الخاص بهم مظلم سحر, so long as هم surrendered الخاص بهم مجاني سوف to him.\n\nهذه warlocks possess قوي disruptive سحر, and are able to مؤقتًا hinder the ترقية سحر مطبّق to خاصتك معدات. The more مُرقّى an عنصر is, the more strongly it سيكون affected.

actors.mobs.wraith.name=wraith
actors.mobs.wraith.desc=A wraith is a vengeful روح of a sinner, whose grave or tomb was disturbed. Being an ethereal entity, it is very صعب to يضرب مع a عادي سلاح.
actors.mobs.wraith.discover_hint=أنت يمكن اعثر على هذا عدو anywhere في الزنزانة.

actors.mobs.yogdzewa.name=يوغ-دزيفا
actors.mobs.yogdzewa.notice=I. SEE. أنت.
actors.mobs.yogdzewa.darkness=The ظلام pulls in closer...
actors.mobs.yogdzewa.hope=خاصتك. HOPE. IS. AN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by يوغ-دزيفا
actors.mobs.yogdzewa.desc=يوغ-دزيفا is an قديم God; a عظيم monstrosity which reaches إلى mortal worlds and devours them to fuel its endless growth. The الأقزام يجب لديك attracted the attention of هذا cosmic horror بينما toying مع مظلم magics, and لديك been trying to keep it contained ever since.\n\nيوغ-دزيفا originates من a dimension of raw سحري chaos, and لا يمكن bring its true form إلى هذا العالم. Instead it لديه تم إنشاؤه avatars and مستدعى demonic minions to do its bidding هنا.\n\nهذا عملاق eye is the focal point of يوغ-دزيفا's قوة in هذا العالم. بينما the eye itself is immobile, it is capable of shooting قوي beams of demonic سحر and summoning a variety of minions to aid it.
actors.mobs.yogdzewa.desc_spawners=أنت يمكن feel waves of demonic طاقة radiating إلى eye من الطابقs أعلى. Something أنت يسار alive up هناك يجب be funneling قوة للخلف إلى يوغ-دزيفا. _Yog will use this energy to summon more powerful minions!_
actors.mobs.yogdzewa$larva.name=god's larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by يوغ-دزيفا
actors.mobs.yogdzewa$larva.desc=هذه ضئيل spawn of يوغ-دزيفا are simple minions ذلك are سهل to produce. بينما individually ضعيف, هم are مستدعى بسرعة and يمكن أن يكونcome overwhelming in كبير numbers.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by يوغ-دزيفا
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by يوغ-دزيفا
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by يوغ-دزيفا

actors.mobs.yogfist.invuln_warn=The fist is invulnerable بينما بالقرب من إلى eye!
actors.mobs.yogfist.rankings_desc=Devoured by يوغ-دزيفا
actors.mobs.yogfist.desc=هذا fist is an aspect of يوغ-دزيفا's قوة. Fists are linked إلى قوة of يوغ-دزيفا, and سيكون protected من all ضرر عندما هم are close إلى eye.
actors.mobs.yogfist$burningfist.name=احتراق fist
actors.mobs.yogfist$burningfist.desc=هذا fist is formed out of chaotic fiery سحر. As it يتحرك it سوف constantly set terrain من حوله ablaze. It is also capable of shooting blasts of fiery قوة, which spread لهيب حيث هم impact.\n\nThe fist's قدرة to spread لهيب is suppressed عندما بالقرب من ماء, but its heat is so عظيم ذلك any ماء من حوله سوف evaporate بعد a short بينما!
actors.mobs.yogfist$soiledfist.name=soiled fist
actors.mobs.yogfist$soiledfist.desc=هذا fist is formed out of chaotic earthen سحر. As it يتحرك it سوف constantly cause vegetation to sprout من حوله. It يمكن also shoot concentrated earthen blasts ذلك سوف ensnare its هدف in بسرعة growing vines and roots!\n\nThe fist derives قوة من هذا النبات life, and سوف resist ضرر based on the amount of tall or furrowed vegetation بالقرب من it!
actors.mobs.yogfist$rottingfist.name=rotting fist
actors.mobs.yogfist$rottingfist.desc=هذا fist is formed out of living corruption. It is a towering mass of decaying flesh ذلك يمكن spread كاوٍ ooze in اشتباك and الغاز السام at range. Even worse, the fist's عظيم mass يسبب it to bleed بدلًا من taking ضرر directly.\n\nماء يمكن أن يكون يُستخدم to wash the ooze off, but the fist is also capable of absorbing ماء to شفاء itself! Additionally, damaging the fist بينما it is نزيف سوف cause the bleed to refresh, but not stack!
actors.mobs.yogfist$rustedfist.name=rusted fist
actors.mobs.yogfist$rustedfist.desc=هذا fist is formed out of living معدن. It is a towering mass of shifting معدن ذلك لديه قوي اشتباك هجمات, and يمكن cripple its targets at range. Because of its tremendous mass, the fist سوف take any ضرر dealt to it فوق time, بدلًا من immediately.\n\nThe fist is inflexible لكن, and لا يمكن تحرك إلى tight passageways. Additionally, بينما it may take ضرر ببطء, the deferred ضرر سوف continue to increase if the fist is يضرب multiple times.
actors.mobs.yogfist$brightfist.name=ساطع fist
actors.mobs.yogfist$brightfist.teleport=The fist teleports بعيدًا in a flash of ضوء ذلك seriously blinds أنت!
actors.mobs.yogfist$brightfist.desc=هذا fist is formed out of pure ضوء طاقة. It is capable of shooting قوي rays of searing ضوء every دور! هذه beams سوف مؤقتًا أعمى أنت in addition to مسببًا heavy ضرر. The fist is also capable of لفترة وجيزة engulfing the arena in blinding ضوء in order to escape!\n\nThe fist لديه لا خاص قدرات which it يمكن استخدم in اشتباك range لكن.
actors.mobs.yogfist$darkfist.name=مظلم fist
actors.mobs.yogfist$darkfist.teleport=The fist teleports بعيدًا in a blast of ظلام ذلك extinguishes خاصتك ضوء مصدر!
actors.mobs.yogfist$darkfist.desc=هذا fist is formed out of pure طاقة مظلمة. It is capable of shooting قوي blasts of مظلم سحر every دور! هذه blasts سوف weaken خاصتك ضوء مصدر in addition to مسببًا heavy ضرر. The fist is also capable of لفترة وجيزة engulfing the arena in ظلام in order to escape!\n\nThe fist لديه لا خاص قدرات which it يمكن استخدم in اشتباك range لكن.


