actors.hero.talent$preciseassaulttracker.name=precise assault
actors.hero.talent$preciseassaulttracker.desc=The مبارز's next عادي اشتباك هجوم سوف يكتسب مكافأة إضافية دقة.\n\nأدوار remaining: %s.
