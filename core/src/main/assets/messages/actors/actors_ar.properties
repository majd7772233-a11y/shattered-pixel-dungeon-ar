## الفئات
actors.hero.heroclass.warrior=المحارب
actors.hero.heroclass.warrior_desc_short=يتحمل المحارب ضررًا إضافيًا بفضل الحماية التي يمنحها له _ختمه المكسور._ يمكن نقل الختم بين الدروع، كما أنه _ينقل ترقية واحدة._
actors.hero.heroclass.warrior_desc=يبدأ المحارب بـ_ختم مكسور فريد_ يمنحه دفعة من الحماية عندما تنخفض صحته إلى أقل من النصف. يمكن نقل الختم بين الدروع، ويمكنه _نقل ترقية واحدة_ معه.\n\nيبدأ المحارب أيضًا بـ_سيف قصير مهترئ_، و_ثلاثة أحجار للرمي_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nيتعرف المحارب تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات الشفاء\n_-_ لفائف الغضب
actors.hero.heroclass.warrior_unlock=يتم فتح المحارب تلقائيًا.

actors.hero.heroclass.mage=الساحر
actors.hero.heroclass.mage_desc_short=الساحر خبير في السحر الغامض ويحمل _عصًا سحرية_ أقوى من العصا العادية. ويمكن _شحن العصا بأي عصا_ يجدها الساحر.
actors.hero.heroclass.mage_desc=يبدأ الساحر بـ_عصا فريدة_ تعيد الشحن أسرع بكثير من العصا العادية، وتمتلك شحنة إضافية واحدة. ويمكن _شحن العصا بأي عصا_ يجدها الساحر في الزنزانة.\n\nيبدأ الساحر أيضًا بـ_عصا الصاروخ السحري_ مشحونة في عصاه، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nيتعرف الساحر تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات اللهب السائل\n_-_ لفائف الترقية
actors.hero.heroclass.mage_unlock=لفتح الساحر _استخدم لفافة ترقية لجعل أحد العناصر أقوى._

actors.hero.heroclass.rogue=اللص
actors.hero.heroclass.rogue_desc_short=يستطيع اللص مراوغة الأعداء والضرب من حالة الاختفاء باستخدام _عباءة الظلال._ كما أنه _يكتشف الأسرار والفخاخ_ من مسافة أكبر.
actors.hero.heroclass.rogue_desc=يبدأ اللص بـ_عباءة ظلال فريدة_ يمكنه استخدامها ليصبح غير مرئي متى شاء.\n\nيستطيع اللص _اكتشاف الأسرار والفخاخ_ من مسافة أكبر.\n\nيبدأ اللص أيضًا بـ_خنجر_، و_ثلاثة سكاكين للرمي_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nيتعرف اللص تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات الاختفاء\n_-_ لفائف رسم الخريطة السحرية
actors.hero.heroclass.rogue_unlock=لفتح اللص _نفّذ 10 هجمات مفاجئة في لعبة واحدة._

actors.hero.heroclass.huntress=الصيادة
actors.hero.heroclass.huntress_desc_short=الصيادة خبيرة في الأسلحة المرمية وتمتلك _قوسًا سحريًا_ بعدد لا نهائي من الأسهم. كما أنها تمر عبر العشب الطويل _دون أن تدوسه._
actors.hero.heroclass.huntress_desc=تبدأ الصيادة بـ_قوس روحي فريد_ يمكنه إطلاق عدد لا نهائي من الأسهم المستحضرة.\n\nتستطيع الصيادة المرور عبر العشب الطويل _دون أن تدوسه_.\n\nتبدأ الصيادة أيضًا بـ_قفازات مرصعة_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nتتعرف الصيادة تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات رؤية العقل\n_-_ لفائف التهويدة
actors.hero.heroclass.huntress_unlock=لفتح الصيادة _أصب الأعداء بالأسلحة المرمية 10 مرات في لعبة واحدة._

actors.hero.heroclass.duelist=المبارزة
actors.hero.heroclass.duelist_desc_short=المبارزة خبيرة في الأسلحة ويمكنها استخدام سلاحها لتفعيل _قدرة خاصة بالسلاح._ وهذه القدرة الخاصة _تختلف من سلاح إلى آخر._
actors.hero.heroclass.duelist_desc=تبدأ المبارزة بـ_سيف مبارزة فريد_ يمتلك قدرة خاصة تُعاد شحنها بمرور الوقت.\n\nيمتلك كل سلاح في اللعبة _قدرة خاصة مختلفة_ يمكن للمبارزة استخدامها.\n\nتبدأ المبارزة أيضًا بـ_رمحين للرمي_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nتتعرف المبارزة تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات القوة\n_-_ لفائف الصورة المرآوية
actors.hero.heroclass.duelist_unlock=لفتح المبارزة _جهّز سلاحًا من المستوى 2 أو أعلى دون عقوبة قوة._

actors.hero.heroclass.cleric=الكاهن
actors.hero.heroclass.cleric_desc_short=الكاهن مستخدم للسحر الإلهي ويستخدم _كتابًا مقدسًا فريدًا_ لتوجيه السحر الإلهي. ويمكنه _تعلم التعاويذ وترقيتها_ عبر المواهب.
actors.hero.heroclass.cleric_desc=يبدأ الكاهن بـ_كتاب مقدس فريد_ يمكنه استخدامه لإلقاء تعاويذ متنوعة.\n\nتركز معظم مواهب الكاهن على تعلم التعاويذ أو ترقيتها.\n\nيبدأ الكاهن أيضًا بـ_هراوة_، ودرع من القماش، وقربة ماء، وحقيبة مخملية.\n\nيتعرف الكاهن تلقائيًا على:\n_-_ لفائف التعرف\n_-_ جرعات التطهير\n_-_ لفائف إزالة اللعنة
actors.hero.heroclass.cleric_unlock=لفتح الكاهن _طهّر لعنة أي قطعة من المعدات الملعونة بالكامل._

actors.hero.herosubclass.berserker=الهائج
actors.hero.herosubclass.berserker_short_desc=يبني _الهائج_ غضبه عندما يتلقى الضرر. يزيد الغضب ضرره ويمكن تفعيله عند 100%% للحصول على حماية إضافية.
actors.hero.herosubclass.berserker_desc=يكتسب الهائج الغضب عندما يتلقى ضررًا جسديًا، بما في ذلك الضرر الذي يحجبه درعه! يتلاشى الغضب تدريجيًا بمرور الوقت، لكنه يتلاشى ببطء أكبر عندما تكون صحته منخفضة.\n\nيمكن للغضب أن يجعل الهائج يلحق ضررًا إضافيًا يصل إلى +50%%. وعند أقصى غضب، يمكنه الدخول في حالة الهياج، فيحصل على دفعة من الحماية ويحافظ على غضبه طالما بقيت لديه حماية. تتناسب الحماية مع مستوى درع الهائج، ويمكن زيادتها بشكل هائل عندما تكون صحته منخفضة. ويحتاج الهائج إلى وقت للتعافي بعد دخوله في حالة الهياج.
actors.hero.herosubclass.gladiator=المصارع
actors.hero.herosubclass.gladiator_short_desc=يبني _المصارع_ سلسلة ضربات عند تنفيذ هجمات ناجحة. ويمكنه إنفاق السلسلة لاستخدام قدرات فريدة.
actors.hero.herosubclass.gladiator_desc=يبني المصارع نقطة واحدة من السلسلة كلما نفذ هجومًا ناجحًا بسلاح قريب أو سلاح مرمي. إذا لم ينفذ المصارع هجومًا ناجحًا خلال 5 أدوار (15 دورًا بعد قتل عدو)، تُصفّر سلسلته.\n\nومع بناء السلسلة، يمكن للمصارع استخدام مجموعة متنوعة من القدرات المضمونة الإصابة:\nسلسلة 2: يدفع العدو للخلف، وتحافظ على السلسلة\nسلسلة 4: يلحق ضررًا يعتمد على الدرع\nسلسلة 6: يصد الهجوم، وتحافظ على السلسلة\nسلسلة 8: تلحق ضررًا بالهدف والأعداء القريبين\nسلسلة 10: يهاجم مرة لكل نقطة من السلسلة
actors.hero.herosubclass.battlemage=ساحر المعركة
actors.hero.herosubclass.battlemage_short_desc=يستحضر _ساحر المعركة_ تأثيرات إضافية عند القتال بسلاح قريب باستخدام عصاه. وتعتمد هذه التأثيرات على العصا التي تم شحن عصاه بها.
actors.hero.herosubclass.battlemage_desc=يحصل ساحر المعركة على تأثير إضافي في كل مرة يضرب فيها ضربة قريبة بعصاه، كما لو كانت العصا تمتلك تعويذة إضافية. وتعتمد هذه التأثيرات على العصا التي تم شحن العصا بها، ولكل عصا تأثيرها الخاص. بالإضافة إلى تأثيرات العصا، تحصل عصا ساحر المعركة أيضًا على 0.5 شحنة عندما يضرب بها.
actors.hero.herosubclass.warlock=الساحر الملعون
actors.hero.herosubclass.warlock_short_desc=لدى _الساحر الملعون_ احتمال لوضع علامة الروح على الأعداء باستخدام عصاه. ويستعيد صحته كلما ألحق ضررًا جسديًا بأعداء موسومين.
actors.hero.herosubclass.warlock_desc=لدى الساحر الملعون احتمال لإصابة الشخصيات بعلامة الروح عندما يستخدم العصي عليها. ويزداد احتمال تطبيق علامة الروح ومدتها مع مستوى العصا.\n\nعندما يُوسم عدو بعلامة الروح، يستعيد الساحر الملعون نقطتي صحة مقابل كل 5 نقاط ضرر يلحقها به، ولكن فقط من هجمات الأسلحة القريبة أو المرمية، وليس من العصي!
actors.hero.herosubclass.assassin=القاتل
actors.hero.herosubclass.assassin_short_desc=يستطيع _القاتل_ إعداد ضربة مميتة أثناء اختفائه. وكلما انتظر مدة أطول، أصبحت الضربة أقوى.
actors.hero.herosubclass.assassin_desc=يُعد القاتل ضربته التالية عندما يصبح غير مرئي. وكلما استمر في الإعداد، أصبحت ضربته التالية أقوى. ويمكن أن يستمر الإعداد حتى 9 أدوار.\n\nبعد الإعداد، يلحق القاتل ضررًا إضافيًا في هجومه التالي، ويمكنه الانتقال آنيًا إلى هدفه، بل ويمكنه قتل الأعداء فورًا إذا كانوا ضعفاء بما يكفي.
actors.hero.herosubclass.freerunner=عدّاء الحرية
actors.hero.herosubclass.freerunner_short_desc=يبني _عدّاء الحرية_ الزخم أثناء الجري، ويمكن استخدامه لبدء الجري الحر. وهذا يمنحه سرعة وتهربًا إضافيين لفترة قصيرة.
actors.hero.herosubclass.freerunner_desc=يبني عدّاء الحرية تكدسات من الزخم أثناء تحركه. ويمكنه اكتساب ما يصل إلى 10 شحنات من الزخم بعد الركض لمدة 10 أدوار، لكنه يفقده بسرعة إذا توقف عن الحركة. ويمكن لعدّاء الحرية إنفاق زخمه لبدء الجري الحر لمدة دورين لكل نقطة زخم.\n\nأثناء الجري الحر، يتحرك عدّاء الحرية بسرعة مضاعفة ويحصل على تهرب إضافي يتناسب مع مستواه. وبعد انتهاء الجري الحر، توجد فترة تهدئة قبل إمكانية بناء الزخم من جديد.
actors.hero.herosubclass.sniper=القناصة
actors.hero.herosubclass.sniper_short_desc=تستطيع _القناصة_ اختراق الدروع بهجماتها بعيدة المدى. وبعد إصابة عدو بسلاح مرمي، يمكنها تنفيذ هجوم خاص لاحقًا بقوسها.
actors.hero.herosubclass.sniper_desc=القناصة خبيرة في القتال بعيد المدى، وهجماتها بعيدة المدى تخترق دروع الأعداء. عندما تهاجم عدوًا بسلاح مرمي، تضع عليه علامة القناص، مما يسمح لها بتنفيذ هجوم خاص لاحقًا بقوسها. ويختلف هذا الهجوم الخاص بحسب طريقة تعزيز قوسها.\n\nسيطلق القوس غير المعزز طلقة سريعة تلحق ضررًا أقل لكنها تُطلق فورًا. وسيطلق القوس المعزز للسرعة وابلًا من ثلاثة أسهم تلحق ضررًا أقل، ولا تزال قادرة على تفعيل التعويذات، وتستغرق دورًا واحدًا لإطلاقها. وسيطلق القوس المعزز للضرر طلقة قنص مضمونة الإصابة، وتلحق ضررًا إضافيًا يعتمد على المسافة، وتستغرق دورين لإطلاقها.
actors.hero.herosubclass.warden=الحارسة
actors.hero.herosubclass.warden_short_desc=تستطيع _الحارسة_ الرؤية عبر العشب الطويل وتحصل على تأثيرات إضافية عندما تزرع البذور وتدوس النباتات.
actors.hero.herosubclass.warden_desc=تمتلك الحارسة صلة قوية بالطبيعة تمنحها مجموعة متنوعة من التأثيرات الإضافية المتعلقة بالعشب والنباتات. ويمكنها الرؤية عبر العشب الطويل والعشب المشقوق كما لو كانا مساحة فارغة.\n\nتجعل الحارسة العشب ينمو حول أي بذرة ترميها أو تزرعها، وتحصل على تأثيرات خاصة عند دوس النباتات. وتحل هذه التأثيرات الخاصة محل التأثيرات العادية للنباتات، مما يعني أنه لا يوجد نبات ضار بالحارسة عند المشي فوقه.
actors.hero.herosubclass.champion=البطلة
actors.hero.herosubclass.champion_short_desc=يمكن لـ_البطلة_ استخدام سلاحين وتحصل على شحنات سلاح إضافية. تستخدم هجماتها العادية سلاحها الأساسي، لكنها تستطيع تبديل الأسلحة واستخدام قدرة أي منهما.
actors.hero.herosubclass.champion_desc=البطلة خبيرة في أسلحة القتال القريب ويمكنها تجهيز سلاح ثانٍ بالإضافة إلى سلاحها الأساسي. تستخدم هجماتها العادية سلاحها الأساسي، لكنها تستطيع تبديل سلاحها الأساسي فورًا واستخدام قدرة أي من السلاحين.\n\nكما تحصل على شحنتين إضافيتين كحد أقصى لقدرات الأسلحة، و+50%% إلى سرعة إعادة شحن قدرات الأسلحة.
actors.hero.herosubclass.monk=الراهب
actors.hero.herosubclass.monk_short_desc=يبني _الراهب_ الطاقة أثناء القتال. ويمكن إنفاق هذه الطاقة على مجموعة متنوعة من القدرات الفريدة.
actors.hero.herosubclass.monk_desc=الراهب خبير في التقنيات الجسدية. وكلما هزم الأعداء، يكتسب طاقة يمكن استخدامها في مجموعة متنوعة من القدرات الدفاعية والمساعدة. ولا تتلاشى هذه الطاقة بمرور الوقت، لكنها تمتلك حدًا أقصى يعتمد على مستوى الراهب.\n\nطاقة 1: ضربة سريعة بالقبضتين\nطاقة 2: التركيز لتفادي الهجوم التالي\nطاقة 3: اندفاع فوري إلى مكان قريب\nطاقة 4: ركل عدو بعيدًا\nطاقة 5: التأمل لإزالة التأثيرات واستعادة شحنات العصي والقطع الأثرية
actors.hero.herosubclass.priest=الكاهن
actors.hero.herosubclass.priest_short_desc=يحصل _الكاهن_ على تعاويذ جديدة بعيدة المدى ونسخة معززة من الضوء الهادي.
actors.hero.herosubclass.priest_desc=يحصل الكاهن على مجموعة متنوعة من التعاويذ الجديدة والمحسنة التي تركز على القتال بعيد المدى والتآزر مع العناصر السحرية.\n\nيمكن للكاهن إلقاء _الضوء الهادي_ مجانًا مرة كل 50 دورًا، ويضيء الأعداء الذين تستهدفهم أي من تعاويذه مباشرةً، ويمكنه استهلاك تأثير الإضاءة باستخدام الحلفاء والعصي وبعض القطع الأثرية لإلحاق ضرر إضافي يساوي مستواه + 5.\n\nكما يحصل الكاهن على تعويذة _الإشراق_ التي تبدد الظلام وتؤثر في جميع الأعداء المرئيين، فتفعّل الإضاءة وتطبقها عليهم وتصيبهم بالذهول لفترة قصيرة، بتكلفة شحنتين.
actors.hero.herosubclass.paladin=البالادين
actors.hero.herosubclass.paladin_short_desc=يحصل _البالادين_ على تعاويذ جديدة قصيرة المدى ونسخًا معززة من السلاح المقدس والحارس المقدس.
actors.hero.herosubclass.paladin_desc=يحصل البالادين على مجموعة متنوعة من التعاويذ الجديدة والمحسنة التي تركز على القتال القريب والتآزر مع الأسلحة والدروع.\n\nتمنح تعويذتا _السلاح المقدس_ و_الحارس المقدس_ لدى البالادين مكافآت أكبر، ولا تعودان تستبدلان التعويذات والنقوش الموجودة، كما يمكن تمديدهما بإلقاء تعاويذ أخرى.\n\nكما يحصل البالادين على تعويذة _الضربة الإلهية_ التي تسمح له بتنفيذ ضربة قريبة مضمونة الإصابة مع ضرر إضافي وقوة تعويذة إضافية.

## المواهب
actors.hero.talent$provokedangertracker.name=غضب مستفَز
actors.hero.talent$provokedangertracker.desc=فقد المحارب حمايته مؤخرًا، وستلحق ضربته الجسدية التالية ضررًا إضافيًا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$lingeringmagictracker.name=سحر باقٍ
actors.hero.talent$lingeringmagictracker.desc=استخدم الساحر عصًا أو عصًا سحرية مؤخرًا، وستلحق ضربته الجسدية التالية ضررًا إضافيًا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$followupstriketracker.name=ضربة متابعة
actors.hero.talent$followupstriketracker.desc=هاجمت الصيادة عدوًا مؤخرًا بسلاح مرمي، وستلحق ضربتها القريبة التالية ضد الهدف نفسه ضررًا إضافيًا.\n\nالأدوار المتبقية: %s.
actors.hero.talent$patientstriketracker.name=ضربة صبورة
actors.hero.talent$patientstriketracker.desc=انتظرت المبارزة دورًا للتو، وستلحق ضربتها القريبة التالية ضررًا إضافيًا.
actors.hero.talent$improvisedprojectilecooldown.name=فترة تهدئة المقذوفات المرتجلة
actors.hero.talent$improvisedprojectilecooldown.desc=استخدمت هذه الموهبة مؤخرًا، وعليك الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=فترة تهدئة الخطوات المنعشة
actors.hero.talent$rejuvenatingstepscooldown.desc=استخدمت هذه الموهبة مؤخرًا، وعليك الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
actors.hero.talent$seershotcooldown.name=فترة تهدئة طلقة الرائي
actors.hero.talent$seershotcooldown.desc=استخدمت هذه الموهبة مؤخرًا، وعليك الانتظار قبل استخدامها مرة أخرى.\n\nالأدوار المتبقية: %s.
