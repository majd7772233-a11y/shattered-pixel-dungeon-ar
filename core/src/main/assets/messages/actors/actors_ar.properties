# المحارب
actors.hero.talent.hearty_meal.title=وجبة دسمة
actors.hero.talent.hearty_meal.desc=_+1:_ يشفي تناول الطعام المحارب بمقدار _4 صحة_ عندما تكون صحته عند 33%% أو أقل.\n\n_+2:_ يشفي تناول الطعام المحارب بمقدار _6 صحة_ عندما تكون صحته عند 33%% أو أقل.
actors.hero.talent.veterans_intuition.title=حدس المخضرم
actors.hero.talent.veterans_intuition.desc=_+1:_ يتعرف المحارب على الأسلحة _بسرعة 1.75 ضعف_ وعلى الدروع _بسرعة 2.5 ضعف_.\n\n_+2:_ يتعرف المحارب على الأسلحة _بسرعة 2.5 ضعف_ وعلى الدروع _عند تجهيزها_.
actors.hero.talent.provoked_anger.title=غضب مستفَز
actors.hero.talent.provoked_anger.desc=_+1:_ عندما يتم كسر أي تأثير حماية مطبق على المحارب بسبب الضرر، ستلحق ضربته الجسدية التالية _3 ضرر إضافي_.\n\n_+2:_ عندما يتم كسر أي تأثير حماية مطبق على المحارب بسبب الضرر، ستلحق ضربته الجسدية التالية _5 ضرر إضافي_.
actors.hero.talent.iron_will.title=إرادة حديدية
actors.hero.talent.iron_will.desc=_+1:_ تزداد الحماية التي يمنحها ختم المحارب _بمقدار 1_.\n\n_+2:_ تزداد الحماية التي يمنحها ختم المحارب _بمقدار 2_.
actors.hero.talent.iron_will.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك نسخة من تأثير ختم المحارب المكسور بحد أقصى للحماية قدره 1 أو 2.

actors.hero.talent.iron_stomach.title=معدة حديدية
actors.hero.talent.iron_stomach.desc=_+1:_ يستغرق تناول الطعام لدى المحارب دورًا واحدًا ويمنحه _مقاومة للضرر بنسبة 75%%_ أثناء الأكل.\n\n_+2:_ يستغرق تناول الطعام لدى المحارب دورًا واحدًا ويمنحه _مقاومة للضرر بنسبة 100%%_ أثناء الأكل.
actors.hero.talent.liquid_willpower.title=إرادة سائلة
actors.hero.talent.liquid_willpower.desc=_+1:_ يحصل المحارب على حماية تعادل _6.5%% من صحته القصوى_ عند شرب أو رمي جرعة أو مشروب أو إكسير.\n\n_+2:_ يحصل المحارب على حماية تعادل _10%% من صحته القصوى_ عند شرب أو رمي جرعة أو مشروب أو إكسير.\n\nيتضاعف مقدار الحماية عند استخدام جرعات القوة أو الخبرة أو عناصر الكيمياء التي يجب تصنيعها باستخدام تلك الجرعات.\n\nبالنسبة لعناصر الكيمياء ذات الكميات الناتجة الأعلى (مثل مشروب الماء)، فلدى هذه الموهبة احتمال للتفعيل اعتمادًا على عدد العناصر التي تم إنتاجها.
actors.hero.talent.runic_transference.title=نقل الرون
actors.hero.talent.runic_transference.desc=_+1:_ يستطيع ختم المحارب المكسور نقل _النقوش العادية_ بالطريقة نفسها التي ينقل بها ترقية.\n\n_+2:_ يستطيع ختم المحارب المكسور نقل _النقوش العادية والقوية ونقوش اللعنات_ بالطريقة نفسها التي ينقل بها ترقية.\n\nلا يستطيع الختم نقل النقوش إلا إذا كانت قد أُضيفت إلى الدرع أثناء وجود الختم عليه.
actors.hero.talent.runic_transference.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستساعد بدلًا من ذلك نقوش درعك على مقاومة إزالتها بواسطة لفائف الترقية. ستبدأ النقوش في الفقدان عند الترقية من المستوى 6 (بدلًا من 4) عند +1، أو من المستوى 7 (بدلًا من 4) عند +2. ويظل المستوى الذي تُفقد عنده النقوش حتمًا +8.
actors.hero.talent.lethal_momentum.title=زخم مميت
actors.hero.talent.lethal_momentum.desc=_+1:_ عندما يوجه المحارب ضربة قاتلة إلى عدو بسلاح جسدي، فهناك _احتمال 67%%_ ألا تستغرق أي أدوار.\n\n_+2:_ عندما يوجه المحارب ضربة قاتلة إلى عدو بسلاح جسدي، فهناك _احتمال 100%%_ ألا تستغرق أي أدوار.
actors.hero.talent.improvised_projectiles.title=مقذوفات مرتجلة
actors.hero.talent.improvised_projectiles.desc=_+1:_ يستطيع المحارب إصابة عدو بالعمى لمدة _دورين_ عبر رمي أي عنصر ليس سلاحًا مرميًا عليه. فترة التهدئة 50 دورًا.\n\n_+2:_ يستطيع المحارب إصابة عدو بالعمى لمدة _3 أدوار_ عبر رمي أي عنصر ليس سلاحًا مرميًا عليه. فترة التهدئة 50 دورًا.

actors.hero.talent.hold_fast.title=الثبات
actors.hero.talent.hold_fast.desc=_+1:_ عندما ينتظر المحارب، يحصل على _1-2 درع_ ويبطئ تلاشي تأثيرات السلسلة والحماية بنسبة _50%%_ حتى يتحرك.\n\n_+2:_ عندما ينتظر المحارب، يحصل على _2-4 درع_ ويبطئ تلاشي تأثيرات السلسلة والحماية بنسبة _75%%_ حتى يتحرك.\n\n_+3:_ عندما ينتظر المحارب، يحصل على _3-6 درع_ ويبطئ تلاشي تأثيرات السلسلة والحماية بنسبة _100%%_ حتى يتحرك.
actors.hero.talent.strongman.title=الرجل القوي
actors.hero.talent.strongman.desc=_+1:_ تزداد قوة المحارب _بنسبة 8%%_، مع التقريب إلى الأسفل.\n\n_+2:_ تزداد قوة المحارب _بنسبة 13%%_، مع التقريب إلى الأسفل.\n\n_+3:_ تزداد قوة المحارب _بنسبة 18%%_، مع التقريب إلى الأسفل.

actors.hero.talent.endless_rage.title=غضب لا ينتهي
actors.hero.talent.endless_rage.desc=_+1:_ يمكن للهائج الوصول إلى حد أقصى قدره _116%% من الغضب_.\n\n_+2:_ يمكن للهائج الوصول إلى حد أقصى قدره _133%% من الغضب_.\n\n_+3:_ يمكن للهائج الوصول إلى حد أقصى قدره _150%% من الغضب_.\n\nكل نقطة غضب فوق 100%% تزيد حماية الهياج بنسبة 1%% وتقلل فترة التهدئة بنسبة 1%%، لكنها لا تزيد مكافأة الضرر فوق +50%%.
actors.hero.talent.deathless_fury.title=غضب لا يموت
actors.hero.talent.deathless_fury.desc=_+1:_ يتفعّل الهياج تلقائيًا إذا كان الهائج على وشك الموت وكان غضبه 100%% أو أكثر، لكن عند حدوث ذلك تكون هناك فترة تهدئة مقدارها _3 مستويات للبطل_.\n\n_+2:_ يتفعّل الهياج تلقائيًا إذا كان الهائج على وشك الموت وكان غضبه 100%% أو أكثر، لكن عند حدوث ذلك تكون هناك فترة تهدئة مقدارها _مستويان للبطل_.\n\n_+3:_ يتفعّل الهياج تلقائيًا إذا كان الهائج على وشك الموت وكان غضبه 100%% أو أكثر، لكن عند حدوث ذلك تكون هناك فترة تهدئة مقدارها _مستوى واحد للبطل_.\n\nلاحظ أن الهائج سيموت مع ذلك إذا كانت صحته 0 عند انتهاء الهياج.
actors.hero.talent.enraged_catalyst.title=محفز غاضب
actors.hero.talent.enraged_catalyst.desc=_+1:_ تتفعّل التعويذات واللعنات على سلاح الهائج بمعدل أكبر كلما زاد غضبه، بحد أقصى _15%% أكثر_ عند غضب 100%%.\n\n_+2:_ تتفعّل التعويذات واللعنات على سلاح الهائج بمعدل أكبر كلما زاد غضبه، بحد أقصى _30%% أكثر_ عند غضب 100%%.\n\n_+3:_ تتفعّل التعويذات واللعنات على سلاح الهائج بمعدل أكبر كلما زاد غضبه، بحد أقصى _45%% أكثر_ عند غضب 100%%.

actors.hero.talent.cleave.title=شق
actors.hero.talent.cleave.desc=_+1:_ تزداد المدة الإضافية التي يحصل عليها المصارع عند قتل عدو إلى _30 دورًا_ بدلًا من 15.\n\n_+2:_ تزداد المدة الإضافية التي يحصل عليها المصارع عند قتل عدو إلى _45 دورًا_ بدلًا من 15.\n\n_+3:_ تزداد المدة الإضافية التي يحصل عليها المصارع عند قتل عدو إلى _60 دورًا_ بدلًا من 15.
actors.hero.talent.lethal_defense.title=دفاع مميت
actors.hero.talent.lethal_defense.desc=_+1:_ عندما يقتل المصارع عدوًا بحركة من حركات السلسلة، تُخفض فترة تهدئة حماية ختمه المكسور _بمقدار 50 دورًا_.\n\n_+2:_ عندما يقتل المصارع عدوًا بحركة من حركات السلسلة، تُخفض فترة تهدئة حماية ختمه المكسور _بمقدار 100 دور_.\n\n_+3:_ عندما يقتل المصارع عدوًا بحركة من حركات السلسلة، تُخفض فترة تهدئة حماية ختمه المكسور _بمقدار 150 دورًا_.\n\nيمكن لهذه الموهبة خفض فترة تهدئة الحماية إلى -150 دورًا، مما يعني أنها ستصبح متاحة فورًا مرة أخرى عند تفعيلها.
actors.hero.talent.enhanced_combo.title=سلسلة معززة
actors.hero.talent.enhanced_combo.desc=_+1:_ عندما تكون سلسلة المصارع 7 أو أكثر، يزداد مدى دفع ضربة المصارع الساحقة إلى 3، وتصيبه بالدوار، ويمكنها دفع الأعداء إلى الحفر.\n\n_+2:_ بالإضافة إلى فوائد +1، عندما تكون سلسلة المصارع 9 أو أكثر، تعمل حركة الصد ضد عدة هجمات.\n\n_+3:_ بالإضافة إلى فوائد +1 و+2، يستطيع المصارع القفز لمسافة تصل إلى السلسلة/3 بلاطات عند استخدام الضربة القاسية أو السحق أو الضراوة.

actors.hero.talent.body_slam.title=ضربة بالجسد
actors.hero.talent.body_slam.desc=_+1:_ عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء الملاصقين ضررًا يعادل _1-4 بالإضافة إلى 25%%_ من قوة حجب ضرره.\n\n_+2:_ عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء الملاصقين ضررًا يعادل _2-8 بالإضافة إلى 50%%_ من قوة حجب ضرره.\n\n_+3:_ عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء الملاصقين ضررًا يعادل _3-12 بالإضافة إلى 75%%_ من قوة حجب ضرره.\n\n_+4:_ عندما يهبط المحارب بعد القفز، يتلقى جميع الأعداء الملاصقين ضررًا يعادل _4-16 بالإضافة إلى 100%%_ من قوة حجب ضرره.
actors.hero.talent.impact_wave.title=موجة الارتطام
actors.hero.talent.impact_wave.desc=_+1:_ عندما يهبط المحارب بعد القفز، يُدفع جميع الأعداء الملاصقين _بلاطتين_ إلى الخلف، ولديهم _احتمال 25%%_ للإصابة بالهشاشة لمدة 5 أدوار.\n\n_+2:_ عندما يهبط المحارب بعد القفز، يُدفع جميع الأعداء الملاصقين _3 بلاطات_ إلى الخلف، ولديهم _احتمال 50%%_ للإصابة بالهشاشة لمدة 5 أدوار.\n\n_+3:_ عندما يهبط المحارب بعد القفز، يُدفع جميع الأعداء الملاصقين _4 بلاطات_ إلى الخلف، ولديهم _احتمال 75%%_ للإصابة بالهشاشة لمدة 5 أدوار.\n\n_+4:_ عندما يهبط المحارب بعد القفز، يُدفع جميع الأعداء الملاصقين _5 بلاطات_ إلى الخلف، ولديهم _احتمال 100%%_ للإصابة بالهشاشة لمدة 5 أدوار.
actors.hero.talent.double_jump.title=قفزة مزدوجة
actors.hero.talent.double_jump.desc=_+1:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، فستكون تكلفة تلك القفزة _أقل بنسبة 16%%_.\n\n_+2:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، فستكون تكلفة تلك القفزة _أقل بنسبة 30%%_.\n\n_+3:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، فستكون تكلفة تلك القفزة _أقل بنسبة 40%%_.\n\n_+4:_ إذا نفذ المحارب قفزة ثانية خلال 3 أدوار، فستكون تكلفة تلك القفزة _أقل بنسبة 50%%_.

actors.hero.talent.expanding_wave.title=موجة متوسعة
actors.hero.talent.expanding_wave.desc=_+1:_ يزداد مدى الموجة الصادمة إلى _6 بلاطات_ بدلًا من 5، ويزداد عرضها إلى _75 درجة_ بدلًا من 60.\n\n_+2:_ يزداد مدى الموجة الصادمة إلى _7 بلاطات_ بدلًا من 5، ويزداد عرضها إلى _90 درجة_ بدلًا من 60.\n\n_+3:_ يزداد مدى الموجة الصادمة إلى _8 بلاطات_ بدلًا من 5، ويزداد عرضها إلى _105 درجات_ بدلًا من 60.\n\n_+4:_ يزداد مدى الموجة الصادمة إلى _9 بلاطات_ بدلًا من 5، ويزداد عرضها إلى _120 درجة_ بدلًا من 60.
actors.hero.talent.striking_wave.title=موجة ضاربة
actors.hero.talent.striking_wave.desc=_+1:_ تمتلك الموجة الصادمة _احتمال 30%%_ لتطبيق تأثيرات الإصابة أيضًا، مثل التعويذات والسلسلة.\n\n_+2:_ تمتلك الموجة الصادمة _احتمال 60%%_ لتطبيق تأثيرات الإصابة أيضًا، مثل التعويذات والسلسلة.\n\n_+3:_ تمتلك الموجة الصادمة _احتمال 90%%_ لتطبيق تأثيرات الإصابة أيضًا، مثل التعويذات والسلسلة.\n\n_+4:_ تمتلك الموجة الصادمة _احتمال 100%%_ لتطبيق تأثيرات الإصابة أيضًا، مثل التعويذات والسلسلة، كما تمنح التعويذات _+20%% من القوة_.
actors.hero.talent.shock_force.title=قوة الصدمة
actors.hero.talent.shock_force.desc=_+1:_ تلحق الموجة الصادمة _20%% ضررًا إضافيًا_ وتمتلك _احتمال 25%%_ لإحداث الذهول بدلًا من الإعاقة.\n\n_+2:_ تلحق الموجة الصادمة _40%% ضررًا إضافيًا_ وتمتلك _احتمال 50%%_ لإحداث الذهول بدلًا من الإعاقة.\n\n_+3:_ تلحق الموجة الصادمة _60%% ضررًا إضافيًا_ وتمتلك _احتمال 75%%_ لإحداث الذهول بدلًا من الإعاقة.\n\n_+4:_ تلحق الموجة الصادمة _80%% ضررًا إضافيًا_ وتمتلك _احتمال 100%%_ لإحداث الذهول بدلًا من الإعاقة.

actors.hero.talent.sustained_retribution.title=انتقام مستمر
actors.hero.talent.sustained_retribution.desc=_+1:_ يلحق المحارب _115%% من الضرر الإضافي_ موزعًا على _ضربتين_ بدلًا من 100%% من الضرر الإضافي في ضربة واحدة.\n\n_+2:_ يلحق المحارب _130%% من الضرر الإضافي_ موزعًا على _3 ضربات_ بدلًا من 100%% من الضرر الإضافي في ضربة واحدة.\n\n_+3:_ يلحق المحارب _145%% من الضرر الإضافي_ موزعًا على _4 ضربات_ بدلًا من 100%% من الضرر الإضافي في ضربة واحدة.\n\n_+4:_ يلحق المحارب _160%% من الضرر الإضافي_ موزعًا على _5 ضربات_ بدلًا من 100%% من الضرر الإضافي في ضربة واحدة.
actors.hero.talent.shrug_it_off.title=تجاهل الأمر
actors.hero.talent.shrug_it_off.desc=_+1:_ يزداد تقليل ضرر المحارب أثناء التحمل _إلى 60%%_ بدلًا من 50%%.\n\n_+2:_ يزداد تقليل ضرر المحارب أثناء التحمل _إلى 68%%_ بدلًا من 50%%.\n\n_+3:_ يزداد تقليل ضرر المحارب أثناء التحمل _إلى 74%%_ بدلًا من 50%%.\n\n_+4:_ يزداد تقليل ضرر المحارب أثناء التحمل _إلى 80%%_ بدلًا من 50%%.
actors.hero.talent.even_the_odds.title=موازنة الكفة
actors.hero.talent.even_the_odds.desc=_+1:_ يلحق المحارب _5%% من الضرر الإضافي_ لكل عدو ضمن بلاطتين عند انتهاء التحمل.\n\n_+2:_ يلحق المحارب _10%% من الضرر الإضافي_ لكل عدو ضمن بلاطتين عند انتهاء التحمل.\n\n_+3:_ يلحق المحارب _15%% من الضرر الإضافي_ لكل عدو ضمن بلاطتين عند انتهاء التحمل.\n\n_+4:_ يلحق المحارب _20%% من الضرر الإضافي_ لكل عدو ضمن بلاطتين عند انتهاء التحمل.

# الساحر
actors.hero.talent.empowering_meal.title=وجبة معززة
actors.hero.talent.empowering_meal.desc=_+1:_ يمنح تناول الطعام الساحر _2 ضرر إضافي_ في المرات الثلاث التالية التي يلحق فيها ضررًا باستخدام عصا.\n\n_+2:_ يمنح تناول الطعام الساحر _3 ضرر إضافي_ في المرات الثلاث التالية التي يلحق فيها ضررًا باستخدام عصا.
actors.hero.talent.scholars_intuition.title=حدس العالم
actors.hero.talent.scholars_intuition.desc=_+1:_ يتعرف الساحر على العصي _بسرعة 3 أضعاف_.\n\n_+2:_ يتعرف الساحر على العصي _عند استخدامها_.
actors.hero.talent.lingering_magic.title=سحر باقٍ
actors.hero.talent.lingering_magic.desc=_+1:_ عندما يطلق الساحر من عصا أو عصا سحرية، تلحق ضربته الجسدية التالية _1-2 ضرر إضافي_.\n\n_+2:_ عندما يطلق الساحر من عصا أو عصا سحرية، تلحق ضربته الجسدية التالية _2 ضرر إضافي_.
actors.hero.talent.backup_barrier.title=حاجز احتياطي
actors.hero.talent.backup_barrier.desc=_+1:_ يحصل الساحر على _3 حماية_ كلما أنفق آخر شحنة في عصاه.\n\n_+2:_ يحصل الساحر على _5 حماية_ كلما أنفق آخر شحنة في عصاه.
actors.hero.talent.backup_barrier.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستتفعّل بدلًا من ذلك من أعلى عصا مستوى لدى البطل.

actors.hero.talent.energizing_meal.title=وجبة مشحونة بالطاقة
actors.hero.talent.energizing_meal.desc=_+1:_ يستغرق تناول الطعام لدى الساحر دورًا واحدًا ويمنحه _5 أدوار من إعادة شحن العصي_.\n\n_+2:_ يستغرق تناول الطعام لدى الساحر دورًا واحدًا ويمنحه _8 أدوار من إعادة شحن العصي_.
actors.hero.talent.inscribed_power.title=قوة منقوشة
actors.hero.talent.inscribed_power.desc=_+1:_ عندما يقرأ الساحر لفافة أو يستخدم عنصر تعويذة، تحصل _طلقتا العصا التاليتان_ على +2 مستوى.\n\n_+2:_ عندما يقرأ الساحر لفافة أو يستخدم عنصر تعويذة، تحصل _3 طلقات للعصا التالية_ على +2 مستوى.\n\nيتضاعف عدد إطلاقات العصا المعززة عند استخدام لفافة الترقية أو التحويل أو عناصر الكيمياء التي يجب تصنيعها باستخدام تلك اللفائف.\n\nبالنسبة لعناصر الكيمياء ذات الكميات الناتجة الأعلى (مثل معظم التعويذات)، فلدى هذه الموهبة احتمال للتفعيل اعتمادًا على عدد العناصر التي تم إنتاجها.
actors.hero.talent.wand_preservation.title=الحفاظ على العصا
actors.hero.talent.wand_preservation.desc=_+1:_ عندما يشحن الساحر عصًا جديدة في عصاه، تتم إعادة العصا القديمة عند +0، _لكن يمكن فعل ذلك مرة واحدة فقط_.\n\n_+2:_ عندما يشحن الساحر عصًا جديدة في عصاه، تتم إعادة العصا القديمة عند +0، _ويمكن تكرار ذلك مع فترة تهدئة بمستوى بطل واحد_.
actors.hero.talent.wand_preservation.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها تزيد بدلًا من ذلك كمية الراتنج الغامض المكتسبة عند وضع عصا في قدر الكيمياء بمقدار 1 عند +1، أو 2 عند +2.
actors.hero.talent.arcane_vision.title=الرؤية الغامضة
actors.hero.talent.arcane_vision.desc=_+1:_ عندما يطلق الساحر من عصاه على عدو، يحصل على رؤية ذهنية عليه لمدة _10 أدوار_.\n\n_+2:_ عندما يطلق الساحر من عصاه على عدو، يحصل على رؤية ذهنية عليه لمدة _15 دورًا_.
actors.hero.talent.shield_battery.title=بطارية الدرع
actors.hero.talent.shield_battery.desc=_+1:_ يمكن للساحر استهداف نفسه بعصا لتحويل جميع شحناتها إلى حماية بمعدل _4%% من الصحة القصوى لكل شحنة_.\n\n_+2:_ يمكن للساحر استهداف نفسه بعصا لتحويل جميع شحناتها إلى حماية بمعدل _6%% من الصحة القصوى لكل شحنة_.

actors.hero.talent.desperate_power.title=قوة اليأس
actors.hero.talent.desperate_power.desc=_+1:_ تحصل عصي الساحر وعصاه على _+1 مستوى_ في إطلاقها الأخير عندما تبقى لها آخر شحنة.\n\n_+2:_ تحصل عصي الساحر وعصاه على _+2 مستوى_ في إطلاقها الأخير عندما تبقى لها آخر شحنة.\n\n_+3:_ تحصل عصي الساحر وعصاه على _+3 مستويات_ في إطلاقها الأخير عندما تبقى لها آخر شحنة.
actors.hero.talent.ally_warp.title=انتقال الحليف
actors.hero.talent.ally_warp.desc=_+1:_ يستطيع الساحر اختيار حليف لتبديل مكانه معه فورًا ضمن _مدى بلاطتين_.\n\n_+2:_ يستطيع الساحر اختيار حليف لتبديل مكانه معه فورًا ضمن _مدى 4 بلاطات_.\n\n_+3:_ يستطيع الساحر اختيار حليف لتبديل مكانه معه فورًا ضمن _مدى 6 بلاطات_.\n\nلا يستطيع الساحر تبديل مكانه مع الحلفاء غير القادرين على الحركة.

actors.hero.talent.empowered_strike.title=ضربة معززة
actors.hero.talent.empowered_strike.desc=_+1:_ تلحق أول ضربة قريبة لساحر المعركة بعصاه بعد إطلاقها _+16%% من الضرر_ وتحصل قدرة العصا الإضافية على _+50%% من القوة_.\n\n_+2:_ تلحق أول ضربة قريبة لساحر المعركة بعصاه بعد إطلاقها _+33%% من الضرر_ وتحصل قدرة العصا الإضافية على _+100%% من القوة_.\n\n_+3:_ تلحق أول ضربة قريبة لساحر المعركة بعصاه بعد إطلاقها _+50%% من الضرر_ وتحصل قدرة العصا الإضافية على _+150%% من القوة_.
actors.hero.talent.mystical_charge.title=شحنة غامضة
actors.hero.talent.mystical_charge.desc=_+1:_ تمنح الضربة بعصاه ساحر المعركة _0.5 دور_ من إعادة شحن القطع الأثرية.\n\n_+2:_ تمنح الضربة بعصاه ساحر المعركة _دورًا واحدًا_ من إعادة شحن القطع الأثرية.\n\n_+3:_ تمنح الضربة بعصاه ساحر المعركة _1.5 دور_ من إعادة شحن القطع الأثرية.
actors.hero.talent.excess_charge.title=شحنة زائدة
actors.hero.talent.excess_charge.desc=_+1:_ عندما تكون عصا ساحر المعركة مشحونة بالكامل، ستمنحه طلقتها التالية _0.67 حماية_ لكل مستوى من مستويات العصا.\n\n_+2:_ عندما تكون عصا ساحر المعركة مشحونة بالكامل، ستمنحه طلقتها التالية _1.33 حماية_ لكل مستوى من مستويات العصا.\n\n_+3:_ عندما تكون عصا ساحر المعركة مشحونة بالكامل، ستمنحه طلقتها التالية _2 حماية_ لكل مستوى من مستويات العصا.

actors.hero.talent.soul_siphon.title=امتصاص الروح
actors.hero.talent.soul_siphon.desc=_+1:_ يؤدي الضرر الجسدي الذي تلحقه الشخصيات الأخرى إلى تفعيل علامة روح الساحر الملعون _بفعالية 13%%_.\n\n_+2:_ يؤدي الضرر الجسدي الذي تلحقه الشخصيات الأخرى إلى تفعيل علامة روح الساحر الملعون _بفعالية 27%%_.\n\n_+3:_ يؤدي الضرر الجسدي الذي تلحقه الشخصيات الأخرى إلى تفعيل علامة روح الساحر الملعون _بفعالية 40%%_.
actors.hero.talent.soul_eater.title=آكل الأرواح
actors.hero.talent.soul_eater.desc=_+1:_ تمنح علامة الروح _0.33 دور_ من الشبع مقابل كل ضرر جسدي يتم إلحاقه. وتمتلك الأعداء الموسومة بعلامة الروح _احتمال 10%%_ لتفعيل تأثيرات الأكل عند موتها.\n\n_+2:_ تمنح علامة الروح _0.67 دور_ من الشبع مقابل كل ضرر جسدي يتم إلحاقه. وتمتلك الأعداء الموسومة بعلامة الروح _احتمال 20%%_ لتفعيل تأثيرات الأكل عند موتها.\n\n_+3:_ تمنح علامة الروح _دورًا واحدًا_ من الشبع مقابل كل ضرر جسدي يتم إلحاقه. وتمتلك الأعداء الموسومة بعلامة الروح _احتمال 30%%_ لتفعيل تأثيرات الأكل عند موتها.
actors.hero.talent.necromancers_minions.title=أتباع مستحضر الأرواح
actors.hero.talent.necromancers_minions.desc=_+1:_ عندما يموت عدو موسوم بعلامة الروح، يمتلك الساحر الملعون _احتمال 13%%_ لإعادته إلى الحياة كطيف مفسد.\n\n_+2:_ عندما يموت عدو موسوم بعلامة الروح، يمتلك الساحر الملعون _احتمال 27%%_ لإعادته إلى الحياة كطيف مفسد.\n\n_+3:_ عندما يموت عدو موسوم بعلامة الروح، يمتلك الساحر الملعون _احتمال 40%%_ لإعادته إلى الحياة كطيف مفسد.

actors.hero.talent.blast_radius.title=نطاق الانفجار
actors.hero.talent.blast_radius.desc=_+1:_ يزداد نصف قطر الانفجار العنصري إلى _5 بلاطات_ بدلًا من 4.\n\n_+2:_ يزداد نصف قطر الانفجار العنصري إلى _6 بلاطات_ بدلًا من 4.\n\n_+3:_ يزداد نصف قطر الانفجار العنصري إلى _7 بلاطات_ بدلًا من 4.\n\n_+4:_ يزداد نصف قطر الانفجار العنصري إلى _8 بلاطات_ بدلًا من 4.
actors.hero.talent.elemental_power.title=القوة العنصرية
actors.hero.talent.elemental_power.desc=_+1:_ تزداد قوة الانفجار العنصري _بنسبة 25%%_.\n\n_+2:_ تزداد قوة الانفجار العنصري _بنسبة 50%%_.\n\n_+3:_ تزداد قوة الانفجار العنصري _بنسبة 75%%_.\n\n_+4:_ تزداد قوة الانفجار العنصري _بنسبة 100%%_.
actors.hero.talent.reactive_barrier.title=حاجز تفاعلي
actors.hero.talent.reactive_barrier.desc=_+1:_ يحصل الساحر على _2.5 حماية_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 5 شخصيات.\n\n_+2:_ يحصل الساحر على _5 حماية_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 6 شخصيات.\n\n_+3:_ يحصل الساحر على _7.5 حماية_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 7 شخصيات.\n\n_+4:_ يحصل الساحر على _10 حماية_ لكل شخصية تتأثر بالانفجار العنصري، بحد أقصى 8 شخصيات.

actors.hero.talent.wild_power.title=قوة جامحة
actors.hero.talent.wild_power.desc=_+1:_ عند استخدام السحر الجامح، تحصل العصي على تعزيز قدره إما _2 أو 3، بحد أقصى +4_.\n\n_+2:_ عند استخدام السحر الجامح، تحصل العصي على تعزيز قدره _3، بحد أقصى +5_.\n\n_+3:_ عند استخدام السحر الجامح، تحصل العصي على تعزيز قدره إما _3 أو 4، بحد أقصى +6_.\n\n_+4:_ عند استخدام السحر الجامح، تحصل العصي على تعزيز قدره _4، بحد أقصى +7_.
actors.hero.talent.fire_everything.title=أطلق كل شيء
actors.hero.talent.fire_everything.desc=_+1:_ يطلق السحر الجامح الآن _5 مرات_ بدلًا من 4، وتمتلك كل عصا _احتمال 25%%_ لاستخدامها 3 مرات.\n\n_+2:_ يطلق السحر الجامح الآن _6 مرات_ بدلًا من 4، وتمتلك كل عصا _احتمال 50%%_ لاستخدامها 3 مرات.\n\n_+3:_ يطلق السحر الجامح الآن _7 مرات_ بدلًا من 4، وتمتلك كل عصا _احتمال 75%%_ لاستخدامها 3 مرات.\n\n_+4:_ يطلق السحر الجامح الآن _8 مرات_ بدلًا من 4، وتمتلك كل عصا _احتمال 100%%_ لاستخدامها 3 مرات.
actors.hero.talent.conserved_magic.title=سحر محفوظ
actors.hero.talent.conserved_magic.desc=_+1:_ يستهلك كل إطلاق من السحر الجامح الآن _0.33 شحنة_ بدلًا من 0.5، ويمتلك السحر الجامح _احتمال 25%%_ ألا يستهلك دورًا.\n\n_+2:_ يستهلك كل إطلاق من السحر الجامح الآن _0.225 شحنة_ بدلًا من 0.5، ويمتلك السحر الجامح _احتمال 50%%_ ألا يستهلك دورًا.\n\n_+3:_ يستهلك كل إطلاق من السحر الجامح الآن _0.15 شحنة_ بدلًا من 0.5، ويمتلك السحر الجامح _احتمال 75%%_ ألا يستهلك دورًا.\n\n_+4:_ يستهلك كل إطلاق من السحر الجامح الآن _0.1 شحنة_ بدلًا من 0.5، ويمتلك السحر الجامح _احتمال 100%%_ ألا يستهلك دورًا.

actors.hero.talent.telefrag.title=قتل بالانتقال
actors.hero.talent.telefrag.desc=_+1:_ إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها _10-15 ضررًا_، لكنه يتلقى أيضًا _5 ضرر_.\n\n_+2:_ إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها _20-30 ضررًا_، لكنه يتلقى أيضًا _10 ضرر_.\n\n_+3:_ إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها _30-45 ضررًا_، لكنه يتلقى أيضًا _15 ضرر_.\n\n_+4:_ إذا انتقل الساحر إلى شخصية أخرى، فإنه يلحق بها _40-60 ضررًا_، لكنه يتلقى أيضًا _20 ضررًا_.\n\nلا يمكن قتل البطل بهذه الموهبة، ويمكن تقليل الضرر الذاتي بواسطة تأثيرات مقاومة السحر.
actors.hero.talent.remote_beacon.title=منارة بعيدة
actors.hero.talent.remote_beacon.desc=_+1:_ يستطيع الساحر وضع منارة في أي موقع ضمن _4 بلاطات_.\n\n_+2:_ يستطيع الساحر وضع منارة في أي موقع ضمن _8 بلاطات_.\n\n_+3:_ يستطيع الساحر وضع منارة في أي موقع ضمن _12 بلاطة_.\n\n_+4:_ يستطيع الساحر وضع منارة في أي موقع ضمن _16 بلاطة_.\n\nلا يستطيع الساحر وضع منارة في المواقع التي يتعذر الوصول إليها.
actors.hero.talent.longrange_warp.title=انتقال بعيد المدى
actors.hero.talent.longrange_warp.desc=_+1:_ يستطيع الساحر الآن الانتقال بين الطوابق، _بتكلفة شحن 150%%_.\n\n_+2:_ يستطيع الساحر الآن الانتقال بين الطوابق، _بتكلفة شحن 117%%_.\n\n_+3:_ يستطيع الساحر الآن الانتقال بين الطوابق، _بتكلفة شحن 83%%_.\n\n_+4:_ يستطيع الساحر الآن الانتقال بين الطوابق، _بتكلفة شحن 50%%_.\n\nلا يستطيع الساحر استخدام الانتقال بعيد المدى لمغادرة طابق مقفل.

# اللص
actors.hero.talent.cached_rations.title=حصص مخبأة
actors.hero.talent.cached_rations.desc=_+1:_ يستطيع اللص العثور على _حصتين من حصص المؤن_ موضعتين في الصناديق أثناء استكشافه للطوابق القليلة التالية من الزنزانة.\n\n_+2:_ يستطيع اللص العثور على _3 حصص من المؤن_ موضعة في الصناديق أثناء استكشافه للطوابق القليلة التالية من الزنزانة.\n\nتؤكل حصص المؤن بسرعة، وتستعيد قدرًا متوسطًا من الشبع، وتشفي 5 نقاط صحة، وتعيد شحنة واحدة إلى عباءة الظلال.
actors.hero.talent.thiefs_intuition.title=حدس اللص
actors.hero.talent.thiefs_intuition.desc=_+1:_ يتعرف اللص على الخواتم _بسرعة مضاعفة_، ويتعرف على نوع الخاتم _عند تجهيزه_.\n\n_+2:_ يتعرف اللص على الخواتم _عند تجهيزها_، ويتعرف على نوع الخاتم _عند التقاطه_.
actors.hero.talent.sucker_punch.title=لكمة غادرة
actors.hero.talent.sucker_punch.desc=_+1:_ يلحق اللص _1-2 ضرر إضافي_ في المرة الأولى التي يهاجم فيها عدوًا بهجوم مفاجئ.\n\n_+2:_ يلحق اللص _2 ضرر إضافي_ في المرة الأولى التي يهاجم فيها عدوًا بهجوم مفاجئ.
actors.hero.talent.protective_shadows.title=ظلال واقية
actors.hero.talent.protective_shadows.desc=_+1:_ يحصل اللص على حماية واحدة _كل دورين_ يكون فيهما غير مرئي، _بحد أقصى 3_.\n\n_+2:_ يحصل اللص على حماية واحدة _كل دور_ يكون فيه غير مرئي، _بحد أقصى 5_.

actors.hero.talent.mystical_meal.title=وجبة غامضة
actors.hero.talent.mystical_meal.desc=_+1:_ يستغرق تناول الطعام لدى اللص دورًا واحدًا (تؤكل حصص المؤن فورًا) ويمنحه _3 أدوار من إعادة شحن القطع الأثرية_.\n\n_+2:_ يستغرق تناول الطعام لدى اللص دورًا واحدًا (تؤكل حصص المؤن فورًا) ويمنحه _5 أدوار من إعادة شحن القطع الأثرية_.\n\nلا يمكن استخدام هذه الموهبة لجعل قرن الوفرة يعيد شحن نفسه.
actors.hero.talent.inscribed_stealth.title=اختفاء منقوش
actors.hero.talent.inscribed_stealth.desc=_+1:_ يحصل اللص على _3 أدوار_ من الاختفاء بعد قراءة لفافة أو استخدام عنصر تعويذة.\n\n_+2:_ يحصل اللص على _5 أدوار_ من الاختفاء بعد قراءة لفافة أو استخدام عنصر تعويذة.\n\nتتضاعف مدة الاختفاء عند استخدام لفافة الترقية أو لفافة التحويل أو عناصر الكيمياء التي يجب تصنيعها باستخدام تلك اللفائف.\n\nبالنسبة لعناصر الكيمياء ذات الكميات الناتجة الأعلى (مثل معظم التعويذات)، فلدى هذه الموهبة احتمال للتفعيل اعتمادًا على عدد العناصر التي تم إنتاجها.
actors.hero.talent.wide_search.title=بحث واسع
actors.hero.talent.wide_search.desc=_+1:_ يزداد نطاق بحث اللص من مربع 5x5 إلى _دائرة 7x7_.\n\n_+2:_ يزداد نطاق بحث اللص من مربع 5x5 إلى _مربع 7x7_.
actors.hero.talent.wide_search.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها تزيد بدلًا من ذلك نطاق بحثه من مربع 3x3 إلى دائرة 5x5 عند +1، أو مربع 5x5 عند +2.
actors.hero.talent.silent_steps.title=خطوات صامتة
actors.hero.talent.silent_steps.desc=_+1:_ لن يوقظ اللص الأعداء النائمين عندما يكون _على بعد 3 بلاطات أو أكثر منهم_.\n\n_+2:_ لن يوقظ اللص الأعداء النائمين عندما _لا يكون ملاصقًا لهم_.
actors.hero.talent.rogues_foresight.title=استبصار اللص
actors.hero.talent.rogues_foresight.desc=_+1:_ عندما يكون اللص في طابق يحتوي على غرفة سرية، يمتلك _احتمال 75%% لاكتشاف_ أن الطابق يحتوي على سر.\n\n_+2:_ عندما يكون اللص في طابق يحتوي على غرفة سرية، يمتلك _احتمال 100%% لاكتشاف_ أن الطابق يحتوي على سر.

actors.hero.talent.light_cloak.title=عباءة خفيفة
actors.hero.talent.light_cloak.desc=_+1:_ يستطيع اللص استخدام عباءة الظلال عندما لا تكون مجهزة، لكنها تعيد الشحن بسرعة _25%%_ عند عدم تجهيزها.\n\n_+2:_ يستطيع اللص استخدام عباءة الظلال عندما لا تكون مجهزة، لكنها تعيد الشحن بسرعة _50%%_ عند عدم تجهيزها.\n\n_+3:_ يستطيع اللص استخدام عباءة الظلال عندما لا تكون مجهزة، لكنها تعيد الشحن بسرعة _75%%_ عند عدم تجهيزها.
actors.hero.talent.light_cloak.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها تزيد بدلًا من ذلك سرعة شحن جميع القطع الأثرية بنسبة 7/13/20%% عند +1/+2/+3.
actors.hero.talent.enhanced_rings.title=خواتم معززة
actors.hero.talent.enhanced_rings.desc=_+1:_ عندما يستخدم اللص قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _3 أدوار_.\n\n_+2:_ عندما يستخدم اللص قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _6 أدوار_.\n\n_+3:_ عندما يستخدم اللص قطعة أثرية، تحصل خواتمه على ترقية +1 لمدة _9 أدوار_.

actors.hero.talent.enhanced_lethality.title=فتك معزز
actors.hero.talent.enhanced_lethality.desc=_+1:_ يستطيع القاتل إعدام الأعداء الذين تبقى من صحتهم أقل من _4/13/27/67%%_ لكل مستوى إعداد، بدلًا من 3/10/20/50%%.\n\n_+2:_ يستطيع القاتل إعدام الأعداء الذين تبقى من صحتهم أقل من _5/17/33/83%%_ لكل مستوى إعداد، بدلًا من 3/10/20/50%%.\n\n_+3:_ يستطيع القاتل إعدام الأعداء الذين تبقى من صحتهم أقل من _6/20/40/100%%_ لكل مستوى إعداد، بدلًا من 3/10/20/50%%.
actors.hero.talent.assassins_reach.title=مدى القاتل
actors.hero.talent.assassins_reach.desc=_+1:_ يزداد مدى الانتقال الآني للقاتل لكل مستوى إعداد إلى _1/3/4/6 بلاطات_ بدلًا من 1/2/3/4.\n\n_+2:_ يزداد مدى الانتقال الآني للقاتل لكل مستوى إعداد إلى _2/4/6/8 بلاطات_ بدلًا من 1/2/3/4.\n\n_+3:_ يزداد مدى الانتقال الآني للقاتل لكل مستوى إعداد إلى _2/5/7/10 بلاطات_ بدلًا من 1/2/3/4.\n\nيمكن لهذا الانتقال الآني المرور عبر المخاطر والأعداء، لكنه لا يستطيع المرور عبر التضاريس الصلبة مثل الجدران.
actors.hero.talent.bounty_hunter.title=صائد الجوائز
actors.hero.talent.bounty_hunter.desc=_+1:_ عندما يقتل القاتل عدوًا بضربة مُجهزة، تزداد فرصة سقوط عنصر منه بنسبة _2/4/8/16%%_ لكل مستوى إعداد.\n\n_+2:_ عندما يقتل القاتل عدوًا بضربة مُجهزة، تزداد فرصة سقوط عنصر منه بنسبة _4/8/16/32%%_ لكل مستوى إعداد.\n\n_+3:_ عندما يقتل القاتل عدوًا بضربة مُجهزة، تزداد فرصة سقوط عنصر منه بنسبة _6/12/24/48%%_ لكل مستوى إعداد.

actors.hero.talent.evasive_armor.title=درع مراوغ
actors.hero.talent.evasive_armor.desc=_+1:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+1 تهرب إضافي_ لكل نقطة قوة زائدة في درعه.\n\n_+2:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+2 تهرب إضافي_ لكل نقطة قوة زائدة في درعه.\n\n_+3:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+3 تهرب إضافي_ لكل نقطة قوة زائدة في درعه.
actors.hero.talent.projectile_momentum.title=زخم المقذوفات
actors.hero.talent.projectile_momentum.desc=_+1:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+50%% دقة و+15%% ضرر_ بالأسلحة المرمية.\n\n_+2:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+100%% دقة و+30%% ضرر_ بالأسلحة المرمية.\n\n_+3:_ أثناء الجري الحر، يحصل عدّاء الحرية على _+150%% دقة و+45%% ضرر_ بالأسلحة المرمية.
actors.hero.talent.speedy_stealth.title=اختفاء سريع
actors.hero.talent.speedy_stealth.desc=_+1:_ يحصل عدّاء الحرية على شحنتين من الزخم لكل دور أثناء كونه غير مرئي.\n\n_+2:_ بالإضافة إلى فوائد +1، لم يعد عدّاد الجري الحر يتناقص أثناء كون عدّاء الحرية غير مرئي.\n\n_+3:_ بالإضافة إلى فوائد +1 و+2، يتحرك عدّاء الحرية بسرعة مضاعفة أثناء كونه غير مرئي، سواء كان في حالة جري حر أم لا.

actors.hero.talent.hasty_retreat.title=انسحاب سريع
actors.hero.talent.hasty_retreat.desc=_+1:_ بعد الانتقال الآني، يحصل اللص على _دور واحد_ من السرعة والاختفاء.\n\n_+2:_ بعد الانتقال الآني، يحصل اللص على _دورين_ من السرعة والاختفاء.\n\n_+3:_ بعد الانتقال الآني، يحصل اللص على _3 أدوار_ من السرعة والاختفاء.\n\n_+4:_ بعد الانتقال الآني، يحصل اللص على _4 أدوار_ من السرعة والاختفاء.
actors.hero.talent.body_replacement.title=استبدال الجسد
actors.hero.talent.body_replacement.desc=_+1:_ بعد الانتقال الآني، يترك اللص طُعمًا خشبيًا يمتلك _20 صحة و1-3 درع_.\n\n_+2:_ بعد الانتقال الآني، يترك اللص طُعمًا خشبيًا يمتلك _40 صحة و2-6 درع_.\n\n_+3:_ بعد الانتقال الآني، يترك اللص طُعمًا خشبيًا يمتلك _60 صحة و3-9 درع_.\n\n_+4:_ بعد الانتقال الآني، يترك اللص طُعمًا خشبيًا يمتلك _80 صحة و4-12 درع_.\n\nلا يمكن أن يكون هناك سوى طُعم واحد نشط في الوقت نفسه.
actors.hero.talent.shadow_step.title=خطوة الظل
actors.hero.talent.shadow_step.desc=_+1:_ إذا استخدم اللص قنبلة دخان أثناء كونه غير مرئي، فسيحدث ذلك فورًا وتكون تكلفة الشحنة _أقل بنسبة 16%%_، لكنه لن يصيب الأعداء بالعمى ولن يفعّل المواهب الأخرى.\n\n_+2:_ إذا استخدم اللص قنبلة دخان أثناء كونه غير مرئي، فسيحدث ذلك فورًا وتكون تكلفة الشحنة _أقل بنسبة 30%%_، لكنه لن يصيب الأعداء بالعمى ولن يفعّل المواهب الأخرى.\n\n_+3:_ إذا استخدم اللص قنبلة دخان أثناء كونه غير مرئي، فسيحدث ذلك فورًا وتكون تكلفة الشحنة _أقل بنسبة 41%%_، لكنه لن يصيب الأعداء بالعمى ولن يفعّل المواهب الأخرى.\n\n_+4:_ إذا استخدم اللص قنبلة دخان أثناء كونه غير مرئي، فسيحدث ذلك فورًا وتكون تكلفة الشحنة _أقل بنسبة 50%%_، لكنه لن يصيب الأعداء بالعمى ولن يفعّل المواهب الأخرى.

actors.hero.talent.fear_the_reaper.title=اخشَ الحصّاد
actors.hero.talent.fear_the_reaper.desc=_+1:_ عندما تصل صحة عدو موسوم بعلامة الموت إلى 0، يُصاب _بالإعاقة_.\n\n_+2:_ عندما تصل صحة عدو موسوم بعلامة الموت إلى 0، يُصاب _بالخوف والإعاقة_.\n\n_+3:_ عندما تصل صحة عدو موسوم بعلامة الموت إلى 0، يُصاب _بالخوف والإعاقة_، والأعداء ضمن 3 بلاطات يُصابون _بالإعاقة_.\n\n_+4:_ عندما تصل صحة عدو موسوم بعلامة الموت إلى 0، يُصاب _بالخوف والإعاقة_، والأعداء ضمن 3 بلاطات يُصابون _بالخوف والإعاقة_.
actors.hero.talent.deathly_durability.title=متانة مميتة
actors.hero.talent.deathly_durability.desc=_+1:_ يمنح الأعداء الذين يموتون بسبب علامة الموت اللص حماية تساوي _13%%_ من صحتهم وقت وسمهم.\n\n_+2:_ يمنح الأعداء الذين يموتون بسبب علامة الموت اللص حماية تساوي _25%%_ من صحتهم وقت وسمهم.\n\n_+3:_ يمنح الأعداء الذين يموتون بسبب علامة الموت اللص حماية تساوي _38%%_ من صحتهم وقت وسمهم.\n\n_+4:_ يمنح الأعداء الذين يموتون بسبب علامة الموت اللص حماية تساوي _50%%_ من صحتهم وقت وسمهم.
actors.hero.talent.double_mark.title=علامتان
actors.hero.talent.double_mark.desc=_+1:_ وضع علامة على هدف ثانٍ في الوقت نفسه مع الأول تكون تكلفته _أقل بنسبة 30%%_ من الشحنة.\n\n_+2:_ وضع علامة على هدف ثانٍ في الوقت نفسه مع الأول تكون تكلفته _أقل بنسبة 50%%_ من الشحنة.\n\n_+3:_ وضع علامة على هدف ثانٍ في الوقت نفسه مع الأول تكون تكلفته _أقل بنسبة 65%%_ من الشحنة.\n\n_+4:_ وضع علامة على هدف ثانٍ في الوقت نفسه مع الأول تكون تكلفته _أقل بنسبة 75%%_ من الشحنة.

actors.hero.talent.shadow_blade.title=نصل الظل
actors.hero.talent.shadow_blade.desc=_+1:_ تحصل نسخة الظل على _8%%_ من ضرر البطل لكل دور، وتمتلك _احتمال 25%%_ لاستخدام التعويذة على سلاح البطل.\n\n_+2:_ تحصل نسخة الظل على _16%%_ من ضرر البطل لكل دور، وتمتلك _احتمال 50%%_ لاستخدام التعويذة على سلاح البطل.\n\n_+3:_ تحصل نسخة الظل على _24%%_ من ضرر البطل لكل دور، وتمتلك _احتمال 75%%_ لاستخدام التعويذة على سلاح البطل.\n\n_+4:_ تحصل نسخة الظل على _32%%_ من ضرر البطل لكل دور، وتمتلك _احتمال 100%%_ لاستخدام التعويذة على سلاح البطل.
actors.hero.talent.cloned_armor.title=درع مستنسخ
actors.hero.talent.cloned_armor.desc=_+1:_ تحصل نسخة الظل على _12%%_ من قيمة درع البطل، وتمتلك _احتمال 25%%_ لاستخدام النقش الموجود على درع البطل.\n\n_+2:_ تحصل نسخة الظل على _24%%_ من قيمة درع البطل، وتمتلك _احتمال 50%%_ لاستخدام النقش الموجود على درع البطل.\n\n_+3:_ تحصل نسخة الظل على _36%%_ من قيمة درع البطل، وتمتلك _احتمال 75%%_ لاستخدام النقش الموجود على درع البطل.\n\n_+4:_ تحصل نسخة الظل على _48%%_ من قيمة درع البطل، وتمتلك _احتمال 100%%_ لاستخدام النقش الموجود على درع البطل.
actors.hero.talent.perfect_copy.title=نسخة مثالية
actors.hero.talent.perfect_copy.desc=_+1:_ تحصل نسخة الظل على _10%%_ من الصحة القصوى للبطل، ويمكنها تبديل مكانها مع البطل فورًا لمسافة تصل إلى _بلاطة واحدة_.\n\n_+2:_ تحصل نسخة الظل على _20%%_ من الصحة القصوى للبطل، ويمكنها تبديل مكانها مع البطل فورًا لمسافة تصل إلى _بلاطتين_.\n\n_+3:_ تحصل نسخة الظل على _30%%_ من الصحة القصوى للبطل، ويمكنها تبديل مكانها مع البطل فورًا لمسافة تصل إلى _3 بلاطات_.\n\n_+4:_ تحصل نسخة الظل على _40%%_ من الصحة القصوى للبطل، ويمكنها تبديل مكانها مع البطل فورًا لمسافة تصل إلى _4 بلاطات_.

# الصيادة
actors.hero.talent.natures_bounty.title=عطاء الطبيعة
actors.hero.talent.natures_bounty.desc=_+1:_ تستطيع الصيادة العثور على _4 حبات توت_ مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.\n\n_+2:_ تستطيع الصيادة العثور على _6 حبات توت_ مخبأة في العشب الطويل أثناء استكشافها للطوابق القليلة التالية من الزنزانة.\n\nيؤكل التوت بسرعة، ويستعيد قدرًا صغيرًا من الشبع، وقد يحتوي على بذرة قابلة للاستخدام.
actors.hero.talent.survivalists_intuition.title=حدس خبير البقاء
actors.hero.talent.survivalists_intuition.desc=_+1:_ تتعرف الصيادة على الأسلحة المرمية _بسرعة 3 أضعاف_.\n\n_+2:_ تتعرف الصيادة على الأسلحة المرمية _عند إصابة عدو بها_.
actors.hero.talent.followup_strike.title=ضربة متابعة
actors.hero.talent.followup_strike.desc=_+1:_ عندما تصيب الصيادة عدوًا بقوسها أو بسلاح مرمي، تلحق ضربتها القريبة التالية ضد ذلك العدو _2 ضرر إضافي_.\n\n_+2:_ عندما تصيب الصيادة عدوًا بقوسها أو بسلاح مرمي، تلحق ضربتها القريبة التالية ضد ذلك العدو _3 ضرر إضافي_.
actors.hero.talent.natures_aid.title=مساعدة الطبيعة
actors.hero.talent.natures_aid.desc=_+1:_ تحصل الصيادة على 0-2 من درع جلد اللحاء، ويتلاشى كل _3 أدوار_ عندما يتم تفعيل تأثير نبات ضمن مجال رؤيتها.\n\n_+2:_ تحصل الصيادة على 0-2 من درع جلد اللحاء، ويتلاشى كل _5 أدوار_ عندما يتم تفعيل تأثير نبات ضمن مجال رؤيتها.

actors.hero.talent.invigorating_meal.title=وجبة منشّطة
actors.hero.talent.invigorating_meal.desc=_+1:_ يستغرق تناول الطعام لدى الصيادة دورًا واحدًا (ويؤكل التوت فورًا) ويمنحها _دورًا واحدًا من السرعة_.\n\n_+2:_ يستغرق تناول الطعام لدى الصيادة دورًا واحدًا (ويؤكل التوت فورًا) ويمنحها _دورين من السرعة_.
actors.hero.talent.liquid_nature.title=طبيعة سائلة
actors.hero.talent.liquid_nature.desc=_+1:_ عندما تشرب الصيادة أو ترمي جرعة أو مشروبًا أو إكسيرًا، ينبت _حتى 4 بلاطات من العشب_ في المنطقة المحيطة، وتتجذر الأعداء الملاصقة لمدة _دور واحد_.\n\n_+2:_ عندما تشرب الصيادة أو ترمي جرعة أو مشروبًا أو إكسيرًا، ينبت _حتى 6 بلاطات من العشب_ في المنطقة المحيطة، وتتجذر الأعداء الملاصقة لمدة _دورين_.\n\nيتضاعف مقدار العشب ومدة التجذير عند استخدام جرعات القوة أو الخبرة أو عناصر الكيمياء التي يجب تصنيعها باستخدام تلك الجرعات.\n\nبالنسبة لعناصر الكيمياء ذات الكميات الناتجة الأعلى (مثل مشروب الماء)، فلدى هذه الموهبة احتمال للتفعيل اعتمادًا على عدد العناصر التي تم إنتاجها.
actors.hero.talent.rejuvenating_steps.title=خطوات منعشة
actors.hero.talent.rejuvenating_steps.desc=_+1:_ عندما تطأ الصيادة العشب القصير أو الجمر، فإنه ينمو إلى عشب طويل وتقوم الصيادة بشقه فورًا. فترة التهدئة _10 أدوار_.\n\n_+2:_ عندما تطأ الصيادة العشب القصير أو الجمر، فإنه ينمو إلى عشب طويل وتقوم الصيادة بشقه فورًا. فترة التهدئة _5 أدوار_.\n\nستنتج هذه الموهبة عشبًا مشقوقًا إذا كانت تأثيرات التجدد السلبي معطلة أو إذا لم يكتسب البطل خبرة منذ وقت طويل.
actors.hero.talent.heightened_senses.title=حواس معززة
actors.hero.talent.heightened_senses.desc=_+1:_ تحصل الصيادة على رؤية ذهنية للشخصيات ضمن _بلاطتين من موقعها_.\n\n_+2:_ تحصل الصيادة على رؤية ذهنية للشخصيات ضمن _3 بلاطات من موقعها_.
actors.hero.talent.durable_projectiles.title=مقذوفات متينة
actors.hero.talent.durable_projectiles.desc=_+1:_ تمتلك الأسلحة المرمية _+50%% متانة_ عند استخدامها من قبل الصيادة.\n\n_+2:_ تمتلك الأسلحة المرمية _+75%% متانة_ عند استخدامها من قبل الصيادة.

actors.hero.talent.point_blank.title=من مسافة قريبة
actors.hero.talent.point_blank.desc=_+1:_ عندما تستخدم الصيادة قوسها أو سلاحًا مرميًا من مدى قريب، تكون الدقة _-25%%_ بدلًا من -50%%.\n\n_+2:_ عندما تستخدم الصيادة قوسها أو سلاحًا مرميًا من مدى قريب، تكون الدقة _عادية_ بدلًا من -50%%.\n\n_+3:_ عندما تستخدم الصيادة قوسها أو سلاحًا مرميًا من مدى قريب، تكون الدقة _+25%%_ بدلًا من -50%%.\n\nلاحظ أن الأسلحة المرمية أو القوس الروحي تمتلك دائمًا +50%% دقة عند استخدامها من مسافة بعيدة.
actors.hero.talent.seer_shot.title=طلقة الرائي
actors.hero.talent.seer_shot.desc=_+1:_ عندما تطلق الصيادة سهمًا على الأرض، يمنح رؤية في منطقة 3x3 حوله لمدة _5 أدوار_. فترة التهدئة 20 دورًا.\n\n_+2:_ عندما تطلق الصيادة سهمًا على الأرض، يمنح رؤية في منطقة 3x3 حوله لمدة _10 أدوار_. فترة التهدئة 20 دورًا.\n\n_+3:_ عندما تطلق الصيادة سهمًا على الأرض، يمنح رؤية في منطقة 3x3 حوله لمدة _15 دورًا_. فترة التهدئة 20 دورًا.
actors.hero.talent.seer_shot.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستتفعّل عند استخدام أي سلاح مرمي.

actors.hero.talent.farsight.title=بصر بعيد
actors.hero.talent.farsight.desc=_+1:_ يزداد مدى رؤية القناصة _بنسبة 25%%_.\n\n_+2:_ يزداد مدى رؤية القناصة _بنسبة 50%%_.\n\n_+3:_ يزداد مدى رؤية القناصة _بنسبة 75%%_.
actors.hero.talent.shared_enchantment.title=تعويذة مشتركة
actors.hero.talent.shared_enchantment.desc=_+1:_ تمتلك الأسلحة المرمية _احتمال 33%%_ لاستخدام التعويذة الموجودة على قوس القناصة.\n\n_+2:_ تمتلك الأسلحة المرمية _احتمال 67%%_ لاستخدام التعويذة الموجودة على قوس القناصة.\n\n_+3:_ تمتلك الأسلحة المرمية _احتمال 100%%_ لاستخدام التعويذة الموجودة على قوس القناصة.\n\nيمكن لتَعويذة القوس أن تتفعّل بالإضافة إلى أي تعويذة يمتلكها السلاح المرمي أصلًا.
actors.hero.talent.shared_upgrades.title=ترقيات مشتركة
actors.hero.talent.shared_upgrades.desc=_+1:_ عندما تهاجم القناصة بسلاح مرمي مطور، يزيد كل مستوى مدة علامة القناص بمقدار دور واحد، ويزيد ضرر هجومها الخاص بنسبة 16%%، بحد أقصى _دورين و+33%% ضرر عند +2_.\n\n_+2:_ عندما تهاجم القناصة بسلاح مرمي مطور، يزيد كل مستوى مدة علامة القناص بمقدار دور واحد، ويزيد ضرر هجومها الخاص بنسبة 16%%، بحد أقصى _4 أدوار و+67%% ضرر عند +4_.\n\n_+3:_ عندما تهاجم القناصة بسلاح مرمي مطور، يزيد كل مستوى مدة علامة القناص بمقدار دور واحد، ويزيد ضرر هجومها الخاص بنسبة 16%%، بحد أقصى _6 أدوار و+100%% ضرر عند +6_.

actors.hero.talent.durable_tips.title=رؤوس متينة
actors.hero.talent.durable_tips.desc=_+1:_ تمتلك السهام المجهزة _ضعف المتانة_ عند استخدامها من قبل الحارسة.\n\n_+2:_ تمتلك السهام المجهزة _3 أضعاف المتانة_ عند استخدامها من قبل الحارسة.\n\n_+3:_ تمتلك السهام المجهزة _4 أضعاف المتانة_ عند استخدامها من قبل الحارسة.
actors.hero.talent.barkskin.title=جلد اللحاء
actors.hero.talent.barkskin.desc=_+1:_ عند المشي على العشب، تحصل الحارسة على درع من جلد اللحاء يتراوح بين _0-50%% من مستواها_ ويتلاشى كل دور.\n\n_+2:_ عند المشي على العشب، تحصل الحارسة على درع من جلد اللحاء يتراوح بين _0-100%% من مستواها_ ويتلاشى كل دور.\n\n_+3:_ عند المشي على العشب، تحصل الحارسة على درع من جلد اللحاء يتراوح بين _0-150%% من مستواها_ ويتلاشى كل دور.
actors.hero.talent.shielding_dew.title=ندى واقٍ
actors.hero.talent.shielding_dew.desc=_+1:_ يمكن لقطرات الندى منح الحارسة حماية عندما تكون صحتها ممتلئة، بحد أقصى _20%% من صحتها القصوى_.\n\n_+2:_ يمكن لقطرات الندى منح الحارسة حماية عندما تكون صحتها ممتلئة، بحد أقصى _40%% من صحتها القصوى_.\n\n_+3:_ يمكن لقطرات الندى منح الحارسة حماية عندما تكون صحتها ممتلئة، بحد أقصى _60%% من صحتها القصوى_.

actors.hero.talent.fan_of_blades.title=مروحة الشفرات
actors.hero.talent.fan_of_blades.desc=_+1:_ يمكن للشفرات الطيفية إصابة _هدف إضافي واحد_ بضرر 50%%. يجب أن يكون الهدف مرئيًا وضمن مساحة تأثير مخروطية بزاوية _30 درجة_.\n\n_+2:_ يمكن للشفرات الطيفية إصابة _هدفين إضافيين_ بضرر 50%%. يجب أن تكون الأهداف مرئية وضمن مساحة تأثير مخروطية بزاوية _60 درجة_.\n\n_+3:_ يمكن للشفرات الطيفية إصابة _3 أهداف إضافية_ بضرر 50%%. يجب أن تكون الأهداف مرئية وضمن مساحة تأثير مخروطية بزاوية _90 درجة_.\n\n_+4:_ يمكن للشفرات الطيفية إصابة _4 أهداف إضافية_ بضرر 50%%. يجب أن تكون الأهداف مرئية وضمن مساحة تأثير مخروطية بزاوية _120 درجة_.
actors.hero.talent.projecting_blades.title=شفرات ممتدة
actors.hero.talent.projecting_blades.desc=_+1:_ تمتلك الشفرات الطيفية _+25%% دقة_، ويمكنها اختراق _بلاطتين صلبتين_.\n\n_+2:_ تمتلك الشفرات الطيفية _+50%% دقة_، ويمكنها اختراق _4 بلاطات صلبة_.\n\n_+3:_ تمتلك الشفرات الطيفية _+75%% دقة_، ويمكنها اختراق _6 بلاطات صلبة_.\n\n_+4:_ تمتلك الشفرات الطيفية _+100%% دقة_، ويمكنها اختراق _8 بلاطات صلبة_.
actors.hero.talent.spirit_blades.title=شفرات روحية
actors.hero.talent.spirit_blades.desc=_+1:_ تمتلك الشفرات الطيفية _احتمال 30%%_ لاستخدام التعويذة الموجودة على القوس الروحي أيضًا.\n\n_+2:_ تمتلك الشفرات الطيفية _احتمال 60%%_ لاستخدام التعويذة الموجودة على القوس الروحي أيضًا.\n\n_+3:_ تمتلك الشفرات الطيفية _احتمال 90%%_ لاستخدام التعويذة الموجودة على القوس الروحي أيضًا.\n\n_+4:_ تمتلك الشفرات الطيفية _احتمال 100%%_ لاستخدام التعويذة الموجودة على القوس الروحي أيضًا، كما تمنح كل تعويذة _+10%% من القوة_.

actors.hero.talent.growing_power.title=قوة متنامية
actors.hero.talent.growing_power.desc=_+1:_ تزداد زيادتا الهجوم وسرعة الحركة الناتجتان عن قوة الطبيعة إلى _38%% و125%%_ بدلًا من 33%% و100%%.\n\n_+2:_ تزداد زيادتا الهجوم وسرعة الحركة الناتجتان عن قوة الطبيعة إلى _42%% و150%%_ بدلًا من 33%% و100%%.\n\n_+3:_ تزداد زيادتا الهجوم وسرعة الحركة الناتجتان عن قوة الطبيعة إلى _46%% و175%%_ بدلًا من 33%% و100%%.\n\n_+4:_ تزداد زيادتا الهجوم وسرعة الحركة الناتجتان عن قوة الطبيعة إلى _50%% و200%%_ بدلًا من 33%% و100%%.
actors.hero.talent.natures_wrath.title=غضب الطبيعة
actors.hero.talent.natures_wrath.desc=_+1:_ أثناء نشاط قوة الطبيعة، تمتلك طلقات القوس الروحي _احتمال 8%%_ لتفعيل تأثير نبات ضار عشوائي.\n\n_+2:_ أثناء نشاط قوة الطبيعة، تمتلك طلقات القوس الروحي _احتمال 17%%_ لتفعيل تأثير نبات ضار عشوائي.\n\n_+3:_ أثناء نشاط قوة الطبيعة، تمتلك طلقات القوس الروحي _احتمال 25%%_ لتفعيل تأثير نبات ضار عشوائي.\n\n_+4:_ أثناء نشاط قوة الطبيعة، تمتلك طلقات القوس الروحي _احتمال 33%%_ لتفعيل تأثير نبات ضار عشوائي.\n\nالنباتات التي يمكن تفعيلها هي: العشبة العمياء، وزهرة النار، وقبعة الجليد، وطحلب الحزن، وكرمة العاصفة.
actors.hero.talent.wild_momentum.title=زخم جامح
actors.hero.talent.wild_momentum.desc=_+1:_ يؤدي قتل عدو بالقوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار _دور واحد_. ويمكن تمديد المدة بحد أقصى _دورين_.\n\n_+2:_ يؤدي قتل عدو بالقوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار _دورين_. ويمكن تمديد المدة بحد أقصى _4 أدوار_.\n\n_+3:_ يؤدي قتل عدو بالقوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار _3 أدوار_. ويمكن تمديد المدة بحد أقصى _6 أدوار_.\n\n_+4:_ يؤدي قتل عدو بالقوس الروحي إلى إطالة مدة قوة الطبيعة بمقدار _4 أدوار_. ويمكن تمديد المدة بحد أقصى _8 أدوار_.

actors.hero.talent.eagle_eye.title=عين الصقر
actors.hero.talent.eagle_eye.desc=_+1:_ يزداد مدى رؤية الصقر الروحي إلى _7 بلاطات_ بدلًا من 6.\n\n_+2:_ يزداد مدى رؤية الصقر الروحي إلى _8 بلاطات_ بدلًا من 6.\n\n_+3:_ يزداد مدى رؤية الصقر الروحي إلى _9 بلاطات_ بدلًا من 6، ويحصل على _بلاطتين_ من الرؤية الذهنية.\n\n_+4:_ يزداد مدى رؤية الصقر الروحي إلى _10 بلاطات_ بدلًا من 6، ويحصل على _3 بلاطات_ من الرؤية الذهنية.
actors.hero.talent.go_for_the_eyes.title=استهدف العينين
actors.hero.talent.go_for_the_eyes.desc=_+1:_ تصيب هجمات الصقر الروحي الأعداء بالعمى لمدة _دورين_.\n\n_+2:_ تصيب هجمات الصقر الروحي الأعداء بالعمى لمدة _5 أدوار_.\n\n_+3:_ تصيب هجمات الصقر الروحي الأعداء بالعمى لمدة _5 أدوار_ وتعيقهم لمدة _دورين_.\n\n_+4:_ تصيب هجمات الصقر الروحي الأعداء بالعمى لمدة _5 أدوار_ وتعيقهم لمدة _5 أدوار_.
actors.hero.talent.swift_spirit.title=روح سريعة
actors.hero.talent.swift_spirit.desc=_+1:_ تزداد سرعة حركة الصقر الروحي إلى _2.5 بلاطة_ بدلًا من 2، ويضمن مراوغة أول _هجومين_ موجهين إليه.\n\n_+2:_ تزداد سرعة حركة الصقر الروحي إلى _3 بلاطات_ بدلًا من 2، ويضمن مراوغة أول _4 هجمات_ موجهة إليه.\n\n_+3:_ تزداد سرعة حركة الصقر الروحي إلى _3.5 بلاطات_ بدلًا من 2، ويضمن مراوغة أول _6 هجمات_ موجهة إليه.\n\n_+4:_ تزداد سرعة حركة الصقر الروحي إلى _4 بلاطات_ بدلًا من 2، ويضمن مراوغة أول _8 هجمات_ موجهة إليه.

# المبارزة
actors.hero.talent.strengthening_meal.title=وجبة مقوية
actors.hero.talent.strengthening_meal.desc=_+1:_ يمنح تناول الطعام المبارزة 3 ضرر إضافي في المرات _الثنائية التالية_ التي تصيب فيها عدوًا بهجوم جسدي.\n\n_+2:_ يمنح تناول الطعام المبارزة 3 ضرر إضافي في المرات _الثلاث التالية_ التي تصيب فيها عدوًا بهجوم جسدي.
actors.hero.talent.adventurers_intuition.title=حدس المغامر
actors.hero.talent.adventurers_intuition.desc=_+1:_ تتعرف المبارزة على الأسلحة _بسرعة 2.5 ضعف_ وعلى الدروع _بسرعة 1.75 ضعف_.\n\n_+2:_ تتعرف المبارزة على الأسلحة _عند تجهيزها_ وعلى الدروع _بسرعة 2.5 ضعف_.
actors.hero.talent.patient_strike.title=ضربة صبورة
actors.hero.talent.patient_strike.desc=_+1:_ إذا انتظرت المبارزة قبل تنفيذ هجوم قريب، فستُلحق _1-2 ضرر إضافي_.\n\n_+2:_ إذا انتظرت المبارزة قبل تنفيذ هجوم قريب، فستُلحق _2 ضرر إضافي_.
actors.hero.talent.aggressive_barrier.title=حاجز هجومي
actors.hero.talent.aggressive_barrier.desc=_+1:_ تحصل المبارزة على _3 حماية_ عند استخدام قدرة سلاح بينما تكون صحتها عند 50%% أو أقل.\n\n_+2:_ تحصل المبارزة على _5 حماية_ عند استخدام قدرة سلاح بينما تكون صحتها عند 50%% أو أقل.
actors.hero.talent.aggressive_barrier.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك حماية عند تنفيذ هجوم قريب بصحة منخفضة، مع فترة تهدئة 50 دورًا.

actors.hero.talent.focused_meal.title=وجبة مركزة
actors.hero.talent.focused_meal.desc=_+1:_ يستغرق تناول الطعام لدى المبارزة دورًا واحدًا ويمنحها _0.67 شحنة_ على أسلحتها.\n\n_+2:_ يستغرق تناول الطعام لدى المبارزة دورًا واحدًا ويمنحها _شحنة واحدة_ على أسلحتها.
actors.hero.talent.focused_meal.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك ضررًا إضافيًا في ضربته التالية يساوي مستواه/3 عند +1، أو مستواه/2 عند +2.
actors.hero.talent.liquid_agility.title=رشاقة سائلة
actors.hero.talent.liquid_agility.desc=_+1:_ عند شرب أو رمي جرعة أو مشروب أو إكسير، تمتلك المبارزة _3 أضعاف التهرب_، وتمتلك _3 أضعاف الدقة_ في هجومها القريب التالي خلال 5 أدوار.\n\n_+2:_ عند شرب أو رمي جرعة أو مشروب أو إكسير، تمتلك المبارزة _تهربًا لا نهائيًا_، وتمتلك _دقة لا نهائية_ في هجومها القريب التالي خلال 5 أدوار.\n\nيستمر هذا التعزيز لدور وهجوم إضافيين عند استخدام جرعات القوة أو الخبرة أو عناصر الكيمياء التي يجب تصنيعها باستخدام تلك الجرعات.\n\nبالنسبة لعناصر الكيمياء ذات الكميات الناتجة الأعلى (مثل مشروب الماء)، فلدى هذه الموهبة احتمال للتفعيل اعتمادًا على عدد العناصر التي تم إنتاجها.
actors.hero.talent.weapon_recharging.title=إعادة شحن السلاح
actors.hero.talent.weapon_recharging.desc=_+1:_ تحصل المبارزة على شحنة سلاح واحدة كل _15 دورًا_ عندما تكون تحت تأثير تأثيرات إعادة شحن العصي أو القطع الأثرية.\n\n_+2:_ تحصل المبارزة على شحنة سلاح واحدة كل _10 أدوار_ عندما تكون تحت تأثير تأثيرات إعادة شحن العصي أو القطع الأثرية.
actors.hero.talent.weapon_recharging.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستجعله يلحق +5%% من الضرر القريب أثناء إعادة الشحن عند +1، أو +7.5%% من الضرر القريب أثناء إعادة الشحن عند +2.
actors.hero.talent.lethal_haste.title=سرعة قاتلة
actors.hero.talent.lethal_haste.desc=_+1:_ عندما توجه المبارزة ضربة قاتلة إلى عدو باستخدام قدرة سلاح، تحصل على _3 أدوار_ من الحركة الفورية.\n\n_+2:_ عندما توجه المبارزة ضربة قاتلة إلى عدو باستخدام قدرة سلاح، تحصل على _5 أدوار_ من الحركة الفورية.
actors.hero.talent.lethal_haste.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستتفعّل بدلًا من ذلك مع الهجمات العادية للأسلحة، مع فترة تهدئة 100 دور.
actors.hero.talent.swift_equip.title=تجهيز سريع
actors.hero.talent.swift_equip.desc=_+1:_ تستطيع المبارزة تبديل سلاحها المجهز فورًا _مرة واحدة_ كل 20 دورًا.\n\n_+2:_ تستطيع المبارزة تبديل سلاحها المجهز فورًا _مرتين_ كل 20 دورًا.\n\nإذا امتلكت المبارزة هذه الموهبة ولم تكن في فترة تهدئة، فإن استخدام سلاح غير مجهز بسرعة سيجهزه.

actors.hero.talent.precise_assault.title=هجوم دقيق
actors.hero.talent.precise_assault.desc=_+1:_ عند استخدام المبارزة لقدرة سلاح، تحصل على _ضعف الدقة_ في هجومها القريب التالي خلال 5 أدوار.\n\n_+2:_ عند استخدام المبارزة لقدرة سلاح، تحصل على _5 أضعاف الدقة_ في هجومها القريب التالي خلال 5 أدوار.\n\n_+3:_ عند استخدام المبارزة لقدرة سلاح، تحصل على _دقة لا نهائية_ في هجومها القريب التالي خلال 5 أدوار.
actors.hero.talent.precise_assault.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها تزيد دقة الهجوم القريب بدلًا من ذلك بنسبة 10%% عند +1، أو 20%% عند +2، أو 30%% عند +3.
actors.hero.talent.deadly_followup.title=متابعة مميتة
actors.hero.talent.deadly_followup.desc=_+1:_ عندما تصيب المبارزة عدوًا بسلاح مرمي، تلحق به _10%% ضررًا قريبًا إضافيًا_ لمدة 5 أدوار.\n\n_+2:_ عندما تصيب المبارزة عدوًا بسلاح مرمي، تلحق به _20%% ضررًا قريبًا إضافيًا_ لمدة 5 أدوار.\n\n_+3:_ عندما تصيب المبارزة عدوًا بسلاح مرمي، تلحق به _30%% ضررًا قريبًا إضافيًا_ لمدة 5 أدوار.

actors.hero.talent.varied_charge.title=شحنة متنوعة
actors.hero.talent.varied_charge.desc=_+1:_ تستعيد البطلة فورًا _0.17 من شحنات السلاح_ عندما تستخدم قدرتين مختلفتين للأسلحة، دون حد زمني.\n\n_+2:_ تستعيد البطلة فورًا _0.33 من شحنات السلاح_ عندما تستخدم قدرتين مختلفتين للأسلحة، دون حد زمني.\n\n_+3:_ تستعيد البطلة فورًا _0.5 من شحنات السلاح_ عندما تستخدم قدرتين مختلفتين للأسلحة، دون حد زمني.
actors.hero.talent.twin_upgrades.title=ترقيتان متطابقتان
actors.hero.talent.twin_upgrades.desc=_+1:_ إذا كان أحد سلاحي البطلة المجهزين يمتلك مستوى أقل ويكون _أقل بمستويين أو أكثر_ من السلاح الآخر، فسيُرفع إلى مستوى السلاح الآخر.\n\n_+2:_ إذا كان أحد سلاحي البطلة المجهزين يمتلك مستوى أقل ويكون _أقل بمستوى واحد أو أكثر_ من السلاح الآخر، فسيُرفع إلى مستوى السلاح الآخر.\n\n_+3:_ إذا كان أحد سلاحي البطلة المجهزين يمتلك مستوى أقل ويكون _من نفس المستوى أو أقل_ من السلاح الآخر، فسيُرفع إلى مستوى السلاح الآخر.
actors.hero.talent.combined_lethality.title=فتك مشترك
actors.hero.talent.combined_lethality.desc=_+1:_ إذا هاجمت البطلة بسلاح قريب فورًا بعد استخدام قدرة سلاح مختلف، فستعدم تلك الضربة أي عدو غير زعيم تبقى من صحته _أقل من 13%%_.\n\n_+2:_ إذا هاجمت البطلة بسلاح قريب فورًا بعد استخدام قدرة سلاح مختلف، فستعدم تلك الضربة أي عدو غير زعيم تبقى من صحته _أقل من 27%%_.\n\n_+3:_ إذا هاجمت البطلة بسلاح قريب فورًا بعد استخدام قدرة سلاح مختلف، فستعدم تلك الضربة أي عدو غير زعيم تبقى من صحته _أقل من 40%%_.\n\nيمكن أن تكون هذه الضربة هجومًا عاديًا بسلاح قريب أو جزءًا من قدرة سلاح.

actors.hero.talent.unencumbered_spirit.title=روح حرة
actors.hero.talent.unencumbered_spirit.desc=_+1:_ يحصل الراهب على _50%% طاقة إضافية_ مقابل كل قطعة من المعدات _من المستوى 3 أو أقل_ يستخدمها.\n\n_+2:_ يحصل الراهب على _75%% طاقة إضافية_ مقابل كل قطعة من المعدات _من المستوى 2 أو أقل_ يستخدمها. ولا يتغير تأثير المستوى 3.\n\n_+3:_ يحصل الراهب على _100%% طاقة إضافية_ مقابل كل قطعة من المعدات _من المستوى 1 أو أقل_ يستخدمها. ولا تتغير فوائد المستويين 2 و3. كما يحصل على درع قماشي وقفازات مرصعة مجانًا.\n\nلاحظ أن هذه الموهبة لا تمنح أي فائدة من القتال دون سلاح أو الهجوم باستخدام خاتم القوة.
actors.hero.talent.monastic_vigor.title=حيوية رهبانية
actors.hero.talent.monastic_vigor.desc=_+1:_ إذا كان لدى الراهب _100%% من الطاقة_، فستكون قدراته معززة.\n\n_+2:_ إذا كان لدى الراهب _80%% من الطاقة أو أكثر_، فستكون قدراته معززة.\n\n_+3:_ إذا كان لدى الراهب _60%% من الطاقة أو أكثر_، فستكون قدراته معززة.\n\nعند التعزيز:\n- يطبق وابل الضربات تعويذة سلاحك\n- يصبح التركيز فوريًا\n- يحصل الاندفاع على +4 إلى المدى\n- تلحق ركلة التنين +50%% من الضرر وتطبق تأثير الدفع والشلل على جميع الأعداء الملاصقين\n- يشفي التأمل ببطء 20%% من الصحة المفقودة ويمنح مقاومة للضرر بنسبة 80%%.
actors.hero.talent.combined_energy.title=طاقة مشتركة
actors.hero.talent.combined_energy.desc=_+1:_ إذا استخدم الراهب قدرة سلاح وقدرة تكلف _4 طاقة أو أكثر_ خلال 5 أدوار من بعضهما، فإنه يستعيد طاقة واحدة أنفقها.\n\n_+2:_ إذا استخدم الراهب قدرة سلاح وقدرة تكلف _3 طاقة أو أكثر_ خلال 5 أدوار من بعضهما، فإنه يستعيد طاقة واحدة أنفقها.\n\n_+3:_ إذا استخدم الراهب قدرة سلاح وقدرة تكلف _2 طاقة أو أكثر_ خلال 5 أدوار من بعضهما، فإنه يستعيد طاقة واحدة أنفقها.

actors.hero.talent.close_the_gap.title=تقليص المسافة
actors.hero.talent.close_the_gap.desc=_+1:_ تنتقل المبارزة آنيًا _حتى بلاطتين_ باتجاه هدفها عند بدء المبارزة.\n\n_+2:_ تنتقل المبارزة آنيًا _حتى 3 بلاطات_ باتجاه هدفها عند بدء المبارزة.\n\n_+3:_ تنتقل المبارزة آنيًا _حتى 4 بلاطات_ باتجاه هدفها عند بدء المبارزة.\n\n_+4:_ تنتقل المبارزة آنيًا _حتى 5 بلاطات_ باتجاه هدفها عند بدء المبارزة.\n\nيمكن لهذا الانتقال الآني المرور عبر المخاطر والأعداء، لكنه لا يستطيع المرور عبر التضاريس الصلبة مثل الجدران. ويؤخذ هذا الانتقال الآني في الحسبان عند تحديد ما إذا كان العدو ضمن مدى التحدي.

actors.hero.talent.invigorating_victory.title=نصر منشّط
actors.hero.talent.invigorating_victory.desc=_+1:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تستعيد _5 نقاط صحة بالإضافة إلى 30%% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+2:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تستعيد _10 نقاط صحة بالإضافة إلى 50%% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+3:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تستعيد _15 نقطة صحة بالإضافة إلى 65%% من الضرر_ الذي تلقته أثناء المبارزة.\n\n_+4:_ إذا هزمت المبارزة هدفها قبل انتهاء المبارزة، فإنها تستعيد _20 نقطة صحة بالإضافة إلى 75%% من الضرر_ الذي تلقته أثناء المبارزة.

actors.hero.talent.elimination_match.title=مباراة إقصائية
actors.hero.talent.elimination_match.desc=_+1:_ إذا تحدّت المبارزة عدوًا مرة أخرى خلال 3 أدوار من انتهاء مبارزة سابقة، فستكون تكلفة ذلك التحدي _أقل بنسبة 16%%_.\n\n_+2:_ إذا تحدّت المبارزة عدوًا مرة أخرى خلال 3 أدوار من انتهاء مبارزة سابقة، فستكون تكلفة ذلك التحدي _أقل بنسبة 30%%_.\n\n_+3:_ إذا تحدّت المبارزة عدوًا مرة أخرى خلال 3 أدوار من انتهاء مبارزة سابقة، فستكون تكلفة ذلك التحدي _أقل بنسبة 40%%_.\n\n_+4:_ إذا تحدّت المبارزة عدوًا مرة أخرى خلال 3 أدوار من انتهاء مبارزة سابقة، فستكون تكلفة ذلك التحدي _أقل بنسبة 50%%_.

actors.hero.talent.elemental_reach.title=مدى عنصري
actors.hero.talent.elemental_reach.desc=_+1:_ يزداد مدى الضربة العنصرية إلى _5 بلاطات_ بدلًا من 4، ويزداد عرضها إلى _75 درجة_ بدلًا من 65.\n\n_+2:_ يزداد مدى الضربة العنصرية إلى _6 بلاطات_ بدلًا من 4، ويزداد عرضها إلى _85 درجة_ بدلًا من 65.\n\n_+3:_ يزداد مدى الضربة العنصرية إلى _7 بلاطات_ بدلًا من 4، ويزداد عرضها إلى _95 درجة_ بدلًا من 65.\n\n_+4:_ يزداد مدى الضربة العنصرية إلى _8 بلاطات_ بدلًا من 4، ويزداد عرضها إلى _105 درجات_ بدلًا من 65.

actors.hero.talent.striking_force.title=قوة ضاربة
actors.hero.talent.striking_force.desc=_+1:_ تزداد قوة تأثير الضربة العنصرية _بنسبة 30%%_.\n\n_+2:_ تزداد قوة تأثير الضربة العنصرية _بنسبة 60%%_.\n\n_+3:_ تزداد قوة تأثير الضربة العنصرية _بنسبة 90%%_.\n\n_+4:_ تزداد قوة تأثير الضربة العنصرية _بنسبة 120%%_.

actors.hero.talent.directed_power.title=قوة موجّهة
actors.hero.talent.directed_power.desc=_+1:_ تحصل الضربة المباشرة من الضربة العنصرية على _+30%% من قوة التعويذة_ لكل عدو ضمن مدى تأثير الضربة العنصرية، بما في ذلك الهدف الذي تمت مهاجمته.\n\n_+2:_ تحصل الضربة المباشرة من الضربة العنصرية على _+60%% من قوة التعويذة_ لكل عدو ضمن مدى تأثير الضربة العنصرية، بما في ذلك الهدف الذي تمت مهاجمته.\n\n_+3:_ تحصل الضربة المباشرة من الضربة العنصرية على _+90%% من قوة التعويذة_ لكل عدو ضمن مدى تأثير الضربة العنصرية، بما في ذلك الهدف الذي تمت مهاجمته.\n\n_+4:_ تحصل الضربة المباشرة من الضربة العنصرية على _+120%% من قوة التعويذة_ لكل عدو ضمن مدى تأثير الضربة العنصرية، بما في ذلك الهدف الذي تمت مهاجمته.

actors.hero.talent.feigned_retreat.title=انسحاب وهمي
actors.hero.talent.feigned_retreat.desc=_+1:_ إذا هاجم عدو الصورة الوهمية للمبارزة، تحصل على _دورين_ من السرعة.\n\n_+2:_ إذا هاجم عدو الصورة الوهمية للمبارزة، تحصل على _4 أدوار_ من السرعة.\n\n_+3:_ إذا هاجم عدو الصورة الوهمية للمبارزة، تحصل على _6 أدوار_ من السرعة.\n\n_+4:_ إذا هاجم عدو الصورة الوهمية للمبارزة، تحصل على _8 أدوار_ من السرعة.

actors.hero.talent.expose_weakness.title=كشف الضعف
actors.hero.talent.expose_weakness.desc=_+1:_ يصبح الأعداء الذين يهاجمون الصورة الوهمية للمبارزة _ضعفاء وهشّين_ لمدة _دورين_.\n\n_+2:_ يصبح الأعداء الذين يهاجمون الصورة الوهمية للمبارزة _ضعفاء وهشّين_ لمدة _4 أدوار_.\n\n_+3:_ يصبح الأعداء الذين يهاجمون الصورة الوهمية للمبارزة _ضعفاء وهشّين_ لمدة _6 أدوار_.\n\n_+4:_ يصبح الأعداء الذين يهاجمون الصورة الوهمية للمبارزة _ضعفاء وهشّين_ لمدة _8 أدوار_.

actors.hero.talent.counter_ability.title=قدرة مضادة
actors.hero.talent.counter_ability.desc=_+1:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من تعرض صورتها الوهمية للهجوم، فإنها تستعيد فورًا _0.38 شحنة_.\n\n_+2:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من تعرض صورتها الوهمية للهجوم، فإنها تستعيد فورًا _0.77 شحنة_.\n\n_+3:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من تعرض صورتها الوهمية للهجوم، فإنها تستعيد فورًا _1.13 شحنة_.\n\n_+4:_ إذا استخدمت المبارزة قدرة سلاح خلال 3 أدوار من تعرض صورتها الوهمية للهجوم، فإنها تستعيد فورًا _1.5 شحنة_.

#الكاهن
actors.hero.talent.satiated_spells.title=تعاويذ الشبع
actors.hero.talent.satiated_spells.desc=_+1:_ يؤدي تناول الطعام إلى حصول الكاهن على _3 حماية_ في المرة التالية التي يلقي فيها تعويذة.\n\n_+2:_ يؤدي تناول الطعام إلى حصول الكاهن على _5 حماية_ في المرة التالية التي يلقي فيها تعويذة.
actors.hero.talent.satiated_spells.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك حماية فورًا، والتي ستبدأ في التلاشي بشكل طبيعي بعد 10 أدوار.

actors.hero.talent.holy_intuition.title=الحدس المقدس
actors.hero.talent.holy_intuition.desc=_+1:_ يستطيع الكاهن إلقاء _الحدس المقدس_، وهي تعويذة تكشف ما إذا كان أحد العناصر ملعونًا، بتكلفة _3 شحنات_.\n\n_+2:_ يستطيع الكاهن إلقاء _الحدس المقدس_، وهي تعويذة تكشف ما إذا كان أحد العناصر ملعونًا، بتكلفة _شحنَتين_.
actors.hero.talent.holy_intuition.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستتيح للبطل بدلًا من ذلك معرفة ما إذا كان العنصر ملعونًا مباشرةً قبل تجهيزه، بنسبة 15%% من الوقت عند +1 أو 25%% من الوقت عند +2.

actors.hero.talent.searing_light.title=الضوء الحارق
actors.hero.talent.searing_light.desc=_+1:_ تلحق هجمات الكاهن الجسدية بالأعداء المضَاءين بواسطة _الضوء الهادي_ _+3 ضرر_.\n\n_+2:_ تلحق هجمات الكاهن الجسدية بالأعداء المضَاءين بواسطة _الضوء الهادي_ _+5 ضرر_.
actors.hero.talent.searing_light.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك ضررًا إضافيًا بعد استخدام عصا أو قطعة أثرية على عدو، مع فترة تهدئة قدرها 20 دورًا.

actors.hero.talent.shield_of_light.title=درع الضوء
actors.hero.talent.shield_of_light.desc=_+1:_ يستطيع الكاهن إلقاء _درع الضوء_، وهي تعويذة تُلقى فورًا وتمنحه _2-4 درع_ ضد هدف لمدة 5 أدوار، بتكلفة شحنة واحدة.\n\n_+2:_ يستطيع الكاهن إلقاء _درع الضوء_، وهي تعويذة تُلقى فورًا وتمنحه _3-6 درع_ ضد هدف لمدة 5 أدوار، بتكلفة شحنة واحدة.
actors.hero.talent.shield_of_light.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستقلل بدلًا من ذلك الضرر الجسدي الذي يتلقاه من العدو المستهدف بمقدار 1، بنسبة 33%% من الوقت عند +1 أو 50%% من الوقت عند +2.

actors.hero.talent.enlightening_meal.title=وجبة منيرة
actors.hero.talent.enlightening_meal.desc=_+1:_ يستغرق تناول الطعام لدى الكاهن دورًا واحدًا ويمنحه _0.67 شحنة_ على كتابه المقدس.\n\n_+2:_ يستغرق تناول الطعام لدى الكاهن دورًا واحدًا ويمنحه _شحنة واحدة_ على كتابه المقدس.
actors.hero.talent.enlightening_meal.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك دورين من إعادة شحن العصي والقطع الأثرية عند +1، أو 3 أدوار عند +2. ولا يمكن استخدام هذا لجعل قرن الوفرة يعيد شحن نفسه.

actors.hero.talent.recall_inscription.title=استرجاع النقش
actors.hero.talent.recall_inscription.refunded=تمت إعادة عنصرِك إليك!
actors.hero.talent.recall_inscription.desc=_+1:_ يستطيع الكاهن إلقاء _استرجاع النقش_، وهي تعويذة تتيح له تكرار تأثير آخر حجر روني أو لفافة استخدمها خلال _10 أدوار_.\n\n_+2:_ يستطيع الكاهن إلقاء _استرجاع النقش_، وهي تعويذة تتيح له تكرار تأثير آخر حجر روني أو لفافة استخدمها خلال _300 دور_.\n\nلا يمكن استخدام استرجاع النقش مع لفائف الترقية. تختلف تكلفة شحن هذه التعويذة بحسب العنصر المستخدم مؤخرًا: 2 للحجر الروني، و3 للّفافة، و4 للّفافة الغريبة. وتتضاعف هذه التكلفة أيضًا عند استخدامها مع لفافة التحويل، أو عناصر الكيمياء التي يجب تصنيعها باستخدام التحويل أو الترقية.
actors.hero.talent.recall_inscription.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستعيد إليه أي لفافة أو حجر روني بنسبة 10%% من الوقت عند +1 أو 15%% من الوقت عند +2. وتُستثنى لفائف الترقية من هذا التأثير.

actors.hero.talent.sunray.title=شعاع الشمس
actors.hero.talent.sunray.desc=_+1:_ يستطيع الكاهن إلقاء _شعاع الشمس_، وهي تعويذة تلحق _4-8 ضرر_ بالهدف وتصيبه بالعمى لمدة _4 أدوار_، بتكلفة شحنة واحدة.\n\n_+2:_ يستطيع الكاهن إلقاء _شعاع الشمس_، وهي تعويذة تلحق _6-12 ضرر_ بالهدف وتصيبه بالعمى لمدة _6 أدوار_، بتكلفة شحنة واحدة.\n\nيمكن لشعاع الشمس إصابة كل هدف بالعمى مرة واحدة فقط، لكن إذا كان الهدف مصابًا بالعمى بالفعل بسبب شعاع الشمس، فسيُصاب بالشلل بدلًا من ذلك. ويلحق شعاع الشمس دائمًا أقصى ضرر بالأعداء الشياطين وغير الأحياء.
actors.hero.talent.sunray.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستجعل العصي والقطع الأثرية تُصيب الأعداء بالعمى لمدة 4 أدوار بنسبة 15%% من الوقت عند +1 أو 25%% من الوقت عند +2.

actors.hero.talent.divine_sense.title=الإحساس الإلهي
actors.hero.talent.divine_sense.desc=_+1:_ يستطيع الكاهن إلقاء _الإحساس الإلهي_، وهي تعويذة تمنحه _8 بلاطات_ من الرؤية الذهنية لمدة 50 دورًا ولا تستغرق وقتًا للإلقاء، بتكلفة شحنتين.\n\n_+2:_ يستطيع الكاهن إلقاء _الإحساس الإلهي_، وهي تعويذة تمنحه _12 بلاطة_ من الرؤية الذهنية لمدة 50 دورًا ولا تستغرق وقتًا للإلقاء، بتكلفة شحنتين.
actors.hero.talent.divine_sense.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستمنحه بدلًا من ذلك رؤية ذهنية للحظة قصيرة بعد استخدام عصا أو قطعة أثرية بمدى 3 بلاطات عند +1 أو 5 بلاطات عند +2.

actors.hero.talent.bless.title=البركة
actors.hero.talent.bless.desc=_+1:_ يستطيع الكاهن إلقاء _البركة_، وهي تعويذة تمنحه _6 أدوار من البركة و10 حماية_ عند إلقائها على نفسه، أو _10 أدوار من البركة و10 علاج_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.\n\n_+2:_ يستطيع الكاهن إلقاء _البركة_، وهي تعويذة تمنحه _10 أدوار من البركة و15 حماية_ عند إلقائها على نفسه، أو _15 دورًا من البركة و15 علاجًا_ عند إلقائها على شخصية أخرى، بتكلفة شحنة واحدة.\n\nيتم تحويل العلاج الزائد الناتج عن هذه التعويذة إلى حماية.
actors.hero.talent.bless.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستزيد بدلًا من ذلك الدقة والتهرب للبطل وجميع حلفائه بنسبة 3%% عند +1 أو 5%% عند +2.

actors.hero.talent.cleanse.title=التطهير
actors.hero.talent.cleanse.desc=_+1:_ يستطيع الكاهن إلقاء _التطهير_، وهي تعويذة _تزيل التأثيرات السلبية_ عن الكاهن وجميع الحلفاء القريبين، وتمنحهم _10 حماية_، بتكلفة شحنتين.\n\n_+2:_ يستطيع الكاهن إلقاء _التطهير_، وهي تعويذة _تمنح 3 أدوار من المناعة ضد التأثيرات السلبية_ للكاهن وجميع الحلفاء القريبين، وتمنحهم _20 حماية_، بتكلفة شحنتين.\n\n_+3:_ يستطيع الكاهن إلقاء _التطهير_، وهي تعويذة _تمنح 5 أدوار من المناعة ضد التأثيرات السلبية_ للكاهن وجميع الحلفاء القريبين، وتمنحهم _30 حماية_، بتكلفة شحنتين.
actors.hero.talent.cleanse.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستزيل بدلًا من ذلك التأثيرات السلبية عن البطل بعد استخدام عصا أو قطعة أثرية، بنسبة 10/20/30%% من الوقت عند +1/+2/+3.

actors.hero.talent.light_reading.title=قراءة خفيفة
actors.hero.talent.light_reading.desc=_+1:_ يستطيع الكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، لكنه يعيد الشحن بسرعة _25%%_ عند عدم تجهيزه.\n\n_+2:_ يستطيع الكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، لكنه يعيد الشحن بسرعة _50%%_ عند عدم تجهيزه.\n\n_+3:_ يستطيع الكاهن استخدام كتابه المقدس عندما لا يكون مجهزًا، لكنه يعيد الشحن بسرعة _75%%_ عند عدم تجهيزه.
actors.hero.talent.light_reading.meta_desc=_إذا اكتسب بطل آخر هذه الموهبة_ فإنها ستزيد بدلًا من ذلك سرعة إعادة شحن جميع العصي بنسبة 7/13/20%% عند +1/+2/+3.

actors.hero.talent.holy_lance.title=الرمح المقدس
actors.hero.talent.holy_lance.desc=_+1:_ يستطيع الكاهن إلقاء _الرمح المقدس_، وهي تعويذة مدمرة تلحق _30-55 ضررًا_ بتكلفة 4 شحنات.\n\n_+2:_ يستطيع الكاهن إلقاء _الرمح المقدس_، وهي تعويذة مدمرة تلحق _45-83 ضررًا_ بتكلفة 4 شحنات.\n\n_+3:_ يستطيع الكاهن إلقاء _الرمح المقدس_، وهي تعويذة مدمرة تلحق _60-110 ضررًا_ بتكلفة 4 شحنات.\n\nيلحق الرمح المقدس دائمًا أقصى ضرر بالأعداء الشياطين وغير الأحياء. ويمتلك الرمح المقدس فترة تهدئة قدرها 30 دورًا قبل إمكانية إلقائه مرة أخرى.

actors.hero.talent.hallowed_ground.title=الأرض المقدسة
actors.hero.talent.hallowed_ground.desc=_+1:_ يستطيع الكاهن إلقاء _الأرض المقدسة_، وهي تعويذة تقدس التضاريس في منطقة _3x3_ لمدة 20 دورًا، بتكلفة شحنتين.\n\n_+2:_ يستطيع الكاهن إلقاء _الأرض المقدسة_، وهي تعويذة تقدس التضاريس في منطقة _5x5_ لمدة 20 دورًا، بتكلفة شحنتين.\n\n_+3:_ يستطيع الكاهن إلقاء _الأرض المقدسة_، وهي تعويذة تقدس التضاريس في منطقة _7x7_ لمدة 20 دورًا، بتكلفة شحنتين.\n\nعند إلقائها، تشفي الأرض المقدسة الحلفاء بمقدار 15 نقطة صحة، وتجذر الأعداء لفترة قصيرة، وتنشر العشب القصير. وبعد ذلك تشفي الحلفاء ببطء، وتعيق الأعداء، وتتسبب في نمو العشب الطويل عشوائيًا. تمنح الأرض المقدسة الكاهن حماية بدلًا من العلاج، وتُدمّر بالنار.

actors.hero.talent.mnemonic_prayer.title=صلاة التذكّر
actors.hero.talent.mnemonic_prayer.desc=_+1:_ يستطيع الكاهن إلقاء _صلاة التذكّر_، وهي تعويذة تمدد تأثيرات التعزيزات/الآثار السلبية على حليف/عدو لمدة _3 أدوار_ بتكلفة شحنة واحدة.\n\n_+2:_ يستطيع الكاهن إلقاء _صلاة التذكّر_، وهي تعويذة تمدد تأثيرات التعزيزات/الآثار السلبية على حليف/عدو لمدة _4 أدوار_ بتكلفة شحنة واحدة.\n\n_+3:_ يستطيع الكاهن إلقاء _صلاة التذكّر_، وهي تعويذة تمدد تأثيرات التعزيزات/الآثار السلبية على حليف/عدو لمدة _5 أدوار_ بتكلفة شحنة واحدة.\n\nلا تستغرق صلاة التذكّر وقتًا لإلقائها. ولا يمكنها تمديد النسخة نفسها من التعزيز/الأثر السلبي أكثر من مرة، كما لا يمكنها تمديد التعزيزات الناتجة عن قدرات الدروع.

actors.hero.talent.lay_on_hands.title=وضع اليدين
actors.hero.talent.lay_on_hands.desc=_+1:_ يستطيع البالادين إلقاء _وضع اليدين_، وهي تعويذة تشفي فورًا شخصية قريبة بمقدار _15 نقطة صحة_، أو تمنح البالادين _15 حماية_، بتكلفة شحنة واحدة.\n\n_+2:_ يستطيع البالادين إلقاء _وضع اليدين_، وهي تعويذة تشفي فورًا شخصية قريبة بمقدار _20 نقطة صحة_، أو تمنح البالادين _20 حماية_، بتكلفة شحنة واحدة.\n\n_+3:_ يستطيع البالادين إلقاء _وضع اليدين_، وهي تعويذة تشفي فورًا شخصية قريبة بمقدار _25 نقطة صحة_، أو تمنح البالادين _25 حماية_، بتكلفة شحنة واحدة.\n\nيتم تحويل العلاج الزائد الناتج عن هذه التعويذة إلى حماية. ويمكن إلقاء وضع اليدين بشكل متكرر، لكنه لا يستطيع منح أكثر من قيمة 3 إلقاءات من الحماية في الوقت نفسه.

actors.hero.talent.aura_of_protection.title=هالة الحماية
actors.hero.talent.aura_of_protection.desc=_+1:_ يستطيع البالادين إلقاء _هالة الحماية_، وهي تعويذة تمنح البالادين وجميع الحلفاء ضمن بلاطتين _مقاومة للضرر بنسبة 20%%_ وتأثير نقش درع البالادين بقوة _+50%%_ لمدة 20 دورًا، بتكلفة شحنتين.\n\n_+2:_ يستطيع البالادين إلقاء _هالة الحماية_، وهي تعويذة تمنح البالادين وجميع الحلفاء ضمن بلاطتين _مقاومة للضرر بنسبة 30%%_ وتأثير نقش درع البالادين بقوة _+75%%_ لمدة 20 دورًا، بتكلفة شحنتين.\n\n_+3:_ يستطيع البالادين إلقاء _هالة الحماية_، وهي تعويذة تمنح البالادين وجميع الحلفاء ضمن بلاطتين _مقاومة للضرر بنسبة 40%%_ وتأثير نقش درع البالادين بقوة _+100%%_ لمدة 20 دورًا، بتكلفة شحنتين.

actors.hero.talent.wall_of_light.title=جدار الضوء
actors.hero.talent.wall_of_light.desc=_+1:_ يستطيع البالادين إلقاء _جدار الضوء_، وهي تعويذة تنشئ جدارًا صلبًا بعرض _3 بلاطات_ أمام البالادين، يدفع الأعداء للخلف ويستمر لمدة 20 دورًا، بتكلفة 3 شحنات.\n\n_+2:_ يستطيع البالادين إلقاء _جدار الضوء_، وهي تعويذة تنشئ جدارًا صلبًا بعرض _5 بلاطات_ أمام البالادين، يدفع الأعداء للخلف ويستمر لمدة 20 دورًا، بتكلفة 3 شحنات.\n\n_+3:_ يستطيع البالادين إلقاء _جدار الضوء_، وهي تعويذة تنشئ جدارًا صلبًا بعرض _7 بلاطات_ أمام البالادين، يدفع الأعداء للخلف ويستمر لمدة 20 دورًا، بتكلفة 3 شحنات.\n\nيمكن وضع الجدار في الاتجاهات الأساسية أو القطرية، ولا يمكن أن يوجد أكثر من جدار واحد في الوقت نفسه.

actors.hero.talent.divine_intervention.title=التدخل الإلهي
actors.hero.talent.divine_intervention.desc=_+1:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _التدخل الإلهي_، الذي يرفع حماية الكاهن وجميع الحلفاء إلى _150 حماية_ ويمدد الشكل المتصاعد بمقدار _3 أدوار_.\n\n_+2:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _التدخل الإلهي_، الذي يرفع حماية الكاهن وجميع الحلفاء إلى _200 حماية_ ويمدد الشكل المتصاعد بمقدار _4 أدوار_.\n\n_+3:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _التدخل الإلهي_، الذي يرفع حماية الكاهن وجميع الحلفاء إلى _250 حماية_ ويمدد الشكل المتصاعد بمقدار _5 أدوار_.\n\n_+4:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _التدخل الإلهي_، الذي يرفع حماية الكاهن وجميع الحلفاء إلى _300 حماية_ ويمدد الشكل المتصاعد بمقدار _6 أدوار_.\n\nيكلف التدخل الإلهي 5 شحنات ضخمة من الكتاب المقدس، ولا يمكن إلقاؤه سوى مرة واحدة في الشكل المتصاعد نفسه.

actors.hero.talent.judgement.title=الحُكم
actors.hero.talent.judgement.desc=_+1:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _الحُكم_، الذي يلحق _10-20 ضررًا_ بجميع الأعداء المرئيين.\n\n_+2:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _الحُكم_، الذي يلحق _15-30 ضررًا_ بجميع الأعداء المرئيين.\n\n_+3:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _الحُكم_، الذي يلحق _20-40 ضررًا_ بجميع الأعداء المرئيين.\n\n_+4:_ أثناء الشكل المتصاعد، يستطيع الكاهن إلقاء _الحُكم_، الذي يلحق _25-50 ضررًا_ بجميع الأعداء المرئيين.\n\nتكلف الحُكم 3 شحنات من الكتاب المقدس. ويلحق الحُكم +33%% من الضرر مقابل كل تعويذة ألقاها الكاهن منذ دخوله الشكل المتصاعد أو منذ آخر مرة ألقى فيها الحُكم.

actors.hero.talent.flash.title=الوميض
actors.hero.talent.flash.desc=_+1:_ أثناء الشكل المتصاعد، يستطيع الكاهن استخدام _الوميض_ للانتقال آنيًا لمسافة تصل إلى _3 بلاطات_.\n\n_+2:_ أثناء الشكل المتصاعد، يستطيع الكاهن استخدام _الوميض_ للانتقال آنيًا لمسافة تصل إلى _4 بلاطات_.\n\n_+3:_ أثناء الشكل المتصاعد، يستطيع الكاهن استخدام _الوميض_ للانتقال آنيًا لمسافة تصل إلى _5 بلاطات_.\n\n_+4:_ أثناء الشكل المتصاعد، يستطيع الكاهن استخدام _الوميض_ للانتقال آنيًا لمسافة تصل إلى _6 بلاطات_.\n\nيكلف الوميض شحنتين من الكتاب المقدس في البداية، ثم شحنة إضافية واحدة لكل استخدام في الشكل المتصاعد نفسه.

actors.hero.talent.body_form.title=شكل الجسد
actors.hero.talent.body_form.desc=يستطيع الكاهن إلقاء _شكل الجسد_، الذي يشحن التثليث بقوة تعويذة أو نقش تعرّف عليه الكاهن خلال هذه الجولة، بتكلفة شحنتين.\n\n_+1:_ عند استخدام التثليث، يحصل الكاهن على التأثير المختار لمدة _20 دورًا_.\n\n_+2:_ عند استخدام التثليث، يحصل الكاهن على التأثير المختار لمدة _27 دورًا_.\n\n_+3:_ عند استخدام التثليث، يحصل الكاهن على التأثير المختار لمدة _33 دورًا_.\n\n_+4:_ عند استخدام التثليث، يحصل الكاهن على التأثير المختار لمدة _40 دورًا_.\n\nلا يمكن شحن التثليث بأكثر من تأثير جسدي واحد في الوقت نفسه. وتكون تكلفة شحن درع التثليث أعلى إذا كان النقش المختار نادرًا وقويًا.

actors.hero.talent.mind_form.title=شكل العقل
actors.hero.talent.mind_form.desc=يستطيع الكاهن إلقاء _شكل العقل_، الذي يشحن التثليث بقوة عصا أو سلاح مرمي استخدمه الكاهن خلال هذه الجولة، بتكلفة 3 شحنات.\n\n_+1:_ عند استخدام التثليث، يستخدم الكاهن تأثير الإطلاق أو الرمي للعنصر المختار كما لو كان _+3_.\n\n_+2:_ عند استخدام التثليث، يستخدم الكاهن تأثير الإطلاق أو الرمي للعنصر المختار كما لو كان _+4_.\n\n_+3:_ عند استخدام التثليث، يستخدم الكاهن تأثير الإطلاق أو الرمي للعنصر المختار كما لو كان _+5_.\n\n_+4:_ عند استخدام التثليث، يستخدم الكاهن تأثير الإطلاق أو الرمي للعنصر المختار كما لو كان _+6_.\n\nلا يمكن شحن التثليث بأكثر من تأثير عقلي واحد في الوقت نفسه.

actors.hero.talent.spirit_form.title=شكل الروح
actors.hero.talent.spirit_form.desc=يستطيع الكاهن إلقاء _شكل الروح_، الذي يشحن التثليث بقوة خاتم أو قطعة أثرية تعرّف عليها الكاهن خلال هذه الجولة (باستثناء الكتاب المقدس)، بتكلفة 4 شحنات.\n\n_+1:_ عند استخدام التثليث، يحصل الكاهن على تأثير الخاتم عند _+1_ لمدة 20 دورًا، أو يفعّل تأثير القطعة الأثرية عند _+4_.\n\n_+2:_ عند استخدام التثليث، يحصل الكاهن على تأثير الخاتم عند _+2_ لمدة 20 دورًا، أو يفعّل تأثير القطعة الأثرية عند _+6_.\n\n_+3:_ عند استخدام التثليث، يحصل الكاهن على تأثير الخاتم عند _+3_ لمدة 20 دورًا، أو يفعّل تأثير القطعة الأثرية عند _+8_.\n\n_+4:_ عند استخدام التثليث، يحصل الكاهن على تأثير الخاتم عند _+4_ لمدة 20 دورًا، أو يفعّل تأثير القطعة الأثرية عند _+10_.\n\nلا يمكن شحن التثليث بأكثر من تأثير روحي واحد في الوقت نفسه. وتختلف تأثيرات القطع الأثرية وتكاليف شحن الدروع عند تفعيلها بواسطة التثليث.

actors.hero.talent.beaming_ray.title=شعاع ناقل
actors.hero.talent.beaming_ray.desc=يستطيع الكاهن إلقاء _الشعاع الناقل_ من حليف معزز بتكلفة شحنة واحدة. يستطيع هذا الشعاع المرور عبر الجدران وينقل الحليف آنيًا إلى موقع مستهدف. إذا كان هناك عدو في ذلك الموقع، يظهر الحليف بجوار العدو وسيستهدفه. ويمكن للشعاع الناقل حتى نقل الحلفاء غير القادرين على الحركة، لكن مداه ينخفض إلى النصف عند فعل ذلك.\n\n_+1:_ يمتلك الشعاع الناقل مدى أقصى قدره _4 بلاطات_، ويزيد مكافأة قوة الجمع إلى _+35%% ضرر_ ضد أقرب عدو لمدة 10 أدوار.\n\n_+2:_ يمتلك الشعاع الناقل مدى أقصى قدره _8 بلاطات_، ويزيد مكافأة قوة الجمع إلى _+40%% ضرر_ ضد أقرب عدو لمدة 10 أدوار.\n\n_+3:_ يمتلك الشعاع الناقل مدى أقصى قدره _12 بلاطة_، ويزيد مكافأة قوة الجمع إلى _+45%% ضرر_ ضد أقرب عدو لمدة 10 أدوار.\n\n_+4:_ يمتلك الشعاع الناقل مدى أقصى قدره _16 بلاطة_، ويزيد مكافأة قوة الجمع إلى _+50%% ضرر_ ضد أقرب عدو لمدة 10 أدوار.

actors.hero.talent.life_link.title=رابط الحياة
actors.hero.talent.life_link.desc=يستطيع الكاهن إلقاء _رابط الحياة_ بينه وبين حليف معزز بتكلفة شحنتين. تجعل هذه التعويذة الضرر موزعًا بين الكاهن وحليفه، وتجعل تعاويذ الكاهن المفيدة من المستوى 3 أو أقل تطبق على كليهما إذا كان أي منهما سيتأثر بها.\n\n_+1:_ يستمر رابط الحياة لمدة _10 أدوار_ ويزيد مكافأة قوة الجمع إلى _-35%% ضرر متلقًى_.\n\n_+2:_ يستمر رابط الحياة لمدة _13 دورًا_ ويزيد مكافأة قوة الجمع إلى _-40%% ضرر متلقًى_.\n\n_+3:_ يستمر رابط الحياة لمدة _17 دورًا_ ويزيد مكافأة قوة الجمع إلى _-45%% ضرر متلقًى_.\n\n_+4:_ يستمر رابط الحياة لمدة _20 دورًا_ ويزيد مكافأة قوة الجمع إلى _-50%% ضرر متلقًى_.

actors.hero.talent.stasis.title=السكون
actors.hero.talent.stasis.desc=يستطيع الكاهن إلقاء _السكون_ على حليف معزز بتكلفة شحنتين. يزيل السكون الحليف مؤقتًا من الزنزانة ويحافظ على المدة المتبقية لجميع التعزيزات، بما فيها قوة الجمع. سيظهر الحليف بجوارك عند انتهاء التأثير. ويمكن إعادة إلقاء السكون فورًا ودون تكلفة لإنهاء التأثير مبكرًا. يعمل السكون على الحلفاء غير القادرين على الحركة، لكنه لا يستطيع نقلهم بين طوابق الزنزانة.\n\n_+1:_ يستمر السكون لمدة أقصاها _60 دورًا_.\n\n_+2:_ يستمر السكون لمدة أقصاها _90 دورًا_.\n\n_+3:_ يستمر السكون لمدة أقصاها _120 دورًا_.\n\n_+4:_ يستمر السكون لمدة أقصاها _150 دورًا_.\n\nيستطيع الكاهن أيضًا إلقاء الشعاع الناقل عندما يكون حليف في حالة سكون لاستدعائه مجددًا، أو إلقاء رابط الحياة لتطبيق تأثيره مسبقًا. لكن الحلفاء لا يستفيدون من رابط الحياة أثناء وجودهم في حالة السكون.

#عام
actors.hero.talent.heroic_energy.title=طاقة بطولية
actors.hero.talent.heroic_energy.rat_title=طاقة فِئر بطولية
actors.hero.talent.heroic_energy.desc=_+1:_ تصبح تكلفة قدرة درع البطل _أقل بنسبة 12%%_.\n\n_+2:_ تصبح تكلفة قدرة درع البطل _أقل بنسبة 23%%_.\n\n_+3:_ تصبح تكلفة قدرة درع البطل _أقل بنسبة 32%%_.\n\n_+4:_ تصبح تكلفة قدرة درع البطل _أقل بنسبة 40%%_.

actors.hero.talent.ratsistance.title=مقاومة الجرذان
actors.hero.talent.ratsistance.desc=_+1:_ تلحق الأعداء الذين حوّلهم التحويل الجرذي إلى جرذان عدائية _ضررًا أقل بنسبة 10%%_.\n\n_+2:_ تلحق الأعداء الذين حوّلهم التحويل الجرذي إلى جرذان عدائية _ضررًا أقل بنسبة 19%%_.\n\n_+3:_ تلحق الأعداء الذين حوّلهم التحويل الجرذي إلى جرذان عدائية _ضررًا أقل بنسبة 27%%_.\n\n_+4:_ تلحق الأعداء الذين حوّلهم التحويل الجرذي إلى جرذان عدائية _ضررًا أقل بنسبة 35%%_.

actors.hero.talent.ratlomacy.title=دبلوماسية الجرذان
actors.hero.talent.ratlomacy.desc=_+1:_ استخدام التحويل الجرذي على عدو تم تحويله جرذيًا يجعله ودودًا ويجعل التحول دائمًا.\n\n_+2:_ استخدام التحويل الجرذي على عدو تم تحويله جرذيًا يجعله ودودًا، ويجعل التحول دائمًا، ويمنحه _دورين_ من الأدرينالين.\n\n_+3:_ استخدام التحويل الجرذي على عدو تم تحويله جرذيًا يجعله ودودًا، ويجعل التحول دائمًا، ويمنحه _4 أدوار_ من الأدرينالين.\n\n_+4:_ استخدام التحويل الجرذي على عدو تم تحويله جرذيًا يجعله ودودًا، ويجعل التحول دائمًا، ويمنحه _6 أدوار_ من الأدرينالين.

actors.hero.talent.ratforcements.title=تعزيزات جرذية
actors.hero.talent.ratforcements.desc=_+1:_ استخدام التحويل الجرذي على نفسك _يستدعي جرذًا جرابيًا حليفًا واحدًا_ بجوارك.\n\n_+2:_ استخدام التحويل الجرذي على نفسك _يستدعي جرذين جرابيين حليفين_ بجوارك.\n\n_+3:_ استخدام التحويل الجرذي على نفسك _يستدعي 3 جرذان جرابية حليفة_ بجوارك.\n\n_+4:_ استخدام التحويل الجرذي على نفسك _يستدعي 4 جرذان جرابية حليفة_ بجوارك.

### الشخصيات غير القابلة للعب

actors.mobs.npcs.blacksmith.name=حداد الترول
actors.mobs.npcs.blacksmith.intro_quest_warrior=مرحبًا أيها البشري! تبدو قويًا.
actors.mobs.npcs.blacksmith.intro_quest_mage=مرحبًا أيها البشري! تبدو ذكيًا.
actors.mobs.npcs.blacksmith.intro_quest_rogue=مرحبًا أيها البشري! تبدو متخفيًا بارعًا.
actors.mobs.npcs.blacksmith.intro_quest_huntress=مرحبًا أيتها البشرية! تبدين سريعة.
actors.mobs.npcs.blacksmith.intro_quest_duelist=مرحبًا أيتها البشرية! تبدين شجاعة.
actors.mobs.npcs.blacksmith.intro_quest_cleric=مرحبًا أيتها البشرية! تبدين شخصية مهمة.
actors.mobs.npcs.blacksmith.intro_quest_start=\n\nتريد أن تكون مفيدًا، هاه؟ أجل، لدي شيء يمكنك فعله. بنيت هذه الورشة فوق منجم قديم، وهو أسفل ذلك السلم مباشرة. خذ هذه المعول واستخرج لي بعض _خام الذهب الداكن. 40 قطعة_ ينبغي أن تكون كافية. الصخر في الأسفل لين وسهل، لذا _ستتمكن من الحفر عبر الجدران ببعض الجهد._\n\nماذا تقصد، كيف سأدفع لك؟ أيها الجشع...\n\nحسنًا، حسنًا، يمكنني أن أقوم ببعض الحدادة لك. اعتبر نفسك محظوظًا، فأنا الحداد الوحيد في المنطقة.
actors.mobs.npcs.blacksmith.intro_quest_crystal=لكن كن حذرًا، فالمنجم خطير على بشري صغير مثلك. لقد تُرك مهجورًا لبعض الوقت، وبدأت مجموعة من البلورات بالنمو. إنها لامعة، لكنها هشة جدًا بحيث لا تستحق شيئًا، كما أن هناك بعض الأشياء السحرية التي تحميها. إنها قوية جدًا، لذا _انتبه إلى المكان الذي تحفر فيه_ وإلا ستلفت انتباهها.\n\nوهناك أيضًا _بلورة عملاقة_ في مكان ما. إنها أصلب بكثير، لذا استعد للقتال إذا بدأت في تكسيرها. أراهن أن تحطيمها سيبطئ نمو جميع البلورات، لذلك سأدفع لك أكثر إن استطعت فعل ذلك.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=لكن كن حذرًا، فالمنجم خطير على بشري صغير مثلك. بعض الجنول يريدون الذهب أيضًا، وهم الآن يخربون المكان. إنهم حمقى، وقد تسبب تنقيبهم في جميع أنواع الانهيارات وانهيارات الكهوف. سيتعين عليك الحفر عبرها، لذا _ابحث عن الصخور التي تم تحريكها مؤخرًا._\n\nأعتقد أن أحد الجنول يتسبب في معظم المشاكل، ربما _شامان ممارس سحر الأرض_ أو شيء من هذا القبيل. سأدفع لك أكثر إذا تمكنت من العثور عليه وقتله، لكنني متأكد أنه سيقاوم.
actors.mobs.npcs.blacksmith.intro_quest_fungi=لكن كن حذرًا، فالمنجم خطير على بشري صغير مثلك. هناك نوع من وحش الفطريات ينمو في الأسفل. لديه حراس فطريون خطيرون جدًا إذا رأوك، لكنهم على الأقل لا يستطيعون الصعود ومطاردتك. _ابقَ بعيدًا عن الأنظار_ إذا كنت تريد البقاء حيًا.\n\nسأدفع لك أكثر إذا تمكنت من القضاء على _أكبر فطر_، لكنه سيتطلب جهدًا حقيقيًا. إنه متصل بمجموعة من عقد الفطريات المخفية داخل الجدران. سيتعين عليك تدمير معظمها قبل أن تتمكن من إلحاق ضرر حقيقي به.
actors.mobs.npcs.blacksmith.reminder=هل انتهيت من إضاعة وقتي؟ مدخل المنجم هناك.
actors.mobs.npcs.blacksmith.reminder_crystal=أحضر لي أكبر قدر ممكن من الذهب، وحاول تحطيم البلورة الكبيرة أيضًا.
actors.mobs.npcs.blacksmith.reminder_gnoll=أحضر لي أكبر قدر ممكن من الذهب، وحاول قتل ممارس سحر الأرض من الجنول أيضًا.
actors.mobs.npcs.blacksmith.reminder_fungi=أحضر لي أكبر قدر ممكن من الذهب، وحاول قتل الفطر العملاق أيضًا.
actors.mobs.npcs.blacksmith.lost_pick=هل تمزح معي؟ أين معولي؟!
actors.mobs.npcs.blacksmith.quest_start_prompt=هل أنت مستعد للنزول؟ تأكد من أن لديك مساحة فارغة للذهب.\n\n_لن أسمح لك بالنزول إلى هناك إلا مرة واحدة!_
actors.mobs.npcs.blacksmith.enter_yes=أنا مستعد
actors.mobs.npcs.blacksmith.enter_no=ليس بعد
actors.mobs.npcs.blacksmith.exit_warn_none=انتهيت بالفعل؟ ليس لديك تقريبًا أي ذهب! يجب أن تتمكن من جمع _40 قطعة._\n\n_تذكر، لن أسمح لك بالدخول مجددًا بمجرد صعودك._
actors.mobs.npcs.blacksmith.exit_warn_low=انتهيت بالفعل؟ لا يبدو أن لديك الكثير من الذهب. يجب أن تتمكن من جمع _40 قطعة._\n\n_تذكر، لن أسمح لك بالدخول مجددًا بمجرد صعودك._
actors.mobs.npcs.blacksmith.exit_warn_med=انتهيت؟ لديك بعض الذهب على الأقل، لكن من المؤكد أن هناك المزيد في المنجم. يجب أن تتمكن من جمع _40 قطعة._\n\n_تذكر، لن أسمح لك بالدخول مجددًا بمجرد صعودك._
actors.mobs.npcs.blacksmith.exit_warn_high=انتهيت؟ يبدو أن لديك كمية جيدة من الذهب، لكن يمكنني الاستفادة من المزيد. يجب أن تتمكن من جمع _40 قطعة._\n\n_تذكر، لن أسمح لك بالدخول مجددًا بمجرد صعودك._
actors.mobs.npcs.blacksmith.exit_warn_full=انتهيت؟ لديك الكثير من الذهب، لكن تأكد من أنك لم تترك أيًا من معداتك خلفك.\n\n_تذكر، لن أسمح لك بالدخول مجددًا بمجرد صعودك._
actors.mobs.npcs.blacksmith.exit_warn_crystal=تلك البلورة العملاقة لا تزال في الأسفل أيضًا. سأدفع أكثر إذا دمرتها.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=ممارس سحر الأرض من الجنول لا يزال في الأسفل أيضًا. سأدفع أكثر إذا قتلته.
actors.mobs.npcs.blacksmith.exit_warn_fungi=ذلك الفطر العملاق لا يزال في الأسفل أيضًا. سأدفع أكثر إذا قتلته.
