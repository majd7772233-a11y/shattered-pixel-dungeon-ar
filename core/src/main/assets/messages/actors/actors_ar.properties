actors.blobs.sacrificialfire.name=نار القرابين
actors.blobs.sacrificialfire.desc=يوجد هنا مذبح تعلوه نار قرابين مشتعلة. أي مخلوق يُقتل هنا سيُستهلك كقربان لأرواح الزنزانة.\n\nربما تُمنح مكافأة إذا تم تقديم عدد كافٍ من القرابين؟
actors.blobs.sacrificialfire.worthy=تلتهم النار قربانك وتزداد قوة.
actors.blobs.sacrificialfire.unworthy=تلتهم النار قربانك، لكنها لا تتغير.
actors.blobs.sacrificialfire.reward=تشتعل النار بقوة ثم تتلاشى، تاركةً وراءها مكافأة!

actors.blobs.smokescreen.name=ستار دخاني
actors.blobs.smokescreen.desc=تدور سحابة كثيفة من الدخان الأسود هنا.

actors.blobs.stenchgas.name=غاز الرائحة الكريهة
actors.blobs.stenchgas.desc=تدور سحابة من الرائحة الكريهة النتنة هنا.

actors.blobs.stormcloud.name=سحب العاصفة
actors.blobs.stormcloud.desc=تدور سحابة من بخار الماء المتصاعد هنا.

actors.blobs.toxicgas.name=غاز سام
actors.blobs.toxicgas.desc=تدور سحابة خضراء من الغاز السام هنا.
actors.blobs.toxicgas.rankings_desc=اختنق
actors.blobs.toxicgas.ondeath=مت بسبب الغاز السام...

actors.blobs.corrosivegas.name=غاز آكل
actors.blobs.corrosivegas.desc=تدور سحابة من الغاز الكاوي المميت هنا.

actors.blobs.waterofawareness.name=ماء الوعي
actors.blobs.waterofawareness.procced=بمجرد أن ترتشف، تشعر بالمعرفة وهي تتدفق إلى ذهنك.
actors.blobs.waterofawareness.desc=تشع قوة المعرفة من ماء هذا البئر. سيؤدي الشرب من البئر إلى التعرف بالكامل على جميع العناصر المجهزة، وكشف اللعنات الموجودة على جميع العناصر في مخزونك، وإظهار جميع العناصر الموجودة في الطابق الحالي.

actors.blobs.waterofhealth.name=ماء الصحة
actors.blobs.waterofhealth.procced=بمجرد أن ترتشف، تشعر بجروحك وهي تلتئم بالكامل.
actors.blobs.waterofhealth.desc=تشع قوة الصحة من ماء هذا البئر. سيؤدي الشرب من هذا البئر إلى شفاء جروحك، وإشباع جوعك، وتطهير اللعنات عن أي عناصر ترتديها.

actors.blobs.web.name=شبكة عنكبوت
actors.blobs.web.desc=تغطي شبكة كثيفة كل شيء هنا. أي شيء يلمس الشبكة أو يُرمى عبرها سيمزقها، لكنه سيعلق في مكانه أيضًا.



### التأثيرات
actors.buffs.adrenaline.name=الأدرينالين
actors.buffs.adrenaline.desc=دفعة من القوة الجسدية تعزز سرعة الهجوم والحركة.\n\nيسمح الأدرينالين لهدفه بالتحرك بسرعة مضاعفة، والهجوم بسرعة تعادل 1.5 ضعف السرعة العادية.\n\nالأدوار المتبقية: %s.

actors.buffs.adrenalinesurge.name=تعزيز القوة
actors.buffs.adrenalinesurge.desc=دفعة من البأس الهائل، لكنها للأسف ليست دائمة.\n\nتعزيز القوة: +%d.\nالأدوار حتى يضعف التعزيز: %s.

actors.buffs.amok.name=هياج
actors.buffs.amok.desc=يتسبب الهياج في حالة من الغضب والارتباك الشديد لدى هدفه.\n\nعندما يصاب مخلوق بالهياج، سيهاجم أي شيء قريب منه، سواء كان صديقًا أم عدوًا.\n\nالأدوار المتبقية من الهياج: %s.

actors.buffs.arcanearmor.name=درع غامض
actors.buffs.arcanearmor.desc=يحيط بك درع رقيق، ويمنع بعض الضرر الناتج عن الهجمات السحرية.\n\nتعزيز درعك السحري حاليًا: 0-%d.\n\nالأدوار حتى يضعف الدرع الغامض: %s.

actors.buffs.artifactrecharge.name=إعادة شحن القطع الأثرية
actors.buffs.artifactrecharge.desc=تتدفق الطاقة عبر جسدك، مما يزيد سرعة شحن القطع الأثرية المجهزة.\n\nيتأثر كل أثر بطريقة مختلفة قليلًا، لكنها جميعًا ستكتسب الشحن أسرع بكثير من المعتاد.\n\nالأدوار المتبقية: %s.

actors.buffs.ascensionchallenge.name=لعنة التميمة
actors.buffs.ascensionchallenge.desc=بطريقة ما، يحافظ يوغ-دزيفا على تأثيره في هذا العالم من خلال التميمة، ويحاول منع صعودك!\n\nتجعل قوة يوغ الزنزانة أكثر خطورة بكثير، إذ تزيد عدد الأعداء وتجعلهم أقوى! وستستمر هذه القوة في التراكم إذا تُركت دون مقاومة، ويمكن إضعافها بهزيمة الأعداء الذين عززتهم قوة يوغ.
actors.buffs.ascensionchallenge.desc_clear=تم إضعاف الطاقة المظلمة المنبعثة من التميمة إلى أقصى حد ممكن في الوقت الحالي.
actors.buffs.ascensionchallenge.desc_beckon=التميمة _تنادي حاليًا الأعداء البعيدين،_ وتنبههم إلى موقعك.
actors.buffs.ascensionchallenge.desc_haste=التميمة _تسرّع حاليًا الأعداء البعيدين،_ مما يسمح لهم بالوصول إليك بشكل أسرع!
actors.buffs.ascensionchallenge.desc_slow=التميمة _تبطئ حركتك حاليًا،_ وتبطل تأثيرات تعزيز السرعة!
actors.buffs.ascensionchallenge.desc_damage=أصبحت الطاقة القادمة من التميمة قوية جدًا لدرجة أنها _تلحق بك الضرر مباشرةً!_
actors.buffs.ascensionchallenge.beckon=تبدأ التميمة في مناداة الأعداء البعيدين.
actors.buffs.ascensionchallenge.haste=تبدأ التميمة في تسريع الأعداء البعيدين!
actors.buffs.ascensionchallenge.slow=تبدأ التميمة بالشعور وكأنها وزن من الرصاص في مخزونك!
actors.buffs.ascensionchallenge.damage=تبدأ التميمة في إشعاع طاقة مظلمة. إنها تحرق!
actors.buffs.ascensionchallenge.weaken_info=يمكن إضعاف لعنة التميمة بهزيمة المزيد من الأعداء.
actors.buffs.ascensionchallenge.weaken_info_no_kills=ستضعف لعنة التميمة إذا هزمت الأعداء!
actors.buffs.ascensionchallenge.weaken=يمكنك الشعور بلعنة التميمة وهي تضعف قليلًا.
actors.buffs.ascensionchallenge.break=تأخذ لحظة لالتقاط أنفاسك وتشعر بجروحك وهي تبدأ بالالتئام!
actors.buffs.ascensionchallenge.almost=تشعر بأن قبضة يوغ على التميمة بدأت تضعف، لقد أوشكت على الوصول!
actors.buffs.ascensionchallenge.on_kill=تلتهمك الطاقة المظلمة...

actors.buffs.barkskin.name=جلد اللحاء
actors.buffs.barkskin.desc=أصبح جلدك أكثر صلابة، وتشعر بخشونته وصلابته مثل اللحاء.\n\nيزيد الجلد المتصلب درعك الفعلي، مما يسمح لك بالدفاع بشكل أفضل ضد الهجمات الجسدية.\n\nيزداد درعك حاليًا بمقدار: 0-%d.\nالأدوار حتى يضعف جلد اللحاء: %s.\n\nإذا حصلت على جلد اللحاء من عدة مصادر، فسيُطبق أقواها فقط.

actors.buffs.barrier.name=حاجز
actors.buffs.barrier.desc=فقاعة متينة من القوة تمنع جميع أنواع الضرر.\n\nسيتلقى الحاجز الضرر بدلًا عن الشيء الذي يحميه طالما بقيت هناك حماية. كما ستتآكل الحماية ببطء بمرور الوقت.\n\nالحماية المتبقية: %d.

actors.buffs.berserk.angered=غاضب
actors.buffs.berserk.berserk=هائج
actors.buffs.berserk.exhausted=منهك
actors.buffs.berserk.recovering=يتعافى
actors.buffs.berserk.angered_desc=تزيد شدة إصابات الهائج من قوة ضرباته. وكلما تلقى الهائج ضررًا جسديًا، ازداد غضبه، مما يمنحه ضررًا إضافيًا. ويُحتسب الضرر الذي يحجبه الدرع ضمن بناء الغضب أيضًا.\n\nيتلاشى الغضب بمرور الوقت. وكلما انخفضت صحة الهائج، استمر الغضب لفترة أطول.\n\nعند وصول الغضب إلى 100%%، يمكن للهائج الدخول في حالة الهياج، مما يمنحه حماية تعتمد على مستوى درعه وصحته المفقودة. وأثناء الهياج، تتآكل حمايته بمرور الوقت، وعندما تنفد، سيحتاج إلى الراحة قبل أن يتمكن من بناء الغضب مجددًا.\n\nالغضب الحالي: _%1$.0f%%_\n_+%2$.0f%%_ من الضرر\n\nدرع الهياج عند مستوى الدرع والصحة الحاليين: _%3$d_
actors.buffs.berserk.berserk_desc=يتلاشى الخوف وعدم اليقين، ولا يبقى سوى الغضب. في هذه الحالة، يصبح الهائج قويًا للغاية، _ويلحق +50%% من الضرر ويحصل على حماية إضافية،_ لكنه يفقد جزءًا من حمايته كل دور.\n\nعندما تنخفض حمايته بالكامل إلى 0، ينتهي الهياج.\n\nبعد نوبة الغضب، سيحتاج الهائج إلى التعافي قبل أن يتمكن من بناء الغضب مجددًا.\n\nالحماية المتبقية: %d
actors.buffs.berserk.recovering_desc=للقوة الداخلية حدود. يجب على الهائج أن يرتاح قبل استخدام غضبه مجددًا.\n\nأثناء التعافي، لا يبني الهائج أي غضب من تلقي الضرر.
actors.buffs.berserk.recovering_desc_turns=الأدوار حتى التعافي: _%d_
actors.buffs.berserk.recovering_desc_levels=المستويات حتى التعافي: _%.2f_
actors.buffs.berserk.rankings_desc=هلك بسبب الهياج
actors.buffs.berserk.action_name=هياج
actors.buffs.berserk.no_seal=تحتاج إلى ختمك المكسور للدخول في حالة الهياج!

actors.buffs.bleeding.name=نزيف
actors.buffs.bleeding.ondeath=نزفت حتى الموت...
actors.buffs.bleeding.heromsg=أنت تنزف!
actors.buffs.bleeding.rankings_desc=نزف حتى الموت
actors.buffs.bleeding.desc=ذلك الجرح يفقد كمية مقلقة من الدم.\n\nيسبب النزيف ضررًا كل دور. وينخفض الضرر كل دور بمقدار عشوائي حتى يتوقف النزيف في النهاية.\n\nضرر النزيف الحالي: %d.

actors.buffs.bless.name=مبارك
actors.buffs.bless.desc=دفعة هائلة من التركيز، ويقول البعض إنها مستوحاة من الآلهة.\n\nتزيد البركة الدقة والتهرب بنسبة 25%%، مما يجعل المبارك أكثر فعالية بكثير في القتال.\n\nالأدوار المتبقية من البركة: %s.

actors.buffs.blindness.name=أعمى
actors.buffs.blindness.heromsg=أنت أعمى!
actors.buffs.blindness.desc=يحوّل العمى العالم المحيط إلى ضباب مظلم.\n\nأثناء العمى، ينخفض مدى رؤية الشخصية إلى بلاطة واحدة، مما يجعل الهجمات بعيدة المدى عديمة الفائدة ويجعل من السهل جدًا فقدان أثر الأعداء البعيدين. بالإضافة إلى ذلك، لا يستطيع البطل الأعمى قراءة اللفائف أو الكتب.\n\nالأدوار المتبقية من العمى: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=احتراق
actors.buffs.burning.heromsg=اشتعلت النيران بك!
actors.buffs.burning.burnsup=%s يحترق!
actors.buffs.burning.ondeath=احترقت حتى الموت...
actors.buffs.burning.rankings_desc=احترق حتى تحول إلى رماد
actors.buffs.burning.desc=قلة من الأشياء أكثر إزعاجًا من أن تلتهمك النيران.\n\nيلحق الحريق ضررًا كل دور حتى يُطفأ بالماء أو ينتهي تأثيره. ويمكن إطفاء النار بدخول الماء أو من خلال تناثر جرعة محطمة.\n\nكما يمكن للنار إشعال التضاريس أو العناصر القابلة للاشتعال التي تلامسها.\n\nالأدوار المتبقية من الاحتراق: %s.

actors.buffs.championenemy.warn=تشعر بوجود قاتل.
actors.buffs.championenemy$blazing.name=بطل ملتهب
actors.buffs.championenemy$blazing.desc=يلحق الأبطال الملتهبون ضررًا قريبًا أكبر بنسبة 25%%، ويشعلون الأعداء الذين يهاجمونهم، وهم محصنون ضد النار، وينشرون النار من حولهم عند موتهم. لكنهم لا يستطيعون نشر النار على الماء.
actors.buffs.championenemy$projecting.name=بطل ذو مدى
actors.buffs.championenemy$projecting.desc=يلحق الأبطال ذوو المدى ضررًا قريبًا أكبر بنسبة 25%% ويمتلكون +3 إلى مدى الهجوم.
actors.buffs.championenemy$antimagic.name=بطل مضاد للسحر
actors.buffs.championenemy$antimagic.desc=يتلقى الأبطال المضادون للسحر ضررًا أقل بنسبة 50%% وهم محصنون تمامًا ضد التأثيرات السحرية.
actors.buffs.championenemy$giant.name=بطل عملاق
actors.buffs.championenemy$giant.desc=يتلقى الأبطال العمالقة ضررًا أقل بنسبة 80%% ويمتلكون +1 إلى مدى الهجوم، لكنهم لا يستطيعون التحرك عبر الأماكن الضيقة.
actors.buffs.championenemy$blessed.name=بطل مبارك
actors.buffs.championenemy$blessed.desc=يمتلك الأبطال المباركون 4 أضعاف الدقة والتهرب.
actors.buffs.championenemy$growing.name=بطل نامٍ
actors.buffs.championenemy$growing.desc=يحصل الأبطال النامون على تعزيز متزايد باستمرار للدقة والتهرب والضرر الجسدي، بالإضافة إلى تقليل الضرر الذي يتلقونه.\n\nتعزيز الدقة/التهرب/الضرر الحالي: %1$d%%\nتقليل الضرر الحالي: %2$d%%

actors.buffs.charm.name=مسحور
actors.buffs.charm.heromsg=أنت مسحور!
actors.buffs.charm.cant_attack=أنت مسحور بواسطة ذلك العدو ولا يمكنك مهاجمته.
actors.buffs.charm.desc=السحر هو سحر تلاعبي يمكنه جعل الأعداء يتوددون إلى بعضهم مؤقتًا.\n\nلا تستطيع الشخصيات المتأثرة بالسحر مهاجمة العدو الذي سحرها مباشرة. لكن لا يزال بإمكانها مهاجمة الأهداف الأخرى. ويؤدي ألم الضرر إلى تقليل مدة السحر.\n\nالأدوار المتبقية من السحر: %s.

actors.buffs.chill.name=مبرد
actors.buffs.chill.freezes=%s يتجمد!
actors.buffs.chill.desc=ليس تجمدًا كاملًا، لكنه لا يزال باردًا جدًا.\n\nتنفذ الأهداف المبردة جميع أفعالها ببطء أكبر، اعتمادًا على عدد الأدوار المتبقية من التأثير. وفي أسوأ حالاته، يكون هذا التأثير مكافئًا للتباطؤ.\n\nالأدوار المتبقية من التبريد: %1$s.\nتنخفض السرعة بمقدار: %2$s%%

actors.buffs.combo.name=سلسلة ضربات
actors.buffs.combo.action_name=هجوم متتابع
actors.buffs.combo.combo=%d ضربة متتابعة!
actors.buffs.combo.bad_target=يجب أن تستهدف عدوًا ضمن مدى الهجوم.
actors.buffs.combo.prompt=اختر هدفًا للهجوم.
actors.buffs.combo.desc=يبني المصارع زخمه عندما يوجه ضربات ناجحة. تزيد كل ضربة عداد السلسلة بمقدار واحد، لكن الانتظار طويلًا بين الضربات يعيد العداد إلى 0. وطالما يمتلك المصارع سلسلة ضربات، فلن تبدأ الحماية التي يحصل عليها من ختمه المكسور في التلاشي.\n\nيؤدي بناء السلسلة إلى فتح هجمات متتابعة خاصة لا يمكن أن تخطئ! يتم فتح هجوم مختلف عند عداد 2 و4 و6 و8 و10. تعيد بعض الحركات ضبط السلسلة وبعضها لا يفعل ذلك، لكن لا يمكن استخدام كل حركة إلا مرة واحدة في كل سلسلة.\n\nالسلسلة الحالية: %1$d.\n\nالأدوار حتى فقدان السلسلة: %2$s.
actors.buffs.combo$combomove.clobber.name=ضربة ساحقة
actors.buffs.combo$combomove.clobber.desc=تدفع عدوًا إلى الخلف لمسافتين، لكنها لا تلحق ضررًا ولا تستطيع دفعه إلى الحفر. تزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.clobber.empower_desc=تدفع عدوًا إلى الخلف _3 بلاطات، وتصيبه بالدوار، ويمكنها دفعه إلى الحفر،_ لكنها لا تلحق ضررًا. تزيد السلسلة بمقدار 1.
actors.buffs.combo$combomove.slam.name=ضربة قاسية
actors.buffs.combo$combomove.slam.desc=تلحق %d%% (السلسلة × 20%%) من قوة حجب ضررك كضرر إضافي. تعيد ضبط السلسلة عند استخدامها.
actors.buffs.combo$combomove.slam.empower_desc=_تقفز لمسافة تصل إلى %1$d بلاطة/بلاطات_ وتلحق %2$d%% (السلسلة × 20%%) من قوة حجب ضررك كضرر إضافي. تعيد ضبط السلسلة عند استخدامها.
actors.buffs.combo$combomove.parry.name=صد
actors.buffs.combo$combomove.parry.desc=يصد الهجوم التالي خلال دور واحد عند تفعيله، ويرد عليه فورًا. يعيد ضبط السلسلة إذا لم يتم صد أي هجوم.
actors.buffs.combo$combomove.parry.empower_desc=يصد _جميع الهجمات_ خلال دور واحد عند تفعيله، ويرد عليها فورًا. يعيد ضبط السلسلة إذا لم يتم صد أي هجوم.
actors.buffs.combo$combomove.crush.name=سحق
actors.buffs.combo$combomove.crush.desc=يلحق %d%% (السلسلة × 25%%) من الضرر بالهدف الأساسي، ونصف ذلك الضرر بجميع الأعداء الآخرين في مساحة 7x7. تعيد ضبط السلسلة عند استخدامها.
actors.buffs.combo$combomove.crush.empower_desc=_تقفز لمسافة تصل إلى %1$d بلاطة/بلاطات_ وتلحق %2$d%% (السلسلة × 25%%) من الضرر بالهدف الأساسي، ونصف ذلك الضرر بجميع الأعداء الآخرين في مساحة 7x7. تعيد ضبط السلسلة عند استخدامها.
actors.buffs.combo$combomove.fury.name=الضراوة
actors.buffs.combo$combomove.fury.desc=يضرب عدوًا مرة واحدة لكل نقطة من سلسلة ضرباتك، وتلحق كل ضربة 60%% من الضرر ويمكنها تفعيل التعويذات. تعيد ضبط السلسلة عند استخدامها.
actors.buffs.combo$combomove.fury.empower_desc=_تقفز لمسافة تصل إلى %d بلاطة/بلاطات_ وتضرب عدوًا مرة واحدة لكل نقطة من سلسلة ضرباتك، وتلحق كل ضربة 60%% من الضرر ويمكنها تفعيل التعويذات. تعيد ضبط السلسلة عند استخدامها.

actors.buffs.corruption.name=مُفسَد
actors.buffs.corruption.desc=يتسلل الإفساد إلى جوهر الكائن، فيحرّفه بعيدًا عن طبيعته الأصلية.\n\nتهاجم المخلوقات المفسدة حلفاءها وتتجاهل أعداءها السابقين. كما أن الإفساد يسبب ضررًا، وسيؤدي ببطء إلى استسلام هدفه.\n\nالإفساد دائم، ولا تنتهي آثاره إلا بالموت.

actors.buffs.cripple.name=مُعاق
actors.buffs.cripple.heromsg=أنت مُعاق!
actors.buffs.cripple.desc=أنت متأكد تقريبًا أن الساقين لا يُفترض أن تنحنيا بهذه الطريقة.\n\nيخفض الإعاقة سرعة الحركة إلى النصف، مما يجعل التحرك بلاطة واحدة يستغرق عادةً دورين بدلًا من دور واحد.\n\nالأدوار المتبقية من الإعاقة: %s.

actors.buffs.daze.name=مذهول
actors.buffs.daze.heromsg=أنت مذهول!
actors.buffs.daze.desc=طنين الأذنين وتشوش الرؤية يجعلان القتال صعبًا.\n\nأثناء الذهول، تنخفض الدقة والتهرب بنسبة 50%%، مما يجعل إصابة الضربات وتجنبها أصعب بكثير.\n\nالأدوار المتبقية من الذهول: %s.

actors.buffs.degrade.name=متدهور
actors.buffs.degrade.heromsg=تشعر أن معداتك أصبحت أضعف!
actors.buffs.degrade.desc=يمتص سحر مظلم قوي القوة التي منحتها لفائف الترقية لمعداتك!\n\nأثناء التدهور، ستُعامل المعدات المطوّرة كما لو كان مستواها أقل من مستواها الحقيقي. _كل ترقية بعد +3 تصبح أضعف أُسّيًا من الترقية السابقة._ وستتغير أوصاف عناصرك لتعكس انخفاض مستوى قوتها.\n\nلا يؤثر التدهور في متطلبات القوة أو شحنات العصي أو متانة الأسلحة المرمية أو القطع الأثرية.\n\nالأدوار المتبقية من التدهور: %s. سيؤدي استخدام لفافة ترقية أو إزالة لعنة إلى إنهاء التدهور فورًا.

actors.buffs.doom.name=محكوم عليه بالموت
actors.buffs.doom.desc=من الصعب الاستمرار عندما يبدو أن الكون بأكمله يريد موتك.\n\nتتلقى الشخصيات المحكوم عليها بالموت +67%% من الضرر من جميع المصادر.\n\nالموت المحتوم دائم، ولا تنتهي آثاره إلا بالموت.

actors.buffs.dread.name=هلع
actors.buffs.dread.desc=رعب شديد لدرجة أنه سيجعل هدفه يفر من الزنزانة بأكملها!\n\nستجري المخلوقات المتأثرة بالهلع بعيدًا عن خصمها بسرعة عالية، وستختفي تمامًا من الزنزانة بمجرد خروجها من مجال الرؤية. والأعداء الذين يُهزمون بهذه الطريقة يمنحون نصف الخبرة ولا يسقطون أي عناصر. ويؤدي ألم الضرر إلى تقليل مدة الهلع.\n\nالأدوار المتبقية من الهلع: %d.

actors.buffs.drowsy.name=نعسان
actors.buffs.drowsy.desc=تجعل قوة سحرية من الصعب عليك البقاء مستيقظًا، وبعد بضعة أدوار، سيسقط الهدف في نوم سحري عميق.\n\nيمكن للبطل مقاومة النعاس بتلقي الضرر أو عندما تكون صحته ممتلئة.\n\nالأدوار حتى النوم: %s.

actors.buffs.earthimbue.name=مشبع بقوة الأرض
actors.buffs.earthimbue.desc=لقد تشبعت بقوة الأرض!\n\nستؤدي جميع الهجمات الجسدية إلى تحريك الأرض تحت العدو، مما يصيبه بالإعاقة لفترة قصيرة.\n\nالأدوار المتبقية لتشبيع الأرض: %s.

actors.buffs.enhancedrings.name=خواتم معززة
actors.buffs.enhancedrings.desc=تعمل القطعة الأثرية التي استخدمها اللص مؤخرًا على تقوية خواتمه، مما يمنحها +1 مستوى.\n\nالأدوار المتبقية: %s.

actors.buffs.fireimbue.name=مشبع بقوة النار
actors.buffs.fireimbue.desc=لقد تشبعت بقوة النار!\n\nتمتلك جميع الهجمات الجسدية احتمالًا لإشعال الأعداء. بالإضافة إلى ذلك، أنت محصن تمامًا ضد تأثيرات النار.\n\nالأدوار المتبقية لتشبيع النار: %s.

actors.buffs.foresight.name=استبصار
actors.buffs.foresight.desc=يمكنك بطريقة ما رؤية تخطيط التضاريس المحيطة بعقلك.\n\nأثناء تأثير الاستبصار، ستنكشف لك جميع البلاطات ضمن نطاق واسع، بما في ذلك أي أفخاخ أو أبواب سرية.\n\nالأدوار المتبقية من الاستبصار: %s.

actors.buffs.frost.name=متجمد
actors.buffs.frost.freezes=%s يتجمد!
actors.buffs.frost.desc=لا تخلط بينه وبين التجمد الكامل، فهذا التجمد الأكثر اعتدالًا يحيط بالهدف بالجليد.\n\nيعمل التجمد بطريقة مشابهة للشلل، إذ يجعل من المستحيل على الهدف التصرف. وبخلاف الشلل، يُلغى التجمد فورًا إذا تلقى الهدف ضررًا، لأن الجليد سيتحطم.\n\nالأدوار المتبقية من التجمد: %s.

actors.buffs.frostimbue.name=مشبع بقوة الصقيع
actors.buffs.frostimbue.desc=لقد تشبعت بقوة جليدية!\n\nستراكم جميع الهجمات الجسدية تأثير البرد على الأعداء تدريجيًا. بالإضافة إلى ذلك، أنت محصن تمامًا ضد البرد.\n\nالأدوار المتبقية لتشبيع الصقيع: %s.

actors.buffs.fury.name=غاضب
actors.buffs.fury.heromsg=أصبحت غاضبًا!
actors.buffs.fury.desc=أنت غاضب، ولن يحبك الأعداء وأنت غاضب.\n\nيحترق داخلك غضب هائل، مما يزيد الضرر الذي تلحقه بالهجمات الجسدية بنسبة 50%%.\n\nسيستمر هذا الغضب ما دمت مصابًا وكانت صحتك أقل من 50%%.

actors.buffs.blobimmunity.name=حاجز التطهير
actors.buffs.blobimmunity.desc=تحيط بك قوة غريبة في حاجز واقٍ رقيق، يمنع جميع التأثيرات الضارة المحمولة في الهواء.\n\nأنت محصن ضد جميع التأثيرات المرتبطة بالمنطقة طالما استمر هذا الحاجز.\n\nالأدوار المتبقية من المناعة: %s.

actors.buffs.gravitychaostracker.name=فوضى الجاذبية
actors.buffs.gravitychaostracker.desc_intro=كل بضعة أدوار، ستُقذف جميع الشخصيات في طابق الزنزانة الحالي في اتجاه عشوائي.
actors.buffs.gravitychaostracker.desc_positive=لكن يبدو أنك وحلفاءك محصنون ضدها.
actors.buffs.gravitychaostracker.desc_duration=ليس واضحًا كم سيدوم هذا التأثير، لكنه لا يمكن أن يستمر إلى الأبد.

actors.buffs.greaterhaste.name=سرعة قصوى
actors.buffs.greaterhaste.desc=دفعة مذهلة من السرعة، وللحظة تشعر وكأن كل شيء آخر متوقف.\n\nأثناء تأثير السرعة القصوى، لا تستغرق حركاتك أي وقت إطلاقًا، لكن الأفعال الأخرى تُنفذ بالسرعة العادية. وتستهلك كل خطوة حركة دورًا من السرعة القصوى.\n\nالأدوار المتبقية من السرعة القصوى: %d.

actors.buffs.haste.name=سرعة
actors.buffs.haste.desc=تتدفق الطاقة عبر عضلاتك، مما يسمح لك بالركض بسرعات مذهلة!\n\nأثناء تأثير السرعة، ستتحرك بسرعة تعادل 3 أضعاف السرعة العادية، لكنك ستنفذ جميع الأفعال الأخرى بالسرعة العادية.\n\nالأدوار المتبقية من السرعة: %s.

actors.buffs.healing.name=شفاء
actors.buffs.healing.desc=علاج سحري يجعل الجروح تنغلق واللحم يلتئم.\n\nتتجدد الصحة تدريجيًا كل دور حتى ينتهي تأثير الشفاء. وقد يتلاشى مقدار الشفاء بمرور الوقت.\n\nالشفاء التالي: %d.\n\nالشفاء المتبقي: %d.

actors.buffs.herodisguise.name=تنكر
actors.buffs.herodisguise.desc=غيّر السحر الوهمي مظهرك الجسدي! التأثير تجميلي بحت، لكنه يبدو غريبًا جدًا على أي حال.\n\nالأدوار المتبقية من التنكر: %s.

actors.buffs.hex.name=ملعون بلعنة سحرية
actors.buffs.hex.heromsg=لقد أُصبت بلعنة سحرية!
actors.buffs.hex.desc=سحر مظلم يستنزف التركيز، مما يجعل الهدف مشوشًا قليلًا.\n\nتخفض اللعنة السحرية الدقة والتهرب بنسبة 20%%، مما يجعل الهدف أقل فعالية في القتال.\n\nالأدوار المتبقية من اللعنة السحرية: %s.

actors.buffs.holdfast.name=ثبات
actors.buffs.holdfast.desc=يثبت المحارب في مكانه، مما يزيد درعه بمقدار %1$d-%2$d ويبطئ معدل تلاشي بعض التأثيرات بنسبة %3$d%%. ويستمر هذا حتى يتحرك.

actors.buffs.hunger.hungry=جائع
actors.buffs.hunger.starving=يتضور جوعًا
actors.buffs.hunger.onhungry=أنت جائع.
actors.buffs.hunger.onstarving=أنت تتضور جوعًا!
actors.buffs.hunger.ondeath=مت جوعًا...
actors.buffs.hunger.cursedhorn=يسرق القرن الملعون بعض طاقة الطعام أثناء أكلك.
actors.buffs.hunger.rankings_desc=مات جوعًا
actors.buffs.hunger.desc_intro_hungry=يمكنك الشعور بمعدتك وهي تطالب بالطعام، لكنها ليست ملحّة جدًا بعد.
actors.buffs.hunger.desc_intro_starving=أنت جائع لدرجة أن الأمر يؤلمك.
actors.buffs.hunger.desc=\n\nيزداد الجوع ببطء كلما قضيت وقتًا في الزنزانة، وفي النهاية ستبدأ بالتضور جوعًا. أثناء الجوع الشديد ستفقد صحتك ببطء بدلًا من تجددها.\n\nترشيد الطعام مهم! إذا كانت لديك صحة كافية، فقد يكون التضور جوعًا فكرة جيدة إذا كان ذلك يعني توفر المزيد من الطعام لاحقًا. يمكن للترشيد الفعال أن يجعل الطعام يدوم لفترة أطول بكثير!

actors.buffs.invisibility.name=غير مرئي
actors.buffs.invisibility.desc=اندمجت تمامًا مع التضاريس المحيطة، مما يجعل رؤيتك مستحيلة.\n\nأثناء كونك غير مرئي، لن يتمكن الأعداء من مهاجمتك أو تتبعك. وستلغي الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) الاختفاء فورًا.\n\nالأدوار المتبقية من الاختفاء: %s.

actors.buffs.invulnerability.name=غير قابل للإصابة
actors.buffs.invulnerability.desc=تغمر هذه الشخصية قوة واقية هائلة، مما يمنحها فترة وجيزة من عدم القابلية للإصابة!\n\nالأدوار المتبقية: %s.

actors.buffs.levitation.name=محلّق
actors.buffs.levitation.desc=ترفعك قوة سحرية فوق الأرض، مما يجعلك تشعر بانعدام الوزن.\n\nتتحرك الشخصيات المحلقة بصمت وتتجاهل جميع التأثيرات المرتبطة بالأرض. لن تُفعّل الأفخاخ، ولن يطفئ الماء النار، ولن تُداس النباتات، وستفشل الجذور في الإمساك بك، وستحلق فوق الحفر. كن حذرًا، فكل هذه التأثيرات يمكن أن تعود فور انتهاء التحليق!\n\nالأدوار المتبقية من التحليق: %s.

actors.buffs.lifelink.name=رابطة الحياة
actors.buffs.lifelink.ondeath=قتلك الضرر المرتبط برابطة الحياة...
actors.buffs.lifelink.desc=قوة حياة هذه الشخصية مرتبطة بشخصية أخرى قريبة. ويتم تقاسم أي ضرر يتم تلقيه بينهما.\n\nكلما تلقت هذه الشخصية ضررًا، يُلحق نصفه بالهدف المرتبط برابطة الحياة بدلًا منها.\n\nالأدوار المتبقية من رابطة الحياة: %s.

actors.buffs.light.name=مضاء
actors.buffs.light.desc=حتى في الزنزانة الأشد ظلمة، يظل وجود ضوء ثابت بجانبك أمرًا مطمئنًا.\n\nيساعد الضوء على إبعاد الظلام، مما يسمح لك برؤية مسافة معقولة رغم البيئة.\n\nالأدوار المتبقية من الإضاءة: %s.

actors.buffs.lockedfloor.name=الطابق مقفل
actors.buffs.lockedfloor.desc=الطابق الحالي مقفل، ولا يمكنك مغادرته!\n\nأثناء قفل الطابق، لن تشعر بالجوع ولن تتلقى ضررًا من الجوع الشديد. بالإضافة إلى ذلك، إذا لم تعمل على هزيمة زعيم هذا الطابق، فستتوقف أيضًا تأثيرات التجدد السلبي.\n\nكذلك، إذا أُحييت بواسطة عنخ غير مبارك أثناء قفل الطابق، فسيُعاد ضبطه.\n\nاقتل زعيم هذا الطابق لكسر القفل.

actors.buffs.lostinventory.name=مخزون مفقود
actors.buffs.lostinventory.desc=فقدت مخزونك في مكان ما داخل الزنزانة! لن تتمكن من التقاط معظم العناصر أو استخدامها حتى تستعيد مخزونك.

actors.buffs.magicalsight.name=بصر سحري
actors.buffs.magicalsight.desc=يمكنك بطريقة ما الرؤية بعقلك بدلًا من عينيك.\n\nأثناء تفعيل البصر السحري، ستتمكن من رؤية جميع التضاريس ضمن نصف قطر 12 بلاطة.\n\nالأدوار المتبقية من البصر السحري: %s.

actors.buffs.magicalsleep.name=نوم سحري
actors.buffs.magicalsleep.toohealthy=أنت بصحة جيدة جدًا، وتقاوم الرغبة في النوم.
actors.buffs.magicalsleep.fallasleep=تسقط في نوم سحري عميق.
actors.buffs.magicalsleep.wakeup=تستيقظ وأنت تشعر بالانتعاش والصحة.
actors.buffs.magicalsleep.desc=دخلت هذه الشخصية في نوم سحري عميق لن تستيقظ منه طبيعيًا.\n\nيشبه النوم السحري النوم العادي، لكن الضرر وحده هو الذي سيتسبب في إيقاظ الهدف.\n\nبالنسبة للبطل وحلفائه، يمتلك النوم السحري بعض الخصائص العلاجية، مما يسمح لهم بالشفاء بسرعة أثناء الراحة.

actors.buffs.magicimmune.name=محصن ضد السحر
actors.buffs.magicimmune.desc=فقدت جميع التأثيرات السحرية قدرتها على التأثير فيك، وأصبحت محصنًا ضدها تمامًا.\n\nأثناء المناعة السحرية، لن تنطبق عليك أي تأثيرات سحرية ضارة أو نافعة، بما في ذلك اللعنات والتعويذات والعصي واللفائف والخواتم والقطع الأثرية وما إلى ذلك. لكن قدرات الدروع البطولية قوية بما يكفي للعمل رغم هذا التأثير.\n\nالأدوار المتبقية من المناعة السحرية: %s.

actors.buffs.mindvision.name=رؤية ذهنية
actors.buffs.mindvision.desc=يمكنك بطريقة ما رؤية جميع المخلوقات الموجودة في هذا الطابق من خلال عقلك. إنه شعور غريب.\n\nستكون جميع الشخصيات في هذا الطابق مرئية لك طالما لديك رؤية ذهنية. وتُحتسب رؤية مخلوق عبر الرؤية الذهنية على أنها رؤيته أو قربه لأغراض العديد من التأثيرات السحرية.\n\nالأدوار المتبقية من الرؤية الذهنية: %s.

actors.buffs.momentum.momentum=يبني الزخم
actors.buffs.momentum.running=جري حر
actors.buffs.momentum.resting=يتعافى
actors.buffs.momentum.action_name=جري حر
actors.buffs.momentum.momentum_desc=يبني عدّاء الحرية الزخم أثناء تحركه، ويمكنه إنفاقه لبدء الجري الحر.\n\nكل شحنة من الزخم تمنح دورين من الجري الحر، ويمكن لعدّاء الحرية بناء ما يصل إلى 10 شحنات. يُفقد الزخم بسرعة عندما يتوقف عدّاء الحرية عن الحركة.\n\nشحنة الزخم الحالية: %d.
actors.buffs.momentum.running_desc=يبني عدّاء الحرية الزخم أثناء تحركه، ويمكنه إنفاقه لبدء الجري الحر.\n\nأثناء الجري الحر، يتحرك عدّاء الحرية بسرعة مضاعفة ويحصل على تهرب إضافي يعتمد على مستواه.\n\nالأدوار المتبقية: %d.
actors.buffs.momentum.resting_desc=يبني عدّاء الحرية الزخم أثناء تحركه، ويمكنه إنفاقه لبدء الجري الحر.\n\nيحتاج عدّاء الحرية إلى بعض الوقت لاستعادة قدرته على التحمل قبل أن يتمكن من بناء الزخم مجددًا.\n\nالأدوار المتبقية: %d.

actors.buffs.monkenergy.name=طاقة
actors.buffs.monkenergy.action=قدرات الراهب
actors.buffs.monkenergy.desc=عندما تهزم الأعداء، يكتسب الراهب طاقة يمكنه استخدامها في مجموعة متنوعة من القدرات. يمنح معظم الأعداء طاقة واحدة عند هزيمتهم، ولا يفقد الراهب الطاقة بمرور الوقت.\n\nالطاقة الحالية: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=استخدم الراهب قدرة مؤخرًا، وعليه الانتظار قبل استخدام أخرى.\n\nفترة التهدئة الحالية: %d دورًا.
actors.buffs.monkenergy$monkability$flurry.name=وابل ضربات
actors.buffs.monkenergy$monkability$flurry.desc=ضربتان فوريتان تلحقان %1$d-%2$d من الضرر وتتجاهلان الدرع. لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$flurry.empower_desc=ضربتان فوريتان تلحقان %1$d-%2$d من الضرر، وتتجاهلان الدرع، _وتستخدمان تعويذة سلاحك._ لا يمكن استخدام هذه القدرة بشكل متكرر.
actors.buffs.monkenergy$monkability$focus.name=تركيز
actors.buffs.monkenergy$monkability$focus.desc=يستغرق الراهب دورًا واحدًا للتركيز، مما يسمح له بصد الهجوم التالي الموجه إليه.
actors.buffs.monkenergy$monkability$focus.empower_desc=يُفعّل الراهب _التركيز فورًا،_ مما يسمح له بصد الهجوم التالي الموجه إليه.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=مركز
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=يركز الراهب على محيطه، مستعدًا للهجوم التالي الموجه إليه. أثناء التركيز، يكون مضمونًا أن يصد الهجوم القادم.
actors.buffs.monkenergy$monkability$dash.name=اندفاع
actors.buffs.monkenergy$monkability$dash.prompt=اختر موقعًا
actors.buffs.monkenergy$monkability$dash.desc=اندفاع فوري لمسافة تصل إلى 4 بلاطات. يمكن لهذه القدرة تجاوز المخاطر، لكنها لا تتجاوز الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dash.empower_desc=اندفاع فوري لمسافة تصل إلى _8 بلاطات_. يمكن لهذه القدرة تجاوز المخاطر، لكنها لا تتجاوز الأعداء أو التضاريس الصلبة.
actors.buffs.monkenergy$monkability$dragonkick.name=ركلة التنين
actors.buffs.monkenergy$monkability$dragonkick.desc=ركلة مدمرة تلحق %1$d-%2$d من الضرر وتتجاهل الدرع. تدفع الركلة الهدف بعيدًا وتصيبه بالشلل عن كل بلاطة يقطعها.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=ركلة مدمرة تلحق _%1$d-%2$d من الضرر_ وتتجاهل الدرع. تدفع الركلة _جميع الأهداف الملاصقة_ بعيدًا وتشلّهم عن كل بلاطة يقطعونها.
actors.buffs.monkenergy$monkability$meditate.name=تأمل
actors.buffs.monkenergy$monkability$meditate.desc=يركز الراهب الطاقة في جسده لمدة 5 أدوار. ويزيل ذلك معظم التأثيرات السلبية، ويمنحه 8 أدوار من إعادة شحن العصي والقطع الأثرية.
actors.buffs.monkenergy$monkability$meditate.empower_desc=يركز الراهب الطاقة في جسده لمدة 5 أدوار. ويزيل ذلك معظم التأثيرات السلبية، ويمنحه 8 أدوار من إعادة شحن العصي والقطع الأثرية. _كما يحصل على مقاومة للضرر بنسبة 80%% أثناء التأمل، ويستعيد ببطء 20%% من صحته المفقودة._

actors.buffs.ooze.name=مادة كاوية
actors.buffs.ooze.heromsg=المادة الكاوية تأكل لحمك. اغسلها!
actors.buffs.ooze.ondeath=تذوب...
actors.buffs.ooze.rankings_desc=ذاب
actors.buffs.ooze.desc=يلتصق هذا الحمض اللزج باللحم ويذيبه ببطء.\n\nتلحق المادة الكاوية ضررًا ثابتًا بمرور الوقت، لكن يمكن غسلها فورًا بالماء.\n\nالأدوار المتبقية من المادة الكاوية: %s.

actors.buffs.paralysis.name=مشلول
actors.buffs.paralysis.heromsg=أنت مشلول!
actors.buffs.paralysis.out=قاوم الشلل
actors.buffs.paralysis.desc=غالبًا ما يكون أسوأ ما يمكنك فعله هو ألا تفعل شيئًا على الإطلاق.\n\nيوقف الشلل جميع الأفعال تمامًا، مما يجبر الهدف على الانتظار حتى ينتهي التأثير. ويمكن لألم تلقي الضرر أن يجعل الشخصيات تقاوم الشلل وتتحرر من تأثيره.\n\nالأدوار المتبقية من الشلل: %s.

actors.buffs.physicalempower.name=معزز جسديًا
actors.buffs.physicalempower.desc=تم تعزيز ضرباتك، مما يزيد مقدار الضرر الذي يمكنك إلحاقه عند إصابة الأعداء بهجمات جسدية.\n\nالضرر الإضافي: %1$d.\nالضربات المتبقية: %2$d.

actors.buffs.pincushion.name=وسادة دبابيس
actors.buffs.pincushion.desc=الأسلحة المرمية التي استخدمتها ضد هذه الشخصية عالقة بها حاليًا، وستسقط على الأرض بعد هزيمتها.\n\nالعناصر التالية ملتصقة بها حاليًا:

actors.buffs.poison.name=مسموم
actors.buffs.poison.heromsg=أنت مسموم!
actors.buffs.poison.ondeath=مت بسبب السم...
actors.buffs.poison.rankings_desc=استسلم للسم
actors.buffs.poison.desc=ينتشر السم عبر الجسد، ويعيق وظائفه الداخلية ببطء.\n\nيسبب السم ضررًا كل دور يتناسب مع الوقت المتبقي قبل انتهاء تأثيره.\n\nالأدوار المتبقية من السم: %s.

actors.buffs.preparation.name=استعداد
actors.buffs.preparation.action_name=ضربة مجهزة
actors.buffs.preparation.desc=ينتظر القاتل بصبر، مستعدًا للضرب من الظلال.
actors.buffs.preparation.desc_dmg=سيلحق هجومه التالي _%1$d%% من الضرر الإضافي_، وسيقضي على الأعداء العاديين الذين تقل صحتهم عن _%2$d%%_، أو الزعماء الذين تقل صحتهم عن _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=كما سيكون الهجوم أكثر احتمالًا لإلحاق قدر أكبر من الضرر.
actors.buffs.preparation.desc_blink=يمكنه الانتقال آنيًا نحو عدو قبل ضربه، بمدى أقصى قدره _%d._
actors.buffs.preparation.desc_invis_time=الأدوار التي قضاها غير مرئي: _%d._
actors.buffs.preparation.desc_invis_next=الأدوار المتبقية للهجوم الأقوى: _%d._
actors.buffs.preparation.prompt=اختر هدفًا للهجوم!\nالحد الأقصى لمسافة الانتقال الآني: %d
actors.buffs.preparation.no_target=لا يوجد شيء لمهاجمته هناك.
actors.buffs.preparation.out_of_reach=ذلك الهدف بعيد عن متناولك.
actors.buffs.preparation.assassinated=تم اغتياله

actors.buffs.prismaticguard.name=حارس طيفي
actors.buffs.prismaticguard.desc=تحرسك حاليًا صورة طيفية غير نشطة. وعند وجود أعداء، ستنشط الصورة الطيفية وتتحرك لحمايتك!\n\nأثناء عدم نشاطها، ستستعيد الصورة الطيفية تدريجيًا أي ضرر تلقته.\n\nالصحة الحالية: %d/%d.
actors.buffs.prismaticguard.desc_many=تستفيد هذه الصورة الطيفية أيضًا من قوة الكثرة. الأدوار المتبقية: %d.

actors.buffs.recharging.name=إعادة الشحن
actors.buffs.recharging.desc=تتدفق الطاقة عبر جسدك، مما يحسن سرعة شحن عصاك وعصيّك.\n\nفي كل دور، يزيد هذا التأثير الشحنة الحالية بمقدار الربع، بالإضافة إلى إعادة الشحن العادية.\n\nالأدوار المتبقية من إعادة الشحن: %s.

actors.buffs.revealedarea.name=منطقة مكشوفة
actors.buffs.revealedarea.desc=تم كشف منطقة من الزنزانة مؤقتًا للبطل، وسيراها بغض النظر عن مكان وجوده.\n\nالأدوار المتبقية: %s.

actors.buffs.revealedchar.name=مكشوف
actors.buffs.revealedchar.desc=تم كشف هذه الشخصية للبطل، وستكون مرئية له بغض النظر عن مكان وجودها.\n\nالأدوار المتبقية: %s.

actors.buffs.roots.name=متجذر
actors.buffs.roots.heromsg=لا يمكنك التحرك!
actors.buffs.roots.desc=تمسك الجذور (السحرية أو الطبيعية) بالقدمين وتجبرهما على البقاء في الأرض.\n\nتثبت الجذور الهدف في مكانه، مما يجعل الحركة ومعظم قدرات الحركة مستحيلة. ولا تتأثر الأفعال الأخرى، بما في ذلك تأثيرات الانتقال الآني.\n\nالأدوار المتبقية للتجذير: %s.

actors.buffs.scrollempower.name=تعزيز اللفافة
actors.buffs.scrollempower.desc=تعمل طاقة اللفافة التي قرأها الساحر مؤخرًا على تعزيز عصيه!\n\nتعزيز المستوى: +%1$d.\nالإطلاقات المتبقية: %2$d.

actors.buffs.shadows.name=مندمج مع الظلال
actors.buffs.shadows.desc=أنت مندمج مع الظلال المحيطة بك، مما يمنحك الاختفاء ويبطئ عملية الأيض.\n\nأثناء اختفائك، لن يتمكن الأعداء من مهاجمتك أو تتبعك. وستلغي معظم الهجمات الجسدية والتأثيرات السحرية (مثل اللفائف والعصي) الاختفاء فورًا. بالإضافة إلى ذلك، أثناء اندماجك مع الظلال، يتباطأ معدل شعورك بالجوع.\n\nستظل مندمجًا مع الظلال حتى تغادرها أو يلامسك أحد الأعداء.

actors.buffs.slow.name=متباطئ
actors.buffs.slow.desc=يؤثر سحر التباطؤ في معدل مرور الوقت لدى الهدف، فيبدو له أن كل شيء يتحرك بسرعة هائلة.\n\nتنفذ الشخصية المتباطئة جميع أفعالها في ضعف الوقت الذي تستغرقه عادةً.\n\nالأدوار المتبقية من التباطؤ: %s.

actors.buffs.snipersmark.name=علامة القناص
actors.buffs.snipersmark.action_name_snapshot=طلقة سريعة
actors.buffs.snipersmark.action_name_volley=وابل
actors.buffs.snipersmark.action_name_sniper=طلقة قنص
actors.buffs.snipersmark.desc=تركز القناصة حاليًا على آخر هدف هاجمته. ويمكنها تنفيذ هجوم خاص بقوسها، ويختلف هذا الهجوم بحسب نوع تعزيز القوس.\n\nإذا لم يكن القوس معززًا، فسيطلق _طلقة سريعة،_ تلحق ضررًا أقل لكنها لا تستغرق أي وقت لإطلاقها.\n\nإذا كان القوس معززًا للسرعة، فسيطلق _وابلًا_ من ثلاثة أسهم. يلحق كل سهم ضررًا أقل، لكنه لا يزال قادرًا على تفعيل التعويذات. ويستغرق إطلاق هذا الوابل دورًا واحدًا.\n\nإذا كان القوس معززًا للضرر، فسيطلق _طلقة قنص._ هذه الطلقة مضمونة الإصابة، وتلحق ضررًا إضافيًا يعتمد على المسافة من الهدف، وتستغرق دورين لإطلاقها.\n\nالأدوار المتبقية: %s.

actors.buffs.soulmark.name=موسوم بالروح
actors.buffs.soulmark.desc=تمكن الساحر الملعون من الوصول إلى روح هذا المخلوق، مما يسمح له بالشفاء كلما تلقى المخلوق ضررًا جسديًا.\n\nالأدوار المتبقية لعلامة الروح: %s.

actors.buffs.stamina.name=قدرة على التحمل
actors.buffs.stamina.desc=تمتلك قدرة تحمّل لا تنفد، مما يسمح لك بالحركة بشكل أسرع!\n\nأثناء تأثير قدرة التحمل، ستتحرك بسرعة +50%%، لكنك ستنفذ جميع الأفعال الأخرى بالسرعة العادية.\n\nالأدوار المتبقية لقدرة التحمل: %s.

actors.buffs.vulnerable.name=هش
actors.buffs.vulnerable.heromsg=تشعر بالهشاشة!
actors.buffs.vulnerable.desc=يزيد سحر الهشاشة جميع الضرر الجسدي الذي تتلقاه الشخصية بنسبة 33%%، بعد تخفيض ذلك الضرر بواسطة الدرع.\n\nالأدوار المتبقية للهشاشة: %s.

actors.buffs.terror.name=مذعور
actors.buffs.terror.desc=الرعب سحر تلاعبي يجبر هدفه على الدخول في حالة من الهلع لا يمكن السيطرة عليها.\n\nتُجبر الشخصيات المذعورة على الهرب من خصمها، وتحاول وضع أكبر عدد ممكن من الأبواب والجدران بينهما. لكن صدمة الألم ستقلل مدة الرعب.\n\nالأدوار المتبقية من الرعب: %s.

actors.buffs.toxicimbue.name=مشبع بالسموم
actors.buffs.toxicimbue.desc=لقد تشبعت بطاقة سامة!\n\nأثناء تحركك، سينبعث منك باستمرار غاز سام كثيف يلحق الضرر بأعدائك. وستكون محصنًا ضد الغاز السام والسم طوال مدة التأثير، وكذلك لعدة أدوار بعد انتهائه.\n\nالأدوار المتبقية لتشبيع السموم: %s.

actors.buffs.corrosion.name=تآكل
actors.buffs.corrosion.heromsg=أنت تذوب!
actors.buffs.corrosion.ondeath=تذوب...
actors.buffs.corrosion.rankings_desc=ذاب
actors.buffs.corrosion.desc=يذيب الحمض القوي اللحم والمعدن والعظام بمعدل ينذر بالخطر.\n\nيزداد ضرر التآكل بمرور الوقت مع استمرار ذوبان الهدف.\n\nالأدوار المتبقية للتآكل: %1$s.\nضرر التآكل الحالي: %2$d.

actors.buffs.vertigo.name=دوار
actors.buffs.vertigo.desc=قد يكون المشي في خط مستقيم صعبًا عندما يدور العالم بأسره من حولك.\n\nأثناء تأثير الدوار، ستتحرك الشخصيات التي تحاول التحرك في اتجاه عشوائي بدلًا من الاتجاه الذي قصدته.\n\nالأدوار المتبقية من الدوار: %s.

actors.buffs.wandempower.name=عصي معززة
actors.buffs.wandempower.desc=تم تعزيز عصاك التي تلحق الضرر، مما يزيد مقدار الضرر الذي تلحقه لعدة ضربات.\n\nالضرر الإضافي: %1$d.\nالضربات المتبقية: %2$d.

actors.buffs.weakness.name=ضعيف
actors.buffs.weakness.heromsg=تشعر بالضعف!
actors.buffs.weakness.desc=يبدو كل شيء فجأة أثقل بكثير.\n\nيقلل سحر الإضعاف القوة الجسدية للشخصية، مما يجعلها تلحق ضررًا أقل بنسبة 33%%.\n\nالأدوار المتبقية للضعف: %s.

actors.buffs.wellfed.name=شبعان جيدًا
actors.buffs.wellfed.desc=تشعر بالشبع والرضا التام.\n\nأثناء الشبع الجيد، لن يزداد جوعك، كما ستستعيد قدرًا إضافيًا من الصحة بمرور الوقت.\n\nالأدوار المتبقية: %d.



### البطل

## القدرات
actors.hero.abilities.armorability.self_target=لا يمكنك استهداف نفسك!
actors.hero.abilities.armorability.no_target=لا يوجد شيء لاستهدافه هناك!
actors.hero.abilities.armorability.prompt=اختر موقعًا لاستهدافه
actors.hero.abilities.armorability.cost=تكلفة الشحنة: _%d_

actors.hero.abilities.warrior.heroicleap.name=القفزة البطولية
actors.hero.abilities.warrior.heroicleap.prompt=اختر اتجاه القفز
actors.hero.abilities.warrior.heroicleap.short_desc=ينفذ المحارب _قفزة بطولية_ نحو موقع مستهدف، متجاوزًا الأعداء والمخاطر من فوقها.
actors.hero.abilities.warrior.heroicleap.desc=يقفز المحارب نحو موقع مستهدف، متجاوزًا أي أعداء أو مخاطر تعترض طريقه. لكنه لا يستطيع القفز فوق الجدران أو التضاريس الصلبة الأخرى.
actors.hero.abilities.warrior.shockwave.name=موجة صادمة
actors.hero.abilities.warrior.shockwave.short_desc=يطلق المحارب _موجة صادمة_ في مساحة مخروطية بضرب الأرض. ويتلقى الأعداء العالقون فيها ضررًا ويصابون بالإعاقة.
actors.hero.abilities.warrior.shockwave.desc=يضرب المحارب الأرض، محدثًا موجة صادمة تمتد لمسافة تصل إلى 5 بلاطات في مخروط بزاوية 60 درجة.\n\nيصاب الأعداء الذين تقبض عليهم هذه الموجة بالإعاقة لمدة 5 أدوار. كما يتلقون 5-10 من الضرر، بالإضافة إلى 1-2 من الضرر الإضافي لكل نقطة قوة يمتلكها المحارب فوق 10.
actors.hero.abilities.warrior.endure.name=التحمل
actors.hero.abilities.warrior.endure$enduretracker.name=التحمّل
actors.hero.abilities.warrior.endure$enduretracker.desc=يلحق المحارب الآن ضررًا إضافيًا يعتمد على الضرر الذي تحمله.\n\nالضرر الإضافي: %1$d\nالضربات المتبقية: %2$d
actors.hero.abilities.warrior.endure.short_desc=يقوم المحارب بـ_التحمل_، متخطيًا عدة أدوار لكنه يكتسب مقاومة عالية للضرر. ثم يلحق ضررًا إضافيًا يعتمد على ما تحمله.
actors.hero.abilities.warrior.endure.desc=يتحمل المحارب لمدة 3 أدوار، ويتلقى نصف الضرر من جميع المصادر. ويُطبق هذا التخفيض قبل تأثيرات مقاومة الضرر مثل الدرع.\n\nبعد التحمل، تحصل ضربته التالية خلال 10 أدوار على ضرر إضافي. يساوي هذا الضرر الإضافي نصف كل الضرر الذي أُلحق به أثناء التحمل، قبل أي تأثيرات لتقليل الضرر!\n\nإذا كان لدى المحارب سلسلة ضربات، فإن استخدام هذه القدرة يزيد مدتها المتبقية بمقدار 3 أدوار.

actors.hero.abilities.mage.elementalblast.name=انفجار عنصري
actors.hero.abilities.mage.elementalblast.no_staff=لا يمكنك استخدام هذه القدرة بدون عصاك.
actors.hero.abilities.mage.elementalblast.short_desc=يطلق الساحر _انفجارًا عنصريًا_ من عصاه، ويغطي مساحة كبيرة حوله بتأثير يختلف بحسب العصا الموجودة في عصاه.
actors.hero.abilities.mage.elementalblast.desc=يطلق الساحر انفجارًا سحريًا يغطي منطقة دائرية تمتد حتى 4 بلاطات ويلحق ما يصل إلى 15-25 من الضرر. ويختلف التأثير المحدد للانفجار العنصري بحسب العصا المشبعة في عصا الساحر.
actors.hero.abilities.mage.elementalblast.generic_desc=سيكون تأثير الانفجار العنصري مشابهًا لتأثير العصا عند إطلاقها على عدو أو حليف.
actors.hero.abilities.mage.wildmagic.name=سحر جامح
actors.hero.abilities.mage.wildmagic.no_wands=لا تملك أي عصي لتطلق منها!
actors.hero.abilities.mage.wildmagic.short_desc=يطلق الساحر _السحر الجامح_ الموجود في عصاه، ويطلقها عشوائيًا عدة مرات على هدف مختار خلال دور واحد.
actors.hero.abilities.mage.wildmagic.desc=يطلق الساحر القوة الموجودة في عصاه، ويطلقها عشوائيًا حتى 4 مرات في دور واحد. ولا تشمل هذه القدرة عصا الساحر.\n\nيزداد مستوى كل عصا أيضًا بمقدار 2، حتى +3. وتستهلك هذه القدرة نصف شحنة عصا لكل إطلاق، ولا يمكن إطلاق العصا نفسها أكثر من مرتين.
actors.hero.abilities.mage.warpbeacon.name=منارة الانتقال
actors.hero.abilities.mage.warpbeacon.depths=لا يمكنك الانتقال بين الأعماق!
actors.hero.abilities.mage.warpbeacon.locked_floor=لا يمكنك مغادرة طابق مقفل!
actors.hero.abilities.mage.warpbeacon.too_far=ذلك الموقع بعيد جدًا!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=لا يمكنك وضع منارة هناك!
actors.hero.abilities.mage.warpbeacon.window_desc=منارتك موضوعة حاليًا في الطابق %d.
actors.hero.abilities.mage.warpbeacon.window_tele=الانتقال إلى المنارة
actors.hero.abilities.mage.warpbeacon.window_clear=إزالة المنارة
actors.hero.abilities.mage.warpbeacon.window_cancel=إلغاء
actors.hero.abilities.mage.warpbeacon.short_desc=يضع الساحر _منارة انتقال_ في موقعه الحالي، ويمكنه الانتقال إليها فورًا.
actors.hero.abilities.mage.warpbeacon.desc=يضع الساحر منارة يمكنه الانتقال إليها متى شاء. يستغرق وضع المنارة دورًا واحدًا، لكن الانتقال إليها فوري.\n\nلا يستطيع الساحر افتراضيًا الانتقال بين الطوابق، ولا يمكنه استخدام المنارة للوصول إلى الأماكن غير المتاحة مثل الغرف المقفلة. ويمكن للساحر الانتقال إلى مكان يشغله عدو، مما سيدفعه جانبًا.

actors.hero.abilities.rogue.smokebomb.name=قنبلة دخان
actors.hero.abilities.rogue.smokebomb.fov=لا يمكنك القفز إلا إلى موقع فارغ داخل مجال رؤيتك.
actors.hero.abilities.rogue.smokebomb.prompt=اختر موقعًا للقفز إليه
actors.hero.abilities.rogue.smokebomb$ninjalog.name=طُعم خشبي
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=بطريقة ما، يسهل إقناع الأعداء بأن هذا الطُعم الخشبي هو اللص الحقيقي!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=يمكنك العثور على هذه الشخصية باستخدام قدرة معينة من قدرات درع البطل.
actors.hero.abilities.rogue.smokebomb.short_desc=يرمي اللص _قنبلة دخان_ بينما ينتقل بعيدًا. ويصيب الأعداء القريبين من موقعه القديم بالعمى.
actors.hero.abilities.rogue.smokebomb.desc=يرمي اللص قنبلة دخان وينتقل آنيًا لمسافة تصل إلى 6 بلاطات. ويمكنه الانتقال عبر المخاطر والأعداء، لكنه لا يستطيع المرور عبر التضاريس الصلبة مثل الجدران.\n\nيصاب الأعداء الملاصقون لموضع اللص القديم بالعمى لمدة 5 أدوار.
actors.hero.abilities.rogue.deathmark.name=علامة الموت
actors.hero.abilities.rogue.deathmark.ally_target=يمكنك وضع العلامة على الأعداء فقط
actors.hero.abilities.rogue.deathmark.short_desc=يضع اللص _علامة الموت_ على عدو مختار. يتلقى الأعداء الموسومون ضررًا إضافيًا، لكن لا يمكن أن يموتوا حتى تنتهي العلامة.
actors.hero.abilities.rogue.deathmark.desc=يضع اللص علامة على عدو مختار، مما يجعله يتلقى ضررًا إضافيًا بنسبة 25%%. تُطبق العلامة فورًا وتستمر لمدة 5 أدوار.\n\nيتلقى الأعداء الموسومون ضررًا إضافيًا، لكن لا يمكنهم الموت حتى تنتهي العلامة. وإذا كانت صحة عدو 0 عند انتهاء العلامة، فسيموت فورًا.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=موسوم بالموت
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=تم وضع علامة على هذا العدو، مما يجعله يتلقى ضررًا إضافيًا بنسبة 25%%، لكنه أيضًا لا يستطيع الموت حتى تنتهي العلامة.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.rogue.shadowclone.name=نسخة الظل
actors.hero.abilities.rogue.shadowclone.short_desc=يستدعي اللص _نسخة ظل_ يمكن توجيهها لمساعدته في القتال.
actors.hero.abilities.rogue.shadowclone.desc=يستدعي اللص نسخة مظللة منه، ويمكن توجيهها لمساعدته في القتال. ولا يكلف توجيه نسخة الظل أي شحنة.\n\nتمتلك النسخة 80 من الصحة، ولا تمتلك درعًا، وتلحق 10-20 من الضرر. ويمكن تحسين جميع هذه الصفات بالمواهب، بحيث تستفيد النسخة من الأسلحة والدروع التي يمتلكها البطل.
actors.hero.abilities.rogue.shadowclone$shadowally.name=لص الظل
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=تنتقل نسختك إلى ذلك الموقع.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=تنتقل نسختك لتتبعك.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=تنتقل نسختك للهجوم!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=نسخة من اللص مصنوعة من الظلام المظلل. تقف ساكنة تمامًا، بعينين فارغتين وفتلات صغيرة من الظلام تتصاعد منها كالبخار.\n\nالنسخة ليست نسخة مثالية من اللص، لكنها لا تزال مقاتلًا جيدًا، ويمكنها الاستفادة من معدات اللص مع المواهب المناسبة.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=يمكنك العثور على هذه الشخصية باستخدام قدرة معينة من قدرات درع البطل.

actors.hero.abilities.huntress.spectralblades.name=شفرات طيفية
actors.hero.abilities.huntress.spectralblades.short_desc=ترمي الصيادة _شفرات طيفية_ على هدف، وتلحق ضررًا يعتمد على سلاحها القريب المجهز حاليًا.
actors.hero.abilities.huntress.spectralblades.desc=ترمي الصيادة شفرة طيفية على عدو، تعمل كضربة بعيدة المدى من سلاحها القريب. وستتفعّل جميع التأثيرات العادية للسلاح القريب، بما في ذلك التعويذات.
actors.hero.abilities.huntress.naturespower.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower.short_desc=تستدعي الصيادة _قوة الطبيعة_، مما يزيد سرعة حركتها ومعدل إطلاق قوسها لفترة قصيرة.
actors.hero.abilities.huntress.naturespower.desc=تعزز الصيادة نفسها وقوسها مؤقتًا بقوة الطبيعة! ويستمر ذلك لمدة 8 أدوار.\n\nخلال هذا الوقت، تتحرك الصيادة بسرعة تعادل ضعفين، وتهاجم بقوسها أسرع بنسبة 33%%. ولا تتفعّل تأثيرات القوس الإضافية إذا كانت القناصة تستخدم هجماتها الخاصة.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=قوة الطبيعة
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=تم تعزيز الصيادة مؤقتًا، مما يزيد سرعة حركتها وسرعة هجومها بقوسها.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.huntress.spirithawk.name=صقر روحي
actors.hero.abilities.huntress.spirithawk.no_space=لا يوجد مكان فارغ بالقرب منك.
actors.hero.abilities.huntress.spirithawk.short_desc=تستدعي الصيادة _صقرًا روحيًا_ أليفًا يمكنه مساعدتها في استكشاف المواقع وتشتيت الأعداء.
actors.hero.abilities.huntress.spirithawk.desc=تستدعي الصيادة صقرًا روحيًا أليفًا، ويمكن توجيهه باستخدام القدرة مرة أخرى أثناء استدعائه. يدوم الصقر لمدة 100 دور، ولا يكلف توجيهه أي شحنة.\n\nيمتلك الصقر صحة وقوة هجوم ضئيلتين، لكنه سريع ودقيق ورشيق. ويشارك الصيادة مجال رؤيته بالكامل طوال الوقت. وهو محصن ضد جميع التأثيرات المرتبطة بالمنطقة، مثل النار والغاز السام. ولن يهاجم ما لم يتم توجيهه لذلك تحديدًا.
actors.hero.abilities.huntress.spirithawk$hawkally.name=صقر روحي
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=ينتقل صقرك إلى ذلك الموقع.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=ينتقل صقرك ليتبعك.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=ينتقل صقرك للهجوم!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=صقر سحري استدعته الصيادة. يتوهج بلون أزرق أثيري ساطع، ويتحرك رأسه باستمرار أثناء تفقده للمنطقة.\n\nرغم أنه ليس مقاتلًا قويًا، فإن سرعته ورؤيته تجعلان منه ممتازًا للاستكشاف وتشتيت الأعداء.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=الأدوار المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=المراوغات المضمونة المتبقية: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=يمكنك العثور على هذه الشخصية باستخدام قدرة معينة من قدرات درع البطل.

actors.hero.abilities.duelist.challenge.name=تحدٍّ
actors.hero.abilities.duelist.challenge.prompt=اختر عدوًا لتحديه
actors.hero.abilities.duelist.challenge.already_dueling=لا يمكنك خوض أكثر من مبارزة واحدة في الوقت نفسه.
actors.hero.abilities.duelist.challenge.ally_target=يمكنك تحدي الأعداء فقط.
actors.hero.abilities.duelist.challenge.unreachable_target=يجب أن تكون قادرًا على الوصول إلى هدفك.
actors.hero.abilities.duelist.challenge.distant_target=ذلك العدو بعيد جدًا بحيث لا يمكنك تحديه.
actors.hero.abilities.duelist.challenge.short_desc=تتحدى المبارزة عدوًا قريبًا في _مبارزة_، مما يجمد جميع الأعداء الآخرين مؤقتًا.
actors.hero.abilities.duelist.challenge.desc=تتحدى المبارزة عدوًا قريبًا في مبارزة. ويُجبر ذلك العدو على قتالها بينما يتجمد جميع الأعداء الآخرين مؤقتًا في الزمن.\n\nيجب أن يكون الهدف قابلًا للوصول وأن يكون ضمن 5 بلاطات من المبارزة. وتستمر المبارزة حتى تمر 10 أدوار، أو يموت العدو، أو تصبح المبارزة على بعد أكثر من 5 بلاطات من العدو.\n\nالأعداء المتجمدون محصنون ضد الضرر. ولا يتجمد حلفاء المبارزة بهذه القدرة، لكن إذا تم استهداف زعيم، فلن يتجمد أتباعه أيضًا.
actors.hero.abilities.duelist.challenge$duelparticipant.name=مشارك في مبارزة
actors.hero.abilities.duelist.challenge$duelparticipant.desc=تشارك هذه الشخصية في مبارزة. ويمكن لها ولأي حلفاء أو أتباع تابعين لها التصرف بشكل طبيعي بينما يتجمد الآخرون.\n\nستستمر المبارزة لمدة محددة، حتى يموت أحد المشاركين، أو يبتعد المشاركون أكثر من 5 بلاطات عن بعضهم.\n\nالأدوار المتبقية: %d.
actors.hero.abilities.duelist.elementalstrike.name=ضربة عنصرية
actors.hero.abilities.duelist.elementalstrike.short_desc=تنفذ المبارزة _ضربة عنصرية_، وتنشر تأثيرًا في مساحة مخروطية يعتمد على تعويذة سلاحها.
actors.hero.abilities.duelist.elementalstrike.desc=تضرب المبارزة عدوًا أو موقعًا، منفذة هجومًا عاديًا مضمون الإصابة، وتنشر تأثيرًا سحريًا يمتد حتى 4 بلاطات في مخروط بزاوية 65 درجة. ويختلف هذا التأثير السحري بحسب التعويذة الموجودة على سلاح المبارزة الأساسي.
actors.hero.abilities.duelist.elementalstrike.generic_desc=ستطلق ضربة عنصرية بلا تعويذة دفعة سحرية صغيرة تلحق 6-12 من الضرر بجميع الأعداء ضمن المدى.
actors.hero.abilities.duelist.feint.name=مراوغة
actors.hero.abilities.duelist.feint.prompt=اختر موقعًا للاندفاع إليه
actors.hero.abilities.duelist.feint.too_far=ذلك الموقع ليس ملاصقًا لك.
actors.hero.abilities.duelist.feint.bad_location=لا يمكنك التحرك إلى ذلك الموقع.
actors.hero.abilities.duelist.feint.short_desc=تنفذ المبارزة _مراوغة_، متظاهرةً بالهجوم بينما تندفع إلى بلاطة ملاصقة. وسيهاجم الأعداء صورتها الوهمية، مما يتركهم عرضة لهجوم مضاد.
actors.hero.abilities.duelist.feint.desc=تتظاهر المبارزة بالهجوم بينما تندفع إلى بلاطة ملاصقة، تاركةً وراءها صورة وهمية مؤقتة لها. وسيهاجم الأعداء الذين كانوا يهاجمون المبارزة صورتها الوهمية بدلًا منها.\n\nويصاب الأعداء الذين يهاجمون الصورة الوهمية بالإرباك، مما يلغي فعلهم التالي ويجعلهم عرضة لهجوم مفاجئ.

actors.hero.abilities.cleric.ascendedform.name=هيئة متسامية
actors.hero.abilities.cleric.ascendedform.short_desc=يتخذ الكاهن _هيئة متسامية_، ويحصل على تعاويذ جديدة ومدى هجوم وحماية.
actors.hero.abilities.cleric.ascendedform.desc=يطلق الكاهن طاقة مقدسة من جسده، متخذًا هيئة مشعة ممتدة لمدة 10 أدوار. أثناء هذه الهيئة، يستطيع الكاهن إلقاء تعاويذ جديدة، ويحصل على +2 إلى مدى الهجوم و30 من الحماية، كما تمنحه أي تعاويذ إضافية يلقيها 10 من الحماية مقابل كل شحنة من الكتاب المقدس يتم إنفاقها.\n\nلا تتآكل الحماية الناتجة عن الهيئة المتسامية وتعاويذها بالطريقة المعتادة، لكنها تتلاشى فور انتهاء الهيئة المتسامية. ويمكن إعادة استخدام القدرة لتجديد مدة الهيئة المتسامية.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=هيئة متسامية
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=تشع طاقة مضيئة من جسد الكاهن. أثناء هذه الهيئة، يحصل الكاهن على +2 إلى مدى الهجوم (بسبب الطاقة المقدسة المنبعثة منه)، و10 من الحماية كلما أنفق شحنة من الكتاب المقدس. كما يستطيع إلقاء التعاويذ التي يتم فتحها عبر مواهب الهيئة المتسامية.\n\nلن تتآكل الحماية التي تمنحها الهيئة المتسامية وتعاويذها بالطريقة المعتادة، لكنها ستتلاشى فور انتهاء الهيئة المتسامية.\n\nالحماية الحالية: %1$d.\nالأدوار المتبقية: %2$d.
actors.hero.abilities.cleric.trinity.name=الثالوث
actors.hero.abilities.cleric.trinity.no_imbue=لا يوجد تأثير معين لأي شكل من أشكال الثالوث حاليًا، استخدم إحدى تعاويذه!
actors.hero.abilities.cleric.trinity.no_duplicate=لا يمكن للثالوث تكرار تأثير لديك مجهز بالفعل!
actors.hero.abilities.cleric.trinity.ench_glyph_use=سيطبق الثالوث هذا التأثير لمدة _%1$d دورًا_ بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=سيطبق الثالوث هذا التأثير _القوي_ لمدة _%1$d دورًا_ بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.wand_use=سيطلق الثالوث بهذه العصا عند _+%1$d_ بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.wand_multi_use=سيطلق الثالوث بهذه العصا _متعددة الشحنات_ عند _+%1$d_ بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.thrown_use=سيرمي الثالوث هذا السلاح عند _+%1$d_ بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.ring_use=سيطبق الثالوث تأثير هذا الخاتم عند _+%1$d_ لمدة 20 دورًا، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=سيطبق الثالوث تأثير الكيمياء عن بُعد لهذا الأثر، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=سيطبق الثالوث تأثير التجدد السلبي للصحة لهذا الأثر عند _+%1$d_ لمدة 20 دورًا، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.driedrose_use=سيستخدم الثالوث تأثير هذا الأثر لاستدعاء طيف ودود مفسد يمتلك صحة شبح _+%1$d_، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.etherealchains_use=سيطبق الثالوث تأثير إطلاق السلاسل لهذا الأثر بمدى _+%1$d_، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.hornofplenty_use=سيطبق الثالوث تأثير تناول الوجبات الخفيفة لهذا الأثر، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=سيطبق الثالوث تأثير سرقة الأعداء لهذا الأثر عند _+%1$d_، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=سيطبق الثالوث تأثير التجذير لهذا الأثر باستخدام بذرة ضارة عشوائية، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.skeletonkey_use=سيطبق الثالوث تأثير الإدخال لهذا الأثر، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=سيطبق الثالوث تأثير الاستبصار لهذا الأثر عند _+%1$d_، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=سيطبق الثالوث تأثير تجميد الزمن لهذا الأثر لمدة _%1$d_ دور، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=سيطبق الثالوث تأثير اللفافة العشوائية لهذا الأثر باحتمال _%1$d/10_ لمنح النسخة الغريبة دون تكلفة إضافية، بتكلفة _%2$s من الشحنة._
actors.hero.abilities.cleric.trinity.cost=تختلف تكلفة شحنة هذه القدرة، لكنها غالبًا ما تكون _%d._
actors.hero.abilities.cleric.trinity.short_desc=يحصل الكاهن على _ثالوث_ من القدرات التي تحاكي المعدات التي رآها ويمكن تعيينها باستخدام تعاويذ جديدة.
actors.hero.abilities.cleric.trinity.desc=يحصل الكاهن على _ثالوث_ من قدرات الدرع، ويمكن تعيينها لتأثيرات عناصر مختلفة باستخدام ثلاث تعاويذ جديدة. يركز كل شكل من هذه الأشكال على محاكاة تأثيرات أنواع مختلفة من المعدات التي حددها الكاهن خلال هذه الجولة: شكل الجسد (الأسلحة والدروع)، وشكل العقل (العصي والأسلحة المرمية)، وشكل الروح (الخواتم والقطع الأثرية).\n\nيمكن إشباع كل شكل من أشكال الثالوث بتأثير واحد في كل مرة، ويختار الكاهن أيها يفعل عند استخدام الثالوث. ولن يكرر الثالوث تأثير شيء مجهز لديك بالفعل.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=اختر أي شكل من الثالوث تريد استخدامه. يمكن أن تكون تأثيرات الأشكال المختلفة نشطة في الوقت نفسه.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_شكل الجسد: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_شكل العقل: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_شكل الروح: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=اختر تأثيرًا لإشباع الثالوث به. ستظهر معلومات إضافية قبل التأكيد.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=تعيين لشكل الجسد
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=تعيين لشكل العقل
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=تعيين لشكل الروح
actors.hero.abilities.cleric.powerofmany.name=قوة الكثرة
actors.hero.abilities.cleric.powerofmany.prompt_default=اختر حليفًا أو موقعًا
actors.hero.abilities.cleric.powerofmany.prompt_ally=وجّه حليفك المضيء
actors.hero.abilities.cleric.powerofmany.ally_exists=لديك حليف معزَّز بالفعل.
actors.hero.abilities.cleric.powerofmany.no_vision=لا يمكنك استهداف موقع لا تراه.
actors.hero.abilities.cleric.powerofmany.only_allies=يمكنك تعزيز الحلفاء فقط.
actors.hero.abilities.cleric.powerofmany.short_desc=يوجه الكاهن _قوة الكثرة_ لتعزيز حليف موجود أو إنشاء حليف جديد.
actors.hero.abilities.cleric.powerofmany.desc=يوجه الكاهن _قوة الكثرة_، التي تعزز حليفًا موجودًا أو تنشئ حليفًا جديدًا معززًا لمدة 100 دور. يؤدي استهداف مساحة فارغة إلى إنشاء حليف جديد.\n\nأثناء تعزيز الحليف بقوة الكثرة، يلحق كل حليف +25%% من الضرر، ويتلقى -25%% من الضرر، ويشارك رؤيته مع الكاهن. كما يحصلون على 25 من الحماية عند استخدام القدرة.\n\nيحصل الكاهن أيضًا على ثلاث تعاويذ جديدة لا يمكن إلقاؤها إلا بوجود حليف معزز. ولن تنتهي قوة الكثرة أثناء تفعيل إحدى هذه التعاويذ.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=قوة الكثرة
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=تم تعزيز هذا الحليف بقوة الكثرة، مما يمنحه +25%% للضرر الذي يلحقه و-25%% للضرر الذي يتلقاه. كما سيشارك مدى رؤيته مع الكاهن، ويمكنه الاستفادة من تعاويذ قوة الكثرة.\n\nستستمر قوة الكثرة عندما يختفي الحلفاء مثل الصور الطيفية، لكن مدتها ستستمر في الانخفاض.\n\nالأدوار المتبقية: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=حليف مضيء
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=ينتقل حليفك إلى ذلك الموقع.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=ينتقل حليفك ليتبعك.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=ينتقل حليفك للهجوم!
actors.hero.abilities.cleric.powerofmany$lightally.desc=نسخة من أحد رفاق الكاهن في المغامرة، مصنوعة من ضوء صلب. ورغم أن شكلها يشبه بطلًا آخر، فإنها لا تمتلك أيًا من قدراته الفريدة. وسيبقى هذا الحليف موجودًا طالما أن قوة الكثرة مطبقة عليه.\n\nيمكن توجيه هذا الحليف دون تكلفة عبر إعادة استخدام قدرة درع قوة الكثرة.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=يمكنك العثور على هذه الشخصية باستخدام قدرة معينة من قدرات درع البطل.

actors.hero.abilities.ratmogrify.name=تحويل إلى جرذ
actors.hero.abilities.ratmogrify.cant_transform=لا يمكنك تحويل ذلك إلى جرذ!
actors.hero.abilities.ratmogrify.too_strong=ذلك العدو قوي جدًا لتحويله إلى جرذ!
actors.hero.abilities.ratmogrify.short_desc=يقوم البطل _بتحويل_ عدو إلى جرذ! ويحوّله مؤقتًا إلى جرذ بلا قدرات.
actors.hero.abilities.ratmogrify.desc=يحول البطل عدوًا إلى جرذ لمدة 6 أدوار! لا يمكن تحويل الزعماء أو الحلفاء أو الجرذان إلى جرذان.\n\nيحتفظ الأعداء المحولون إلى جرذان بإحصاءاتهم الأصلية، لكنهم لا يمتلكون أي قدرات.
actors.hero.abilities.ratmogrify$transmograt.name=جرذ %s محوَّل
actors.hero.abilities.ratmogrify$transmograt.desc=تم تحويل هذا العدو إلى جرذ. تحسن هائل، إن سألتني! - ملك الجرذان
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=قُتل بواسطة: عدو محوّل إلى جرذ

## تعاويذ الكاهن
actors.hero.spells.auraofprotection.name=هالة الحماية
actors.hero.spells.auraofprotection.short_desc=تعزز دفاع البالادين وحلفائه القريبين.
actors.hero.spells.auraofprotection.desc=يبدأ البالادين بإشعاع طاقة واقية في هالة متلألئة حوله لمدة 20 دورًا. ويتلقى أي حليف يقع ضمن بلاطتين من البالادين (بما في ذلك نفسه) ضررًا أقل بنسبة %1$d%%، ويحصل على تأثير نقش درع البالادين بقوة +%2$d%%.\n\nيُطبق تقليل الضرر هذا قبل تأثيرات تقليل الضرر الأخرى (مثل الدرع). وستُطبق زيادة قوة النقش دائمًا، لكن هذه التعويذة لا يمكنها جعل نقش البالادين يُطبق أكثر من مرة إذا كانت الشخصية تستفيد منه بالفعل (مثل البالادين نفسه أو صورة طيفية).
actors.hero.spells.auraofprotection$aurabuff.name=هالة الحماية
actors.hero.spells.auraofprotection$aurabuff.desc=يشع البالادين طاقة واقية من حوله.\n\nيتلقى أي حليف قريب (بما في ذلك البالادين نفسه) ضررًا أقل ويحصل على تأثير نقش درع البالادين بقوة معززة.\n\nالأدوار المتبقية: %s.

actors.hero.spells.beamingray.name=شعاع النقل
actors.hero.spells.beamingray.no_space=لا توجد مساحة ليظهر حليفك هناك.
actors.hero.spells.beamingray.out_of_range=ذلك الموقع خارج المدى.
actors.hero.spells.beamingray.short_desc=ينقل حليفك آنيًا ويمنحه ضررًا إضافيًا.
actors.hero.spells.beamingray.desc=يوجه الكاهن القوة الموجودة في حليفه إلى شعاع من الضوء ينقله إلى موقع ما. وإذا اصطدم الشعاع بعدو، فسيضع الحليف بالقرب منه ويوجهه نحوه.\n\nيمتلك الشعاع مدى أقصى قدره %1$d بلاطة، ويزيد الضرر الإضافي لقوة الكثرة إلى +%2$d%% لمدة 10 أدوار ضد أقرب عدو ضمن 4 بلاطات. ويمكن لشعاع النقل حتى نقل الحلفاء الذين لا يتحركون عادةً، لكن مداه ينخفض إلى النصف في هذه الحالة.
actors.hero.spells.beamingray$beamingrayboost.name=شعاع النقل
actors.hero.spells.beamingray$beamingrayboost.desc=تم نقل هذا الحليف مؤخرًا بواسطة شعاع النقل، مما منحه ضررًا إضافيًا ضد أقرب عدو بعد الانتقال. كما لن تنتهي قوة الكثرة أثناء نشاط هذا التأثير.\n\nالأدوار المتبقية: %s.

actors.hero.spells.blessspell.name=البركة
actors.hero.spells.blessspell.short_desc=يبارك الكاهن ويمنحه حماية، ويبارك الآخرين ويشفيهم.
actors.hero.spells.blessspell.desc=يضع الكاهن بركة مقدسة على نفسه أو على شخصية أخرى يمكنه رؤيتها.\n\nعند إلقائها على نفسه، يكون التأثير أضعف، إذ يمنحه %1$d أدوار من البركة و%2$d من الحاجز.\n\nعند إلقائها على شخصيات أخرى، تكون التعويذة أقوى، إذ تمنح %3$d أدوار من البركة و%4$d من الشفاء. ويتحول الشفاء الزائد إلى حاجز.

actors.hero.spells.bodyform.name=شكل الجسد
actors.hero.spells.bodyform.short_desc=يعيّن الثالوث لتعويذة أو نقش.
actors.hero.spells.bodyform.desc=يختار الكاهن تعويذة أو نقشًا حدده في هذه الجولة ويشبع الثالوث بتأثيره.\n\nعند استخدام الثالوث، يحصل الكاهن على تأثير التعويذة أو النقش المختار لمدة %d دورًا. وستعمل هذه التعويذة أو النقش المؤقت مع أي تأثير يمكن لتعويذة أو نقش عادي العمل معه.\n\nتحل هذه التعويذة محل أي تأثير جسدي آخر مشبع به الثالوث حاليًا.
actors.hero.spells.bodyform$bodyformbuff.name=شكل الجسد
actors.hero.spells.bodyform$bodyformbuff.desc=يمنحك شكل الجسد للثالوث حاليًا قوة تعويذة أو نقش، كما لو كنت تجهزه على سلاحك أو درعك الحالي.\n\nلاحظ أن شكل الجسد لا يستطيع توفير نسخة أخرى من تأثير تستفيد منه بالفعل.\n\nالتأثير الحالي: %1$s.\n\nالأدوار المتبقية: %2$s.

actors.hero.spells.cleanse.name=التطهير
actors.hero.spells.cleanse.short_desc=يزيل التأثيرات السلبية ويمنح حماية.
actors.hero.spells.cleanse.desc=يزيل الكاهن جميع التأثيرات الضارة عن نفسه وعن الحلفاء المرئيين. وبعد انتهاء التعويذة، تحصل جميع الشخصيات المتأثرة أيضًا على %1$d أدوار من المناعة ضد التأثيرات السلبية، و%2$d من الحاجز.

actors.hero.spells.clericspell.prompt=اختر هدفًا
actors.hero.spells.clericspell.no_target=لا يوجد هدف هناك.
actors.hero.spells.clericspell.invalid_target=لا يمكنك استهداف ذلك الموقع.
actors.hero.spells.clericspell.invalid_enemy=لا يمكنك استهداف ذلك العدو.
actors.hero.spells.clericspell.charge_cost=تكلفة الشحنة: %d

actors.hero.spells.divinesense.name=الحس الإلهي
actors.hero.spells.divinesense.short_desc=تحصل مؤقتًا على رؤية ذهنية في نطاق واسع.
actors.hero.spells.divinesense.desc=يركز الكاهن حواسه على محيطه، ويحصل على رؤية ذهنية بمدى %d بلاطة لمدة 50 دورًا. ولا تستغرق هذه التعويذة وقتًا لإلقائها.
actors.hero.spells.divinesense$divinesensetracker.name=الحس الإلهي
actors.hero.spells.divinesense$divinesensetracker.desc=تستطيع هذه الشخصية مؤقتًا رؤية المخلوقات القريبة الأخرى بعقلها!\n\nالأدوار المتبقية: %s.

actors.hero.spells.divineintervention.name=التدخل الإلهي
actors.hero.spells.divineintervention.short_desc=تعزيز ضخم للحماية للكاهن وحلفائه.
actors.hero.spells.divineintervention.desc=يسكب الكاهن قدرًا هائلًا من القوة من كتابه على نفسه وعلى حلفائه، مما يعزز الجميع إلى %1$d من الحماية ويمدد الهيئة المتسامية بمقدار %2$d دورًا. وتُوازن القوة الدفاعية الهائلة لهذه التعويذة بتكلفتها المرتفعة جدًا من الشحن.\n\nوكما هو الحال مع الحماية الأخرى التي تمنحها الهيئة المتسامية، لا تتآكل هذه الحماية بالطريقة المعتادة، لكنها تنتهي فور انتهاء الهيئة المتسامية.

actors.hero.spells.flash.name=وميض
actors.hero.spells.flash.prompt=اختر موقعًا
actors.hero.spells.flash.short_desc=ينتقل آنيًا إلى موقع قريب.
actors.hero.spells.flash.desc=يوجه الكاهن هيئته المتسامية نحو موقع قريب وينتقل إليه آنيًا. ويمكن للوميض نقل الكاهن إلى أي موقع مكتشف ضمن المدى وفارغ. وتكلف هذه التعويذة شحنات إضافية من الكتاب في كل مرة تُستخدم فيها ضمن الهيئة المتسامية نفسها.

actors.hero.spells.guidinglight.name=الضوء الهادي
actors.hero.spells.guidinglight.short_desc=يلحق ضررًا سحريًا بعيد المدى ويضمن الإصابة.
actors.hero.spells.guidinglight.desc=يطلق الكاهن مقذوفًا من الطاقة السحرية يصيب هدفًا، ويلحق 2-8 من الضرر وينيره. والهجوم الجسدي التالي غير المعيق الذي يُنفذ ضد عدو مضاء مضمون الإصابة.
actors.hero.spells.guidinglight.desc_priest=_هذه التعويذة أقوى عندما يلقيها الكاهن._ أول إلقاء للتعويذة كل 50 دورًا لا يكلف أي شحنات من الكتاب، وسيُستهلك الإضاءة بواسطة الإشعاع والعصي والشخصيات الأخرى والقطع الأثرية التي تؤثر مباشرة في الأعداء. وعند استخدام الإضاءة بهذه الطريقة، تلحق ضررًا سحريًا إضافيًا يساوي مستوى الكاهن + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=الضوء الهادي
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=سيتمكن الكاهن من إلقاء الضوء الهادي مجانًا مرة أخرى بعد مرور 50 دورًا.\n\nالأدوار المتبقية: %s.
actors.hero.spells.guidinglight$illuminated.name=مضاء
actors.hero.spells.guidinglight$illuminated.desc=تتوهج هذه الشخصية نتيجة إصابتها بالضوء الهادي. ورغم أن التوهج ليس قويًا بما يكفي لإضاءة المنطقة المحيطة، فإن تأثيره السحري سيجعل إصابتها بالضربات أسهل بكثير بالنسبة للكاهن.
actors.hero.spells.guidinglight$illuminated.desc_priest=يمكن للكاهن أيضًا استهلاك الإضاءة باستخدام الإشعاع، أو إطلاق عصا، أو ضربة من حليف، أو تأثيرات بعض القطع الأثرية. وسيؤدي استخدام الإضاءة بهذه الطريقة إلى إلحاق ضرر سحري إضافي يساوي مستوى الكاهن + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=لا يزال بإمكان الأبطال الآخرين استخدام الإضاءة للاستفادة من موهبة الضوء الحارق، لكنهم لن يحصلوا على أي دقة إضافية.

actors.hero.spells.hallowedground.name=أرض مقدسة
actors.hero.spells.hallowedground.prompt=اختر موقعًا
actors.hero.spells.hallowedground.short_desc=تشفي الحلفاء وتبطئ الأعداء وتنشر العشب في مساحة تأثير.
actors.hero.spells.hallowedground.desc=يركز الكاهن سحره الإلهي في الأرض القريبة، منشئًا منطقة مقدسة بمساحة %1$dx%1$d لمدة 20 دورًا.\n\nعند إلقائها، تشفي هذه التعويذة جميع الحلفاء بمقدار 15 من الصحة (ويحصل الحلفاء ذوو الصحة الكاملة والكاهن على حماية)، وتجذّر الأعداء لفترة وجيزة، وتنشر العشب القصير.\n\nتشفي الأرض المقدسة الحلفاء بمقدار 1 من الصحة كل دور (ويحصل الحلفاء ذوو الصحة الكاملة والكاهن على حماية)، وتصيب الأعداء بالإعاقة، وتتسبب عشوائيًا في نمو العشب الطويل.\n\nتُدمَّر الأرض المقدسة بالنار، وستنتج عشبًا ممشطًا إذا كانت تأثيرات التجدد السلبي معطلة أو إذا لم يكتسب الكاهن خبرة منذ فترة.
actors.hero.spells.hallowedground$hallowedterrain.desc=تم تقديس الأرض هنا. تبطئ الأرض المقدسة الأعداء وتشفي الحلفاء وتسبب انتشار العشب.

actors.hero.spells.holyintuition.name=الحدس المقدس
actors.hero.spells.holyintuition.prompt=اختر عنصرًا
actors.hero.spells.holyintuition.cursed=تشعر بسحر خبيث يتربص داخل هذا العنصر.
actors.hero.spells.holyintuition.uncursed=هذا العنصر خالٍ من السحر الخبيث.
actors.hero.spells.holyintuition.short_desc=تحدد ما إذا كان العنصر ملعونًا أم لا.
actors.hero.spells.holyintuition.desc=يركز الكاهن حواسه على عنصر ويحدد ما إذا كان ملعونًا أم لا دون الحاجة إلى تجهيزه.

actors.hero.spells.holylance.name=رمح مقدس
actors.hero.spells.holylance.short_desc=يلحق ضررًا سحريًا بعيد المدى هائلًا.
actors.hero.spells.holylance.desc=يركز الكاهن كمية كبيرة من الطاقة في رمح مدمر مقذوف مصنوع من الضوء. يلحق هذا الرمح %1$d-%2$d من الضرر، ويلحق دائمًا أقصى ضرر ممكن بالأهداف الموتى الأحياء والشياطين.\n\nهذه التعويذة مكلفة جدًا، ولها فترة تهدئة مدتها 30 دورًا.
actors.hero.spells.holylance$lancecooldown.name=فترة تهدئة الرمح المقدس
actors.hero.spells.holylance$lancecooldown.desc=ألقى الكاهن الرمح المقدس مؤخرًا، وعليه الانتظار قبل إلقائه مرة أخرى.\n\nالأدوار المتبقية: %s.

actors.hero.spells.holyward.name=الحارس المقدس
actors.hero.spells.holyward.glyph_name=%s من النور
actors.hero.spells.holyward.glyph_desc=يزيد هذا النقش قليلًا مقدار الضرر الذي يستطيع الدرع حجبه.
actors.hero.spells.holyward.short_desc=يستبدل النقوش مؤقتًا لتعزيز حجب الدرع.
actors.hero.spells.holyward.desc=يشبع الكاهن درعه المرتدى بنقوش من الضوء المقدس، مما يزيد قدرة الدرع على حجب الضرر بمقدار 1. ولا تستغرق هذه التعويذة وقتًا لإلقائها.\n\nيدوم هذا النقش لمدة 50 دورًا، وسيستبدل أي نقش نافع على الدرع طوال هذه المدة. وسيستفيد الكاهن من هذا التأثير حتى إذا لم يكن يرتدي درعًا.
actors.hero.spells.holyward.desc_paladin=_هذه التعويذة أقوى عندما يلقيها البالادين._ تزداد الحماية الإضافية للضرر إلى 3، ولم تعد التعويذة تستبدل النقوش الموجودة، كما أن إلقاء تعاويذ أخرى أثناء نشاط الحارس المقدس سيزيد مدته بمقدار 10 أدوار لكل شحنة تُستخدم.
actors.hero.spells.holyward$holyarmbuff.name=الحارس المقدس
actors.hero.spells.holyward$holyarmbuff.desc=شبع الكاهن درعه المرتدى بالطاقة المقدسة، مما يستبدل مؤقتًا أي نقش موجود ويجعل الدرع يحجب نقطة ضرر إضافية واحدة.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=شبع البالادين درعه المرتدى بالطاقة المقدسة، مما يجعل الدرع يحجب 3 نقاط ضرر إضافية.\n\nسيؤدي إلقاء تعاويذ أخرى أثناء نشاط الحارس المقدس إلى تمديد مدته بمقدار 10 أدوار لكل شحنة تُنفق.\n\nالأدوار المتبقية: %s.

actors.hero.spells.holyweapon.name=سلاح مقدس
actors.hero.spells.holyweapon.ench_name=%s المقدس
actors.hero.spells.holyweapon.ench_desc=يتلقى الأعداء الذين يُضربون بسلاح مقدس ضررًا سحريًا إضافيًا.
actors.hero.spells.holyweapon.short_desc=يستبدل التعويذات مؤقتًا لتعزيز الضرر.
actors.hero.spells.holyweapon.desc=يشبع الكاهن سلاحه المرتدى بالطاقة المقدسة، مما يجعل السلاح يلحق ضررًا سحريًا إضافيًا مقداره 2 في كل مرة يضرب فيها عدوًا. ولا تستغرق هذه التعويذة وقتًا لإلقائها.\n\nتستمر هذه التعويذة لمدة 50 دورًا، وستستبدل أي تعويذة نافعة على السلاح طوال هذه المدة. ويمكن للهجمات غير المسلحة الاستفادة من هذا التأثير أيضًا.
actors.hero.spells.holyweapon.desc_paladin=_هذه التعويذة أقوى عندما يلقيها البالادين._ يزداد الضرر السحري الإضافي إلى 6، ولم تعد التعويذة تستبدل التعويذات الموجودة، كما أن إلقاء تعاويذ أخرى أثناء نشاط السلاح المقدس سيزيد مدته بمقدار 10 أدوار لكل شحنة تُستخدم.
actors.hero.spells.holyweapon$holywepbuff.name=سلاح مقدس
actors.hero.spells.holyweapon$holywepbuff.desc=شبع الكاهن سلاحه المرتدى بالطاقة المقدسة، مما يستبدل مؤقتًا أي تعويذة موجودة ويجعل السلاح يلحق ضررًا سحريًا إضافيًا مقداره 2 في كل هجوم.\n\nالأدوار المتبقية: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=شبع البالادين سلاحه المرتدى بالطاقة المقدسة، مما يجعل هجماته تلحق ضررًا سحريًا إضافيًا مقداره 6.\n\nسيؤدي إلقاء تعاويذ أخرى أثناء نشاط السلاح المقدس إلى تمديد مدته بمقدار 10 أدوار لكل شحنة تُنفق.\n\nالأدوار المتبقية: %s.

actors.hero.spells.judgement.name=الحُكم
actors.hero.spells.judgement.short_desc=يلحق الضرر بجميع الأعداء المرئيين.
actors.hero.spells.judgement.desc=يضرب الكاهن قبضته على الأرض، محدثًا انفجارًا من الضوء يلحق الضرر بجميع الأعداء الذين يستطيع رؤيتهم. يلحق هذا  %1$d-%2$d من الضرر في الأساس، لكنه يلحق أيضًا 33%% من الضرر الإضافي لكل تعويذة ألقاها الكاهن منذ دخوله الهيئة المتسامية (أو منذ آخر مرة ألقى فيها الحُكم).\n\nيلحق الحُكم حاليًا %3$d-%4$d من الضرر.

actors.hero.spells.layonhands.name=وضع اليدين
actors.hero.spells.layonhands.short_desc=يشفي فورًا شخصية ملاصقة أو يمنح البالادين حماية.
actors.hero.spells.layonhands.desc=يوجه البالادين الطاقة المقدسة عبر يديه، فيشفي أو يحمي أي شيء يلمسه.\n\nيمكن للبالادين إلقاء هذه التعويذة على أي شخصية ملاصقة لمنحها %1$d من الشفاء، أو على نفسه للحصول على %1$d من الحماية. ويتحول الشفاء الزائد الناتج عن هذه التعويذة إلى حماية.\n\nتُلقى هذه التعويذة فورًا ويمكن إلقاؤها بشكل متكرر، لكنها لا تستطيع منح حماية تعادل أكثر من ثلاث عمليات إلقاء في الوقت نفسه.

actors.hero.spells.lifelinkspell.name=رابطة الحياة
actors.hero.spells.lifelinkspell.short_desc=تشارك الضرر مع حليف وتقلل الضرر الذي يتلقاه.
actors.hero.spells.lifelinkspell.desc=يقوي الكاهن الرابطة بينه وبين حليفه المعزز. وبفضل هذه الرابطة المعززة، سيتم تقاسم أي ضرر يتلقاه البطل وحليفه لمدة %1$d أدوار، وستزداد زيادة الدفاع التي تمنحها قوة الكثرة إلى -%2$d%% من الضرر المتلقى. لاحظ أن الضرر يُتقاسم بعد الدرع، ولكن قبل تخفيض الضرر الناتج عن قوة الكثرة.\n\nأثناء نشاط هذا التأثير، ستنطبق التعاويذ النافعة للكاهن من المستوى T3 أو أقل على الكاهن وحليفه معًا إذا كانت ستُطبق عادةً على أحدهما فقط.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=حماية رابطة الحياة
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=ألقى الكاهن مؤخرًا رابطة الحياة على هذا الحليف.\n\nبالإضافة إلى الفوائد العادية لرابطة الحياة، يتلقى هذا الحليف أيضًا ضررًا أقل، وتُطبق أي تعاويذ كاهن نافعة عليه وعلى الكاهن بدلًا من أحدهما فقط، ولن تنتهي قوة الكثرة أثناء نشاط هذا التأثير.\n\nالأدوار المتبقية: %s.

actors.hero.spells.mindform.name=شكل العقل
actors.hero.spells.mindform.short_desc=يعيّن الثالوث لعصا أو سلاح مرمي.
actors.hero.spells.mindform.desc=يختار الكاهن عصا أو سلاحًا مرميًا حدده في هذه الجولة ويشبع الثالوث بتأثيره.\n\nعند استخدام الثالوث، يمكن للكاهن تنفيذ هجوم واحد كما لو كان يستخدم العنصر المختار عند +%d. وسيؤدي ذلك إلى تفعيل جميع التأثيرات التي كان استخدام هذا النوع من العناصر سيفعلها عادةً.\n\nتحل هذه التعويذة محل أي تأثير عقلي آخر مشبع به الثالوث حاليًا.

actors.hero.spells.mnemonicprayer.name=صلاة التذكّر
actors.hero.spells.mnemonicprayer.short_desc=تمدد التأثيرات الإيجابية والسلبية على حليف أو عدو، وتعيد تطبيق الإضاءة.
actors.hero.spells.mnemonicprayer.desc=يتلو الكاهن صلاة تمدد مدة جميع التأثيرات الإيجابية أو السلبية على هدف محدد بمقدار %1$d أدوار. ولا تستغرق هذه التعويذة وقتًا لإلقائها. وستدوم التأثيرات الإيجابية مدة أطول على الحلفاء (بما في ذلك الكاهن نفسه)، بينما تدوم التأثيرات الضارة مدة أطول على الأعداء.\n\nلا تستطيع صلاة التذكّر تمديد نسخة محددة من تأثير إيجابي أو سلبي أكثر من مرة، ولا يمكنها تمديد التأثيرات الممنوحة من قدرات الدروع.

actors.hero.spells.radiance.name=إشراق
actors.hero.spells.radiance.short_desc=يضيء الأعداء المرئيين ويصيبهم بالذهول لفترة قصيرة.
actors.hero.spells.radiance.desc=ينفجر الكاهن بالضوء المقدس، فيصيب جميع الأعداء المرئيين بالذهول لمدة 3 أدوار. وإذا كان العدو مضاءً بالفعل، فسيُفعّل الإشراق ضرر الإضاءة الإضافي ثم يطبق عليه التأثير السلبي للإضاءة. كما سيجعل الإشراق الكاهن متوهجًا لمدة 100 دور إذا كان الطابق الحالي مظلمًا.

actors.hero.spells.recallinscription.name=استدعاء النقش
actors.hero.spells.recallinscription.short_desc=يكرر حجر رون أو لفافة استُخدمت مؤخرًا.
actors.hero.spells.recallinscription.desc=يستخدم الكاهن السحر المقدس لإعادة إلقاء تأثير رمز سحري موجود على حجر رون أو لفافة استخدمها خلال آخر %s أدوار.\n\nلا يمكن استخدام استدعاء النقش لتكرار لفائف الترقية. وتختلف تكلفة شحنة هذه التعويذة بحسب العنصر المستخدم مؤخرًا: 2 لحجر رون، و3 للّفافة، و4 للّفافة الغريبة. وتتضاعف هذه التكلفة أيضًا عند تكرار لفافة التحويل، أو عناصر الكيمياء التي يجب صناعتها باستخدام التحويل أو الترقية.
actors.hero.spells.recallinscription$useditemtracker.name=رون مستخدم مؤخرًا
actors.hero.spells.recallinscription$useditemtracker.desc=استخدم الكاهن مؤخرًا عنصرًا يعمل مع تعويذة استدعاء النقش. ويمكن للكاهن إلقاء التعويذة لتكرار تأثير العنصر.\n\nالعنصر المستخدم: %1$s.\n\nالأدوار المتبقية: %2$s.

actors.hero.spells.shieldoflight.name=درع الضوء
actors.hero.spells.shieldoflight.short_desc=يمنح درعًا مؤقتًا ضد هدف.
actors.hero.spells.shieldoflight.desc=ينشئ الكاهن حاجزًا رقيقًا من الضوء بينه وبين عدو، مما يزيد قوة حجب درعه ضد ذلك العدو بمقدار %1$d-%2$d لمدة 5 أدوار.\n\nلا تستغرق هذه التعويذة وقتًا لإلقائها، لكنها لا يمكن استخدامها ضد عدة أهداف في الوقت نفسه.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=درع الضوء
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=يقف درع رقيق من الضوء بين هذه الشخصية وعدو. وهو ليس قويًا بما يكفي لحجب الهجمات بالكامل، لكنه يخفف من حدتها.\n\nالأدوار المتبقية: %s

actors.hero.spells.spiritform.name=شكل الروح
actors.hero.spells.spiritform.short_desc=يعيّن الثالوث لخاتم أو قطعة أثرية.
actors.hero.spells.spiritform.desc=يختار الكاهن خاتمًا أو قطعة أثرية حددها في هذه الجولة (باستثناء الكتاب المقدس) ويشبع الثالوث بتأثيرها.\n\nإذا تم اختيار خاتم، فسيمنح الثالوث تأثير ذلك الخاتم عند +%1$d لمدة 20 دورًا.\n\nإذا تم اختيار قطعة أثرية، فسيكرر الثالوث تأثير تلك القطعة عند +%2$d. ولكل قطعة أثرية سلوك محدد مختلف وتكلفة مختلفة لشحنة الدرع عند استخدامها مع الثالوث.\n\nتحل هذه التعويذة محل أي تأثير روحي آخر مشبع به الثالوث حاليًا.
actors.hero.spells.spiritform$spiritformbuff.name=شكل الروح
actors.hero.spells.spiritform$spiritformbuff.desc=يمنحك شكل الروح للثالوث حاليًا قوة عنصر، كما لو كنت تجهزه.\n\nلاحظ أن شكل الروح لا يستطيع توفير نسخة أخرى من تأثير تستفيد منه بالفعل.\n\nالتأثير الحالي: %1$s.\n\nالأدوار المتبقية: %2$s.

actors.hero.spells.smite.name=الضربة الإلهية
actors.hero.spells.smite.short_desc=تضمن الإصابة مع ضرر إضافي وقوة تعويذة.
actors.hero.spells.smite.desc=يشبع البالادين ضربة قريبة بقوة تدميرية مقدسة.\n\nبالإضافة إلى إلحاق الضرر القريب المعتاد، تضمن الضربة الإلهية إصابة الهجمات غير المعيقة، وتمتلك +300%% من قوة التعويذة، وتلحق %1$d - %2$d من الضرر السحري الإضافي.\n\nيتناسب الضرر السحري الإضافي للضربة الإلهية مع مستوى البالادين، وستلحق دائمًا أقصى ضرر سحري إضافي ضد الأعداء الموتى الأحياء أو الشياطين.

actors.hero.spells.stasis.name=سكون
actors.hero.spells.stasis.short_desc=تزيل الحليف من الزنزانة وتحافظ عليه.
actors.hero.spells.stasis.desc=يركز الكاهن اتصاله بحليفه نحوه، مما يجعل الحليف يُحتجز مؤقتًا في نوع من سكون الطاقة داخل الكاهن. وسيُحفظ الحليف لمدة تصل إلى %d دورًا، مع بقاء جميع التأثيرات الإيجابية عليه دون أن تتأثر بوجوده في السكون.\n\nسيظهر الحليف بجانب الكاهن عند انتهاء السكون طبيعيًا، أو يمكن إعادة إلقاء التعويذة فورًا دون تكلفة لإنهاء التأثير مبكرًا. ويمكن للسكون حتى نقل الحلفاء غير القادرين على الحركة، لكنه لا يستطيع نقلهم بين الطوابق.
actors.hero.spells.stasis$stasisbuff.name=حليف في السكون
actors.hero.spells.stasis$stasisbuff.left_behind=تُترك حليفتك غير القابلة للحركة خلفك.
actors.hero.spells.stasis$stasisbuff.desc=لدى الكاهن حاليًا حليف مخزن في السكون. يتم الحفاظ على جميع التأثيرات الإيجابية على هذا الحليف، بما في ذلك قوة الكثرة، وسيظهر مجددًا بجانب الكاهن عند انتهاء التأثير. ويمكن أيضًا إنهاء التأثير مبكرًا بإعادة إلقاء السكون.\n\nالحليف في السكون: %1$s.\nالأدوار المتبقية: %2$s.

actors.hero.spells.sunray.name=شعاع الشمس
actors.hero.spells.sunray.short_desc=يلحق ضررًا سحريًا بعيد المدى ويصيب الهدف بالعمى مرة واحدة.
actors.hero.spells.sunray.desc=يطلق الكاهن شعاعًا من الضوء المعمي على هدف، ويلحق %1$d-%2$d من الضرر ويصيبه بالعمى لمدة %3$d أدوار. ويلحق شعاع الشمس دائمًا أقصى ضرر بالأهداف الموتى الأحياء والشياطين.\n\nبعد إصابة عدو بهذه التعويذة، ستتأقلم رؤيته، مما يمنعه من الإصابة بالعمى منها مرة أخرى. لكن إذا أُصيب مجددًا أثناء كونه أعمى بسبب هذه التعويذة، فسيكون الضوء طاغيًا عليه ويصيبه بالشلل بدلًا من ذلك.

actors.hero.spells.walloflight.name=جدار الضوء
actors.hero.spells.walloflight.short_desc=ينشئ جدارًا يمنع الأعداء.
actors.hero.spells.walloflight.desc=ينشئ البالادين جدارًا مكوّنًا من ألواح من الضوء الصلب أمامه مباشرةً، بسماكة بلاطة واحدة، وعرض %1$d بلاطات، ويستمر لمدة 20 دورًا.\n\nيعمل هذا الجدار مثل الجدار العادي تمامًا، باستثناء إمكانية الرؤية من خلاله. وسيُصاب الأعداء العالقون داخل الجدار عند إنشائه بالذهول للحظة ويدفعون للخلف إن أمكن. وسيتمكن أي شيء عالق داخل الجدار من الخروج منه.\n\nيمكن إلقاء الجدار في أي من الاتجاهات الأساسية الأربعة أو الاتجاهات القطرية الأربعة. وإذا كان هناك جدار نشط بالفعل، فيمكن إعادة استخدام التعويذة مجانًا لمسحه فورًا.
actors.hero.spells.walloflight.early_end=تبدد جدار الضوء.
actors.hero.spells.walloflight$lightwall.desc=ألواح متلألئة من الضوء تمنع المرور هنا.

