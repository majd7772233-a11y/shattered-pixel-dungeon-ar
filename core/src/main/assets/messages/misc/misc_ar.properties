challenges.no_food.title=حمية غذائية
challenges.no_food=على حمية
challenges.no_food_desc=الطعام نادر أصلًا، لكن عليك أيضًا مراقبة حصصك!\n\n- الطعام وقرن الوفرة أقل فعالية بمقدار الثلث عند إشباع الجوع\n- مصادر الشبع الأخرى لا تتأثر
challenges.no_armor=إيماني هو درعي
challenges.no_armor_desc=ستحتاج إلى الإيمان بنفسك، لأن درعك لن يفيد كثيرًا!\n\n- تم تقليل قوة الحجب الأساسية لجميع الدروع باستثناء القماش\n- جميع الدروع تحصل الآن على حجب ضئيل جدًا عند ترقيتها\n- تم أيضًا تقليل القوة الدفاعية للحارس الترابي بشكل كبير
challenges.no_healing=رُهاب الأدوية
challenges.no_healing_desc=جرعات الشفاء مفيدة جدًا، لكن لسوء الحظ لديك حساسية منها!\n\n- جرعات الشفاء والعناصر التي تستخدم جرعات الشفاء في وصفاتها وثمار الشمس ستسمم البطل بدلًا من شفائه\n- لا يمكن للمشروبات غير المستقرة أن تسمم البطل أو تشفيه عشوائيًا\n- تظل هذه العناصر تعمل بشكل طبيعي مع الشخصيات الأخرى
challenges.no_herbalism=أرض قاحلة
challenges.no_herbalism_desc=يبدو أنه لم يعد هناك ماء نظيف في هذه الزنزانة الملعونة...\n\n- تمت إزالة قطرات الندى\n- تمت إزالة النباتات\n- لا تزال البذور تظهر، لكنها لن تنبت
challenges.swarm_intelligence=ذكاء السرب
challenges.swarm_intelligence_desc=احذر، فوحوش الزنزانة تزداد ذكاءً!\n\n- عندما يلاحظك أحد الأعداء، تنجذب الأعداء القريبة إلى ذلك الموقع
challenges.darkness=إلى الظلام
challenges.darkness_desc=إنها زنزانة بعد كل شيء!\n\n- تم تقليل مسافة الرؤية بشكل كبير\n- تظهر شعلة في كل طابق\n- تصبح مصادر الضوء الأخرى بفعالية تساوي الخُمس
challenges.no_scrolls=الرون المحظور
challenges.no_scrolls_desc=يصعب العثور على رون معين. ولسوء الحظ، فهو دائمًا الأكثر فائدة.\n\n- تمت إزالة نصف لفائف الترقية الموجودة في الزنزانة
challenges.champion_enemies=أبطال معادون
challenges.champion_enemies_desc=لست الوحيد القادر على رفع المستوى!\n\nلدى الأعداء العاديين فرصة قدرها 1/8 للظهور مع تعزيز بطل خاص في الطابق 1، وترتفع إلى 1/6 في الطابق 21.\n\n- يستيقظ الأبطال إذا ظهروا وهم نائمون\n- يعرف البطل متى يظهر بطل معادٍ\n- لا يمكن تحويل الأبطال إلى حلفاء\n\nهناك ستة أنواع من الأعداء الأبطال:\n_ملتهب (برتقالي):_ +25% ضرر اشتباك، يشعل عند الضرب، وينشر اللهب عند الموت، ولا يستطيع إشعال خلايا الماء\n_مُسقِط (أرجواني):_ +25% ضرر اشتباك، +3 إلى مدى الاشتباك\n_مضاد للسحر (أخضر):_ -50% ضرر متلقًى، محصّن ضد التأثيرات السحرية\n_عملاق (أزرق):_ -80% ضرر متلقًى، +1 إلى مدى الاشتباك، لا يستطيع دخول الأنفاق\n_مبارك (أصفر):_ دقة ومراوغة ×4\n_نامٍ (أحمر):_ +20% دقة ومراوغة وضرر ونقاط صحة فعالة. تزداد بنسبة 1% كل 4 أدوار.
challenges.stronger_bosses=زعماء أقوى
challenges.stronger_bosses_desc=الزعماء أصعب بكثير مع هذا التحدي!\n\n_الوحل:_ +20% صحة\n_-_ يزداد الشفاء في الماء تدريجيًا حتى 3 لكل دور\n_-_ يشحن طاقته خلال دور واحد بدلًا من دورين\n_تينغو:_ +25% صحة\n_-_ المرحلة 1: الأفخاخ أكثر فتكًا بكثير\n_-_ المرحلة 2: القدرات أكثر تكرارًا\n_DM-300:_ +33% صحة\n_-_ الأعمدة أقوى ويتم تفعيل 3 منها\n_-_ القدرات أقوى وأكثر تكرارًا\n_-_ يصبح DM-300 أسرع عند الشحن الكامل\n_-_ الأسلاك المكشوفة أكثر شيوعًا بمرتين\n_ملك الأقزام:_ +50% صحة\n_-_ الأتباع أقوى في جميع المراحل\n_-_ المرحلة 1: قدرات واستدعاءات أسرع\n_-_ المرحلة 2: تابعان إضافيان في كل جولة\n_-_ المرحلة 3: ضعف الصحة، واستدعاءات أسرع\n_يوغ-دزيفا:_\n_-_ يتم استدعاء قبضتين في الوقت نفسه!\n_-_ +60% ضرر الليزر\n_-_ أتباع أقوى

