windows.wndblacksmith.prompt=حسنًا، الصفقة صفقة. إليك ما يمكنني فعله من أجلك. أنا أتعامل فقط مع العناصر المعروفة وغير الملعونة.\n\n_المعروف الحالي: %d_
windows.wndblacksmith.pickaxe=_الفأس (%d معروف):_ أظن أنني أستطيع إعادة الفأس إليك إذا أردت. لدي الكثير منها.
windows.wndblacksmith.pickaxe_verify=هل أنت متأكد أنك تريد هذا الشيء العجوز؟ الصخور هنا ليست لينة كما في المنجم، لذا لن تتمكن من الحفر به بعد الآن.
windows.wndblacksmith.pickaxe_free=إيه، لقد أبليت بلاءً حسنًا، سأعطيك إياه مجانًا.
windows.wndblacksmith.pickaxe_yes=نعم، أريده.
windows.wndblacksmith.pickaxe_no=انسَ الأمر.
windows.wndblacksmith.reforge=_إعادة الصياغة (%d معروف):_ يمكنني إعادة صياغة عنصرين من النوع نفسه وتحويلهما إلى عنصر واحد بجودة أعلى.
windows.wndblacksmith.harden=_تقوية (%d معروف):_ يمكنني تقوية سلاح أو درع، مما يجعل الاحتفاظ بالتعويذة أو النقش عليه أسهل.
windows.wndblacksmith.upgrade=_ترقية (%d معروف):_ إذا كان لديك عنصر أقل من +2، يمكنني ترقيته لك.
windows.wndblacksmith.smith=_صياغة (%d معروف):_ يمكنني محاولة صنع سلاح أو درع لك من الصفر. سيكون من رتبة أعلى، وعلى الأرجح سيكون مُرقّى، وستتمكن من اختيار بعض خصائصه.
windows.wndblacksmith.smith_verify=حسنًا، سأجعل الفرن ساخنًا ويمكنك بعدها اختيار ما تريد.
windows.wndblacksmith.smith_yes=حسنًا، أشعل الفرن.
windows.wndblacksmith.smith_no=انسَ الأمر.
windows.wndblacksmith.cashout=_استبدال كل المعروف:_ يمكنني ببساطة أن أعطيك بعض الذهب العادي الموجود لدي هنا. قطعة واحدة مقابل كل نقطة من المعروف.
windows.wndblacksmith.cashout_verify=حسنًا، إذًا هذا %d ذهب. لكنني لن أقوم بأي عمل آخر من أجلك بعد هذا!
windows.wndblacksmith.cashout_yes=أعطني الذهب.
windows.wndblacksmith.cashout_no=انسَ الأمر.
windows.wndblacksmith$wndreforge.message=حسنًا، يمكنني إعادة صياغة عنصرين معروفين من النوع نفسه. سيتم تدمير الأضعف لمنح الأقوى ترقية. وإذا كان مستواهما متساويًا، فسأحتفظ بالعنصر الموجود على اليسار.
