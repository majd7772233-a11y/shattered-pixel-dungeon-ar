scenes.titlescene$changesbutton.title=يتوفر تحديث!
scenes.titlescene$changesbutton.versioned_title=يتوفر تحديث: %s
scenes.titlescene$changesbutton.desc=يتم تحديث Shattered Pixel Dungeon بانتظام مع إعادة تصميم لمحتوى اللعبة الحالي، أو إضافة محتوى جديد بالكامل!\n\nكما يتم تحسين توازن اللعبة باستمرار في التحديثات، حتى لا تكون عناصر أو أبطال أو أعداء محددون أقوى أو أضعف من اللازم.\n\nتتضمن التحديثات أيضًا إصلاحات للأخطاء وتحسينات متنوعة أخرى للاستقرار.
scenes.titlescene$changesbutton.update=الانتقال إلى صفحة التحديث
scenes.titlescene$changesbutton.changes=شاشة التغييرات الحالية
scenes.titlescene.patreon_body=Shattered Pixel Dungeon لعبة مجانية بالكامل، وهذا يعني أنني أعتمد على دعم اللاعبين الكرماء حتى أتمكن من الاستمرار في تطويرها.\n\nإذا كنت مهتمًا بدعمي، فأفضل طريقة للقيام بذلك هي عبر Patreon. يمنحني Patreon مصدر دخل ثابتًا، ويسمح لي بتقديم شيء في المقابل لأولئك الذين يدعمونني!\n\nيحصل الداعمون على تدوينات حصرية كل أسبوع تخبرهم بما أعمل عليه قبل أي شخص آخر!\n\nيمكنك إلقاء نظرة على صفحة Patreon الخاصة بي لمعرفة أحدث المعلومات حول المزايا. شكرًا لاهتمامك!\n\n(مكافآت Patreon متاحة باللغة الإنجليزية فقط)
scenes.titlescene.patreon_button=صفحة Patreon

scenes.welcomescene.update_intro=تم تحديث Shattered Pixel Dungeon!
scenes.welcomescene.update_msg=يتضمن الإصدار v3.3 منطقة اختبار لإعادة تصميم مهمة المدينة القادمة، وعناصر جديدة، ومجموعة من التعديلات والتحسينات الصغيرة.
scenes.welcomescene.patch_intro=تم إصدار تصحيح لـ Shattered Pixel Dungeon!
scenes.welcomescene.patch_bugfixes=يحتوي هذا التصحيح على إصلاحات للأخطاء.
scenes.welcomescene.patch_translations=يحتوي هذا التصحيح على تحديثات للترجمة.
scenes.welcomescene.patch_balance=يحتوي هذا التصحيح على تعديلات على توازن اللعبة.
scenes.welcomescene.patch_msg=يحتوي هذا التصحيح أيضًا على بعض التعديلات الصغيرة وتحسينات في الأداء.
scenes.welcomescene.what_msg=يبدو أن ملفات الحفظ الحالية لديك قادمة من إصدار مستقبلي من Shattered Pixel Dungeon!\n\nتحرك بحذر! قد تحتوي ملفات الحفظ الخاصة بك على أشياء غير موجودة في هذا الإصدار، وقد يتسبب ذلك في ظهور أخطاء غريبة جدًا.
scenes.welcomescene.lang_warning_title=ترجمة غير مكتملة
scenes.welcomescene.lang_warning_msg=لم تتم ترجمة بعض المحتويات الجديدة من هذا التحديث بعد.\n\nقد تظهر بعض العبارات باللغة الإنجليزية.\n\nتعمل فرق الترجمة على حل هذه المشكلة، ومن المفترض أن تتم إضافة ترجمة كاملة في تصحيح قريب.\n\nشكرًا لصبرك.
scenes.welcomescene.continue=متابعة
scenes.welcomescene.changelist=قائمة التغييرات
scenes.welcomescene.save_warning=تمت مقاطعة Shattered Pixel Dungeon مؤخرًا أثناء محاولة حفظ بيانات لعبتك. تحتوي اللعبة على وسائل حماية مدمجة ضد ذلك، لذا من المفترض أن تكون بيانات لعبتك سليمة.\n\nيحدث هذا عادةً عندما يفقد جهازك الطاقة فجأة، أو عندما يقوم بإيقاف Shattered دون السماح لها بالإغلاق بشكل صحيح. يمكن لميزات توفير البطارية أن تسبب هذا كثيرًا على الأجهزة المحمولة. وقد تساعد إعادة تشغيل جهازك أيضًا إذا كنت ترى هذا الخطأ بشكل متكرر.
scenes.welcomescene.controller_title=التحكم بواسطة يد التحكم
scenes.welcomescene.controller_body=تلعب باستخدام يد تحكم؟ استخدم العصا اليمنى للتحكم في المؤشر الظاهر على الشاشة.\n\nاضغط RT/R2 أو العصا اليمنى للاختيار باستخدام المؤشر.
scenes.welcomescene.controller_okay=حسنًا
