scenes.heroselectscene.daily=اللعبة اليومية
scenes.heroselectscene.daily_desc=تتوفر كل يوم لعبة جديدة تكون متطابقة للجميع! تقوم هذه «اللعبة اليومية» بإنشاء الزنزانة نفسها لكل شخص يلعبها (بشرط أن يكونوا يلعبون الإصدار نفسه من اللعبة).\n\nيمكنك أخذ الوقت الذي تريده لإكمال اللعبة اليومية، لكن لا يمكنك امتلاك أكثر من لعبة يومية نشطة في الوقت نفسه. _الألعاب اليومية لا تمنح شارات ولها صفحة تصنيفات منفصلة خاصة بها._\n\nهل تريد بدء لعبة اليوم باستخدام بطلك وتحدياتك المحددة حاليًا؟
scenes.heroselectscene.daily_yes=نعم
scenes.heroselectscene.daily_no=لا
scenes.heroselectscene.daily_repeat=لقد لعبت لعبة اليوم بالفعل. يمكنك إعادة لعبها إن أردت، ولكن كلعبة تدريبية غير مصنفة فقط.\n\nبعد إكمال الإعادة، ستتمكن من عرضها من نافذة تصنيفات اللعبة اليومية لفترة قصيرة قبل حذف السجل.\n\nهل تريد إعادة لعب لعبة اليوم باستخدام بطلك وتحدياتك المحددة حاليًا؟
scenes.heroselectscene.daily_unavailable_long=يبدو أنك بدأت لعبة يومية موجودة في المستقبل! قد يحدث هذا إذا غيّرت منطقتك الزمنية مؤخرًا، أو إذا غيّرت ساعة نظامك. _ستتوفر لعبتك اليومية التالية بعد %d أيام._
scenes.heroselectscene.daily_existing=لديك بالفعل لعبة يومية قيد التقدم. يجب إنهاء تلك اللعبة قبل بدء لعبة يومية أخرى.
scenes.heroselectscene.daily_nowin=تتوفر كل يوم لعبة جديدة تكون متطابقة للجميع! تقوم هذه «اللعبة اليومية» بإنشاء الزنزانة نفسها لكل شخص يلعبها (بشرط أن يكونوا يلعبون الإصدار نفسه من اللعبة).\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من لعب الألعاب اليومية._
scenes.heroselectscene.custom_seed_title=أدخل بذرة مخصصة
scenes.heroselectscene.custom_seed_desc=تستخدم اللعبة رمز بذرة لإنشاء الزنزانة، ودائمًا ما تنتج البذرة نفسها مع إصدار اللعبة نفسه الزنزانة نفسها! _ألعاب البذور المخصصة لا تمنح شارات ولا تُحتسب ضمن عدد الألعاب التي لعبتها، وتظهر في أسفل صفحة التصنيفات._
scenes.heroselectscene.custom_seed_duplicate=لديك بالفعل لعبة عادية قيد التقدم باستخدام تلك البذرة. يجب إنهاء تلك اللعبة قبل استخدام هذه البذرة المخصصة.
scenes.heroselectscene.custom_seed_nowin=تستخدم اللعبة رمز بذرة لإنشاء الزنزانة، ودائمًا ما تنتج البذرة نفسها مع إصدار اللعبة نفسه الزنزانة نفسها!\n\n_يجب أن تفوز بلعبة واحدة على الأقل قبل أن تتمكن من إدخال بذور مخصصة._
