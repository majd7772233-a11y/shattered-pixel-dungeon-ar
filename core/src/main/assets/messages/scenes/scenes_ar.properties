scenes.supporterscene.title=ادعم اللعبة
scenes.supporterscene.intro=أريد أن تبقى Shattered Pixel Dungeon خالية من الإعلانات والمعاملات المصغرة المتطفلة، والتي تفسد الكثير من الألعاب المجانية. وبدلًا من ذلك، أفضل أن أطلب من اللاعبين دعم اللعبة مباشرة!
scenes.supporterscene.patreon_msg=إذا كنت تستمتع بـ Shattered وتريد مساعدتي على الاستمرار في تطويرها، يرجى التفكير في دعمي عبر _Patreon!_ يقدم Patreon مجموعة من المزايا الحصرية!:\n_- وصول مبكر_ إلى الإصدارات التجريبية من التحديثات المستقبلية.\n_- مدونات أسبوعية قصيرة_ تحتوي على معلومات حول ما أعمل عليه.\n_- استطلاعات شهرية_ تؤثر مباشرةً في المحتوى الذي أعمل على تطويره.\n_- شارات مكافأة مادية_ بعد سنة وسنتين وثلاث سنوات من الدعم.\n_- خادم Discord للمجتمع_ مع قنوات لسجل التطوير والدردشة.\n\n_والمزيد!_ يمكنك زيارة صفحة Patreon لمزيد من المعلومات. شكرًا لوقتك، ونتمنى لك استكشافًا ممتعًا للزنزانات!
scenes.supporterscene.patreon_english=(لاحظ أن مكافآت Patreon متاحة باللغة الإنجليزية فقط.)
